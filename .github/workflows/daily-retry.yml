name: Daily Build Health
on:
  workflow_run:
    workflows: ["Daily News Build"]
    types: [completed]
permissions:
  contents: read
jobs:
  report:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::warning::日报生成失败，请查看来源状态与模型错误。后续工作日定时重试会继续；不占用 runner 等待一小时。"
