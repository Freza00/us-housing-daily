name: Monthly Digest Build
on:
  schedule:
    - cron: '30 6 * * 1'
    - cron: '0 8,9 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild an existing issue on a working day
        type: boolean
        default: false
  repository_dispatch:
    types: [monthly-build]
permissions:
  contents: write
concurrency:
  group: news-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_RUN: ${{ inputs.force && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Calendar and complete-issue guard
        id: gate
        run: node scripts/can-run.mjs monthly
      - name: Restore acquisition and model checkpoints
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            state/source-cache.json
            state/collection-cache.json
            state/llm-cache/
          key: news-v4-${{ hashFiles('config/sources.json', 'scripts/lib/sources.mjs') }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: news-v4-${{ hashFiles('config/sources.json', 'scripts/lib/sources.mjs') }}-${{ runner.os }}-
      - name: Ensure PDF text extraction
        if: steps.gate.outputs.go == 'true'
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
      - name: Validate pipeline
        if: steps.gate.outputs.go == 'true'
        run: npm test
      - name: Build monthly
        if: steps.gate.outputs.go == 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: node scripts/build-monthly.mjs
      - name: Preserve checkpoints even after a failed model stage
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            state/source-cache.json
            state/collection-cache.json
            state/llm-cache/
          key: news-v4-${{ hashFiles('config/sources.json', 'scripts/lib/sources.mjs') }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish generated files
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "Freza00"
          git config user.email "Freza00@users.noreply.github.com"
          git add data/ state/ public/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: 更新月度研究摘要及采集诊断"
            git push
          fi
      - name: Preserve failed-run acquisition evidence
        if: failure() && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: news-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state/collection-checkpoint.json
            state/collection-cache.json
            state/inputs/
            state/snapshots/
            state/llm-diagnostics/
          retention-days: 14
          if-no-files-found: ignore
      - name: Preserve model attempt diagnostics
        if: always() && steps.gate.outputs.go == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: news-llm-monthly-${{ github.run_id }}-${{ github.run_attempt }}
          path: state/llm-diagnostics/
          retention-days: 14
          if-no-files-found: ignore
