name: Monthly Digest Build

# 每周一北京 10:30 (UTC 02:30) 是发布主时间点。三条独立路径同时兜底：
#   1. GH schedule '30 2 * * 1'   主时间点
#   2. Vercel Cron → repository_dispatch  同一时刻并发 (见 vercel.json)
#   3. GH schedule 3 次小时级 retry
# build-monthly.mjs 内部 isFirstMondayOfMonth 守卫：非当月第一个周一时脚本自行退出 0，
# 不写文件 → git diff --cached --quiet → "no changes to commit" 干净 no-op。
# 当月第一个周一 commit 了 data/monthly/<period_label>.json 之后，后续 fire 被 dedupe step no-op 掉。
on:
  schedule:
    - cron: '30 2 * * 1'       # 北京 10:30 — 主时间点（和 Vercel Cron 同时）
    - cron: '0 4,5,6 * * 1'    # 北京 12:00 / 13:00 / 14:00 — retry trio
  workflow_dispatch: {}
  repository_dispatch:
    types: [monthly-build]   # 由 Vercel Cron 通过 GH dispatches API 触发
  push:
    branches: [main]
    paths:
      - 'scripts/build-monthly.mjs'
      - 'scripts/lib/digest-core.mjs'
      - 'scripts/lib/dates.mjs'
      - '.github/workflows/monthly.yml'

permissions:
  contents: write

concurrency:
  group: monthly-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Compute ET period_label + dedupe check
        id: period
        run: |
          TODAY_BJ=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          echo "today_bj=${TODAY_BJ}" >> "$GITHUB_OUTPUT"
          # period_label = YYYY-MM of the prior calendar month. Use dates.mjs helper.
          PERIOD_LABEL=$(node --input-type=module -e \
            "import('./scripts/lib/dates.mjs').then(m => console.log(m.etMonthBounds(new Date()).label));")
          echo "period_label=${PERIOD_LABEL}" >> "$GITHUB_OUTPUT"
          if [ -f "data/monthly/${PERIOD_LABEL}.json" ]; then
            echo "already_built=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::data/monthly/${PERIOD_LABEL}.json 已存在，跳过 pipeline"
          else
            echo "already_built=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Building::data/monthly/${PERIOD_LABEL}.json 不存在，跑 pipeline"
          fi

      - name: Run monthly pipeline
        if: steps.period.outputs.already_built == 'false'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: node scripts/build-monthly.mjs

      - name: Commit
        if: steps.period.outputs.already_built == 'false'
        env:
          TODAY_BJ: ${{ steps.period.outputs.today_bj }}
          PERIOD_LABEL: ${{ steps.period.outputs.period_label }}
        run: |
          git config user.name "Freza00"
          git config user.email "Freza00@users.noreply.github.com"
          git add data/monthly/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: monthly digest for ${PERIOD_LABEL} (built ${TODAY_BJ})"
            git push
          fi
