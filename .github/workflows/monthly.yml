name: Monthly Digest Build
on:
  schedule:
    - cron: '30 6 * * 1'
    - cron: '0 8,9 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild an existing issue on a working day
        type: boolean
        default: false
      revision:
        description: Resume this frozen revision (empty selects latest)
        type: string
      period:
        description: Expected current period key (optional safety check)
        type: string
      cutoff:
        description: Expected fixed cutoff in epoch milliseconds (optional)
        type: string
  repository_dispatch:
    types: [monthly-build]
permissions:
  contents: write
  actions: read
concurrency:
  group: news-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_RUN: ${{ inputs.force && '1' || '0' }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      ISSUE_REVISION: ${{ inputs.revision || github.event.client_payload.revision || '' }}
      EXPECTED_PERIOD: ${{ inputs.period || github.event.client_payload.period || '' }}
      EXPECTED_CUTOFF: ${{ inputs.cutoff || github.event.client_payload.cutoff || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Calendar and complete-issue guard
        id: gate
        run: node scripts/can-run.mjs monthly
      - name: Restore acquisition and model checkpoints
        continue-on-error: true
        timeout-minutes: 1
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            state/source-cache.json
            state/collection-cache.json
            state/llm-cache/
          key: news-v4-${{ hashFiles('config/sources.json', 'scripts/lib/sources.mjs') }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: news-v4-${{ hashFiles('config/sources.json', 'scripts/lib/sources.mjs') }}-${{ runner.os }}-
      - name: Restore frozen issue stages
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-issue.mjs monthly
      - name: Ensure PDF text extraction
        if: steps.gate.outputs.go == 'true'
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
      - name: Validate pipeline
        if: steps.gate.outputs.go == 'true'
        run: npm test
      - name: Freeze issue input
        id: prepared
        if: steps.gate.outputs.go == 'true'
        env:
          PIPELINE_UNTIL: prepared
        run: node scripts/build-monthly.mjs
      - name: Save prepared issue
        if: always() && steps.prepared.outputs.issue_dir != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: news-issue-monthly-${{ steps.prepared.outputs.period }}-r${{ steps.prepared.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}-prepared
          path: ${{ steps.prepared.outputs.issue_dir }}/
          retention-days: 14
      - name: Select frozen issue
        id: editor
        if: steps.gate.outputs.go == 'true' && steps.prepared.outputs.issue_dir != ''
        env:
          PIPELINE_UNTIL: editor
          ISSUE_REVISION: ${{ steps.prepared.outputs.revision || env.ISSUE_REVISION }}
          EXPECTED_PERIOD: ${{ steps.prepared.outputs.period || env.EXPECTED_PERIOD }}
          EXPECTED_CUTOFF: ${{ steps.prepared.outputs.cutoff || env.EXPECTED_CUTOFF }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
        run: node scripts/build-monthly.mjs
      - name: Save editorial progress
        if: always() && steps.editor.outcome == 'success' && steps.prepared.outputs.issue_dir != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: news-issue-monthly-${{ steps.prepared.outputs.period }}-r${{ steps.prepared.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}-editor
          path: ${{ steps.prepared.outputs.issue_dir }}/
          retention-days: 14
      - name: Write and validate frozen issue
        id: writer
        if: steps.gate.outputs.go == 'true' && steps.prepared.outputs.issue_dir != ''
        env:
          PIPELINE_UNTIL: ready
          ISSUE_REVISION: ${{ steps.prepared.outputs.revision || env.ISSUE_REVISION }}
          EXPECTED_PERIOD: ${{ steps.prepared.outputs.period || env.EXPECTED_PERIOD }}
          EXPECTED_CUTOFF: ${{ steps.prepared.outputs.cutoff || env.EXPECTED_CUTOFF }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
        run: node scripts/build-monthly.mjs
      - name: Save validated cards and publication candidate
        if: always() && steps.prepared.outputs.issue_dir != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: news-issue-monthly-${{ steps.prepared.outputs.period }}-r${{ steps.prepared.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}-writer
          path: ${{ steps.prepared.outputs.issue_dir }}/
          retention-days: 14
      - name: Publish candidate and verify production
        if: steps.gate.outputs.verify == 'true'
        env:
          ISSUE_REVISION: ${{ steps.prepared.outputs.revision || env.ISSUE_REVISION }}
          EXPECTED_PERIOD: ${{ steps.prepared.outputs.period || env.EXPECTED_PERIOD }}
          EXPECTED_CUTOFF: ${{ steps.prepared.outputs.cutoff || env.EXPECTED_CUTOFF }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs monthly --push
      - name: Save delivery receipt
        if: always() && steps.gate.outputs.verify == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: news-delivery-monthly-${{ github.run_id }}-${{ github.run_attempt }}
          path: state/delivery-receipts/
          retention-days: 14
          if-no-files-found: ignore
      - name: Preserve acquisition and model caches
        if: always() && steps.gate.outputs.go == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@v6
        with:
          path: |
            state/source-cache.json
            state/collection-cache.json
            state/llm-cache/
          key: news-v4-${{ hashFiles('config/sources.json', 'scripts/lib/sources.mjs') }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve failed-run acquisition evidence
        if: failure() && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: news-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state/collection-checkpoint.json
            state/collection-cache.json
            state/inputs/
            state/snapshots/
            state/llm-diagnostics/
          retention-days: 14
          if-no-files-found: ignore
      - name: Preserve model attempt diagnostics
        if: always() && steps.gate.outputs.go == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: news-llm-monthly-${{ github.run_id }}-${{ github.run_attempt }}
          path: state/llm-diagnostics/
          retention-days: 14
          if-no-files-found: ignore
