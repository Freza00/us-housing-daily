name: Daily News Build

# GitHub Actions schedule 是 best-effort（实测今早迟到 3.5 小时，昨天直接被 skip），
# 所以排 5 个 cron 点 + 跑前检查"今天 build 过没"，跑过就 fast-skip，没跑就补打。
# 任意一个 cron 点活下来都能保住当天的发布。
on:
  schedule:
    - cron: '57 0 * * *'    # UTC 00:57 = 北京 08:57 — 主时间点
    - cron: '57 2 * * *'    # UTC 02:57 = 北京 10:57 — 补打 1
    - cron: '57 4 * * *'    # UTC 04:57 = 北京 12:57 — 补打 2
    - cron: '57 6 * * *'    # UTC 06:57 = 北京 14:57 — 补打 3
    - cron: '57 9 * * *'    # UTC 09:57 = 北京 17:57 — 补打 4，最后兜底
  workflow_dispatch: {}
  repository_dispatch:
    types: [daily-build]   # 由 Vercel Cron 通过 GH dispatches API 触发（GH_PAT 配好后激活）
  push:
    branches: [main]
    paths:
      - 'config/sources.json'
      - '.github/workflows/daily.yml'
      - 'scripts/build.mjs'

permissions:
  contents: write   # 需要 commit data/ + state/

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check if today's build already exists
        id: dedupe
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          echo "today_bj=${TODAY}" >> "$GITHUB_OUTPUT"
          if [ -f "data/${TODAY}.json" ]; then
            echo "already_built=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::data/${TODAY}.json 已存在，跳过 pipeline（同日补打 cron 自动 no-op）"
          else
            echo "already_built=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Building::data/${TODAY}.json 不存在，跑 pipeline"
          fi

      - uses: actions/setup-node@v5
        if: steps.dedupe.outputs.already_built == 'false'
        with:
          node-version: '20'

      - name: Run pipeline (fetch + score + enrich + LLM summarize)
        if: steps.dedupe.outputs.already_built == 'false'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          WRITER_MODE: global
        run: node scripts/build.mjs

      - name: Commit data files
        if: steps.dedupe.outputs.already_built == 'false'
        env:
          TODAY_BJ: ${{ steps.dedupe.outputs.today_bj }}
        run: |
          git config user.name "Freza00"
          git config user.email "Freza00@users.noreply.github.com"
          git add data/ state/ public/index.html
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: daily build for ${TODAY_BJ}"
            git push
          fi
