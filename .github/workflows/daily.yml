name: Daily News Build

# 北京 08:57 是发布主时间点。三条独立路径同时兜底：
#   1. GH schedule '57 0 * * *'         主时间点（GH best-effort，可能 skip / 迟到几小时）
#   2. Vercel Cron → repository_dispatch  同一时刻并发，不同 infra 平行兜底（见 vercel.json）
#   3. GH schedule 3 次小时级 retry      上面两条都挂时的最后一道防线
# 任何一路 commit 了 data/<今天>.json 之后，剩余 fire 都会被 dedupe step 5s no-op 掉。
on:
  schedule:
    - cron: '57 0 * * *'        # UTC 00:57 = 北京 08:57 — 主时间点（和 Vercel Cron 同时）
    - cron: '27 1,2,3 * * *'    # 北京 09:27 / 10:27 / 11:27 — 主路径都挂时兜底
  workflow_dispatch: {}
  repository_dispatch:
    types: [daily-build]   # 由 Vercel Cron 通过 GH dispatches API 触发
  push:
    branches: [main]
    paths:
      - 'config/sources.json'
      - '.github/workflows/daily.yml'
      - 'scripts/build.mjs'

permissions:
  contents: write   # 需要 commit data/ + state/

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check if today's build already exists
        id: dedupe
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          echo "today_bj=${TODAY}" >> "$GITHUB_OUTPUT"
          if [ -f "data/${TODAY}.json" ]; then
            echo "already_built=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::data/${TODAY}.json 已存在，跳过 pipeline（同日补打 cron 自动 no-op）"
          else
            echo "already_built=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Building::data/${TODAY}.json 不存在，跑 pipeline"
          fi

      - uses: actions/setup-node@v5
        if: steps.dedupe.outputs.already_built == 'false'
        with:
          node-version: '20'

      - name: Run pipeline (fetch + score + enrich + LLM summarize)
        if: steps.dedupe.outputs.already_built == 'false'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          WRITER_MODE: global
        run: node scripts/build.mjs

      - name: Commit data files
        if: steps.dedupe.outputs.already_built == 'false'
        env:
          TODAY_BJ: ${{ steps.dedupe.outputs.today_bj }}
        run: |
          git config user.name "Freza00"
          git config user.email "Freza00@users.noreply.github.com"
          git add data/ state/ public/index.html
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: daily build for ${TODAY_BJ}"
            git push
          fi
