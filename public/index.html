ve units or more was 529,000, per the report. That’s a 14.3% increase from March and a 23.3% increase from April 2025. The multifamily segment had the strongest construction performance in April: The rate of multifamily project starts increased by a greater percentage last month than single-family, and outpaced new housing construction overall. Dive Insight: Total privately-owned housing starts stood at a rate of 1,465,000 in April, down 2.8% from March but up 4.6% from the same period last year. Meanwhile, single-family housing starts in April dipped to 930,000, which is 9% below the revised March figure of 1,022,000 and down 2.4% year over year. The West far outperformed other regions on a yearly basis, with a 49% YOY increase in overall housing starts. The Midwest fell the most, with starts down 9.6% YOY. The South and Northeast also both decreased 3.2% from the same period last year. Multifamily building permits, which signal future construction activity, rose in April to 514,000, a 22.7% MOM increase and an uptick of 11.5% YOY, according to the release. Overall, housing construction permits stood at 1,442,000, 5.8% higher than March but down 0.2% year over year. The Midwest had the strongest permit gains on a year-over-year basis, growing 17.2% from April 2025, while the West dropped the most, down 9.7% YOY. Multifamily project completions stood at a seasonally adjusted rate of 529,000, up 6.4% year over year and 16.5% from March. Nonetheless, there are signs that the building boom is slowing. In recent earnings calls, REIT leaders said although they are still contending with supply-driven pressure — particularly in high-growth areas — they are starting to see high levels of supply burn off, and expect the tighter apartment market to provide a boost as the year progresses. For example, Camden Executive Chairman of the Board and former CEO Ric Campo said in a May 1 earnings call that, “ New supply has peaked and has been cut in half in most of our markets. First-quarter apartment net absorption was one of the best since 2016, despite slow job growth and tepid consumer sentiment.” Meanwhile, Mid-America Apartment Communities leaders saw absorption outpace supply in the first quarter , and expect that trend to continue as new construction slows, while Essex said it benefited from “historical low” multifamily permitting activity in California in Q1. High levels of apartment supply are lingering in the Sun Belt, UDR’s Chief Operating Officer Mike Lacy said on a Q1 earnings call, but he expects that to ease as the year progresses. AvalonBay leaders said lower levels of supply and reduced concessions are expected to be its main performance drivers in the second half of the year. Click here to sign up to receive multifamily and apartment news like this article in your inbox every weekday. Recommended Reading Multifamily project starts declined further in Q1: CoStar By Julie Strupp &#8226; May 19, 2026 Multifamily housing starts rose in March, but permits fell By Julie Strupp &#8226; April 29, 2026 Add us on Google Share Copy link Email LinkedIn X/Twitter Facebook Print purchase licensing rights Filed Under: Development","published_at":1779461640000,"score":33,"tags":["multifamily","national","data","construction","regulator"],"heat_signals":["sun belt","housing starts","permits","trend"," yoy","year over year","year-over-year","housing starts"],"importance":4,"selector_reason":"HUD和Census最新数据显示4月多户开工继续上升，直接影响全国租赁供给和开发周期判断。作为全国性建设数据，重要性高于普通项目新闻，但未达到Fed或CPI级别，因此评为4。","section":"national","title_zh":"April multifamily starts 再度回升","summary_zh":"5+ units 年化529K，环比+14.3%、YoY+23.3%，供应端加速","impact":"long-pos","id":"78bb3f4b","fetched_at":1779504930267},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Judge orders MRED to restore Zillow listing feeds in Chicago","link":"https://www.housingwire.com/articles/judge-restores-zillow-mred-feeds/","description":"Chicagoland area listings are back on Zillow and Trulia as of Friday afternoon, after Chicago-based federal Judge John Tharp, Jr. granted in part Zillow’s preliminary injunction motion seeking to prevent Midwest Real Estate Data (MRED) from suspending its listing feeds. On Monday, Zillow filed the motion in its antitrust lawsuit against MRED and Compass International Holdings , after MRED notified it that the MLS would suspend its listing feeds unless Zillow cured what the MLS called a “material breach of its license agreements” by late Tuesday. On Wednesday morning, MRED announced that it had suspended Zillow’s listing feed . On Thursday, Zillow filed an motion for a temporary restraining order echoing its preliminary injunction motion requesting emergency relief regarding MRED&#8217;s listing feed. According to MRED, this dispute centered on Zillow’s selective removal of nine listings that the MLS maintained were being marketed lawfully under its rules. Zillow told HousingWire that none of these nine listings are in MRED’s traditional Chicagoland service area. According to the announcement, Zillow’s stance prompted MRED to shut off a feed covering roughly 43,000 active listings, or 99.98% of the MLS’s inventory, from the portal’s consumer-facing platforms. The Illinois-based MLS said that it notified Zillow two weeks ago that selectively excluding listings from participating brokers violated Zillow’s license agreements with the MLS. MRED gave Zillow until 11:59 p.m. Central time on May 19, 2026, to fix the issue. Zillow did not do so, the MLS said. In an emailed statement, a Zillow spokesperson told HousingWire, that the ruling on its motion was “an important first step for the Chicago home buyers, sellers and agents who have been harmed by a coordinated scheme between MRED and Compass to reduce transparency in the housing market.” “In the middle of a housing affordability crisis, powerful industry players colluded to hide listings,
