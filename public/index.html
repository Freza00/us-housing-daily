ading to arbitration, Tharp made the decision to stay the entire case in order to prevent inconsistent rulings. “To say that the factual and legal issues underlying Zillow’s claims against Compass therefore substantially overlap with those that will be resolved in arbitration is an understatement — MRED and Compass are alleged to be coconspirators, and all of the conduct Compass is alleged to have undertaken will unquestionably be at issue in the arbitration of Zillow’s claims against MRED,” Tharp wrote in his ruling. “What’s more, Zillow has no other claim against Compass that could be resolved without duplicating the work being done in the arbitration hearing.” “I think the judge felt like the claims against MRED and Compass were so intertwined that if the judge continued the federal lawsuit, there may be rulings that are inconsistent with the arbitration, so he used his discretion to stay the case,” said Brad Weber, a partner at Troutman Pepper Locke . Now that the claims are headed to arbitration, legal experts told HousingWire that it&#8217;s unlikely much, if any, information comes out regarding the proceedings. “Arbitrations, for the most part, are private,” Weber said, “There will be no public filings, but companies may issue press releases if they win some big issue in arbitration, but you won’t be able to read the finer points of an order or something with arbitration.” Closed doors Given that Tharp granted MRED’s motion to compel arbitration, Weber was not surprised that he denied Zillow’s preliminary injunction. In order to win a preliminary injunction motion, the plaintiff must show that it&#8217;s likely to win its case if the suit goes to trial. “I think because the court granted the motion to compel arbitration, that made it even more likely that the court would deny this preliminary injunction,&#8221; Weber explained, &#8220;because now that the suit is going in front of an arbitrator, if I were the judge, I would want an even higher standard met in
