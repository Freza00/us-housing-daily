nancing","event_evidence_id":"body-1","event_evidence":"A Westcore-affiliated entity acquired Woodinville Corporate Center I, a multi-tenant, light industrial park located in the Woodinville submarket east of Seattle, in a transaction reported to be worth $51.1 million.","market_evidence_id":"body-1","market_role":"asset_location","market_scope":"us","market_evidence":"A Westcore-affiliated entity acquired Woodinville Corporate Center I, a multi-tenant, light industrial park located in the Woodinville submarket east of Seattle, in a transaction reported to be worth $51.1 million.","duplicate_of":null,"selector_reason":"Westcore关联实体以5,110万美元收购西雅图东部Woodinville轻工业园；标的为多租户工业园区。","title_zh":"Westcore 关联实体收购西雅图东部轻工业园","summary_zh":"Westcore 关联实体从黑石旗下 Link Logistics 收购西雅图以东伍丁维尔的一处多租户轻工业园，交易金额据报道为 5,110 万美元。","impact":"neutral","evidence_quote":"A Westcore-affiliated entity acquired Woodinville Corporate Center I, a multi-tenant, light industrial park located in the Woodinville submarket east of Seattle, in a transaction reported to be worth $51.1 million. Located at 17606–17683 128th Place NE, along the SR-522 Corridor, Woodinville Corporate Center I was sold by Blackstone's Link Logistics, one of the largest owners ... The post Westcore Entity Pays $51.1M for Seattle-Area Light Industrial Campus appeared first on Connect CRE .","evidence_basis":"body","cre_subcategory":"工业"},{"source_id":"realtor-research","source_name":"Realtor.com Research","source_tier":"B","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"New-Construction Insights: Builders Hold Steady on Price, but Offer Savings via Reduced Rates","link":"https://www.realtor.com/research/new-construction-insights-2026q3/","description":"New-Construction Insights: Builders Hold Steady on Price, but Offer Savings via Reduced Rates By Joel Berner Nov 17, 2026 Home Construction Highlights The median listing price for a new home in the United States has barely budged in the last three years, but existing home prices have been falling. Builders have slowed down new construction activity, and the number of new homes for sale this quarter is basically unchanged from last year. Existing home inventory is growing slowly, but faster than new homes. The average new construction buyer pays $258 per month less on interest in the first year of homeownership than the median existing home buyer due to reduced mortgage rates, assuming a $400,000 home purchase with 10% down. For reduced rates fixed through the 30-year life of the loan, new home buyers pay $117 per month less. National Overview The median listing price for newly built homes in the United States rose slightly in the third quarter of 2026, reaching $451,071. This is right in line with where new home prices were last year in the third quarter as well as in the third quarter of 2024. New home listing prices have been remarkably stable throughout the post-pandemic period of elevated mortgage rates. Existing home prices, on the other hand, continued to grow through 2025 but have given up ground so far in 2026. For the third quarter this year, existing home prices came in 1.5% below 2025 levels, landing at $402,883. Builders were quicker to adjust to the realities of muted buyer demand in this high rate environment, while existing home sellers had pricing expectations based on the market from 2021 and 2022 that were slower to dissolve. The overall price softness we’ve seen through 2026 is driven primarily by the existing home segment. The recovery in the number of homes for sale has slowed significantly in 2026 for both new construction and resale homes, as inventory on the market is inching closer to pre-pandemic levels. In 2026Q3, new home inventory grew just 0.1% year over year and existing home inventory grew 3.1%. Existing home sellers have been reluctant to put their homes on the market as selling conditions have softened: falling prices, longer times on market, more price reductions. Builders are facing challenges as well–increased labor and material costs, decreased buyer demand–that have led to the completion rate of new single family homes falling 11.0% year over year in September. New resale listings and newly completed homes are slowly trickling onto the market rather than surging like they were a few years ago. One notable result from the past three quarters of this data series is that builders were cutting listing prices at a higher rate than existing home sellers. We chalked this up to the resale market finally adjusting its expectations and setting initial prices lower, lessening the need for price adjustments, but this quarter existing home price reductions came roaring back. Resellers are now cutting prices on 21.6% of homes for sale while builders are doing the same for 20.9%. Both measures are higher than they were last year at this time, but while builders are steadily increasing their share of price reductions, resale homes with price cuts are resurgent after taking a step back early this year. Regardless of their relative positions, the growing incidence of price reductions for new and existing homes is an indication of softness in the housing market in general and gives reason to expect that the diminished pace of inventory growth will continue. Though there is nearly a $50,000 gap between the median new home price and the median existing home price, new homes tend to be larger (a median of 2,056 square feet compared to 1,790 square feet this quarter). Adjusting for size, this price gap disappears. The median price per square foot for new homes was $218 in 2026Q3 and for existing homes it was $219. This counterintuitive result can be attributed to the three most important factors in real estate: location, location, location. New builds are heavily concentrated in the South and in the suburbs where land is less expensive. If the current trends in listing prices continue, though, we could see the median existing home price per square foot drop back below the same measure for new homes in the coming quarters. The recent pullback by builders is making new construction less impactful in the market than it has been in the past. The new construction share of listings fell from 17.2% in 2025Q3 to 16.7% in 2026Q3 and the new construction premium (the percent difference in median listing price between new and existing homes) rose from 10.3% to 12.0%. Buyers are finding fewer new homes for sale and the ones they do find are relatively more expensive. New Home Buyers Pay Lower Mortgage Rates than Existing Home Buyers Since April, an odd outcome has presented itself: the median price of newly built homes sold in the United States is lower than the median price of existing homes sold. In September, the median sales price for new homes , which has been falling faster over the past few years than new home asking prices, was $400,400 while for existing homes it was $417,500. This does not imply that a new build in the same neighborhood with similar specifications to an older home is selling at a lower price. It has much more to do with geographic mix. The pricier Northeast, home to some of the hottest home sales markets in the country right now and home to relatively little new construction activity, makes up 11.8% of existing home sales and just 4.7% of new home sales. The more affordable South, where many markets are seeing home sales fall and where new construction activity is heavily concentrated, makes up 61.1% of new home sales to just 46.6% of existing home sales. Geographic mix can also help explain the difference between our observed median listing price for new homes and the median sale price, as Northeastern new home listings are a larger share of the market tha","published_at":1794909606000,"source_family":"realtor-com","is_research":true,"required_source":true,"mutable":false,"first_seen_at":1794951480753,"id":"67fb452fec05bd6f","acquisition_window":{"lower":1794862800000,"upper":1794949200000},"score":14,"tag
