ridor, a 240-unit Class A multifamily community in Sheboygan, Wisconsin, to Axiom Properties. Cushman & Wakefield's Brad Smith, Jack Maloney and Ralph Depasquale represented the seller, Chicago-based Midloch Investment Partners. Located at 1436 Green Street, the community was approximately 97% occupied at the time of sale.","evidence_basis":"body","cre_subcategory":"多户"},{"source_id":"national-mortgage-news","source_name":"National Mortgage News","source_tier":"A","source_weight":7,"source_tags":["rates","macro"],"region":"national","title":"ARMs hit record 17% of locks: Pitch beyond the 30-year","link":"https://www.nationalmortgagenews.com/news/arms-hit-record-17-of-locks-pitch-beyond-the-30-year","description":"ARMs hit record 17% of locks: Pitch beyond the 30-year By Spencer Lee CloseText About Spencer twitter Spencer_NYC linkedin spencer-lee-journo Published November 10, 2026, 1:57 p.m. EST | Updated November 10, 2026, 2:06 p.m. EST 3 Min Read Facebook Twitter LinkedIn Email What's at Stake: Homebuyers seeking immediate affordability relief who risk facing severe sticker shock. Expert Quote: \"October's data show how much affordability is shaping the purchase market.\" — Brennan O'Connell, Director of Data Solutions, Optimal Blue Overview bullets generated by AI with editorial review. A growing share of borrowers flocked to adjustable-rate mortgages in October, providing clues about where business may lie as well as the impact that the current economic environment is having on consumer behavior. The share of adjustable-rate mortgage locks last month hit 17%, the highest since the data was first tracked in 2019, according to Optimal Blue's Market Advantage Report. The ARM portion of locks rose from 14% one month earlier. Processing Content The new high mark came at the same time total rate-lock volume tumbled 19% from September and 38% on a year-over-year basis, with numbers falling across all loan categories amid ongoing macroeconomic pressures . Purchase lock volume decreased to an 84% share, relative to total activity, with demand slipping 18% and 17% from the prior month and year. The downward pressure across loan types led Optimal Blue's market volume index to plummet to a reading of 77 compared to 94 in September. \"October's data show how much affordability is shaping the purchase market,\" said Brennan O'Connell, director of data solutions at Optimal Blue, in a press release. In other data showing the momentum currently boosting ARMs, the Mortgage Bankers Association reported lenders expanded availability of such financing for borrowers, especially those with lower loan-to-value ratios compared with recent history. The offerings helped push MBA's Mortgage Credit Availability Index higher for the first time in three months. The trends suggest that opportunities in today's subdued housing market exist outside the standard fixed-rate loan as long as originators can work with borrowers to find solutions that fit individual needs. ARM originations have historically risen when fixed rates surge, providing buyers with affordability relief for at least the first few years of their mortgage. The loans come with an initial fixed interest rate lower than the 30-year average. \"For lenders, that means the opportunity is increasingly in helping borrowers find the product and payment structure that works for their circumstances,\" O'Connell said. Supporting its findings, Optimal Blue pointed out Federal Housing Administration-backed loans also accounted for an expanding percentage of mortgage locks, and first-time homebuyers grew in the agency market. The FHA segment made up 20% of locks, while Department of Veterans Affairs-backed mortgages took an 11% share, both up from September. Meanwhile, conforming loans made up 46% of all October locks, while non-conforming transactions accounted for 22%, both declining from the prior month. First-time buyers nabbed 45% of conforming purchase locks, climbing from both the previous month and year. Non-qualified mortgages, which are also experiencing heightened demand this year, made up 12% of October loan production, edging down from September but up by 195 basis points over the past three months and 420 basis points year over year. Non-QM lock volume split in close-to-equivalent shares between debt service coverage ratio, bank-statement and expanded guideline programs. Mortgage lenders see expanded credit availability The MBA's credit index increased 0.4% between September and October to a reading of 107.5, in part due to elevated ARM interest, with higher marks indicative of a greater number of products. In September, the MCAI settled at a score of 107.1, with a benchmark of 100 representing credit availability in March 2012, following the Great Recession. Unlike Optimal Blue's findings, though, government-product availability flattened, while conventional offerings grew, MBA reported. The uptick in ARM loans with lower LTV ratios included cash-out refinancing products, according to the trade association. \"This also boosted the jumbo index, which was up to its highest level in three months,\" said Joel Kan, MBA vice president and deputy chief economist. The conventional MCAI increased 0.6%, while the government index grew by just 0.1%. Subindices within the conventional component showed jumbo offerings up 0.8% month to month and conforming credit unchanged. Look out for ARM regret Although lenders will appreciate the activity boosting their bottom line, recent history suggests consumers may want to approach them with caution. Research conducted in 2024 found approximately 70% of ARM borrowers expressed regret about their choice , with some facing sticker shock when the initial fixed term ended. Spencer Lee Technology Reporter Spencer Lee is a New York-based technology reporter at National Mortgage News, whose coverage area spans artificial intelligence, fintech platforms... Read full bio twitter linkedin","published_at":1794337074000,"mutable":false,"date_precision":"timestamp","modified_at":1794337585579,"extraction":"semantic","canonical":"https://nationalmortgagenews.com/news/arms-hit-record-17-of-locks-pitch-beyond-the-30-year","content_hash":"8e654f26f72e371802e852b8c98f8b872c0421eafd60713fa75552017bb9d1dc","access":"public","evidence_status":"article","id":"e5a70ee16a734672","source_family":"national-mortgage-news","is_research":false,"required_source":false,"first_seen_at":1794346644132,"acquisition_window":{"lower":1794258000000,"upper":1794344400000},"score":30,"tags":["housing","national","rates","data","lender"],"heat_signals":["fed","trend","trends","year over year","year-over-year","housing market"],"keep":true,"importance":3,"section":"national","capital_focus":false,"geo_evidence":null,"duplicate_of":null,"selector_reason":"Optimal Blue data show ARMs reached a record 17% of mortgage locks since tracking began in 2019, indicating a significant shift in borrower financing.","title_zh":"10 月 ARM 锁定占比升至创纪录 17%","summary_zh":"Optimal Blue 数据显示，10 月可调利率抵押贷款锁定占比升至 17%，为 2019 年开始追踪以来最高；同期总锁定量较 9 月下降 19%。","impact":"short-neg","evidence_quote":"The share of adjustable-rate mortgage locks last month hit 17%, the highest since the data was first tracked in 2019, according to Optimal Blue's Market Advantage Report. The ARM portion of locks rose from 14% one month earlier. Processing Content The new high mark came at the same time total rate-lock volume tumbled 19% from September and 38% on a year-over-year basis, with numbers falling across all loan categories amid ongoing macroeconomic pressures .","evidence_basis":"body","cre_subcategory":null},{"source_id":"realpage-research","source_name":"RealPage Analytics","source_tier":"B","source_weight":9,"source_tags":["multifamily","data","trend"],"region":"national","title":"San Diego apartment supply is about to peak","link":"https://www.realpage.com/analytics/san-diego-supply-3rd-quarter-2026/","description":"San Diego apartment supply is about to peak by Kim O'Brien Posted November 5, 2026 in Insights San Diego apartment supply hit a record high in the past year and is set to peak in 1st quarter 2027. In the year-ending 3rd quarter 2026, roughly 6,600 units completed across San Diego, marking the highest annual total since Realpage Market Analytics began tracking the market in 2000. Supply in the past year also surpassed the market’s decade average around the 4,000-unit mark. Annual supply in San Diego is expected to remain elevated, peaking in the year-ending 1st quarter 2027, when roughly 6,880 units are scheduled for completion. After that, supply is slated to come down, aligning closer to the market’s decade average by the end of 2027. Demand is keeping pace with record apartment supply in San Diego, as evidenced by occupancy at 95.7% in October and rents up 1.5% year-over-year. After supply hits its peak and starts to come down, this market is projected to see improvement in both of those metrics. SHARE Tags Apartment Supply San Diego, CA Previous Article The math behind staying put: When does buying a home beat renting? Next Article Annual rent growth sees a milestone, even as prices ease in October","published_at":1794038408000,"source_family":"realpage-research","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794173831876,"id":"3e662092579a4e04","acquisition_window":{"lower":1793912400000,"upper":1794171600000},"late_discovery":true,"score":15,"tags":["multifamily","california","construction","trend"],"heat_signals":["annual","year-end"],"date_precision":"timestamp","modified_at":1794297615000,"extraction":"semantic","canonical":"https://realpage.com/analytics/san-diego-supply-3rd-quarter-2026","content_hash":"81f6d3ee27f9a198da3134f5a7d123919ddbf1c17769545aae921320e343a3a0","access":"public","evidence_status":"article","keep":true,"importance":3,"section":"cre","capital_focus":false,"geo_evidence":"San Diego","duplicate_of":null,"selector_reason":"San Diego apartment completions reached a tracked-market record and are forecast to peak near 6,880 units in early 2027; occupancy and rents remained positive.","title_zh":"圣迭戈公寓供应预计 2027 年第一季度见顶","summary_zh":"RealPage Analytics 称，圣迭戈一年期截至 2026 年第三季度新增公寓约 6,600 套，预计一年期截至 2027 年第一季度完工量约 6,880 套；10 月入住率为 95.7%。","impact":"neutral","evidence_quote":"In the year-ending 3rd quarter 2026, roughly 6,600 units completed across San Diego, marking the highest annual total since Realpage Market Analytics began tracking the market in 2000. Supply in the past year also surpassed the market’s decade average around the 4,000-unit mark. Annual supply in San Diego is expected to remain elevated, peaking in the year-ending 1st quarter 2027, when roughly 6,880 units are scheduled for completion.","evidence_basis":"body","cre_subcategory":"多户"},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Mortgage rates ease as buyers gain leverage with concessions, ARMs","link":"https://www.housingwire.com/articles/mortgage-rates-ease-buyers/","description":"Mortgage rates eased slightly this week but stayed above 7.3%, keeping affordability tight and forcing loan officers to lean on seller concessions and adjustable-rate mortgages (ARMs) to close deals. At HousingWire ’s Mortgage Rates Center on Tuesday, 30-year fixed-rate mortgages averaged 7.35%, down from 7.38% one week earlier. Rates for 30-year jumbo loans averaged 7.56%, a 6-basis-point decline, while 30-year Federal Housing Administration (FHA) loans were up 6 bps to 7.22%. “Since early October, rates have improved about 100 basis points, which can equate to an eighth of a point to 0.375, so that’s helping affordability,\" said Shannon Hoff, a California-based mortgage broker at Hoff Home Loans . Inflation remains a key obstacle. Data released Tuesday showed the Consumer Price Index rose 0.4% on a monthly basis in October, hotter than expected, keeping the door open for the Federal Reserve to raise interest rates at its December meeting. “Because that’s creating uncertainty, I am seeing buyers are still extremely payment-sensitive,” Hoff said. “However, during the COVID-19 pandemic, people were having to pay $100,000 over for the listing price. If your payment is going to change $100 or $200 from where you want the rate to be, in the big picture, that's not so worrisome.” First American senior economist Sam Williamson said hotter inflation is likely to prolong the wait for real mortgage rate relief. “ Stronger job growth may give some households the income to move, but elevated borrowing costs raise the hurdle for everyone,” Williamson said in a statement. “Until mortgage rates ease, life moves will keep the housing market moving, while discretionary buyers wait on the sidelines.” In this context, Optimal Blue 's October 2026 Market Advantage mortgage data report showed that rate-lock volume fell 19% month over month and 38% year over year. But ARMs represented 17% of total lock volume, the highest share in the report going back to 2019. \"ARM share reached another high, FHA gained share and first-time buyers took a larger share across the major agency programs,\" Brennan O'Connell , director of data solutions at Optimal Blue, said in a statement. \"For lenders, that means the opportunity is increasingly in helping borrowers find the product and payment structure that works for their circumstances.\" Buyer's market? As fewer borrowers are able or willing to buy at today’s rates, inventory is starting to build in parts of the country. That's giving buyers more leverage, while pushing sellers and builders to participate more heavily in financing costs. That’s the opposite of a few years ago, when rock-bottom rates, intense competition and limited supply forced buyers to bid far above list price and waive contingencies. “I'm licensed in nine states, I get to see various markets, and a lot of them are leaning toward the buyer,” said Gay Veale , a 30-year U.S. Air Force veteran and owner of Guidon Mortgage Group . “Because of that, there’s often seller concessions involved, and I am seeing people use those seller concessions for as many different ways to do rate buydowns or get their mortgage to be cheaper in the beginning, at least, if possible.” Veale cited one deal in which a borrower received $58,000 in seller concessions — an unusually high figure — and locked a 6% rate. With a 3-2-1 temporary buydown, a permanent buydown and an adjustable-rate mortgage, the borrower’s effective initial rate fell to 2.75%. “Around 75% of my clients are getting seller concessions. They're not all that much, but at least $10,000 is an average for me,” Veale said. Needs-based buyers Veale said most buyers using ARMs today are opting for products that provide about five years of lower rates before they reset . That roughly matches borrower expectations that rates could ease somewhat over the medium term. She added that most of her current clients are “need-to-move” borrowers rather than investors , such as people relocating for a job, dealing with a death in the family, welcoming a new child or trying to get closer to relatives. Investment purchases are far less common than during the pandemic period, she said. Veale said her business volume this year looks very similar to last year, an outcome she called “very atypical of the market” and not something she expects to see again under normal conditions. In Northern California , Hoff said weaker demand is allowing some buyers to negotiate steep price cuts and substantial credits. She pointed to a client scheduled to sign on Wednesday for a new home after securing $50,000 off the purchase price and $10,000 in seller credits. That $60,000 swing would have been unattainable in a hotter market, she said. “That $60,000 is much more than paying a half of a point or a point higher in rate,\" she said. \"Not only is it the uncertainty affecting the buyers, it's also affecting the sellers.\" Down payment dynamics have shifted as well. During the pandemic, borrowers using down payment assistance or putting 3% down struggled to compete with cash offers and large down payments. Today, Hoff said, these buyers are reappearing. She is seeing “more first-time homebuyers jump in the market with challenged credit, down payment assistance, outside-the-box loans, bank statements . My loans are definitely a lot more challenging now.” Related More: 30-Year Fixed Mortgage Adjustable-Rate Mortgage Mortgage Rates Center","published_at":1794338201000,"mutable":false,"date_precision":"timestamp","modified_at":1794338204000,"extraction":"semantic","canonical":"https://housingwire.com/articles/mortgage-rates-ease-buyers","content_hash":"f4b051eb813399de4680b4ebc3400dda6f4c229f147758e9861c469ff9644e3b","access":"public","evidence_status":"article","id":"5adbd82f95b75dc8","source_family":"housingwire","is_research":false,"required_source":false,"first_seen_at":1794346644132,"acquisition_window":{"lower":1794258000000,"upper":1794344400000},"score":29,"tags":["housing","national","rates","macro","lender"],"heat_signals":["fed","inflation","mortgage rate","30-year fixed","year over year","housing market"],"keep":true,"importance":3,"section":"national","capital_focus":false,"geo_evidence":null,"duplicate_of":null,"selector_reason":"Weekly mortgage-rate data show fixed rates still above 7.3%, with seller concessions and ARMs being used to address affordability.","title_zh":"按揭利率仍高于 7.3%，买方更多使用 ARM","summary_zh":"HousingWire 称，30 年期固定按揭利率均值为 7.35%，略低于前一周；通胀偏热令降息预期受限，贷款机构更多依靠卖方让步和 ARM 促成交易。","impact":"short-neg","evidence_quote":"Mortgage rates eased slightly this week but stayed above 7.3%, keeping affordability tight and forcing loan officers to lean on seller concessions and adjustable-rate mortgages (ARMs) to close deals. At HousingWire ’s Mortgage Rates Center on Tuesday, 30-year fixed-rate mortgages averaged 7.35%, down from 7.38% one week earlier. Rates for 30-year jumbo loans averaged 7.56%, a 6-basis-point decline, while 30-year Federal Housing Administration (FHA) loans were up 6 bps to 7.22%.","evidence_basis":"body","cre_subcategory":null},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Camden lowers guidance after September concession resurgence","link":"https://www.multifamilydive.com/news/camden-new-lease-rents-apartment-concessions/874058/","description":"Camden lowers guidance after September concession resurgence The REIT still saw improvement in expenses and new lease growth in Q3, though rising interest rates forced it to cancel property and land acquisitions. Published Nov. 6, 2026 Leslie Shaver Senior Reporter Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Wall Street sign with american flags and New York Stock Exchange in Manhattan, New York City, USA. Getty Images Camden’s Property Trust lowered its 2026 same-store revenue midpoint by 50 basis points to 0% after a weaker-than-expected September and the expectation of greater seasonal decline in the fourth quarter, according to the REIT’s executives on Friday’s third-quarter earnings call. Performance in September, specifically, surprised the company and set the stage for that revision, according to CEO Alex Jessett. “It was a greater decline in traffic than we had expected,” Jessett said. “And when we had the decline in traffic, obviously, you have to reduce your prices if you're trying to increase traffic.” Jessett said concessions, which were “incredibly sticky,” ranged from three weeks in West Palm Beach, Florida, up to two months in Austin, Texas, as merchant builders continued to offer steep discounts. “The third quarter, at least July and August, were so strong that we would have expected to see others start to dial back their concessions, and they absolutely did not do it,” Jessett said. Despite the September slowdown, there were positives: Camden expects same-store YOY expense growth of 1.75%, which is 75 bps better than the REIT’s prior midpoint and 125 bps better than beginning-of-year guidance, according to CFO Ben Fraker. The company was also “the only S&P 500 multifamily REIT to experience sequential improvement for both new lease rates and blended lease rates each quarter this year, and we were the only one with second- to third-quarter acceleration,” according to Jessett. Camden saw positive signs into Q4, though high-concession markets weighed on results. The REIT finalized its massive California sale and multiple acquisitions, though the interest rate environment forced it to cancel other deals. Rent trends Like many companies in supply heavy markets, Camden saw new leases remain in negative territory in Q3, falling to -2% YOY, according to its Q3 earnings release. In Q2, Camden’s new lease rate came in 130 bps lower at -3.3%. In Q3, renewals rose 3.6% YOY, giving the REIT a blended rate of 1%. In Q2, renewals increased 2.8% YOY and blends were -0.2%. “While renewal growth was in line with our expectations, new lease and blended lease growth were at the low end of our anticipated ranges, likely driven by the persistent concessions that remain in many of our core markets and sub-markets,” Camden Chief Operating Officer Laurie Baker said on the Q3 call. Camden sent out renewal offers to residents with December and January expirations at an average increase of 4.5%, according to Baker. That isn’t the only positive indicator. “We have seen signed new leases improve pretty dramatically in October as compared to September, and when we look at our October numbers and we compare them to October of last year, we're seeing really significant improvement,” Jessett said. Southeast Florida, at 1.6% YOY revenue growth; Atlanta, at 1.5%; Dallas, at 0.8%; and Houston, at 0.6%, were the top markets for Camden in Q3, according to a company Securities & Exchange Commission filing. Concessions have played a role in their performance, according to Baker. “We're seeing the strongest markets in Atlanta, Southeast Florida, Dallas and Houston,” Baker said. “And so, where those lower concessions are, we're obviously getting a little more pricing power, and we're having the ability to improve our occupancy.” On the other end of the spectrum were Denver, with a 5% YOY revenue decline; Nashville at -3.1%; Tampa, Florida, at -1.3%; and Orlando, Florida, at -0.7%, according to the SEC filing. “We still are continuing to see Denver and Nashville as those that have concessions that have been persistent,” Baker said. Buying and selling In July, Camden closed its sale of 11 properties with 3,620 apartment homes to a BlackRock-managed vehicle for $1.6 billion, recognizing a gain of $1 billion. The REIT used approximately $0.9 billion to retire balances outstanding under its unsecured revolving credit facility and commercial paper program, according to the Q3 earnings release. The REIT used $125 million to fund its August property and land acquisitions; $50 million to repurchase shares in August and early September; and $495 million toward the redemption of $500 million of senior notes due in November and to pay down borrowings in its commercial paper program. It had $55 million remaining in cash investment accounts for general corporate purposes, Fraker said on the call. In Q3, the REIT acquired Camden Brandon, a 296-unit property in Tampa; Camden LoSo, a 343-unit property in Charlotte, North Carolina; and Camden Gulch, a 300-unit property in Nashville, Tennessee, for a combined $305.2 million, according to the release. Camden acquired a land parcel in Tampa for approximately $18.3 million and sold 2.6 acres of land in Los Angeles for approximately $10.7 million, according to the release. Camden canceled the purchase of two properties and one land parcel in Q3 after interest rates rose , according to Jessett. “We went back looking for price adjustments, and clearly the sellers were not quite willing to capitulate to what we were looking for,” Jessett said. The REIT has also decided not to move forward with Nashville and Denver development projects at this time. BY THE NUMBERS Category Q3 YOY Change Property revenue $332.8 million -0.1% Net operating income $210.9 million -0.2% Expenses $121.9 million -0.1% Core funds from operations $1.71 0.6% Rental rate $1,951 -0.5% Occupancy rate 95.6% 10 bps SOURCE: Camden “We've been talking about the Denver and Nashville land ","published_at":1794001071000,"mutable":false,"date_precision":"day","published_date":"2026-11-06","modified_at":0,"extraction":"semantic","canonical":"https://multifamilydive.com/news/camden-new-lease-rents-apartment-concessions/874058","content_hash":"bbbcc1b345fc5f441c4b182bee9a45639113498b294854dc00ef65bb5e8573d9","access":"preview","evidence_status":"preview","id":"4461da2fd4a90e94","source_family":"multifamily-dive","is_research":false,"required_source":false,"first_seen_at":1794173831876,"acquisition_window":{"lower":1793912400000,"upper":1794171600000},"late_discovery":true,"score":29,"tags":["multifamily","national","earnings","trend","institutional"],"heat_signals":["texas","houston","dallas","austin","blackrock","trend","trends"," yoy","occupancy"],"keep":true,"importance":3,"section":"cre","capital_focus":false,"geo_evidence":null,"duplicate_of":null,"selector_reason":"Camden cut its 2026 same-store revenue midpoint to 0% after weaker September traffic and said higher rates led it to cancel property and land acquisitions.","title_zh":"Camden 下调 2026 年同店收入指引","summary_zh":"Multifamily Dive 报道，Camden 将 2026 年同店收入中点下调 50 个基点至 0%，原因包括 9 月客流弱于预期及第四季度季节性下滑；公司预计同店费用增长 1.75%。","impact":"short-neg","evidence_quote":"Getty Images Camden’s Property Trust lowered its 2026 same-store revenue midpoint by 50 basis points to 0% after a weaker-than-expected September and the expectation of greater seasonal decline in the fourth quarter, according to the REIT’s executives on Friday’s third-quarter earnings call. Performance in September, specifically, surprised the company and set the stage for that revision, according to CEO Alex Jessett. “It was a greater decline in traffic than we had expected,” Jessett said.","evidence_basis":"body","cre_subcategory":"多户"},{"source_id":"houston-agent","source_name":"Houston Agent Magazine","source_tier":"D","source_weight":6,"source_tags":["houston","brokerage"],"region":"texas","title":"NAR recommends new MLS policy changes amid Compass private-listings kerfuffle","link":"https://houstonagentmagazine.com/2026/11/10/nar-mls-policy-changes/?utm_source=rss&utm_medium=rss&utm_campaign=nar-mls-policy-changes","description":"NAR recommends new MLS policy changes amid Compass private-listings kerfuffle by John Yellig November 10, 2026 The National Association of REALTORS® recently issued four MLS policy recommendations aimed at modernizing MLS policies and improving client service. The recommendations come amid tension in the industry as some brokerages, Compass in particular, seek to disrupt the traditional MLS model with private listings , a move critics call monopolistic and anti-competitive. They also follow the creation of a shared listing platform by four of the nation's largest brokerages that seeks to combat Compass' Private Listing Network. NAR's four new policies seek to strengthen copyright protections for MLS listing content, provide MLSs with increased flexibility for establishing local data-feed requirements, clarify permitted uses of MLS data and update qualifications for service on NAR's MLS Committee. “These updates reflect our commitment to ensuring MLS policies remain relevant, effective and responsive to the needs of today's real estate industry,” NAR CEO Nykia Wright said. “In line with our 2026–2028 Strategic Plan and significant member feedback, we will continue working collaboratively with MLSs, brokers, members and other industry partners to support a clear understanding and implementation of these changes.” The recommendations include: The introduction of a new optional MLS policy, Copyright Protection of MLS Data, which provides MLSs the discretion to require up to a 50% copyright interest in certain listing content. Under the proposal, MLSs must provide participants with the right to opt-out of assigning a copyright interest to the MLS. Brokers retain the right to independently use and license their own listings. The establishment of an optional MLS policy about MLS Data Feed Services, which would provide MLSs with greater flexibility to establish local eligibility and licensing requirements for data feeds, provided they are applied equally to all participants, who retain access to their own MLS listings and data feeds. Establishing a new MLS Policy Statement to reinforce the fact that the use of MLS data must comply with applicable MLS participation or data licensing agreements and be connected to providing real estate brokerage services or preparing appraisals or other property valuations. This recommendation aims to help address concerns about unauthorized use of MLS content. Updating the qualification criteria for service on NAR's MLS Committee to better reflect today's MLS environment and ensure the committee continues to benefit from relevant industry expertise and perspectives. \"This move seems proactive against the private listing threat by Compass,\" Miller Samuel Co-founder and housing analyst Jonathan Miller said. \"The new policy lets MLSs base their feed eligibility on contributing listing content to the MLS. Firms can't take the benefits of access to all of the cooperative MLS listing content but then hide their own listings. \"By bringing this up in advance, it will probably be easier for MLSs to cut off a Compass feed for not following their rules against hiding information,\" he concluded. Read More Related to This Post NAR: Repeat buyers dominate home sales as first-time buyers stru
