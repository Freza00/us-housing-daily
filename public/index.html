ource_tags":["rates","macro"],"region":"national","title":"MBA adjust forecasts for a 2027 federal rate hike","link":"https://www.nationalmortgagenews.com/news/mba-adjust-forecasts-for-a-2027-federal-rate-hike","description":"Economic news MBA adjust forecasts for a 2027 federal rate hike By Spencer Lee CloseText About Spencer twitter Spencer_NYC linkedin spencer-lee-journo Published May 18, 2026, 7:33 a.m. EDT 3 Min Read Facebook Twitter LinkedIn Email Mortgage Bankers Association Chief Economist Mike Fratantoni speaks at the trade group&#x27;s conference in New York on May 17, 2026. The near-term impact of inflation has the Mortgage Bankers Association warning of potential setbacks to growth and a 2027 federal rate hike, but lenders should still see volumes increase this year, it said on Sunday. Processing Content Originations will grow approximately 6% year-over-year in 2026 on a dollar-volume basis, with the trade group presenting baseline expectations of $1.41 trillion in purchase mortgages and $757 billion in refinances at its secondary markets conference in New York. Current economic volatility in light of the Iran War's effect on oil markets could easily exacerbate inflation and mortgage rates and quickly disrupt the outlook, though, according to MBA Chief Economist Mike Fratantoni. A worst-case scenario where price shocks drive mortgage rates one percentage point higher would result in a swing of more than $370 billion fewer originations, he said. \"It is a really challenging, volatile macroeconomic environment,\" he said. \"This inflation situation is a problem. It's worse than markets had expected,\" he said during an on-stage presentation. For 2027, MBA's projections based on current trends stand at $1.51 trillion in purchase originations and $684 billion in refinances. The following year, numbers should rise to $1.54 trillion for purchases, while refis would shrink to $674 billion. What's ahead for monetary policy Swiftly changing developments in the first half of 2026, with the likelihood of a near-term diplomatic resolution to the Mideast conflict slim, resulted in the MBA revising its monetary policy forecast this month. In April, the association's economists predicted the Federal Reserve holding its benchmark funds rate at existing levels through 2028. \"Relative to all the inflation news, we've now changed that call, looking for a first hike in the middle of 2027 and then a second hike in 2028,\" Fratantoni said. He noted that markets had already jumped ahead with expectations for a more hawkish Fed next year. As a result, 6.5% represents a \"good centering point\" for the 30-year mortgage rate over the next two years, he said. The Mortgage Bankers Association number comes in higher than recent predictions from Fannie Mae . The lock-in effect's influence on the mortgage market Current rate levels are also contributing to only marginal growth in housing prices, with projections of growth to come in under 1% for the next two years nationwide. \"I think there definitely has been a strong signal there that inventory is out there, and price growth is slowing because of that,\" said deputy chief economist Joel Kan. At the same time, though, the inventory growth continues to be tempered by the lock-in effect, where many homeowners are opting to hold onto low interest rates rather than relocate and take on higher monthly payments at today's levels, MBA economists added. \"We're oversupplied in a number of markets. That's going to be offset by a still relatively tight supply in places like the Northeast and the Midwest, but nationally don't expect home prices to move,\" Fratantoni said. While economic volatility is turning into the dominant theme in 2026, mortgage lenders, by and large, are learning to adjust, Kan pointed out. In its just released nonbank production report , MBA found 76% of firms profitable in the first quarter. \"Clearly, companies have leaned out over the last few years, generating volume and doing their business with pretty small crews,\" Kan said. Companies are still keeping enough employees on hand, \"so that if you do have a pickup, whether it's purchase or refi, you have enough staffing as needed,\" he said. Still, a wide disparit","published_at":1779103984000,"score":36,"tags":["housing","national","rates","macro","lender"],"heat_signals":["fed","rate hike","inflation","mortgage rate","fannie mae","outlook","forecast","trend","trends","year-over-year"],"importance":4,"selector_reason":"MBA调整对2027年联邦加息的预测，直接影响抵押贷款利率预期和住房需求判断。它不是美联储正式决策，但对全国住宅金融市场有中等以上影响。","section":"national","title_zh":"MBA 改口：2027 Fed 或再加息","summary_zh":"MBA 预计 2026 originations 增 6%，但油价通胀可令贷款量少 $370B","impact":"short-neg","id":"aab2c320","fetched_at":1779155383489},{"source_id":"national-mortgage-news","source_name":"National Mortgage News","source_tier":"A","source_weight":7,"source_tags":["rates","macro"],"region":"national","title":"Without GSEs' bond buying, mortgage rates may be even higher","link":"https://www.nationalmortgagenews.com/news/without-gses-bond-buying-mortgage-rates-could-be-higher","description":"Secondary markets Without GSEs&#x27; bond buying, mortgage rates may be even higher By Brad Finkelstein CloseText About Brad twitter nmnbrad mailto bradley.finkelstein@arizent.com linkedin brad-finkelstein-8b2b9a5/ Published May 18, 2026, 1:17 p.m. EDT | Updated May 18, 2026, 8:46 p.m. EDT 3 Min Read Facebook Twitter LinkedIn Email Jeana Curro of Bank of America Securities and John Sim of J.P. Morgan speak at the Mortgage Bankers Association&#x27;s Secondary and Capital Markets Conference. Without the presidential order mandating the government-sponsored enterprises purchase securitized loans, it is possible mortgage rates could even be higher. Processing Content The economists at Bank of America Securities are still expecting the next move out of the Federal Reserve to be a reduction in short-term rates, but they have delayed the timing. This is in contrast to the forecast announced yesterday by the Mortgage Bankers Association at its Secondary and Capital Markets Conference. The MBA is joining the ranks of those expecting the next move to be a hike. Bank of America Securities now expects the cut to take place in July of 2027, said Jeana Curro, managing director and head of Agency MBS research, during a Monday morning panel. \"They have always been in the camp that the Fed should not cut rates, but it very well could, and that's because of political pressure,\" said Curro. In contrast, J.P. Morgan has had a forecast in place for a while now calling for the Fed to first act in 2027 by raising rates, said John Sim, managing director at that company. J.P. Morgan broke from previous consensus around a rate drop much earlier. He remembered going into meetings, \"and everyone's sort of scratching their head, saying, what do you mean?\" It wasn't any particular insight into the market, just noticing that inflation was starting to get ahead of itself and the Fed would be forced to do some sort of hike. MBA Chief Economist Mike Fratantoni, who was the panel moderator noted the Treasury-mortgage spreads are currently 190 basis points, having narrowed following President Trump's tweet about having the government-sponsored enterprises buy mortgage-backed securities. Curro noted this caused spreads to quickly narrow by 25 basis points, and between 15 basis points and 20 basis points of it was passed through to the primary market. It was like the market \"front-loaded\" the impact of the GSEs' MBS buying , she said. It brought the 30-year fixed under 6% \"for a day,\" but then rates started rising again. \"I will say, if the GSEs' had not been buying, mortgage rates would be a lot higher , and I think spreads would be a lot wider,\" Curro said. Although the market has already lost most of the initial rate reduction from the original tightening, because of it, spreads are still that much narrower than they would have otherwise been today. The tricky part here is both Fannie Mae and Freddie Mac, while in conservatorship, are acting under a directive to be mindful of their profitability , and this creates a balancing act, she said. Freddie Mac said at a recent B of A Securities conference that profitability is important to it, Curro recounted. But both are likely to hit their portfolio caps in September, which will curtail MBS buys, Sim added. \"Enjoy it while it lasts, and then I think it is over,\" he warned. \"I don't think we're seeing more buying after that.\" Later, when talking about changes to the loan-level pricing adjustments, Curro noted these are a way to give borrowers lower mortgage rates. But it's done in a way which affects GSE profitability. \"Hammering down the primary mortgage rate is a way that also creates lower rates but does not directly impact profitability,\" she said. Fratantoni asked about the effect of changes to Basel III regarding mortgage holdings. Right now, 25% of originations end up on depository balance sheets, he pointed. Sim said he believes this will marginally increase but it's not going to be a huge shift. The change i","published_at":1779124625000,"score":26,"tags":["housing","national","rates","policy","regulator"],"heat_signals":["fed","inflation","mortgage rate","30-year fixed","freddie mac","fannie mae","forecast"],"importance":4,"selector_reason":"讨论GSE购债对抵押贷款利率的压低作用，关系到二级市场和购房负担能力。主题具有全国性和政策金融属性，因此评为行业中等重要。","section":"national","title_zh":"GSE 买债支撑 mortgage rate","summary_zh":"若无 GSE 购买 securitized loans，mortgage rate 可能更高，购房负担获缓冲","impact":"neutral","id":"af25fa5f","fetched_at":1779155383489},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Ginnie Mae's Joseph Gormley sounds the alarm on ‘risk-layered’ FHA portfolios","link":"https://www.housingwire.com/articles/ginnie-mae-tpp-show-me/","description":"Ginnie Mae President Joseph Gormley , who is also serving as acting commissioner of the Federal Housing Administration (FHA), said the counterparties participating in Ginnie Mae’s program have evolved significantly since the Great Financial Crisis, with greater exposure to independent mortgage banks ( IMBs ) that have invested heavily in governance and risk management. Still, he cautioned that some “outliers” remain: “We can’t tell you how to run your business,” Gormley said during the Mortgage Bankers Association (MBA)&#8217;s Secondary and Capital Markets Conference in New York on Monday. “But we can say that we like to see companies that have a balanced portfolio.” Gormley added that recent changes to the loss-mitigation waterfall in the FHA and U.S. Department of Veterans Affairs ( VA ) channels have increased exposure for certain firms. Some companies, he said, acquired risk-layered portfolios with lower credit scores , higher debt-to-income (DTI) ratios and elevated loan-to-value (LTV) ratios — assets that can become difficult to finance or sell in stressed markets. “That’s something we are keeping a careful eye on,” Gormley said. He also said that Ginnie Mae has strengthened its oversight capabilities over the past decade through investments in technology, staffing and surveillance systems. “We’ve made a lot of investments in technology over the last decade, and in human capital as well. &#8230; Our surveillance tools have improved; it’s easier for us to see into that activity earlier on,” Gormley said. Ginnie Mae typically requires issuers to keep delinquencies at 5% or less of their portfolio. But changes to trial payment plan (TPP) loans were putting some issuers at risk of breaching these thresholds. An internal analysis showed that almost the entire recent uptick in FHA delinquencies could be ascribed to loans in TPP status. In response, Ginnie Mae in April temporarily removed TPP loans from delinquency calculations — a policy Gormley expects will remain &#8220;in place for a while.&#8221; Servicing liquidity To bolster servicing liquidity, Ginnie Mae is accelerating a loan-level transfer initiative. Currently, issuers create pools that can range from a handful to thousands of loans. But once these pools are issued, Gormley said, there are limited circumstances when a loan would come out — including early termination, payoff, or if the loan is bought out because it becomes seriously delinquent. “We&#8217;ve been working on an initiative to allow loan-level transfers in the program, and it&#8217;s something we’ve been increasing the velocity of change on over the last year,” he said. While the legal and policy frameworks are clear, modernizing the technology remains the primary hurdle. Ginnie Mae must track final certifications on a loan-level basis and establish a final cutoff date across the program. “We&#8217;ve begun some outreach to issuers to understand what burdens they would face in aligning to a single uniform standard, but that&#8217;s going to be a line of work that continues on through this year,” Gormley said. Gormley said there is also an ongoing effort to bifurcate acknowledgment agreements — the tri-party agreements between Ginnie Mae, an issuer and its financer. Partial claims Ginnie Mae is also working to attach its partial claims to first-lien mortgages. Currently, a partial claim acts as a subordinate federal lien, which creates substantial hurdles. For example, subordinate liens are subject to the Show Me decision , which requires judicial foreclosures even in non-judicial states. “No one really can figure out how that&#8217;s supposed to work,” Gormley said. “It impacts our recoveries because we find that at payoff, the partial claim that&#8217;s not attached is missed. It leads to a bunch of really unfortunate situations where the borrower forgot about this, and they&#8217;re getting chased down by collections at the end.” Flávia Furlan Nunes reported and wrote this article with drafting assis","published_at":1779137827000,"score":17,"tags": source_tags":["multifamily"],"region":"national","title":"BTR ban is gone in the revised ROAD to Housing bill. Here’s what else changed.","link":"https://www.multifamilydive.com/news/road-to-housing-bill-changes-house-senate/820520/","description":"An article from BTR ban is gone in the revised ROAD to Housing bill. Here’s what else changed. The House amended the major bipartisan housing legislation with some key differences from the Senate’s version. Published May 18, 2026 Julie Strupp Senior Editor Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Getty Images Listen to the article 5 min This audio is auto-generated. Please let us know if you have feedback . Last week, the U.S House of Representatives released an amended version of the Senate’s 21st Century ROAD to Housing Act that notably removes a provision the housing industry said would effectively eliminate the production of build-to-rent single-family housing. That’s not the only important change between the two versions of the major bipartisan housing legislation, however. The updated bill is set to come up for a House vote this week ahead of the Memorial Day holiday, Politico reported. If the legislation passes, it will move back to the Senate. The White House previously told Multifamily Dive that “there may be serious policy concerns or implementation challenges ” with the House’s version, but did not respond to another request for comment by publication time. Besides the build-to-rent forced sale provision, here is a look at some of the other differences the two chambers will need to iron out. HUD funding changes The House’s latest version of the bill increases Federal Housing Finance Agency-insured multifamily loan limits and indexes them for future gains. “Loan limits have remained static for 12 years and do not reflect market conditions,” the National Association of Homebuilders said in a May 15 analysis of the bill. “Increasing multifamily loan limits and indexing them for future gains aligns with real construction costs and helps stimulate new apartment development .” There are other major differences regarding HUD program funding, Francis Torres, director of the Bipartisan Policy Center’s housing and infrastructure projects, told Multifamily Dive. “The provision on the Rental Assistance Demonstration program permanence included in the Senate bill is out, so for public housing authorities that have serious capital needs, that's a significant omission,” Torres said. Also cut from the House’s version is a measure to permanently fund the agency’s Community Development Block Grant Disaster Recovery program. Currently, Congress appropriates these funds to HUD on a supplemental basis to help cities, counties, tribes and states recover from disasters, especially in low-income areas. “The Senate bill permanently authorized HUD's CDBG disaster recovery program, which is a key funding source for disaster-impacted communities to be able to rebuild after natural disasters, and that's no longer included in the new House version,” Torres said. Permitting updates The latest House version of the bill makes several changes to existing permitting requirements for multifamily projects. Section 207 streamlines National Environmental Policy Act requirements for a variety of HUD-funded activities, including 221(d)(4) loans , which developers and investors can use to build or rehabilitate a multifamily property. Certain housing projects with U.S. Department of Agriculture funding would also be exempt from environmental impact studies or reports. “Federally supported projects often trigger additional review,” according to Torres. “The bill explicitly adds infill projects of residential housing units to a list of categorically excluded activities, meaning they would get no federal environmental review.” Changes to HUD’s HOME Investment Partnerships Program , which provides grants to states and localities to create affordable housing for low-income households, would broaden eligible uses for the funding and also streamline environmental reviews. The bill also directs HUD to offer competitive grants for pilot programs to help it develop guidelines around single-staircase residential buildings. The is","published_at":1779133200000,"score":25,"tags":["btr-sfr","national","policy","regulator"],"heat_signals":["build-to-rent","btr","fed"],"importance":5,"selector_reason":"ROAD to Housing法案修订并移除BTR禁令，涉及联邦住房立法和机构化租赁住房监管。该法案若推进将影响全国住房供给、融资和BTR行业规则，属于系统性事件。","section":"btr","title_zh":"ROAD 法案修订删除 BTR 禁令","summary_zh":"House 版移除 BTR 强制出售条款，并拟提高 FHFA multifamily loan limits","impact":"long-pos","id":"e6eb1ef9","fetched_at":1779155383489},{"source_id":"rebusiness-online","source_name":"REBusiness Online","source_tier":"A","source_weight":6,"source_tags":["mixed-asset","deals"],"region":"national","title":"Cushman &#038; Wakefield Brokers $26.4M Sale of Build-to-Rent Community in Matteson, Illinois","link":"https://rebusinessonline.com/cushman-wakefield-brokers-26-4m-sale-of-build-to-rent-community-in-matteson-illinois/","description":"The Manors at Brookmere features 108 units and was built in 2016. Acquisitions Build-to-Rent Illinois Midwest Single-Family Rental Cushman Wakefield Brokers $26.4M Sale of Build-to-Rent Community in Matteson, Illinois by Kristin Harlow May 18, 2026 May 18, 2026 2 MATTESON, ILL. — Cushman Wakefield has brokered the $26.4 million sale of The Manors at Brookmere, a 108-unit build-to-rent (BTR) community in Matteson, a southern suburb of Chicago. Homebuilder Lennar developed the property in 2016. The transaction represents one of the first sales of a stabilized BTR community in Chicagoland, according to Cushman Wakefield. Brad Smith, Jack Maloney and Anna Lovell of Cushman Wakefield represented the seller, Haven Realty Capital. Ashland Capital was the buyer. The Manors at Brookmere consists of a collection of contiguous quadplex buildings offering two-story residences with two- and three-bedroom layo
