m competition, and that defects in the complaint's market definition and market power-related allegations required dismissal. Trenga said those arguments were not strong enough to dismiss the lawsuit, particularly in light of “the Court’s obligation at this procedural stage to consider the allegations of the Complaint in the light most favorable to the Plaintiffs, with all reasonable inferences drawn in their favor.” “The Plaintiffs have alleged facts that make plausible their claims under the Sherman Act (Count I), the Clayton Act (Count II), and the FTC Act (Count III),” Trenga said. Redfin said it strongly disagrees with the FTC’s allegations and remains confident it will be vindicated by a court of law, a Redfin spokesperson told Multifamily Dive in an email. “Our partnership with Zillow has given Redfin.com visitors access to more rental listings and our advertising customers access to more renters. By the end of 2024, it was clear that the existing number of Redfin advertising customers couldn’t justify the cost of maintaining our rentals sales force,” the spokesperson said. “Partnering with Zillow cut those costs and enabled us to invest more in rental-search innovations on Redfin.com, directly benefiting apartment seekers.” Zillow said in a statement following the denial that the decision simply allows the case to move forward. “We remain confident we will demonstrate the pro-competitive and consumer benef","published_at":1778786100000,"score":15,"tags":["housing","national","regulation","brokerage"],"heat_signals":["fed"],"importance":4,"selector_reason":"Zillow和Redfin需继续面对FTC及多州反垄断诉讼，影响全国租赁平台和住宅信息市场竞争格局。属于重要监管与平台行业事件，评为4。","section":"national","title_zh":"Zillow、Redfin 反垄断案继续推进","summary_zh":"FTC 指控$100M 合作压制 rental listing 竞争，平台监管风险上升","impact":"short-neg","id":"d5472bec","fetched_at":1778833559634},{"source_id":"austin-bj-cre","source_name":"Austin Business Journal — Commercial RE","source_tier":"D","source_weight":7,"source_tags":["austin","mixed-asset" ions were introduced in the Senate’s version of the bill in March, setting off a furious lobbying effort from both operators and affordable housing advocates who argued an effective ban on the business model would hinder housing supply. The addition of the amendments to the bill were enough to stifle activity in the sector in recent months. The bill cleared the Senate on March 12 and went to the House for approval, but it was frozen on arrival amid lobbying for changes to the restrictions. A bipartisan group of 76 House members said in an April 22 letter to the House majority and minority leaders, Republican Mike Johnson and Democrat Hakeem Jeffries, that they wouldn’t advance the legislation without the BTR restrictions being stripped from the bill. In its amended form, the bill creates a clear exemption for the BTR sector to continue acquiring and building homes. It prohibits large institutional investors, which it defines as firms with at least 350 homes in their portfolio, from directly or indirectly purchasing existing single-family homes, but it narrows the definition of a qualifying property and includes additional exceptions that allow for a broad range of investment activity in single-family housing. It defines a single-family home covered under the bill as “a property that contains 2 or fewer dwelling units that are each intended for residential occupancy by a single household.” But it creates exceptions for a property that “when occupied, has always been occupied by a renter” and manufactured homes . Properties that fail to meet local building codes or the standards for conventional mortgage financing are also exempted from the institutional acquisition ban, provided the buyer brings the home into compliance. Buyers were required to spend at least 15% of the purchase price of the home on renovations under the previous proposal, but that investment floor was removed in the latest round of changes. Private equity firms and other investors with large portfolios will be able to continue acquiring some types of housing, and the updated bill removes any forced-sale provisions and puts no cap on holdings. The bill explicitly states that nothing in the section related to BTR investment is meant to “require any covered large institutional owner to divest or otherwise sell any covered single-family home purchased before or after the date of enactment.” House members also added 12 new community banking provisions that aim to ease the regulatory burden at the same time the Federal Reserve is planning to loosen capital requirements for smaller lenders. Demand for BTR properties exploded during the pandemic, with construction volume rising 455% from 2019 through 2024. Rental homes accounted for more than 7% of home starts in the year that ended in September, with aro","published_at":1778761797000,"score":27,"tags":["btr-sfr","national","policy","regulator"],"heat_signals":["build-to-rent","btr","fed","occupancy"],"importance":4,"selector_reason":"国会住房法案删除build-to-rent禁令，直接影响BTR行业和机构持有独栋出租房的商业模式。属于重要联邦政策变化但尚非最终立法，评为4。","section":"btr","title_zh":"House 删除 BTR 七年出售禁令","summary_zh":"BTR 限制被移出住房法案，商业模式监管尾部风险明显下降","impact":"long-pos","id":"a299b3ae","fetched_at":1778833559634},{"source_id":"btrlist","source_name":"BTR List (via Google News)","source_tier":"B","source_weight":8,"source_tags":["btr-sfr"],"region":"national","title":"BTR Daily - May 14, 2026 - Four Corners acquires 157 homes - BTR List","link":"https://news.google.com/rss/articles/CBMiekFVX3lxTE1pbE1rejZlWl95T1BMdTdwMnFjWXBMWFJrcTMzVHFGQWZFX0o3bzg4VUxodm1NbDRxel9tODZwd2syeExjNDh6RGU3UmlVNjlnc21jbU13X3ZvakZyM3U0dnU3Ml8tM1I0ZlplNmxtM2pZTXVFQnB2NWNB?oc=5","description":"BTR Daily - May 14, 2026 - Four Corners acquires 157 homes &nbsp;&nbsp; BTR List","published_at":1778753789000,"score":17,"tags":["btr-sfr","national","deals","btr-operator"],"heat_signals":["btr"],"importance":2,"selector_reason":"Four Corners收购157套BTR/SFR住宅，直接涉及build-to-rent候选主题。单笔规模较小、影响有限，评为2。","section" in, according to Seeking Alpha. Blackstone's REIT reported to the U.S. Securities and Exchange Commission earlier this month that it anticipated returns of between 5.75% and 7% or more and planned to grant IPO investors additional shares — trading on the New York Stock Exchange under the ticker BXDC — equal to 1% of their investment amount. The IPO comes as more investors, especially on the institutional side, continue to pile in on data center investments amid the artificial intelligence boom, which is demanding more data center compute and power capacity globally. Private equity pumped more than $45B in 2025 into U.S. data centers, the highest total in five years, and more than 70% of the overall $63.35B invested in the space, S P Global Market Intelligence reported . This prompted JLL Vice Chairman Curt Holcomb to declare that the industry was at the start of a “supercycle development process,” where demand significantly outstripped supply. That investment appetite doesn’t appear to be waning in 2026. More than half of investors surveyed by CBRE for its annual data center investment intentions report say they would increase their outlay for the asset class by as much as 10% this year, with 55% saying they would increase investment even more. Half of those surveyed say they wanted investments in turnkey-wholesale, hyperscale and powered-shell centers. The U.S. tallied nearly 4,000 data centers as of Q3 2025, according to S P, with more than 2,600 operational, 265 under construction and 1,100 planned. Blackstone has yet to identify any purchases, and its BXDC fund is the largest blind pool — a fund that raises money before targeting specific investments — ever set up, according to Bloomberg. BXDC also could provide liquidity to developers and data center operators seeking to cash out on their projects amid a slump in sales in 2025, Bisnow previously reported . With more than $1.3T in assets under management, Blackstone inked $225B in data center transactions since
