ing behavior. As such, I am prepared to raise rates, if the expected disinflation does not appear in a timely manner.\" — Federal Reserve Gov. Lisa Cook. Forward Look: Half the members of the Federal Open Market Committee have now publicly backed the idea of abandoning a perceived bias toward easing monetary policy, instead suggesting the committee should shift to a more neutral stance. Economic conditions will likely have to weaken dramatically before the central bank will approve another interest rate cut. Federal Reserve Gov. Lisa Cook is the latest central bank official to take a hawkish view toward inflation. Processing Content In prepared remarks delivered Wednesday afternoon at Stanford University, Cook said the Fed should be prepared to raise interest rates if price growth remains elevated. She also echoed fears shared by other monetary policymakers that the public could be losing faith in the Fed's ability to return annualized inflation to 2%. \"After five years of above-target inflation, I am particularly attuned to the risk that elevated inflation will become embedded in price- and wage-setting behavior,\" Cook said. \"As such, I am prepared to raise rates if the expected disinflation does not appear in a timely manner.\" Cook also wants the Fed to be ready to lower interest rates if unemployment begins to rise, pointing to weak hiring figures and widespread economic uncertainty stemming from the U.S. war with Iran. Still, she said, the conflict's most pressing impact is its effect on oil prices and the downstream implications of higher energy costs. \"The risks remain tilted toward higher inflation,\" she said. Overall, Cook said she favors keeping the federal funds rate unchanged and allowing the economic outlook to play out further before adjusting policy. Cook joins several other members of the Federal Open Market Committee who have called for the body to adopt a neutral stance for its projected policy path. Three reserve bank governors — Cleveland's e months. Now, all eyes are on the Big Apple. With the nation&#8217;s largest public housing authority and its strongest tenant protections, the city is testing a harder proposition. Can a denser, older and more politically complex city do the same while protecting tenants from displacement? The affordable housing plan The plan, titled &#8220;Block by Block: The Housing Plan for a New Era,&#8221; commits more than $22 billion over five years. It addresses tenant protections, code enforcement, public housing repairs, zoning reform, homeownership and homelessness prevention. &#8220;New York cannot remain a city of opportunity if the people who make this city run are priced out of it,&#8221; Mamdani wrote in the report. During a press conference, he addressed the looming rent freeze directly. The Rent Guidelines Board is to vote in June on whether to freeze rents across the city&#8217;s roughly one million rent-regulated apartments, a signature Mamdani campaign pledge. The Mayor noted that the Department of Housing Preservation and Development (HPD) has existing tools available to distressed landlords on a case-by-case basis. He was firm that tenants would be protected. &#8220;No tenant would see their rent increase beyond that which the RGB determines,&#8221; he said. Beyond the rent debate, the plan&#8217;s centerpiece targets roughly 8,000 new affordable homes per year, leveraging the HPD toolbox. Of those, 30% will serve extremely low-income households. Another 20% will target very low-income residents. Production scales from 14,000 homes in fiscal year 2027 to more than 21,000 annually by fiscal year 2031. Enforcement and zoning Public housing is a central focus. The New York City Housing Authority serves more than 500,000 residents across 177,000 apartments in all five boroughs. The plan dedicates $5.6 billion in a five-year capital plan for the authority, the most in recent history. Funds target heating systems, elevators, roofs and mold remediation. On enforcement, the plan launches &#8220;Fix the City.&#8221; The program directs HPD to conduct roof-to-cellar inspections and pursue legal action against the city&#8217;s worst landlords. HPD fielded 835,011 code complaints in fiscal year 2025, an 18% jump over fiscal year 2023. The Bronx gets targeted attention. A new interagency initiative launches there in fall 2026, focusing on the South Bronx and Northwest Bronx, where 10% of households face an eviction filing every year. More than a quarter of Bronx households reported three or more serious maintenance deficiencies in their homes. On zoning, the plan pursues citywide transit-oriented development and an Affordable Housing Fast Track. Public review would be capped at 90 days, down from a typical seven months, in 12 underbuilt community districts. The urgency is plain. New market-rate apartments now rent for roughly $3,000 per month, nearly double the citywide average of $1,650. The plan also takes direct aim at homeownership gaps. It launches &#8220;Our Home,&#8221; a new program to convert rental buildings into resident-controlled cooperatives. HPD expects to support 300 new affordable co-op units in fiscal years 2027 and 2028. The plan also expands community land trust","published_at":1779912807000,"score":23,"tags":["housing","nyc","policy","construction","regulator"],"heat_signals":["texas","austin","annual","vacancy"],"importance":4,"selector_reason":"纽约市提出 220 亿美元、10 年建设和保全 40 万套可负担住房的计划，规模大且涉及密度规则变化。虽为地方政策，但对美国最大住房市场有显著影响，给 imp=4。","section":"national","title_zh":"Mamdani 推$22B NYC可负担住房计划","summary_zh":"10年新建20万套并保留20万套，靠 zoning reform 增供","impact":"long-pos","id":"9d7a9a8a","fetched_at":1779933582691},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"HUD Partially Rolls Back Environmental Review Rule","link":"https://www.bisnow.com/national/news/multifamily/hud-partially-rolls-back-environmental-review-rule-for-large-developments-134741","description":"News HUD Partially Rolls Back Environmental Review Rule National Multifamily View count: National Multifamily May 27, 2026 | 12:45 p.m. ET Matt Wasielewski, National President Donald Trump ’s housing department cut the final step in an environmental review process to accelerate the approval of large projects receiving federal support. Unsplash/SAMS Solutions The Department of Housing and Urban Development published an interim rule this month that removes a final layer of approval that was previously required for any multifamily project with more than 200 units or a mortgage above $5M receiving federal assistance. The change, which goes into effect on June 22, will primarily impact affordable housing developers. A public comment period regarding the change is open through July 21. Developers will no longer be required to get final approval from HUD clearance officers to move ahead on a project, a step that HUD argues is duplicative and unnecessarily lengthens the regulatory approval timeline. The existing rule “has the potential to add processing time to projects that often have very tight closing deadlines. It also requires a duplicative technical assistance process where technical assistance is already available,” HUD says in the interim rule filing. The rule requiring environmental reviews was introduced in 1971, but it wasn’t until 1996 that an additional sentence was added requiring the final approval. HUD argues that the last round of oversight isn’t required by law and repeats already completed environmental reviews. The agency says it is amending the rule as part of the Trump administration’s broader push to slash government regulation, specifically the president’s Unleashing American Energy executive order that was among the raft of orders Trump signed to fanfare on the day of his inauguration. HUD Secretary Scott Turner has quickly worked to reshape the department to promote the White House agenda. He vowed to cut red tape at a conference in Miami two months after he was confirmed to the post and has made good on the promise with rollbacks of rules around eviction and energy-efficiency standards . Turner has also used the levers of housing assistance for immigration policy. In January, HUD gave landlords a month to prove roughly 200,000 tenants were eligible to receive assistance after it said it had identified 25,000 deceased renters and 6,000 “ineligible non-American tenants” on its benefits rolls. A month later, the agency announced plans to push families with mixed immigration status off of housing aid, drawing criticism from tenant advocates. Trump also signed two executive orders in March that are aimed at boosting housing development. The first called on agencies to remove regulatory barriers that the White House says are holding back development, and the second called on Congress to ease regulations and allow community banks to underwrite more mortgages. Contact Matt Wasielewski at matthew.wasielewski@bisnow.com Related Topics: Donald Trump , affordable housing , HUD , environment , Affordable Housing Development , Department of Housing and Urban Development , environmental issues , environmental review , Scott Turnerr","published_at":1779895255000,"score":14,"tags":["multifamily","national","policy","regulator"],"heat_signals":["fed"],"importance":4,"selector_reason":"HUD 部分回滚联邦支持大型项目的环境审查规则，可能加快多户及开发项目审批。属于重要联邦住房和开发监管变化，给 imp=4。","section":"national","title_zh":"HUD 放松大型 multifamily 环评审批","summary_zh":"200套以上或$5M贷款项目少一层审批，6月22日生效提速开发","impact":"long-pos","id":"88c6bb98","fetched_at":1779933582691},{"source_id":"national-mortgage-news","source_name":"National Mortgage News","source_tier":"A","source_weight":7,"source_tags":["rates","macro"],"region":"national","title":"CFPB sued over new rule that would weaken fair-lending laws","link":"https://www.nationalmortgagenews.com/news/cfpb-sued-over-new-rule-that-would-weaken-fair-lending-laws","description":"Housing advocates and compliance firms are suing to block a rule from the Consumer Financial Protection Bureau that they say guts the Equal Credit Opportunity Act.","published_at":1779920659000,"score":13,"tags":["housing","national","regulation","policy","regulator"],"heat_signals":[],"importance":4,"selector_reason":"住房倡议组织起诉 CFPB，试图阻止削弱公平贷款法律的新规则。公平贷款监管影响全国住房金融合规框架，给 imp=4。","section":"national","title_zh":"CFPB 弱化 fair-lending 新规遭起诉","summary_zh":"住房组织称新规削弱 Equal Credit Opportunity Act，诉讼增加监管不确定性","impact":"neutral","id":"20187303","fetched_at":1779933582691},{"source_id":"realtor-news","source_name":"Realtor.com News","source_tier":"A","source_weight":6,"source_tags":["housing"],"region":"national","title":"Florida Gov. Ron DeSantis Unveils His Plan To Virtually Eliminate Property Taxes","link":"https://www.realtor.com/news/real-estate-news/ron-desantis-florida-property-taxes-eliminate-ballot-proposal/","description":"DeSantis called for a special legislative session to begin Monday, when state lawmakers can consider his proposal for a ballot initiative.","published_at":1779907469000,"score":10,"tags":["housing","florida","policy","regulator"],"heat_signals":[],"importance":4,"selector_reason":"佛州州长提出几乎取消房产税并召开特别立法会推动公投，若落地将重塑大型 Sun Belt 住宅市场财政和持有成本。属于重要州级政策变化，给 imp=4。","section":"sunbelt","title_zh":"DeSantis 拟基本取消 Florida property tax","summary_zh":"州长要求特别会期推进公投，若落地将重塑地方财政与持有成本","impact":"long-pos","id":"94c581fd","fetched_at":1779933582691},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Scale is now table stakes for private builders, Eastwood proves it","link":"https://www.housingwire.com/articles/eastwood-atlanta-builder-ma/","description":"Word that Eastwood Homes would acquire Atlanta-based Peachtree Building Group on Tuesday came as any private-to-private combination might. An energized, well-led, fast-growing Carolinas-based private homebuilder was expanding its reach and deepening its foothold in one of America’s most strategically attractive housing markets. What we learn as the story behind the transaction – the one that emerged in exclusive conversations Wednesday with Eastwood Homes CFO Kevin Hutchins and Peachtree Building Group principal Doug Cotter – is what makes us love waking up and showing up at work each day. Contrary to time-honored truisms that homebuilder M A is always and only driven by the tangible land assets being traded, this one was not simply a land-and-lots deal. Rather, the Eastwood-PBG deal speaks deeply of a strategic combination forged around two increasingly powerful forces reshaping American homebuilding: the urgent economics of scale and the enduring value of culture, trust, and good old you-know-it-when-you-see-it operating fit. Those forces may explain why private-to-private transactions have become one of the most meaningful, if less flashy, dynamics in today’s homebuilding M A environment. According to JTW Advisors’ latest industry M A analysis, private builders accounted for 39% of homebuilder acquisition activity in 2025 through April 2026 – surpassing public builder acquirers at 26% and Japanese strategic buyers at 30%. That marks a striking shift in industry power dynamics. And Eastwood’s Atlanta move offers a revealing case study in why. Scale is no longer a public builder luxury For years, the conversation about scale in homebuilding belonged primarily to the public builders. The publics’ advantages need hardly be mentioned … again: lower capital costs, national purchasing leverage, deeper infrastructure, broader operating footprints, and the ability to spread overhead across much larger production platforms. Private builders have counterpunched through the cycles. They seize on the off-market parcels, draft off the traffic-driving public communities’ promotions, play off price- and personalization, and product spec, with agility, entrepreneurial decision-making, intimate knowledge of local markets and cultural cohesion. Inexorably, however, the math is forcing even private operators to confront a set of harsher realities: higher-for-longer capital costs, construction trade uncertainty in “datageddon,” direct cost inflation and volatility, cost-of-living-constrained households, and jittery people. Scale has become operationally a non-negotiable. “Atlanta – 30,000 to 40,000 permits a year – and you just got to have scale to get your part of the market here,” Hutchins said. “For us, this is part of our strategy to help move that forward and get scale.” Hutchins’ take may apply to the specifics of the Eastwood-PBG combo, but it underscores more than Eastwood’s Atlanta ambitions. A strategic shift has already taken hold among a growing class of well-capitalized multi-regional private builders that increasingly recognize scale not as nice-to-have, but as competitive table stakes. Eastwood’s acquisition of Peachtree instantly transforms its Atlanta operating relevance. The combination takes Eastwood from roughly 120 annual closings in Atlanta to something approaching 350-400 homes, depending on the production cadence. If you think that’s just about bragging rights, consider this: “When you look at scale, you look at operational scale – not employee scale,” Hutchins said. “We can now go to our trade partners and say, ‘Hey, Eastwood, we were doing 120 homes. Well, now with this acquisition, we’re up to close to 400 homes. What kind of pricing do I get today versus that? What kind of crews do I get today?’” The Eastwood team’s ability to jump that fence may be among the most operationally important takeaways from this deal. Why? Scale is not merely about lower pricing. It’s about the doors that open to a favored-nation partner ","published_at":1779917728000,"score":25,"tags":["housing","atlanta","deals","homebuilder"],"heat_signals":["inflation","permits","annual","housing market"],"importance":3,"selector_reason":"Eastwood 收购 Atlanta 建商反映私营住宅建商通过规模  land-bank transactions, according to a statement. Oliver Nisenson, PGIM’s head of private asset-based finance, framed the strategy as a way for lenders to step into a role builders increasingly want to avoid. “Homebuilders want to manufacture homes, not own land,” Nisenson said. SIGN UP The push also reflects a broader migration among institutional investors toward asset-based finance, where loans are secured by hard assets instead of broader corporate credit. For firms like PGIM, land banking offers exposure to the long-term demand story behind U.S. housing while avoiding some of the volatility tied to direct development bets. The strategy is catching on elsewhere across Wall Street. Guggenheim Investments recently struck a similar partnership with Bedrock Land Finance, which said it aims to fund $5 billion in residential development projects over the coming years through lending relationships and institutional backing. FivePoint Holdings and Blue Owl Capital also recently launched a partnership to buy up to $1.7 billion of land in the U.S. housing market for land banking. The influx of capital arrives as many public homebuilders remain focused on conserving cash and maintaining flexibility in a still-uneven housing market. Builders have wrestled with elevated financing costs, labor shortages and affordability pressures. — Holden Walter-Warner Read more Commercial New York Fetner, PGIM team up on $65M Columbia student housing buy","published_at":1779903538000,"score":19,"tags":["housing","national","deals","institutional"],"heat_signals":["pgim","housing market"],"importance":5,"selector_reason":"PGIM 通过合作关系完成约 40 亿美元住宅 land-bank 融资，显示机构资本大规模进入 homebuilder 土地融资。金额巨大且影响住宅开发资金链，给 imp=5。","section":"institutional","title_zh":"PGIM $4B 加码 homebuilder land bank","summary_zh":"与 Domain 完成7笔 land-bank 交易，帮 builder 保流动性与土储","impact":"long-pos","id":"acb71e12","fetched_at":1779933582691},{"source_id":"trd-national","source_name":"The Real Deal (National)","source_tier":"A"
