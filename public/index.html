rce_id":"nahb-eyeonhousing","source_name":"NAHB Eye on Housing","source_tier":"B","source_weight":8,"source_tags":["data","trend","policy"],"region":"national","title":"Single-Family Permitting Weakens While Multifamily Activity Remains Stronger","link":"https://eyeonhousing.org/2026/11/single-family-permitting-weakens-while-multifamily-activity-remains-stronger/","description":"Single-Family Permitting Weakens While Multifamily Activity Remains Stronger November 16, 2026 Danushka Nanayakkara-Skillington No Comments Residential permitting activity continued to show divergent trends across the single-family and multifamily sectors through September 2026. Single-family permitting remained under pressure, with year-to-date activity declining from a year earlier amid ongoing housing affordability challenges and elevated construction costs. In contrast, multifamily permitting recorded growth, reflecting stronger activity in several regions and states. Over the first nine months of the year, the number of single-family permits issued nationwide reached 689,884. Compared with the same period in 2025, this represents a 3.0% decline from the September 2025 total of 711,020. In contrast, multifamily permitting activity remained stronger, with 393,778 permits issued nationwide, marking a 4.1% increase compared with the same period last year. Regionally, year-to-date single-family permitting declined in three out of the four regions through September. The Midwest was the only region to post an increase, with single-family permits rising 0.6%. The South declined 1.9%, the West fell 5.7%, and the Northeast posted the largest decline at 11.8%. Multifamily permits increased in three of the four regions, led by the Northeast (28.2%), followed by the West (9.7%), and the Midwest (5.3%). The South was the only region to post a decline, with multifamily permits falling 5.8%, driven largely by reduced permitting activity in major metropolitan areas across the region. At the state level, 19 states and the District of Columbia recorded increases in single-family permits compared with the same period last year, with gains ranging from 45.5% in the District of Columbia to 0.5% in Wisconsin. The remaining 31 states posted declines. Nevada recorded the steepest decline, with single-family permits falling 25.2%. The ten states issued the highest number of single-family permits accounted for 62.2% of all single-family permits issued nationwide. Texas led the nation with 108,433 permits issued through September 2026, although this represented a 3.1% decline from the same period in 2025. Florida, the second-highest state, recorded a 0.6% decline, while North Carolina, ranking third, posted a 7.9% decrease. Through September, 29 states and the District of Columbia recorded increases in multifamily building permits, while 21 states experienced declines. Kansas posted the largest percentage increase, with multifamily permits rising 99.6%, from 3,041 to 6,071 units. In contrast, Vermont recorded the steepest decline, with permits falling 72.1%, from 982 to 274 units. The ten states issued the highest number of multifamily permits accounted for 60.8% of all multifamily permits issued nationwide. Through the first nine months of 2026, Texas, which issued the largest number of multifamily permits, posted a 17.9% decline compared with the same period last year. California, the second-highest state, recorded a 23.2% increase, while Florida, ranking third, saw multifamily permits decrease by 24.2%. At the local level, the following are the ten metropolitan areas with the highest number of single-family permits issued. Below are the ten metropolitan areas with the highest levels of multifamily permitting activity. regions/divisions , state and local data , state data , state permits Prev Previous Building Material Price Inflation Remains High Despite Energy Price Declines Leave a Reply Cancel reply Your email address will not be published. Required fields are marked *  under pressure, with year-to-date activity declining from a year earlier amid ongoing housing affordability challenges and elevated construction costs."},{"id":"body-3","text":"In contrast, multifamily permitting recorded growth, reflecting stronger activity in several regions and states."},{"id":"body-4","text":"Over the first nine months of the year, the number of single-family permits issued nationwide reached 689,884."},{"id":"body-5","text":"Compared with the same period in 2025, this represents a 3.0% decline from the September 2025 total of 711,020."},{"id":"body-6","text":"In contrast, multifamily permitting activity remained stronger, with 393,778 permits issued nationwide, marking a 4.1% increase compared with the same period last year."},{"id":"body-7","text":"Regionally, year-to-date single-family permitting declined in three out of the four regions through September."},{"id":"body-8","text":"The Midwest was the only region to post an increase, with single-family permits rising 0.6%."},{"id":"body-9","text":"The South declined 1.9%,"}],"keep":true,"importance":4,"section":"national","capital_focus":false,"geo_evidence":null,"primary_event":"market_research_policy","event_evidence_id":"body-4","event_evidence":"Over the first nine months of the year, the number of single-family permits issued nationwide reached 689,884.","market_evidence_id":"body-4","market_role":"market_policy","market_scope":"us","market_evidence":"Over the first nine months of the year, the number of single-family permits issued nationwide reached 689,884.","duplicate_of":null,"selector_reason":"NAHB新增许可数据表明前九个月单户许可同比下降3.0%至689,884套，而多户许可同比增长4.1%至393,778套，清晰呈现供给分化。","title_zh":"单户住宅许可下降，多户住宅许可增长","summary_zh":"NAHB 称，截至 9 月，全国单户住宅许可年初至今为 689,884 套，同比下降 3.0%；多户住宅许可为 393,778 套，同比增长 4.1%。","impact":"neutral","evidence_quote":"Single-Family Permitting Weakens While Multifamily Activity Remains Stronger November 16, 2026 Danushka Nanayakkara-Skillington No Comments Residential permitting activity continued to show divergent trends across the single-family and multifamily sectors through September 2026. Single-family permitting remained under pressure, with year-to-date activity declining from a year earlier amid ongoing housing affordability challenges and elevated construction costs.","evidence_basis":"body","cre_subcategory":null},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Legislative risk continues to cloud BTR’s capital outlook; here's why","link":"https://www.housingwire.com/articles/btr-legislative-uncertainty-capital/","description":"Despite securing carve-outs from the 21st Century ROAD to Housing Act 's institutional investor ban, build-to-rent (BTR) and single-family rental (SFR) operators continue to grapple with lingering legislative uncertainty that weighs on capital availability and new construction, both of which dramatically lag 2025 levels. According to the National Apartment Association ’s Q3 2026 Market Pulse , released Nov. 5, BTR units under construction fell 18.5% year over year, newly completed units declined 40.2% and sales volume of communities dropped 51.5%. Even against a broader nationwide slowdown in residential construction , the declining BTR pipeline continues to stand out. The industry's legislative uncertainty initially stemmed from an earlier version of ROAD, first introduced in March, that would have required investors and developers to sell newly built rental homes to individual buyers after seven years. The provision, among others, threatened the viability of the BTR business model, prompting investors to pull back from committing capital to new projects. Although the final version of ROAD exempted and protected BTR, uncertainty remains around how Treasury will implement the institutional investor ban, along with the potential for new federal and state legislation that could impose further institutional ownership restrictions. That lingering uncertainty continues to weigh on capital flowing into the industry. “I would say it hasn't normalized. In other words, it wasn't where it was a year ago, where capital was really flowing into the business,” Richard Ross, CEO at QuinnResidences , said when discussing the BTR market, in an interview with HousingWire TBD . “I almost don’t care what the rules are, as long as you tell me what the rules are,” Ross added. “With uncertainty, people just aren’t going to invest.” Uncertainty is still taking a toll Ross cited the Strait of Hormuz as a timely and illustrative comparison. While oil is still moving through the Strait, traffic remains more restricted than it was a year ago. BTR, he suggested, finds itself in a comparable position. “Capital's coming in, but it's not like it was pre-ROAD. The hope was that the regulatory process would give some clarity. And I think once it gets done, it will provide clarity, but you might remember this was only part one of the regulatory process,” he said, pointing to the prospects of a “ROAD 2.0” housing bill. “Until capital knows what the rules are, it's really hard for them to write checks. According to Sean Dobson, chairman, CEO and CIO at The Amherst Group , a builder, buyer and manager of single-family rentals, the capital environment for BTR had been flashing signs of softening even before the federal government introduced the idea of an institutional investor ban. New projects often came with modest returns, and rent growth was moderating or even falling across many high-growth Sun Belt markets. Add a steady drumbeat of policy risk from Washington, and many investors have simply taken their money elsewhere. “When you add policy uncertainty to the asset, it just doesn't have the return to pay for that,” Dobson said in an interview. Invitation Homes CEO Dallas Tanner also acknowledged that the capital environment hasn’t bounced back from an uncertain 2026 during the company’s Q3 2026 earnings call on October 29. \"Capital's just starting to poke its eyes up after the ROAD Act piece of it. The market's still trying to find itself,” Tanner said. In a Q3 2026 Form 10-Q document filed with the United States Securities and Exchange Commission (SEC) on November 5, 2026, AMH also called out ongoing legislative uncertainty as a concern. “Further, the ROAD Act and the prospect of other such laws or regulations have adversely impacted and may in the future continue to adversely impact our access to capital markets and the attractiveness of our securities to certain investors,” the document warned. The uncertainty surrounding Treasury’s proposed rulemaking The U.S. Department of the Treasury , which implements the institutional investor ban included in ROAD, released a notice of proposed rulemaking in October that would grant BTR communities a range of notable exemptions from the ban. However, concerns remain about some of Treasury’s proposed interpretations. “If you read the law as a layman, you’d say, 'all right, built-to-rent is carved out.' But then you get this rulemaking, and it’s like you have to pat your belly and tap your head and hop on one foot for the built-to-rent to not be banned,” Dobson said. Quinn Residences, in an open letter to Treasury, outlined several concerns about Treasury’s proposed rulemaking. Chief among them is a proposal to exempt purpose-built BTR communities from the institutional investor ban provided they haven’t been owner-occupied and are purchased within 18 months of receiving a certificate of occupancy. Ross argued that this timeline isn’t sufficient, as the 18-month certificate-of-occupancy requirement could prevent institutional investors from acquiring purpose-built rental homes that have been operating as rentals for more than 18 months, even if they have never been owner-occupied. And building and stabilizing a community typically takes about 30 months, longer than the rule allows, Ross argued. The rule, therefore, could prevent subsequent sales of newly built BTR homes among institutional investors, effectively limiting the pool of potential buyers and potentially discouraging investment into new projects. Ross also signaled his opposition to another one of Treasury’s proposed rulemakings that would fail to exempt single-plat BTR communities zoned for multifamily use, despite congressional record statements indicating lawmakers intended those properties to be excluded from the ban. For The Amherst Group, uncertainty continues to obscure how Treasury will define the exception for homes requiring substantial repairs under the ROAD institutional investor ban. Many of Amherst’s acqu","published_at":1794607102000,"mutable":false,"date_precision":"timestamp","modified_at":1794607104000,"extraction":"semantic","canonical":"https://housingwire.com/articles/btr-legislative-uncertainty-capital","content_hash":"2b1680731ece468a38cd67e0c266f8aadf9cbe555bed4012f41b6e3895b3fa22","access":"public","evidence_status":"article","id":"a011916a1c449593","source_family":"housingwire","is_research":false,"required_source":false,"first_seen_at":1794778664289,"acquisition_window":{"lower":1794517200000,"upper":1794776400000},"late_discovery":true,"score":51,"tags":["btr-sfr","national","policy","construction","btr-operator"],"heat_signals":["build-to-rent","btr","single-family rental","invitation homes","amh","dallas","sun belt","fed","outlook","year over year","rent growth","occupancy"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Legislative risk continues to cloud BTR’s capital outlook; here's why"},{"id":"body-1","text":"Despite securing carve-outs from the 21st Century ROAD to Housing Act 's institutional investor ban, build-to-rent (BTR) and single-family rental (SFR) operators continue to grapple with lingering legislative uncertainty that weighs on capital availability and new construction, both of which dramatically lag 2025 levels."},{"id":"body-2","text":"According to the National Apartment Association ’s Q3 2026 Market Pulse , released Nov. 5, BTR units under construction fell 18.5% year over year, newly completed units declined 40.2% and sales volume of communities dropped 51.5%."},{"id":"body-3","text":"Even against a broader nationwide slowdown in residential construction , the declining BTR pipeline continues to stand out."},{"id":"body-4","text":"The industry's legislative uncertainty initially stemmed from an earlier version of ROAD, first introduced in March, that would have required investors and developers to sell newly built rental homes to individual buyers after seven years."},{"id":"body-5","text":"The provision, among others, threatened the viability of the BTR business model, p"}],"keep":true,"importance":4,"section":"btr","capital_focus":false,"geo_evidence":null,"primary_event":"market_research_policy","event_evidence_id":"body-2","event_evidence":"According to the National Apartment Association ’s Q3 2026 Market Pulse , released Nov. 5, BTR units under construction fell 18.5% year over year, newly completed units declined 40.2% and sales volume of communities dropped 51.5%.","market_evidence_id":"body-1","market_role":"market_policy","market_scope":"us","market_evidence":"Despite securing carve-outs from the 21st Century ROAD to Housing Act 's institutional investor ban, build-to-rent (BTR) and single-family rental (SFR) operators continue to grapple with lingering legislative uncertainty that weighs on capital availability and new construction, both of which dramatically lag 2025 levels.","duplicate_of":null,"selector_reason":"NAA Q3数据表明BTR在建量同比下降18.5%、完工量下降40.2%、社区交易量下降51.5%，并指出立法不确定性持续压制资本和新建。","title_zh":"立法不确定性继续压制 BTR 资本与建设","summary_zh":"HousingWire 报道称，尽管 BTR 获得制度豁免，行业仍面临规则实施不确定性；BTR 在建单元同比下降 18.5%，新完工量下降 40.2%，社区销售量下降 51.5%。","impact":"long-neg","evidence_quote":"Despite securing carve-outs from the 21st Century ROAD to Housing Act 's institutional investor ban, build-to-rent (BTR) and single-family rental (SFR) operators continue to grapple with lingering legislative uncertainty that weighs on capital availability and new construction, both of which dramatically lag 2025 levels. According to the National Apartment Association ’s Q3 2026 Market Pulse , released Nov.","evidence_basis":"body","cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Members Of Congress Have Questions For Brookfield After Its Mass Mobile Home Purchase","link":"https://www.bisnow.com/news/national/capital-markets/brookfield-quietly-buys-sprawling-mobile-home-community-portfolio-members-of-congress-have-questions","description":"Brookfield quietly closed on the acquisition of the largest privately held manufactured housing portfolio in the United States this year, prompting some members of Congress to inquire about the investment giant’s plans for the properties it now owns. Bisnow/Ethan Rothstein Brookfield purchased Yes Communities from GIC, Singapore’s sovereign wealth fund, in the second quarter, public filings and statements from Brookfield management indicate. Brookfield hasn’t publicized its acquisition of the Denver-based operator of nearly 300 manufactured home developments, but three Democrats from the House of Representatives nonetheless sent a letter to the firm last month voicing concern about the purchase and seeking pledges for tenant protections. Reps. Maxwell Alejandro Frost, Gabe Vasquez and Rashida Tlaib asked management at New York-based Brookfield Asset Management, the publicly traded arm of Toronto-based Brookfield, and Brookfield Real Estate Group to provide assurances that residents’ quality of life wouldn’t be impacted by the deal. The representatives gave BAM until Nov. 20 to respond. The asset management giant hadn’t yet replied as of mid-November, Frost’s office confirmed to Bisnow on Nov. 9. Brookfield didn’t respond to multiple requests for comment. It hasn’t formally announced the acquisition, which was first rumored to be in the works in September 2025, but BAM said in second-quarter filings with the Securities and Exchange Commission that it acquired “the largest privately held U.S. manufactured home portfolio.” Yes Communities operates more than 55,000 housing sites across the U.S., with a focus on the Southwest, Midwest and Southeast. A purchase price for the portfolio is unknown, but BAM said it spent $5.2B in the second quarter on its real estate business, including the manufactured home portfolio and the take-private of an industrial outdoor storage portfolio. Brookfield announced a $1.2B all-cash deal in February to buy Peakstone Realty Trust, a REIT with 60 IOS properties and 16 traditional industrial assets. In its second-quarter filings, Brookfield Real Estate Income Trust disclosed a new investment in a 2% ownership interest in 294 manufactured housing properties at a book value of $86.6M, which aligns with the number of properties under the Yes Communities banner. BAM Chief Financial Officer Hadley Peer Marshall also disclosed on the second-quarter earnings call that a Brookfield fund had made its first investment by deploying capital to Yes Communities. Other affiliates of Brookfield may have also contributed capital for the Yes Communities acquisition. Brookfield REIT said in an investor presentation on its website that as of Sept. 30, it owned a 294-community manufactured housing portfolio across 23 states, the same number of states Yes Communities is active in. Wikimedia Commons; Office of Maxwell Frost Democratic Reps. Rashida Tlaib, Gabriel Vasquez and Maxwell Frost have asked Brookfield about its acquisition of Yes Communities. Executives from Brookfield held one virtual meeting with residents and their advocates following the acquisition that was facilitated by the Private Equity Stakeholder Project and MHAction, two nonprofit advocacy groups, PESP confirmed to Bisnow . GIC and another unnamed institutional investor acquired a 71% equity interest in Yes Communities in 2016, with Stockbridge Capital Group holding on to the remaining stake. Brookfield was reportedly in talks with GIC about acquiring its stake for more than $10B, and it is unclear exactly the size of Brookfield's interest in Yes Communities or how much it paid. In their letter from Oct. 13, the three members of Congress sought details about the acquisition. The letter outlines previous tenants' complaints with Yes Communities for high rent increases, excessive fees and neglect of routine maintenance and says that Brookfield “has the opportunity to change this scenario” and “support meaningful protections for its residents.” “Given the challenges our constituents have experienced at Yes! properties, as well as broader concerns about the private equity business model, we seek assurances that Brookfield will prioritize improving residents’ quality of life and protecting their economic and housing stability, rather than exacerbating the economic challenges they already face,” the representatives wrote. The letter specifically asks Brookfield to disclose whether it plans to increase rents by more than 3% annually, to outline its policy regarding new and existing fees, and to confirm whether it will refrain from serial eviction filings for routine rent collection. The letter asks BAM to commit to meet regularly with tenants and to cooperate with tenant groups that are seeking to collectively purchase their communities. Corporate ownership of single-family properties has for a decade been an issue in some political corners, but it spilled into the mainstream in recent years, including with the debate around the 21st Century Road to Housing Act and the focus on affordability from candidates in midterm races across the country. The housing legislation that made it to the president’s desk includes new restrictions on existing home purchases from institutional investors but carves out broad exemptions for new development of single-family communities built as rentals. The Government Accountability Office examined investor ownership of single-family homes in Cincinnati, Dallas, Nashville, Phoenix, Seattle and Jacksonville, Florida, and found that institutional owners held 1% to 3% of all single-family homes in the area. But the March analysis found wide differences across the six cities examined, and corporate landlords own more than 10% of the single-family housing stock that is available for rent in half the cities surveyed. Institutional landlords owned 22% of the single-family rental stock in Jacksonville in 2024, the most recent year data was available, and 13% each in Nashville and Phoenix. In Dallas, 9%","published_at":1794611123000,"mutable":false,"date_precision":"timestamp","modified_at":1794611168000,"extraction":"semantic","canonical":"https://bisnow.com/news/national/capital-markets/brookfield-quietly-buys-sprawling-mobile-home-community-portfolio-members-of-congress-have-questions","content_hash":"cfbf0a04472e2e4aabfce74efcc47cff2fc55dd0107699307cf6fa9dae4ac73f","access":"public","evidence_status":"article","id":"e1058b90ddf4bb57","source_family":"bisnow","is_research":false,"required_source":false,"first_seen_at":1794778664289,"acquisition_window":{"lower":1794517200000,"upper":1794776400000},"late_discovery":true,"score":22,"tags":["housing","national","deals","policy","institutional"],"heat_signals":["single-family rental","dallas","brookfield","annual"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Members Of Congress Have Questions For Brookfield After Its Mass Mobile Home Purchase"},{"id":"body-1","text":"Brookfield quietly closed on the acquisition of the largest privately held manufactured housing portfolio in the United States this year, prompting some members of Congress to inquire about the investment giant’s plans for the properties it now owns."},{"id":"body-2","text":"Bisnow/Ethan Rothstein Brookfield purchased Yes Communities from GIC, Singapore’s sovereign wealth fund, in the second quarter, public filings and statements from Brookfield management indicate."},{"id":"body-3","text":"Brookfield hasn’t publicized its acquisition of the Denver-based operator of nearly 300 manufactured home developments, but three Democrats from the House of Representatives nonetheless sent a letter to the firm last month voicing concern about the purchase and seeking pledges for tenant protections."},{"id":"body-4","text":"Reps. Maxwell Alejandro Frost, Gabe Vasquez and Rashida Tlaib asked management at New York-based Brookfield Asset Management, the publicly traded arm of Toronto-based Brookfield, and Brookfield Real Estate Group to provide assurances that residents’ qu"}],"keep":true,"importance":4,"section":"institutional","capital_focus":true,"geo_evidence":null,"primary_event":"capital_governance","event_evidence_id":"body-1","event_evidence":"Brookfield quietly closed on the acquisition of the largest privately held manufactured housing portfolio in the United States this year, prompting some members of Congress to inquire about the investment giant’s plans for the properties it now owns.","market_evidence_id":"body-1","market_role":"capital_subject","market_scope":"us","market_evidence":"Brookfield quietly closed on the acquisition of the largest privately held manufactured housing portfolio in the United States this year, prompting some members of Congress to inquire about the investment giant’s plans for the properties it now owns.","duplicate_of":null,"selector_reason":"Brookfield收购美国最大私人制造住房组合后，国会议员要求其说明租户保护和运营计划，涉及近300个社区的机构资本治理风险。","title_zh":"国会议员要求 Brookfield 提供移动房屋租户保障","summary_zh":"Brookfield 收购 Yes Communities 后，3 名众议员致函要求承诺保护租户权益；该运营商在全美拥有超过 55,000 个住房用地，Brookfield 尚未公开回应。","impact":"neutral","evidence_quote":"Brookfield quietly closed on the acquisition of the largest privately held manufactured housing portfolio in the United States this year, prompting some members of Congress to inquire about the investment giant’s plans for the properties it now owns. Bisnow/Ethan Rothstein Brookfield purchased Yes Communities from GIC, Singapore’s sovereign wealth fund, in the second quarter, public filings and statements from Brookfield management indicate.","evidence_basis":"body","cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Where Developers Are Trying To Lease Public Lands To Build Data Centers","link":"https://www.bisnow.com/news/national/data-center-development/developers-are-trying-to-lease-public-lands-to-build-data-centers","description":"More than a dozen huge pieces of public land may soon be part of the United States’ arsenal in the global race for artificial intelligence supremacy. The Bureau of Land Management and the Department of Energy are considering leasing at least 17 public land parcels totaling 19,200 acres to developers that plan to build data centers and power infrastructure on the land, a Bisnow analysis of public records found. Just two companies are responsible for more than half of the filings. “This is a new strategy by the Trump administration,” said Chinonso Anozie, an assistant professor at the University of Houston Law Center. “What it would do is remove a lot of local opposition and local vetoes over some of these data centers, limiting what states and local communities can also do in challenging and stopping data centers.” Flickr/Bureau of Land Management The Morley Nelson Snake River Birds of Prey National Conservation Area in Idaho, where the Bureau of Land Management is considering leasing a parcel of public land for a data center development Bisnow verified 17 proposed projects with the BLM and DOE that are either approved or pending authorization by cross-referencing federal agency records and press releases with data center trackers from two conservation and public lands advocacy groups: the Center for Western Priorities and More Than Just Parks . The majority of those projects, excluding separate land parcels for power stations, are in the western U.S., while a smattering of sites are in the Southeast. The filings show that developers are jumping on the opportunity to lease public lands, catalyzed by a July 2025 White House initiative to accelerate the country’s AI industry and by last year’s One Big Beautiful Bill Act . Using public lands also means the federal government can flex the supremacy clause, a constitutional provision that gives federal law priority over some state laws . This tool could help developers skirt a broad cultural pushback against data centers. Industry advocacy group Data Center Coalition praised the Trump administration and the DOE for the policy initiative. “The digital infrastructure that data centers provide is essential to advancing America’s global economic competitiveness, safeguarding national security, and maintaining the country’s edge in cloud computing, artificial intelligence, and many other 21st-century technologies,” Michele Nellenbach, the trade group’s vice president of federal affairs, said in a statement. But elected officials are already speaking out against leasing public lands for data center development in Idaho and Kentucky. A lack of local support could still hamper proposals far away from towns and cities, said John Boyd Jr., principal at site selection firm The Boyd Co. “Companies routinely look for some type of public-private partnership, whether that be sales tax abatements for the server equipment or property tax abatements,” Boyd said. “All of that requires county, city or state support.” Most of the companies that filed prelease applications with the BLM or have been selected for projects on DOE land didn't respond to Bisnow ’s requests for comment. SB Energy In Ohio Part of a former uranium enrichment plant near the 2,200-person town of Piketon in southern Ohio is planned to become the world’s largest data center to date. SB Energy, a SoftBank Group company, broke ground on the 189-acre project in March and committed to building 10 gigawatts of new power generation connecting to the local grid. It expects to generate 10,000 construction jobs and 2,000 permanent jobs in the region. Known as the Portsmouth Site, it includes Department of Energy land. It is split between public land and some private land, according to a spokesperson for SB Energy. Flickr/U.S. Department of Energy Excavation of the Portsmouth site in 2012 as part of soil remediation efforts at the former uranium enrichment plant Valar Atomics In Utah Valar Atomics, a company focused on scaling nuclear energy for heavy industrial power, filed an application with BLM to build a 9,000-acre facility in Carbon County, Utah, NPR reported in September . BLM records confirm the filing but don't contain the project's acreage. The development, named Project Beehive, is planned to include data centers along with 456 small nuclear reactors and space to produce nuclear fuel and store nuclear waste on a Department of Energy site. A Brookfield Partnership In Kentucky A partnership between Brookfield, NextEra Energy Resources, Big Rivers Electric Corp., Jackson Purchase Energy Cooperative and Paducah Power System is planning an energy generation and AI campus on a 785-acre DOE site. Construction is expected to conclude on the former Superfund site in 2031, following remediation efforts that are needed because of the site’s decades of uranium enrichment operations, according to a release from the department. A spokesperson for the Paducah American Energy Hub told Bisnow in a statement that the team is “committed to working with all stakeholders.” “We have met with many local and state officials and look forward to engaging constructively with them and the community as a whole,” the spokesperson said. But Gov. Andy Beshear told Politico in August that the Trump administration excluded him from conversations about the $100B data center project and indicated a willingness to block or delay data centers from opening. While Beshear can’t stop the data center from happening, Anozie said, local governments can still make it difficult for projects to operate once they are built. “Where the states might have a way of regulating what is going on is using state environmental laws to challenge and to say, ‘Well, you didn't get the permit for this,’” he said. “But they cannot outrightly veto or zone out that area for a data center.” Amentum And DC Blox In South Carolina The Savannah River Site was one of 16 sites identified by the DOE in April 2025 to support the construction of data centers and the","published_at":1794792825000,"mutable":false,"date_precision":"timestamp","modified_at":1794792832000,"extraction":"semantic","canonical":"https://bisnow.com/news/national/data-center-development/developers-are-trying-to-lease-public-lands-to-build-data-centers","content_hash":"d45ff9123e2862fb5a25e41d0377b79efa9edda89bc53ecabc338582408c8446","access":"public","evidence_status":"article","id":"10116a2c01af5c0b","source_family":"bisnow","is_research":false,"required_source":false,"first_seen_at":1794800163578,"acquisition_window":{"lower":1794776400000,"upper":1794862800000},"score":19,"tags":["data-center","national","construction","policy","developer"],"heat_signals":["houston","fed","brookfield"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Where Developers Are Trying To Lease Public Lands To Build Data Centers"},{"id":"body-1","text":"More than a dozen huge pieces of public land may soon be part of the United States’ arsenal in the global race for artificial intelligence supremacy."},{"id":"body-2","text":"The Bureau of Land Management and the Department of Energy are considering leasing at least 17 public land parcels totaling 19,200 acres to developers that plan to build data centers and power infrastructure on the land, a Bisnow analysis of public records found."},{"id":"body-3","text":"Just two companies are responsible for more than half of the filings."},{"id":"body-4","text":"“This is a new strategy by the Trump administration,” said Chinonso Anozie, an assistant professor at the University of Houston Law Center."},{"id":"body-5","text":"“What it would do is remove a lot of local opposition and local vetoes over some of these data centers, limiting what states and local communities can also do in challenging and stopping data centers.”"},{"id":"body-6","text":"Flickr/Bureau of Land Management The Morley Nelson Snake River Birds of Prey National Conservation Area in Idaho, where the Bureau of Land Management is considering leasing a"}],"keep":true,"importance":4,"section":"cre","capital_focus":false,"geo_evidence":"United States","primary_event":"property_development_leasing","event_evidence_id":"body-2","event_evidence":"The Bureau of Land Management and the Department of Energy are considering leasing at least 17 public land parcels totaling 19,200 acres to developers that plan to build data centers and power infrastructure on the land, a Bisnow analysis of public records found.","market_evidence_id":"body-1","market_role":"asset_location","market_scope":"us","market_evidence":"More than a dozen huge pieces of public land may soon be part of the United States’ arsenal in the global race for artificial intelligence supremacy.","duplicate_of":null,"selector_reason":"联邦机构考虑出租至少17块、合计19,200英亩公共土地，用于数据中心和电力基础设施，具有全国开发与政策影响。","title_zh":"公共土地或为数据中心开发提供 19,200 英亩","summary_zh":"Bisnow 称，土地管理局和能源部正考虑向数据中心及电力基础设施开发商出租至少 17 宗公共土地、合计 19,200 英亩，多数项目位于美国西部。","impact":"long-pos","evidence_quote":"More than a dozen huge pieces of public land may soon be part of the United States’ arsenal in the global race for artificial intelligence supremacy. The Bureau of Land Management and the Department of Energy are considering leasing at least 17 public land parcels totaling 19,200 acres to developers that plan to build data centers and power infrastructure on the land, a Bisnow analysis of public records found. Just two companies are responsible for more than half of the filings.","evidence_basis":"body","cre_subcategory":"数据中心"},{"source_id":"realtor-research","source_name":"Realtor.com Research","source_tier":"B","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"Who Owns Outright? Mortgage Status, Lock-In and Senior Homeownership","link":"https://www.realtor.com/research/mortgage-status-acs-2026/","description":"Who Owns Outright? Mortgage Status, Lock-In and Senior Homeownership By Jiayi Xu Nov 16, 2026 Tax Bill Survey Highlights The share of owner-occupied homes owned outright continues to grow. In 2025, 41% of owner-occupied homes were owned free and clear, and 59% still carried a mortgage. Mortgage shares fell across all four regions. The West has the highest share of homes with a mortgage, and the South has the lowest. At the state level, the District of Columbia has the highest share of homes with a mortgage (73.5%), and West Virginia has the lowest (43.4%). Among the 50 largest metros, Washington, DC has the highest share of homes with a mortgage (73.6%), and Miami has the lowest (54.1%). More households aged 75+ own their homes, and more owners carry a mortgage Homeownership among households aged 75+ rose to 78.3% in 2025, up from 75.7% in 2010. The mortgage-free share among owners aged 75+ fell from 79.7% to 71.3%. Most still own outright, but the share with a loan rose from 20.3% to 28.7%. Among the 50 largest metros, mortgages are least common among owners aged 75+ in Grand Rapids, MI, and most common in Riverside, CA. Lock-in from a high-rate environment can shape the timing of the generational housing handoff. Owners with low-rate loans may hold onto their homes longer, while owners who own outright can make decisions on their own schedule. Mortgage rates have been a central constraint on the housing market, and rate changes affect markets differently depending not only on how the mortgage rates that current homeowners pay differ from the market , but also on how much of the housing stock is financed. Areas where owners rely more heavily on mortgages are more sensitive to rate changes, because monthly payments and the cost of moving both rise with borrowing costs. Areas with a higher share of outright ownership are less exposed and may feel smaller effects from rate shocks because residents who own their homes outright are likely indifferent to changes in borrowing costs. With mortgage rates back above 7% and potential Federal Funds rate hikes in 2027 , the lock-in effect is likely to tighten the market again . Owners with low-rate loans are reluctant to give up their rate, which keeps homes off the market. One channel through which these effects accumulate is generational housing succession . The oldest baby boomers, born in 1946, turned 80 in 2026, and as this generation moves into its 80s, a growing number of the homes they own will be released back to the open market. Lock-in from a high-rate environment can shape the timing of that handoff: owners with low-rate loans may hold onto their homes longer, while owners who own outright can make decisions on their own schedule. To understand the differences in geographic impact of high mortgage rates, we use the 2025 1-Year Estimate from the American Community Survey. According to the data, 59% of homeowners in the United States lived in homes with a mortgage and 41% of owners owned their homes free and clear. In fact, the share of homeowners with debt has dropped consistently in recent years, leading to an increase in outright homeownership. In 2010, the share of homes with debt was 67.2% and the share of outright ownership was 32.8%. Figure 1: Increase in the Proportion of Homes Owned Outright Amid a Decrease in Mortgaged Homes In line with national patterns, the share of homes with mortgages declined across all four regions. The West consistently exhibited the highest debt incidence, reflecting greater reliance on financing, with 63.8% of homeowners carrying a mortgage in 2025. By contrast, the South recorded the lowest share at 56.8%. The Northeast and Midwest were tied at 58.7%. Figure 2: The Proportion of Homes Owned With Mortgages Decreased Across All Regions Table 1: Regions Where Mortgages Are Most Common Region % homes with debt % homes owned outright West 63.8% 36.2% Northeast 58.7% 41.3% Midwest 58.7% 41.3% South 56.8% 43.2% Nation 59.0% 41.0% At the state level, a larger share of homeowners carry a mortgage in the District of Columbia (73.5%), Maryland (69.4%), Colorado (68.4%), Utah (66.8%) and California (65.6%). In these markets, higher rates are more likely to slow housing activity. By contrast, homeowners in West Virginia (43.4%), Mississippi (47.3%), New Mexico (50.0%), Louisiana (50.9%) and North Dakota (51.1%) are less reliant on home mortages, so housing activity in these states is likely to be affected more mildly. Table 2: States Where Mortgages Are Most Common State % homes with debt % homes owned outright District of Columbia 73.5% 26.5% Maryland 69.4% 30.6% Colorado 68.4% 31.6% Utah 66.8% 33.2% California 65.6% 34.4% Virginia 65.2% 34.8% Massachusetts 64.8% 35.2% Nevada 64.1% 35.9% Rhode Island 64.1% 35.9% Washington 63.9% 36.1% Connecticut 62.9% 37.1% Minnesota 62.6% 37.4% New Jersey 62.5% 37.5% Oregon 62.2% 37.8% Delaware 61.8% 38.2% Georgia 61.5% 38.5% Arizona 61.3% 38.7% Indiana 61.1% 38.9% Idaho 60.5% 39.5% North Carolina 60.2% 39.8% New Hampshire 59.5% 40.5% Illinois 59.5% 40.5% Hawaii 59.4% 40.6% Ohio 58.7% 41.3% Wisconsin 58.7% 41.3% Missouri 58.6% 41.4% Iowa 57.8% 42.2% Nebraska 57.6% 42.4% Vermont 56.6% 43.4% Michigan 56.6% 43.4% South Carolina 56.2% 43.8% Alaska 56.2% 43.8% Pennsylvania 56.0% 44.0% Tennessee 55.9% 44.1% Maine 55.8% 44.2% New York 55.6% 44.4% Wyoming 55.5% 44.5% Kansas 55.3% 44.7% Texas 55.3% 44.7% Florida 54.7% 45.3% Montana 53.9% 46.1% Kentucky 53.8% 46.2% Alabama 53.3% 46.7% Arkansas 52.7% 47.3% South Dakota 51.6% 48.4% Oklahoma 51.4% 48.6% North Dakota 51.1% 48.9% Louisiana 50.9% 49.1% New Mexico 50.0% 50.0% Mississippi 47.3% 52.7% West Virginia 43.4% 56.6% Among the top 50 metros, homeowners in Washington, DC, might be more sensitive to the impact of higher rates, given the high utilization of mortgages. Specifically, in 2025, 73.2% of homeowners in the DC area lived in housing units with a mortgage. Put differently, only 26.8% of homeowners in DC owned their homes outright, w","published_at":1794823234000,"source_family":"realtor-com","is_research":true,"required_source":true,"mutable":false,"first_seen_at":1794865086470,"id":"cd9c8fb93d4c934a","acquisition_window":{"lower":1794776400000,"upper":1794862800000},"score":18,"tags":["housing","national","data","trend","landlord"],"heat_signals":["fed","rate hike","mortgage rate"],"date_precision":"timestamp","modified_at":1794605000000,"extraction":"semantic","canonical":"https://realtor.com/research/mortgage-status-acs-2026","content_hash":"30ca5b40f34c8c565bbdf0b315739c8cadbabd29da978997219af9867bcd5495","access":"public","evidence_status":"article","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Who Owns Outright? Mortgage Status, Lock-In and Senior Homeownership"},{"id":"body-1","text":"Who Owns Outright?"},{"id":"body-2","text":"Mortgage Status, Lock-In and Senior Homeownership By Jiayi Xu Nov 16, 2026 Tax Bill Survey Highlights The share of owner-occupied homes owned outright continues to grow."},{"id":"body-3","text":"In 2025, 41% of owner-occupied homes were owned free and clear, and 59% still carried a mortgage."},{"id":"body-4","text":"Mortgage shares fell across all four regions."},{"id":"body-5","text":"The West has the highest share of homes with a mortgage, and the South has the lowest."},{"id":"body-6","text":"At the state level, the District of Columbia has the high
