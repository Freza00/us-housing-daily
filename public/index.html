strial sector in markets across the U.S. Through the first nine months of this year, industrial tenants supporting data center development and operations signed 50M SF of deals, far surpassing the full-year totals for 2024 and 2025, according to a new report from Cushman & Wakefield . Courtesy of Cushman & Wakefield Cushman & Wakefield's report found data center-related industrial leasing is growing and making up a larger share of overall industrial demand. These tenants are bolstering the supply chains needed to build and run data centers. Cushman found three types of tenants leasing the most space: third-party logistics providers using distribution space for data center equipment, building suppliers using warehouses for data center construction materials, and manufacturers of data center equipment storing inventory in digital infrastructure hubs. These data center-related industrial tenants made up 14% of all industrial leasing last quarter and 11% through the first nine months of the year, Cushman found — up from less than 3% in 2022 and 2023 and roughly 5% in 2024 and 2025. This industrial demand surge is supporting the 36 gigawatts of data center capacity under construction in the U.S., in addition to the 47 GW of operational capacity, according to the report. It says the associated supply chain has exploded this year, with imports of AI-related equipment growing 62% from last year to $659B. “Data center development is creating a physical supply chain that extends well beyond the campus itself,” Jason Price , Cushman & Wakefield's head of Americas logistics and industrial research, said in a statement. “Servers, power and cooling equipment, construction materials and replacement parts all have to be manufactured, stored and distributed, and that is now showing up as a meaningful new source of industrial leasing.” The firm said this trend is especially prevalent in the established data center markets of Phoenix, Atlanta, Dallas-Fort Worth and Columbus, Ohio. And it is occurring in emerging data center markets like Kansas City, Austin-San Antonio, West Texas and Reno, Nevada. An industrial market report from JLL last month found overall U.S. leasing was up 38.5% year-over-year in Q3 — the highest quarter in four years — and was driven by logistics facilities supporting data centers. This activity has been driven by some of the biggest names in the AI sector. Amazon Web Services in September launched a partnership with logistics company Kuehne+Nagel to use its network to support the construction of new facilities, plus maintenance and expansion projects. Cushman said this partnership, in addition to a data center-related expansion from DHL , has helped drive industry leasing activity from third-party logistics firms. Fluidstack, an AI firm partnering with Anthropic on its data center expansion, signed a lease in June for an industrial park spanning more than 1M SF in Glendale, Arizona. Nvidia in March announced a partnership with Corning, which makes connectivity equipment for data centers, to develop three manufacturing facilities in Texas and North Carolina. “This partnership is proof that AI is not just a technology story. It is a manufacturing story, and it is happening here in the United States,” Corning CEO Wendell Weeks said in a March release on the deal. Continue reading this story with a free account Log in or register Related Topics: Cushman & Wakefield , Jason Price","published_at":1795544486000,"mutable":false,"date_precision":"timestamp","modified_at":1795544530000,"extraction":"semantic","canonical":"https://bisnow.com/news/national/industrial/us-industrial-leasing-tied-to-data-centers-surges-to-50m-sf","content_hash":"39f669325bdd33d2adbdfb83564db81d64f2dc45b719d2efb1eddd300c083b09","access":"public","evidence_status":"article","id":"c023385ef493cc0f","source_family":"bisnow","is_research":false,"required_source":false,"first_seen_at":1795556238647,"acquisition_window":{"lower":1795467600000,"upper":1795554000000},"score":25,"tags":["industrial","national","data","trend"],"heat_signals":["texas","dallas","fort worth","austin","san antonio","trend","year-over-year"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"U.S. Industrial Leasing Tied To Data Centers Surges To 50M SF"},{"id":"body-1","text":"The rapid build-out of artificial intelligence infrastructure has not only spurred unprecedented development in the data center real estate sector, but it is also increasingly supporting the industrial sector in markets across the U.S."},{"id":"body-2","text":"Through the first nine months of this year, industrial tenants supporting data center development and operations signed 50M SF of deals, far surpassing the full-year totals for 2024 and 2025, according to a new report from Cushman & Wakefield ."},{"id":"body-3","text":"Courtesy of Cushman & Wakefield Cushman & Wakefield's report found data center-related industrial leasing is growing and making up a larger share of overall industrial demand."},{"id":"body-4","text":"These tenants are bolstering the supply chains needed to build and run data centers."},{"id":"body-5","text":"Cushman found three types of tenants leasing the most space: third-party logistics providers using distribution space for data center equipment, building suppliers using warehouses for data center construction materials, and manufacturers of data center equi"}],"keep":true,"importance":4,"section":"cre","capital_focus":false,"geo_evidence":null,"primary_event":"market_research_policy","event_evidence_id":"body-2","event_evidence":"Through the first nine months of this year, industrial tenants supporting data center development and operations signed 50M SF of deals, far surpassing the full-year totals for 2024 and 2025, according to a new report from Cushman & Wakefield .","market_evidence_id":"body-1","market_role":"market_policy","market_scope":"us","market_evidence":"The rapid build-out of artificial intelligence infrastructure has not only spurred unprecedented development in the data center real estate sector, but it is also increasingly supporting the industrial sector in markets across the U.S.","duplicate_of":null,"selector_reason":"Cushman & Wakefield研究显示，美国数据中心供应链租户今年前九个月签下5,000万平方英尺工业空间，超过2024年和2025年各自的全年规模。","title_zh":"美国数据中心相关工业租赁达 5000 万平方英尺","summary_zh":"戴德梁行称，今年前九个月，美国数据中心相关租户签约工业空间 5000 万平方英尺，超过 2024 年和 2025 年各自全年总量，占同期工业租赁面积的 11%。","impact":"long-pos","evidence_quote":"The rapid build-out of artificial intelligence infrastructure has not only spurred unprecedented development in the data center real estate sector, but it is also increasingly supporting the industrial sector in markets across the U.S. Through the first nine months of this year, industrial tenants supporting data center development and operations signed 50M SF of deals, far surpassing the full-year totals for 2024 and 2025, according to a new report from Cushman & Wakefield .","evidence_basis":"body","cre_subcategory":"工业"},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Raleigh's housing reforms helped ease rents, Pew study finds","link":"https://www.housingwire.com/articles/raleigh-zoning-reforms-rents/","description":"For years, homebuilding leaders have argued that the most effective way to lower housing costs is to build more, and that cities that adopt pro-housing reforms will be rewarded with greater supply and more attainable housing. New research from The Pew Charitable Trusts shows what happened when Raleigh, N.C., followed that playbook. Following the pandemic, Raleigh overhauled its zoning and land use laws to make building easier, Pew found. The result was a building boom, particularly for the townhomes and apartments the city's earlier rules constrained. This uptick in homebuilding made renting more affordable in North Carolina’s capital city, especially for middle-income households and younger residents. The report highlights how adding new housing supply at scale can improve housing affordability, echoing similar impacts that followed concerted rezoning efforts in Minneapolis-St. Paul, Minn., and Austin, Texas. The same dynamic is playing out across the Sun Belt, where many of the nation’s fastest-growing metros also have some of the loosest zoning rules, and where rents and home prices have dropped more dramatically than anywhere else in the country. Raleigh’s post-COVID zoning reforms Raleigh didn't rely on a single fix to make building housing easier. Its reforms combined a rewrite of its form-based code, an end to parking minimums, denser building near transit and a housing bond to support affordable housing. “Of all of the drivers of housing costs – population growth, an influx of high-income earners, high land costs and high construction costs – we have the most agency and direct control over restrictive zoning regulations,” Patrick Young, Raleigh’s planning and development director, said in a statement. Allowing more missing middle housing Raleigh's 2021 zoning reform, which expanded the city’s already-established form-based code, opened the door to more \"missing middle\" housing. It did so by replacing units-per-acre caps with physical standards such as lot size, yards, and building height. The changes legalized duplexes, triplexes and quadplexes in more residential districts and expanded where townhomes can be built. Under the new form-based code, further refined in 2022, builders can now construct small apartment buildings and tiny houses with up to two dwelling units on compact infill lots. As a result, builders can now construct missing middle housing in more of Raleigh's neighborhoods, a shift that Pew links to better affordability for middle-income and younger residents. Reforming transit-oriented development and parking requirements Raleigh eliminated its citywide parking minimums in 2022. That allowed developers to fit more housing units on each property and, in some cases, spared them the expense of building costly parking structures, which can often make a project too costly to pursue. The city also spurred housing growth by allowing taller, denser buildings near major transit corridors. Transit Overlay District zones allowed for an extra story along Bus Rapid Transit corridors, extending half a mile along some local bus routes. Additionally, a density bonus allows developers to exceed height limits by up to 50% if at least 20% of the extra units are designated as affordable, below-market units. Approving housing bonds to incentivize affordable housing The City of Raleigh approved an $80 million housing bond in 2020 that is projected to create at least 700 affordable homes, fund homebuyer assistance and help homeowners with home repairs. About $14 million has already gone to four developments totaling more than 240 units, while another $24 million in gap financing will back over 470 additional units, more than 90% of which will be affordable to households earning 60% of area median income or less. How these reforms contributed to moderated rent growth Between 2021 and 2024, Raleigh added 16,884 housing units, growing its housing stock by 7.7%, even as the city’s population grew by 5.8% over the same period. Raleigh's housing growth also outpaced the state (5.7%) and national (3.2%) rates during that period. Of the 16,884 units added, roughly 2,000, or 12%, were affordable to households earning 80% or less of area median income (AMI), with Raleigh's housing bond funds helping support their development. Density bonuses contributed about 200 of those affordable units, accounting for 10% of the total. Additionally, Raleigh’s code changes intentionally shifted a large share of production away from detached single-family homes toward townhomes, duplexes and tiny homes. Since 2021, the city has issued more than twice as many townhouse permits as in 2015 to 2020, and has permitted more than 200 duplex units and over 200 accessory dwelling units (ADUs). As a result, average monthly rents rose at only half the national pace and fell in real, inflation-adjusted terms. Pew’s analysis estimates inflation-adjusted rents declined 15% from 2022 to 2025, and, as of 2025, the income needed to afford the city’s median rent dropped from 79% of AMI to 65%. Raleigh's experience mirrors a wider trend among fast-growing Sun Belt markets, where less restrictive zoning and fewer barriers to housing development have supported greater housing production and helped moderate housing costs. The South accounted for more than half of all U.S. housing starts between 2021 and 2025, while Sun Belt markets continue to lead the nation in rent and home price declines. According to Yardi Matrix's October 2026 multifamily report , rents fell year over year in 12 major US markets. The Sun Belt accounted for ten of those, led by Austin, Houston, Nashville, Tampa and Phoenix. The for-sale market shows a similar pattern, with home prices dropping disproportionately in the Sun Belt while climbing in the Northeast and Midwest. Related More: Affordability Homebuilders","published_at":1795468728000,"mutable":false,"date_precision":"timestamp","modified_at":1795468730000,"extraction":"semantic","canonical":"https://housingwire.com/articles/raleigh-zoning-reforms-rents","content_hash":"69cc3939482e826155ba0d46d37ca9a41f5cab7bab677cf8a28a89626980d9ef","access":"public","evidence_status":"article","id":"004024c2adc98d36","source_family":"housingwire","is_research":false,"required_source":false,"first_seen_at":1795469840354,"acquisition_window":{"lower":1795467600000,"upper":1795554000000},"score":35,"tags":["housing","carolinas","policy","construction"],"heat_signals":["texas","houston","austin","sun belt","inflation","housing starts","permits","trend","year over year","housing starts","rent growth"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Raleigh's housing reforms helped ease rents, Pew study finds"},{"id":"body-1","text":"For years, homebuilding leaders have argued that the most effective way to lower housing costs is to build more, and that cities that adopt pro-housing reforms will be rewarded with greater supply and more attainable housing."},{"id":"body-2","text":"New research from The Pew Charitable Trusts shows what happened when Raleigh, N.C., followed that playbook."},{"id":"body-3","text":"Following the pandemic, Raleigh overhauled its zoning and land use laws to make building easier, Pew found."},{"id":"body-4","text":"The result was a building boom, particularly for the townhomes and apartments the city's earlier rules constrained."},{"id":"body-5","text":"This uptick in homebuilding made renting more affordable in North Carolina’s capital city, especially for middle-income households and younger residents."},{"id":"body-6","text":"The report highlights how adding new housing supply at scale can improve housing affordability, echoing similar impacts that followed concerted rezoning efforts in Minneapolis-St. Paul, Minn., and Austin, Texas."},{"id":"body-7","text":"The same dynamic is playing out across the Sun Belt, where many of the natio"}],"keep":true,"importance":4,"section":"sunbelt","capital_focus":false,"geo_evidence":"Raleigh, N.C.","primary_event":"market_research_policy","event_evidence_id":"body-3","event_evidence":"Following the pandemic, Raleigh overhauled its zoning and land use laws to make building easier, Pew found.","market_evidence_id":"body-2","market_role":"market_policy","market_scope":"us","market_evidence":"New research from The Pew Charitable Trusts shows what happened when Raleigh, N.C., followed that playbook.","duplicate_of":null,"selector_reason":"Pew独立研究发现，罗利放宽分区和土地使用限制后，联排住宅与公寓建设增加，租房可负担性改善，尤其惠及中等收入家庭和年轻居民。","title_zh":"皮尤研究：罗利分区改革增加住房供给，减轻租房负担","summary_zh":"皮尤慈善信托研究认为，罗利在疫情后调整分区和土地使用规则，包括取消最低停车位要求、允许在公共交通沿线提高开发密度。联排住宅和公寓供给随之增加，租赁负担有所减轻。","impact":"neutral","evidence_quote":"For years, homebuilding leaders have argued that the most effective way to lower housing costs is to build more, and that cities that adopt pro-housing reforms will be rewarded with greater supply and more attainable housing. New research from The Pew Charitable Trusts shows what happened when Raleigh, N.C., followed that playbook. Following the pandemic, Raleigh overhauled its zoning and land use laws to make building easier, Pew found.","evidence_basis":"body","cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Brookfield Slashes Value Of Investment In Retailers In Half","link":"https://www.bisnow.com/news/national/retail/exclusive-brookfield-slashes-value-of-investment-in-retailers-in-half","description":"Brookfield has written down by 50% the value of its investment in a group of famous American retailers, including JCPenney and Aéropostale, Bisnow can reveal. Wikimedia Commons/Azt3r1x Third-quarter accounts for a property holding subsidiary of Brookfield Corp. showed that the value of the company’s investment in Catalyst Brands was written down from $551M to $276M in the period. The write-down gives a rare glimpse into the financial performance of a bold move by retail real estate owners Brookfield and Simon Property to invest in the brands that occupied big swaths of their malls. The investment was in part an effort to avoid large voids in their assets if the retailers went bust, particularly during the height of the pandemic. Brookfield teamed up with Simon in 2020 to buy department store chain JCPenney for $800M, with the beleaguered chain’s lenders retaining its property portfolio. The deal involved the JV paying $300M and assuming $500M of debt. In 2025, the duo merged JCPenney with Sparc Group, a retail company that owned the brands Aéropostale, Brooks Brothers , Nautica, Eddie Bauer and Lucky Brand, to create a new company called Catalyst Brands. The company had 1,800 store locations, 60,000 staff, $9B in revenue and $1B in liquidity, according to a press release at the time of the merger, but in February 2026, Eddie Bauer filed for Chapter 11 bankruptcy, and all 200 of its stores closed. Simon owns a 39% share in Catalyst, according to its third-quarter accounts, with the rest of the company owned by a combination of Brookfield, retail specialist Authentic Brands Group and Chinese e-tailer Shein . None of those companies disclose their ownership level. Brookfield declined to comment on the write-down in its investment or its ownership proportion. Simon’s accounts don’t put a value on its investment, but it said it took a $20M loss on its stake in Catalyst in the first nine months of the year as a result of “transition and restructuring activities.” The write-down in Brookfield’s retailer portfolio came alongside a wider devaluation of its giant retail real estate portfolio, which pushed it to an overall $617M Q3 loss, compared with $301M in the same period last year. The value of its mall portfolio dropped $430M, Brookfield said, driven by cap rate expansion in its secondary assets. Brookfield owns $82B of real estate assets, including offices, malls and stakes in funds managed by sister company Brookfield Asset Management . Continue reading this story with a free account Log in or register Related Topics: Brookfield , Brookfield Corp , Catalyst Brands , JCPenney , Simon Property Group , Sparc Group","published_at":1795540876000,"source_family":"bisnow","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1795556238647,"id":"39c8be247cffd6de","acquisition_window":{"lower":1795467600000,"upper":1795554000000},"score":18,"tags":["retail","national","earnings","institutional"],"heat_signals":["brookfield"],"date_precision":"timestamp","modified_at":1795540895000,"extraction":"semantic","canonical":"https://bisnow.com/news/national/retail/exclusive-brookfield-sl has written down by 50% the value of its investment in a group of famous American retailers, including JCPenney and Aéropostale, Bisnow can reveal.","duplicate_of":null,"selector_reason":"Brookfield子公司第三季度账目显示，其对美国零售商组合Catalyst Brands的投资账面价值由5.51亿美元减至2.76亿美元，揭示了商场业主持有租户股权的风险。","title_zh":"布鲁克菲尔德减记对 Catalyst Brands 的投资账面价值","summary_zh":"布鲁克菲尔德旗下物业控股公司的第 3 季度账目显示，布鲁克菲尔德对 Catalyst Brands 的投资账面价值由 5.51 亿美元下调至 2.76 亿美元。Catalyst Brands 旗下品牌包括 JCPenney。","impact":"short-neg","evidence_quote":"Brookfield has written down by 50% the value of its investment in a group of famous American retailers, including JCPenney and Aéropostale, Bisnow can reveal. Wikimedia Commons/Azt3r1x Third-quarter accounts for a property holding subsidiary of Brookfield Corp. showed that the value of the company’s investment in Catalyst Brands was written down from $551M to $276M in the period.","evidence_basis":"body","cre_subcategory":"零售"},{"source_id":"sp-case-shiller","source_name":"S&P Cotality Case-Shiller","source_tier":"B","source_weight":10,"source_tags":["housing","data","trend"],"region":"national","title":"S&P Cotality Case-Shiller Index Reports Annual Gain in September 2026 - Nov 24, 2026","link":"https://press.spglobal.com/2026-11-24-S-P-Cotality-Case-Shiller-Index-Reports-Annual-Gain-in-September-2026","description":"Press Releases Media Contacts Social Media Directory Press Kit Press Releases S&P Cotality Case-Shiller Index Reports Annual Gain in September 2026 The S&P Cotality Case-Shiller U.S. National Home Price NSA Index posted a 2.1% annual gain in September 2026, unchanged from the previous month. U.S. home prices declined in real terms for the 16th consecutive month, as September inflation of 3.7% outpaced the 2.1% annual gain in home prices by roughly 1.6 percentage points. A nearly 9 percentage point gap separated September's strongest market, Chicago (+6.9% YoY), from its weakest, Seattle (-1.9%), highlighting continued regional divergence in home price trends. NEW YORK , Nov. 24, 2026 / PRNewswire / -- S&P Dow Jones Indices (S&P DJI) today released the September 2026 results for the S&P Cotality Case-Shiller Indices. More than 27 years of history are available for the data series and can be accessed in full by going to www.spglobal.com/spdji/en/index-family/indicators/sp-Cotality-case-shiller . Cotality continues to have transaction delays from the recording office in Wayne County, the most populous county in the Detroit metro area. These delays impacted the September transaction data and, therefore, no valid September 2026 update of the Detroit S&P Cotality Case-Shiller Index will be provided for the November 24, 2026, release date. There was, however, enough data to calculate a valid August 2026 update, which is provided in Tables 2 and 3. S&P DJI will continue to provide updates to the Detroit index values for the month(s) with missing sale transactions data. ANALYSIS \"The S&P Cotality Case-Shiller National Home Price Index rose 2.1% year over year in September, matching the annual gain recorded in August,\" said Rebecca Kaufman, Associate Director of Commodities at S&P Dow Jones Indices. \"Nominal home prices remain resilient, but inflation is once again widening the gap between nominal and real housing returns. Consumer prices rose 3.7% year over year in September, accelerating from 3.4% in August, marking the 16th consecutive month in which U.S. home prices declined in real terms. \"Chicago led all metros for the sixth consecutive month, posting a 6.9% annual gain, followed by New York at 5.8% and Miami at 4.6%. Seattle recorded the largest annual decline for the fourth consecutive month at 1.9%, followed by Denver (-1.0%) and Dallas (-0.9%),\" Kaufman continued. \"Miami's rise is particularly notable: After moving into fourth place among the 20 cities in July and August, it has now climbed into the top three, a sharp reversal from its comparatively weak performance in 2025. \"September also revealed a widening gap between seasonal weakness and underlying price momentum. On a non-seasonally adjusted basis, the U.S. National and 10-City Composite Indices fell 0.3% and 0.5% month over month, respectively, while both rose 0.2% after seasonal adjustment. That contrast suggests that some of the apparent monthly weakness reflects the normal fall slowdown rather than a broad deterioration in home prices. YEAR-OVER-YEAR The S&P Cotality Case-Shiller U.S. National Home Price NSA Index, covering all nine U.S. census divisions, reported a 2.1% annual gain for September. The 10-City Composite saw an annual increase of 3.5%, down from a 3.6% increase in the previous month. The 20-City Composite posted a year-over-year increase of 2.6%, in line with the increase from the previous month. Chicago reported the highest annual gain among the 20 cities with a 6.9% increase in September, followed by New York and Miami with annual increases of 5.8% and 4.6%, respectively. Seattle posted the lowest return in September, falling 1.9%. MONTH-OVER-MONTH The pre-seasonally adjusted U.S. National Index posted a monthly decrease of 0.3%; while both the 10-City Composite and 20-City Composite Indices recorded a monthly decline of 0.5%. After seasonal adjustment, the U.S. National and 10-City Composite Indices posted 0.2% gains while the 20-City Composite Index posted a 0.1% gain. SUPPORTING DATA Table 1 below shows the housing boom/bust peaks and troughs for the three composites along with the current levels and percentage changes from the peaks and troughs. 2022 Peak 2023 Trough Current Index Level Date Level Date From Peak (%) Level From Trough (%) From Peak (%) National 308.06 Jun-22 292.67 Jan-23 -5.0 % 335.75 14.7 % 9.0 % 20-City 318.73 Jun-22 297.47 Jan-23 -6.7 % 346.97 16.6 % 8.9 % 10-City 330.38 Jun-22 309.92 Jan-23 -6.2 % 370.47 19.5 % 12.1 % Table 2 below summarizes the results for September 2026. The S&P Cotality Case-Shiller Indices could be revised for the prior 24 months, based on the receipt of additi ole":"market_policy","market_scope":"us","market_evidence":"U.S. home prices declined in real terms for the 16th consecutive month, as September inflation of 3.7% outpaced the 2.1% annual gain in home prices by roughly 1.6 percentage points.","duplicate_of":null,"selector_reason":"标普原始公告显示，9月全国房价同比上涨2.1%，增速与8月持平；同期通胀为3.7%，实际房价连续第16个月同比下降。","title_zh":"美国 9 月名义房价同比涨 2.1%，实际房价连续 16 个月同比下跌","summary_zh":"标普 Cotality Case-Shiller 全国房价指数显示，2026 年 9 月美国名义房价同比上涨 2.1%，涨幅与 8 月持平，低于同期 3.7% 的通胀率。实际房价连续第 16 个月同比下跌。","impact":"neutral","evidence_quote":"Press Releases Media Contacts Social Media Directory Press Kit Press Releases S&P Cotality Case-Shiller Index Reports Annual Gain in September 2026 The S&P Cotality Case-Shiller U.S. National Home Price NSA Index posted a 2.1% annual gain in September 2026, unchanged from the previous month. U.S. home prices declined in real terms for the 16th consecutive month, as September inflation of 3.7% outpaced the 2.1% annual gain in home prices by roughly 1.6 percentage points.","evidence_basis":"body","cre_subcategory":null},{"source_id":"redfin-news","source_name":"Redfin News","source_tier":"A","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"U.S. Home Prices Ticked Up 0.14% in October","link":"https://www.redfin.com/news/home-price-index-october-2026/","description":"U.S. Home Prices Ticked Up 0.14% in October Published on November 24th, 2026 by Dian Zhang Nationwide, home prices inched up 0.14% month over month in October, the smallest increase in six months. Home prices increased in 30 of the 50 most populous U.S. metros, with Miami and Montgomery County, PA posting the fastest price growth. Home prices declined in 20 metros, with Seattle and Riverside seeing the steepest declines. U.S. home prices ticked up 0.14% month over month in October on a seasonally adjusted basis. That is the smallest increase in six months. Loading data… Home Prices Redfin Home Price Index Case-Shiller Index Month-over-month change in Redfin Home Price Index Prices rose 3.5% from a year earlier in October, the smallest increase since May 2026. Annual price growth has slowed for three straight months. This is according to the Redfin Home Price Index (RHPI), which uses the repeat-sales pricing method to calculate seasonally adjusted changes in single-family home prices. The RHPI measures how sale prices of homes have changed since their previous sale—similar to the S&P Cotality Case-Shiller Home Price Indices—but is reported about a month earlier. October data covers the three months ending October 31, 2026. Read the full RHPI methodology here . Home prices continued to rise in October, but at a slower pace. Buyers gained more negotiating power than at any point in Redfin's records, which date back to 2013. Only three of the 50 most populous U.S. metro areas tracked by us were seller’s markets in October. However, a buyer's market doesn't necessarily signal strong buyer’s demand. “Mortgage rates are not that volatile right now, but they're still higher than they used to be. That's holding back demand and putting some downward pressure on prices, which have started to fall in many parts of the country,” s aid Chen Zhao , Redfin’s head of economics research. “On a national level, w e don't think prices will fall very much.” There's also more supply available now, but sellers are not willing to cut prices deeply. “Many sellers are still anchored to the prices they've seen over the past few years, and because few sellers are under pressure to sell, that puts a floor under prices,” said Zhao. Redfin tracks different types of home price trends. While our weekly and monthly housing market reports use the median home-sale price, which has recently shown a decline, the RHPI looks at repeat-sales prices of the same properties over time. It provides that isolates true underlying price appreciation rather than shifts in the types of homes selling, but because this is three-month moving average, it is also a slightly more “backward-looking view” according to Zhao. Home Prices Are Rising Most in Miami Home prices rose in 30 of the 50 major U.S. metros month over month in October. The biggest increase was in Miami, where home prices rose 1.5% month over month on a seasonally adjusted basis. It’s followed by Montgomery County, PA (1.2%), Chicago (1.1%), Pittsburgh (1.0%) and Cincinnati (0.9%). On a year-over-year basis, prices rose most in San Francisco, up 12.7%. It’s followed by Miami (11.3%), Chicago (9.5%), West Palm Beach (8.9%) and Philadelphia (8.5%). Home Prices Are Falling Most in Seattle The biggest price decline was in Seattle (-1.2% month over month). Next come Riverside (-0.7%), Detroit (-0.6%), Las Vegas (-0.6%) and Washington, DC (-0.5%). Prices declined year over year in six major metros, four in Texas plus Seattle and Phoenix. San Antonio had the biggest drop (-3.0%), followed by Seattle (-2.1%), Dallas (-1.3%) and Austin (-1.1%). Houston (-0.2%) and Phoenix (-0.2%) also declined. This report is part of Redfin's monthly Home Price Index series. See all past reports and explore the latest data in the Redfin Data Center . Metro-Level Summary: Redfin Home Price Index, October 2026 50 most populous U.S. metro areas U.S. metro area Month-over-month change, seasonally adjusted Year-over-year change Anaheim, CA -0.2% 5.0% Atlanta, GA -0.1% 2.3% Austin, TX 0.0% -1.1% Baltimore, MD 0.0% 4.3% Boston, MA -0.1% 2.4% Charlotte, NC 0.0% 1.6% Chicago, IL 1.1% 9.5% Cincinnati, OH 0.9% 6.7% Cleveland, OH -0.4% 6.0% Columbus, OH -0.2% 4.3% Dallas, TX -0.1% -1.3% Denver, CO -0.2% 0.6% Detroit, MI -0.6% 5.5% Fort Lauderdale, FL 0.6% 3.9% Fort Worth, TX 0.7% 0.0% Houston, TX -0.1% -0.2% Indianapolis, IN 0.5% 2.6% Jacksonville, FL -0.1% 0.7% Kansas City, MO 0.7% 3.6% Las Vegas, NV -0.6% 0.6% Los Angeles, CA -0.3% 2.6% Miami, FL 1.5% 11.3% Milwaukee, WI 0.5% 6.9% Minneapolis, MN 0.1% 3.1% Montgomery County, PA 1.2% 8.2% Nashville, TN 0.0% 2.2% Nassau County, NY 0.1% 6.8 s-v2","editor_evidence":[{"id":"title","text":"U.S. Home Prices Ticked Up 0.14% in October"},{"id":"body-1","text":"U.S."},{"id":"body-2","text":"Home Prices Ticked Up 0.14% in October Published on November 24th, 2026 by Dian Zhang Nationwide, home prices inched up 0.14% month over month in October, the smallest increase in six months."},{"id":"body-3","text":"Home prices increased in 30 of the 50 most populous U.S. metros, with Miami and Montgomery County, PA posting the fastest price growth."},{"id":"body-4","text":"Home prices declined in 20 metros, with Seattle and Riverside seeing the steepest declines."},{"id":"body-5","text":"U.S. home prices ticked up 0.14% month over month in October on a seasonally adjusted basis."},{"id":"body-6","text":"That is the smallest increase in six months."},{"id":"body-7","text":"Loading data… Home Prices Redfin Home Price Index Case-Shiller Index Month-over-month change in Redfin Home Price Index Prices rose 3.5% from a year earlier in October, the smallest increase since May 2026."},{"id":"body-8","text":"Annual price growth has slowed for three straight months."},{"id":"body-9","text":"This is according to the Redfin Home Price Index (RHPI), which uses the repeat-sales pricing method to calculate seasonally adjusted changes in single-family home prices."},{"id":"body-10","text":"The RHPI measures how sale prices of homes have changed since their previous sale—similar to the S&P Cotality Case-Shiller Home Price Indices—but is reported about a month earlier."},{"id":"body-11","text":"October data covers"}],"keep":true,"importance":4,"section":"national","capital_focus":false,"geo_evidence":null,"primary_event":"market_research_policy","event_evidence_id":"body-5","event_evidence":"U.S. home prices ticked up 0.14% month over month in October on a seasonally adjusted basis.","market_evidence_id":"body-5","market_role":"market_policy","market_scope":"us","market_evidence":"U.S. home prices ticked up 0.14% month over month in October on a seasonally adjusted basis.","duplicate_of":null,"selector_reason":"Redfin独立的10月重复交易指数季调后环比上涨0.14%，为六个月最小涨幅；同比上涨3.5%，增速连续三个月放缓。","title_zh":"Redfin：美国 10 月独栋房价录得半年最小环比涨幅","summary_zh":"Redfin 指数显示，2026 年 10 月美国独栋房价经季调环比上涨 0.14%，为 6 个月来最小涨幅；同比上涨 3.5%，同比涨幅连续 3 个月放缓。10 月数据覆盖截至 10 月 31 日的 3 个月。","impact":"neutral","evidence_quote":"U.S. Home Prices Ticked Up 0.14% in October Published on November 24th, 2026 by Dian Zhang Nationwide, home prices inched up 0.14% month over month in October, the smallest increase in six months. Home prices increased in 30 of the 50 most populous U.S. metros, with Miami and Montgomery County, PA posting the fastest price growth.","evidence_basis":"body","cre_subcategory":null},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Mortgage rates whiplash is in full effect, with jumbo loans shedding 25 bps this week","link":"https://www.housingwire.com/articles/mortgage-rates-seesaw-753/","description":"The seesaw pattern for mortgage rates that's been the story for much of the second half of 2026 reared its head again this week as rates for major loan types declined, reversing some of the increases from prior weeks. At HousingWire 's Mortgage Rates Center on Tuesday, rates for 30-year conforming loans averaged 7.53% — down 5 basis points from a week ago. Rates for 30-year loans through the Federal Housing Administration (FHA) dropped 7 bps to 7.30%, while rates for 30-year jumbo loans plummeted 25 bps to 7.62%. Rates in the mid-7% range continue to weigh on homebuyer demand and affordability metrics. Last week's application index from the Mortgage Bankers Association showed that total applications were down 5% on a weekly basis. MBA data released Tuesday found that affordability is about 8% weaker than a year ago , even though it improved slightly from September to October. “Higher mortgage rates weighed on application activity last week, with the 30-year fixed rate rising to 7.35%. Purchase applications were down 18% from a year ago, reflecting continued affordability challenges and softer homebuyer demand. The direction of mortgage rates in the coming weeks will be key to the housing market’s momentum heading into 2027,” MBA president and CEO Bob Broeksmit said in a statement. Dan Ribler , vice president of capital markets and strategy at national reverse mortgage lender Longbridge Financial , said that the October jobs report should've sent rates higher . Nonfarm payrolls increased by 165,000 positions last month and the unemployment rate remained steady at 4.1%, indicative of today's healthier labor market conditions in relation to 2025. Ribler noted that the jobless rate has been below 5% every month since September 2021, unemployment claims are lower than a year ago and the Federal Reserve 's \"own description is the labor market is very strong.\" But strong employment trends have been overshadowed by stubborn inflation , which continues to run well above the central bank's 2% annualized target. \"Inflation has been above 2% year over year 57 months in a row,\" Ribler remarked. \"The Fed has, by the way, under this administration, reiterated the 2% hurdle and that they're going to be tough on inflation. They're certainly talking the hawk talk, saying we're going to keep inflation under 2%. \"But man, I don't know about you, if my kid breaks curfew 57 nights in a row — and I say I'm going to punish you one of these times and I never do anything about it — at some point, he stops believing me, right?\" Inflation is likely to prompt the Fed to raise rates next month. The CME Group 's FedWatch tool reveals that a 25-bps hike in December is all but certain, with 96% of interest rate traders saying that the federal funds rate will rise to a range of 4% to 4.25%. It was last at that level in September 2025. Silver linings are hard to identify Much of the housing and mortgage industry headlines in the past week have cast a shadow over any potential market improvements in 2027. Selma Hepp , chief economist at Cotality , said in a statement that existing home sales have fallen to their lowest level since August 2010. She also pointed to a Realtor.com analysis, which found that the typical repeat buyer will pay about $1,100 more per month if they choose to sell and move. \"A meaningful housing recovery requires rates to come down and, importantly, stay down long enough to improve affordability and unlock turnover,\" Hepp said. \"Until then, the adjustment is likely to come through weaker sales and softer home prices rather than widespread homeowner distress. \"The number worth writing is the $1,100. That's the jump in monthly payment a typical repeat buyer takes on just to move house. It's the clearest explanation yet of why nobody is selling.\" New home sales have been equally grim, with September's seasonally adjusted annual rate of 676,000 sales representing a 5.3% decline from a year ago. Higher rates have also prompted homebuilders to remain cautious about creating more supply, with U.S. Census Bureau figures showing that single-family housing starts were down 3.2% year over year in September. Monthly gains in total starts were largely tied to the multifamily sector. \"Challenging affordability has been weighing on the resale market. Newly pending sales fell 17% in October, the largest year-over-year drop since 2023,\" Zillow senior economist Kenny Lee said in a statement. \"Single-family homebuilders have been navigating the same challenge. While homebuilders have been adapting to the softer market by offering concessions and building smaller homes, the 2027 spring home-shopping season could see a slow start as buyer demand continues to wane.\" The relative lack of sales has weighed on mortgage origination volumes, with ATTOM data for the third quarter of 2026 showing that the roughly 730,000 purchase loans closed during that period were the lowest figure for any third quarter in 14 years. Refinance activity was also bleak, with the roughly 561,000 refis in Q3 down 19% year over year. Refi lending was down from Q2 2026 in nearly 90% of the metro areas analyzed by ATTOM, with the largest declines in major metros like San Jose, San Francisco , Dallas, Austin and Louisville, Kentucky. Related More: Cotality Federal Reserve Longbridge Financial Mortgage Rates Center","published_at":1795541044000,"mutable":false,"date_precision":"timestamp","modified_at":1795553869000,"extraction":"semantic","canonical":"https://housingwire.com/articles/mortgage-rates-seesaw-753","content_hash":"432e3c7d7379ca0076afb71b450357eddf9c60a756b07e1c61f5516b848e83ff","access":"public","evidence_status":"article","id":"7240b4c8fc468115","source_family":"housingwire","is_research":false,"required_source":false,"first_seen_at":1795556238647,"acquisition_window":{"lower":1795467600000,"upper":1795554000000},"score":55,"tags":["housing","national","rates"],"heat_signals":["dallas","austin","fed","inflation","mortgage rate","30-year fixed","existing home sales","new home sales","housing starts","trend","trends","annual","year over year","year-over-year","housing market","new home sales","housing starts"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Mortgage rates whiplash is in full effect, with jumbo loans shedding 25 bps this week"},{"id":"body-1","text":"The seesaw pattern for mortgage rates that's been the story for much of the second half of 2026 reared its head again this week as rates for major loan types declined, reversing some of the increases from prior weeks."},{"id":"body-2","text":"At HousingWire 's Mortgage Rates Center on Tuesday, rates for 30-year conforming loans averaged 7.53% — down 5 basis points from a week ago."},{"id":"body-3","text":"Rates for 30-year loans through the Federal Housing Administration (FHA) dropped 7 bps to 7.30%, while rates for 30-year jumbo loans plummeted 25 bps to 7.62%."},{"id":"body-4","text":"Rates in the mid-7% range continue to weigh on homebuyer demand and affordability metrics."},{"id":"body-5","text":"Last week's application index from the Mortgage Bankers Association showed that total applications were down 5% on a weekly basis."},{"id":"body-6","text":"MBA data released Tuesday found that affordability is about 8% weaker than a year ago , even though it improved slightly from September to October."},{"id":"body-7","text":"“Higher mortgage rates weighed on application activity last week, with the 30-year fixed rate rising to 7.35%."}],"keep":true,"importance":4,"section":"national","capital_focus":false,"geo_evidence":null,"primary_event":"market_research_policy","event_evidence_id":"body-2","event_evidence":"At HousingWire 's Mortgage Rates Center on Tuesday, rates for 30-year conforming loans averaged 7.53% — down 5 basis points from a week ago.","market_evidence_id":"body-3","market_role":"market_policy","market_scope":"us","market_evidence":"Rates for 30-year loans through the Federal Housing Administration (FHA) dropped 7 bps to 7.30%, while rates for 30-year jumbo loans plummeted 25 bps to 7.62%.","duplicate_of":null,"selector_reason":"独立的分贷款类型周度追踪：30年期合规贷款平均利率下降5个基点至7.53%，FHA贷款下降7个基点至7.30%，大额贷款下降25个基点至7.62%。","title_zh":"美国大额按揭利率一周降 25 个基点至 7.62%","summary_zh":"HousingWire 数据显示，30 年期大额按揭利率一周下行 25 个基点至 7.62%，合规按揭利率降至 7.53%。MBA 调查显示，上周购房按揭申请量同比减少 18%。","impact":"short-neg","evidence_quote":"The seesaw pattern for mortgage rates that's been the story for much of the second half of 2026 reared its head again this week as rates for major loan types declined, reversing some of the increases from prior weeks. At HousingWire 's Mortgage Rates Center on Tuesday, rates for 30-year conforming loans averaged 7.53% — down 5 basis points from a week ago. Rates for 30-year loans through the Federal Housing Administration (FHA) dropped 7 bps to 7.30%, while rates for 30-year jumbo loans plummeted 25 bps to 7.62%.","evidence_basis":"body","cre_subcategory":null},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"FHFA raises conforming loan limit to $855,400 in 2027","link":"https://www.housingwire.com/articles/fhfa-raises-2027-conforming-loan-limit-855400/","description":"The baseline conforming loan limit will rise 2.71% in 2027 to $855,400 for one-unit properties in most parts of the country, according to the Federal Housing Finance Agency (FHFA). Fannie Mae and Freddie Mac will be authorized to buy loans up to that balance in the vast majority of U.S. counties. The $855,400 cap is an increase of $22,650 from 2026 and reflects slower home price growth tied to a weaker housing market and higher-for-longer mortgage rates . The annual adjustment was 3.25% last year and above 5% in each of the prior two years. Under the Housing and Economic Recovery Act of 2008 (HERA), the national “ceiling” for high-cost areas is set at 150% of the baseline. For 2027, that ceiling will be $1,283,100 for one-unit properties in markets where 115% of the local median home value exceeds the baseline limit. Conforming caps first surpassed $1 million in these high-cost areas in 2022. Special statutory provisions apply in Alaska, Hawaii, Guam and the U.S. Virgin Islands. In these areas, the 2027 baseline loan limit for one-unit properties will be $1,283,100, while the ceiling will be $1,924,650. “Due to rising home values, the CLL will be higher in all but 24 U.S. counties or county equivalents,” the FHFA said in a statement. How FHFA set the 2027 limit Each November, FHFA publishes new conforming loan limits for the coming year. Increases resumed in 2016, after home prices returned to pre-Great Recession levels, a condition required by HERA. The statute also prevents the ceiling from declining in years when home prices fall; the cap only moves higher when national prices increase year over year. This year’s adjustment is tied to FHFA’s third-quarter 2026 House Price Index (HPI), which tracks changes in average U.S. home values over the prior four quarters. Nominal, seasonally adjusted, expanded-data HPI showed house prices rose 2.72% on average between the third quarters of 2025 and 2026, essentially matching the 2.71% rise in the baseline conforming loan limit. The new limits expand the amount of mortgage debt that can qualify for conventional financing backed by Fannie Mae and Freddie Mac . Loans above FHFA’s limits are classified as jumbos, a segment still dominated by banks and portfolio lenders that set their own credit standards and capital requirements. Mortgage lenders once again anticipated FHFA’s announcement and raised their internal conforming loan limits ahead of the official release to compete for volume. But they were conservative. Rocket Mortgage was an early mover, lifting its conforming loan limit to $845,000 for single-family homes in 48 states in September. CrossCountry Mortgage adopted the same level. Pennymac set its internal limit at $850,000, while United Wholesale Mortgage increased its one-unit cap for conventional and Department of Veterans Affairs loans to $847,440. Related More: Fannie Mae FHFA Freddie Mac","published_at":1795542157000,"mutable":false,"date_precision":"timestamp","modified_at":1795542164000,"extraction":"semantic","canonical":"https://housingwire.com/articles/fhfa-raises-2027-conforming-loan-limit-855400","content_hash":"2ea81b1721c3f0f3afa85ce6076c0a18000fc90d23a633c5f00c8d9479846daa","access":"public","evidence_status":"article","id":"0820f6e889202017","source_family":"housingwire","is_research":false,"required_source":false,"first_seen_at":1795556238647,"acquisition_window":{"lower":1795467600000,"upper":1795554000000},"score":32,"tags":["housing","national","policy","regulator"],"heat_signals":["fed","mortgage rate","freddie mac","fannie mae","annual","year over year","housing market"],"editorial_protocol":"evid 上限提高2.71%至855,400美元，高成本地区上限升至1,283,100美元。","title_zh":"美国多数地区 2027 年单套住宅合规贷款基准上限升至 85.54 万美元","summary_zh":"FHFA 表示，2027 年美国多数地区的单套住宅合规贷款基准上限将上调 2.71% 至 85.54 万美元。全国规则为高成本地区设定的单套住宅贷款最高限额为 128.31 万美元；阿拉斯加、夏威夷、关岛和美属维尔京群岛适用特别规定。","impact":"neutral","evidence_quote":"The baseline conforming loan limit will rise 2.71% in 2027 to $855,400 for one-unit properties in most parts of the country, according to the Federal Housing Finance Agency (FHFA). Fannie Mae and Freddie Mac will be authorized to buy loans up to that balance in the vast majority of U.S. counties. The $855,400 cap is an increase of $22,650 from 2026 and reflects slower home price growth tied to a weaker housing market and higher-for-longer mortgage rates .","evidence_basis":"body","cre_subcategory":null},{"source_id":"rebusiness-online","source_name":"REBusiness Online","source_tier":"A","source_weight":6,"source_tags":["mixed-asset","deals"],"region":"national","title":"Endura Advisory Group Breaks Ground on 324-Unit Multifamily Project in Boerne, Texas","link":"https://rebusinessonline.com/endura-advisory-group-breaks-ground-on-324-unit-multifamily-project-in-boerne-texas/","description":"Endura Advisory Group Breaks Ground on 324-Unit Multifamily Project in Boerne, Texas by Taylor Williams November 24, 2026 November 24, 2026 2 BOERNE, TEXAS — Local development and services company Endura Advisory Group has broken ground on The Oaks of Cibolo Creek, a 324-unit multifamily project that will be located northwest of San Antonio in Boerne. The Oaks of Cibolo Creek will be a 20.6-acre, garden-style property with one-, two- and three-bedroom units that will have an average size of 918 square feet. Amenities will include a pool, fitness center, resident clubhouse, pickleball courts and a dog park. Dallas-based UD Architects designed the project, and Franklin Construction is serving as the general contractor. Mason Joseph Co. originated an undisclosed amount of HUD-insured construction financing for the project through the organization’s 221(d)(4) program. A tentative completion date was not announced. Facebook Twitter Linkedin Email previous post Berkadia Brokers Sale of Two Apartment Buildings Totaling 131 Units in Houston next post Equus Acquires 420,643 SF Logistics Center in Wilmer, Texas You may also like Equus Acquires 420,643 SF Logistics Center in Wilmer,... November 24, 2026 Berkadia Brokers Sale of Two Apartment Buildings Totaling... November 24, 2026 Colliers Negotiates Sale of 31,000 SF Manufacturing Facility... November 24, 2026 High Street Residential, MetLife Investment Complete 244-Unit Ryder... November 24, 2026 Talonvest Capital Places $15M in Construction Financing for... November 24, 2026 Benenson Receives Rezoning Approval for 21-Story Multifamily Project... November 24, 2026 ICON Real Estate Negotiates $5M Sale of Apartment... November 24, 2026 Northmarq Arranges $75M Sale of Multifamily Property in... November 24, 2026 JLL Negotiates Sale of 126-Unit Senior Living Community... November 24, 2026","published_at":1795536755000,"source_family":"rebusiness-online","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1795556238647,"id":"d616f711b1244c58","acquisition_window":{"lower":1795467600000,"upper":1795554000000},"score":15,"tags":["multifamily","texas","construction","developer"],"heat_signals":["texas","dallas","san antonio"],"date_precision":"timestamp","modified_at":1795536757000,"extraction":"semantic","canonical":"https://rebusinessonline.com/endura-advisory-group-breaks-ground-on-324-unit-multifamily-project-in-boerne-texas","content_hash":"e22a8feaaacea04dac1c74271fe5376c18f662242987a9d429c89bf0dd4e143c","access":"public","evidence_status":"article","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Endura Advisory Group Breaks Ground on 324-Unit Multifamily Project in Boerne, Texas"},{"id":"body-1","text":"Endura Advisory Group Breaks Ground on 324-Unit Multifamily Project in Boerne, Texas ssets are trading at a median price of $491,300 per unit with cap rates closer to 5.0%. Greater Los Angeles multifamily market overviewRenter demand for apartment units in Los Angeles County has totaled more than 7,100 units year to date, slightly outpacing new supply growth. This balance between supply and demand has yielded steady operational conditions throughout much of Greater Los Angeles, although there has been some varied performance in the major geographic segments of the region. The South Bay has led the way, while the San Fernando Valley and West Los Angeles submarkets have closely tracked the larger market trend of stable performance. Conditions have continued to soften in Downtown Los Angeles in response to a supply-demand imbalance. On the whole, development trends are mixed, with the number of units delivered through the first nine months of this year lagging 2025 levels, while multifamily permitting has gained momentum. Rents on new construction have trended higher in recent periods, which could support additional development. The average rent on properties built since 2020 reached $3.93 per square foot, per month in the third quarter, its highest level in nearly three years.Led by increases in the South Bay and West Los Angeles submarkets, the multifamily investment market is beginning to gain momentum after very low transaction levels in 2024 and 2025. Year-to-date transaction counts across Los Angeles County are up 30% when compared to the same period last year, while pricing trends have been mixed. Despite the increased volume, pricing dipped in both the San Fernando Valley and West Los Angeles submarkets, where a wide range of pricing across property tiers influenced results. Year to date, Class A assets have sold for a median price of $491,300 per unit. The largest share of transactions have occurred in Class B properties, where pricing has advanced to $394,000 per unit. The Class B properties that have sold in 2026 have often been more recent vintages than in prior years and have been located in submarkets that are commanding higher rents.Employment:The unemployment rate dipped 20 basis points. Image Employment conditions have improved in recent periods after trends were volatile from 2023 to 2025. Year over year, employers have added 20,100 workers to payrolls, an increase of 0.4%. The unemployment rate dipped 20 basis points to 4.8%.The leisure and hospitality sector continued to be one of the leading areas for employment growth. In the past 12 months, this sector expanded 1.7% with the addition of 8,900 workers.The trade, transportation, and utilities sector posted a 0.1% increase in employment during the past year after hiring 600 workers. While modest, this is the first time since 2022 that this sector has recorded year over year growth. Since 2022, there have been net job losses of 39,000 positions.Forecast: Los Angeles area employment has improved faster than previously projected. In 2026, area employers are forecast to add 20,000 workers to payrolls, marking a 0.4% annual increase. This would make 2026 the strongest year for employment growth since 2022.Development and permitting:Multifamily permitting accelerated in the third quarter. Image Projects totaling roughly 2,800 units came online during the third quarter, bringing year-to-date deliveries to approximately 5,900 units. Still, this year’s pace is lagging the same period in 2025, when roughly 7,000 units were completed.There are currently roughly 13,800 units under construction in Los Angeles County. Among the major submarkets, Downtown Los Angeles leads with nearly 4,200 units under construction. West Los Angeles trails with more than 2,800 units, followed by the South Bay and San Fernando Valley submarkets with approximately 2,300 units and 2,100 units under construction, respectively.Multifamily permitting accelerated in the third quarter, building upon a strong pace of permitting in the first half of 2026. Year to date, permits have been issued for projects totaling over 14,000 units, up from roughly 6,700 at the same point in 2025.Forecast: The fourth quarter is on track to be the strongest of the year for completions, bringing estimated 2026 deliveries to roughly 9,000 units. This would mark a second consecutive year of rising completions, with deliveries up 9% year over year and 20% above the trailing five-year average.Vacancy:Year-to-date net absorption reached 7,100 units. Image The vacancy rate in Los Angeles County is currently 4.6%, in line with the previous quarter and up 10 basis points from one year ago. Absorption has picked up considerably. Year to date, there have been approximately 7,100 net move-ins, up from roughly 4,500 by the same point in 2025.Vacancy stability was supported by Class B and Class C apartments, where the vacancy rate is tracking levels recorded one year ago at 3.6%. Class A apartment vacancy increased by 40 basis points during the same period, reaching 6.3%.The South Bay outperformed the rest of the market in vacancy improvement. During the third quarter, the vacancy rate in the area decreased by 20 basis points to 4.0%. Year over year, South Bay vacancy is down 70 basis points.Forecast: Continued absorption is expected to keep the vacancy rate fr","published_at":1795453200000,"date_precision":"day","published_date":"2026-11-23","modified_at":1795453200000,"extraction":"structured","canonical":"https://northmarq.com/insights/insights/los-angeles-multifamily-rent-and-vacancy-both-hold-steady-q3-2026","content_hash":"e42a415c043ef3968ba55f841bd8a934b7bfa6746913fe9fbb4eda60daaeaf34","access":"public","source_family":"northmarq-research","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1795556238647,"id":"cb486780a1670b61","acquisition_window":{"lower":1793307600000,"upper":1795554000000},"late_discovery":true,"score":31,"tags":["multifamily","california","data","trend"],"heat_signals":["permits","forecast","trend","trends","annual","year o roughly 30% year to date compared with the same period in 2025.","market_evidence_id":"body-1","market_role":"market_policy","market_scope":"us","market_evidence":"Download the full report here.HighlightsMultifamily operating conditions in Los Angeles were largely unchanged, as both rent and vacancy remained near levels recorded one quarter ago and one year ago.The vacancy rate was unchanged in the third quarter, remaining at 4.6%.","duplicate_of":null,"selector_reason":"Northmarq独立研究显示，洛杉矶第三季度公寓空置率持平于4.6%，平均要价租金基本持平于每月2,527美元，但年内交易活动同比增加约30%。","title_zh":"洛杉矶多户租金与空置率持稳，成交活动增加","summary_zh":"Northmarq 研究显示，洛杉矶多户住宅第 3 季度空置率维持在 4.6%，平均挂牌租金为每月 2527 美元，环比和同比均基本持平；年初至今的成交活动较 2025 年同期增加约 30%。","impact":"neutral","evidence_quote":"Download the full report here.HighlightsMultifamily operating conditions in Los Angeles were largely unchanged, as both rent and vacancy remained near levels recorded one quarter ago and one year ago.The vacancy rate was unchanged in the third quarter, remaining at 4.6%.","evidence_basis":"body","cre_subcategory":"多户"},{"source_id":"realtor-news","source_name":"Realtor.com News","source_tier":"A","source_weight":6,"source_tags":["housing"],"region":"national","title":"National Home Value Growth Holds Steady, Yet Miami Outperforms","link":"https://www.realtor.com/news/trends/home-prices-values-case-shiller-index-september-2026/","description":"National growth in home values was flat month over month in September as mortgage rates accelerated and inflation continued running hot. The value of single-family homes as measured by repeat transactions increased 2.1% year over year, same as in August, according to data from the S&P Cotality Case-Shiller Index released on Tuesday. However, home values fell in real terms for the 16th consecutive month, as September's 3.7% inflation rate outpaced the home value gain by roughly 1.6 percentage points, up from about 1.3 points in August. \"Nominal home prices remain resilient, but inflation is once again widening the gap between nominal and real housing returns,\" says Rebecca Kaufman , associate director of commodities at S&P Dow Jones Indices. Across the 20 cities tracked by the index, Chicago yet again led the U.S. with a 6.9% annual gain. New York City took second place with a year-over-year increase of 5.8%, but Miami emerged as the month's surprise, finishing third with a 4.6% gain. \"Miami’s rise is particularly notable,\" points out Kaufman. \"After moving into fourth place among the 20 cities in July and August, it has now climbed into the top three, a sharp reversal from its comparatively weak performance in 2025.\" Loading... On the other side of the spectrum, Seattle recorded the largest annual decline for the fourth consecutive month at 1.9%, followed by Denver (-1.0%) and Dallas (-0.9%), reflecting a persistent regional divergence. September also revealed a widening gap between seasonal weakness and underlying price momentum. On a nonseasonally adjusted basis, the U.S. National and 10-City Composite Indices fell 0.3% and 0.5% month over month, respectively, while both rose 0.2% after seasonal adjustment. \"That contrast suggests that some of the apparent monthly weakness reflects the normal fall slowdown rather than a broad deterioration in home prices,\" adds Kaufman. The latest Case-Shiller release reflects sales closing from July through September, a period when mortgage rates moved higher, with Freddie Mac's 30-year fixed rate averaging 6.54% in July, near 6.7% in August, and 6.86% in September. Realtor.com® senior economist Anthony Smith notes that the housing market's momentum has lost steam in recent months. Contract activity softened over the same stretch, with pending home sales down 4.7% from a year earlier in August before setting a series record low in September . \"Looking ahead, the rate and demand backdrop has become more challenging since September closed,\" says Smith. After four weeks of declines, the 30-year fixed rate jumped back to 7.28% as of Nov. 19, pushed higher by hotter-than-expected October inflation and expectations for a Fed rate hike in December. Loading... The median existing-home sales price rose just 0.4% from a year ago in October, while asking prices were down 2.2% and months' supply reached its highest level since 2015. \"If financing costs stay elevated into the winter, the plateau in price growth could give way to renewed softening, particularly in supply-heavy Southern and Western markets,\" notes Smith. The Case-Shiller Index reports on a two-month delay and reflects a three-month moving average of home sales prices. Homes usually go under contract a month or two before they close, so the September report primarily reflects purchase decisions made in late summer. Although the index's price data is delayed by several months, it is considered one of the best available measures of changing home values, because it is based on repeat transactions on the same properties. Get real estate news in your inbox Sign up now Snejana Farberov is a reporter at Realtor.com covering the U.S. housing market and the latest domestic real estate trends. She has worked as a general assignment journalist in New York City and Long Island for 16 years, writing for New York Post, Daily Mail, and News 12. Snejana earned bachelor's degrees in journalism and Italian from St. John's University, followed by a master’s degree from Columbia University School of Journalism.","published_at":1795533123000,"source_family":"realtor-com","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1795556238647,"id":"49527d4836bb73d1","acquisition_window":{"lower":1795467600000,"upper":1795554000000},"score":14,"tags":["housing","florida","data"],"heat_signals":["inflation"],"date_precision":"timestamp","modified_at":1795542365000,"extraction":"semantic","canonical":"https://realtor.com/news/trends/home-prices-values-case-shiller-index-september-2026","content_hash":"18d5936889029205426495f7fc12a19e897f y programs, including launching an “express lane” for Low-Income Housing Tax Credit multifamily construction loans and making build-to-rent projects eligible for Federal Housing Administration financing. Meanwhile, the 21st Century ROAD to Housing law is now starting to be implemented . HUD and other agencies established a framework to streamline environmental review , regulation and inspection standards for housing projects. The agency also released an action plan that updates development standards for manufactured housing . The midterm results indicate more change ahead, even as housing remains a priority for both parties. To that end, the Bipartisan American Affordability and Jobs Act of 2026, which could speed up housing development, continues to advance through Congress . Read on for more about how these recent policy shifts could impact the rental housing industry. Federal permitting bill that could speed apartment construction passes Senate By Julie Strupp • Nov. 11, 2026 Bipartisan American Affordability and Jobs Act of 2026 measures could streamline permitting processes and development programs for multifamily, according to housing industry groups. Read the full article ➔ HUD finalizes rule targeting mixed-immigration-status households receiving aid By Ryan Kushner • Nov. 18, 2026 The rule could displace tens of thousands of people, housing organizations say. A lawsuit claims the change is illegal and unconstitutional. Read the full article ➔ How state multifamily measures fared in the midterms By Julie Strupp • Nov. 9, 2026 Voters across the country weighed in on funding, zoning, tax and permitting policies that could impact the rental housing industry. Read the full article ➔ What the midterm results mean for multifamily By Julie Strupp • Nov. 5, 2026 Housing affordability is likely to remain a top priority for Congress as Democrats take control, experts said. Read the full article ➔ HUD launches ‘express lane’ for LIHTC multifamily construction loans By , including launching an “express lane” for Low-Income Housing Tax Credit multifamily construction loans and making build-to-rent projects eligible for Federal Housing Administration financing.","market_evidence_id":"body-3","market_role":"market_policy","market_scope":"us","market_evidence":"HUD recently made several changes to key programs, including launching an “express lane” for Low-Income Housing Tax Credit multifamily construction loans and making build-to-rent projects eligible for Federal Housing Administration financing.","duplicate_of":null,"selector_reason":"除财政部投资者禁令征询外，稿件记录了HUD两项独立措施：为低收入住房税收抵免项目的多户建设贷款开设快速通道，并将BTR项目纳入FHA融资资格范围。","title_zh":"HUD 扩大出租住宅项目融资渠道","summary_zh":"HUD 将专为出租而建的住宅项目纳入 FHA 融资范围，并为低收入住房税收抵免多户项目的建设贷款开设快速通道。HUD 与其他机构还制定了简化住房项目环境审查的框架。","impact":"long-pos","evidence_quote":"Recent federal policy moves that impact multifamily From HUD program changes to midterm results to ROAD to Housing, these are the major policy updates that the rental housing industry should be following. Published Nov. 24, 2026 Julie Strupp Senior Editor Share Copy link Email LinkedIn X/Twitter Facebook Print Add us on Google Getty Images There has been a flurry of national housing policy activity over the past two months.","evidence_basis":"body","cre_subcategory":"多户"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Research Triangle's Biomanufacturing Surge Is Luring More Companies","link":"https://www.bisnow.com/news/raleigh-durham/life-sciences/research-triangle-biomanufacturing-surge-is-luring-more-companies","description":"Ongoing investment in biomanufacturing across the Research Triangle is drawing more companies to the region and boosting the market’s research and development sector. Large pharmaceutical companies, including AbbVie and Novartis, have committed hundreds of millions of dollars in the past year to expand their manufacturing operations in the region. Those investments are also attracting smaller biomanufacturing firms to the area, panelists said at Bisnow ’s Research Triangle Life Sciences Summit in Raleigh this month. “The ecosystem has been buoyed up by the large groups that have come here, and it has become very ripe and fertile ground for the smaller, medium-sized companies coming behind it,” Jonathon Keener, a partner at Helix Ventures, said at the Brier Creek Country Club in Raleigh. “That's what we're most excited about because that diversifies our economy here.” Wikimedia/Abhiram Juvvadi In January, contract development and manufacturing organization Alcami paid $6.7M for a 37K SF biologics lab facility in Durham. In April, pharmaceutical supplier NewLife Medicals expanded into Efland with its $4.8M acquisition of a 28K SF flex warehouse. And Ypsomed, a midsized Swiss medical technology company, is building its first U.S. manufacturing facility with a $200M investment in Holly Springs, with plans to open by the end of 2027. Shifting trade policies and increased demand for U.S.-based production have prompted the life sciences industry to put more of its focus on manufacturing. Manufacturing has become “a national priority,” sparking new demand from life sciences companies for “facilities that can support process development, pilot production and commercial-scale manufacturing,” Tyler Grimshaw, principal of architecture and engineering firm EwingCole , told Bisnow ahead of the event . Raleigh-Durham’s life sciences market is showing signs of stabilization, according to a Cushman & Wakefield third-quarter report . Nearly 2.4M SF of new life sciences space has delivered since 2021. In the third quarter, vacancy in the market fell to 26.4% from 28% in the same quarter of 2025, reaching the lowest level in two years. This year, absorption turned positive again following occupancy losses in 2024. Pexels/Pavel Danilyuk The Research Triangle has seen a slew of large biomanufacturing real estate investments over the past year. Last month, diagnostic imaging company Bracco Imaging announced a $230M investment in a manufacturing facility in Sanford, just south of the Triangle. In April, AbbVie announced a $1.4B investment to build a 185-acre pharmaceutical manufacturing campus in Durham, with completion slated for the end of 2028. And in May, Novartis announced plans to add a new $220M facility , spanning 56K SF in Morrisville, part of a $23B U.S. manufacturing and R&D commitment . After a period of large-footprint commitments, smaller biomanufacturing companies are also coming to the Triangle. “There's been a slowdown in some of the larger users — and there's definitely been an uptick in the more medium- to small-range-size users,” said Carolyn Coia, vice president of real estate at Research Triangle Park . Part of that uptick is also due to the Research Triangle’s talent pool, flowing from North Carolina State University, Duke University and other universities in the area. “What North Carolina is great at is producing the future employees” for pharmaceutical companies, said Michael Morgan, managing director of tenant representation at JLL. Life sciences employment in the Research Triangle grew 21% from 2020 through 2025, reaching more than 58,000 workers across more than 650 companies, according to a 2026 Wake County Economic Development report . The region's employment concentration sits at 2.64 times the national average, outpacing national growth benchmarks, the report said. Panelists expect continued life sciences growth as regional talent keeps bringing in companies. “Once they come with their first initial investment, putting their toe in the pond, they realize what that talent can do for them, and they quickly double down,” Keener said. Continue reading this story with a free account Log in or register Related Topics: Biomanufacturing , Research Triangle Park","published_at":1795546067000,"mutable":false,"date_precision":"timestamp","modified_at":179554607300 arch_policy","event_evidence_id":"body-2","event_evidence":"Large pharmaceutical companies, including AbbVie and Novartis, have committed hundreds of millions of dollars in the past year to expand their manufacturing operations in the region.","market_evidence_id":"body-1","market_role":"market_policy","market_scope":"us","market_evidence":"Ongoing investment in biomanufacturing across the Research Triangle is drawing more companies to the region and boosting the market’s research and development sector.","duplicate_of":null,"selector_reason":"AbbVie和Novartis等药企过去一年承诺投入数亿美元扩建研究三角区的制造业务；小型企业跟进是当地业者的观察，正文未给出新增租赁规模。","title_zh":"北卡研究三角区生物制造扩张吸引更多企业","summary_zh":"艾伯维、诺华等大型药企过去一年承诺投入数亿美元，扩大在北卡研究三角区的制造业务。行业峰会与会人士称，大企业的投资也在吸引规模较小的生物制造企业进入当地。","impact":"long-pos","evidence_quote":"Ongoing investment in biomanufacturing across the Research Triangle is drawing more companies to the region and boosting the market’s research and development sector. Large pharmaceutical companies, including AbbVie and Novartis, have committed hundreds of millions of dollars in the past year to expand their manufacturing operations in the region. Those investments are also attracting smaller biomanufacturing firms to the area, panelists said at Bisnow ’s Research Triangle Life Sciences Summit in Raleigh this month.","evidence_basis":"body","cre_subcategory":"工业"},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Local governments sue HUD over mixed-immigration-status rule change","link":"https://www.multifamilydive.com/news/local-governments-sue-to-block-radical-hud-mixed-immigration-status-rule/875659/","description":"Local governments sue HUD over mixed-immigration-status rule change The lawsuit argues the rule is “callous, ill-conceived, and illegal” and that cities lack shelter capacity to handle the resulting homelessness. Published Nov. 24, 2026 Ryan Kushner Reporter Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Chicago is among the local governments suing the U.S. Department of Housing and Urban Development over a rule change that would require recipients of federal housing aid to provide proof of eligibility for all household members. Getty Images First published on Dive Brief: A coalition of local governments and public housing authorities filed a lawsuit Monday to halt a U.S. Department of Housing and Urban Development rule that would block households with mixed immigration statuses from receiving federal housing assistance. The rule, scheduled to go into effect Dec. 14, is “callous, ill-conceived, and illegal,” and a violation of the Administrative Procedure Act, the lawsuit states. HUD’s rule change could displace at least 15,500 mixed-status families, according to the suit, placing additional burden on localities’ already-strained homeless shelter and support systems. Dive Insight: Households with mixed immigration statuses have for decades been able to receive federal housing assistance, prorated based on the number of household members who verify they are U.S. citizens or have eligible immigration status, according to plaintiffs. On Nov. 10, HUD announced all recipients of federal housing aid would be required to provide proof of eligibility for all household members. “The final rule includes any tenants currently living in ‘mixed status’ households that have exploited regulatory loopholes by enabling illegal aliens and ineligible noncitizens to latch on to those with eligible status,” the agency stated. The coalition filed their lawsuit Monday in the U.S. District Court of Massachusetts. Other lawsuits challenging the rule have also been filed by states and Los Angeles-area tenant organizations and housing advocacy groups. “HUD’s Final Rule is a radical departure from the law and decades of past practice and regulations,” San Francisco City Attorney David Chiu, representing the city in the Nov. 23 lawsuit, said in a news release. “Cities across the country are coming together to fight this callous and illegal change that is designed to push immigrant families into homelessness.” Along with San Francisco, plaintiffs include Boston; Chicago; the City and County of Los Angeles; King County, Washington; New York City; Providence, Rhode Island; San Diego; Santa Clara County, California; Seattle, and eight public housing authorities. Recommended Reading Homeless population declined 6.3% in January point-in-time count, HUD says Smart Cities Dive How a changing US immigration landscape is impacting the housing crisis Smart Cities Dive The US homeless population is aging. Cities must brace for new challenges. Smart Cities Dive Add us on Google Share Copy link Email LinkedIn X/Twitter Facebook Print License Filed Under: Litigation","published_at":1795534890000,"mutable":false,"evidence_status":"article","enrichment_error":"HTTP 403","source_family":"multifamily-dive","is_research":false,"required_source":false,"first_seen_at":1795556238647,"id":"b02c81b439ad9b3e","acquisition_window":{"lower":1795467600000,"upper":1795554000000},"score":15,"tags":["housing","national","policy","regulator"],"heat_signals":[],"date_precision":"day","published_date":"2026-11-24","modified_at":0,"extraction":"semantic","canonical":"https://multifamilydive.com/news/local-governments-sue-to-block-radical-hud-mixed-immigration-status-rule/875659","content_hash":"10181c865db2d7d2e5a4906e6a387ed1a8cb792ff4e0ca4f18a4f9671b293d21","access":"public","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Local governments sue HUD over mixed-immigration-status rule change"},{"id":"body-1","text":"Local governments sue HUD over mixed-immigration-status rule change The lawsuit argues the rule is “callous, ill-conceived, and illegal” and that cities lack shelter capacity to handle the resulting homelessness."},{"id":"body-2","text":"Published Nov. 24, 2026 Ryan Kushner Reporte
