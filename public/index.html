laces for BTR construction, based on the number of 2024 completions: City Build-To-Rent Units Completed in 2024 Phoenix, Arizona 4,460 Dallas, Texas 3,197 Atlanta, Georgia 3,035 Houston, Texas 2,505 Charlotte, North Carolina 1,415 Jacksonville, Florida 1,201 Huntsville, Alabama 1,098 Columbus, Ohio 1,018 Tampa, Florida 1,005 Minneapolis, Minnesota 926 These were the top five states in build-to-rent completions: Texas : 6,994 units completed in 2024 Florida : 5,379 units Arizona : 4,812 units Georgia : 4,095 units North Carolina : 2,826 units So how will all this new inventory affect rental rates? That&#x27;s hard to predict. Learn More: 25 Most Livable Cities for Middle-Class Families Advertisement Usually, a boost in rental housing supply is very good news for renters: Not only do they have more options to choose from, but they might also witness rent cooling off a bit, Andra Hopulele, author of the Point2Homes study, said in email comments shared with GOBankingRates. More deliveries usually dampen rent growth, she added. But that&#x27;s not always the case. While record levels of BTR construction have helped slow rent growth in certain areas, development hasn&#x27;t yet reached the scale needed to fully meet demand, Hopulele said. In many metro areas, rents are still rising — driven largely by the continued surge in demand for rental housing. Indeed, recent data from iPropertyManagement.com shows that so far in 2025, the nation&#x27;s average monthly rent is up 7.52% from last year. Here are the average annual U.S. rent increases since the beginning of the decade: 2024 : 5.11% 2023 : 7.95% 2022 : 6.03% 2021 : 6.76% 2020 : 3.12% At the same time, rents in some markets have been heading lower of late — including some of the cities on Point2Homes&#x27; list of busiest BTR markets. For example, the average rent in Phoenix for all bedrooms and property types was $1,850 a month as of April 21, 2025, according to Zillow. That represents a decline of $135 from the previous month and $218 from the previous year. Similar declines have been reported in Dallas, Atlanta, Houston and Charlotte. More From GOBankingRates 6 Used Luxury SUVs That Are a Good Investment for Retirees How Middle-Class Earners Are Quietly Becoming Millionaires -- and How You Can, Too 7 Overpriced Grocery Items Frugal People Should Quit Buying in 2025 4 Low-Risk Ways To Build Your Savings in 2025 Sources Point2Homes, Build-to-Rent Sector Reaches Historic High With 39,000 New Single-Family Rental Completions 110,000 More Underway . Andra Hopulele, author of the Point2Homes study Additional rent data from Zillow and iPropertyManagem","published_at":1782493799000,"score":38,"tags":["btr-sfr","institutional","texas","houston","dfw","sun-belt","trend"],"heat_signals":["build-to-rent","btr","single-family rental","texas","houston","dallas","sun belt","annual","rent growth"],"importance":3,"_from_fallback":true,"section":"btr","title_zh":"BTR在Sun Belt扩张，租金或受缓冲","summary_zh":"2024年新建单户出租达约39,000套，Phoenix、Dallas 等市场领跑，供应增加利空租金","impact":"short-neg","id":"63754830","fetched_at":1782526016890},{"source_id":"connect-cre","source_name":"Connect CRE","source_tier":"A","source_weight":7,"source_tags":["mixed-asset","deals"],"region":"national","title":"Lee &#038; Associates Closes Suburban Chicago Industrial Leases","link":"https://www.connectcre.com/stories/lee-associates-closes-suburban-chicago-industrial-leases/","description":"Lee &#38; Associates has closed two industrial leases in the Western Chicago suburbs totaling 131,417 square feet. Sean Austin, Principal at Lee &#38; Associates of Illinois, represented the tenant, Nuvomed, Inc., a company that develops and sells affordable health and wellness products, on their new lease of 54,087 square feet at 200 Fencl Lane, Hillside, ... The post Lee & Associates Closes Suburban Chicago Industrial Leases appeared first on Connect CRE .","published_at":1782501154000,"score":12,"tags":["industrial","deals","brokerage"],"heat_signals  about a DSA candidate becoming mayor because they don’t know what it means.” Lewis George, who campaigned on expanding social programs, would enter office as the city faces a $1.1 billion deficit. Developers worry she could be more receptive to new taxes to close the gap, including a proposed wealth tax that would require City Council approval. The latest iteration is a 3 percent surcharge on passive income and capital gains for people earning more than $400,000 per year, or $500,000 for joint filers. The tax is estimated to raise $200 million in the first year and $100 million in the second year. SIGN UP Lewis George has not said whether she will support the wealth tax — her predecessor, Mayor Muriel Bowser, warned against it — but developers fear the proposal would come at a particularly vulnerable moment. The region has already experienced increased out-migration. Between January 2025 and January 2026, the Greater D.C. area lost about 104,000 jobs, the most of any metro area in the country, according to the Bureau of Labor Statistics. Residential vacancy in the region jumped from 6 percent in 2024 to 8 percent in 2026, according to advocacy group Greater Greater Washington. Lainer pointed to federal job cuts under the Trump administration as a source of the economic pain. “Elon Musk running around D.C. with a chainsaw was not really conducive to growth,” Lanier said. Still, some developers believe Trump’s continued influence over the city could temper Lewis George’s agenda. The president has repeatedly threatened to “take back” D.C., leading some in the industry to believe the new mayor may avoid policies that provoke federal intervention. “The question is what can she actually do?” said Ian Ruel, co-founder of local developer Feldman Ruel. “She can only posture so much toward him until he pisses him off to a detrimental level.” Still, the new mayor has sought to appeal to developers with her campaign promise to build 72,000 new units over the next five years. D
