1.8B defense technology company is eyeing a huge Fort Worth industrial building it could use to produce unmanned aircraft systems . Wikimedia Commons/Lt. Col. Leslie Pratt The California-based Mach Industries is considering the 310K SF Alliance Gateway 34 industrial building in Hillwood ’s AllianceTexas master-planned community for the site of its next manufacturing plant. The Fort Worth City Council is expected to vote on a $4.5M economic incentive package for the project in August, according to the Fort Worth Report . If Mach Industries chooses the Fort Worth site, the company plans to invest at least $74M to upgrade the building and add equipment. The economic development agreement would include tax abatements and grants covering the company’s first decade of operations. The defense technology manufacturer is also considering other sites across the country for the plant. However, Fort Worth Director of Economic Development Jessica Rogers said an incentive package and local support would make the Alliance location the company’s preferred landing spot. “The project represents a large creation of skilled manufacturing and engineering positions,” Rogers said during a June 23 council work session. “This is also a growing company and a growing industry sector where we’re seeing a lot of innovative technologies and advanced manufacturing being integrated.” The proposed incentive package would require Mach Industries to hire at least 1,000 employees with an average annual salary of more than $67K. The company would need to keep at least 600 of those positions to continue receiving prorated incentives. Mach Industries would lose its incentives if more than 50% of the jobs paid less than $60K per year at any point during the 10-year agreement. Mach Industries is expected to choose a location for its manufacturing site in the third quarter. The 3-year-old startup raised $300M in a Series C funding round, it announced earlier this month. The capital infusion was led by new investors Infinite Capital and Ribbit Capital, valuing the company at $1.8B. Rogers said aerospace and defense manufacturers like Mach Industries are the prime targets for the city’s Economic Development Department. Gov. Greg Abbott designated Fort Worth the state's aviation and defense capital last year. There are more than 600 aerospace and defense-related companies in the area, including Lockheed Martin Corp., Bell and American Airlines . Brazilian aerospace company Embraer began a $70M expansion in Alliance in October. The addition to its maintenance and repair hangar at the Perot Field Fort Worth Alliance Airport is expected to increase the firm's U.S. capacity by 53% when it wraps up next year. MP Materials Corp. is also developing a large-scale magnet manufacturing campus in Alliance that will boost its annual production capacity of neodymium-iron-boron magnets, which are used in defense applications, data centers and semiconductor manufacturing. The company will invest $1.25B to build the 120-acre campus. Contact Billy Wadsack at billy.wadsack@bisnow.com Related Topics: Hillwood , drone , AllianceTexas , unmanned aircraft systems , Ribbit Capital , Fort Worth City Council , Mach Industries , Jessica Rogers , Infinite Capital","published_at":1782320820000,"score":18,"tags":["deals","data-center","industrial","texas","dfw","california","trend","earnings"],"heat_signals":["texas","dallas","fort worth","annual"],"importance":3,"_from_fallback":true,"section":"cre","title_zh":"国防科技公司盯上 Fort Worth 310K SF 厂房","summary_zh":"Mach Industries 考察 Alliance Gateway 34，若落地将投至少$74M 改造并新增制造岗位","impact":"long-pos","id":"e5729e15","fetched_at":1782370119427,"cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"5 Years After Deadly Surfside Collapse, Investigators Say Building Failure Began Weeks Prior","link":"https://www.bisnow.com/south-florida/news/multifamily/investigators-say-condo-deadly-surfside-collapse-had-been-failing-for-almost-a-month-135153","description":"News 5 Years After Deadly Surfside Collapse, Investigators Say Building Failure Began Weeks Prior South Florida Multifamily View count: South Florida Multifamily June 24, 2026 | 9:03 p.m. ET Chloe Gallivan, South Florida Five years after the collapse of the Champlain Towers South condo building that killed 98 people in Surfside, Florida, federal investigators have new information on the timeline of events. The columns holding up the pool deck, long believed to be the likely cause of the incident, began failing weeks before the June 24, 2021, tragedy, according to the National Institute of Standards and Technology . Wikimedia Commons/Miami-Dade Fire Rescue Department The rubble of Champlain Towers South in Surfside, Florida, after it collapsed in 2021 The NIST team, which began its investigation the day after the collapse, said two connections between garage columns and the pool deck failed in early June 2021, causing cracks to grow and loads to redistribute in the pool deck. This led to the transfer of loads to column connections that weren’t strong enough to support them. Three weeks later, investigators — who are now writing the final report with recommendations for changes in standards, codes and practices — said the pool deck fell onto the underground parking garage in the middle of the night, causing two-thirds of the 12-story building to collapse, burying nearly 100 people under tons of rubble. Judith Mittani-Reisner, who co-led the investigation with Glenn Ball, said in a video released Monday that buildings are supposed to be designed with margins against failure. That wasn't the case with the Champlain Towers. “They should be able to support much more load than they are expected to bear,” Mitrani-Reiser said. “In the case of Champlain Towers South, however, these margins against failure were too narrow from the start.” There had been concerns about the structural integrity of the building, built in 1981. Morabito Consultants, which was ordered to pay $16M to the victims of the collapse in 2022, reported that it had significant structural damage in 2018. “The failure did not begin three weeks before the collapse,” Martin Langesfeld, a Miami real estate broker who lost his sister and her husband in the tragedy, said in an email . “That is when the building was already breaking down. “This failure began 40 years earlier, when the building was designed, approved, built, inspected, and allowed to stand with problems that should have been caught and prevented.” Following the collapse, Florida lawmakers passed Senate Bill 4-D in 2022, requiring buildings at least 30 years old and three stories or taller to conduct structural inspections every 10 years and fully fund reserves for major repairs. The legislation was designed to prevent another tragic building failure, but it has caused severe ripple effects for the owners of aging condos. Owners in buildings constructed before the 1990s, often retired and older adults on fixed incomes, have been grappling with skyrocketing association fees and insurance premiums. Many associations that complied with the law have faced multimillion-dollar repair bills, with some opting to sell their building as a result. But the majority were slow to adapt to the new rules. Plus, the threat of special assessments and insurance hikes thrust many older buildings into a financial “doom loop,” with owners forced to drop prices to sell their units, lowering values for their neighbors. Units in buildings 30 years or older made up 86% of the 19,000 active condo listings by the beginning of 2025, and values plummeted, in some cases by more than 30%. The Federal Housing Finance Agency is increasingly blacklisting aging units from using Fannie Mae mortgages if they don't increase their reserve ratios and secure more robust insurance policies. Some engineers, who are needed to conduct the legally  pilot the enterprise wavered on under President Biden, scuttling the test in 2023. That administration revived it in 2024. Fannie and Pulte have continued the pilot under President Trump adding a new vendor to the test last year. They plan to end the test on Nov. 30, 2027, according to information posted on Fannie's website. Rate has cited potential closing cost savings of up to $2,000 from the pilot. But insurers have warned that waivers can leave loans without sufficient protection from impact of ownership challenges that undermine collateral property values in costly ways. A new First American study released Tuesday aims to reinforce this with findings from various data sets. Insurers \"protect homeowners, lenders and taxpayers from substantial financial risk,\" Paul Hurst, chief strategy officer at First American, in a press release issued in conjunction with the company's report. Paul Hurst, chief strategy officer at First American If no curative lien work was done on refinance transactions, the costs would be in the billions of dollars a year for other industries, including the mortgage business, according to an analysis of 2014-2023 data from the company and the American Land Title Association. Removing refinances that have relatively less title risk than others from the universe of loans insurers cover could raise premiums, according to First American's study. \"Purposefully removing lower risk refinances from the insurable pool would only increase the cost to the remaining borrowers as investors adjust for the unmitigated title risks,\" the company wrote. \"In the end, selective removal of low-risk participants from an insurance pool either drives up premiums for those who can least afford it or makes some risks altogether uninsurable.\" Even refinances \"are not zero-risk\" and are susceptible to concerns like fraudulent liens that typically occur years after the initial title search at origination, according to the report, which references a 2019 Milliman study's findings. First American also noted that its own data shows that between 2012 and 2023, around 70 months or 5.9 years passed before 2012-2016 vintage loans experienced 80% of their losses. For the 2027-2021 vintages, 23 months or 2.7 years passed before roughly 50% of losses materialized. \"This timing dynamic has important implications if large segments of the market move to waive or replace traditional title insurance,\" the company wrote. \"Short-term cost savings are likely to be unreliable data, as the long-term costs of clouded titles, contested liens, and litigation will not be known for years.\" Bonnie Sinnock Capital Markets Editor Bonnie Sinnock is National Mortgage News' Capital Markets Editor at Arizent and has worked for NMN and affiliated publications since 1995. Her... Read full bio twitter mailto linkedin","published_at":1782329519000,"score":15,"tags":["policy","regulator"],"heat_signals":["fed","fannie mae"],"importance":4,"selector_reason":"GSE 与 title waiver pilot 扩围关系到按揭流程、过户风险和交易效率，属于住房金融的重要制度调整。影响面广但非系统级重构，评为4。","section":"national","title_zh":"Pulte 推进 title waiver pilot，行业警示风险","summary_zh":"FHFA 扩大 refi title waiver 试点，最高可省$2,000，但保险方警告风控不足","impact":"neutral","id":"09589e38","fetched_at":1782370119427},{"source_id":"trd-national","source_name":"The Real Deal (National)","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Supreme Court limits home equity claims in tax foreclosure case","link":"https://therealdeal.com/national/2026/06/24/supreme-court-limits-equity-claims-in-tax-foreclosure-case/","description":"The U.S. Supreme Court handed local governments a significant win in the fight over home equity theft, ruling that homeowners whose properties are seized and sold for unpaid taxes generally aren’t entitled to compensation based on a home’s full market value. In a unanimous decision Tuesday, the court held that the benchmark for “just compensation” after a tax foreclosure sa
