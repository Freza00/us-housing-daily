sed from the previous month to 1,961,000 properties. President of ICE Mortgage Technology Bob Hart said elevated homeowner equity continues to help many distressed borrowers avoid foreclosure despite the increase in early foreclosure activity. &#8220;High levels of homeowner equity continue to strengthen the market and help many distressed borrowers avoid foreclosure,” Hart said. “Still, early foreclosure activity bears watching, making timely data and proven servicing tools more important than ever. ICE’s McDash loan-level performance data is relied upon by many of the industry’s leading participants to monitor portfolio performance and model default risk, while our Loss Mitigation solution helps servicers improve borrower outcomes by executing workout strategies more efficiently while supporting compliance.” Mortgage prepayment speeds slowed in June, the report found. The single-month mortality rate fell to 0.77%, a five-month low, as mortgage rates remained elevated, although prepayment activity was still above year-ago levels. As of June 30, ICE estimated there were 1.96 million properties at least 30 days delinquent but not in foreclosure and 292,000 properties in foreclosure pre-sale inventory, bringing the total number of non-current loans to approximately 2.25 million. This article was generated using HousingWire Automation and reviewed by a HousingWire editor before publication. Related More: Delinquencies Foreclosure Intercontinental Exchange","published_at":1784902228000,"score":32,"tags":["housing","national","distress","data","lender"],"heat_signals":["fed","mortgage rate","trend","trends","annual","year over year","housing market"],"importance":4,"selector_reason":"ICE 数据显示 6 月 mortgage defaults 稳定且 FHA 新违约同比下降 15%，说明按揭信用压力暂未恶化。该数据影响服务商、信用风险和住宅周期判断，评为 imp=4。","section":"national","title_zh":"Mortgage default 走平，FHA 新违约降15%","summary_zh":"ICE 称 delinquency 率3.55%，低于疫情前；FHA 新违约 YoY -15%","impact":"long-pos","id":"26d599ac","fetched_at":1784945104715},{"s eal-estate-news/congress-judiciary-subcommittee-investigation-compass-mred-antitrust/","description":"A congressional subcommittee is probing brokerage giant Compass' private listings partnership with the Midwest Real Estate Data MLS.","published_at":1784919592000,"score":10,"tags":["housing","national","policy","brokerage"],"heat_signals":[],"importance":4,"selector_reason":"国会小组调查 Compass 与 Chicago MLS 的 private listings 合作，触及经纪平台、MLS 数据和竞争规则。监管介入可能影响全国住宅交易基础设施，评为 imp=4。","section":"national","title_zh":"Congress 调查 Compass private listing 合作","summary_zh":"国会审查 Compass 与 Midwest MLS 私域房源交易，brokerage 合规风险上升","impact":"short-neg","id":"490372a4","fetched_at":1784945104715},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Why homebuilders aren't building more homes","link":"https://www.housingwire.com/articles/why-homebuilders-arent-building-more-homes/","description":"Today, the new home sales data perfectly explains why housing permits are near cycle lows and why we can’t get any traction on building more homes in America, as we have been basically stuck in one sales range for 10 years. If I take away the surge in new home sales early in COVID and the lows in 2022, we have been in the same sales range for a very long time. Even at this low level new home sales are massively outperforming existing home sales, as sales are at 2019 levels, which would equate to 1 to 1.3 million more existing home sales, but the builders live in a sub-6% world, where existing home sales don’t. With today&#8217;s charts, you can see why housing permits are near cycle lows. New home sales From Census : New Home Sales: Sales of new single-family houses in June 2026 were at a seasonally-adjusted annual rate of 628,000, according to estimates released jointly today by the U.S. Census Bureau and the Department of Housing and Urban Development. This is 1.6 percent (±14.8 percent)* above the May 2026 rate of 618,000, and is 5.6 percent (±13.2 percent)* below the June 2025 rate of 665,000. The reality for new home sales is that we are stuck in a channel here: sales grow toward 700,000 and then fade toward 600,000, and back and forth we go for the last 10 years. And it takes us nowhere. If you take the COVID highs in sales and the lows in 2022 away from the data, we are still trending at 2019 levels, as the chart below shows. The builders have used their profit margins to help buy down rates to keep sales elevated, because without sub-6% mortgage rates, new home sales would be worse today. A huge part of the profit margin story for the builders was the massive price gains they locked in during COVID. They have used those margins to buy down rates, but those profit margins are falling. This is one reason the residential employment data hasn’t cracked as it has in previous cycles. Small progress on supply In December of 2024, I wrote about how the builders had a supply and demand problem . While people like to focus on the monthly supply for new home sales, I like to focus on the completed units for sale. History has shown us that over the decades, when this data gets over 120,000, the builders really pull back from construction. As you can see in the chart below, completed units for sale are no longer rising, but the builders have made little progress here. You can see by the builder confidence indexes that they&#8217;re not very excited. It’s very hard to get growth in housing construction when the builders&#8217; confidence and subcomponents of this index are trending this low. Conclusion Of course, mortgage rates rose to yearly highs yesterday, which isn’t going to be great for the builders. Higher rates mean they will need to use more of their profit margins to move product and they&#8217;ll be even less enthusiastic to build more homes. For now, think of the new home sales market as basically stuck in mud, slowly trying to work down the inventory level and waiting to get more confident about sales growth before they start issuing housing permits. Related More: New Home Sales","published_at":1784912774000,"score":30,"tags":["housing","national","construction","data","homebuilder"],"heat_signals":["mortgage rate","existing home sales","new home sales","permits","trend","annual","new home sales"],"importance":3,"selector_reason":"该文解释为什么 builders 没有加快建房，涉及 permits、销售区间和住房供应瓶颈。它不是新的宏观数据发布，但对全国供给约束有解释价值，评为 imp=3。","section":"national","title_zh":"New home sales 低迷拖累 permits","summary_zh":"June new home sales 628K，十年多在600K-700K区间震荡，builder 扩建动力不足","impact":"long-neg","id":"bd229af1","fetched_at":1784945104715}],"errors":[{"source":"The Real Deal (National)","error":"HTTP 403","attempted_urls":["https://therealdeal.com/national/feed/"]},{"source":"Houston Agent Magazine","error":"HTTP 403","attempted_urls":["https://houstonagentmagazine.com/feed/"]},{"source":"Phoenix Agent Magazine","error":"HTTP 403","attempted_urls":["https://phoenixagentmagazine.com/feed/"]},{"source":"Atlanta Agent Magazine","error":"HTTP 403","attempted_urls":["https://atlantaagentmagazine.com/feed/"]},{"source":"Miami Agent Magazine","error":"fetch failed","attempted_urls":["https://miamiagentmagazine.com/feed/"]},{"source":"Texas Real Estate Research Center (TRERC)","error":"HTTP 403","attempted_urls":["https://trerc.tamu.edu/feed/"]}],"_diagnostics":{"writer_mode":"global","sectionsUnderMin":[],"window_hours":24,"pool_sizes":{"24h":86,"48h":122,"72h":149},"us_holiday":{"today_us":"2026-07-24","today_us_holiday":null,"yesterday_us_holiday":null,"tomorrow_us_holiday":null,"is_us_weekend":false,"expected_recovery_bj_date":null,"source":"date.nager.at"},"writer_audit":[{"stage":"selector","input":116,"output":40},{"stage":"tagger","items":40},{"stage":"dedupe","before":40,"after":39},{"stage":"pick","section_counts":{"national":7,"sunbelt":3,"btr":1,"cre":5,"institutional":4}},{"stage":"translator","items":20}],"candidate_pool_size":11
