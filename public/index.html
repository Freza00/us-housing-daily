 supply shortage and affordability crisis by reducing regulatory barriers that slow construction and providing grants to states and local governments to encourage new development. The law’s key provisions modernize permitting, zoning, and land-use requirements and encourage public and private investment in housing development. The law also expands funding options under the Community Development Block Grant Program and streamlines federal environmental reviews for certain small-scale housing projects. It also raises the public welfare investment limit for community banks to support affordable and low-income housing and, beginning 180 days after enactment, will prohibit large institutional investors from purchasing single-family homes, subject to exceptions. The law responds to broad agreement that the United States faces a serious housing supply shortage. Although estimates vary, housing data suggests that the country faces a shortage of 4 to 5 million homes. Annual home construction fell sharply after the financial crisis began in 2007 and has not returned to the levels recorded in the preceding two decades. The supply shortage drives the housing affordability crisis. U.S. home prices recently hit record highs and have outpaced national wage growth over the last decade. Rising interest rates have also strained housing affordability and pushed mortgage rates to their highest levels in 20 years. Higher borrowing costs burden first-time buyers, and owners who secured mortgages with lower rates may hesitate to sell. This “lock-in” effect exacerbates an already tight housing supply. Policymakers have called for zoning reform to address the housing supply and affordability crisis. Local governments typically enact zoning rules that govern how private land may be used and developed. Many zoning rules prohibit multifamily housing. Researchers estimate that local zoning permits only single-family homes on roughly three-quarters of land in U.S. cities, limiting where developers may build denser housing. Several states have reformed local zoning laws to address their role in the supply shortage. In 2019, Oregon became the first state to pass comprehensive legislation prohibiting single-family zoning in most cities. Early data suggests that multifamily housing permits in the state are on the rise compared with single-family permits. California has passed legislation that streamlines zoning approvals and allows duplexes and multifamily housing in areas previously reserved for single-family homes. In North Carolina, however, a bipartisan proposal to preempt local zoning laws and legalize duplexes, triplexes, and townhomes stalled after local governments opposed it. In this week’s Saturday Seminar, scholars debate the effects of zoning laws on housing supply and affordability and offer ideas for reform. In a Vanderbilt Policy Accelerator white paper , Dave Uejio , Chief Operating Officer of Prosperity Now , argues that expanding housing supply requires more than loosening regulations and relying on private developers. Uejio acknowledges the value of zoning reform and other supply-side measures reflected in the 21st Century ROAD to Housing Act but argues that private capital alone cannot produce affordable housing at the scale or speed needed. Uejio proposes using existing federal institutions that finance housing and executive authority to expand community-owned housing, particularly community land trusts. By urging Fannie Mae, Freddie Mac, the Federal Home Loan Banks, and state housing finance agencies to support community ownership, Uejio offers a way to increase supply while keeping homes affordable over time. In a University of Pennsylvania Law Revie","published_at":1787848936000,"score":26,"tags":["btr-sfr","institutional","multifamily","california","macro","rates","policy","deals","trend"],"heat_signals":["fed","mortgage rate","permits","freddie mac","fannie mae","annual"],"importance":3,"_from_fallback":true,"section":"btr","title_zh"
