tails show inflation remains broad-based. December Fed hike odds jumped to 99% and the 10-year Treasury yield moved higher, putting new upward pressure on mortgage rates after three straight weekly declines. Here's what today's report means for the Fed, consumers, and the housing market. October 2026 CPI at a Glance Headline CPI: +0.4% MoM Seasonally Adjusted (SA), following September's +0.6% rise, versus forecasts of +0.2% to +0.3%; BLS did not publish an annual rate because October 2025 data were not collected during the government shutdown Core CPI (less food & energy): +0.3% MoM (SA), matching September and August, versus a forecast of +0.2% Energy: +0.7% MoM (SA) after +5.2% in September; gasoline +1.0% MoM (SA) and +37.4% YoY Food: +0.5% MoM (SA), with food at home up 0.4% and food away from home up 0.5% Shelter: +0.3% MoM (SA) after +0.4% in September, with rent up 0.2% and owners' equivalent rent up 0.3% Real earnings: real average hourly earnings were unchanged, as 0.4% wage growth matched 0.4% inflation Fed outlook: odds of a December hike jumped to 99%, with Governor Waller's comments putting a 50 basis point move on the table Market reaction: the 10-year Treasury yield was up 9 basis points 25 minutes after the release Mortgage rates: Freddie Mac's 30-year rate fell to 7.18% in the week of November 5, the third straight weekly decline, after peaking at 7.4% in October October CPI: a touch hotter than expected, and inflation remains broad-based October’s CPI came in a touch hotter than consensus, with headline up 0.4% month over month (versus a forecasted 0.2 to 0.3%) and core inflation rising 0.3% month over month compared to an expected 0.2%. These figures hardly qualify as a shock to markets or the outlook, but the details of the report show inflation remains broad-based, with food, energy, shelter, and vehicles all up, to name a few. The BLS did not publish annual rates because of last year’s government shutdown, but headline inflation likely remains in the high 3s. These are the costs most salient to consumers and voters, as we saw, yet the Fed has less direct control over them. What it means for the Fed: a December hike looks almost certain The same supply-side and geopolitical pressures are still at work, with energy playing an important role and tariff-driven goods inflation not going away. These are the costs most salient to consumers and voters, as we saw, yet the Fed has less direct control over them. On the Fed outlook, a December hike now looks almost certain, with odds jumping to 99% this morning . That market reaction is both due to the warmer than anticipated CPI print and Governor Waller’s comments (which occurred prior to the CPI report) putting a 50 basis point move on the table for December. Additional hikes in early 2027 look more in play as well, with the 10-year Treasury up 9 basis points just 25 minutes after the CPI report release. What it means for housing: mortgage rates could turn higher again For housing in the near term, we could see upward pressure on mortgage rates again. After three straight weekly declines to 7.18% , rising Treasury yields and growing speculation about hikes in early 2027 could reverse that trend. October’s spike to 7.4% showed how quickly higher rates hurt demand, with contract signings and new listings each falling about 10% from September as buyers and sellers pulled back . Rate swings grab the headlines and matter for the marginal buyer, but the real wage squeeze is a longer-run, underexplored headwind for demand. Real average hourly earnings were flat in October as 0.4% wage growth matched 0.4% inflation, leaving annual real wage growth negative for buyers already facing mortgage rates above 7% .","published_at":1794329535000,"source_family":"realtor-com","is_research":true,"required_source":true,"mutable":false,"first_seen_at":1794346644132,"id":"2be648cc673a840f","acquisition_window":{"lower":1794258000000,"upper":1794344400000},"score":20,"tags":["housing"," hot markets, including San Francisco, where they rose 16.8% year over year, and the greater New York City area. Home sales fell as mortgage rates surpassed 7%–but flattening prices could bring buyers a bit of relief. Would-be sellers are starting to pull back as demand declines, but the total number of homes for sale climbed to its highest level since 2020. For three years, U.S. home-sale prices rose from a year earlier every single month, even as mortgage rates climbed and would-be buyers pulled back. That streak has ended. The median home-sale price declined 0.4% year over year to $388,634 in October. That’s the first decline since May 2023 and a sharp slowdown from the 2.5% gain just two months earlier. With Americans’ wages growing about 4% year over year , even a slight dip in prices can improve affordability. Sale prices have risen nearly every single month for the last 13 years; the only exception was a handful of months in 2023. With the total number of homes for sale at its highest level since early 2020 and demand cooling, homebuyers’ negotiating power keeps increasing–and that’s finally showing up in sale prices. Home Prices Are Still Rising Fast in Hot Markets, Led By San Francisco Home-sale prices fell nationwide, but they rose in more than half of the 50 most populous U.S. metro areas. San Francisco led the nation by a wide margin, with the median sale price rising 16.8% year over year. That’s the biggest increase since 2018. Next comes New Brunswick, NJ, with a 7.7% gain. Two other NYC-area metros also had price increases ranking in the top six; the median sale price rose 4.4% in both New York City and Nassau County. In San Francisco, AI wealth is fueling competition for scarce inventory; active listings were down 7% from a year earlier. In the New York City area, years of limited homebuilding have left buyers competing for relatively few homes in a region with a strong job market. Home-sale prices fell most in Austin, TX, where they declined 6.5% year over year. It’s followed by Seattle (-5.1%) and Nashville, TN (-4.9%). Austin and Nashville are among the biggest buyer’s markets in the U.S., and Seattle’s shaky tech job market is curbing demand . U.S. Pending Home Sales Drop to Lowest Level Since the Pandemic National sale prices are losing steam because fewer Americans can afford to buy a home. U.S. pending home sales fell 3.6% from a month earlier in October on a seasonally adjusted basis to their lowest level since 2013, with the exception of April 2020. This is a real-time indicator of the state of the housing market; fewer homes went under contract in October largely because mortgage rates averaged 7.33% , a three-year high and up from 6.86% the month before. All figures in this report are seasonally adjusted, with the exception of median sale price data and mortgage rate data. See a more detailed methodology here and view an interactive dashboard here . “It’s a buyer’s market, but not many people can afford to buy,” said Chen Zhao, Redfin’s head of economics. “That could start to shift a bit, now that sale prices are closer to reflecting the shape of the market. House hunters in most of the country should know that the price they see on a listing may very well be a starting point; they should try offering below the asking price, and negotiating for closing costs, repairs and maybe even mortgage-rate buydowns. If you can’t get the price or monthly payment you want on one house, move on to the next one–with a big pool of inventory sitting on the market, buyers can afford to be picky.” Pending home sales declined in all of the most populous U.S. metros. That’s the second month in a row that has happened; before September, the last time was three years earlier. The biggest declines were in Seattle and San Diego, both places where pending sales fell more than 20% year over year. Those West Coast metros are some of the priciest in the U.S., so 7%-plus mortgages hit house hunters’ monthly payments there hard. In Seattle, an uncertain local job market is also curbing demand . Closed home sales fell to their lowest level in nearly 3 years. They declined 2.1% month over month in October to their lowest level since December 2023; before that, the last time sales dropped that low was 2014. Many of the deals that closed last month went under contract in August and September, when rates were already climbing and economic uncertainty was deterring a lot of house hunters. Housing Supply Builds to Highest Level Since 2020 With homebuying demand falling, supply is building. The total number of homes for sale rose 0.9% from September to its highest level since early 2020; that’s the biggest monthly gain since May 2025. More supply gives buyers more homes to choose from and more leverage: Three in five homes are selling under asking price. 61% of homes that sold in October went for less than their original list price. More sellers are cutting their prices. 36% of homes that sold in October had at least one price drop–the highest share in our records. Roughly 15% of pending sales fell out of contract. That’s the highest share in our records other than the pandemic spike in March and April 2020. Buyers with more choices can walk away over inspection issues or a monthly payment that is higher than expected. “Buyers are nervous about rates, the economy, and everything they’re seeing in the news– so they need the house and the price to line up perfectly before they’ll make an offer,” said Callie Kimmel , a Redfin Premier agent in Philadelphia. “I’m advising sellers to price just below current market value from day one–and not comps from six months ago, but homes that are listed right now. Otherwise, the home is likely to end up ","published_at":1794322845000,"source_family":"redfin-news","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794346644132,"id":"b46d684187a7a822","acquisition_window":{"lower":1794258000000,"upper":1794344400000},"score":19,"tags":["housing","national","data","trend","brokerage"],"heat_signals":["mortgage rate","year over year"],"date_precision":"timestamp","modified_at":1794329132000,"extraction":"semantic","canonical":"https://redfin.com/news/home-prices-decline-october-2026","content_hash":"a6b66d072fe9df75fd6b7acc85f4329fc12027980d7cc6c631e9df0f7a7b886e","access":"preview","evidence_status":"preview","keep":true,"importance":4,"section":"national","capital_focus":false,"geo_evidence":null,"duplicate_of":null,"selector_reason":"Redfin reports the first year-over-year U.S. median sale-price decline in over three years, alongside rising inventory and weaker sales.","title_zh":"10 月美国成屋售价同比三年来首次下降","summary_zh":"Redfin 称，10 月美国成屋售价中位数同比下降 0.4% 至 388,634 美元，为 2023 年 5 月以来首次下降；在售房源数量升至 2020 年初以来最高。","impact":"neutral","evidence_quote":"That streak has ended. The median home-sale price declined 0.4% year over year to $388,634 in October. That’s the first decline since May 2023 and a sharp slowdown from the 2.5% gain just two months earlier.","evidence_basis":"body","cre_subcategory":null},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Opendoor says it's behind schedule but plans to catch up by 2027","link":"https://www.housingwire.com/articles/opendoor-q3-2026-losses/","description":"Opendoor is behind schedule. Since taking over the company a little over a year ago, CEO Kaz Nejatian has promised that the firm would achieve adjusted net income positive status on a 12-month go-forward basis by the end of 2026. But the recent housing market downturn, triggered by the rapid rise in mortgage rates , has proven to be a bit of a roadblock. “We are currently behind but we intend to catch up,” the iBuyer’s third quarter 2026 earnings report explained. During the quarter, Opendoor recorded an adjusted net loss of $66 million and an actual net loss of $218 million, up from a $90 million net loss a year ago. This comes even as the company reported a 12% annual increase in revenue to $1.022 billion. “A year ago, I told you we would build a different Opendoor — faster, stronger, fully committed to our mission of tilting the world in favor of homeowners,” Nejatian said during his firm’s earnings call with investors and analysts on Thursday. “We have spent the past year building a machine, and that machine is getting better every single day. We are not done yet. It is not perfect, but it is getting better every single day. The question is this: Is Opendoor in a better economic condition than it was a year ago? The answer is obviously yes.” A more resilient Opendoor Nejatian’s confidence comes from his belief that Opendoor has become more resilient over the past year. This includes ways in which the company has worked to serve more sellers without adding more homes to the company’s balance sheet. “This past week, around half of the first offers our direct-to-consumer sellers accepted were listing or Cash Now, More Later. That lets us serve more sellers with less of our capital exposed to changes in the market,” Nejatian said. In the past 12 months, the company has done over $1 billion in Cash Now, More Later volume. “We have built more ways to meet sellers' needs and have made it easier for them to understand their options and make the choice they want for their own lives,” Nejatian said. “Sellers can now adjust the offer slides and make the choice that is good for their families.” Scaling without buying more homes? Nejatian noted that every other time Opendoor has tried to scale, it has done so by purchasing more properties, but that isn’t the case this time. “We proved that we can grow without buying growth. That's the single most important thing that has happened over the last year. We're changing that with our capital-light products,” Nejatian said. Still, Opendoor did purchase far more homes in Q3 2026 than it did in Q3 2025, with a 316% year-over-year increase to 4,865 homes. The company’s signed acquisition volume represented an estimated 0.56% of market share in the addressable U.S. market in Q3 2026 — more than four times higher than a year ago. On the sales side, Opendoor sold 2,728 homes, an increase of 160 homes compared to a year ago. At the end of the quarter, the iBuyer had 7,596 homes in its inventory, up from 3,139 homes a year ago. While the increase in inventory could be seen as cause for concern, especially heading into the slower winter housing market, Opendoor noted that homes listed for sale for 120 days represented just 18% of inventory at the end of the quarter, down from 50% a year ago. Despite the progress, Nejatian said the company still has work left to do on unit economics and resale velocity, something it needs to focus on as it strives for more resiliency. “We're not as good as we want to be, but we're in a much better place,\" he said. \"When the market moves against you and you own homes, there's two things you can do. You can sell fast, or you can hold and wait and pray for the market to recover. We choose to clear. \"The decline in late August and September knocked us off track on execution a little bit because we turned our attention to clearance rather than margin improvement. It costs something real in a quarter like this, but that's the right way to run this company for the long run.” To help with some of these challenges, Nejatian said Opendoor has turned to AI to help improve speed while still scaling. Some of these tools include an AI model that determines repair plans for every home to hit the market. The company said the system has been outperforming the old process of following a standard repair manual. Opendoor said it also built a system to help price homes. While humans still have final judgment, the software does the work of pulling applicable, comparable homes. Ancillary services and the future Nejatian also said that Opendoor is focusing on its mortgage division . In Q3, Opendoor said originations from its in-house lender were up 400% year over year. This comes as the iBuyer's lender is now licensed in 25 states, compared to none a year ago. In addition, the company also launched a beta test of Buy with Opendoor in the San Francisco Bay Area this week. The product allows the company to earn mortgage revenue on properties not affiliated with Opendoor in anyway. Looking to the future, Nejatian said Opendoor is hoping to build out title and escrow services — not only to add more efficiencies to Opendoor’s in-house transactions but to add additional revenue streams by serving consumers not in its ecosystem. “We need to grow, use less capital per transaction, and sell homes faster. Those are things we can control, and that is what we are focused on. What matters to us is solving the core problems of our business, and those are what we need to focus on,” Nejatian said. Related More: Earnings iBuying Opendoor","published_at":1794001367000,"mutable":false,"date_precision":"timestamp","modified_at":1794001369000,"extraction":"semantic","canonical":"https://housingwire.com/articles/opendoor-q3-2026-losses","content_hash":"c633ba3302082f02f7f4397798de82688a4c5239d8c22aeda185d29482c83600","access":"public","evidence_status":"article","id":"166e40c5788f8821","source_family":"housingwire","is_research":false,"required_source":false,"first_seen_at":1794173831876,"acquisition_window":{"lower":1793912400000,"upper":1794171600000},"late_discovery":true,"score":23,"tags":["housing","national","earnings","trend","institutional"],"heat_signals":["mortgage rate","annual","year over year","year-over-year","housing market"],"keep":true,"importance":3,"section":"national","capital_focus":false,"geo_evidence":null,"duplicate_of":null,"selector_reason":"Opendoor reported a $66 million adjusted quarterly loss and $218 million net loss despite revenue growth, and acknowledged it is behind its profitability target.","title_zh":"Opendoor 第三季度净亏损扩大","summary_zh":"Opendoor 第三季度净亏损为 2.18 亿美元，上年同期为 9,000 万美元；营收同比增长 12% 至 10.22 亿美元。公司表示盈利目标进度落后于计划。","impact":"neutral","evidence_quote":"During the quarter, Opendoor recorded an adjusted net loss of $66 million and an actual net loss of $218 million, up from a $90 million net loss a year ago. This comes even as the company reported a 12% annual increase in revenue to $1.022 billion.","evidence_basis":"body","cre_subcategory":null},{"source_id":"cushman-research","source_name":"Cushman & Wakefield Research","source_tier":"B","source_weight":9,"source_tags":["mixed-asset","data","trend"],"region":"national","title":"MarketBeat Seattle Multifamily Q3 2026","link":"https://cushmanwakefield.com/en/united-states/insights/us-marketbeats/seattle-bellevue-marketbeats/multifamily","description":"Share: Share on Facebook Share on Twitter Share on LinkedIn I recommend visiting cushmanwakefield.com to read:%0A%0A {0} %0A%0A {1} Insights Seattle Multifamily MarketBeat This MarketBeat report covers the Seattle (Puget Sound) multifamily market for Q3 2026, highlighting key trends in the economy, supply and demand, and rents. Read the report for the full details and context. DOWNLOAD THE Q3 2026 REPORT Key Takeaways The Seattle metro area added 14,600 jobs YOY, with the latest total figure at over 2.1 million. The region reported a 6.9% vacancy rate in the third quarter of 2026, down 60 bps YOY. Demand strengthened across all three counties, with total YTD absorption reaching 7,916 units. A total of 5,849 units have been delivered across the region thus far in 2026, while the development pipeline continues to moderate. Effective rents ended the quarter at $2.56 psf, up 0.1% YOY, reflecting continued stability despite elevated supply levels in recent years. Economy: Job Count and Unemployment Both Rise The Seattle metro area added 14,600 jobs year-over-year (YOY), with the latest total figure at over 2.1 million. The unemployment rate, however, also rose, up 40 basis points (bps) YOY to 5.0%, above the U.S. rate of 4.2%. As measured by the Consumer Price Index for All Urban Consumers, Seattle metro area prices advanced 4.4% YOY, driven by higher energy (+15.9%) and food (+5.3%) costs. Minus food and energy, the index rose 3.3% YOY, mainly due to cost increases to recreation (+7.0%) and shelter (+2.6%). Supply and Demand: Construction Slowdown Continues The region reported a 6.9% vacancy rate in the third quarter of 2026, down 60 bps YOY. Demand strengthened across all three counties, with total year-to-date absorption reaching 7,916 units. King County accounted for most of the leasing activity, posting 5,694 units of absorption, while Snohomish and Pierce counties also recorded positive net absorption and declining vacancy. A total of 5,849 units have been delivered across the region thus far in 2026, while the development pipeline continues to moderate. Units under construction totaled 18,068 units at quarter-end, with more than three-quarters of active development located in King County. Amid limited construction starts and continued absorption of new supply, market occupancy is expected to improve further through the remainder of the year. Rents: Effective Rents Rise Slightly YOY Effective rents ended the quarter at $2.56 per square foot (psf), up 0.1% YOY, reflecting continued stability despite elevated supply levels in recent years. King County remained the region's highest-priced market at $2.74 psf, while Pierce County led annual rent growth at 1.2%. Snohomish County rents declined slightly from a year ago but remained competitive at $2.23 psf. Regional rents have stayed above $2.50 psf since early 2024, supported by steady demand and improving occupancy fundamentals. With absorption continuing to outpace new deliveries and vacancy trending downward, conditions are becoming increasingly favorable for future rent growth. Insights in your Inbox Subscribe to the latest local market research, insights and analysis from Cushman & Wakefield across the United Stat "evidence_quote":"DOWNLOAD THE Q3 2026 REPORT Key Takeaways The Seattle metro area added 14,600 jobs YOY, with the latest total figure at over 2.1 million. The region reported a 6.9% vacancy rate in the third quarter of 2026, down 60 bps YOY. Demand strengthened across all three counties, with total YTD absorption reaching 7,916 units.","evidence_basis":"body","cre_subcategory":"多户"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Former Trump Admin Officials Raise $130M For Modular Data Center Startup","link":"https://www.bisnow.com/news/national/data-center-development/former-trump-administration-officials-launch-modular-data-center-firm","description":"Just months after being founded by three former Trump administration officials, modular data center startup Mavria has already reached a billion-dollar valuation as investors bet on its solution for the industry's supply chain woes: factory-built data centers. Pixabay/The Digital Artist The Texas-based company intends to mass-produce 5-megawatt modular data center units that are built in factories and delivered by truck. Although the first units are still months away from production, Mavria has already raised $130M at a $1B valuation, The Wall Street Journal reported . Its investors include Paradigm, Liquid 2 and Critical Frontier, as well as public benefit corporation AMP. Mavria was founded this summer by Adam Blake, Nick Poradek and Seth Cohen, who met while working at the U.S. Department of Energy, where they focused on nuclear power. While at the department, the three say they identified a “strategic vulnerability” in the U.S.’s digital infrastructure build-out: strained supply chains, manufacturing capacity constraints and limited access to large blocks of power. Mavria’s business model is centered on the idea of addressing that problem through standardized, factory-built data centers. Its founders say this strategy can ease some of the physical supply chain bottlenecks that have contributed to data center construction continuing to trail significantly behind demand for these facilities. “Our power infrastructure, manufacturing capacity and supply chains are nowhere near ready to meet the demand from AI,” Blake told The Wall Street Journal. Mavria's modular product, which is branded as Terrain, consists of 5 MW units with power distribution, liquid cooling, control systems and server racks already integrated. The company describes Terrain as an effective plug-and-play data center system that can either be clustered with other modules to create a larger facility or be deployed individually to take advantage of locations where smaller pockets of grid capacity are available. The 35-employee startup is not yet producing units at scale. Its first units are being built at the company’s Houston factory, with plans to begin testing in 2027 before ramping up production later in the year. Mavria intends to pursue two business lines: selling the units directly and developing sites where Terrain systems could be deployed and operated. Beyond helping bypass supply chain constraints, its business model is appealing to investors because it can avoid the community opposition and political headwinds that are constraining large-scale data center development across the U.S. Paradigm Managing Director Alana Palmedo told The Wall Street Journal that while communities are pushing back against \"mega projects,\" these modular units are less intrusive and can be deployed wherever small pockets of power are available. Mavria isn't the first firm to pursue modular solutions to the data center supply chain pinch. Modular, prefabricated components and off-site manufacturing have become essential strategies when building large-scale data centers, and an entire ecosystem of firms has emerged that manufacture shipping-container-sized, standalone data centers that can be deployed individually or grouped in larger installations. It’s a space that includes smaller edge specialists like Duos Edge AI and CenCore and major data center equipment manufacturers like Vertiv, Schneider Electric and Eaton Corp. Continue reading this story with a free account Log in or register Related Topics: Adam Blake , Mavria , Modular development","published_at":1794341614000,"mutable":false,"date_precision":"timestamp","modified_at":1794341625000,"extraction":"semantic","canonical":"https://bisnow.com/news/national/data-center-development/former-trump-administration-officials-launch-modular-data-center-firm","content_hash":"34648d412d9b3b19e72a4ca110d226407fbac7a544f396af763972eb8e8e090e","access":"public","evidence_status":"article","id":"85898cd9fe2382d3","source_family":"bisnow","is_research":false,"required_source":false,"first_seen_at":1794346644132,"acquisition_window":{"lower":1794258000000,"upper":1794344400000},"score":16,"tags":["data-center","texas","fundraising","institutional"],"heat_signals":["texas","houston"],"keep":true,"importance":3,"section":"institutional","capital_focus":true,"geo_evidence":"Texas-based","duplicate_of":null,"selector_reason":"Modular data-center startup Mavria raised $130 million at a $1 billion valuation, a substantial capital raise for a Texas-based platform.","title_zh":"模块化数据中心初创公司获 1.3 亿美元融资","summary_zh":"Bisnow 报道，Mavria 在首批设备投产前已融资 1.3 亿美元，估值达 10 亿美元；公司计划在工厂批量生产 5 MW 模块化数据中心单元。","impact":"short-pos","evidence_quote":"Just months after being founded by three former Trump administration officials, modular data center startup Mavria has already reached a billion-dollar valuation as investors bet on its solution for the industry's supply chain woes: factory-built data centers. Pixabay/The Digital Artist The Texas-based company intends to mass-produce 5-megawatt modular data center units that are built in factories and delivered by truck. Although the first units are still months away from production, Mavria has already raised $130M at a $1B valuation, The Wall Street Journal reported .","evidence_basis":"body","cre_subcategory":null},{"source_id":"connect-cre","source_name":"Connect CRE","source_tier":"A","source_weight":7,"source_tags":["mixed-asset","deals"],"region":"national","title":"Greybrook Picks Up 334-Unit Mansfield Rental Community","link":"https://www.connectcre.com/stories/greybrook-picks-up-334-unit-mansfield-rental-community/","description":"Greybrook Picks Up 334-Unit Mansfield Rental Community The Greybrook U.S. Multifamily Income & Growth Fund acquired Evolv, a 334-unit multifamily property in Mansfield. Greybrook landed a $39.2 million acquisition loan from Greystone as part of the deal. The fixed-rate Fannie Mae loan carries a five-year term, with three years of interest-only payments followed by a 35-year amortization schedule. Greystone's financing team included Richard Kourbage, Garvin Lee, and Gillian McIlroy. Cushman & Wakefield's Investment Sales team, Grant Raymond and Asher Hall, represented the seller, Advenir Living, in the transaction. Cushman & Wakefield's debt professionals included Chase Johnson and Caleb Riebe. Built in 2012, Evolv is a garden-style multifamily community situated on approximately 18.6 acres at 370 North State Highway 360 in Mansfield. The property features private patios or balconies. Community amenities include a resort-style swimming pool, 24-hour fitness center, clubhouse, outdoor kitchen, playground, dog park and garage parking. Mansfield is located southwest of Dallas and southeast of Fort Worth. Connect Inside The Story Greystone About Mike Boyd Mike covers our Texas and Phoenix/Southwest regions. He is a veteran news reporter who spent 10 years in radio and television news, mostly in Tucson, Arizona. Following his career in the media, he spent ten years as a communications executive for a publicly traded development company. Mike is married with three boys and three Huskies. Order Reprints ◦ Sale/Acquisition Apartment buildings for sale Check out ion loan from Greystone as part of the deal.","evidence_basis":"body","cre_subcategory":null},{"source_id":"colliers-research","source_name":"Colliers Research","source_tier":"B","source_weight":9,"source_tags":["mixed-asset","data","trend"],"region":"national","title":"The Next Dollar: How Generational Spending Shifts Are Reshaping Retail Real Estate","link":"https://colliers.com/en/research/nrep-usret-us-retail-report-the-next-dollar-2026","description":"The Next Dollar: How Generational Spending Shifts Are Reshaping Retail Real Estate Nov 10, 2026 U.S. Retail Research Report The next generation of retail growth is taking shape. Download Report Authors Nicole Larson Senior Manager, National Retail Research | U.S. Anjee Solanki National Director, Retail Services & Practice Groups The next generation of retail growth is taking shape. Who will drive the next dollar of retail spending, and what will it mean for physical stores? Colliers' latest retail report, The Next Dollar, explores how shifting consumer spending power, shopping behaviors and generational preferences are reshaping the retail landscape through 2030. While millennials will remain the largest consumer spending group, Gen Z is emerging as a major force in retail growth. At the same time, physical stores continue to play an essential role across all six generations, serving different needs for discovery, convenience, service and connection. Inside the report: A new generation of spending power: Gen Z spending is projected to grow 85.6% to $1.61 trillion by 2030, while Millennials retain the largest share of retail spending. The enduring value of physical retail: Every generation is expected to make the majority of its retail purchases in stores through 2030, reinforcing the importance of the physical shopping experience. The categories capturing growth: Foodservice, apparel and beauty are among the fastest-growing retail categories, creating opportunities for evolving tenant mixes and cross-shopping. The influence of tomorrow's consumers: Gen Z is driving demand for wellness, discovery and real-world connection, while Gen Alpha is already influencing household purchasing decisions. For retailers, property owners and investors, understanding these generational shifts will be critical to creating destinations that remain relevant as consumer expectations evolve. Download The Next Dollar to explore the spending trends and retail real estate opportunities shaping the next five years. Download Report Share Authors Nicole Larson Senior Manager, National Retail Research | U.S. Fort Lauderdale Anjee Solanki National Director, Retail Services & Practice Groups San Francisco Related insights Oct 21, 2026 Fundamentals Take the Lead as Capital Stays Selective Read More Oct 20, 2026 U.S. Retail Monthly Foot Traffic & Sales Analysis | September 2026 Read More Oct 7, 2026 Retail Market Statistics | Q3 2026 Read More Sep 24, 2026 U.S. Retail Monthly Foot Traffic & Sales Analysis | August 2026 Read More","published_at":1794321540000,"date_precision":"timestamp","modified_at":0,"extraction":"semantic","canonical":"https://colliers.com/en/research/nrep-usret-us-retail-report-the-next-dollar-2026","content_hash":"b9c302dd98c7729191b5c567df973dc8c534d9d9c0b5e63c33b8e24e332a1531","access":"public","source_family":"colliers-research","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794346644132,"id":"52071080a5a5febc","acquisition_window":{"lower":1794258000000,"upper":1794344400000},"score":19,"tags":["retail","national","trend"],"heat_signals":["trend","trends"],"evidence_status":"article","keep":true,"importance":3,"section":"cre","capital_focus":false,"geo_evidence":"U.S. Retail Research Report","duplicate_of":null,"selector_reason":"National retail research projects Gen Z spending growth of 85.6% to $1.61 trillion by 2030 and examines generational shifts in physical retail demand.","title_zh":"世代消费变化将重塑实体零售布局","summary_zh":"Colliers Research 预计，到 2030 年 Ge lt","capital_focus":false,"geo_evidence":"Austin","duplicate_of":null,"selector_reason":"Delivery of a 54-story Austin residential tower adds over 400 units; the project also secured $173.4 million in construction financing.","title_zh":"奥斯汀 54 层住宅塔楼竣工","summary_zh":"Genesis 与 KTGY 完成交付奥斯汀市中心 The Travis 住宅塔楼，项目共 54 层、拥有 400 多套河景住宅，并获得 JPMorgan Chase 提供的 1.734 亿美元建设融资。","impact":"short-pos","evidence_quote":"Genesis, KTGY Complete 54-Story Austin Tower KTGY and Genesis Real Estate Group delivered The Travis, a 54-story glass residential tower in downtown Austin. KTGY designed the tower; Genesis was the developer. Genesis secured $173.4 million in construction financing from JPMorgan Chase.","evidence_basis":"body","cre_subcategory":null},{"source_id":"cushman-research","source_name":"Cushman & Wakefield Research","source_tier":"B","source_weight":9,"source_tags":["mixed-asset","data","trend"],"region":"national","title":"Cushman & Wakefield Announces Sale of Historic 121 W. Wacker to Chicago-Based Investor Group","link":"https://cushmanwakefield.com/en/united-states/news/2026/11/121-w-wacker-sale","description":"Cushman & Wakefield Announces Sale of Historic 121 W. Wacker to Chicago-Based Investor Group Jeremy Barewin &bull; 11/10/2026 Cushman & Wakefield Retained as Exclusive Leasing Agent 121 W. Wacker, Chicago CHICAGO -- Cushman & Wakefield (NYSE: CWK), a leading global real estate services firm, today announced the sale of 121 W. Wacker, a landmark 41-story office tower overlooking the Chicago River and located at the gateway to Chicago's historic LaSalle Street corridor. The 441,030-square-foot property was acquired by two Chicago-based investors Ken Buckman and Robert Castillo, who intend to invest substantial capital to re-energize the nearly century-old building. Cushman & Wakefield's Cody Hundertmark and Tom Sitz represented the seller, Chicago-based real estate firm Ameritus, in the transaction. Following the acquisition, Cushman & Wakefield has been retained as the exclusive leasing agent for the property, with Mason Taylor and Paige Krueger leading leasing efforts. Unlike many institutional office investors, the principals come from business entrepreneurship and private equity. Their vision for the property's next chapter centers on long-term ownership, thoughtful modernization and renewing its prominence as one of downtown Chicago's enduring architectural landmarks. \"Owning 121 W. Wacker is about much more than acquiring a real estate asset,\" said Buckman. \"As Chicago residents, we felt strongly that 121 W. Wacker should remain in local hands. The property has a remarkable history, an irreplaceable location and a presence in the Chicago skyline that deserves thoughtful stewardship. We have ambitious plans to modernize the tenant experience while preserving the character and architectural details that make this one of the city's great buildings.\" The ownership group is planning a series of capital improvements to position the tower for the needs of today's leading companies. Enhancements include a significant upgrade to the outdoor amenity terrace and 24th floor conference center, a completely remodeled restaurant and bar managed by a leading Chicago hospitality firm and a refreshed main lobby experience. Award-winning international design firm Ware Malcomb will oversee all interior and exterior architecture, with Ameritus continuing as the building's property manager. Situated at the intersection of Wacker Drive and LaSalle Street, the property offers sweeping views of the Chicago River and skyline, immediate access to the Chicago Riverwalk and multiple public transportation options. The location places it amid the growing residential and business activity reshaping the Loop, just one block from Google's new Chicago headquarters, scheduled to open next year. \"121 W. Wacker remains one of the most distinctive office buildings in downtown Chicago, offering something that cannot be replicated: authentic architectural character in an unmatched riverfront location,\" said Mason Taylor, Executive Managing Director, Agency Leasing at Cushman & Wakefield. \"The new ownership group brings an entrepreneurial mindset, a genuine commitment to Chicago and a willingness to invest in the building's future. With planned upgrades throughout the property, it is exceptionally well-positioned to attract companies seeking a premier office environment, centrally located along Wacker Drive.\" Completed in 1930 and designed by renowned Chicago architects Holabird & Root, 121 W. Wacker stands as one of the city's most recognizable Art Deco skyscrapers. Originally known as the LaSalle-Wacker Building, the tower helped establish the northern gateway to Chicago's historic financial district and was among the last major buildings constructed in the city before the Great Depression. Now included within the West Loop-LaSalle Street Historic District on the National Register of Historic Places, the building has witnessed nearly a century of Chicago's evolution, with early ties to two iconic companies, United Airlines and McDonald's, both of which once maintained offices at the property. About Cushman & Wakefield Cushman & Wakefield (NYSE: CWK) is a leading global commercial real estate services firm for occupiers and investors with approximately 53,000 employees in over 350 offices and nearly 60 countries. In 2025, the firm reported revenue of $10.3 billion across its core service lines of Services, Leasing, Capital markets, and Valuation and other. Built around the belief that Better never settles , the firm receives numerous industry and business accolades for its award-winning culture. For additional information, visit www.cushmanwakefield.com . Media Contact Jeremy Barewin PR Manager, Central & Canada --> CAN'T FIND WHAT YOU'RE LOOKING FOR? Get in touch with one of our professionals. CONTACT US Your privacy matters to us With your permission we and our partners would like to use cookies in order to e property is a material downtown asset transaction.","title_zh":"芝加哥 121 W. Wacker 办公楼完成出售","summary_zh":"Cushman & Wakefield 宣布，芝加哥 121 W. Wacker 办公楼已售予当地两名投资者；买方计划投入大量资本进行现代化改造，Cushman & Wakefield 将继续担任独家租赁代理。","impact":"neutral","evidence_quote":"Wacker, Chicago CHICAGO -- Cushman & Wakefield (NYSE: CWK), a leading global real estate services firm, today announced the sale of 121 W. Wacker, a landmark 41-story office tower overlooking the Chicago River and located at the gateway to Chicago's historic LaSalle Street corridor. The 441,030-square-foot property was acquired by two Chicago-based investors Ken Buckman and Robert Castillo, who intend to invest substantial capital to re-energize the nearly century-old building.","evidence_basis":"body","cre_subcategory":"办公"},{"source_id":"phoenix-agent","source_name":"Phoenix Agent Magazine","source_tier":"D","source_weight":6,"source_tags":["phoenix","arizona","brokerage"],"region":"arizona","title":"Montclair Scottsdale retail-to-residential conversion now complete","link":"https://phoenixagentmagazine.com/2026/11/10/montclair-scottsdale-retail-to-residential-conversion/?utm_source=rss&utm_medium=rss&utm_campaign=montclair-scottsdale-retail-to-residential-conversion","description":"Montclair Scottsdale retail-to-residential conversion now complete by Emily Marek November 10, 2026 Montclair Scottsdale delivers 215 luxury units in one- and two-bedroom layouts. (via Trammel Crow Company) Leasing and resident move-in are now underway at Montclair Scottsdale , High Street Residential and Mitsui Fudosan America's recently completed retail-conversion project in the central part of the city. The project, located between Old Town Scottsdale and North Scottsdale , delivers 215 luxury units in one- and two-bedroom layouts. Apartments feature custom cabinets, quartz countertops, wine fridges and gas cooktops, while on-site amenities include a dog park, yoga and fitness studios, pool and spa, sauna, co-working studios and outdoor courtyards. “With the delivery of Montclair Scottsdale, we’re proud to bring much-needed new housing to one of The Valley’s most established and sought-after neighborhoods,” Cody Kuhne, vice president of High Street’s parent company, Trammel Crow , said in a press release. “Scottsdale continues to attract residents seeking exceptional quality of life , yet opportunities for new housing in Central Scottsdale remain limited. We are excited to offer a thoughtfully designed community that reflects the character of the area while providing modern residences, resort-inspired amenities and convenient access to the employment, shopping, dining and recreation options that make Scottsdale such a desirable place to live.” Read More Related to This Post Phoenix among top metros for new apartment construction in 2026 Case-Shiller: Phoenix home-price growth increases in August Shawnee Doherty named 2026 NAR Good Neighbor Awards winner AZHF provides funding for 3 new Phoenix-area housing projects 4 new floor plans available at The Arcadian Camelot Homes to host grand opening for The Villas II at Desert Mountain NAR: Existing-home sales post surprise 1.5% gain in September Phoenix REALTORS®: Affordability concerns delay start of fall market pickup Join the conversation Cancel reply Cancel reply Save my name, email, and website in this browser for the next time I comment.","published_at":1794339976000,"source_family":"phoenix-agent","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794346644132,"id":"405c9e7e58c0fd0f","acquisition_window":{"lower":1794258000000,"upper":1794344400000},"score":12,"tags":["multifamily","phoenix","construction","developer"],"heat_signals":[],"date_precision":"timestamp","modified_at":0,"extraction":"semantic","canonical":"https://phoenixagentmagazine.com/2026/11/10/montclair-scottsdale-retail-to-residential-conversion","content_hash":"291436be54a0f42534755a98be52fe330a33448193d2c53b27f65c0d0088e77d","access":"public","evidence_status":"article","keep":true,"importance":3,"section":"sunbelt","capital_focus":false,"geo_evidence":"Scottsdale","duplicate_of":null,"selector_reason":"Completed conversion delivers 215 apartments from a retail property, adding housing supply in Scottsdale.","title_zh":"斯科茨代尔零售改住宅项目交付 215 套","summary_zh":"Montclair Scottsdale 零售改住宅项目已完成交付，共提供 215 套一居和两居豪华住宅；项目目前已启动租赁和住户入住。","impact":"short-pos","evidence_quote":"Montclair Scottsdale retail-to-residential conversion now complete by Emily Marek November 10, 2026 Montclair Scottsdale delivers 215 luxury units in one- and two-bedroom layouts. (via Trammel Crow Company) Leasing and resident move-in are now underway at Montclair Scottsdale , High Street Residential and Mitsui Fudosan America's recently completed retail-conversion project in the central part of the city. The project, located between Old Town Scottsdale and North Scottsdale , delivers 215 luxury units in one- and two-bedroom layouts. Apartments feature custom cabinets, quartz countertops, wine fridges and gas cooktops, while on-site amenities include a dog park, yoga and fitness studios, pool and spa, sauna, co-working studios and outdoor courtyards.","evidence_basis":"body","cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Power Scarcity Poses Problems For Charlotte Industrial Developers","link":"https://www.bisnow.com/news/charlotte/industrial/power-scarcity-poses-problems-for-charlotte-industrial-developers","description":"Industrial developers in Charlotte are vying for power. Small-bay industrial projects and some build-to-suit sites in the region are competing for energy against data centers, large advanced manufacturers and other big power users, panelists said at Bisnow ’s Charlotte State of the Market event . But demand is surpassing availability. “There’s a lot of users that need smaller buildings that still have an amazing power demand,” Kirk Matthews, vice president for Frampton Construction, said at the event, held at The Westin Charlotte. “We’re seeing small product … 100K [SF], 150K [SF] that still need 10 megawatts, and they’re not data centers.” Unsplash/American Public Power Association Duke Energy , the primary power supplier in the Carolinas, predicted last year that through 2040, electricity demand across its two Carolina systems would rise 16% to nearly 60%, according to a report from the North Carolina Energy Policy Task Force. The increased demand stems from a surge in population growth in Charlotte, which added more than 20,000 people last year and is nearing 1 million residents. The region’s energy grid is aging but is taking on additional load growth as the data center boom continues, Axios reported . That demand could delay or cancel projects as regulators weigh how to balance energy needs, panelists said. “Our electrical grid is nowhere near what it needs to be,” Alan Lewis, managing partner at The Keith Corp., said at the Sept. 30 event. Unsplash/Winston Chen The rise in data center development across the U.S. is driving electricity demand, which is expected to more than double from 31 gigawatts in 2025 to 66 GW by 2027, according to Goldman Sachs Commodities Research. Access to power is becoming a key driver of where companies decide to build capital-intensive real estate projects in the U.S. Charlotte's industrial market faces other hurdles, including skyrocketing costs of materials like steel and concrete. But panelists cited power constraints as the most imminent problem. “It's everything,” Lewis said. “I mean, No. 1 on the list almost every single time is, ‘How much power do you have?’” Data Center Construction Is 'A Big Drain' Charlotte’s industrial market is experiencing strong leasing activity and stable rent growth, according to a CBRE report from the third quarter. The metro “remains attractive for industrial expansion,” with leasing activity at 3.2M SF, up 55.6% from the same period in 2025. Vacancy in the third quarter was 7.1%, down from 7.9% the previous year. But power availability is a primary challenge for the growing market. A single hyperscale data center facility can consume 20 MW to more than 100 MW of power, equal to powering 15,000 to 75,000 homes, according to IAEI Magazine . More than 100 data centers are operational across North Carolina, with around 40 of them in Charlotte, according to Data Center Map . Last month, Charlotte extended its 150-day moratorium on data center development by 11 months to give the city more time to develop policies and regulations around the digital infrastructure. Key concerns among data center opponents include power demands and rising utility costs. But data centers aren’t the only developments consuming energy from Charlotte’s grid. “The massive amount of data center construction, and all the reshoring and direct investment here in new industrial facilities, is a big drain,” Lewis said. He added that the mass conversion to electric vehicles in the area is putting even more “stress on the system.” At least one planned industrial project in the area was halted over electrical demands. In September, North Carolina regulators rejected Duke Energy’s proposal to build a $584M natural gas power plant near Hamlet that would generate about 255 MW by 2030, citing concerns over how residents would be protected from the project’s costs. “There are real challenges in accommodating the amount of demand for these larger, big investment-type projects that want to be in the Carolinas,” said Jordan Quinn, a partner at Trinity Capital Advisors who leads the firm’s industrial platform. Other industrial projects in the area are underway. Red Bull broke ground on a new $1.7B facility in Concord in September 2025, and Eli Lilly announced a $77M expansion to its manufacturing campus earlier this year. Allocating Megawatts Pexels/andres Nino Charlotte's skyline Charlotte’s small-bay development pipeline remains active, with approximately 1.5M SF expected to deliver this year and another 2.2M SF under construction, according to a Matthews report . These properties typically have an easier time securing power than larger sites due to their size limitations. But because of the increased energy demand, “the requirements for smaller manufacturers have just gotten more intense,” Lewis said. “Every park we have, every site we have, we try to get the best information we can on how much power we have available,” he said. When a developer plans to build out multiple buildings within an industrial park, it can be difficult to divide up megawatts. “You often find yourself saying, ‘Well, gosh, if I do this deal, I'm going to lose two-thirds of my power that I have for everything else,’” he said. Sometimes a site will end up requiring more power than developers initially predicted. In a 50K SF deal, a tenant may need 10K SF of office space for 50 people, Quinn said. Air-conditioning that space to bring those people in could require 10,000 amps of power. “It's just this incredible challenge as an owner of industrial real estate in the market to accommodate not only the tenants' needs but to get them in quickly, when [tenants] actually need the space,” Quinn said. “It's very, very, very tough.” Duke Energy executives are expecting a power surge next year, as 5.2 gigawatts for data centers will hit the grid beginning in the second half of 2027, according to The Charlotte Ledger . Some panelists said it will be up to Duke Energy to prioritize which companies get t","published_at":1794340520000,"mutable":false,"date_precision":"timestamp","modified_at":1794340591000,"extraction":"semantic","canonical":"https://bisnow.com/news/charlotte/industrial/power-scarcity-poses-problems-for-charlotte-industrial-developers","content_hash":"34f375dc5e50ec95f0f26ae41571a6bfb6365bc0129d87b847c003977fd74f41","access":"public","evidence_status":"article","id":"fb035ef381450e91","source_family":"bisnow","is_research":false,"required_source":false,"first_seen_at":1794346644132,"acquisition_window":{"lower":1794258000000,"upper":1794344400000},"score":23,"tags":["industrial","carolinas","trend","construction","developer"],"heat_signals":["state of the market","rent growth","vacancy"],"keep":true,"importance":3,"section":"cre","capital_focus":false,"geo_evidence":"Charlotte","duplicate_of":null,"selector_reason":"Charlotte industrial developers report power constraints affecting small-bay and build-to-suit projects as data centers and manufacturers compete for capacity.","title_zh":"电力短缺制约夏洛特工业开发","summary_zh":"Bisnow 报道，夏洛特工业项目正与数据中心及大型制造商争夺电力；与会者称供给难以满足需求，电网限制可能导致部分项目延期或取消。","impact":"short-neg","evidence_quote":"Industrial developers in Charlotte are vying for power. Small-bay industrial projects and some build-to-suit sites in the region are competing for energy against data centers, large advanced manufacturers and other big power users, panelists said at Bisnow ’s Charlotte State of the Market event . But demand is surpassing availability.","evidence_basis":"body","cre_subcategory":"工业"},{"source_id":"realtor-research","source_name":"Realtor.com Research","source_tier":"B","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"VA Loans in a High-Rate Market: Lower Down Payments, Lower Costs","link":"https://www.realtor.com/research/va-loans-2026/","description":"VA Loans in a High-Rate Market: Lower Down Payments, Lower Costs By Jiayi Xu Nov 10, 2026 Highlights: VA home loans –a benefit created by the Servicemen’s Readjustment Act of 1944–enable qualified borrowers with smaller down payments, more flexible credit terms, and lower interest rates, making it easier to access homeownership. The zero down payment option and lower down payments in general are a key advantage that VA loans offer. Over the past 12 months, more than 3 in 4 (75.7%) home sales with VA loans had a 0% down payment and nearly 9 in 10 (86.1%) VA loan home sales had a down payment below 10%. In contrast, the share of lower down payment conforming loan home sales was less than half as large. Just 2 in 5 (41.1%) home sales backed by conforming loans featured down payment rates below 10%. VA loans exhibit flexibility in their credit criteria. Nearly 1 in 4 (24.3% of) recent VA loan borrowers had Fair credit scores (vs. roughly 1 in 30 or 4.8% for conforming loan borrowers). For every credit score grouping, recent VA borrowers had lower down payments as a percent of purchase price than conforming loan borrowers. VA loans reduce payments through lower mortage rates, which is especially notable in a high-rate market Thanks to the lower interest rate, a 0% down VA loan not only shortens the time to homeownership by about four years, but its monthly payment is nearly the same as a conforming loan with 10% down. Scenarios where VA and conforming loans with the same down payment shares are considered (under 20%), result in even greater payment savings. In recognition of Veterans Day, Realtor.com® has undertaken a research initiative to highlight the benefits of VA mortgage loans for military households and the industry professionals who support them. Our analysis features a comprehensive comparison of key factors such as down payment requirements, credit score considerations, and mortgage rates, contrasting them with conforming loans originated in the past 12 months. In addition, we calculate the potential monthly savings that veteran households can gain from utilizing VA loans. With this research, we hope to empower veteran households with the knowledge and tools they need to make informed decisions about their homeownership goals and financial well-being. More information can be found at realtor.com/veterans as well as in the Veterans & Military Benefit section of for-sale home listings on Realtor.com . No downpayment VA loans help homebuyers clear the biggest hurdle Homeownership is harder to reach for first-time buyers than it has been in years. The median age of first-time buyers rose to 40, and their share of home purchases fell to a historic low of 21%. Saving for a down payment is a central obstacle. According to the Realtor.com site visitor survey, about one-third of first-time buyers say not having enough money for a down payment makes buying a home challenging. The standout benefit of VA loans is the ability to buy a home without the burden of a down payment, a game changer in today’s real estate market where home prices remain elevated . According to Realtor.com Economics analysis of newly released data from the Federal Reserve Survey of Consumer Finances , about 11% of renter households under 40 have qualified income to afford a median-priced home but lack the liquid savings for a 10% down payment. 1 For this group, a zero-down option such as a VA loan (for eligible borrowers) would address the upfront barrier directly. Another 83% of renter households under 40 are constrained by both savings and income. For them, a zero-down VA loan could also help eligible households reach homeownership sooner, but they would also need income growth or other assistance before they can buy. Over the past year, the average down payment percentage for VA loans stood at 4.3%, whereas the average down payment percentage for conforming loans was 19.1%. 2 Notably, nearly 9 in 10 (86.1%) VA loan recipients were able to secure homes with a down payment lower than 10%, while only 41.1% of homebuyers with conforming loans fell into this category. In fact, nearly 3 in 4 (75.7%) VA loans had a down payment of 0%—a feature not available with conforming loans. This highlights the significant benefit VA loans provide to those looking to achieve homeownership: no upfront funds needed. This is especially important for first-time homebuyers who lack historically high home equity to tap . However, according to a recent survey conducted by Veterans United, only 3 in 10 veterans were aware of the zero down payment benefits of VA loans . Figure 1: More Than 85% of Home Sales Using VA Loans Have Down Payments Under 10% VA loans offer homebuyers flexible credit criteria In addition to offering great relief from the requirement of a substantial down payment, the VA loan’s relaxed credit requirement is another significant benefit of the program. According to the Realtor.com site visitor survey, about 20% of first time homebuyers say that a low credit score makes buying a home difficult. Over the past year, nearly one in four (24.3%) homebuyers with VA loans fell into the Fair credit score category (580–669) compared with just 4.8% (roughly one in twenty) among conforming loan borrowers in the past year. 3 Figure 2: VA Borrowers Are More Likely To Have a Lower Credit Score Additionally, it’s important to highlight that the average down payment percentage for VA loans consistently remains lower than that for conforming loans, as seen in Figure 3. This trend is particularly evident among the roughly 1 in 4 VA borrowers with lower credit scores, those falling below the Good level (below 670). This advantage is especially beneficial for younger homebuyers who may face challenges, lacking both strong credit scores and the substantial down payment funds typically needed for their first home purchase. Figure 3: VA loans have lower down payment percent, on average, across different credit score groups VA loans reduce payment","published_at":1794304851000,"source_family":"realtor-com","is_research":true,"required_source":true,"mutable":false,"first_seen_at":1794346644132,"id":"c3fc4509049cfd35","acquisition_window":{"lower":1794258000000,"upper":1794344400000},"score":14,"tags":["housing","national","policy","data","lender"],"heat_signals":["mortgage rate"],"date_precision":"timestamp","modified_at":1794331538000,"extraction":"semantic","canonical":"https://realtor.com/research/va-loans-2026","content_hash":"ed3d2c5f0e3196821f31cb076188844b6b40bc92f67f1c7e2ec9e3b1a44d140a","access":"public","evidence_status":"article","keep":true,"importance":3,"section":"national","capital_focus":false,"geo_evidence":null,"duplicate_of":null,"selector_reason":"Research compares VA and conforming purchase loans, finding substantially more zero- and low-down-payment borrowing among VA buyers.","title_zh":"VA 贷款以低首付缓解高利率购房压力","summary_zh":"Realtor.com Research 称，过去 12 个月 VA 贷款购房中 75.7% 首付为 0%，86.1% 首付低于 10%；其较低利率也可降低高利率环境下的月供压力。","impact":"short-pos","evidence_quote":"VA Loans in a High-Rate Market: Lower Down Payments, Lower Costs By Jiayi Xu Nov 10, 2026 Highlights: VA home loans –a benefit created by the Servicemen’s Readjustment Act of 1944–enable qualified borrowers with smaller down payments, more flexible credit terms, and lower interest rates, making it easier to access homeownership. The zero down payment option and lower down payments in general are a key advantage that VA loans offer. Over the past 12 months, more than 3 in 4 (75.7%) home sales with VA loans had a 0% down payment and nearly 9 in 10 (86.1%) VA loan home sales had a down payment below 10%.","evidence_basis":"body","cre_subcategory":null},{"source_id":"atlanta-agent","source_name":"Atlanta Agent Magazine","source_tier":"D","source_weight":6,"source_tags":["atlanta","georgia","brokerage"],"region":"georgia","title":"Maryland firm purchases Legacy at West Cobb in Marietta","link":"https://atlantaagentmagazine.com/2026/11/09/maryland-firm-purchases-legacy-at-west-cobb-in-marietta/?utm_source=rss&utm_medium=rss&utm_campaign=maryland-firm-purchases-legacy-at-west-cobb-in-marietta","description":"Maryland firm purchases Legacy at West Cobb in Marietta by John Yellig November 09, 2026 Legacy at West Cobb was built in 1970, renovated in 2021 and features one-, two-, three- and four-bedroom floorplans. Via Berkadia. The 395-unit, garden-style apartment community Legacy at West Cobb in Marietta has been sold to Maryland-based Acento Partners. Senior managing directors Andrew Mays and Paul Vetter of Berkadia Atlanta led the transaction on behalf of the seller, Massachusetts-based Aspen Square Management. Financial terms were not disclosed. When the deal closed on Oct. 30, the property was 88% occupied. “This complex transaction required persistence and disciplined execution from all parties,” Mays said. “Twenty initial offers reflected strong investor interest in the property’s affordable- to market-rent upside and large floor plans. Despite rate volatility, we attracted qualified buyers and delivered a successful outcome for our client.” Located at 2665 Favor Road SW, the property is near Cobb County's “Platinum Triangle” employment hub, which includes the Cumberland/Galleria area, Truist Park and The Battery. Legacy at West Cobb was built in 1970, renovated in 2021 and features one-, two-, three- and four-bedroom floorplans averaging 1,139 square feet, as well as townhome-style residences, which comprise 17% of the total unit count. Read More Related to This Post Offices at Atlanta Financial Center slated for residential conversion Atlanta Housing Scorecard: Inventory ticks higher as sales slow Lennar begins selling at King Oaks in McDonough Case-Shiller: Atlanta home-price growth ticks higher in August Engel & Völkers Atlanta promotes Managing Broker Kristen Skebe to chief people officer David Weekley to launch third Forsyth County community, Heritage Oaks Peachtree Residential slashing prices up to $100,000 to move inventory Elmington Residential acquires The Asher at Sugarloaf affordable-housing community Join the conversation Cancel reply Cancel reply Save my name, email, and website in this browser for the next time I comment.","published_at":1794259426000,"source_family":"atlanta-agent","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794260239293,"id":"e56a3eb2c2e586a9","acquisition_window":{"lower":1794258000000,"upper":1794344400000},"score":10,"tags":["multifamily","atlanta","deals","institutional"],"heat_signals":[],"date_precision":"timestamp","modified_at":1794259822000,"extraction":"semantic","canonical":"https://atlantaagentmagazine.com/2026/11/09/maryland-firm-purchases-legacy-at-west-cobb-in-marietta","content_hash":"bb35b3e9980e112858bb2ad7505085d27e0719c62b219055ab9e0b7b8e5c7223","access":"public","evidence_status":"article","keep":true,"importance":3,"section":"sunbelt","capital_focus":false,"geo_evidence":"Marietta","duplicate_of":null,"selector_reason":"A 395-unit apartment community sold at 88% occupancy after attracting 20 initial offers, providing a concrete regional transaction signal.","title_zh":"马里兰公司收购 Marietta 公寓社区","summary_zh":"Acento Partners 收购 Marietta 的 Legacy at West Cobb，项目共 395 套、成交时入住率为 88%；Berkadia 称交易吸引了 20 份初始报价。","impact":"short-pos","evidence_quote":"“This complex transaction required persistence and disciplined execution from all parties,” Mays said. “Twenty initial offers reflected strong investor interest in the property’s affordable- to market-rent upside and large floor plans. Despite rate volatility, we attracted qualified buyers and delivered a successful outcome for our client.”","evidence_basis":"body","cre_subcategory":null},{"source_id":"cushman-research","source_name":"Cushman & Wakefield Research","source_tier":"B","source_weight":9,"source_tags":["mixed-asset","data","trend"],"region":"national","title":"Cushman & Wakefield Brokers $44 Million Sale of 240-Unit Apartment Community in Sheboygan, Wisconsin to Axiom Properties","link":"https://cushmanwakefield.com/en/united-states/news/2026/11/the-corridor-sheboygan","description":"Cushman & Wakefield Brokers $44 Million Sale of 240-Unit Apartment Community in Sheboygan, Wisconsin to Axiom Properties Jeremy Barewin &bull; 11/9/2026 The Corridor garnered significant investor interest, attracting more than 25 offers The Corridor SHEBOYGAN, WISC. -- Cushman & Wakefield (NYSE: CWK), a leading global real estate services firm, today announced that its Multifamily Advisory Group has brokered the $44 million sale of The Corridor, a 240-unit Class A multifamily community in Sheboygan, Wisconsin, to Axiom Properties. Cushman & Wakefield's Brad Smith, Jack Maloney and Ralph Depasquale represented the seller, Chicago-based Midloch Investment Partners. Located at 1436 Green Street, the community was approximately 97% occupied at the time of sale. Under the seller's ownership, occupancy increased by nearly 25 percentage points in roughly 13 months. The sale also includes an in-place tax increment financing (TIF) agreement, which reimburses 65% of the incremental property tax through 2038 and enhances cash flow for the new owner. The Corridor benefits from a location within 30 minutes of more than 60,000 jobs, including major regional employers such as Kohler, Aurora Health Care, Sargento and Rockline Industries. Within a five-mile radius of the property, apartment occupancy exceeds 97%, while the area has seen no new multifamily deliveries since 2024 despite a sizeable population of renter households earning $50,000 or more annually. \"Tertiary Midwest markets supported by strong employment fundamentals and limited new supply are attracting significant investor interest,\" said Smith, Managing Director, Cushman & Wakefield. \"We received 25 offers from institutional, national, regional and private buyers, underscoring the depth of demand for stable, insulated markets like Sheboygan. As one of the largest multifamily transactions in the market in recent years, The Corridor presented a rare opportunity to acquire a high-quality asset with both strong in-place performance, cash flow stability and future upside.\" Completed in 2021 on a 13.44-acre site, The Corridor features one-, two- and three-bedroom residences across three residential buildings, along with a fitness center, resident lounge, community room, dog park, playground, outdoor gathering spaces and parking. Apartment homes feature granite countertops, stainless steel appliances, luxury vinyl plank flooring, in-unit washers and dryers, and select private balconies. Residents also enjoy convenient access to downtown Sheboygan, Lake Michigan beaches, retail destinations and recreational amenities. About Cushman & Wakefield Cushman & Wakefield (NYSE: CWK) is a leading global commercial real estate services firm for occupiers and investors with approximately 53,000 employees in over 350 offices and nearly 60 countries. In 2025, the firm reported revenue of $10.3 billion across its core service lines of Services, Leasing, Capital markets, and Valuation and other. Built around the belief that Better never settles , the firm receives numerous industry and business accolades for its award-winning culture. For additional information, visit www.cushmanwakefield.com . Media Contact Jeremy Barewin PR Manager, Central & Canada --> CAN'T FIND WHAT YOU'RE LOOKING FOR? Get in touch with one of our professionals. CONTACT US Your privacy matters to us With your permission we and our partners would like to use cookies in order to access and record information and process personal data, such as unique identifiers and standard information sent by a device to ensure our website performs as expected, to develop and improve our products, and for advertising and insight purposes. Alternatively click on More Options and select your preferences before providing or refusing consent. Some processing of your personal data may not require your consent, but you have a right to object to such processing. You can change your preferences at any time by returning to this site or clicking on Cookies More Options Agree and Close These cookies ensure that our website performs as expected,for example website traffic load is balanced across our servers to prevent our website from crashing during particularly high usage. These cookies allow our website to remember choices you make (such as your user name, language or the region you are in) and provide enhanced features. These cookies do not gather any infor
