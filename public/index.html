onsumer price index posting an annual gain of 3.5%, down from 4.2% the prior month. However, the reprieve might be temporary after oil prices shot back up this month, and Warsh said that he remained concerned. \"There might be some that look at this morning's data and say, 'oh, mission accomplished, everything is swell. That is not my view,\" he said. The Fed uses higher interest rates to fight inflation, and lower rates to stimulate the job market, in line with the central bank's dual mandate of price stability and maximum employment. The Fed targets a 2% cap on inflation, but key gauges have exceeded that level since early 2021. In a speech this week at The Exchequer Club of Washington, DC, Fed Gov. Lisa Cook said that the Iran war and massive spending on AI data centers were tilting the balance of risks back toward inflation , after a period in which labor market concerns dominated. \"Both of these new developments add weight to the inflation risk side of the seesaw, which is now tilting toward the ground,\" said Cook. \"As a whole, I see a notable shift in the balance of risks relative to a year or so ago, with inflation risks now outweighing employment risks.\" Earlier in the week, Fed Gov. Chris Waller , who until recently had advocated for rate cuts, sounded the alarm about resurgent inflation. \"Sternly staring at inflation until it melts before our withering gaze is not an option,\" he said. \"If we get another hot reading on core inflation this week, then the FOMC will need to consider tightening monetary policy in the near term.\" The renewed focus on inflation presents a mixed bag for homebuyers. On the one hand, it signals potential Fed rate hikes in the near term, which could keep mortgage rates close to their present level around 6.5%, or send them even higher. On the other hand, mortgage rates are unlikely to fall significantly until the Fed brings inflation fully and finally back under control. From that perspective, a hawkish Fed is good for the housing market in the long run. Loading... The FOMC will hold its next vote on interest rates on July 28. Financial markets estimate an 85% chance that policymakers will leave the current benchmark rate unchanged in its current range of 3.5% to 3.75%, according to CME FedWatch . Meanwhile, mortgage rates are at 6.55%, according to Freddie Mac . That's up sharply from the three-year low of 5.98% briefly reached in February, before the U.S. war with Iran sent oil prices soaring. Mortgage rates are especially sensitive to inflation, because lenders demand a high enough interest rate to both offset the risk of the loan and compensate for the falling purchasing power of the dollar over the lengthy term. Get real estate news in your inbox Sign up now Keith Griffith is a senior news editor at Realtor.com covering housing policy, real estate news, and trends in the residential market. Previously, his work has appeared in Business Insider, The Street, Chicago Sun-Times, New York Post, and Daily Mail, among other publications. He has a master&#x27;s degree in economic and business journalism from Columbia University.","published_at":1784321767000,"score":38,"tags":["national","rates","macro","regulator"],"heat_signals":["fed","fomc","rate cut","rate hike","inflation","mortgage rate","freddie mac","trend","trends","annual","housing market"],"importance":5,"selector_reason":"美联储官员在议息会前释放强硬抗通胀信号，直接影响抵押贷款利率和房地产估值。属于货币政策层面的系统性新闻，评为 imp=5。","section":"national","title_zh":"Fed 官员会前放鹰，通胀打击加码","summary_zh":"CPI 降至3.5%但仍高于2%目标，Fed 强调零容忍，rate cut 预期受压","impact":"short-neg","id":"44e380d7","fetched_at":1784343444743},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"How ROAD aims to boost housing supply and cut red tape","link":"https://www.housingwire.com/articles/how-road-aims-to-boost-housing-supply-and-cut-red-tape/","description":"The 21st Century ROAD to Housing Act, which went into effect on July 11, includes a host of pro-housing provisions aimed at making housing easier to build and cutting red tape. The nearly 400-page bill contains provisions aimed at streamlining federal reviews, supporting factory-built housing, expanding housing supply and incentivizing local governments to streamline housing development. It also includes a ban on institutional investors from buying more homes, but it provided much-needed carve-outs for build-to-rent (BTR) projects. The legislation further views all types of housing as part of the solution — including for-sale and rental, market-rate and below-market-rate, and multifamily housing. This also encompasses traditional site-built housing and off-site construction like manufactured homes, modular housing and accessory dwelling units ( ADUs ). While the bill is a good first step in driving change, most homebuilding leaders believe that there is still more work to be done, particularly at the local level, where the bulk of regulatory hurdles to new housing occur. “Housing has become top of mind for many legislators, but just as importantly, for many states and many local governments. This bill addresses a lot of that. Overall, I think we&#8217;re thrilled,” Ed Brady, president and CEO of the Home Builders Institute , told HousingWire TBD . “This is the first step in a longer process, and hopefully we&#8217;ll be able to have some conversations — No. 1 on implementation of this bill and No. 2 on what else do we need?” The bill’s supply-focused provisions The 21st Century ROAD to Housing Act includes numerous provisions aimed at making it easier to build a wide array of housing types. Together, these measures target regulatory burdens across all federal, state and local governments to make building homes easier, faster and more cost-effective. Streamlining federal reviews The housing bill contains several sections aimed at streamlining reviews of federally funded residential construction projects, most often affordable, below-market housing. Multiple sections direct the U.S. Department of Agriculture ( USDA ) and the U.S. Department of Housing and Urban Development (HUD) to coordinate environmental reviews. Section 103 exempts Rural Housing Service–funded infill housing projects from National Environmental Policy Act of 1969 (NEPA) requirements. USDA must report to the House financial services and Senate banking committees to evaluate the change within five years of enactment. Section 802 of the bill directs federal agencies to sign a memorandum of understanding (MOU) within 180 days to establish a joint environmental review framework for jointly funded housing projects. The MOU must address categorical exclusions — a process for streamlining acceptance of each agency&#8217;s environmental impact statements and assessments — and the feasibility of joint physical inspections. A pair of other sections is also aimed at streamlining environmental reviews. Section 205, the BUILD Housing Act, allows HUD to simplify NEPA compliance by designating certain housing assistance as &#8220;special projects&#8221; to simplify NEPA compliance, and by delegating housing reviews to state, local and tribal governments. Section 206, the Unlocking Housing Supply Act, simplifies NEPA review for small-scale and infill housing projects. This covers public facility repairs, construction/rehab projects of one to four units, property acquisitions, floodplain and open space purchases, office-to-residential conversions and larger multi-unit projects. Section 501 of the bill, the HOME Reform Act , would exempt new categories under the HOME program from NEPA reviews — including projects of 15 units or less, infill developments and acquisitions of property for affordable housing. It would also limit duplicative environmental reviews in the HOME program, which is frequently used by nonprofit developers like Habitat for Humanity . “This bill reduces unne","published_at":1784322208000,"score":27,
