, vows turnaround &nbsp;&nbsp; The Business Journals","published_at":1790766000000,"score":11,"tags":["office","houston","deals","institutional"],"heat_signals":[],"importance":3,"selector_reason":"休斯顿投资者收购面临困境的办公楼并计划扭转经营，反映Sun Belt办公资产的折价交易和重定位趋势。单笔交易规模未知，但市场信号具有区域代表性，因此评为3分。","section":"cre","title_zh":"投资者收购Bush Airport附近困境办公楼谋求翻盘","summary_zh":"Houston投资者买入困境办公塔楼并承诺改善，交易细节与成效待观察","impact":"neutral","id":"dce77005","fetched_at":1790817634240,"cre_subcategory":"办公"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"GGP Lines Up $400M Loan To Refinance New England&#039;s Largest Mall","link":"https://www.bisnow.com/news/boston/retail/brookfield-lines-up-400m-loan-to-refinance-new-england-s-largest-mall","description":"GGP Lines Up $400M Loan To Refinance New England&#039;s Largest Mall September 30, 2026 | 2:29 pm ET Jon Banister, East Coast Editor The owner of a huge shopping mall in the Boston suburbs is on the verge of securing a major refinancing deal after more than two years of uncertainty over its CMBS loan. Google Maps The Natick Mall spans 1.7M SF, the largest mall in the region. GGP , a subsidiary of Brookfield Corp ., is scheduled to close Oct. 22 on a $400M loan to refinance the Natick Mall , according to a presale report from Fitch Ratings . The five-year, fixed-rate loan is being originated by Bank of America and JPMorgan Chase Bank , Fitch said. It would then be securitized as a CMBS loan, with Midland Loan Services acting as the servicer. The borrower — a partnership of GGP and New York State Common Retirement Fund — is putting in $37.2M of additional equity while obtaining the new loan, according to Fitch. It said the money will be used to refinance existing debt, plus fund outstanding landlord obligations and pay closing costs. The loan is backed by a 1.2M SF portion of the 1.7M SF Natick Mall — the largest in the region . Sitting about 20 miles west of Boston, the mall was built in 1966, then mostly demolished and rebuilt in 1994. GGP has owned the mall since 1995. The company was acquired by Brookfield in 2018 and has remained the asset management giant&#039;s retail division, but earlier this year, it rebranded itself back to GGP. Its previous $505M loan on the Natick Mall was put on a watchlist by CMBS tracking firm Morningstar Credit in mid-2024, one year after Wegmans closed its 134K SF grocery store at the mall. The loan was then transferred to special servicing after its November 2024 maturity date. In March 2025, the owner secured an extension that pushed the maturity to November 2026. The pending refinancing would secure the mall&#039;s financial stability for at least another five years. The Fitch report said the asset has been strengthened in recent years as GGP has filled some of the mall&#039;s vacancy. The mall is now 91.7% leased, up from 82.4% in 2022, and its net cash flow has increased from $35.3M to $45.5M over that span, according to Fitch. Furniture retailer Raymour Flanigan in March opened a 110K SF store in the former Lord Taylor space that had been closed since 2021 and was previously planned to be turned into lab space. Bosse opened a 97K SF pickleball and entertainment venue in late 2024 in the former Neiman Marcus space, which is separately owned and not tied to the CMBS loan. GGP also redeveloped the former Sears space and has leased it to several tenants, starting with Dave Buster&#039;s in 2018 , followed by Level 99, Pokkido Indoor Playground and Lucid Motors. Wegmans has continued to pay rent on its space despite closing the store, according to Fitch, and this year it secured Asian grocery store T Market to sublease 75K SF, 56% of the space. “The loan for our Natick Mall represents the great results that GGP continues to achieve,” a GGP spokesperson said in a statement to Bisnow , adding that the loan has not yet closed. The Natick Mall deal is the second major mall refinancing GGP has in the works: It also has an $800M loan slated to close in October for the Oakbrook Center mall in the Chicago suburbs. GGP CEO Kevin McCrain said at a Chicago Bisnow event in May that the firm is “on offense” and is looking to grow. Continue reading this story with a free account Log in or register Contact Jon Banister at jon.banister@bisnow.com Related Topics: Brookfield Corp , CMBS , Fitch Ratings , GGP , JPMorgan Chase Bank , Midland Loan Services , Natick Mall , New York State Common Retirement Fund","published_at":1790792955000,"score":19,"tags":["retail","deals","institutional"],"heat_signals":["brookfield","vacancy"],"importance":4,"selector_reason":"1.7百万平方英尺大型购物中心获得4亿美元再融资，反映大型零售物业的信用和CMBS压力。交易金额达到重大单笔融资标准，因此评为4分。","section":"cre","title_zh":"GGP拟以$400M贷款重融资New England最大商场","summary_zh":"Natick Mall拟获五年固定利率$400M CMBS refi，另注入$37.2M equity","impact":"long-pos","id":"e4eb2e54","fetched_at":1790817634240,"cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Nvidia Looks To Insurers To Shoulder Losses For Riskier AI Data Center Tenants","link":"https://www.bisnow.com/news/national/data-center-capital-markets/nvidia-asks-insurers-to-shoulder-financing-risk-for-some-of-its-largest-customers","description":"Nvidia Looks To Insurers To Shoulder Losses For Riskier AI Data Center Tenants September 30, 2026 | 7:30 pm ET Dan Rabb, Data Centers Artificial intelligence startups represent a new, riskier breed of tenants that account for a growing share of demand for data centers and the high-powered chips used inside them. But lenders are balking at providing the billions of dollars these “neoclouds” require to expand their computing capacity. Now, Nvidia is trying to coax insurers into shouldering losses incurred when AI startups default on loans — an innovative finance structure the chipmaker hopes will uncork a flood of expansion capital to some of its fastest-growing customers. Nvidia Nvidia CEO Jensen Huang The AI chipmaking giant is proposing structures in which insurers would cover potential losses on loans made to neoclouds to purchase Nvidia GPUs, the Financial Times reports . It is increasingly common for the chips themselves to serve as the collateral in such financing agreements. Under the structures now being discussed, insurers would compensate lenders in the event a neocloud defaults and the GPUs securing the loan are unable to be resold for a high enough price to repay the outstanding debt. Such agreements could potentially boost access to capital for some of Nvidia’s riskier customers. The talks are still at an early stage, and no agreements are currently in place, according to the FT. That Nvidia is pitching such arrangements reflects the fact that it is becoming harder for a growing share of the firm’s customer base to access the capital needed to purchase its products. Nvidia rocketed from a niche maker of processors best known for powering video games into one of the world’s most valuable companies thanks to an AI arms race that has driven nearly insatiable demand for its products. And in the early days of the AI boom, nearly all of that demand came from tech giants like Amazon , Microsoft , Google and Meta — investment-grade companies that could largely fund their chip purchases from their own balance sheets. But over the past 24 months, a growing share of the demand driving Nvidia’s growth has come from a different, riskier class of customer: neoclouds. Neoclouds represent the fastest-growing segment of the data center market. With major players including CoreWeave , Core Scientific , Nscale and Lambda , these AI-specific cloud providers offer on-demand access to the GPU computing critical for AI. The sector posted 223% year-over-year revenue growth in the fourth quarter of 2025, according to Synergy Research Group . Unlike traditional hyperscalers, neoclouds almost always need to finance their billions of dollars of GPUs and the data centers to house them, a tall task for young companies with short track records and a nascent, largely unproven business model. Their risk profile has made lenders wary. And this poses a potential threat for Nvidia, whose fastest-growing customers need access to vast amounts of capital to keep buying its chips. Neoclouds’ ability to finance their digital infrastructure has rested, in part, on the use of chips and data centers as collateral. But unlike data centers that hold their value over time, chips are regarded as short-lived assets that depreciate relatively quickly. While Nvidia CEO Jensen Huang has argued that chips have long useful lives and should be regarded as an “investable asset class,” skeptics of Big Tech&#039;s AI spending often cite their potential rapid depreciation as a flaw in the economic assumptions underpinning the data center boom. Nvidia is hoping insurers and other financial firms can help soften this depreciation risk for potential lenders, according to the FT. Nvidia has reportedly supplied at least one insurer with information on chip depreciation and how the market is expected to value future computing capacity, and it is working with insurance broker Howden Re to develop a structure for such insurance deals. The potential size of such transactions would ","published_at":1790811056000,"score":17,"tags":["data-center","deals","institutional"],"heat_signals":["year-over-year"],"importance":4,"selector_reason":"AI数据中心租户的信用风险和保险安排正在影响数十亿美元的数据中心融资。该趋势涉及数据中心资本市场和大型科技租户风险，因此评为4分。","section":"cre","title_zh":"Nvidia拟让保险商为高风险AI数据中心租户兜底","summary_zh":"保险商或承担neocloud违约损失，方案仍早期且尚无协议，信用风险上升","impact":"short-neg","id":"3a7b923c","fetched_at":1790817634240,"cre_subcategory":"数据中心"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Morningstar To Relocate Global HQ To Renovated Thompson Center","link":"http ile the North Texas opportunity zones map appears to be shrinking, Dallas-Fort Worth actually has significantly more nominated census tracts that will offer better options for developers. The region is losing some of the larger opportunity zones from the first round of the federal program, but the total number of nominated tracts in DFW’s four major counties will more than triple with the new program. Among those 90 newly nominated zones are highly investable urban tracts that Savoy Cos. co-CEO Barrett Linburg expects will be quite popular. Courtesy of Barrett Linburg Savoy Cos. has done a lot of work in the opportunity zone east of Lake Cliff Park in North Oak Cliff. In the first iteration of the program, Texas attracted nearly $8B of the more than $112B that flowed into opportunity zones across the country by the end of 2024. With the program now permanent and more developers on board, Linburg said the total investment in Texas’ 608 nominated tracts could double over the next decade. &#34;Dallas could easily have an extra $250M or $300M of equity coming into our low- and moderate-income areas per year for the next decade,” Linburg said. “That&#039;s enormous money that doesn&#039;t cost the city of Dallas anything.&#34; Dallas County has the most nominated opportunity zones in the state with 60, including 44 in the city of Dallas alone. Those 44 zones could create “new opportunities in communities where additional investment can make a meaningful difference,” Dallas Assistant City Manager Robin Bentley said . Picking The Zones The Trump administration established the first iteration of the opportunity zone program with its Tax Cuts and Jobs Act of 2017 , which aimed to incentivize economic development in underinvested parts of the country. By the end of 2024, 77% of the around 8,000 designated census tracts in the U.S. had received some portion of the $112B total investment, according to a U.S. Department of the Treasury report released this summer . “It really was a good tool to get economic development and just equity and real estate projects moving,” Linburg said of the original opportunity zones. “And I say real estate projects because over 90% of the money that flowed did flow into real estate.” The original opportunity zone program was set to sunset this year, but the One Big Beautiful Bill Act made it permanent. The updated version, called OZ 2.0 , gives investors a rolling, project-based 10-year tax break that lets them take full advantage of the program’s benefits regardless of when they started work on a project. Texas submitted its opportunity zone nominations on Sept. 4. The state aimed to copy the success of Colorado and Utah with its OZ 2.0 selections, Linburg said. Those two states raked in nearly $8.5B of investment between them during the first go-round. State and county officials picked zones where projects can create jobs and grow the tax base over the next two to four years, Linburg said. To do that, Texas largely flipped its opportunity zones from rural areas that never saw a project to more urban tracts. In addition to Dallas County more than tripling its number of opportunity zones, Tarrant County is set to jump from seven to 20, Denton County will rise from three to seven, and Collin County will go from one to three. Under the original program, there were only three opportunity zones in DFW that Savoy seriously considered for investment. Out of the 44 nominated tracts in Dallas alone, Linburg said his company is excited about 25 of them. &#34;It&#039;s a huge difference in the quality of the census tracts from a developer&#039;s perspective,&#34; Linburg said. Future Activity Savoy has raised nearly $100M of equity for work on 25 opportunity zone projects in the state. The firm focuses on multifamily projects, with most of its Dallas projects being in North Oak Cliff and th","published_at":1790810197000,"score":20,"tags":["dfw","policy","developer"],"heat_signals":["texas","dallas","fort worth","dfw","fed"],"importance":4,"selector_reason":"OZ 2.0可能为达拉斯-沃思堡带来大规模机构和开发资本，关系到Sun Belt开发融资。虽然资金规模尚未确定，但政策影响范围较大，因此评为4分。","section":"institutional","title_zh":"OZ 2.0或为DFW带来巨额开发资本","summary_zh":"DFW提名区域增至首轮三倍，Dallas每年或新增$250M-$300M equity","impact":"long-pos","id":"f07b2255","fetched_at":1790817634240},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Elme completes liquidation","link":"https://www.multifamilydive.com/news/elme-communities-reit-liquidation-apartment-sales/831818/","description":"An article from Dive Brief Elme completes liquidation The REIT finalized the sale of its last remaining properties in September. Its last day of trading on the New York Stock Exchange is expected to be Nov. 5. Published Sept. 30, 2026 Leslie Shaver Senior Reporter Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google One80 Watkins Mill in Gaithersburg, Maryland. Permission granted by RailField Partners Dive Brief: Elme Communities completed the sale of its last remaining properties — The Kenmore and 3801 Connecticut Avenue — on Sept. 28 for $103.2 million after prorations and closing costs, according to a press release. Its last day of trading on the New York Stock Exchange is expected to be Nov. 5. Its share transfer books will close at 4 p.m. that day. After the sale of the Riverside apartments in Alexandria, Virginia, on Sept. 14, the Bethesda, Maryland-based REIT used a portion of the proceeds to repay in full all remaining debts and other obligations under its $520 million term loan entered into on Nov. 12, 2025, which was later terminated. Elme began its selloff in 2025. After initiating a “formal evaluation of strategic alternatives” in February 2025, it sold 19 properties to an affiliate of Atlanta-based investor, developer and manager Cortland Partners for $1.6 billion in cash last November. Dive Insight: Elme, known as WashREIT until 2022, expanded outside the Washington, D.C., metro area in the 2020s by acquiring properties in Atlanta. Despite Elme’s moves to improve its portfolio, its stock continued to trade at a discount to private-market values, forcing the REIT to look for alternatives, according to CEO Paul McDermott. In January 2025, Michael Lewis, an analyst for Truist, identified Elme as one of the most likely merger-and-acquisition candidates in the apartment industry. “We agree with management’s statement that it has transformed the company over the past several years and yet the stock continues to trade at a material discount to private market values,” he wrote in a research note shared with Multifamily Dive. Even after deciding to liquidate, the process to liquidate wasn’t seamless. On June 17, The Beitel Group terminated the $280 million purchase-and-sale agreement to acquire the 1,222-unit Riverside Apartments in Alexandria, Virginia, and related undeveloped land. The REIT regrouped quickly, however. On July 23, it announced that an Elme subsidiary entered into a contract with FPA Multifamily LLC to sell the massive apartment complex and undeveloped land for $250 million — $30 million less than the amount in the terminated agreement, according to a separate filing with the SEC on the same day. Additionally, the REIT agreed to sell the 193-unit Elme Bethesda to CAPREIT for $59 million, according to a May 27 SEC filing. Elme completed the sale of the 210-unit Elme Watkins Mill in Gaithersburg, Maryland, to RailField Partners on June 10, according to the June 23 filing. Jon Siegel, co-founder and chief investment officer at RailField, told Multifamily Dive in emailed comments that “buying from a liquidating REIT was a little different than typical just because they have some different motivations than everyone else.” He noted it ended up being easy to work with Elme. “We were concerned that they would have checked out in managing the property and that there would be nobody on the othe
