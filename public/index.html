e debt obligations still prevent many of the neighborhood’s Class-A landlords from transacting, these buildings have increasingly been acquired by better-capitalized owners that are more prepared to welcome new tenants. That is part of why CBRE predicted that the submarket’s vacancy rate will peak this year in its midyear greater Philadelphia forecast . The CBD had a total vacancy rate of 23.1% as of last quarter, CBRE found. CBRE Greater Philadelphia Market Leader Mamadou Baldé said the brokerage is seeing a sustained flight-to-quality trend amid a flatlining regionwide office construction pipeline . “We&#039;ll see that bounce down into Class-A until that fills up out of necessity,” Baldé told Bisnow . CBRE&#039;s forecast found that while the trend is well underway in the Philly suburbs, it has been muted in Center City due to the debt profile of the neighborhood’s Class-A buildings, which are generally older, less amenitized and less centrally located than their trophy counterparts. The loans underpinning a flurry of purchases made in the CBD when interest rates were low are now maturing as the industry contends with significantly higher borrowing costs, CBRE Executive Vice President Doug Rodio said. “Center City is at a point in time where those Class-A-plus buildings, many of which I sold, are facing troubled capital stacks and are unable to structure lease transactions,” he said. “A lot of these landlords did a great job in executing their business plan and renovating their assets and pushing rental rates but now come to the end of their loan period in a different capital markets environment, where the 10-year Treasury is as high as it&#039;s been in the last three years,” Rodio added. As those debt-saddled owners contend with this distress, their lack of access to capital means they have few options to improve their situation. “You are seeing issues where, unfortunately, people can&#039;t perform, can&#039;t do deals, don&#039;t have money for [tenant improvements],” Baldé said. The forecast predicted that Center City’s Class-A landlords won’t be able to boost asking rents until late this year or early next, but it also forecast a broader shift in the market as some of those assets return to the market under new ownership. Leasing velocity is strong at 2000 Market St. , which Rodio highlighted as an early example of this trend. CSB Holdings and Tide Realty Capital bought the building from Nahla Capital for $45.5M in August 2025 and have expanded occupancy from 67% to 75% with 65K SF worth of net new leases. The transaction last year was the first post-pandemic sale of a Center City office building greater than 500K SF that wasn’t converted into another use, Rodio said. CSB and Tide borrowed $50M from Citadel Credit Union to continue the lease-up, which was the largest loan in the Chester County bank’s history , according to an announcement earlier this week. Rodio also highlighted the 2024 sale of 1760 Market St. An entity associated with Giller Realty bought the 15-story property for $11.5M, roughly one-third of the $31.5M it traded for in 2018. “They, just like 2000 Market St., are going to continue to operate that as office and have signed a flurry of leases because they&#039;re offering high-quality space at an attractive rental rate in a great location,” Rodio said. Continue reading this story with a free account Log in or register Contact Noah Zucker at noah.zucker@bisnow.","published_at":1788546410000,"score":22,"tags":["office","distress","trend"],"heat_signals":["forecast","trend","occupancy","vacancy"],"importance":4,"selector_reason":"费城 CBD 的办公需求开始从超甲级外溢到甲级，是办公复苏的重要信号。它说明需求不是消失，而是在不同品质资产间重新分配。","section":"cre","extended_window":true,"title_zh":"费城CBD办公需求外溢至Class-A","summary_zh":"trophy空间需求外溢到旧Class-A，CBD vacancy率仍23.1%，但租赁改善","impact":"long-pos","id":"78014aa1","fetched_at":1788661847607,"cre_subcategory":"办公"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["
