ation currently remains above the Federal Reserve's 2% target to adjust its federal funds rate, the CPI slowed slightly in June to 3.5% . Fannie Mae is expecting the fed funds rate to remain in place at 3.6% over the next two years. While most experts believe the next Fed move will be a rate cut next year , a growing number are anticipating a short-term increase. The macroeconomic impact on mortgage activity is mixed. Although mortgage rates have remained elevated since the onset of the Iran War in March, the housing market has shown some resiliency. Mortgage credit has tightened this summer, but remains well above levels the same time a year ago, the Mortgage Bankers Association recently reported . Buying activity also heated up to close the spring market, as non-conforming lending hit its highest share of monthly lock activity in several years last month, Optimal Blue reported . Andrew Martinez Reporter Andrew Martinez joined National Mortgage News in January 2022. He previously worked at Bisnow, covering commercial real estate news in the Boston... Read full bio twitter mailto linkedin","published_at":1784139821000,"score":32,"tags":["housing","national","rates","trend","lender"],"heat_signals":["fed","rate cut","inflation","mortgage rate","30-year fixed","fannie mae","outlook","forecast","housing market"],"importance":4,"selector_reason":"Fannie Mae 预计抵押贷款利率到 2027 年仍在 6.3% 附近，直接影响购房需求和贷款发放预期。虽非 Fed 决策本身，但来自核心住房金融机构，对全国住宅市场有中等行业影响。","section":"national","title_zh":"Fannie Mae 警告：6.3% rates 延至2027","summary_zh":"2026 single-family originations 下调2%至$2.298T，高利率压制购房与refi","impact":"short-neg","id":"d2fa2756","fetched_at":1784164497364},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Vought defends CFPB cuts, calls for congressional reforms","link":"https://www.housingwire.com/articles/vought-cfpb-reform-testimony/","description":"Russell Vought, the acting director of the Consumer Financial Protection Bureau ( CFPB ), testified before the House Financial Services Committee on Wednesday, arguing that the bureau has exceeded its statutory authority while lawmakers spar over its future. During the contentious hearing — which marked Vought &#8216;s first appearance before Congress in his role leading the CFPB — Vought defended the Trump administration&#8217;s overhaul of the agency and the rollback of the agency that he has overseen. The hearing was convened to examine the bureau&#8217;s Spring 2026 report, which covers its activities from October 2024 through December 2025, as required under the Dodd-Frank Act. Committee leaders also discussed a draft of the CFPB Reform Act of 2026 , which would overhaul the bureau’s structure and authorities. The proposal would increase congressional oversight, revise the CFPB’s funding and governance, expand transparency and accountability requirements for rulemaking and enforcement, and recalibrate its supervisory and enforcement powers. The proposal also includes an adjustment to the threshold for supervised institutions to $21 billion in assets to account for economic growth, up from the current threshold of $10 billion. Vought told lawmakers during the hearing that the CFPB had become an agency that operated beyond its congressional mandate and imposed unnecessary costs on consumers and financial institutions. He said the bureau should not continue to exist in its current form and argued that Congress should subject the agency to the annual appropriations process rather than allowing it to receive funding directly from the Federal Reserve . The hearing came as Vought&#8217;s tenure as acting director approaches its Aug. 1 expiration under the Federal Vacancies Reform Act. President Donald Trump has nominated former CFPB official Brian Johnson to serve as the agency&#8217;s permanent director, although the Senate has not yet scheduled him for a confirmation hearing. If Johnson is not confirmed before Vought&#8217;s acting service expires, acting Deputy Director Mark Paoletta could assume the role. Vought defends CFPB &#8216;culture&#8217; Republican lawmakers praised Vought’s efforts to scale back what they described as regulatory overreach under previous administrations. They highlighted the bureau’s move away from “regulation by enforcement,” revisions to rules such as the Section 1071 small-business data collection rule, and efforts to bring more CFPB activities under congressional control. “We have changed the culture,” Vought said, noting the agency is “about half of what we were when we came into office.” He called on Congress to reduce the bureau director’s discretion by clarifying statutory standards and limiting areas where agency leadership can make broad policy choices. Rep. Andy Barr (R-Ky) defended Vought&#8217;s leadership choices. &#8220;If my friends on the other side of the aisle have anyone to blame for the actions that you have taken, they need to look in the mirror because they have given you the power that you have exercised here today.” When asked about bringing the CFPB into the annual appropriations process, Vought said placing the bureau under the process would be the &#8220;most important reform lawmakers could make.&#8221; He argued that the agency’s current funding structure has contributed to what he called a “cavalier attitude” and a &#8220;swagger&#8221; at the bureau. When asked about raising the CFPB’s supervision threshold for financial institutions from $10 billion to $21 billion in assets, Vought said the change would allow the bureau to focus oversight on larger, higher-risk institutions. Democrats &#8216;ready for Vought to be gone&#8217; Democrats, meanwhile, criticized Vought’s leadership, arguing that workforce cuts and reduced enforcement activity have weakened the CFPB’s ability to protect consumers. They accused him of undermining the agency’s mission by shrinking staff and","published_at":178414 eamed with Rep. Maria Elvira Salazar (R-Fla.) to revive a bill that stalled in committee three years ago. They have reintroduced the Making Condos Safer and Affordable Act around the anniversary of the deadly 2021 condo tower collapse in Surfside, Florida. The bill would expand access to low-interest, government-backed loans for structural and life-safety work in condominium buildings. &#8220;The Surfside tragedy changed our community forever and reminded us that protecting families must always come first,&#8221; Salazar said in a statement. &#8220;This bipartisan bill gives condominium associations and homeowners the tools they need to finance critical safety repairs, protect residents, and preserve safe, affordable housing across South Florida.&#8221; The bill could have an easier path through Congress this time. Roughly 18 states have introduced condo safety and reserve legislation since the Surfside disaster. Florida created statewide &#8220;milestone inspections&#8221; for older buildings and required structural integrity reserve studies to fund major repairs. Maryland, Virginia and Tennessee are among the other states that enacted similar condo safety and reserve laws. The federal legislation comes as cities and states pursue zoning reform to boost density through multifamily construction. California lawmakers are working on two condo law reform bills to reignite condo construction. Easing the condo assessment pain Wasserman Schultz&#8217;s and Salazar&#8217;s bill would let condo associations spread the cost of repairs over time instead of relying on large special assessments. Supporters argue that owners facing new inspection rules and insurance hikes need financing help to stay in their homes. &#8220;This bipartisan legislation provides practical financing tools to help communities address infrastructure needs, protect residents, and plan responsibly for the long term,&#8221; Dawn Bauman, CEO of the Community Associations Institute, said in a statement. The hat land,&#8221; Alex Chalmers, managing partner at Material Capital Partners , told HousingWire &#8216;s TBD. &#8220;The land sellers aren&#8217;t going to extend it. They just want to sell their land, right? They don&#8217;t care if it goes to a BTR community or whatever else. So that was a real pinch point, I think, for a lot of people, and it really cut off a lot of the new project pipeline.” Now that this legislative uncertainty is largely resolved, capital is now beginning to flow back into BTR projects. But questions persist over how quickly the industry can make up lost ground, how the Department of the Treasury will interpret the law&#8217;s exemptions and what the future outlook holds for the industry. Renewed optimism With the potentially harmful provisions stripped from the final text of the bill, investors feel comfortable placing capital in BTR communities once again, Chalmers said. In his experience, investor sentiment remained mixed until the Senate passed the bill on June 23. Since then, investment has started flowing back into the sector as investors became more confident in the bill’s fate. While it could take a few months for the industry to make up for lost ground, Material Capital Partners can already feel the positive effects of the bill’s passage. “At least for Material Capital Partners, we have a number of projects — probably at least five — that are able to go forward now, and that&#8217;ll create close to 1,200 new housing units just in the next 18 to 24 months.&#8221; Tony Julianelle, CEO of Atlas Real Estate , a company that purchases and manages BTR communities, argued that investors never abandoned the sector. Instead, capital simply sat on the sidelines until there was more certainty. &#8220;I think everybody anticipated that this would get resolved,&#8221; Julianelle said. &#8220;I don&#8217;t think there are a lot of investors who just said, &#8216;Oh, you know what? No more built-to-rent, no more single-family, we&#8217;re just going to go buy self-storage.&#8217; I don&#8217;t think there were a lot of people who said, &#8216;Let&#8217;s fully reallocate.&#8217; I think it was more, &#8216;All right, hold on a minute, let&#8217;s see what happens.'&#8221; Now, with the wait-and-see period over, many investors, developers and operators are working with restored confidence. “Build to rent is here to stay. It&#8217;s going to be a meaningful way to meet housing demand , and the capital is now in play, for sure,” Julianelle added. Lingering uncertainty While the bill&#8217;s passage introduced short-term clarity, it may have introduced new questions. To understand why, it&#8217;s worth examining how the institutional investor ban is worded. Section 1001 of the bill, titled “Home-ownership for Main Street America,” defines single-family as traditional detached and att","published_at":1784150806000,"score":28,"tags":["housing","rates","policy","btr-sfr","deals","trend"],"heat_signals":["build-to-rent","btr","outlook"],"importance":3,"_from_fallback":true,"section":"btr","title_zh":"ROAD 法案落地，BTR 管线解冻","summary_zh":"最终案删除机构禁令与7年出售要求，此前冻结的 BTR 投资有望恢复","impact":"long-pos","id":"f1cf56f4","fetched_at":1784164497364},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Lincoln Property Co. acquires The Spectrum Cos.","link":"https://www.multifamilydive.com/news/multifamily-merger-and-aqusition-lincoln-spectrum/825340/","description":"An article from Dive Brief Lincoln Property Co. acquires The Spectrum Cos. The combined firm is poised to ramp up its development and acquisition pipeline across both multifamily and commercial real estate. Published July 15, 2026 Leslie Shaver Senior Reporter Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google A rendering of the Vara Trinity Park in Durham, N.C. from The Spectrum Cos. Permission granted by The Spectrum Cos. Dive Brief: Li  vertically integrated capabilities, per the release. Lincoln’s acquisition came on the same day as Milhaus made bigger waves , merging with SRG Residential, a subsidiary of Sares Regis Group, and acquiring Broadshore Capital Partners to expand its investment and lending capabilities. With the deal, Milhaus created a multifamily platform with a $2.5 billion development pipeline, more than 50,000 homes managed and investing and lending capabilities across more than 20 markets nationwide. “This is about going to 3,500 development starts a year instead of what was going to be 1,800 to 2,000,” Milhaus CEO Tadd Miller told Multifamily Dive. “This is about being at 100,000 units under management in the next 24 months. That’s what this transaction is about.” Click here to sign up to receive multifamily and apartment news like this article in your inbox every weekday. Add us on Google Share Copy link Email LinkedIn X/Twitter Facebook Print License Filed Under: Capital, Transactions","published_at":1784139928000,"score":13,"tags":["mixed-asset","carolinas","deals","developer"],"heat_signals":[],"importance":4,"selector_reason":"Lincoln Property Co. 收购 The Spectrum Cos.，将扩大其多户和商业地产开发收购管线。虽然未披露金额，但涉及大型开发运营商并具有并购整合意义，评为行业中等重要。","section":"cre","title_zh":"Lincoln 收购 Spectrum，扩 Carolinas 平台","summary_zh":"Spectrum 已开发近7,000套 multifamily，合并后提升东南开发与收购管线","impact":"long-pos","id":"66aed5f2","fetched_at":1784164497364,"cre_subcategory":null},{"source_id":"connect-cre","source_name":"Connect CRE","source_tier":"A","source_weight":7,"source_tags":["mixed-asset","deals"],"region":"national","title":"Ziegler Arranges $304M Tax-Exempt Bond for Groton Senior Living Expansion","link":"https://www.connectcre.com/stories/ziegler-arranges-304m-tax-exempt-bond-for-groton-senior-living-expansion/","description":"Specialty investment bank Ziegler has closed on Fairview's Vista Point Project, one of the largest senior living tax-exempt bond transactions to date in the state of Connecticut. The $3
