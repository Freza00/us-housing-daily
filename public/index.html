p down inflation might be in order. Expert quote: \"My suspicion is the chair will find it in his own best interest to describe the committee's reaction function to the market. It's part of the responsibility of the Fed to tell the market what it's thinking, not just what it's doing.\" —Derek Tang, CEO of Monetary Policy Analytics Forward look: The Federal Open Market Committee meets Tuesday and Wednesday, and Fed Chair Kevin Warsh will announce the group's policy decision on Wednesday afternoon. Is it the best of times or the worst of times for the Fed to hike interest rates? Either way, this week's meeting of the new-look Federal Open Market Committee will give market observers new clues on how the U.S. central bank interprets a mixed bag of economic data. Based on its core economic indicators — inflation and unemployment — the Federal Reserve appears on solid footing to keep its benchmark interest rate unchanged. But renewed tensions in the Middle East have bond markets pricing in higher inflation, building the case for rate hike during Wednesday's policy vote. Processing Content The committee will have to grapple with which sets of data serve as more reliable indicators of where the economy is heading. For Fed Chair Kevin Warsh, the challenge will be conveying to the public how the monetary policy-setting committee reached their conclusion in this meeting without setting an unwanted precedent for future meetings. \"My suspicion is the chair will find it in his own best interest to describe the committee's reaction function to the market,\" said Derek Tang, CEO of Monetary Policy Analytics. \"It's part of the responsibility of the Fed to tell the market what it's thinking, not just what it's doing.\" Other observers expect Warsh to give scant details about the specific factors that will have fed into the FOMC's decision. Jai Kedia, a fellow at the Cato Institute's Center for Monetary and Financial Alternatives, said it is logical for Warsh to avoid voicing his own opinions on the Fed's framework while he awaits the findings from his externally commissioned policy review task forces. \"He doesn't want to bias the task forces one way or another,\" Kedia said of Warsh. \"Once they submit their reports, it will be fair to ask about the objectives they outlined and how the Fed intends on meeting them, but it would seem odd if he were to provide his own opinion on those topics ahead of time.\" After voting to hold interest rates steady during its meeting last month, the FOMC received two economic reports that seemed to bolster the odds that the federal funds rate would remain unchanged for a fifth straight meeting. First came the Bureau of Labor Statistics' jobs report on July 2 . The economy added fewer workers than expected in June and the agency revised down its estimates from April and May, but the report showed continued workforce growth and the unemployment rate fell slightly from 4.3% to 4.2%. Market expectations for a rate hike in July, which climbed as high as 38% after the June FOMC meeting, plummeted to 18% on the news, according to the CME Group's FedWatch tool. Then came the BLS' consumer price index report, which showed an annualized inflation reading of 3.5% from June, down from 4.2% in May , the first month-to-month decline since January. Interest rate hike expectations, whic","published_at":1785232800000,"score":25,"tags":["national","rates","macro","regulator"],"heat_signals":["fed","fomc","rate hike","inflation","outlook","annual"],"importance":5,"selector_reason":"地缘政治和债券市场正在影响美联储利率路径，是住宅和商业地产融资成本的核心变量。涉及FOMC政策判断及潜在分歧，属于系统性宏观事件，因此评为5分。","section":"national","title_zh":"Iran 紧张与债市扰乱 Fed 路径","summary_zh":"FOMC 本周决议，通胀就业支持不动，实时数据仍暗示 hike 风险","impact":"short-neg","id":"a321e4d8","fetched_at":1785290062711},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Mortgage rates move closer to 7%, but housing demand holds up ahead of Fed meeting","link":"https://www.housingwire.com/articles/mortgage-rates-near-7/","description":"Mortgage rates continued to climb this week and are now approaching 7% for locked loans across all borrower credit profiles. But home purchase and refinance demand hasn&#8217;t fallen steeply despite the increased affordability pressures. On Tuesday, HousingWire &#8216;s Mortgage Rates Center showed that rates for 30-year conforming loans averaged 6.94%, up 9 basis points from one week ago . Rates for 30-year jumbo loans also averaged 6.94%, up 10 bps in the past week, while rates for 30-year Federal Housing Administration (FHA) loans rose 8 bps to 6.63%. Rates have increased gradually since bottoming out near 6.15% for 30-year conforming products in March. But last week&#8217;s application data from the Mortgage Bankers Association (MBA) showed that borrower demand remains resilient despite the upward trend, as applications were up 1.9% during the week ending July 17. Compared to the same period a year ago, refinance demand was up 7% while purchase demand was essentially flat. “Mortgage applications rebounded last week despite mortgage rates increasing, reflecting the continued strength of homebuyer demand,&#8221; Bob Broeksmit , the MBA&#8217;s president and CEO, said in a statement. &#8220;As inventory improves in many markets, more prospective buyers are finding opportunities to enter the market even as borrowing costs remain elevated. While some economic uncertainty may persist in the coming months, housing demand and a growing supply of homes should continue to support purchase activity.” What signal will the Fed send? On Wednesday, the Federal Open Market Committee (FOMC) is set to complete its second meeting under the watch of Chair Kevin Warsh . It&#8217;s unlikely that the committee will change course from its current policy rate of 3.5% to 3.75%, with the CME Group &#8216;s FedWatch tool showing 70% of interest rate traders predicting no change and 30% predicting a 25-bps increase. “The Federal Open Market Committee is expected to leave the federal funds rate unchanged in July, but a hold is no longer a foregone conclusion,&#8221; said Sam Williamson, senior economist at First American . &#8220;Escalating tensions in the Middle East have renewed pressure on oil and gasoline prices , making a rate hike more plausible than it appeared just a month ago. Meanwhile, the labor market remains resilient, with initial jobless claims near historic lows. &#8220;Against that backdrop, the bar for raising rates has fallen — and could fall further if higher energy costs begin spreading into broader prices.” Charles Goodwin, vice president and head of bridge and DSCR lending at Kiavi , said recent inflation data that was softer than expected may keep benchmark rates in check this week. Goodwin noted that the largest increases in the Consumer Price Index (CPI) for June were tied to energy prices, meaning that a deescalation of tensions in the Middle East could equate to more transitory inflation gains. During his first meeting as Fed chair, Warsh indicated a shift away from the forward-looking guidance that was a signature of his predecessor, Jerome Powell. The lack of guidance could push markets to react differently. “We all, in our hearts, pray that we hear something from the Fed saying that it&#8217;s found a new way to tame inflation and lower rates, but that’s just not the reality,” said Melissa Cohn, regional vice president at William Raveis Mortgage . “What I’m really looking to see is just how hawkish Warsh is, and because it’s his second meeting and press conference — if he holds one — if there’s more transparency. It’ll be interesting to see how he’s going to choose to continue to communicate to the general public.” Affordability impacts and borrower strategies Analysis released this week by First American found that housing affordability — measured by comparing home price appreciation to income and mortgage rate changes — shrank for a third straight month in July. &#8220;Yet, the bigger picture remains encouraging,&#8221","published_at":1785258429000,"score":26,"tags":["housing","national","rates"],"heat_signals":["fed","fomc","rate hike","inflation","mortgage rate","trend"],"importance":4,"selector_reason":"接近7%的按揭利率直接影响购房负担能力、成交量和再融资需求。该变化发生在美联储会议前，具有较强的全国市场影响，因此评为4分。","section":"national","title_zh":"30Y mortgage 逼近 7%，需求仍抗压","summary_zh":"Conforming 升至 6.94%，申请量周增 1.9%，购房需求仍有韧性","impact":"neutral","id":"053cd47b","fetched_at":1785290062711},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Share of high-density apartment projects grew in 2025: NAHB","link":"https://www.multifamilydive.com/news/high-density-apartment-projects-construction-census-2025/826372/","description":"An article from Share of high-density apartment projects grew in 2025: NAHB The South saw the most apartment deliveries overall, while the Northeast recorded the biggest increase in high-density construction, per the NAHB’s analysis of the Census Bureau’s annual survey. Published July 28, 2026 Julie Strupp Senior Editor Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Getty Images Listen to the article 4 min This audio is auto-generated. Please let us know if you have feedback . The number of finished multifamily construction projects declined last year — welcome news for multifamily operators eager to work through the recent supply wave — and a record share of new apartments were high-density, according to the National Association of Home Builders’ Monday analysis of the Census Bureau’s Survey of Construction . Dating back 1972, the series’ earliest estimates, most apartments have typically been constructed in buildings with less than 50 units. This trend reversed in 2017 and has since remained unchanged. Now a majority of new multifamily units are in high-density buildings. Smaller apartment projects are increasingly financially unfeasible , according to 2025 analysis from the Urban Institute. The shift away from smaller builds looks likely to persist for now: With the current high interest rates and land prices, developers are incentivized to build larger, denser projects in order to make construction pencil out and to minimize operating costs. Optional Caption Courtesy of NAHB After a nearly 40-year high in 2024, the overall number of apartment completions fell from 608,000 units to 484,000 units in 2025. The South continued to lead U.S. regions with the most apartment deliveries, with 45% of the country’s total completions, according to NAHB. That number is dropping, however: Last year the South saw 217,000 completions, down from 292,000 in 2024. The West was second in 2025 with 26% of the country’s multifamily completions, while the Northeast had 16% and the Midwest had 13%. Here are other trends the NAHB identified in the Census’ 2025 survey. Apartment density varies by region A majority of the 484,000 new multifamily units, 57%, were in buildings with 50 or more units — the highest share since 2021, according to NAHB. The remaining 43% were in low- or medium-density buildings. The South, West and Northeast had more high-density completions than low-medium ones in 2025. The Midwest was the only region where low- or medium-density projects outpaced high-density ones, and it was also the only region where the share of high-density units declined. The Northeast saw the largest divergence in building types, with 58,000 new high-density units last year — representing the highest-ever level at 73% of total construction — and only 21,000 new low- or medium-density units. Build-to-rent vs. build-to-sell The vast majority of the multifamily units completed last year — 95% — were built to rent. Nearly 60% of these units were in a building with 50 units or more, the highest share in high-density buildings since 2021. 2025 marked the ninth consecutive year where most newly constructed apartments were high-density. The number of built-for-sale multifamily units declined from 29,000 in 2024 to 23,000 last year. High-density buildings continued to account for the majority of these new units, but that share fell from 40% in 2024 to 32% in 2025. The largest increase in market share for multifamily built-for-sale units was in small apartment buildings with 10-19 units, up from 13% in 2024 to 24% in 2025, representing the sector’s second-largest segment. Click here to sign up to receive multifamily and apartment news like this article in your inbox every weekday. Recommended Reading Multifamily starts climbed in June By Julie Strupp &#8226; July 17, 2026 Add us on Google Share Copy link Email LinkedIn X/Twitter Facebook Print License Filed Under: Development","published_at":1785266280000,"score":27,"tags":["multifamily","national","data","construction","homebuilder"],"heat_signals":["build-to-rent","trend","trends","annual"],"importance":3,"selector_reason":"高密度公寓项目占比上升，反映全国住宅建设结构和供给方向变化。虽然不是宏观政策或大型交易，但有全国性行业数据支撑，因此评为3分。","section":"national","title_zh":"2025 高密度公寓占比继续上升","summary_zh":"NAHB 称完工 multifamily 减少，高密度占比创新高，缓解供给压力","impact":"long-pos","id":"9130e11d","fetched_at":1785290062711},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Real estate brokers say rising mortgage rates derail early 2026 housing rebound","link":"https://www.housingwire.com/articles/iran-war-mortgage-rates/","description":"Heading into 2026, most economists and industry analysts were anticipating a stronger housing market than in past years. And for the first nearly two months of the year, it was looking like 2026 might be the year when things finally turned around for a housing market that has been stuck at roughly 4 million existing home sales since 2023. “We really felt the breeze behind us at the beginning of the year and when the war started that changed,” Mike Pappas, the CEO of The Keyes Company and Illustrated Properties , told HousingWire. The war he&#8217;s talking about, of course, is the ongoing conflict in Iran. Prior to the war starting in late February 2026, data from the HousingWire Mortgage Rates Center , which is powered by Polly , shows that the rate for a 30 year conforming mortgage was at 6.23%. As of July 28, rates were at 6.94% , after the war in Iran again began to escalate earlier in the month. According to real estate brokers across the country, the mortgage rate rollercoaster has resulted in a year unlike many anticipated back in January and early February. “It&#8217;s going to be another year of roughly 4 million home sales and early this year, that was not going to happen. We were well on the road to sales going up at least 10% if not 12%, which would have gotten us to around 4.5 million sales,” Anthony Lamacchia, the broker-owner of Lamacchia Realty , said. “In February, we were champing at the bit that this was going to be the year, and then the war and the rise in rates destroyed everything.” By Lamacchia’s estimates, the war in Iran and its impact on mortgage rates will cost the housing market at least 400,000 home sales nationally this year. Mortgage rates are not just a buyer problem In New England, Lamacchia said not only are the higher mortgage rates causing buyers to sit on the sidelines, but they are also causing some would-be sellers to pull back on listing, as a move up purchase does not make a lot of financial sense for them. Further down on the East Coast, Boomer Foster , the founder of Paul Wesley Real Estate , agreed that the inflation and uncertain interest rate environment caused by the conflict in the Middle East was one of his firm’s “biggest challenges right now.” “We are heading into a traditionally slow month in August, so we&#8217;re seeing an increase in price reductions and some sellers are pulling their homes off the market,” Foster said. “For buyers, we&#8217;re seeing fewer people out looking, but the ones that are out there are still transacting.” For the buyers that are still out looking, down in South Florida, Pappas said conditions are more favorable for those looking to negotiate a deal, as sellers realize that for many buyers, their budgets are being squeezed by the rising mortgage rates. “We have a calculator that shows buyers that a permanent rate buy down is two and a half times more impactful to them than a price reduction and that a temporary buy-down is 10 times more impactful,” Pappas said. “So rather than reducing the purchase price by $15,000, we&#8217;re asking the seller to give the buyer a rate buydown to help them move that rate back down to a reasonable level, making the purchase more affordable for them.” Foster shared a similar perspective, as he feels that in his market there&#8217;s a great opportunity for buyers, especially if more inventory comes on the market. “We&#8217;re seeing more homes come on the market and while interest rates might be a bit higher, people normally buy based on payment, not overall price, and if a buyer can negotiate the price down to a monthly payment that works for them, they are still able to transact,” Foster said. “This is the first time since before COVID in our market that the ratio of buyers to sellers is starting to even out and providing buyers with opportunities to negotiate.” Budget concerns aren’t just for buyers Affordability and budgets are things Lamacchia said he is also focused on at the brokerage level. When rates began","published_at":1785270191000,"score":24,"tags":["housing","national","rates","trend","brokerage"],"heat_signals":["inflation","mortgage rate","existing home sales","housing market"],"importance":3,"selector_reason":"按揭利率上升导致年初住宅复苏预期受挫，反映全国住宅需求对融资成本的敏感度。该报道提供行业层面的市场转折信号，但缺少关键宏观数据，因此评为3分。","section":"national","title_zh":"mortgage rate 上行打断 2026 复苏","summary_zh":"经纪人称销量或仍约 400  direct toward the BILD program as part of the Healey-Driscoll administration's Affordable Homes Act . The administration has set a goal of building an additional 222,000 housing units by 2035 to address the state’s shortage. MassHousing CEO Chrystal Kornegay told Bisnow the BILD program was designed to provide capital for mixed-income housing projects that developers were unable to finance due to high interest rates and construction costs. \"We saw a bunch of deals that have been stalled,\" Kornegay said. \"We discovered that by using that and by partnering with Freddie Mac for the debt piece, that there was a way that we could offer a debt and equity package that could 'unstick' some deals financially, and that was how BILD was born.\" The program has two components: the FORGE loan — Financing Options for Residential Growth and Expansion — and the Momentum Fund. The FORGE Loan consists of a senior mortgage originated by Berkadia and backed by Freddie Mac as well as a subordinate loan from MassHousing. The subordinate loan accounts for 10% of the total debt. With this model, MassHousing acts as a facilitator between Freddie Mac and a developer, taking on the first loss on a mortgage in the event of borrower default. This helps mitigate some of the risks and allows facilitation of a larger loan. The borrower also receives one combined rate on the transaction. In what Urban Institute described as an “innovative” aspect of the program, MassHousing then provides a preferred equity investment to developers through its Momentum Fund. The equity comes with a lower required return than what traditional investors would demand: The report estimates 6% compared to 12% for market-rate equity. This saves a developer millions of dollars over the life of the project, far greater than the subsidy they get from a below-market-rate construction loan, the report says. Courtesy of Urban Institute A traditional mixed-income development capital stack compared to a capital stack under MassHousing's BILD program \"The entire solution returns the project to feasibility by low-cost, more patient leverage and significantly changes the math equation for the common equity investors,\" said MassHousing Director Mark Attia, who helped design the program. \"For the government to participate in this way in domestic public finance is really innovative.\" To be eligible for the program, a project must have at least 50 units, and at least 20% of","published_at":1785271014000,"score":16,"tags":["multifamily","national","policy","construction","regulator"],"heat_signals":["freddie mac"],"importance":3,"selector_reason":"新的融资模式试图在高利率环境下推动混合收入住房开发，回应全国住房短缺与项目融资难题。其政策和融资启示较强，但影响尚未达到重大联邦政策级别，因此评为3分。","section":"national","title_zh":"MassHousing 新融资推 mixed-income","summary_zh":"BILD 已资助 6 个项目 605 套，公共资本补足 debt 与 equity 缺口","impact":"long-pos","id":"3be95a84","fetched_at":1785290062711},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Texas CEO sees challenges in underwriting high-supply markets","link":"https://www.multifamilydive.com/news/Austin-apartment-supply-texas-property-taxes/826399/","description":"An article from Q A Texas CEO sees challenges in underwriting high-supply markets Even though properties are well below replacement costs in places like Austin, CONTI Capital CEO Carlos Vaz is finding it difficult to make the numbers work in the Texas market. Published July 28, 2026 Leslie Shaver Senior Reporter Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google The Vine Apartments in Arlington, Texas. Permission granted by CONTI Capital In 2020, Carlos Vaz’s multifamily portfolio contained 14,000 units in Texas. Now, he has about 3,000 apartments. The unit reduction wasn’t forced upon him, he says. He chose to sell at the top of the market — a decision he doesn’t regret. “We sold a lot,” Vaz said. “We’ve had our own issues with our own properties. But we believe that this is one of the best times to buy, and we have been very diligently trying to find deals.” But right now, the founder and CEO of apartment owner CONTI Capital says it's hard to make acquisitions work, with obstacles to investment varying by market. In Austin, for instance, brand-new properties can drop 30% to 40% below replacement costs, according to Vaz. But there’s a catch. “It [the prices] gets you excited on one hand,” Vaz said. “On the other hand, the rents are so negative. It’s like, ‘How long do I need to carry this deal here until it’s positive again — just the cash flow alone?’ That’s the conundrum that you have.” While underwriting in Dallas and Houston is easier, there are still challenges. “In those markets, it has not been easy,” Vaz said. “Now, if interest rates are too high with a chance of potentially a rate increase, that can become even worse.” Here, Vaz talks with Multifamily Dive about the impacts of elevated interest rates, heavy supply and increasing expenses. This interview has been edited for brevity and clarity. MULTIFAMILY DIVE: What led to this difficult situation for apartment owners, in your opinion? CARLOS VAZ : You come from a near-zero interest rate to over 500 basis points. It's like you drive a car on the highway for maybe 20 miles per hour. Then you get in that same car, and now you drive for 160. I mean something's going to happen, right? Carlos Vaz Permission granted by CONTI Capital So, if you go back to 2021 or so, look at any report about Austin, and you see rent growth of about 7% or 8% — massive rent growth. You see interest rates that are very, very low. At some point the Fed was going to increase interest rates, but I mean that increase was so fast. That was highly, highly destructive because you go from, call it, a 3% interest rate to a 7% or 8% interest rate. How long before things get better? The market is adjusting itself. Many times you can be the best operator possible, but there's nothing you can do. In 2021 and 2022, the valuation was very different. And the way the market was hit was massive. I think we’re still going to have more issues coming before we're able to get to the other side. But there are other issues plaguing apartment owners and operators, right? Then, on top of that one, you have your oversupply, if you look at Phoenix and Nashville. Colorado is not in a good situation. They're right there in terms of very negative rent growth. It’s not a Texas issue. It's a macroeconomic issue that we're dealing with. How is this oversupply affecting you? I'm going to be talking more about Austin because that's a market we're very familiar with. You have so much new supply, and you need to give a lot of concessions. Then what happens is your marketing starts to get much more expensive , because you really need to fight for that new resident. And you need to find different ways of doing marketing because you need to attract people. So that’s a challenge. What Texas markets are showing the best recovery from oversupply? It’s very, very local. For example, Denton is almost like Austin. If you look in Round Rock, Round Rock might be one of the first to get some positive rent growth ","published_at":1785264482000,"score":22,"tags":["multifamily","texas","trend","institutional"],"heat_signals":["texas","houston","dallas","austin","fed","rent growth"],"importance":3,"selector_reason":"德州高供应市场的承保困难揭示Austin等Sun Belt多户住宅面临的供给和估值压力。该信号来自区域运营者，对市场判断有参考价值，因此评为3分。","section":"sunbelt","title_zh":"Texas 高供给市场承销仍艰难","summary_zh":"Austin 新盘低于重置成本 30%-40%，但 rent 下行拖累现金流","impact":"short-neg","id":"45a316d4","fetched_at":1785290062711},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"The fight to make Florida more affordable","link":"https://www.housingwire.com/articles/the-fight-to-make-florida-more-affordable/","description":"FAMP bac
