h above 4.7% in late July before pulling back several basis points this week on hopes that the U.S. and Iran are nearing a deal to reopen the Strait of Hormuz. Mortgage rates have been slow to follow that pullback, and Friday’s jobs report, next week&#8217;s inflation report, and how the Hormuz talks resolve, will determine whether that gap closes in the coming weeks. Recent mortgage rate volatility makes it a challenging time for homebuyers to navigate the market, especially as this volatility is coming at the upper end of the mortgage rate range we’ve seen over the last year. The best way to navigate the fluctuations is to rate-test your budget, so you know how small changes in mortgage rates will affect your total monthly housing payment. Also, stay close with your lender to take advantage of potential dips in mortgage rates that are likely to occur if talks with Iran yield progress. The bond market’s recent volatility traces back to a Federal Reserve that has been harder to read amid a macro context without a clear policy prescription. At its July meeting, the FOMC held rates steady in a 9-3 vote, but three regional presidents dissented in favor of a hike. The same three members dissented at April&#8217;s meeting too, though that time they agreed with holding rates steady and instead objected to the statement&#8217;s &#8220;easing bias&#8221; language signaling cuts were more likely than hikes. Chair Kevin Warsh has continued to withhold forward guidance, leaving markets to parse incremental data for clues on the Fed’s next move. That’s part of why this week’s Hormuz headlines moved yields as much as they did. With the Fed offering few signals of its own, any news that touches on inflation outlook, including energy prices tied to the Strait of Hormuz, carries outsized weight right now. What does this mean for the housing market? On the housing side, even as mortgage rates sit above year-ago levels for the first time in 44 weeks, the Realtor.com July housing report found median list prices down 2.4% year over year, a ninth straight month of declines. Sellers are still pricing more conservatively from the outset, though price cuts, still just below last year&#8217;s pace, are converging toward it. That convergence is sharpest in the Northeast and Midwest, the same regions Realtor.com coverage of Community Development Block Grants flagged as where new incentives tied to the 21st Century ROAD to Housing Act could matter most, since that&#8217;s where the housing shortage is most acute. Those incentives could end up helping younger buyers most directly: homeownership among those 35 and under fell to 35.2% in Q2, down from 36.4% a year earlier.","published_at":1786032213000,"score":33,"tags":["housing","national","rates","data"],"heat_signals":["fed","fomc","inflation","mortgage rate","30-year fixed","freddie mac","outlook","year over year","housing market"],"importance":5,"selector_reason":"30年固定抵押贷款利率升至2026年高点6.69%，直接影响全美购房需求、可负担性和交易量。该数据是全国住宅融资市场的关键宏观信号，因此评为systemic级别。","section":"national","title_zh":"30Y mortgage 升至2026高点6.69%","summary_zh":"Freddie Mac 30Y rate 周升3 bps，44周来首次高于去年，买方承压","impact":"short-neg","id":"d54733fb","fetched_at":1786066790692},{"source_id":"national-mortgage-news","source_name":"National Mortgage News","source_tier":"A","source_weight":7,"source_tags":["rates","macro"],"region":"national","title":"Warsh's faith in markets sidelines more nuanced Fed policy tools","link":"https://www.nationalmortgagenews.com/articles/warshs-faith-in-markets-sidelines-more-nuanced-fed-policy-tools","description":"Federal Reserve Bank of New York Warsh&#x27;s faith in markets sidelines more nuanced Fed policy tools By Catarina Saraiva and Michael MacKenzie Published August 06, 2026, 4:16 p.m. EDT | Updated August 06, 2026, 4:56 p.m. EDT 5 Min Read Facebook Twitter LinkedIn Email Bloomberg (Bloomberg) -- Kevin Warsh's embrace of financial markets to help the Federal Reserve do its job would mean trading more precise policy tools for a blunt instrument. Processing Content It can work, but it's an inefficient way to bring down too-high inflation and comes with trade-offs, economists and former officials say. Central bankers typically use their benchmark federal funds rate to steer the economy because it allows for a level of fine-tuning that doesn't exist when the market is left to its own devices. And, as then-Fed Governor Jeremy Stein said in a 2013 speech, it \"gets in all of the cracks.\" By raising the overnight lending rate, the Fed can affect a variety of other market rates. \"It's really a question of, does the central bank want to be in control or not?\" said Mark Cabana, head of rates strategy at Bank of America Corp., who previously worked at the Federal Reserve Bank of New York. Bloomberg \"If you rely on the long end of the curve to just do its thing then you don't have control,\" he added. \"You have much less ability to try and bring rates down or exactly calibrate how rates go up.\" Fed officials last week held rates steady in a range of 3.5% to 3.75%. In his second press conference since becoming Fed chairman, Warsh repeatedly highlighted moves in the bond market. \"While at some level we haven't done much in 42 days, the markets have done quite a bit,\" he said, stopping short of an outright endorsement of the rise in Treasuries yields in that period. Warsh plans to stick with his communications strategy even after an abrupt bond market selloff in response to his messaging so far, the Financial Times reported on Thursday, citing people close to Warsh. Warsh acknowledged he's made mistakes since taking up the position of Fed chairman in May, including by not reinforcing his key messages on price stability, according to the newspaper. The Fed chairman would be prepared to raise interest rates in September if inflation data due over coming weeks comes in hot, the FT reported. Leaving markets to do the job of bringing down inflation can stoke levels of volatility or pricing overshoots that unduly damage the economy. A whiff of that was seen in the aftermath of Warsh's briefing, when 30-year bond yields jumped to the highest level in 19 years. Unrestrained by guidance from the Fed chief on how he aims to contain inflation, it could risk getting to levels that wallop the housing market and corporate borrowers. \"Be careful what you wish for,\" as George Catrambone, head of fixed income at DWS Americas, put it. Another scenario: traders may doubt policy action will prove forthcoming, leaving markets misaligned with the settings needed to contain price pressures. That could ultimately force more drastic Fed measures. What Bloomberg Strategists Say: \"Warsh's changes to how the Federal Reserve conducts policy are likely to steepen the Treasury curve further, leaving the front end tied to incoming data while the long end absorbs a growing credibility and supply premium.\" \"If the markets think in order to restrain demand you need to tighten policy and he doesn't do it — he just relies on the markets — the markets are going to take that tightening out,\" said Don Kohn, a former Fed vice chair who advised and worked closely with Alan Greenspan. And that's already starting to materialize. Before Warsh's press conference last week, markets were pricing in about a 70% chance of a rate hike in September. Those odds are now below 60%. Warsh argues that by not providing investors with insight into future Fed policy, they'll then react to incoming economic data without being encumbered by messaging from the central bank. That market reaction will, in turn","published_at":1786047381000,"score":22,"tags":["national","macro","policy","regulator"],"heat_signals":["fed","rate hike","inflation","housing market"],"importance":5,"selector_reason":"文章讨论Warsh对金融市场机制和美联储政策工具的取向，涉及未来货币政策框架及利率决策方式。美联储政策方向会广泛影响抵押贷款、地产融资和资产估值，因此评为systemic级别。","section":"national","title_zh":"Warsh 倚赖市场，Fed 精准工具受限","summary_zh":"若放手长端利率自调，政策校准能力下降，控通胀效率受质疑","impact":"neutral"," ), the Home Equity Lending Integrity Act would amend Section 103 of TILA to define a home equity investment and clarify that these transactions fall under the law&#8217;s mortgage framework. The measure was referred to the Senate Committee on Banking, Housing, and Urban Affairs. If enacted, legislation would require HEIs to comply with the same federal disclosure and consumer protection requirements that apply to many traditional residential mortgages. It also directs the Consumer Financial Protection Bureau (CFPB) to issue regulations that govern enforcement and civil liability for violations that involve HEIs. The bill includes a &#8220;sense of Congress &#8221; provision stating that lawmakers view the amendment as a clarification of existing law rather than a substantive change to how TILA should be administered. Under an HEI, a homeowner receives upfront cash in exchange for a share of the home’s future value. They remain in the property while covering taxes , insurance and maintenance, and they settle when the home is sold or buy back the investor’s stake. The pitch of no monthly payments makes the product appealing to homeowners who can’t or don’t want to take on new debt — particularly those shut out of traditional credit markets. Some have argued that distinction makes HEIs an investment rather than a loan. The proposed legislation would largely resolve that debate under TILA by expressly defining these arrangements as home equity investment loans when they are secured by a home and require repayment based on the property&#8217;s value. Growing market draws scrutiny Demand for HEIs has grown as higher borrowing costs have made traditional financing more difficult for some homeowners. According to the Urban Institute , about 35% of applications for cash-out refinances, home improvement loans and home equity lines of credit were denied in 2024, compared with 9.8% of home purchase loans. About one-quarter of HEI users had credit scores below 600, levels that often make conventional mortgage financing difficult. The research also found that homeowners typically access about 15% of their home&#8217;s value through an HEI, while more than 40% of users are age 55 or older. Between 2015 and 2025, the three largest providers — Point , Hometap and Unlock — originated roughly 54,000 agreements. “The products are becoming more popular for a lot of homeowners. The market is scaling and, as such, that necessarily is going to raise regulatory attention,” said Cliff Andrews, president of the Coalition for Home Equity Partnership . “We welcome the regulatory attention.” But as HEIs have expanded, they&#8217;ve attracted greater legal and regulatory attention. Consumer advocates have questioned whether homeowners fully understand how repayment is calculated and how much they may ultimately owe if their homes appreciate significantly. &#8220;The core issue is a regulatory mismatch,&#8221; Unlock CEO Jim Riccitelli said. &#8220;What’s happening with shared-equity products is what happens in category formation of any new and fast-growing product category. &#8220;Existing rules and regulations weren’t designed for the structure of a shared-equity product, and what we’re seeing is exactly what new financial product category formation looks like: growth, scrutiny, regulatory efforts that are at times flawed and are at times good, and then clearer definition and workable solutions.&#8221; States take different approaches Oversight of HEIs remains uneven across the country as states weigh how to regulate the products. Holly Spencer Bunting, a partner at law firm Mayer Brown , said lawmakers and regulators have","published_at":1786045035000,"score":15,"tags":["housing","national","policy","regulator"],"heat_signals":["fed"],"importance":4,"selector_reason":"参议院法案拟将房屋净值投资纳入联邦住宅贷款和消费者保护框架，可能改变新型住宅金融产品的监管边界。虽然尚属立法提案，但联邦层面的监管变化具有重要政策意义。","section":"national","title_zh":"参议员推动联邦监管 HEI","summary_zh":"新法案拟将 HEI 纳入 TILA mortgage 框架，CFPB 执法加强","impact": ance":3,"_from_fallback":true,"section":"btr","title_zh":"房价下跌市场 accidental landlords 增多","summary_zh":"卖房不易促业主转出租，SFR 供给增加但租金压力也可能上升","impact":"neutral","id":"d237c537","fetched_at":1786066790692},{"source_id":"connect-cre","source_name":"Connect CRE","source_tier":"A","source_weight":7,"source_tags":["mixed-asset","deals"],"region":"national","title":"MSCI: Office Prices Show Signs of Recovery as Industrial, Apartments Lose Momentum","link":"https://www.connectcre.com/stories/msci-office-prices-show-signs-of-recovery-as-industrial-apartments-lose-momentum/","description":"National CRE News In Your Inbox. Sign up for Connect emails to stay informed with CRE stories that are 150 words or less. National + Weekender | August 6, 2026 By: Amy Wolff Sorter MSCI: Office Prices Show Signs of Recovery as Industrial, Apartments Lose Momentum In the years following the pandemic, industrial and multifamily properties were the darlings of commercial real estate investors. Meanwhile, the office sector, weighed down by high vacancy rates and screaming headlines about &#8220;urban doom loops,&#8221; was relegated to the bottom of many investment strategies. That dynamic could be changing. According to MSCI&#8217;s Q2 2026 Real Capital Analytics Commercial Property Price Index , office property prices posted year-over-year gains, as industrial and apartment prices declined. Although the report didn’t indicate an immediate recovery in office markets, it suggested that investor sentiment toward the sector could be improving. Office Shows Signs of Life After years of struggling behind other property sectors, office pricing is showing some positive momentum. The office index increased 2.2% year over year, led by suburban office properties, which rose 3%. Central business district office prices also increased, climbing 1.2%. But the gains carry a caveat. CBD office values remain roughly 50% below their March 2022 peak, compared with suburban office properties, which are about 15% below their July 2022 high. That gap underscores the sector&#8217;s bifurcation and uneven recovery. Industrial Loses Momentum Industrial, one of commercial real estate&#8217;s strongest performers in recent years, began to soften. The index showed that industrial prices declined 0.4% year over year, a sharp reversal from the sector&#8217;s 7.5% annual growth rate in June 2024. However, price movement improved from a 0.7% decline in Q4 2025 to a 0.1% increase in the second quarter of 2026. Apartment Prices Continue to Slide Apartments, which benefited from surging rents and cheaper financing earlier in the cycle, continued to face pressure from slowing rent growth and supply overhang in several markets. The apartment index declined 1.7% year over year in June, marking its 10th consecutive month of annual price declines. Quarter over quarter, prices fell 1.2%, equivalent to an annualized decline of 4.8%. Retail Remains Mixed Retail prices dropped 0.1% from a year earlier, marking a sixth consecutive month of annual declines. But quarterly performance was more encouraging. Prices increased 1.4% from the previous quarter, an annualized pace of 5.7%. The Bigger Picture The report measures changes in commercial property pricing rather than absolute pricing, using metrics that determine market direction rather than value. MSCI also noted that secondary and tertiary markets generally outperformed major urban markets, while performance within property sectors, such as office, remains bifurcated. The second-quarter data suggested that investor attitudes toward office properties may be changing. While the sector continues to face challenges, pricing trends indicate investors’ belief that the worst might be behind them. Read More News Stories About: MSCI Connect Inside The Story MSCI About Amy Wolff Sorter I love content. I love writing it, visualizing it, and manipulating it to fit into different formats. I have years of experience in working with content, both as creator and editor. The content I create and edit provides assistance with many goals, ranging from lead generation, to developing street cred through well-timed thought-leadership pieces. Content skills include, but aren't limited to, articles and blogs, e-mails, promotional collateral, infographics, e-books and white papers, website copy and more. Order Reprints &#9702; Sale/Acquisition &#9702; Economy |Sale/Acquisition |Economy National Apartments|Industrial|Office|Retail|Weekender MSCI: Office Prices Show Signs of Recovery as Industrial, Apartments Lose Momentum Amy Wolff Sorter August 6","published_at":1786050900000,"score":34,"tags":["mixed-asset","national","data","trend"],"heat_signals":["trend","trends","annual","year over year","year-over-year","rent growth","vacancy"],"importance":4,"selector_reason":"MSCI数据显示全国办公楼价格出现复苏迹象，而工业和公寓市场动能减弱，反映主要CRE资产类别正在发生相对轮动。覆盖全国、多资产类别且来自高质量数据源，行业影响达到中等重要性。","section":"cre","title_zh":"MSCI：Office 价格回暖，公寓降温","summary_zh":"Q2 office 价格 YoY 涨2.2%，industrial 和 apartments 动能转弱","impact":"short-neg","id":"1ce7a7cf","fetched_at":1786066790692,"cre_subcategory":"工业"},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Squeezed NYC affordable housing properties face reckoning","link":"https://www.housingwire.com/articles/nyc-affordable-housing-costs-survey/","description":"New York City&#8217;s regulated affordable housing sector is confronting a worsening financial squeeze, and a reckoning is coming unless solutions emerge, according to a new survey of owners, managers, lenders and other industry participants. The survey by affordable housing nonprofit NYC Housing Partnership found that 62% of respondents said operating costs have risen to unsustainable levels. None reported improved financial conditions. &#8220;There is general agreement across various parts of the affordable housing industry – whether it&#8217;s city and state governments, the not-for-profit sector, the for-profit sector – that do-nothing is not an option here,&#8221; Molly Wasow Park, NYC Housing Partnership &#8216;s president and CEO, said in an interview with HousingWire TBD . The survey results dovetail with landlords suing the city over a rent freeze the Rent Guidelines Board approved June 25. Mayor Zohran Mamdani scored a win on a key campaign promise . But landlords sued , and the city faces an August 14 deadline to respond. Though not directly connected, the survey, conducted June 18-26, backs a key landlord argument: that the board did not accurately factor in rising costs. Taxes, water charges, insurance and utilities are much higher now, Deborah Riegel, an attorney with Rosenberg Estis and co-counsel on the lawsuit, told HousingWire TBD . &#8220;We&#8217;re still in an inflationary cycle,&#8221; Riegel said. &#8220;If your income doesn&#8217;t meet your expenses, you&#8217;ve got a problem.&#8221; Rising cost pressures Insurance was the top cost driver, cited by 95% of respondents, followed by utilities, maintenance and repairs and labor. &#8220;This is a cross-cutting issue, not just affecting smaller developers or newer developers or not-for-profits, but really some of the biggest private-sector affordable housing owners in New York are really feeling the pinch,&#8221; Wasow Park said. &#8220;What you have is costs rising faster than rents, rising faster than tenant incomes, and that combination has created what&#8217;s really a perfect storm.&#8221; The survey drew 57 qualifying responses from owners, developers, property managers, lenders, investors and public agencies in the regulated affordable housing sector. More than half of respondents represented portfolios of at least 1,000 units. Financial distress was widespread among respondents. Sixty-one percent said their portfolio&#8217;s financial health had deteriorated over the prior six months, while none reported improvement. In addition, 81% said at least 10% of their portfolio was financially stressed, and 39% said more than one-quarter faced financial stress. Economic distress Rent collection, rather than physical occupancy, emerged as a central concern. While 57% of respondents reported physical occupancy above 95%, only 5% said they collected more than 95% of gross potential rent. Nearly half reported economic occupancy – – rent actually collected – below 90%. &#8220;People are having a very hard time collecting rent, and I really believe that the reason rent collection is suffering is that resident incomes are also struggling,&#8221; Wasow Park said. &#8220;That is particularly in lower-wage jobs, the kinds of jobs that many people in affordable housing hold. Wages have stagnated or even fallen.&#8221; She said the dynamic complicates the political debate over rent increases, with landlords and tenants alike struggling. &#8220;The direction that we need to go is not continuing to pit landlords against tenants but really look for ways that we can support both the owners of the properties and the people who live in them,&#8221; Wasow Park said. Respondents identified rental subsidies at scale, insurance-market solutions, tenant-arrears assistance and debt restructuring or recapitalization tools as the most helpful interventions. From the landlord perspective, 74% anticipated needing to recapitalize at least one property within three years. Separately, 77","published_at":1786047616000,"score":20,"tags":["multifamily","nyc","distress","trend","landlord"],"heat_signals":["inflation","occupancy"],"importance":4,"selector_reason":"纽约受监管保障性住房面临运营成本不可持续的财务压力，62%的受访者确认问题已达到严重程度。该问题关系大量保障性住房资产的运营、融资和政策处置，具有重要区域监管和市场影响。","section":"cre","title_zh":"NYC affordable housing 成本挤压加剧","summary_zh":"62%受访者称运营成本不可持续，租金冻结诉讼强化 landlord 压力","impact":"short-neg","id":"d0025ff9","fetched_at":1786066790692,"cre_subcategory":null},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Are data centers the next constraint on affordable housing supply?","link":"https://www.housingwire.com/articles/data-centers-housing-supply/","description":"[Editor’s note: This is part 2 of a 3-part HousingWire special series on the impacts of data centers in housing. Part 1 is here .] In 1998, when Steve Alloy succeeded his father, Martin, as president of Northern Virginia-based Stanley Martin Homes , buying land wisely was, as it is now, both a point of pride and a business necessity. A cardinal rule of engagement and survival, as any homebuilder competing in the NVR- and Ryan Homes-dominated Mid-Atlantic region knew, was to counterpunch on land acquisition rather than compete head-to-head with the nation&#8217;s most efficient and profitable public homebuilder. Being able to &#8220;zag&#8221; when NVR &#8220;zigged&#8221; meant getting good at finding residential development locations that NVR land strategists would regard as too &#8220;hairy,&#8221; too time-consuming, or too fraught with engineering, permitting, or zoning complexities to fit into NVR&#8217;s hyper-efficient, asset-light land take-down system. &#8220;We pursue different sites many more times than our national competitors do, just because our strategies are different,&#8221; Alloy told HousingWire/ TBD . &#8220;We see many of them on a variety of sites, but in a lot of places, we would be kind of the go-to home builder on a difficult zoning case.&#8221; For Alloy and his growing team, as part of Japan-based Daiwa House &#8216;s decade-long investment in building a top-tier U.S. homebuilding platform, that &#8220;secret sauce&#8221; – detecting opportunity where competitors see operational complexity – suddenly took on a completely different dimension in late 2025. Business partners approached Stanley Martin about a 189-acre tract the builder had painstakingly assembled, engineered and entitled for a 516-home community. The prospective buyer wasn&#8217;t another homebuilder. It was Amazon , which wanted to reverse years of residential entitlement work, rezone the property for industrial use, and build a hyperscale data center campus instead. Stanley Martin had invested roughly $51 million in the property. The transaction ultimately generated roughly $700 million. For Stanley Martin and Daiwa House, it was a once-in-a-career capital allocation windfall . For the homebuilding industry and the nation’s wider housing ecosystem, however, the deal immediately raised a more unsettling question. If the world&#8217;s largest technology companies are prepared to spend hundreds of millions – even billions – of dollars securing land for artificial intelligence infrastructure, what happens to an industry already struggling to acquire residential land cheaply enough to build homes that American households can afford? Artificial intelligence has triggered one of the largest capital investment races in modern business history. The Bank for International Settlements estimates hyperscaler capital expenditures alone will exceed $700 billion this year, with aggregate AI infrastructure investment expected to climb into the trillions over the coming years as companies compete to secure computing capacity before their rivals do. Those investment dollars translate into an unprecedented wave of data center development across the United States. Local governments are debating zoning ordinances. Electric utilities are racing to expand transmission capacity. Communities are wrestling with questions about water consumption, tax revenues, noise, environmental impacts and electrical reliability. Realtors are beginning to see pricing distortions in neighborhoods located near proposed campuses, themes explored in HousingWire&#8217;s earlier Part I analysis . For homebuilders, though, the issue is different. The question isn&#8217;t whether AI infrastructure is reshaping commercial real estate. It&#8217;s whether hyperscale developers are poised to become the next structural obstacle to market-rate homeownership affordability. The answer, at least based on today&#8217;s evidence, appears considerably more nuanced than much of the current politic","published_at":1786051028000,"score":15,"tags":["data-center","national","construction","trend","homebuilder"],"heat_signals":[],"importance":4,"selector_reason":"文章分析数据中心建设对住房土地、供给和可负担性的潜在挤压，涉及多个数据中心集中发展的全国性住房约束。该议题连接基础设施投资与住宅供给，行业影响高于普通项目新闻。","section":"cre","title_zh":"Data centers 或挤压 affordable housing 供给","summary_zh":"土地、电力和审批竞争升温，住宅开发可行性受压，builder 成本上行","impact":"short-neg","id":"375446f9","fetched_at":1786066790692,"cre_subcategory":"数据中心"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Portman&#039;s Ten Twenty Spring Nabs Refinancing: The Atlanta Deal Sheet","link":"https://www.bisnow.com/news/atlanta/deal-sheet/portman-ten-twenty-spring-nabs-278m-refinancing","description":"Portman secures a $278M refinancing for Ten Twenty Spring tower, home to EY & Reed Smith.","published_at":1786053019000,"score":14,"tags":["office","atlanta","deals","developer"],"heat_signals":[],"importance":4,"selector_reason":"Portman为亚特兰大Ten Twenty Spring办公楼获得2.78亿美元再融资，金额超过2亿美元。该交易能反映办公楼融资市场和资产再定价状况，达到中等行业重要性。","section":"cre","title_zh":"Portman Atlanta office 获$278M refi","summary_zh":"Ten Twenty Spring tower 完成$278M refinancing，优质 office 融资仍可行","impact":"long-pos","id":"9b3a87e0","fetched_at":1786066790692,"cre_subcategory":null},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"NYC expands finance pool for office-to-residential makeovers","link":"https://www.housingwire.com/articles/nyc-office-residential-financing/","description":"New York City administration officials took a stride toward spurring more office-to-residential conversions by expanding a long-term ws that local markets are responding differently. For the week ending July 31, the national overall active median for single-family homes stood at $449,000, barely down year over year, slipping just 0.4% from $451,000. The median price of homes newly listed that week was $419,900, up 1.2% from $415,000 a year ago. HousingWire Data found the pattern in 71 of the 298 metro areas analyzed, or nearly one in four U.S. metros. It appeared across every major region. The national breakdown Across the 298 metros analyzed, four pricing patterns emerged. Another 24 markets remained essentially flat. Among the metros analyzed, 85 recorded year-over-year increases in both measures, while 77 recorded declines in both. In 41 metros, the overall active median increased while the new listing median declined. Another 24 markets were classified as flat. The 71 metros at the center of this analysis show the opposite relationship. Their overall active medians declined while new listing prices increased, indicating that homes entering the market today are being priced differently from the broader inventory already competing for buyers. Nashville, Buffalo and Milwaukee each illustrate a different version of the same national pricing pattern. Nashville shows the divide among active, new and pending inventory Nashville-Davidson-Murfreesboro-Franklin, Tenn., provides one of the clearest examples of the divergence between the broader active market and homes entering the market today. The overall active median in Nashville stood at $589,945 for the week ending July 31, down 1.5% from $598,900 a year ago. The median price of newly listed homes was $549,900, up 4.7% from $525,000. That divergence has now persisted for 10 consecutive weeks. New listings remain approximately $40,000 below the overall active median, showing that homes entering the market today are being priced differently from the broader inventory already competing for buyers. Days on market helps explain why. Nashville&#8217;s average days on market exceeded the median by 43 days, a gap that has held near that level for three consecutive weeks. Older listings continue to linger, giving them greater influence on the overall active median even as new listings enter at lower price points. The pending-list data adds a third signal. The median list price of homes newly moving to pending was $522,445, approximately $27,500 below the new listing median and roughly $67,500 below the overall active median. Together, the three measures show that new listings enter below the broader active inventory but above the price level where homes are now attracting contracts. Nashville&#8217;s overall active median remained approximately $40,000 above the new listing median and roughly $67,500 above the median list price of homes newly moving to pending. Buffalo shows the pattern in reverse Buffalo-Niagara Falls, N.Y., shows the sa","published_at":1786029310000,"score":24,"tags":["housing","national","data","trend"],"heat_signals":["mortgage rate","year over year","year-over-year","housing market"],"importance":3,"selector_reason":"文章指出全国在售房源中位价与新挂牌房源中位价出现不同方向，揭示卖方定价和库存结构的变化。该信号涉及全国住宅市场，但数据影响主要属于常规趋势层面。","section":"national","title_zh":"全国 median price 掩盖新挂牌信号","summary_zh":"Active median 为$449K微跌0.4%，新挂牌 median $419.9K涨1.2%","impact":"neutral","id":"779ed969","fetched_at":1786066790692},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Rocket weathers spring housing slowdown, gaining purchase and refi share in Q2","link":"https://www.housingwire.com/articles/rocket-q2-2026-earnings/","description":"Rocket Companies reported high second-quarter earnings on Thursday, driven by increased mortgage origination volume, servicing income and record market share gains in both purchase and refinance lending, even as the broader housing market remained challenging. The Detroit-based lender reported Q2 2026 net rishna said. &#8220;Those gains really matter today, and they matter even more as the market recovers.&#8221; Rocket also sold $53 billion in mortgage servicing rights during the quarter, generating $795 million in proceeds while retaining subservicing and recapture rights on nearly 80% of the loans. “Today, Rocket is both the nation’s largest mortgage servicer and the nation’s largest mortgage lender. Very few companies have both,&#8221; Krishna added. Other highlights, looking ahead Krishna said during the call that Rocket&#8217;s purchase market share increased to 6.2%, up from 5.5% at the end of 2025, while its refinance market share rose to 14.3% from 12.2%. The company also completed the integration of its servicing platform following its acquisition of Mr. Cooper , saying legacy Mr. Cooper recapture rates reached another record during the quarter. The company cited continued investments in artificial intelligence , saying loan officers using its AI-powered pipeline management tools are handling nearly 40% more clients than a year ago. Rocket also said its AI Voice platform processed more than 1 million inbound servicing calls within three months of launch, with more than half of those calls resolved without assistance from servicing employees. The company also highlighted growth in its home equity business, saying it became the nation&#8217;s largest home equity lender and has helped more than 250,000 homeowners access $24 billion-plus in equity since introducing the product in 2022. Krishna told investors during the call that Rocket is the first independent mortgage company to lead the category. Meanwhile, Redfin , which Rocket acquired in 2025 , doubled its","published_at":1786052127000,"score":24,"tags":["housing","national","earnings","lender"],"heat_signals":["forecast","year-over-year","housing market"],"importance":3,"selector_reason":"Rocket二季度收入达到27.8亿美元，并在购买和再融资业务中扩大市场份额，显示头部贷款机构仍在逆势增长。公司业绩和市场份额变化具有行业参考价值，但未达到系统性冲击程度。","section":"national","title_zh
