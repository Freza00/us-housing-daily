nnual rate of 532,000, following a nearly 40% plunge month earlier. Single-family starts, however, declined 0.2%, slipping again after a generally slow spring season for builders. The rebound in multifamily construction underscores the volatile nature of monthly housing numbers, especially among apartments. Still, high prices and mortgage rates — factors that have been weighing on demand for single-family homes — could also be supporting apartment demand. Single-family homebuilders, meanwhile, have generally been confronting elevated inventory and weak demand. That's forced many to use to sales incentives to attract buyers. Looking ahead to future construction, overall building permits decreased 3% to the lowest since March. Permits for one-family homes dropped to a 10-month low, and multifamily applications also declined. READ MORE: Short sales yield 9% more than foreclosures now The recently passed 21st Century Road to Housing Act could help builders in the long term, especially developers of build-to-rent communities and makers of factory-built housing, Bloomberg Intelligence analyst Drew Reading said in a note this week. However, it isn't expected to improve things much in the near term, he said. Prior to the report, the Federal Reserve Bank of Atlanta's GDPNow forecast showed residential investment making only a marginal contribution to second-quarter gross domestic product. Housing starts rose across the US. In the South, the nation's biggest homebuilding region, they increased 15.2%, driven by multifamily construction. Building in the Midwest reached the highest since 2024. The new residential construction data are volatile, and the government report showed 90% confidence that the monthly change ranged from a 3.1% gain to a 34.9% jump. Michael Sasso Bloomberg News","published_at":1784302694000,"score":33,"tags":["multifamily","national","data","construction","regulator"],"heat_signals":["build-to-rent","fed","mortgage rate","housing starts","permits","forecast","annual","housing market","housing starts"],"importance":5,"selector_reason":"美国6月新屋开工年化大增19%，且由多户建设反弹驱动，是影响住宅供给、租赁市场和利率预期的全国性核心数据。按标准属于关键住房宏观数据，评为imp=5。","section":"national","extended_window":true,"title_zh":"June housing starts 靠 multifamily 大幅反弹","summary_zh":"新屋开工环比增19%至1.43M；multifamily 暴增76%，single-family 仍弱","impact":"short-pos","id":"da84f45c","fetched_at":1784511766364},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"What the ROAD to Housing Act can — and can't — do for affordability","link":"https://www.housingwire.com/articles/what-the-road-to-housing-act-can-and-cant-do-for-affordability/","description":"The 21st Century ROAD to Housing Act is now law, marking what many in the housing industry consider the most significant federal housing legislation in more than three decades. The bipartisan measure aims to increase housing supply by reducing regulatory barriers, streamlining permitting, modernizing federal housing programs and expanding opportunities for homeownership. Supporters say it lays the foundation for addressing the nation&#8217;s long-running housing shortage . But even many of the bill&#8217;s strongest advocates acknowledge that increasing supply alone will not solve today&#8217;s affordability crisis. Mortgage rates remain elevated, home prices continue to set records and the incomes of many American households have failed to keep pace with the rising cost of homeownership. Mike Miedler , president and CEO of Century 21 , called the legislation a landmark achievement but said its benefits will take time to materialize. &#8220;I don&#8217;t say this lightly: This is the most consequential housing law in over three decades,&#8221; Miedler told HousingWire . &#8220;Our agents see the inventory crisis play out in real time, in every market, every single day. We see what the shortage actually does for the first-time buyer who gets outbid three times and gives up, the young family that keeps renting because nothing in their range ever hits the market. That&#8217;s who this is for.” Miedler also cautioned that the bill provides little relief on today&#8217;s affordability front while setting up future opportunities on the supply side. &#8220;Lower rates would allow those with current 3% to 4% rates to consider selling, creating more inventory on the market,&#8221; he said. &#8220;More buyers would also emerge. In the short term, the increased supply may be absorbed quickly and affordability remains a challenge.&#8221; Many economists agree that housing supply is a critical part of the solution. But they also point to borrowing costs, construction expenses, insurance premiums and property taxes and as significant contributors to today&#8217;s affordability challenges. Pamela D&#8217;Arc, a Compass agent based in New York City , said the inventory shortage continues to make itself felt in her market. &#8220;There are more buyers than there are apartments and inventory, and it&#8217;s pushing the prices way up now,&#8221; D&#8217;Arc said. &#8220;A turnkey apartment, unless it&#8217;s priced ridiculously high, is literally coming in with multiple bids on just about everything I&#8217;m seeing. We just had six offers on a rental and it wasn&#8217;t priced low.&#8221; She said some of the inventory shortage stems from homeowners who are reluctant to sell due to their mortgage rates. &#8220;Some of it is due to mortgage rates that people have and don&#8217;t want to give up,&#8221; D&#8217;Arc said. &#8220;I have clients who said we want to move to a different neighborhood for our commuting time, but our very low mortgage doesn&#8217;t run out until November, so we need to time it because we&#8217;re not giving that up early.&#8221; Joy Silver, chief strategy officer at the Community Housing Opportunities Corp. — a California -based nonprofit — said the bill does little to address the fundamental economic reality facing low-income households. &#8220;The hardest part for any developer is the gap financing, right between the equity and the long-term financing,&#8221; she said. &#8220;In order to get that thing going, now you&#8217;ve got 75% of the money you have to find, and who&#8217;s going to be able to find that money at an affordable rate? So basically, what have we done? We&#8217;ve given banks better ways to make more money. &#8220;The most positive piece of this legislation is that it happened at all. Politicians and Congress wanted to let people know they could still do something together.” Rare moment for federal housing policy Comprehensive federal housing legislation has been relatively rare over the past several ","published_at":1784320483000,"score":14,"tags":["housing","national","policy","regulator"],"heat_signals":["fed","mortgage rate"],"importance":5,"selector_reason":"21st Century ROAD to Housing Act已经成为法律，涉及供给、审批、联邦住房项目和购房机会，是多年罕见的全国住房立法变化。按标准属于重大联邦住房政策变动，评为imp=5。","section":"national","extended_window":true,"title_zh":"ROAD to Housing Act 难立刻压低房价","summary_zh":"新法主打扩供给和简化审批；mortgage rate 与高房价仍限制 affordability","impact":"long-pos","id":"a3127997","fetched_at":1784511766364},{"source_id":"inman","source_name":"Inman News","source_tier":"A","source_weight":8,"source_tags":["housing","brokerage"],"region":"national","title":"Inflation Cooled in June. What Does it Mean for Mortgage Rates? - Inman Real Estate News","link":"https://news.google.com/rss/articles/CBMimwFBVV95cUxQZmt3QzMxQ2tySGl5YWxoQ0s5NkM5NVh2dnh6bjlfQjlVNjh4dzZBMHdYMWUwWTZZb3Z0cWZiVTJjbjBXUmEzZTRMc09mT3N3SWp6TmVWZF9rTDh5VUZjV3h0ZUJuWUlnc1ZjMkEySVlQaHJ0U19CMEh4M09SdVpaczA1MVdQX2dsRGIyWTFOLUV1cGMwX2pmUGJKaw?oc=5","description":"Inflation Cooled in June. What Does it Mean for Mortgage Rates? &nbsp;&nbsp; Inman Real Estate News","published_at":1784046379000,"score":12,"tags":["housing","national","macro","rates"],"heat_signals":["inflation","mortgage rate"],"importance":5,"selector s nationwide fund safety work. Challenges in condo construction California lawmakers have wrestled with housing affordability for years. Since the COVID-19 pandemic, they&#8217;ve focused on reducing regulatory barriers while pushing local governments toward zoning reforms designed to increase housing density and variety. Housing advocates have targeted condos because so few have been built over the past two decades. They blame litigation and insurance costs tied to defect liability. Research backs the claim. Condo construction has collapsed in Los Angeles since its 2005-06 peak, according to a 2024 study published by the Terner Center for Housing Innovation at the University of California at Berkeley. Starts fell from more than 8,000 units per year to a level that never recovered after the Great Recession, a trend repeated across the state&#8217;s major metro areas. Defect liability litigation and insurance costs are a major factor, adding an estimated $8,100 to $18,300 per unit in hard costs on a typical Los Angeles project, a Terner Center follow-up study found. Researchers say liability isn&#8217;t the only culprit, but it&#8217;s significant enough that many developers have simply switched to building apartments instead. Fixing the law AB 1903 cleared the state Senate Judiciary Committee with amendments that narrowed its scope after pushback from consumer advocates. The bill originally proposed a &#8220;certified building&#8221; process, letting builders hire private inspectors to certify a project while locking in a nonchallengeable status with builder-controlled repair and claims procedures. The author agreed to strike that framework from the bill. Other changes softened, rather than eliminated, some of the bill&#8217;s more aggressive provisions. Instead of barring recovery of investigative costs and extrapolated claims outright, the amended bill limits investigative costs unless builders get 21 days&#8217; notice and a chance to attend testing. A proposed mandatory motion to dismiss for noncompliant claim notices became discretionary, leaving it to judges rather than being automatic. The bill&#8217;s author also agreed to drop a requirement that claimants prove a defect caused damage to another building component. The bill instead will revise defect performance standards on a forward-looking basis. The amended bill still must clear another committee and return to the General Assembly for approval. Related More: California Housing Inventory","published_at":1784323146000,"score":13,"tags":["housing","california","policy","regulator"],"heat_signals":["trend"],"importance":4,"selector_reason":"加州公寓施工缺陷责任法案可能改变开发商维修责任和公寓供给激励，对美国最大住房市场之一有实质影响。属于重要州级监管政策，评为imp=4。","section":"national","extended_window":true,"title_zh":"California condo 缺陷责任改革待表决","summary_zh":"AB 1903 拟给开发商 right-to-repair，降低诉讼风险并支持 condo 供给","impact":"long-pos","id":"8a2c6272","fetched_at":1784511766364},{"source_id":"national-mortgage-news","source_name":"National Mortgage News","source_tier":"A","source_weight":7,"source_tags":["rates","macro"],"region":"national","title":"Should lenders prepare for mortgage rates moving even higher?","link":"https://www.nationalmortgagenews.com/news/should-lenders-prepare-for-mortgage-rates-moving-even-higher","description":"The 30-year fixed rate loan average is at its highest since August, while the 15-year is now above where it was one year ago, Freddie Mac found.","published_at":1784221402000,"score":13,"tags":["housing","national","rates","lender"],"heat_signals":["mortgage rate","30-year fixed","freddie mac"],"importance":4,"selector_reason":"30年固定抵押贷款利率升至去年8月以来最高，直接影响全国购房负担能力、交易量和再融资活动。虽非Fed决策，但属于全国房贷利率重要拐点信号，评为imp=4。","section":"national","extended_window":true,"title_zh":"Lenders 面临 mortgage rate 再上行风险","summary_zh":"30Y fixed 升至去年8月来高位，15Y 已高于一年前，loan demand 承压","impact":"short-neg","id":"91930e5e","fetched_at":1784511766364},{"source_id":"google-news-sunbelt","source_name":"Google News — Sun Belt Housing Marke ily Housing Council’s Top 50 to find Morgan Properties. In 2016, the Conshohocken, Pennsylvania-based firm sat at No. 35 with 32,384 units. But over the last decade, Morgan has been on one of the strongest growth trajectories among multifamily owners. This year, it moved into the No. 2 slot with 110,475 apartments. As the company has grown, it has still maintained its original DNA as a workforce housing provider. “The company was founded in 1985 by Mitch Morgan, and he bought his first property, which we still own today, here in the suburbs of Philadelphia,” Chief Operating Officer Greg Curci told Multifamily Dive. “When he bought that property, that property itself was like 20 years old.” Roughly 55% of Morgan’s portfolio is 1960s- or 1970s-vintage, and the median household income of its residents is slightly under $75,000, according to Curci. “We have always gone after things that require maybe a lot of capital to reposition a property or cure deferred maintenance issues, and likewise, where the operations may not have been as sound as they could be,” Curci said. “We’re accustomed to dealing in the workforce housing space and that commitment has never wavered.” But 20% of Morgan’s portfolio comprises newer properties. “We have nine different joint venture partners that we acquire assets with,” said Curci, who joined the firm in 2019. “They all have different appetites.” Here, Curci talks with Multifamily Dive about Morgan’s investment strategy, apartment turnaround strategies and distressed buying opportunities. This interview has been edited for brevity and clarity. MULTIFAMILY DIVE: Despite near-term economic concerns and oversupply in some markets, Morgan is still buying properties. What is behind that strategy? GREG CURCI: We're always active on the acquisition side. We tend to have a longer time horizon. We're not a fund that has urgency to invest the equity and then return it within five years. Most of our partners are pretty aligned with us on a very long-term hold. Greg Curci Permission granted by Morgan Properties From an underwriting standpoint, we typically think in terms of a 10-year hold. That is how we model. We'll do a five-year, just as a gut check, but in many instances, we will hold much longer even than 10 years. When you have that time horizon to look out upon, it takes some of the pressure off of having to really time the entry point perfectly. Does the longer-term hold help you take on more intense turnaround projects? We're comfortable acquiring and improving the types of assets that intimidate some others. By that, I mean we buy properties with 1,000 units. We bought one that was 2,000 units. These are large assets. Not everybody has the operating capability or the stomach to do that or to reinvest those capital dollars needed to upgrade and maintain properties of that size and age. We buy things that have unstable operations. We buy things that are in the 80%s occupancy-wise and have a lot of deferred maintenance. We recognize it will take quite a while to change the trajectory of those assets, but we are patient in that respect. Do you also have flexibility in the markets you’ll buy in? We are also not shy about entering more secondary and tertiary markets. Others in the space have a mandate to really articulate their investment strategy and say, ‘We're going into these 10 primary markets based on job growth or population growth or incomes,’ and they just target that. We target m","published_at":1784304402000,"score":13,"tags":["multifamily","deals","distress","institutional"],"heat_signals":["occupancy"],"importance":3,"selector_reason":"Morgan Properties作为大型公寓业主持有和收购策略具有机构租赁市场参考价值，尤其涉及复杂和潜在困境资产。该文是公司策略层面的常规动态，评为imp=3。","section":"institutional","extended_window":true,"title_zh":"Morgan Properties 谨慎筛选 distressed 收购","summary_zh":"其持有110,475套跃居第2，仍看 workforce housing，但回避低质 distress","impact":"long-pos","id":"5ea3b8ab","fetched_at":1784511766364},{"source_id":"cnbc-realestate","source_name":"CNBC Re ing. A representative for Newrez/Shellpoint told HousingWire that &#8220;as a matter of policy, we do not comment on ongoing litigation. We will address any claims through the appropriate legal process.&#8221; Urling alleges that the &#8220;repeated pattern of mortgage servicing misconduct&#8221; resulted in violations of the federal Real Estate Settlement Procedures Act ( RESPA ) and its implementing Regulation X , as well as the New Jersey Consumer Fraud Act and state common law. Among the allegations, Urling claims Shellpoint issued a reinstatement noticed dated June 22, 2026, but she did not receive it until about June 30, leaving only one day before the July 1 payment deadline. She contends the timeline did not provide a reasonable opportunity to obtain and transmit the funds needed to reinstate the loan. Urling claims to have submitted multiple loss-mitigation applications, notices of error and requests for reconsideration in an effort to reinstate or modify her mortgage. She also alleges that Shellpoint &#8220;repeatedly failed&#8221; to provide timely or adequate responses and continued foreclosure activity while these requests remained unresolved. The complaint also alleges the company failed to provide a written explanation about the denial of a change-of-circumstances request, which included a proposed $50,000 contribution toward resolving the default. Urling claims Shellpoint provided &#8220;conflicting, inconsistent, incomplete and changing communications&#8221; about her mortgage account, reinstatement figures and foreclosure alternatives, while simultaneously pursuing foreclosure proceedings. She also alleges the company&#8217;s actions caused increased interest, servicing fees, escrow advances, foreclosure-related expenses and other financial losses. Among the claims, Urling said that the dispute disrupted a home-based business she has operated since 1998, resulting in lost income, business opportunities and reputational harm, as well as emotional di
