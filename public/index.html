y note and subordinate mortgage. “The RAP will reduce the burden on mortgagees in obtaining and recording the notes and subordinate mortgages and align with standard industry practice,” FHA states in a Mortgagee Letter. According to the FHA, the structure would also facilitate the &#8220;sale, refinance, assumption and transfer processes&#8221; as there will no longer be a subordinate lien to resolve, removing challenges associated with nonjudicial foreclosures. From the borrower’s perspective, the loss-mitigation experience is designed to look the same, the letter states. The advance remains a zero-interest obligation that is generally due only at maturity, sale, refinance, payoff , or termination of FHA insurance. Borrowers could make partial or full payments toward the RAP balance at any time without penalty. The draft also introduces a RAPTOR Plan (RAP Terms of Repayment) for borrowers who cannot repay the entire balance in a lump sum when the mortgage matures. Under the proposal, servicers could offer repayment terms up to 18 months for RAP balances up to $5,000; up to 36 months for balances between $5,000 and $15,000; and up to 48 months for balances over $15,000 For servicers, the most significant operational shift is the removal of subordinate-lien mechanics. The RAP structure eliminates the need to prepare, execute, record and deliver separate partial claim notes and mortgages in HUD’s name, bringing FHA workouts closer to how many conventional investors handle similar advances. The draft states that all mortgagees would be eligible to participate. Participation would be voluntary and servicers would not need to use RAP on every partial claim. The demonstration is expected to run for five years. FHA is proposing incentive fees of $500 for a partial claim RAP and $1,750 for a payment supplement RAP, along with reimbursement of up to $250 for required title-related expenses. This article was written by Flávia Furlan Nunes and generated with the assistance of ing to HUD’s release. He solicited a bribe from a contractor managing lumber, inflated the value of the contract and then allowed that lumber to rot, rendering it unusable. In March, Richardson was sentenced to 36 months in prison for using his position “to engage in a series of fraudulent and self-dealing transactions for his personal financial gain,” according to a press release from the Justice Department. VIHFA said in its release that it recognizes the importance of accountability, transparency and responsible stewardship of federal resources, and it will provide any information HUD requests. “While the correspondence references findings from prior years, many of the issues identified have already been the focus of significant corrective actions taken by the Authority in recent years to strengthen internal controls, improve operational procedures, and enhance compliance with federal requiremen","published_at":1784666760000,"score":17,"tags":["housing","national","regulation","regulator"],"heat_signals":["fed"],"importance":4,"selector_reason":"HUD因腐败和资金管理问题暂停维尔京群岛住房灾后恢复资金，涉及19亿美元项目资金。联邦住房资金监管和大规模灾后住房建设均受到直接影响，重要性高于一般地方项目。","section":"national","title_zh":"HUD暂停Virgin Islands住房拨款","summary_zh":"HUD称$1.9B灾后资金仅不到20%项目交付，因管理失当暂停拨款","impact":"short-neg","id":"185ee6ef","fetched_at":1784683029152},{"source_id":"redfin-news","source_name":"Redfin News","source_tier":"A","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"U.S. Home Prices Rose 0.3% From a Month Earlier in June","link":"https://www.redfin.com/news/home-price-index-june-2026/","description":"Home Sellers Outnumber Buyers 2 to 1 in Miami, Nashville, and Much of Texas, The Nation’s Strongest Buyer’s Markets","published_at":1784635223000,"score":13,"tags":["housing","national","data"],"heat_signals":["texas"],"importance":4,"selector_reason":"美国房价在6月环比上涨0.3%，同时迈阿密、纳什维尔和德州多地卖家数量明显超过买家。全国价格变化叠加Sun Belt买方市场扩散，构成重要住宅市场转折信号。","section":"national","title_zh":"6月美国房价环比上涨0.3%","summary_z llion in the first quarter. Total equity climbed higher from $14.62 trillion in the prior three-month period, the two companies said in their latest jointly produced quarterly analysis. The previous amount had signaled a slight pullback quarter over quarter. Meanwhile, on a year-over-year basis, the latest number jumped more than 7% higher from $13.91 trillion in the first quarter of 2025. \"The rebound in senior housing wealth is encouraging news for older homeowners and underscores the important role home equity continues to play in retirement security,\" NRMLA President Steve Irwin noted in a press release. The first quarter's upturn came on the back of a $314.8 billion leap in senior-held property values between January and March. The number reflected 1.8% growth from fourth-quarter 2025 but was offset by a 0.4% rise in senior mortgage debt, representing $10.5 billion. Higher home equity levels arrived in tandem with drops in mortgage rates in January and February, which briefly bottomed out to a more than three-year low , Riskspan said. Improving affordability conditions propped up the home values of seniors, while their rate of debt accrual slowed, the data intelligence provider noted . \"With senior home equity reaching another record level, many older Americans have greater financial flexibility to help address rising living expenses, healthcare costs or other retirement needs,\" Irwin said. Changing needs of older homeowners The rapid acceleration of senior equity levels, which three years ago stood at just $11.62 trillion, comes as an overwhelming majority of homeowners express a preference for aging in place. In research conducted by the likes of Freddie Mac and Northwestern Mutual this decade, baby boomers, in particular, indicated they planned to stay in their homes to take advantage of the financial security and familiar comforts. A 2024 Northwestern Mutual study found 84% of baby boomers expecting to remain in their properties, while more than 70% of roperties represent about $3.1 billion in total asking price. The ROAD to Housing Act defines institutional investors as owners of 350 or more single-family homes — well below the industry&#8217;s traditional benchmark of 1,000 homes. While the law does not require investors to sell existing properties, it restricts future purchases of existing homes while allowing exceptions for categories including build-to-rent developments. Parcl Labs estimates investors covered by the law own roughly 589,000 homes, or 3.9% of the nation&#8217;s approximately 14 million single-family rental homes. Those firms account for about 40% of net selling by large institutional investors so far this year, researchers said. Still too early to tell with national inventory Despite the surge in investor listings identified by Parcl Labs, Mike Simonsen, chief economist at Compass , said the trend has yet to noticeably affect most housing markets. &#8220;I&#8217;ve been tracking inventory and it has been flat across the country,” he told HousingWire. “So, we haven&#8217;t seen a giant flood to move the needle nationally. And if you think about it, the number of homes that institutional investors own is still pretty small overall.&#8221; Instead, Simonsen expects any meaningful changes to occur in markets where institutional landlords have amassed particularly large portfolios . &#8220;It could be a place like Tampa or maybe suburban Atlanta where there has been some density,&#8221; he said. &#8220;I haven&#8217;t seen an uptick in a place like Tampa myself, and maybe that&#8217;s just because overall the actual numbers are pretty small on that side. Right now, Tampa has significantly fewer homes available than a year ago.&#8221; According to Parcl Labs and multiple other sources, Atlanta has far and away the highest density of institutional investor single-family homeownership — roughly doubling No. 2 Dallas-Fort Worth. The top six metros — Atlanta, Dallas-Fort Worth, Phoenix, Charlotte, Houston and Tampa — account for 36.8% of all homes owned by institutional investors with portfolios exceeding 1,000 homes. Large-scale institutional ownership emerged after the 2008 housing crash, when private equity firms purchased thousands of foreclosed homes in markets including Atlanta, Phoenix and Las Vegas Today, the nation&#8217;s largest landlords — Progress Residential , Invitation Homes , AMH , Tricon , FirstKey , Amherst and VineBrook — have sold 3,180 more homes than they have purchased since Jan. 1, according to CNBC. They still collectively own roughly 400,000 homes. VineBrook has reportedly been the most aggressive seller, with nearly 1,900 homes — about 10% of its portfolio — currently listed for sale with a combined asking value of $285 million. Will owner-occupant buyers benefit? Whether more institutional listings and other effects felt from the ROAD to Housing Act translate into additional homeownership opportunities remains an open question. &#8220;I am suspicious that it really moves the needle for owner occupants,&#8221; Simonsen said. &#8220;Those people that were in those homes are renters not because they wanted to be, but generally because they can&#8217;t buy. It&#8217;ll be interesting to see what trend emerges. Does that go from an institutional investor to another investor and stay as an investment property? “I think that&#8217;s probably a pretty common path for those getting unloaded. You go from an investor that owns 1,000 properties to one that ow","published_at":1784669314000,"score":54,"tags":["btr-sfr","national","policy","institutional"],"heat_signals":["build-to-rent","single-family rental","invitation homes","amh","tricon","progress residential","houston","dallas","fort worth","trend","housing market"],"importance":3,"selector_reason":"机构投资者在住房法案通过后增加单户出租房出售，反映住宅租赁资产配置正在调整。影响目前可能局部化，因此属于常规市场动态而非全国性拐点。","section":"btr","title_zh":"ROAD法案后机构加速挂牌SFR","summary_zh":"机构挂牌从4,166套增至9,447套、要价约$3.1B，但全国库存影响仍有限","impact":"short-pos","id":"f0
