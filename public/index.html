d from the steep drop-off in commercial construction in recent years. Cap rate compression is unlikely, especially in a higher interest rate environment, and owners are going to have to shift their books to continue growing asset values, Principal Asset Management analysts wrote in its midyear Global CRE Outlook. “Investors may have forgotten how much income returns matter,” Rich Hill, Principal’s global head of research and strategy, wrote in the report. Historically, income drives roughly 85% of total returns over the course of a cycle, according to the report. Cap rate stagnation is by far the most likely outcome for the next six months, according to a recent survey from CBRE that showed the share of investors that believe cap rates will compress has declined significantly from last year. Sales data suggest that commercial real estate is broadly in the early recovery phase. Distress exists, but deeply discounted sales are being held off by widely available capital and lenders that are still willing to creatively extend loans so long as landlords bring cash to the table. U.S. transaction volume in the first half of the year was up 31% year-over-year to $293B, the strongest first half to a year since 2022, thanks in part to a rebound in trades for over $250M, according to Newmark. Deal volume was up across every real asset class, and REIT acquisitions were up 86% from the prior year. Debt origination was up 25% year-over-year, but the capital is being put to work more often to refinance debt than make a trade. Its wide availability has kept the cost of capital from rising significantly even as yields on the 10-year Treasury , a key benchmark for underwriting, continue to march higher , Ferroni said. Unsplash/Luke van Zyl Commercial real estate prices were up roughly 20 basis points compared to last year in July, according to MSCI , despite the 10-year Treasury rising by roughly 50 basis points since the start of the year. “It&#039;s just that wall of capital is what&#039;s keeping pricing firm and, in some cases, pricing increasing somewhat, even in the face of some of the macro volatility,” Ferroni said. Apartment landlords are starting to see rent growth after relying heavily on concessions to keep and win tenants as occupancy stabilizes above 95% despite the continued delivery of a wave of new construction. Industrial leasing has ramped up compared to last year, and the best office towers have no vacancy , leaving businesses in the best-performing markets to start taking space in the nex","published_at":1788304612000,"score":29,"tags":["mixed-asset","national","trend","rates","institutional"],"heat_signals":["outlook","year-over-year","rent growth","occupancy","vacancy"],"importance":3,"selector_reason":"Bisnow报道CRE低价抄底窗口关闭，说明估值和收益率环境正在进入新阶段。它偏行业周期分析而非硬数据或单笔大交易，给 imp=3。","section":"cre","title_zh":"CRE折价资产减少，NOI成为增值关键","summary_zh":"债券收益率上升令便宜融资收缩，市场转向运营改善，NOI增长取代估值修复","impact":"neutral","id":"ee358cf8","fetched_at":1788313039452,"cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Partners Capital Sells Austin Shopping Center, Citing Strong Investor Appetite","link":"https://www.bisnow.com/news/austin-san-antonio/retail/partners-capital-announces-sale-of-austin-retail-center","description":"Partners Capital Sells Austin Shopping Center, Citing Strong Investor Appetite September 1, 2026 | 5:47 pm ET Jessica Beebe, National The investment platform for Partners Real Estate has sold a 116K SF retail center in Austin. Partners Capital sold Oak Hill Plaza, which sits along one of the region’s busiest retail corridors, to a joint venture between Trademark Property Co. and Cohen Steers, the Austin Business Journal reported . The plaza is located at 7101 State Highway 71. Wikimedia Commons/Quintin Soloviev Austin skyline The retail center is appraised at approximately $19.4M by the Travis Central Appraisal Distric ork in the country contribute to those economies. He adds that legal immigrants also make long-term investments, like buying homes. \"This kind of cultural buyer is uncertain and very risk-averse. The last thing you want to do is buy a home and own U.S. real estate when you aren't confident you will be able to stay in the country long-term,\" he says. Immigration enforcement that targets legal immigrants will affect the economies in these same areas, he says, because \"people staying home aren't going to restaurants or stores; they're hunkering down.\" Loading... John Burns Research Consulting notes that visa issuance has fallen since November 2025. John Burns Research and","published_at":1788300599000,"score":20,"tags":["housing","national","policy","trend","regulator"],"heat_signals":["texas","fed","inflation","housing market"],"importance":3,"selector_reason":"移民签证暂停可能改变租赁需求，尤其影响人口流入驱动的租房市场。政策与住房需求存在广泛关联但传导仍需观察，给 imp=3。","section":"national","title_zh":"暂停移民签证或削弱租赁需求增长","summary_zh":"政府暂停处理移民签证，人口增速或放缓；租金通胀减弱但建造成本可能上升","impact":"short-neg","id":"48d132e1","fetched_at":1788313039452}],"errors":[{"source":"The Real Deal (National)","error":"HTTP 403","attempted_urls":["https://therealdeal.com/national/feed/"]},{"source":"Houston Agent Magazine","error":"HTTP 403","attempted_urls":["https://houstonagentmagazine.com/feed/"]},{"source":"Phoenix Agent Magazine","error":"HTTP 403","attempted_urls":["https://phoenixagentmagazine.com/feed/"]},{"source":"Atlanta Agent Magazine","error":"HTTP 403","attempted_urls":["https://atlantaagentmagazine.com/feed/"]},{"source":"Miami Agent Magazine","error":"fetch failed","attempted_urls":["https://miamiagentmagazine.com/feed/"]}],"_diagnostics":{"writer_mode":"global","sectionsUnderMin":[],"window_hours":24,"pool_sizes":{"24h":97,"48h":139,"72h":143},"us_holiday":{"today_us":"2026-09-01","today_us_holiday":null,"yesterday_us_holiday":null,"tomorrow_us_holiday":null,"is_us_weekend":false,"expected_recovery_bj_date":null,"source":"dat
