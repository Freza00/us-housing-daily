nd metro-level housing conditions based on key metrics like months of supply, time on the market, price fluctuations, and list-to-sale ratio. This latest fall installment covers 99 of the nation's largest metros and combines the latest housing market inventory data with transaction records and sale projections based on contract activity through September. Typically, quarterly reports cover the top 100 metros, but in the third quarter, Jackson, MS , was excluded from the analysis due to a county-level gap in transaction records. Each of the analyzed markets is placed on a 12-hour clockface, from a peak seller's market at 12 o’clock to a peak buyer’s market at 6 o’clock, to indicate where each market currently stands and where it is likely headed—loosening or tightening. Northeast pivots toward buyers The big-picture report masks significant regional divergence. The Midwest remains an unshakable seller's stronghold, accounting for 16 of the nation's 27 seller-friendly markets where lower home prices continue to generate high demand and keep inventory levels constrained. Meanwhile, the systemically undersupplied Northeast unexpectedly saw the greatest exit of seller's markets, dropping from 11 to five over the past year, as expensive metros like Boston and Providence RI , loosened in response to expanding inventory. \"Buyers are becoming more selective and aren't feeling the same pressure to make quick decisions or offer above asking,\" says George Sarkis of The Sarkis Team at Douglas Elliman based in Massachusetts . \"We're seeing a healthier balance between buyers and sellers than we have in recent years.\" Loading... Boston switched from a seller's market to a balanced one in the third quarter of 2026. Getty Images In more good news for shoppers, the typical seasonal slowdown creates extra room for negotiation with sellers determined to reach the closing table before the end of the year. \"Buyers are more comfortable negotiating on price, requesting inspections, and ber, the multifamily commercial mortgage-backed securities delinquency rate rose 35 basis points to 8.04%, according to Trepp. The multifamily CMBS special servicing rate rose 17 basis points to 8.54% in September, according to Trepp. The overall CRE special servicing rate hit its highest level since February 2013, rising seven basis points in September to 11.49% Multifamily delinquency and servicing rates have followed different trajectories over the past year. Six months ago, the delinquency rate was 7.15% and a year ago it was 6.59%. Six months ago, the special servicing rate was higher at 8.75%. One year ago, it was 8.2%. Dive Insight: Distress mounted across commercial real estate in September, with the overall CMBS delinquency rate increasing 17 bps to 8.02%, according to Trepp. On the delinquency side, a $1.1 billion eight-property studio-and-office portfolio loan in Los Angeles; a $470 million two-tower office complex in Houston; a $280 million beachfront hotel loan in Santa Monica, California; a $230.1 million office loan in Denver; and a $208.9 million office loan in Silicon Valley powered the increase, according to Trepp. CMBS still represents a relatively small piece of the securitized apartment loans in distress, according to Trepp. In August, $11.6 billion out of $635.82 billion of securitized multifamily loans were delinquent . Private-label securities, with a 7.69% delinquency rate, hold $75.48 billion of multifamily debt. Freddie Mac, with $518.99 billion of multifamily debt outstanding, has a 0.8% delinquency rate. Commercial real estate collateralized loan obligations have $41.35 billion of debt and a 3.88% delinquency rate, according to Trepp. “Defaults are getting worse,” Justin Ashcraft, president of Northern Ridge Capital told Multifamily Dive in emailed comments. “This is the highest it’s been since late 2020. Additionally, most groups are expecting another increase in rates this year from the Fed. So there’s no relief on the horizon anytime soon.” Ashcraft said pricing requirements have “shifted quite dramatically from when the loans were originated to today.” What was a realistic take-out cap rate when loans were originated “is now hopelessly out of reach,” he said. He said expectations for market conditions aren't aligning with rents, leaving properties unable to generate cash flow to meet debt service coverage ratios that are acceptable for lenders and investors. “I imagine we’re going to see a lot of upcoming foreclosures which will negatively impact the value of multifamily,” Ashcraft said. “We’re currently focusing a lot on auction financing as the ones that will come out of this situation the best are the ones sitting on the sidelines with an unused war chest.” Click here to sign up to receive multifamily and apartment news like this article in your inbox every weekday. Add us on Google Share Copy link Email LinkedIn X/Twitter Facebook Print License Filed Under: Transactions","published_at":1792423438000,"score":18,"tags":["multifamily","national","distress","institutional"],"heat_signals":["houston","fed","freddie mac"],"importance":5,"selector_reason":"多户住宅私募CMBS逾期率升至7.69%，商业地产贷款服务和信用压力继续恶化。该信号直接反映公寓信贷市场的系统性风险，对银行、证券化市场和全国多户地产均有影响。","section":"cre","title_zh":"multifamily CMBS逾期率升至8.04%","summary_zh":"9月逾期率升35bps至8.04%，special servicing升至8.54%","impact":"short-neg","id":"4e1bde80","fetched_at":1792475022111,"cre_subcategory":"多户"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Big Banks Take Bigger CRE Losses As They Clear Out Problem Loans","link":"https://www.bisnow.com/news/national/capital-markets/big-banks-take-bigger-cre-losses-as-they-clear-problem-loans","description":"Major banks are reducing troubled CRE loans across property sectors as nonaccrual and nonperforming balances decline.","published_at":1792451432000,"score":12,"tags":["mixed-asset","national","distress","lender"],"heat_si tched_at":1792475022111,"cre_subcategory":null},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Bank of America pegs 2027 mortgage volume at $1.72T, warns of 2023-style housing replay","link":"https://www.housingwire.com/articles/bank-of-america-2027-mortgage-forecast/","description":"Bank of America projects muted mortgage growth in 2027, with total originations reaching $1.719 trillion and only about $344 billion coming from refinances, according to a report released Friday. The bank’s analysts said their outlook is “slightly lower” than other industry forecasts because they expect weaker housing market conditions and home sales, along with “a marginally higher projected year-end rate level.” Their 2027 forecast is the third major call for origination volume to remain below $2 trillion next year. The Mortgage Bankers Association (MBA) expects total single-family originations to fall 5% to $1.99 trillion in 2027. Fannie Mae is forecasting $1.86 trillion for next year. BofA’s forecast represents a decline of 15% compared to the $2.030 trillion expected for 2026. It assumes a 10-year Treasury yield average of 5.25% in 2027, a 2.5% year-over-year decline in existing home sales , an 0.5% increase in new home sales and a 1% rise in full-year home price appreciation. Secondary market On the capital markets side, BofA analysts expect agency mortgage-backed securities gross issuance of a little more than $1.12 trillion in 2027, down from about $1.33 trillion this year. Weaker issuance is being driven by softer home sales, a higher share of all-cash transactions in a high-rate environment, a smaller contribution from warehouse pipeline effects, and more agency collateral flowing into nonagency securitizations . These headwinds are only partially offset by modest gains in cash-out refis and lower portfolio retention by the government-sponsored enterprises, the analysts said. Replay of 2023? BofA frames 2027 as a replay of 2023 in several key respects: elevated mortgage rates , subdued housing activity, affordability challenges and a persistent lock-in effect. But the analysts argue that 2027 could be “even more challenging” than 2023 because several demand-supportive forces have faded. In 2023, many buyers still believed higher mortgage rates were temporary and leaned on a “buy now, refinance later” strategy. By 2027, rates will have been elevated for nearly five years, and the Federal Reserve will have resumed tightening , eroding confidence in meaningful refinance opportunities. At the same time, home price appreciation has cooled while homeownership looks more like a high-carry, lower-return investment. In addition, the reversal of the work-from-home trend has removed a major tailwind that boosted housing demand during and after the pandemic. The bank does see some offsets. The lock-in effect has eased modestly at the market level as more higher-rate loans have been originated in recent years, slightly increasing the pool of borrowers who could benefit from future rate relief. Housing supply conditions have improved compared to the tightest pandemic-era levels, and some large markets, including parts of Florida , are showing localized signs of recovery. Related More: Bank of America MBS Mortgage Rates","published_at":1792437409000,"score":44,"tags":["housing","national","rates","trend","lender"],"heat_signals":["fed","mortgage rate","existing home sales","new home sales","fannie mae","outlook","forecast","trend","year-end","year-over-year","housing market","new home sales"],"importance":3,"selector_reason":"Bank of America下调2027年美国房贷规模预期，反映高利率和低成交量对全国住宅市场的持续压制。该预测覆盖全国按揭和再融资市场，属于有参考价值的常规宏观动态。","section":"national","title_zh":"Bank of America下调2027 mortgage预测至$1.72T","summary_zh":"预计originations较2026年降15%，existing home sales将降2.5%","impact":"short-neg","id":"436376ae","fetched_at":1792475022111}],"errors":[{"source":"Hous
