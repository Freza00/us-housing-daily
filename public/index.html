ound : The Constitution gives the President 10 days, excluding Sundays, to sign or return a bill. If he does neither while Congress is available to receive a veto, the bill becomes law. If Congress adjourns and prevents return of the bill, the President can effectively kill it by taking no action. That is the pocket veto. It cannot be overridden because there is no formal veto message for Congress to act on. In practice, Congress often avoids this outcome by staying technically available through pro forma sessions or designating agents to receive veto messages. Is ROAD, then, likely to perish in the pocket? Probably not, unless congressional leaders allow the calendar and adjournment mechanics to produce that outcome. Given the overwhelming House and Senate vote counts, the stronger working assumption for business leaders remains that the bill either becomes law or, if vetoed, triggers a politically charged override fight. That is enough reason to keep reading the ROAD Act as a business inflection document. Forget the political theater aspect for the moment. For multifamily, the central question is whether the bill’s red-tape provisions reach the cost centers that actually determine whether a rental development pencils. The 40.6% bright line challenge Single-family builders have their own regulatory-cost burden . Multifamily developers carry an even more complicated one. A 2022 NAHB/NMHC analysis found that regulation imposed by all levels of government accounted for an average of 40.6% of multifamily development costs. That burden included zoning approval, site-work fees and studies, development requirements beyond ordinary practice, land dedication, building authorization fees, affordability mandates, building-code changes, labor rules and delay. Here&#8217;s how that looks in a stack. Image courtesy of NAHB Eye On Housing The largest single component was changes to building codes over the prior 10 years, at 11.1% of total development cost. Costs when site work begins – including fees, required studies, and related items – increased by 8.5%. Development requirements beyond ordinary practice added 5.4%. Fees charged when construction is authorized added 4.4%. Zoning approval added 3.2%. Affordability mandates added 2.7%. Those numbers clarify where the ROAD Act merges into opportunity lanes to bend cost barriers and where it forks off in directions that cannot affect those barriers. Multifamily affordability is not simply a rent-versus-income problem. It is a feasibility problem. Each additional development cost requires higher rents, more subsidy, more density, lower land costs, cheaper capital or a developer willing to accept a thinner return. When too many of those inputs move in the wrong direction, the project is not value-engineered. It is canceled. Julie Smith, chief administrative officer of The Bozzuto Group , captured that operating reality in testimony before the House Financial Services Committee late last year. She said barriers to development, high construction and operating costs, and regulatory burdens make it difficult, if not impossible, for developers to help address the housing shortage. She also highlighted the need for 4.3 million new apartment ","published_at":1783025303000,"score":15,"tags":["multifamily","national","policy","developer"],"heat_signals":[],"importance":4,"selector_reason":"ROAD Act 对 multifamily rentals 和 build-to-rent 项目的可行性可能产生重要影响，涉及开发商、资本方和租赁住房供给。imp=4，因为这是重要联邦住房政策进展，虽未最终落地但已具备行业影响。","section":"national","title_zh":"ROAD Act 或重写 multifamily 测算","summary_zh":"法案两院高票通过但待总统处理，若落地将改善租赁开发 pencil","impact":"long-pos","id":"012280ba","fetched_at":1783040964248},{"source_id":"houston-agent","source_name":"Houston Agent Magazine","source_tier":"D","source_weight":6,"source_tags":["houston","brokerage"],"region":"texas","title":"Realtor.com: Houston listings rise in June as sellers recalibrate","link":"https://houstonagentmagazine.com/2026/07/02/realtor-com-june-median-list-price/?utm_source= otality Case-Shiller Index released Tuesday. \"With inflation accelerating to 3.8% in April, home values have now declined in real terms for an 11th straight month, further eroding inflation-adjusted housing wealth,\" says Nicholas Godec , head of fixed income tradables and commodities at S P Dow Jones Indices . At the metro level, Chicago was again the strongest market in April among the 20 cities tracked by the index, boasting a 6.5% annual gain, trailed by New York (3.8%) and Cleveland (3.2%). For the second consecutive month, home values were falling faster in Seattle than in any other major market, with the Pacific Northwest hub seeing a 2.3% annual plunge, followed by Denver (-1.8%); Tampa, FL (-1.8%); Dallas (-1.6%), and Phoenix (-1.7%). Loading... \"The affordability pinch remains a key headwind,\" says Godec. \"After dipping below 6% earlier this year, 30-year mortgage rates climbed back to 6.3% in April, keeping financing costs elevated. In this higher-rate environment, home price growth remains constrained, with housing largely treading water in nominal terms and falling in real terms.\" Realtor.com® senior economist Anthony Smith points out that despite the brief window of relief for homebuyers in February, the spring selling season got off to a slow start before gaining some momentum, with existing-home sales rising 3.2% in May to a five-month high of 4.17 million , and pending home sales climbing 3.8% with a 4.8% year-over-year gain . According to the economist, these are signs that buyers and sellers are finding more common ground even as affordability challenges persist. Region divides persist Looking at regional price trends, Smith notes that the list of declining metros narrowed slightly from March, although more than half of the 20 tracked markets continued to post annual declines. \"The nearly 9-percentage-point gap separating Chicago from Seattle underscores how localized this housing cycle has become ,\" he says. \"In markets where inventory has rebuilt more quickly, new construction continues to offer an increasingly competitive alternative , showing buyers of newly built homes can save an average of $25,000 in ownership costs over the first decade compared to older existing stock.\" With mortgage rates hovering near 6.5% for six consecutive weeks , pushed higher by renewed inflation concerns and elevated energy prices , Smith expects price growth to hold in supply-constrained markets, even as the national picture continues to cool. Loading... The Case-Shiller Index reports on a two-month delay and reflects a three-month moving average of home sales prices. Homes usually go under contract a month or two before they close, so the March report primarily reflects purchase decisions made in the winter months. Although the Index's price data is delayed by several months, it is considered one of the best available measures of changing home values, because it is based on repeat transactions on the same properties. Snejana Farberov is a reporter at Realtor.com covering the U.S. housing market and the latest domestic real estate trends. She has worked as a general assignment journalist in New York City and Long Island for 16 years, writing for New York Post, Daily Mail, and News 12. Snejana earned bachelor&#x27;s degrees in journalism and Italian from St. John&#x27;s University, followed by a master’s degree from Columbia University School of ","published_at":1783020080000,"score":49,"tags":["btr-sfr","institutional","housing","texas","dfw","sun-belt","nyc","macro","rates","deals","trend","data","brokerage"],"heat_signals":["dallas","sun belt","inflation","mortgage rate","case-shiller","pending home sales","trend","trends","annual","year-over-year","housing market","case-shiller","existing-home sales","pending home sales"],"importance":3,"_from_fallback":true,"section":"btr","title_zh":"房价增长停滞，东北中西部领跑","summary_zh":"全国SFH仅涨0.8% YoY，Sun Belt 多城下跌，市场分化加剧","impact":"short-neg","id":"7afbbd67","fetched_at":1783040964
