) and Real Estate Settlement Procedures Act ( RESPA ), together commonly known as TRID; the right of rescission for certain refinance transactions; and disclosure requirements for reverse mortgages . The bureau is asking whether current rules create unnecessary burdens for lenders and borrowers while still providing adequate consumer protections. Areas under review include disclosure timing requirements, tolerance thresholds, electronic disclosures and whether smaller financial institutions should receive more tailored rules. For reverse mortgages, the CFPB said current disclosure requirements rely on multiple documents, including Truth in Lending disclosures, Good Faith Estimates and HUD-1 settlement statements. The agency is seeking feedback on whether reverse mortgage borrowers would benefit from a single set of integrated disclosures designed specifically for the product. The bureau is also reviewing the Total Annual Loan Cost, or TALC, a disclosure used in reverse mortgages. Specifically, the CFPB wants to know whether TALC calculations should be updated, and whether showing projected loan balance growth in dollar amounts would be easier for borrowers to understand than current annualized cost figures. The CFPB is also seeking input on whether reverse mortgage borrowers would benefit from educational materials tailored specifically to the product rather than the general mortgage information currently required. While the request for information does not propose any regulatory changes, the CFPB said comments will help determine whether future rulemaking is appropriate. This article was written by Sarah Wolak and generated with the assistance of HousingWire Automation, then reviewed by a HousingWire editor before publication. Related More: Consumer Financial Protection Bureau Real Estate Settlement Procedures Act Reverse Mortgage Daily TRID","published_at":1783537881000,"score":18,"tags":["housing","national","policy","regulator"],"heat_signals":["fed","annual"]," ],"region":"national","title":"The $32 Beazer bid is in, now the fight is over standstill terms","link":"https://www.housingwire.com/articles/32-beazer-standstill-terms/","description":"A little more than a month into a hostile homebuilder takeover saga that has not quite reached midsummer, Dream Finders Homes ’ pursuit of Beazer Homes is beginning to resemble a Shakespearean tale of unrequited love. The ardent suitor has returned again. And again. The latest offering is richer: $32 per share in cash, up 24% from the $25.75 proposal Dream Finders made public in May and, by the bidder’s calculation, 70% above Beazer’s undisturbed May 8 share price. The object of its affection still will not agree to a meeting. Not, at least, without conditions. Beazer’s July 8 response to Dream Finders’ latest proposal reveals a contest that has become more complicated than a bidder repeatedly raising its price and a target repeatedly saying no. In fact, Beazer did not reject the $32 offer outright. Instead, the Atlanta-based builder said it had received interest from “additional parties regarding a range of potential transactions” and was evaluating those possibilities against its standalone strategy. It also disclosed that it had previously given Dream Finders three conditions for opening discussions: raise the price, drop a demand for exclusive negotiations, and sign a customary confidentiality and standstill agreement. Dream Finders met the first two conditions. The third condition has now become the fault line. Late Wednesday, after this analysis was initially published, Dream Finders sharpened exactly where that fault line lies. The Jacksonville-based builder said it “has already offered and remains prepared to execute an NDA immediately” and would accept a limited standstill to allow due diligence to proceed. What it will not accept is a 12-month restriction that would prevent it from returning to direct engagement with Beazer shareholders or nominating directors for election
