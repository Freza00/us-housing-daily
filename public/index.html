rom across the nation for working with us on this multistate enforcement action.” The examination, initiated in January 2022, covered Newrez&#8217;s mortgage servicing activities from Nov. 1, 2020, through Oct. 31, 2021. Regulators found instances of noncompliance with the Real Estate Settlement Procedures Act (RESPA) and Regulation X requirements governing lender-placed insurance. &#8220;Newrez is pleased to resolve this matter with the MMC, which relates to issues identified several years ago that have since been addressed, including through remediation provided to affected borrowers,&#8221; the company told HousingWire . &#8220;Newrez cooperated at all times with the investigation, put in place enhanced and forward-looking measures to address potential regulatory or consumer concerns, and appreciates the engagement and collaboration with its regulatory partners throughout this matter. We remain committed to serving our homeowners and partners with the high standards they expect.” Force-placed insurance , also known as lender-placed insurance, can be obtained by a mortgage servicer when a borrower does not maintain required homeowners insurance and can be used when a policy is canceled, lapses or provides insufficient coverage. The coverage usually costs borrowers more than if they were to obtain their own insurance coverage. The regulators said Newrez&#8217;s practices resulted in consumer harm totaling about $4.5 million. The settlement agreement says Newrez has already remediated all borrowers affected by the issues identified in the examination and subsequent audit. Newrez neither admits nor denies wrongdoing or violations under the settlement agreement. But as part of the agreement, Newrez must conduct an additional self-audit of lender-placed insurance fees collected or refunded on newly boarded loans in participating states from Jan. 1, 2023, through the effective day of the agreement, according to the settlement agreement. If the audit identifies borrowers who paid premiums or fees for improperly placed insurance, Newrez must refund the full amount they paid. The company must also provide regulators with quarterly updates on its remediation efforts until affected consumers have been made whole, and it must implement enhanced servicing standards and conduct monthly testing of newly boarded loans with lender-placed insurance for one year. The testing must determine whether borrowers had valid homeowners insurance when lender-placed insurance was assessed. If more than 5% of the loans tested contain errors, Newrez must report the failure to an executive committee representing participating state regulators and take corrective action. Related More: Compliance Homeowners insurance NewRez","published_at":1786562289000,"score":15,"tags":["housing","national","regulation","lender"],"heat_signals":[],"importance":4,"selector_reason":"Newrez 就强制投保问题达成 1550 万美元多州和解，涉及 46 州及 DC 的 mortgage servicing 合规。金额不算巨大，但监管覆盖面广，因此评为 imp=4。","section":"national","title_zh":"Newrez forced-place insurance 和解","summary_zh":"Newrez 付 $15.5M 解决多州调查，servicing 合规成本与监管压力上升","impact":"short-neg","id":"e7647bc2","fetched_at":1786583347884},{"source_id":"austin-bj-resi","source_name":"Austin Business Journal — Residential RE","source_tier":"D","source_weight":7,"source_tags":["austin","housing"],"region":"texas","title":"Austin's housing fundamentals remain strong as sales season slows - The Business Journals","link":"https://news.google.com/rss/articles/CBMiogFBVV95cUxNNzVlZTVfWEtyc0dsZGdraDJ1UE93SnAwVjdqVms3WkZmRkZrU3ZPWjRwdHpyXzRLSWN2MmZma1ZSM2JpVVJLVVpVQXBCWTJqYS1MTTdqa1JQano5UlhVMVZEMTJWT202dy1iTlM1Sk1zVzh2ZU5RNl9Eb01vcUtkWkFUakJLdFI5Ukk3blVndlgxc0VEdkFiZFVDSzJvLXNBbWc?oc=5","description":"Austin's housing fundamentals remain strong as sales season slows &nbsp;&nbsp; The Business Journals","published_at":1786556880000,"score":12,"tags":["housing","austin","trend"],"heat_signals":["austin"],"importance":3,"selector_reason":"Austin 销售季放缓但住房基本面仍被称为强劲 re among the issues contributing to trouble with securitized multifamily loans. Published Aug. 12, 2026 Leslie Shaver Senior Reporter Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Getty Images Listen to the article 4 min This audio is auto-generated. Please let us know if you have feedback . Dive Brief: New data from CRED iQ shows rising issues among apartment commercial mortgage-backed securities loans. Multifamily, with a 13% distress rate, has seen its rate more than double since February. Of the $992 million across 180 newly distressed loans in July, 96% was tied to apartments. Trepp data also reveals increasing problems with CMBS loans. The multifamily CMBS servicing rate increased 16 bps month over month to 8.39%, according to the data firm. Six months ago, it sat at 8.14%, and one year ago, it was at 8.37%. With a wave of multifamily loans in Ohio, Texas and New York becoming 30 days delinquent, the multifamily CMBS delinquency rate rose 46 basis points MOM to 7.69%, according to Trepp. Six months ago, it sat at 6.94%, and one year ago, it was at 6.15%. Dive Insight: Despite increases in Trepp’s multifamily indicators, the five largest newly delinquent loans in July were backed by office, hotel, retail and specialty commercial real estate properties. The largest apartment loan to go delinquent was the $53.8 million note backing the 262-unit The Riley in Richardson, Texas, according to information Trepp shared with Multifamily Dive. The property went into servicing earlier this year after losing its tax exemption status, according to Morningstar. CRED iQ identified the $84 million Weston Medical Center Apartments loan in Houston as the largest apartment loan driving distress in July. Delinquencies at Ariza Forest View in Santa Rosa Beach, Florida ($61 million loan), Mirasol in Las Vegas ($53.1 million), Solaire Bethesda in Bethesda, Maryland ($49.6 million) and The Sophia Apartments in Dallas ($38.9 million) also contributed to apartment issues. CMBS loans represent a smaller slice of the multifamily debt market, making it easy to overestimate their importance. However, the issues that surfaced among distressed properties with this securitized debt can show fissures across the industry. CRED iQ Founder and CEO Michael Haas told Multifamily Dive that he sees rising operating expenses as a common issue pushing multifamily CMBS loans into distressed situations. He pinpointed year-over-year increases of as much as 100% across insurance and property tax, which pulled the debt service coverage ratio below 1.0x on 39 of the 98 multifamily loans evaluated by CRED iQ. “Maturity stress is the second big theme,” Haas said in emailed comments. “Ten MF loans are already past their stated maturity date without payoff, another 31 mature within the next 12 months, and comments repeatedly reference borrowers unable to close refinancing on time and negotiating short maturity extensions.” Deferred maintenance, code violations and fire and casualty events, including a unit fire at one Florida property and a fire-suppression system failure in another, triggered issues with other loans. Finally, floating-rate loan exposure is also a huge issue. “Loans with adjustable-rate IO [interest-only] structures are seeing rate cap costs eat into debt service coverage,” Haas said. Click here to sign up to receive multifamily and apartment news like this article in your inbox every weekday. Add us on Google Share Copy link Email LinkedIn X/Twitter Facebook Print License Filed Under: Capital, Transactions","published_at":1786563360000,"score":21,"tags":["multifamily","national","distress","lender"],"heat_signals":["texas","houston","dallas","year-over-year"],"importance":4,"selector_reason":"多户 CMBS distress 在 July 上升，反映保险、税费和融资成本对 securitized multifamily loans 的压力。虽非单一巨额违约，但涉及 CRE 信贷风险扩散，因此评为 imp=4。","section":"cre","title_zh":"multifamily CMBS distress 7月上升","summary_zh":"CRED iQ 显示 multifamily distress rate 达 13%，新增困境 /new-york/office/85-tenth-ave-office-headed-for-imminent-default-servicer-commentary-says","description":"Vornado, Related&#039;s Google-Anchored Office Building Faces &#039;Imminent Default&#039; August 12, 2026 | 6:52 pm ET Ciara Long, New York City A $396M mortgage tied to a Chelsea office that began its life as a biscuit factory is showing some cracks. Photo credit: Google Maps Vornado and Related Cos.&#039; 85 Tenth Ave., where a $396M mortgage was transferred to special servicing this week over cash flow concerns The CMBS loan for Vornado Realty Trust and Related Cos .’ 85 10th Ave. has been transferred to special servicing, according to a Morningstar Credit alert, which noted that the transfer was due to a potential “imminent default.” The debt is scheduled to mature in December. The 11-story, 635K SF office building is also encumbered by $229M of mezzanine debt. The property is 89.9% occupied, according to Vornado’s second-quarter supplemental earnings report , but its cash flow has “significantly lagged” since the pandemic. The largest tenant in the office tower, formerly a Nabisco factory , is Google, which renewed its 300K SF space in the building in 2024 with asking rents at $100 per SF. Biometric tech firm Clear leased 119K SF in 2021 but is still in its free rent period, according to Morningstar. The building’s cash flow last year was 28% below the projected level when the owners refinanced the building in 2016 with a loan from Deutsche Bank , according to Morningstar. The transfer is likely just a product of the upcoming maturity and the lower-than-expected cash flow, Morningstar Credit Analytics Associate Managing Director David Putro told Bisnow . “Ultimately, this seems like something that would get modified and extended pretty easily,” he said, adding that he doesn’t expect the owners will have to chip in large equity sums to get new debt because of the building’s occupancy rate and the strong NYC office market. “There’s a lot going for this property,” he said. “There’s a lot of reasons for Vornado and the servicer to work to get something done.” Vornado declined to comment. Related and special servicer Situs Holdings did not immediately respond to requests for comment. Related first acquired the 1913-built property from Somerset Partners for $430M in 2007. Vornado, which had been a lender to Related, acquired a 49.9% stake in the building in connection with the 2016 refinancing deal, which totaled $625M. The debt came with a weighted average interest rate of 4.55%, Vornado said in a release at the time — far below today&#039;s elevated rates. The building’s strong occupancy stands in contrast to the surrounding area. At 26.8%, Chelsea had the second-highest vacancy rate in Manhattan, according to Cushman Wakefield . But across the city, landlords have regained leverage as the availability of quality office space has dwindled dramatically. Vacancy in Manhattan offices fell to 19.3% in the second quarter from 22.6% a year prior, according to Cushman Wakefield. Continue reading this story with a free account Log in or register Contact Ciara Long at ciara.long@bisnow.com Related Topics: Chelsea , CMBS , CMBS special servicing , Manhattan office , Related Cos. , Vornado Realty Trust","published_at":1786575163000,"score":20,"tags":["office","nyc","distress","institutional"],"heat_signals":["occupancy","vacancy"],"importance":4,"selector_reason":"Vornado 和 Related 的 Google 锚定办公楼面临 3.96 亿美元贷款 imminent default，是头部城市办公资产压力事件。单笔贷款超过 2 亿美元且信号强，因此评为 imp=4。","section":"cre","title_zh":"Vornado、Related 办公楼临违约","summary_zh":"85 Tenth Ave $396M CMBS 转 special servicing，现金流较 refi 预期低 28%","impact":"short-neg","id":"057c2a83","fetched_at":1786583347884,"cre_subcategory":"办公"},{"source_id":"connect-cre","source_name":"Connect CRE","source_tier":"A","source_weight":7,"source_tags":["mixed-asset","deals"],"region":"national","title":"Walker &#038; Dunlop Arranges Debt, Equity for Port Chester Multifamily Project","link":"https:/
