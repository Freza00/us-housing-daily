 creation now higher, certain Fed Hawks will want to have an open conflict with Kevin Warsh and others who want more rate cuts. Let&#8217;s take a look at the jobs report to see what is really going on. From BLS : Total nonfarm payroll employment edged up by 115,000 in April, and the unemployment rate was unchanged at 4.3 percent, the U.S. Bureau of Labor Statistics reported today. Job gains occurred in health care, transportation and warehousing, and retail trade. Federal government employment continued to decline. The breadth of job creation has improved in 2026; it is still healthcare-heavy, but in this report, we saw a few job sectors show growth, as shown in the chart below. Which now makes back-to-back months we have seen this, and, in fact, all three months that were positive in 2026 have had better breadth than before. Labor force growth ticked down a smidge in this report, and despite all the hype earlier this year that AI was going to take all the jobs, the unemployment rate is at 4.3%. I did a preview of the jobs report in today&#8217;s episode of the HousingWire Daily podcast, where I discuss my long-term theory about why we don’t need to worry about massive unemployment. I look for two labor triggers before I get into my real recession talking points. One is jobless claims heading toward 323,000 on the 4-week average, and the other is residential construction jobs having a noticeable downtrend. Neither of those two things is happening now. In the chart below, you can see residential construction employment isn’t rising, but it’s not breaking either. Conclusion The labor market has stabilized and we are creating more jobs than we did at this time last year. Year-to-date job creation is slightly below my break-even number for keeping the unemployment rate from rising. Population growth is slowing; my break-even point is at 78,000 jobs per month and year-to-date job creation is 76,000. The Federal Reserve has a much lower break-even rate with population growth slowing. The hawks have used this as a talking point to avoid easing policy any further. Now, this isn’t a booming labor market for sure, but it’s not breaking either, and the Federal Reserve believes its break-even point for job growth is around 30,000, which is my take on their talking points. While I might disagree with their take on that, what the Fed thinks is what matters, and with inflation above target before the Iran conflict started and with oil and food prices rising, the Fed hawks will have more ammunition to stay hawkish. The 10-year yield ticked down slightly after the jobs report, as the Iran conflict remains at the center of economic talk. What this jobs report and others for 2026 have done is give the hawks cover to fight any rate cuts in 2026 as long as the conflict is going on and inflation data is not improving Related More: Federal Reserve Inflation Jobs Report","published_at":1778257543000,"score":22,"tags":["macro","national","rates"],"heat_signals":["fed","rate cut","inflation","trend"],"importance":5,"selector_reason":"就业数据企稳强化美联储鹰派不降息立场，新联储主席Warsh将面临内部分歧；Fed决策相关宏观数据解读，直接影响利率与房贷，imp=5。","section":"national","title_zh":"就业数据企稳，Fed 鹰派获更多不降息理由","summary_zh":"4月非农新增115K、失业率持平4.3%，劳动力市场改善削弱降息紧迫性，mortgage spread 虽收窄但 rate cuts 预期降温","impact":"short-neg","id":"54ec1a74","fetched_at":1778319246013},{"source_id":"cnbc-realestate","source_name":"CNBC Realty Check","source_tier":"A","source_weight":6,"source_tags":["macro"],"region":"national","title":"Warsh's take on Fed independence is met with confusion and some concern","link":"https://www.cnbc.com/2026/05/04/fed-kevin-warsh-interest-rates.html","description":"Fed chair nominee Kevin Warsh is putting his own spin on the independence of monetary policy. Many former Fed officials aren't sold.","published_at":1778273917000,"score":12,"tags":["regulator","national","policy"],"heat_signals":["fed"],"importance":5,"selector_reason":"联储主席提名人Warsh对Fed独立性的表态引发困惑和担忧；Fed领导层变动与货币政策独立性核心议题，imp=5。","section its this year and next, money that Farello would rather put to work than hand over to the IRS. “Instead of paying more taxes, why don’t I invest in something I know I need [for my business] and I can take the full depreciation,” he said. That way, “you own the property, plus you get the bonus depreciation.” The tax rule is meant to spur economic growth by having companies invest in themselves, and it’s not just for offices. Restaurants, retailers and other operators that own commercial spaces for their businesses can take the deductions. But the law came at an opportune time for companies that purchase or own their office space, amid a surge nationwide of user-owned offices, both developed and purchased. Subscribe to TRD Data to unlock this content Subscribe After hybrid work reshaped office demand, many firms now know exactly how much space they need and what they want and are opting to create it themselves on their own terms as their own landlord. The behemoths building their workspaces include Ken Griffin’s Citadel and Spanish bank Banco Santander , which plan towers in Miami’s Brickell, while AT T is plotting a Plano, Texas , campus. User purchases peaked at $8.9 billion last year, or 15.6 percent of office deal volume, the highest volume for at least the past decade, according to Avison Young. Trades for buildings 20,000 square feet or bigger Bonus depreciation isn’t a driving force. It’s one of several forces nudging firms toward ownership, and it’s juicing the numbers for owner-user offices amid the widespread market shift, experts said. “Companies appreciate it, and they are, of course, going to utilize it,” said Steve Triolet, a commercial real estate expert in Dallas. “It’s icing on the cake.” Workings of a tax law Laws allowing workarounds to paying taxes on real estate are not novel, with Trump himself using them in the past for some of his investment properties. Bonus depreciation specifically also has been on the books for some time, but the “beautiful
