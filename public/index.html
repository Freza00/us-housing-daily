main. Forward look: Many banks are thinking about or putting in place data warehouses that will help them ease the challenges of implementation and integration. Generative AI has reached the phase of adoption in financial services where tech leaders in companies are focused on adding new use cases and working out kinks like data access and governance. Processing Content This is reflected in the conversation at Amazon Web Services' Financial Services Symposium Thursday in New York City. Bankers here are speaking of several practical, everyday uses for the technology, and the challenge of dealing with data in silos comes up frequently. Here are a few examples. US Bank: Not making customers repeat themselves U.S. Bank is using AI to do something that sounds simple, but that few large banks can actually do: take care of customers' queries and complaints without switching them to different departments and making them repeat themselves. Andy Bingenheimer, executive vice president and corporate CIO at the $692 billion-asset Minneapolis bank, described deploying Amazon Connect in the bank's contact centers at an AWS event in New York on Thursday. U.S. Bank has 13 million consumer clients and 1.4 million business clients. Its call centers handle 15 million calls and its 70,000 customer service agents talk through 65 million minutes of customer conversations monthly. Amazon Connect provides context for what the customer is asking or complaining about, bringing any earlier interactions to the customer service rep's screen, whether they were in other phone calls, chat sessions, emails or text messages. \"We know that our client base is changing,\" Bingenheimer said. \"The expectation around customers having a relationship with a single bank for the entirety of their financial life is changing. We know now that customers have choice and tend to spread their relationships across multiple companies. We're competing with that last great experience that our customer had, regardless
