 that mortgage rates had surpassed their prior year level which is why we see a decline from last year. Home sales are likely to remain below their year-ago pace for the rest of 2026 as mortgage rates remain high. The month to month pickup NAR’s pending home sales steadied in August dropping just (0.3%) from July, but trailed the prior year by a larger gap (-4.7%). Meanwhile, Realtor.com September pending home sales also dropped by a larger margin , signaling a rough patch for existing home sales. After a rapid repricing in the second half of September, the 10-year yield has hovered in a narrower 5.2% to 5.3% range in the last two weeks, a stability that will eventually help to stabilize mortgage rates and rebuild homebuyer confidence for navigating the market, but this takes time. Rising Inventory and Slower Sales Keep Months Supply Elevated After climbing to 4.9 months in August, its highest pace since November 2015 (5.1), months supply was revised to 4.8 months, a mark it held in September, amid lower inventory and lower sales. Realtor.com data show that even though new listings remained sluggish in September , not topping their prior year pace as was common in the spring, active inventory continues to rise. First-time Home Buyers Gain Ground First-time home buyer share edged higher, building on gains last month. In September, first- time home buyers purchased 31% of sales, up from 30% in the prior month and year. We’re past the worst of the starter-home supply crunch nationwide, which may help entry-level buyers gain a foothold, but the local picture remains mixed according to the latest Realtor.com report. Home Prices Rose Modestly Home sales prices rose 1.3% from the prior year even as they slipped lower on a monthly basis, as is typical seasonally. The typical U.S. asking price has been softer in 2026 according to Realtor.com data, lagging behind by 1.4% in September .","published_at":1791917384000,"score":24,"tags":["housing","national","data"],"heat_signals":["mortgage rate","existing home sales","pending home sales","existing-home sales","pending home sales"],"importance":5,"selector_reason":"9月成屋销售、同比表现和利率影响提供了全国住宅市场的关键宏观读数。该数据覆盖全国交易量与市场节奏，属于重要住宅市场指标。","section":"national","title_zh":"existing home sales 小幅回升，市场仍低迷","summary_zh":"9月成交年化3.99M，环比增1.5%但同比降2.2%，高利率将压制全年需求","impact":"short-neg","id":"d884660a","fetched_at":1791944934413},{"source_id":"national-mortgage-news","source_name":"National Mortgage News","source_tier":"A","source_weight":7,"source_tags":["rates","macro"],"region":"national","title":"Fed's Waller says higher US yields could help cool demand","link":"https://www.nationalmortgagenews.com/articles/feds-waller-says-higher-us-yields-could-help-cool-demand","description":"Capital markets Fed&#x27;s Waller says higher US yields could help cool demand By Swati Pandey and Enda Curran Published October 13, 2026, 12:41 p.m. EDT 3 Min Read Facebook Twitter LinkedIn Email Federal Reserve Governor Christopher Waller said the surge in long-term U.S. Treasury yields is helping to curb demand in interest-rate-sensitive sectors such as housing and automobiles, doing some of the work of tighter monetary policy. Processing Content \"When yields go up, is that going to impact interest-sensitive sectors like housing and autos and other things? Yeah, of course it is,\" Waller said at Bloomberg's New Economy Forum in New Delhi on Tuesday. While that isn't the Fed's intention, higher yields are \"doing a little bit of the work,\" he said. Christopher Waller in New Delhi, on Oct. 13. Photographer: Prakash Singh/Bloo Yields in the US and other advanced economies have climbed to multidecade highs , tightening financial conditions, amid higher inflation triggered by the US-Iran war and concern about budget shortfalls. Traders have responded by paring rate-hike expectations, with the amount priced into swaps across eight major economies falling by almost 200 basis points since mid-September, according to data compiled by Bloomberg. Last week, Waller signaled that further interest-rate hikes will likely be needed to slow inflation, though he added officials have some flexibility on timing as they contemplate another increase. The Federal Open Market Committee voted unanimously last month to raise its benchmark rate for the first time since 2023. Investors initially saw a high chance of another increase at the Fed's Oct. 27-28 meeting, before paring those bets after two top officials signaled policymakers have time to assess the economy before moving again. Economists forecast that inflation data due Wednesday will show the headline rate accelerated in September on the back of energy costs due to the US-Iran war. Core prices, however, are expected to have moderated. Artificial intelligence is also putting upward pressure on prices as the rapid build-out of AI infrastructure fuels demand, Waller said. \"Obviously, if you're building out several trillion dollars of investment in AI and you have to buy all that stuff, and your demand is perfectly inelastic, you'll pay whatever price,\" Waller said. \"You're going to bid up the price of all semiconductors of all type, and that's going to spill over to anybody else who uses those products. And that's what we're starting to see in the US.\" Waller is among many Fed officials who are hopeful that AI can eventually raise productivity gains, enabling stronger growth without generating excess inflation over the long-term. But he said that payoff may still be a few years off — and meanwhile the AI-driven price pressures could last for two or three years. 'There Is a Threat' Asked about the threat to his job from President Donald Trump — who's repeatedly attacked the central bank for not bowing to his demands for lower rates — Waller said he trusts in Congress and the US courts to preserve the central bank's autonomy. \"There is a threat to Fed independence by the administration,\" said Waller, who was appointed by Trump during the president's first term. \"So far, it hasn't really succeeded.\" In his second spell in office, Trump has sought to oust former Chair Jerome Powell, who remains a board governor, and Governor Lisa Cook to make way for his own appointees. His pressure campaign has revived debate about how much influence a president should have over monetary policy. Most economists reckon central banks get better results on inflation if they're left alone to do the job. Trump's pressure campaign isn't over. This month the White House announced the formation of a committee to investigate mortgage fraud allegations against Cook, who'll have to defend herself at a Nov. 5 White House hearing. The Supreme Court already blocked Trump's initial attempt to remove Cook over the allegations, whi","published_at":1791909671000,"score":20,"tags":["housing","national","rates","macro","regulator"],"heat_signals":["fed","rate hike","inflation","forecast"],"importance":5,"selector_reason":"美联储理事Waller明确表示长期国债收益率上升正在抑制住房等利率敏感行业需求。该表态直接关联货币政策、债券收益率和全国住宅市场，具有系统性影响。","section":"national","title_zh":"Waller：高收益率正冷却住房需求","summary_zh":"Fed官员称长期美债收益率上升已抑制housing等利率敏感行业，紧缩压力延续","impact":"short-neg","id":"5b924e03","fetched_at":1791944934413},{"source_id":"fed-press","source_name":"Federal Reserve Press","source_tier":"C","source_weight":7,"source_tags":["rates","policy","macro","regulator"],"region":"national","title":"Minutes of the Board's discount rate meetings on August 17, September 9, and September 16, 2026","link":"https://www.federalreserve.gov/newsevents/pressreleases/monetary20261013a.htm","description":"Minutes of the Board's discount rate meetings on August 17, September 9, and September 16, 2026","published_at":1791914400000,"score":11,"tags":["housing","national","rates","macro","regulator"],"heat_signals":[],"importance":5,"selector_reason":"美联储公布多次贴现率会议纪要，涉及货币政策与金融条件判断。贴现率决定和会议记录会影响利率、信贷及全国住宅和商业地产市场，属于系统性信息。","section":"national","title_zh":"Fed discount rate 会议纪要发布","summary_zh":"公布8月17日、9月9日及9月16日会议纪要，利率路径与分歧细节 000 into their mortgage for repairs and upgrades — FHA announced in June that it would allow up to four contractor draw requests. The goal is to make it easier to complete smaller projects, which are critical in aging and lower-priced markets. Jones said the change “smooths out the draw schedule and also is an important risk mitigant for us to make sure contractors are receiving it in smaller chunks.” Ginnie Mae President Joe Gormley , who is expected to hand the FHA commissioner&#8217;s role to Jones — who is awaiting Senate confirmation — said the renovation products remain underdeveloped relative to their potential. “We&#8217;re looking, trying to find ways to unlock it. In urban contexts, there&#8217;s a lot of potential there,” Gormley said. Related More: FHA loan Ginnie Mae HUD Mortgage Bankers Association","published_at":1791921563000,"score":20,"tags":["housing","national","policy","regulator"],"heat_signals":["fed","permits","annual"],"importance":4,"selector_reason":"HUD拟调整FHA 203(k)翻修贷款项目，以改善住房供给和可负担性。该政策涉及联邦住房融资工具，可能影响住宅供应和改造贷款市场。","section":"national","title_zh":"HUD拟改革203(k)，释放翻修供给","summary_zh":"HUD拟增加顾问并保留风控，203(k)目前年覆盖仅3K-4K套，供给潜力上升","impact":"long-pos","id":"f1c72855","fetched_at":1791944934413},{"source_id":"cnbc-realestate","source_name":"CNBC Realty Check","source_tier":"A","source_weight":6,"source_tags":["macro"],"region":"national","title":"3D-printed housing company Icon raises $200 million at a $1.4 billion valuation","link":"https://www.cnbc.com/video/2026/10/13/3d-printed-home-builder-icon-raises-200-million.html","description":"3D-printed home builder Icon raises $200 million Skip Navigation Markets Pre-Markets U.S. Markets Currencies Prediction Markets Cryptocurrency Futures Commodities Bonds Funds ETFs Business Economy Finance Health Science Media Real Estate Energy Climate Transportation Investigations Industrials Retail Wealth Sports Life Small Business Investing Personal Finance Fintech Financial Advisors Options Action ETF Street B 944934413},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Some builders beat an entry-level retreat. Valera eyes an opening","link":"https://www.housingwire.com/articles/valera-homes-houston-entry-level/","description":"As many homebuilding operators retreat from entry-level and affordability-driven offerings, the founders of Houston-based StoneManor Homes are countering with a contrarian approach by launching Valera Homes , a new homebuilding brand of homes priced from the $270,000s to the $350,000s. The Valera Homes brand extension arrives at a tricky moment for the most budget-conscious buyer segment. Elevated mortgage rates , higher energy costs, stubborn inflation and weak consumer sentiment have converged to upend the monthly payment calculus for entry-level and value-focused households. Builders have had to resort to “buying sales” through heavy, margin-eroding incentives and concessions. As a result, more builders have scaled back their entry-level exposure and shifted their product mix upmarket, where move-up, active adult and luxury buyers typically require fewer incentives to close. Hovnanian Enterprises , for example, announced during prior earnings calls this year that it was cutting its exposure to most entry-level price points and placing greater emphasis on move-up and active adult housing to generate stronger margins. Meritage Homes , in July , similarly reported an “intentional shift” toward move-up homes, with less emphasis placed on entry-level homes. And M/I Homes , on an earnings call in August, noted that 43% of its sales came from its entry-level Smart Series, down from 52% a year earlier. Beazer Homes executives, on earnings calls before this summer&#8217;s acquisition by Dream Finders Homes , similarly indicated that they expected their share of closings below $500,000 to decline by double digits by the end of fiscal 2026. Most of these builders, and others pursuing a similar mix-shift, haven&#8217;t signaled an outright withdrawal from the entry-level segment, but are instead scaling back their emphasis on it. While that pullback signals a broad industry pivot, John Tucker, CEO of Valera Homes, believes that it also leaves a gap in the market that his company is positioned to fill. “A lot of builders are getting out of that price point, and that allows us to penetrate quicker,” Tucker said in an interview with HousingWire TBD . “We feel like there&#8217;s space in there. Those people still need an affordable home right now.” How Valera aims to deliver affordably priced homes Tucker, previously with Gehan Homes for more than two decades, cofounded StoneManor Homes in 2025 alongside fellow homebuilding industry veteran Scott Sparks. The idea behind the new homebuilding venture was to offer fresh, innovative and semi-custom home designs, rather than relying on the recycled home plans Tucker had seen used in some of his previous roles. Most StoneManor homes run from the mid-$300s up to about $1 million, and a few have even sold for up to $2 million. However, the company is diversifying its market segmentation by adding Valera Homes at a lower price point. One way that Valera plans to keep its homes attainable is by prioritizing design and construction standardization and efficiency, in contrast to StoneManor’s more semi-custom approach. “These are 19-foot-wide plans, very efficient with two stories and multiple elevations, anywhere from a very nice craftsman all the way to a very modern elevation,” Tucker said. Working with a designer, Valera Homes narrowed its everything-included floorplan line-up to five interior and 10 exterior packages, and buyers simply pick their selections at the model home. Because the options are so limited, the purchasing and construction teams know exactly what each home requires, which means fewer errors and lower costs. Beyond that, Tucker says the homes are simple to build, which allows the company to bend its asking-price curve downward. “The only thing we need to factor in is theft, because other than that, they&#8217;re very simple to build,” Tucker said. Where Valera builds matters as much as how it builds. The company favors locations whose land basis and development costs make its ta","published_at":1791922069000,"score":18,"tags":["housing","houston","construction","homebuilder"],"heat_signals":["houston","inflation","mortgage rate"],"importance":3,"selector_reason":"在大型建商收缩入门级产品之际，Valera推出约27万至35万美元的住宅品牌。该行动反映建商对可负担住房需求的判断，属于常规行业动态。","section":"sunbelt","title_zh":"Valera逆势布局$270K起价住宅","summary_zh":"Houston新品牌主攻$270K-$350K，开发商撤出entry-level之际，低价供给获机会","impact":"long-pos","id":"ff2a3c0f","fetched_at":1791944934413},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Miami’s Little Havana confronts housing density's double edge","link":"https://www.housingwire.com/articles/little-havana-density-housing/","description":"Proposed zoning changes could make Little Havana Miami’s next housing development frontier, allowing larger apartment buildings and more homes. The decade-long planning effort now unfolds under a different set of development rules, including Florida’s 2023 Live Local Act, revised for the third time this year. Debate around the proposal illustrates the tug-of-war cities and neighborhoods face, not just in Miami but across the country, as leaders seek solutions to increasingly chronic housing affordability concerns. In Miami, discussions over the coming months will address more than the number of apartments permitted. City planning staff are developing design guidelines and a neighborhood revitalization district alongside the zoning proposal. But opposition follows a similar pattern. Residents question how additional density would affect infrastructure, nearby single-family neighborhoods and Little Havana’s historic character. Discussions continue over the coming months City planning staff said at a September hearing that public outreach would continue as design guidelines and overlay tools take shape. The work includes a neighborhood revitalization district intended to incorporate public benefits. Staff anticipated City Commission consideration in October, additional outreach in November and a second reading in December. Those dates were tentative, and the next community meeting remains unconfirmed. State review could extend the process because of the acreage involved in the proposed future land-use changes. Staff said submission, review and a response would require at least 60 days, although the state’s review period is 30 days. Questions from state reviewers could stretch the process to six months. The Planning, Zoning and Appeals Board recommended approval at the Sept. 2 hearing. Further review and outreach will address development capacity alongside rules governing new construction. More capacity, no affordability requirement The changes would expand development capacity across hundreds of properties in Little Havana and parts of the Miami River District. Some properties could accommodate as many as 150 residential units per acre and buildings up to eight stories. The proposal would not reproduce Brickell’s high-rise skyline. But larger apartment buildings could substantially change streets near lower-density residential areas. City planners argue that expanding supply could create opportunities for affordable, workforce and mixed-income development. The proposed changes, however, would allow additional market-rate housing without requiring income-restricted apartments. Live Local offers a separate route , granting development benefits on eligible sites in exchange for affordable rentals. Qualifying projects must reserve at least 40% of residential units as affordable rentals for at least 30 years. The apartments can serve households earning up to 12  protest their build-out. “With the demand of artificial intelligence, we are seeing data center demand drastically go up, and we must put protections in place to protect our communities, our pocketbooks and our quality of life,” Council Member Dimple Ajmera said at the hearing. The catalyst for the heavy opposition in the area was American Tower Corp. ’s proposal for a 40K SF facility near Reedy Creek Nature Preserve in East Charlotte, which has now been paused. Cristopher Scalise, co-founder of Stop East Charlotte Data Center, said he hoped the council would “do the right thing and go at least another year” because there is still “an enormous, enormous amount of work” left to do. “We’re not ready to move forward as a city on this issue,” he said at the hearing. Data center moratoriums have spread rapidly across North Carolina in the past several months, with Raleigh enacting one just last week . There are 367 active moratoriums nationwide. North Carolina has been a hot spot for development, with more than 90 data centers, 40 of them in Charlotte, according to Data Center Map . When the moratorium began this summer, Driggs told Bisnow that an extension to one year would better prepare the city for future data center development. Members of local labor unions who attended the Monday hearing said the moratorium should end next month as planned, as construction laborers need work and should be protected by local regulations. But council members indicated that North Carolina is not a pro-union state and would proceed with the vote on the extension as scheduled. Council Member JD Mazuera Arias said there’s more to be done to protect against the negative impacts of data centers and emphasized the potential for the city to work together to lobby the state legislature. “There’s a real great potential here for coalition building, to advocate for more than what we can do currently and what we’re limited to do as a local government based on state statute,” he said. In the meantime, he said, “I do support the extension of a moratorium, and I look forward to voting for it when the time comes.” Continue reading this story with a free account Log in or register Contact Jessica Beebe at jessica.beebe@bisnow.com","published_at":1791936355000,"score":14,"tags":["data-center","carolinas","regulation","regulator"],"heat_signals":[],"importance":4,"selector_reason":"夏洛特市议会倾向延长数据中心开发禁令，继续限制该类项目审批。数据中心监管会影响电力、工业土地和大型资本项目，属于重要地方政策。","section":"cre","title_zh":"Charlotte拟延长data center开发冻结","summary_zh":"市议会倾向将150天暂停期延长最多11个月，水电与社区影响将继续限制开发","impact":"short-neg","id":"7acb2899","fetched_at":1791944934413,"cre_subcategory":"数据中心"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Access To Power Now The No. 1 Force Shaping U.S. Site Selection Decisions","link":"https://www.bisnow.com/news/national/economic-development/access-to-power-now-the-no-1-force-shaping-us-site-selection-decisions","description":"Electric power now tops the list for site selection for megaprojects like factories and data centers, overtaking incentives and talent.","published_at":1791935512000,"score":14,"tags":["mixed-asset","national","trend"],"heat_signals":[],"importance":4,"selector_reason":"电力供应已成为美国工厂和数据中心选址的首要因素，超过税收优惠和人才。该趋势反映全国大型地产和基础设施项目的核心约束，行业影响广泛。","section":"cre","title_zh":"电力取代激励，成为选址首要因素","summary_zh":"电力供应已超越税收优惠与人才，成为工厂和data center等大型项目选址核心约束","impact":"short-pos","id":"8a0d8d8e","fetched_at":1791944934413,"cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Developers Land $204M Loan For East Village Project: The N.Y. Deal Sheet","link":"https://www.bisnow.com/news/new-york/deal-sheet/east-village-apartments-203m-construction-loan--the-n-y-deal-sheet","description":"Plus, the other biggest leases, sales and loans in NYC commercial real estate in using Under New Rules","link":"https://www.realtor.com/news/real-estate-news/fha-commissioner-hud-matt-jones-manufactured-housing/","description":"Real Estate News Follow Us On Google FHA Official Predicts ‘Significant Acceleration’ in Manufactured Housing Under New Rules By Keith Griffith October 13, 2026 Tom Williams/CQ-Roll Call, Inc via Getty Images Recent reforms to federal rules for manufactured homes could spur a boom in the sector and boost the supply of affordable starter homes, a top housing official says. Matt Jones , an official in the U.S. Department of Housing and Urban Development and President Donald Trump 's nominee to serve as FHA commissioner , said that a seemingly small change in the recently passed 21st Century Road to Housing Act could have a big impact on manufactured housing . The law removes a federal requirement that manufactured housing include a permanent steel chassis to transport the home. Following the change, Jones says, many modular homes may qualify as manufactured housing under the federal HUD code, which preempts local building codes. \"A lot of today's modular builders will be able to claim code preemption, and as a result, we expect a lot of the state requirements will then be forced to update their state-level code to align with the federal standard,\" he said on Tuesday at the Mortgage Bankers Association's annual conference in Chicago . \"What this means is we think there will be a significant acceleration of factory-built, non-site-built housing.\" Factory-build homes are often much cheaper and more efficient to build than traditional homes, but industry analysts say that onerous financing and zoning rules, as well as stigmas surrounding \"trailer homes,\" have stifled widespread adoption. Jones, who is currently HUD's deputy assistant secretary for single-family housing, argues that the manufactured housing sector has evolved radically, and that modern factory-built homes are a far cry from the double-wide trailers of yesteryear. \"It's remarkable,\" he said. \"I think for most people, they wouldn't even be able to tell the difference between a site-built home and factory-built home.\" Separate from the new federal law, HUD rulemaking had eliminated the permanent chassis requirement for the upper levels of multistory manufactured homes, allowing upper floors to be shipped to the homesite and be stacked like Lego blocks. Earlier this month, the new approach was demonstrated in a display on the National Mall during HUD's annual Innovative Housing Showcase. Loading... The Grande Arbor by Cavco Industries, the first manufactured home constructed without a permanent steel chassis frame and built to the U.S. Department of Housing and Urban Development code Cavco Industries, Inc. \"I think, just, aesthetic appeal is going to really improve. It won't happen overnight. There's going to be retooling of the factories,\" said Jones. \"A lot of it's about destigmatization, but it certainly helps to have the actual product that's coming to market look so much like any other home.\" Jones noted that, following the changes in the Road Act, the lines between manufactured and modular housing may begin to blur. This may allow builders to take advantage of the HUD code preemption for manufactured homes, while accessing the broader buyer financing options available for modular. As well, earlier this month HUD unveiled an action plan to accelerate manufactured housing building. The agency wants to update energy efficiency standards as well as design and construction codes. Speaking at the same event in Chicago, Ginnie Mae President Joseph M. Gormley , another Trump appointee, says there is growing support in the secondary mortgage market for loans secured by manufactured homes. \"From the financing and investment side, one of the things we have found is investors are actually willing to pay up for manufactured housing loans, because they tend to have a longer duration,\" he said. \"So we've been working t  , while total mortgage rate-lock volume fell 2% month over month and 26% year over year. Non-QM loans accounted for 12% of September production, up from the previous month and a year earlier. Overall, total rate-lock volume declined 21% over the past three months as mortgage rates climbed across major loan products. The 30-year conforming fixed mortgage rate tracked by Optimal Blue ’s Mortgage Market Indices ended September at 7.39%, up 67 basis points from August and 107 basis points from a year earlier. The 30-year jumbo rate ended the month at 7.36%, while Federal Housing Administration (FHA) and Department of Veterans Affairs (VA) loan rates reached 7.10% and 7.08%, respectively. “What stands out in September is how much product mix is doing the work of keeping purchase activity moving,” said Brennan O’Connell , director of data solutions at Optimal Blue. “Conforming lost share while non-QM volume grew and ARM usage reached its highest level seen in our report,” he added. “That tells lenders there is still purchase demand to serve, but increasingly it may not fit neatly into the traditional conforming box.” Purchase-heavy, nonconforming conditions Purchase rate-lock volume declined by less than 1% month over month and year over year, accounting for 82% of September production. Refinance activity fell to 18% of total production. Cash-out refinance volume declined 8% from August and 23% year over year. Rate-and-term refinance volume fell 13% month over month and 82% from September 2025. Adjustable-rate mortgages accounted for 14% of total rate-lock volume, up from 10.5% in August and the highest share in Optimal Blue’s data series, which dates to 2019. The composition of mortgage production also shifted away from conforming loans, which accounted for 46% of production, down 71 basis points from August and more than 6 percentage points from a year earlier. Nonconforming loans accounted for nearly 24% of production, up 285 bps from August and nearly 7 percentage points higher year over year. Within the non-QM market, investor and debt-service-coverage ratio loans represented 33% of activity, while bank-statement loans accounted for 30%. Other expanded-guideline programs made up the remaining 37%. O’Connell said Optimal Blue’s Virtual Economist forecasts mortgage rates will continue rising over the next 12 months, citing September’s rate increases, the Federal Reserve ’s indication of further rate hikes , and recent increases in gross domestic product, oil prices and disposable income. The report projects the 30-year conforming fixed rate will reach 7.66% over the next month, 7.80% over three months and 7.85% over the next 12 months. Widening spreads The 10-year Treasury yield also climbed, ending September at 5.29%, up 54 basis points from August and 113 basis points year over year. The spread between the Treasury yield and Optimal Blue’s 30-year conforming mortgage rate widened by 13 bps during the month to approximately 210 basis points. On the secondary market , lenders shifted their hedging activity toward higher mortgage-backed securities coupons as rates increased. The 5.5% coupon for 30-year uniform mortgage-backed securities fell to 50% of hedges, down from 62% in August, while the 6% coupon share rose to 44%. Mortgage-backed securities execution accounted for 47% of hedged loan sales, an increase of 385 bps from August and the highest share since January 2026. “The rapid shift from the 5.5 to the 6.0 coupon shows how quickly lenders repositioned their hedges as rates moved higher,” said Mike Vough , senior vice president of corporate strategy at Optimal Blue. Mortgage servicing rights for conforming 30-year loans increased by only 1 basis point to 1.39%,","published_at":1791916973000,"score":25,"tags":["housing","national","rates","lender"],"heat_signals":["fed","rate hike","mortgage rate","forecast","year over year"],"importance":3,"selector_reason":"非QM贷款和ARM使用量在高利率环境下继续增长，反映抵押贷款结构正在变化。该趋势涉及贷款供给与借款人风险，属于常规行业动态。","s ounty’s fell from 735K SF to 277K SF, according to Colliers. The dynamic is in stark contrast to the rest of the country, where construction is picking up. There were 314M SF under construction nationwide in the first six months of 2026, up from the 271M SF under construction at the end of 2025, according to an October Colliers report . That&#039;s still a far cry from the historic surge of supply during the pandemic — the construction pipeline soared from 347M SF in 2020 to a record 711M SF in 2022, according to Colliers. Construction costs have been the demise of plenty of commercial projects across every real estate sector amid tariffs, higher fuel prices and elevated interest rates. Prices for construction-related materials rose 13.3% year-over-year in the U.S., according to a September Cushman Wakefield report . It costs roughly $350 per SF to build a new warehouse today, and the cost of debt is on the rise, restricting the possibility for sufficient returns, said Easton, who founded Miami-based The Easton Group more than 50 years ago . “We haven&#039;t built anything since 2023, and really aren&#039;t looking to build anything because the economics just don&#039;t work for those,” Easton said. “Nobody&#039;s going to take a speculative venture on for a projected 3% return.” Bisnow/Chloe Gallivan Colliers&#039; Lauren Pace, Cushman Wakefield&#039;s Christopher Metzger, Kitson Partners&#039; Matt Buehler, MLCO Construction&#039;s Jordan Cater and NAI Miami, Fort Lauderdale&#039;s David Oxios To make new construction work, rents need to be around $23 net per SF, Easton said, well above the tri-county area’s average, which sits between $16 and $18 triple net per SF, according to Colliers. Rents are starting to peak as tenants reach their limit after years of increases, which has led to some companies packing up and moving north to cheaper markets like Orlando, downsizing their footprint or shutting down Florida operations, Cushman Wakefield Vice Chairman Christoph
