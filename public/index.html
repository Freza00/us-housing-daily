nds of its new 54-acre campus in Plano. This morning, the telecommunications giant held a ceremonial groundbreaking for its headquarters. By the end of 2028, the company expects to begin moving in employees.","evidence_basis":"body","cre_subcategory":"办公"},{"source_id":"realtor-research","source_name":"Realtor.com Research","source_tier":"B","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"Weekly Housing Trends: U.S. Market Update (Week Ending Nov. 7, 2026)","link":"https://www.realtor.com/research/weekly-housing-trends-view-data-week-november-7-2026/","description":"Weekly Housing Trends: U.S. Market Update (Week Ending Nov. 7, 2026) By Hannah Jones Nov 12, 2026 Welcome to this weekly housing trends update, where we bring you the latest snapshot of inventory trends, listing activity, and buyer-seller dynamics across the U.S. housing market. In addition to our monthly housing trends reports , which offer deeper insights into long-term patterns, we publish these weekly updates to provide more timely views into market changes. This effort began in response to rapid shifts in the economy and housing landscape. You can count on a new Weekly Housing Trends update, fresh weekly data each Thursday, and a weekly video from our economists to help you stay informed. What this week’s data shows Though mortgage rates have fallen for the last three consecutive weeks, they remain in 7%+ territory, impacting both buyer and seller willingness to participate in the market. With rates roughly 1 percentage point above year-ago levels, buyers have seen their buying power diminish, even as easing listing prices have worked in favor of affordability. Sellers have responded to cooling buyer demand by pulling back on listing activity. New listing activity has fallen for the last six weeks, and dipped by double digits this week. Time on market has remained relatively stable as easing activity from both the buyer and seller sides of the market have dropped the baseline of activity, but left the market pace largely steady. The typical mortgage holder in the U.S. would face a more than $1,000 increase in their monthly mortgage payment if they were to buy a median-priced home at today’s prevailing mortgage rate. This jump discourages seller activity, especially as lackluster buyer demand may mean dropping their asking price well below their ideal level to drum up buyer attention. With both buyers and sellers showing signs of retreat, the housing market could enter its annual winter freeze early this year. Active inventory climbed 8.3% year-over-year The number of homes for sale rose 8.3% compared to a year ago, continuing a string of strong inventory growth since the summer. Inventory has been building momentum since July, rising from roughly 2% year-over-year growth in mid-July to more than 8% now. However, this pickup is not being driven by a flood of new sellers, but by a pullback in buyer activity. Year-to-date, active inventory i s up 5.0%. Homes spent 1 day longer on the market compared to a year ago Median days on market came in at 65 days, with homes selling one day slower than the same time last year. This marks the third week in a row that time on market has slowed after a long stretch reaching back to May of homes selling at the same pace or faster than last year. As mortgage rates top 7%, more buyers are retreating to the sidelines, and the shift could be an early signal of market slowdown. Year-to-date, time on market remains 2 days behind last year’s pace. New listings, a measure of sellers putting homes up for sale, fell 10.3% year-over-year New listing activity took another sharp turn downward this week, dropping 10.3% year over year. Sellers are discouraged because of how disengaged buyers are. The prices buyers are open to are less appealing to sellers than they were when mortgage rates were lower. The gap between the typical outstanding mortgage rate and the prevailing rate has grown, making relocating a less attractive proposition. The stronger new listing activity earlier in the year has the year-to-date change at -0.6%. The median listing price fell 1.2% year-over-year The median listing price dropped just below $410,000, down 1.2% from the same week last year. Listing prices have now been negative on a year-over-year basis for 43 consecutive weeks. The median price per square foot also declined, falling 1.1% year over year. Mortgage rates have buyers in an affordability crunch that has lowered the price they are willing to pay. Sellers have responded to this shift, but not enough to get the market moving. Year-to-date, median listing prices sit 1.9% below 2025 levels. All changes year over year Year-to-date 2026 (weekly average) Week ending, October 24, 2026 Week ending, October 31, 2026 Week ending, November 7, 2026 Median listing prices -1.9% -1.4% -2.1% -1.2% New listings -0.6% -1.5% -5.2% -10.3% Active listings +5.0% +8.0% +8.8% +8.3% Time on market 2 days slower 1 day slower 1 day slower 1 day slower","published_at":1794477619000,"source_family":"realtor-com","is_research":true,"required_source":true,"mutable":false,"first_seen_at":1794519452247,"id":"a0897539bad03f12","acquisition_window":{"lower":1794430800000,"upper":1794517200000},"score":21,"tags":["housing","national","data","trend","brokerage"],"heat_signals":["trend","trends","housing market"],"date_precision":"timestamp","modified_at":1794335328000,"extraction":"semantic","canonical":"https://realtor.com/research/weekly-housing-trends-view-data-week-november-7-2026","content_hash":"4a0a80babf3b9874ef1c2f8273b1a8d1572aa230dad54e9615eb00771280000a","access":"public","evidence_status":"article","editor_evidence":[{"id":"title","text":"Weekly Housing Trends: U.S. Market Update (Week Ending Nov. 7, 2026)"},{"id":"body-1","text":"Weekly Housing Trends: U.S."},{"id":"body-2","text":"Market Update (Week Ending Nov."},{"id":"body-3","text":"7, 2026) By Hannah Jones Nov 12, 2026 Welcome to this weekly housing trends update, where we bring you the latest snapshot of inventory trends, listing activity, and buyer-seller dynamics across the U.S."},{"id":"body-4","text":"housing market."},{"id":"body-5","text":"In addition to our monthly housing trends reports , which offer deeper insights into long-term patterns, we publish these weekly updates to provide more timely views into market changes."},{"id":"body-6","text":"This effort began in response to rapid shifts in the economy and housing landscape."},{"id":"body-7","text":"You can count on a new Weekly Housing Trends update, fresh weekly data each Thursday, and a weekly video from our economists to help you stay informed."},{"id":"body-8","text":"What this week’s data shows Though mortgage rates have fallen for the last three consecutive weeks, they remain in 7%+ territory, impacting both buyer and seller willingness to participate in the market."},{"id":"body-9","text":"With rates roughly 1 percentage point above year-ago levels, buyers have seen their buying power diminish, even as easing listing prices have worked in favor of affordability."},{"id":"body-10","text":"Sellers have responded to cooling buyer demand by pulling back on listing activity."},{"id":"body-11","text":"New listing activity has fallen f"}],"keep":true,"importance":3,"section":"national","capital_focus":false,"geo_evidence":null,"editorial_protocol":"evidence-refs-v1","primary_event":"market_research_policy","event_evidence_id":"body-8","event_evidence":"What this week’s data shows Though mortgage rates have fallen for the last three consecutive weeks, they remain in 7%+ territory, impacting both buyer and seller willingness to participate in the market.","market_evidence_id":"body-3","market_role":"market_policy","market_scope":"us","market_evidence":"7, 2026) By Hannah Jones Nov 12, 2026 Welcome to this weekly housing trends update, where we bring you the latest snapshot of inventory trends, listing activity, and buyer-seller dynamics across the U.S.","duplicate_of":null,"selector_reason":"周度全美跟踪显示挂牌活动回落、利率仍在7%以上，提供成屋月报之外的近期市场动态。","title_zh":"按揭利率仍处 7% 以上，挂牌活动降温","summary_zh":"Realtor.com 表示，截至 11 月 7 日的一周，按揭利率连续三周下降但仍处 7% 以上；新挂牌量已连续六周下降，本周出现两位数跌幅，买卖双方参与度均走弱。","impact":"short-neg","evidence_quote":"Weekly Housing Trends: U.S. Market Update (Week Ending Nov. 7, 2026) By Hannah Jones Nov 12, 2026 Welcome to this weekly housing trends update, where we bring you the latest snapshot of inventory trends, listing activity, and buyer-seller dynamics across the U.S. housing market.","evidence_basis":"body","cre_subcategory":null},{"source_id":"redfin-news","source_name":"Redfin News","source_tier":"A","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"The Generational Housing Divide: Millennials Had It Better Than Baby Boomers–Until the Pandemic Changed the Math","link":"https://www.redfin.com/news/millennials-baby-boomers-housing-affordability/","description":"The Generational Housing Divide: Millennials Had It Better Than Baby Boomers–Until the Pandemic Changed the Math Published on November 12th, 2026 by Dana Anderson , Yingqi Xu and Szu Yu Chen Timing made a big difference for millennials. Those who bought a home before 2022 locked in historically low mortgage rates. But those who bought after rates and prices surged spent about 35% of their income on housing–and many other millennials were priced out entirely. Baby boomers had a brutal start, with double-digit mortgage rates in the early 1980s, but falling rates gave them decades to refinance. When boomers were in their late 30s, they spent just over 25% of their income on housing. The typical monthly payment was about $3,000 when elder millennials were 40 to 44 (2021 to 2025), versus about $1,986 for boomers at those ages, in today’s dollars. Millennials earn more than boomers did at the same age in today’s dollars, partly because more women are in the workforce, but housing costs more than cancel out the difference. If millennials hadn’t spent so much money on avocado toast, they’d all own their dream home by now–right? Wrong. Just over half of millennials own their home . For the rest, housing costs have soared so much in recent years that skipping the avocado toast in their 20s wouldn’t have made a dent. The story isn’t about constant struggle, though–it’s about timing. Elder millennials who bought a home in their early 30s had it better than baby boomers did at the same age: Historically low mortgage rates and higher household incomes meant those millennials spent about 27% of their income on housing at age 30, compared with 36% for boomers. Then the pandemic changed the math. Mortgage rates jumped from around 3% to nearly 7%, and home prices surged. Since rates rose above 6% in 2022, elder millennials have spent up to 35% of their income on monthly mortgage payments, compared with roughly 25% for boomers at the same age–even though millennials earn more, adjusted for inflation. Boomers might point out that mortgage rates were much higher in their day. They’d be right: Rates peaked at over 16% in 1981 and stayed in double digits for much of the decade. But prices were lower. In the 1980s, when many boomers were in their 30s, the typical U.S. home sold for about $235,000 to $265,000 in today’s dollars. When elder millennials reached the same age–prime homebuying age–in the 2010s and 2020s, typical prices ranged from about $275,000 to $455,000. Key takeaway: Buying at the wrong time was painful for both generations, but boomers had a better chance to recover. Falling rates throughout the late 1980s, 1990s and early 2000s gave them many opportunities to refinance into lower payments. Millennials who bought before 2022 secured historically low mortgages; those who bought later—or never managed to buy—face a much less forgiving market. Of course, it’s possible the market could become more forgiving for millennials over time; rates may eventually fall significantly enough that many millennials have the opportunity to refinance into lower payments. This is based on an analysis of Redfin and U.S. Census data. A few notes to help contextualize the numbers: All dollar figures are adjusted for inflation. Much of the data illustrates each generation’s typical experience at a given age, combining everyone in that generation who has reached that age, whenever that happened for them. Because millennials are still aging into their 40s, for example, our 40-to-44 figures only capture the oldest millennials, who hit those ages between 2021 and 2025. All boomers have been through that age range, so their figures include the whole generation. Please see the end of this report for a detailed methodology. Millennials Had an Early Homebuying Advantage In their early 30s, elder millennials who bought a home spent a smaller share of their income on housing than boomers did at the same age, despite much higher home prices. Imagine a median-earning millennial born in 1984 who bought a home at age 30. They would have spent around 27% of their income to purchase the typical home, within the “don’t spend more than 30% of your income on housing costs” rule of thumb. Two factors helped: cheap borrowing and higher household incomes. Millennials benefited from roughly a decade of historically low mortgage rates; they fell below 3% in 2021. Millennials also tend to have higher household incomes than boomers did at the same age. At age 37, the typical elder millennial household earned an average of $100,000, compared with $88,000 when boomers were that age. The discrepancy is partly because two-income households are more common today. About 78% of women participate in the U.S. workforce, up from roughly 60% in 1980. It’s also worth noting that millennials typically work similar hours for more money than baby boomers at the same life stage. Then the Math Changed The millennial advantage didn't last. Mortgage rates jumped from around 3% in late 2021 to nearly 7% in late 2022, after home prices had surged about 40% nationwide during the pandemic homebuying frenzy. Rising rates often cool prices, but this time, prices didn’t fall. That mix of high prices and mortgage rates that had doubled from their pandemic-era low meant Americans had to spend a much higher share of their income to buy a home. Imagine that same millennial, born in 1984: If they bought a home at age 40 instead of 30, their housing costs shot up to about 35% of their income. Rising prices and rates also priced many Americans completely out of the housing market, which is why elder millennials have a lower homeownership rate than baby boomers at the same age. “For millennials who haven’t yet bought a home, affordability is a challenge. But it’s important to remember that you’re not trying to climb Mount Everest, you’re just trying to get back to 2018 or 2019 , which was the last time the average homebuyer was spending just about 30% of their income on housing","published_at":1794492051000,"source_family":"redfin-news","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794519452247,"id":"63af7bd8ea05c3a7","acquisition_window":{"lower":1794430800000,"upper":1794517200000},"score":14,"tags":["housing","national","data","trend"],"heat_signals":["mortgage rate"],"date_precision":"timestamp","modified_at":1794503515000,"extraction":"semantic","canonical":"https://redfin.com/news/millennials-baby-boomers-housing-affordability","content_hash":"ff6cf34107e77f24db10981f7183f7e0cdd31a9fddd0f5119b06a01ca3e48216","access":"preview","evidence_status":"preview","editor_evidence":[{"id":"title","text":"The Generational Housing Divide: Millennials Had It Better Than Baby Boomers–Until the Pandemic Changed the Math"},{"id":"body-1","text":"The Generational Housing Divide: Millennials Had It Better Than Baby Boomers–Until the Pandemic Changed the Math Published on November 12th, 2026 by Dana Anderson , Yingqi Xu and Szu Yu Chen Timing made a big difference for millennials."},{"id":"body-2","text":"Those who bought a home before 2022 locked in historically low mortgage rates."},{"id":"body-3","text":"But those who bought after rates and prices surged spent about 35% of their income on housing–and many other millennials were priced out entirely."},{"id":"body-4","text":"Baby boomers had a brutal start, with double-digit mortgage rates in the early 1980s, but falling rates gave them decades to refinance."},{"id":"body-5","text":"When boomers were in their late 30s, they spent just over 25% of their income on housing."},{"id":"body-6","text":"The typical monthly payment was about $3,000 when elder millennials were 40 to 44 (2021 to 2025), versus about $1,986 for boomers at those ages, in today’s dollars."},{"id":"body-7","text":"Millennials earn more than boomers did at the same age in today’s dollars, partly because more women are in the workforce, but housing costs more than cancel out the difference."},{"id":"body-8","text":"If millennials hadn’t spent so much money on avocado toast, they’d all own their dream home by now–right?"},{"id":"body-9","text":"Wrong."},{"id":"body-10","text":"Just over half of millennials own their home ."},{"id":"body-11","text":"For the "}],"keep":true,"importance":3,"section":"national","capital_focus":false,"geo_evidence":null,"editorial_protocol":"evidence-refs-v1","primary_event":"market_research_policy","event_evidence_id":"body-6","event_evidence":"The typical monthly payment was about $3,000 when elder millennials were 40 to 44 (2021 to 2025), versus about $1,986 for boomers at those ages, in today’s dollars.","market_evidence_id":"body-6","market_role":"market_policy","market_scope":"us","market_evidence":"The typical monthly payment was about $3,000 when elder millennials were 40 to 44 (2021 to 2025), versus about $1,986 for boomers at those ages, in today’s dollars.","duplicate_of":null,"selector_reason":"Redfin按世代比较住房负担，显示2021至2025年40至44岁千禧一代典型月供约3,000美元，显著高于婴儿潮一代同年龄段的1,986美元。","title_zh":"疫情改变千禧一代购房负担差距","summary_zh":"Redfin 称，疫情后按揭利率从约 3% 升至接近 7%，房价同步上涨；疫情后购房的千禧一代住房支出约占收入 35%，许多人因此被排除在市场之外。","impact":"long-neg","evidence_quote":"The Generational Housing Divide: Millennials Had It Better Than Baby Boomers–Until the Pandemic Changed the Math Published on November 12th, 2026 by Dana Anderson , Yingqi Xu and Szu Yu Chen Timing made a big difference for millennials. Those who bought a home before 2022 locked in historically low mortgage rates. But those who bought after rates and prices surged spent about 35% of their income on housing–and many other millennials were priced out entirely.","evidence_basis":"body","cre_subcategory":null},{"source_id":"cnbc-realestate","source_name":"CNBC Realty Check","source_tier":"A","source_weight":6,"source_tags":["macro"],"region":"national","title":"AI borrowers now drive nearly half of long-dated U.S. IG issuance. PIMCO sees 3 diversifiers","link":"https://www.cnbc.com/2026/11/12/ai-credit-debt-bond-markets-pimco.html","description":"Skip Navigation Markets Business Investing Tech Politics & Policy Video Watchlist Investing Club PRO Livestream Menu Artificial intelligence-related borrowing is becoming a larger share of long-dated U.S. corporate debt — prompting investors to look beyond Big Tech for credit diversification. Investors could consider agency mortgage-backed securities, higher-rated private mortgage bonds and emerging market debt as credit portfolio diversifiers in a corporate debt market increasingly shaped by the AI build-out, according to Lotfi Karoui, managing director and multi-asset strategist at PIMCO. Karoui said AI-related bond issuance now weighs heavily on the broader debt market. Such borrowers now account for almost half of year-to-date gross issuance of non-financial U.S. investment-grade debt with maturities beyond 15 years, PIMCO said in a note Nov. 10. AI hyperscaler debt issuance is projected at around $250 billion in dollar-denominated bonds this year, according to Goldman Sachs forecasts. Estimates for the wider AI ecosystem debt issuance this year — which includes chipmakers, utilities and data center developers — range between $300 billion and $570 billion. There are growing concerns about an AI build-out slowdown prompted by the Democrats' sweeping victory in the U.S. midterm elections, which could pose a headache for long-duration investors looking for diversification, particularly as longer-dated U.S. Treasurys — the traditional duration portfolio hedge — have been rattled by volatility for much of 2026. \"For most of the past 3 years, the AI investment boom has been an equity story, but it is increasingly becoming a bond-market story,\" said Kevin Thozet, a member of Carmignac's investment committee. \"The numbers are becoming too large for bonds investors to ignore.\" Karoui said that within corporate credit, financials offer a large pool of IG exposure with much less direct sensitivity to the AI capex cycle, while \"old economy\" sectors such as energy can play a similar role in high-yield (HY) markets. \"Both, however, are expensive, in our view,\" Karoui said. \"Their spreads above like-maturity Treasuries generally appear tight relative to their risk-adjusted return potential.\" \"Instead, we see other opportunities with more favorable diversification characteristics for investors wary of AI-related investment themes.\" Agency mortgage-backed securities Mortgage-backed securities backed by U.S. home loans guaranteed by government-sponsored enterprises like Freddie Mac and Fannie Mae have proved more resilient to higher rates and rate volatility this year compared with 2023, Karoui said. The note referenced PIMCO and Bloomberg data highlighting a 33-basis-point pickup in agency MBS over U.S. investment-grade corporate spreads as of Nov. 5, but without the same exposure to corporate borrowers. \"In the U.S., high-quality securitized products such as agency mortgage-backed securities and non-agency residential MBS may provide meaningful uncorrelated exposure to the AI theme while still offering decent excess carry versus the broader investment grade market,\" Karoui said. Higher-rated private mortgage bonds PIMCO also pointed to senior, AAA-rated portions of bonds backed by mortgages that do not qualify for the Qualified Mortgage category under federal ability-to-repay rules. Here, Karoui said that in AAA-rated non-qualified mortgage tranches, the \"potential benefits likely outweigh risks.\" Specifically, the risk stems more from repayments taking longer than expected, rather than the risk that borrowers will fail to pay. That risk has pushed returns higher, while certain newer deals are structured to repay senior investors more quickly and offer protection against losses. \"We think the repricing in AAA non-QM creates an intriguing opportunity,\" Karoui said. \"Wider spreads largely compensate investors for extension risk and structural risk tied to materially higher expected credit losses, and today's new issues embed better mitigations against those risks than earlier deals.\" Emerging market debt Bonds issued by emerging market governments and companies offer another diversification play to U.S. Big Tech. \"Although there are pockets of EM with meaningful AI exposure, notably South Korea and Taiwan, much of that is an equity story rather than a fixed income one,\" said Karoui. \"For bond portfolios, EM debt therefore remains a relatively differentiated source of yield, duration, and country-specific risk.\" He zeroed in on U.S. dollar-denominated emerging market investment-grade \"semi-liquid\" bond deals — used to finance infrastructure investment — noting they have offered a median pickup of around 40 basis points this year compared to plain vanilla EM bonds. He also flagged opportunities beyond the main benchmarks, including in commodity-exporting countries, while noting that in local-currency bonds, exchange-rate swings can add to returns or erode them. \"To be clear, it is not that EM is a lower-risk asset class. Rather, it is that EM debt is exposed to a mix of political, fiscal, and monetary forces that are different than the risks facing the domestic U.S. market,\" Karoui said. Donald Trump Jr. exits advisory role at Kalshi prediction market Ananya Chetia 2 hours ago Stocks could be in for a rude awakening if the Fed hikes rates more than expected Sarah Min 37 min ago Nasdaq Composite slides as Nvidia shares tumble on Jensen Huang’s exit; oil prices jump Sean Conlon 7 min ago Read More","published_at":1794466799000,"mutable":false,"date_precision":"timestamp","modified_at":1794466799000,"extraction":"body_fallback","canonical":"https://cnbc.com/2026/11/12/ai-credit-debt-bond-markets-pimco.html","content_hash":"d15e76f64a3b47575849e5761946b795da662b97f6ca4473e0fcd8ccd46b0952","access":"public","evidence_status":"article","id":"601985f4b1078897","source_family":"cnbc-realestate","is_research":false,"required_source":false,"first_seen_at":1794519452247,"acquisition_window":{"lower":1794430800000,"upper":1794517200000},"score":19,"tags":["mixed-asset","national","trend","institutional"],"heat_signals":["fed","freddie mac","fannie mae","forecast"],"editor_evidence":[{"id":"title","text":"AI borrowers now drive nearly half of long-dated U.S. IG issuance. PIMCO sees 3 diversifiers"},{"id":"body-1","text":"Skip Navigation Markets Business Investing Tech Politics & Policy Video Watchlist Investing Club PRO Livestream Menu Artificial intelligence-related borrowing is becoming a larger share of long-dated U.S."},{"id":"body-2","text":"corporate debt — prompting investors to look beyond Big Tech for credit diversification."},{"id":"body-3","text":"Investors could consider agency mortgage-backed securities, higher-rated private mortgage bonds and emerging market debt as credit portfolio diversifiers in a corporate debt market increasingly shaped by the AI build-out, according to Lotfi Karoui, managing director and multi-asset strategist at PIMCO."},{"id":"body-4","text":"
