e top ten by change in spending. All ten experienced a growth rate of at least 1.7% year-over-year with a large concentration in smaller states. Only two of the top ten states by market share had a positive growth rate for the quarter (North Carolina and Illinois). Additionally, there was a fairly even split between states that had a negative growth rate (26) and those that had a positive growth rate (24) for the quarter, resulting in 0.0% average across all states. This corroborates NAHB’s forecast for the industry which expects inflation-adjusted spending to be flat-to-down for 2026. To learn more about this resource and its methodology, please visit NAHB’s SPR web page . state data , State Projections of Remodeling (SPR) Prev Previous Hiring Rebounds in October, but Residential Construction Employment Declines Next Residential Building Worker Wage Growth Rebounds, but Real Wages Continue to Decline Next Leave a Reply Cancel reply Your email address will not be published. Required fields are marked * Comment * Name * Email * Website Yes, add me to your mailing list Share this Page Subscribe to Blog Subscribe Search by Category Video Updates View Please leave this field empty Subscribe to Blog via Email Email Frequency * Instant Daily Weekly Check your inbox or spam folder to confirm your subscription. Construction Statistics Single-Family Multifamily Remodeling Labor Force Construction Wages Employment Data Job Openings Finance Builder Loans Consumer Finance Mortgages Home Sales and Prices Housing Affordability Housing Prices Housing Sales Macroeconomics Federal Reserve GDP Inflation Market Trends Housing Characteristics Housing Demand Industry Demographics Policy Research Building Materials Homeownership Tax Policy Local Data NAHB Indices Research Studies","published_at":1794236700000,"source_family":"nahb-eyeonhousing","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794260239293,"id":"015040106deec42d","acquisition_window":{"lower":17 ortgages that are in default,” Macerich CEO Jackson Hsieh said on the call. “Lenders are listening or whatever, it's not very fair. So let's just say we are in default. We're still having conversations, and we'll let you know when we got more to say, but that's what it is.” Macerich is in the midst of a multiquarter plan to rebalance its portfolio and improve its balance sheet by offloading a number of underperforming properties, with a goal of selling or giving back $300M to $400M in assets and land. The company is on track to achieve that objective this year and has sold about $290M worth of dispositions this year to date, Macerich Chief Financial Officer Daniel Swanstrom said on the call. Macerich reported a $16.7M loss in the quarter, though that was an improvement from the same period last year, when it reported an approximately $90M loss, according to filings with the Securities and Exchange Commission . The Niagara outlet mall is on the disposition list. Its loan has been modified twice already, including a three-year extension when it originally matured in 2020 and another after missing its 2023 maturity date, CoStar News reported. Its occupancy has dropped as low as 60% in recent years. The Fresno mall is not on the list of properties for sale. There, Macerich is in the middle of large-scale renovations to public spaces and is adding new tenants, including a $22M Dick's House of Sport, which is expected to open by mid-2028. The mall's special servicer is negotiating terms that would temporarily hold off enforcement of the loan default. Macerich is also still acquiring properties. On its earnings call, Hsieh teased an off-market mall purchase that is under contract now and should close by the end of the year. Malls broadly have been on a rebound. Values were up 13% over the past year, more than double the increase in all CRE prices, The Wall Street Journal reported in September . Continue reading this story with a free account Log in or register Related Topics: Macerich , Malls","published_at":1794254906000,"mutable":false,"date_precision":"timestamp","modified_at":1794254913000,"extraction":"semantic","canonical":"https://bisnow.com/news/national/retail/macerich-defaults-on-nearly-400m-in-mall-debt","content_hash":"503f64917e9d250b4f96497392fe673517968a4ef41ac7e2a29718dd794c9398","access":"public","evidence_status":"article","id":"e981a73045bfb385","source_family":"bisnow","is_research":false,"required_source":false,"first_seen_at":1794260239293,"acquisition_window":{"lower":1794171600000,"upper":1794258000000},"score":17,"tags":["retail","national","distress","institutional"],"heat_signals":["occupancy"],"keep":true,"importance":4,"section":"cre","capital_focus":false,"geo_evidence":"Fashion Outlets of Niagara Falls in New York","duplicate_of":null,"selector_reason":"Macerich披露多笔大型购物中心贷款违约，涉及近4亿美元且处于资产负债表调整背景，属于显著零售CRE压力信号。","title_zh":"Macerich 两处商场贷款违约近 4 亿美元","summary_zh":"Macerich 宣布两处商场贷款违约，合计 3.99 亿美元；公司同时推进出售或交还 3 亿至 4 亿美元资产，以调整投资组合和改善资产负债表。","impact":"long-neg","evidence_quote":"Macerich has defaulted on $399M in mall loans across two properties, the company announced in its third-quarter earnings call.","evidence_basis":"body","cre_subcategory":"零售"},{"source_id":"redfin-news","source_name":"Redfin News","source_tier":"A","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"For Every Condo Buyer in the U.S., There Are More Than Two Sellers. That Gives Condo Buyers Strong Negotiating Power.","link":"https://www.redfin.com/news/condo-fall-2026/","description":"For Every Condo Buyer in the U.S., There Are More Than Two Sellers. That Gives Condo Buyers Strong Negotiating Power. Published on November 9th, 2026 by Dian Zhang and Asad Khan There were 123% more condo sellers than buyers nationwide in September, the widest gap since 2013, giving buyers extraordinary negotiating power. The number of condo buyers fell to its lowest level in 13 years, while the number of sellers ticked up. San Antonio had the country’s widest seller surplus, with more than five times as many condo sellers as buyers. Houston ranked second, followed by Miami at 274%. Only three metros had more condo buyers than sellers, led by Nassau County, NY, Newark, NJ and Milwaukee, WI. Condo buyers today have more negotiating power than they’ve had in at least 13 years. There were an estimated 123% more condo sellers than buyers nationwide in September, the largest gap in records dating back to 2013. The gap widened from 95.5% a year earlier. Redfin estimates the number of buyers using proprietary data on the typical time between a buyer’s first home tour and the closing of a purchase, along with MLS data on active listings and pending sales. The estimated number of sellers is based on active listings in the MLS. The figures in this report are national estimates. See the full methodology and explore the interactive dashboard . Redfin defines a buyer’s market as one with more than 10% more sellers than buyers, and a seller’s market as one with more than 10% more buyers than sellers. A market is considered balanced when the difference between sellers and buyers is within 10%. Other housing-market statistics, including median sale price, are based on Redfin’s analysis of MLS data. A buyer’s market doesn’t necessarily mean condos are affordable for buyers. The Number of Condo Buyers Fell to a Record Low The condo market has undergone a dramatic reversal since the pandemic-era homebuying boom. In September 2021, there were 25.1% fewer sellers than buyers. Five years later, the number of buyers fell 54%, while the number of sellers rose 36%. The shift has left sellers competing for a much smaller pool of potential buyers. The number of condo buyers fell to an estimated 88,460 in September, down 2.5 % from August and the lowest level in at least 13 years. Meanwhile, condo sellers totaled 197,248, up 0.9 % from the prior month. Several factors are weighing more heavily on the condo market than on the single-family home market. Rising insurance premiums, HOA fees and special assessments are making condos increasingly expensive to own, particularly in Florida and Texas , where hurricane risks and other natural disasters have contributed to higher insurance costs. That’s a problem for first-time buyers, who often turn to condos as a more affordable entry point into the housing market but lack equity from a previous home sale. While the condo market is challenging for buyers, those who can afford housing costs will have more power in negotiations. “For renters who have saved for a down payment and are ready to build equity, these buyer-friendly conditions are an opportunity,” said Asad Khan , a senior economist at Redfin. “Buyers have more options and a better chance of finding a place they like. Although condo prices and HOA fees remain relatively high, buyers have more room to negotiate price cuts, and condos are still generally more affordable than single-family homes.” The single-family market saw a similar trend in September, with the number of buyers dropping to a record low since 2013. Sellers outnumbered buyers by 53.7%–a wide gap, but less than half as wide as what we’re seeing in the condo market. The huge surplus of condo sellers over buyers is contributing to the record-breaking buyer's market in the overall housing market, which encompasses condos, townhouses and single-family homes Falling Condo Prices Offer Buyers Opportunities The national median condo sale price fell 0.8% to about $339,000 in September, the first year-over-year decline in five months. House hunters should keep in mind that the costs of buying and owning a condo extend beyond its purchase price, and those ongoing expenses can put additional pressure on buyers’ budgets. Rising homeowners association (HOA) fees and insurance premiums can push up the total monthly cost of ownership. Buyers should also consider the possibility of special assessments to cover major repairs or improvements to a building’s common areas. But for buyers who can afford the upfront costs of a condo and plan to stay put for several years, today’s buyer’s market may offer an opportunity. “Find a motivated seller and there are a lot of them,” said Cecilia Cordova , a Redfin Premier agent in Miami, who lives in a condominium herself. Researching the buildings you’d like to live in is the key to finding a financially healthy community and avoiding surprise assessment bills later, she said. Condo buyers have more options than they did years ago. “We have enough inventory for the next three to four years,” said Cordova. For prospective sellers? Cordova suggests considering renting their condo out for the time being. “If you really need to sell, the strategy is to list it lower than anybody else in the same building. It’s not time for you to try to experiment with a higher price,” she said. Today’s home prices and mortgage rates have made it harder for first-time homebuyers to enter the market, reducing demand for condos, which have traditionally served as an entry point to homeownership. The weekly average mortgage rate is 7.18% as of November 5, and home prices remain near historic highs. Sellers are increasingly dropping their asking prices to attract buyers, Redfin data shows. About 37% of condos that sold in September had a price reduction, compared with 16% during the pandemic-era housing boom five years earlier. The typical condo that sold in September spent 63 days on the market before going under contract, up from 35 days five years earli","published_at":1794229228000,"source_family":"redfin-news","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794260239293,"id":"85de194ad1e37fde","acquisition_window":{"lower":1794171600000,"upper":1794258000000},"score":12,"tags":["housing","national","data","trend"],"heat_signals":[],"date_precision":"timestamp","modified_at":1794233935000,"extraction":"semantic","canonical":"https://redfin.com/news/condo-fall-2026","content_hash":"c368bab27d4c3589d4b33e688159755b22b1d328ef39cdb7ab8124bc0a2e97fa","access":"preview","evidence_status":"preview","keep":true,"importance":4,"section":"national","capital_focus":false,"geo_evidence":"Houston ranked second","duplicate_of":null,"selector_reason":"Redfin估算全国公寓买卖双方失衡达到2013年以来最大，并列出休斯敦等市场差异，提供独立供需指标。","title_zh":"全国公寓卖家数量较买家多 123%","summary_zh":"Redfin 估计，9 月全国公寓卖家数量较买家多 123%，为 2013 年以来最大差距；公寓买家数量降至 13 年低位，买方议价能力显著增强。","impact":"short-neg","evidence_quote":"There were 123% more condo sellers than buyers nationwide in September, the widest gap since 2013, giving buyers extraordinary negotiating power.","evidence_basis":"body","cre_subcategory":null},{"source_id":"connect-cre","source_name":"Connect CRE","source_tier":"A","source_weight":7,"source_tags":["mixed-asset","deals"],"region":"national","title":"Crescent Completes 146-Unit Melissa BTR Community","link":"https://www.connectcre.com/stories/crescent-completes-146-unit-melissa-btr-community/","description":"Crescent Completes 146-Unit Melissa BTR Community Crescent Communities opened HARMON Melissa, a new 146-unit rental community offering townhome living in Melissa, Texas, one of North Dallas’ fastest-growing towns. Residents can choose from nine distinct three- and four-bedroom townhome floor plans ranging from 1,798 to 2,168 square feet. Every home includes an attached two-car garage. Rents range from $2,500 to $3,190 a month. Community amenities include a resident clubhouse with an open-air pavilion and a rsaltwater pool. Residents also have access to an on-site dog park, game lawn, and outdoor grilling and dining stations featuring a Big Green Egg smoker. Partners on the project include Kimley-Horn (civil engineer and landscape architect), NRP Group (general contractor), and Vinyet (townhome architect). HARMON Melissa is part of Crescent Communities’ expanding HARMON portfolio, supported through its second joint venturepartnership with an account managed by Heitman LLC. The venture will continue to make investments in high-quality, intentionally crafted communities in key growth markets including Arizona, Florida, Georgia, North Carolina, Tennessee, and Texas. Connect Inside The Story Crescent Communities About Mike Boyd Mike covers our Texas and Phoenix/Southwest regions. He is a veteran news reporter who spent 10 years in radio and television news, mostly in Tucson, Arizona. Following his career in the media, he spent ten years as a communications executive for a publicly traded development company. Mike is married with three boys and three Huskies. Order Reprints ◦ Development Apartment buildings for sale Check out the latest properties available on apartmentbuildings.com REO: Iconic at the Station | Stabilization Upside San Antonio, TX Texas + Affordable Housing Listing Status: Available Listing Type: Auction Price: $800,000 No. of Units: 75 Average Occupancy: 81 Year Built: 1964 Year Renovated: 2018 Opportunity Zone: No Price per unit: $10,666 Learn More 707 Kihekah Avenue Pawhuska, OK Texas + Apartment Buildings Listing Status: Available Listing Type: Call for offers Price: $900,000 No. of Units: 28 Opportunity Zone: No Price per unit: $32,142 Learn More View all apartments |Development Texas | Dallas-Fort Worth Apartments Crescent Completes 146-Unit Melissa BTR Community Mike Boyd November 9, 2026 Load More","published_at":1794243926000,"source_family":"connect-cre","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794260239293,"id":"5dc4898c1f5821bb","acquisition_window":{"lower":1794171600000,"upper":1794258000000},"score":20,"tags":["btr-sfr","dfw","construction","developer"],"heat_signals":["btr","texas","dallas"],"date_precision":"timestamp","modified_at":1794243933000,"extraction":"semantic","canonical":"https://connectcre.com/stories/crescent-completes-146-unit-melissa-btr-community","content_hash":"31c44e69cefa65f3451f4320669e932a9a82e5f66be8cbc8ebcf7bc3b274991b","access":"public", nager. The project team also includes GFF as architect, SJL Design Group as interior designer and LandDesign as landscape architect. SALES Ascent Real Estate Advisors acquired the 10-story Hillcrest Tower in Dallas from Albany Road Real Estate Partners. The building’s sale price was not disclosed, but the Dallas Central Appraisal District lists the property as being worth $16.3M for tax purposes. Hillcrest Tower was built in 1982 and renovated in 2022. The 168K SF office building at 12720 Hillcrest Road was 97% leased at the time of the deal. Ascent plans to build upon prior upgrades by refreshing the common areas and continuing to invest in move-in-ready spec-suites. Newmark represented the seller in the transaction. Dallas-based Sunwest Real Estate Group will provide property management services, and CBRE’s Trey Smith, Julee Amparo and Alix Kirby will lead leasing. *** Courtesy of Newmark The Colonnade at 15301, 15303 and 15305 North Dallas Parkway in Addison Cross Ocean Partners and Lincoln Property Co. acquired The Colonnade, a 1M SF office campus on nearly 12.5 acres along the Dallas North Tollway in Addison. The three-tower asset was sold through a receivership process on behalf of Trigild and CWCapital. The joint venture is committing $100M to reposition the property as a premier commercial hub for the market. Initial property improvements are underway, with the first phase of upgrades expected to be delivered throughout 2027. Newmark’s Stephen Schwalb, Chris Murphy, Robert Hill, Gary Carr and Austin Sheahan represented the seller in the transaction. Lincoln will provide management for the project, and the firm’s Jake Young, Christian Munoz and Hudson Dozier will lease the property. *** Mac Haik Auto Group purchased around 25 acres near the corner of Frontier Parkway and the Dallas North Tollway in Celina for a new 100K SF Chevrolet dealership. Mac Haik purchased the land from the family trust of Tom Mosey. Davidson Bogel Real Estate’s Ryan Turner, David Davidson Jr. and Edward Bogel represented the seller in the transaction. Mac Haik was represented by Sam Clayton and Adam Sheriff of Brown & Griffin Real Estate. *** California-based investor David Reid Properties purchased the nearly 38K SF Greenview Tech Centre Building E at 830 Greenview Drive in Grand Prairie. Built in 1981, the building offers flex industrial and office space. Marcus & Millichap’s Brad Mills marketed the property on behalf of the seller, a Florida-based investor, and procured the buyer. *** Dallas-based Paceline Equity Partners LLC and its joint venture partner, Aravest, sold the 308-key Renaissance Dallas at Plano Legacy West Hotel to Host Hotels & Resorts Inc. as part of a $374M deal that included another hotel in Brooklyn. Paceline and Aravest acquired Renaissance Plano in June 2023 and executed a strategy that added more rooms, reconfigured food and beverage outlets, and drove growth in room revenue and net operating income. CBRE Hotels served as exclusive adviser, while King & Spalding served as legal counsel to Paceline on the transaction. LEASES Denso International America Inc. renewed nearly 24K SF of flex space in the Plano Parkway Business Center I at 2701 W. Plano Parkway in Plano. Bradford Commercial Real Estate Services’ Brian Pafford and Jared Laake represented the landlord, 2701 Plano Parkway Ltd. Colliers’ Allyson Yost represented the tenant in the deal. CONSTRUCTION AND DEVELOPMENT Courtesy of Cadence McShane Construction The Flynn at Live Oak at 4931 Live Oak St. in Dallas Conor Commercial Real Estate completed development of The Flynn at Live Oak, a 327-unit luxury multifamily project at 4931 Live Oak St. in Dallas. The five-story building was developed as a joint venture investment between Conor Commercial, Globe Corp. and Origin Investments. JLL’s Dallas office assisted with the capital raise, while Wintrust Bank provided the construction loan. The development was designed by Merriman Anderson Architects and built by Cadence McShane Construction. The property will be managed by Greystar. *** Peachtree Group opened the 264-room, dual-branded AC Hotel Dallas Uptown and Moxy Dallas Uptown, offering two Marriott hospitality experiences at 2910 N. Hall St. Developed in conjunction with Phoenix Development Partners and operated by Peachtree’s hospitality management division, the property features 110 rooms at AC Hotel and 154 at Moxy. *** NewcrestImage opened The Clara Hotel Plano as part of the Tapestry Collection by Hilton following a complete renovation and rebranding. The company acquired the 176-room property at 8201 Preston Road in Plano last year as the NYLO Dallas Plano. PEOPLE District Development Partners added Carrie Bobb Shope as a partner. Shope brings more than 20 years of experience to the Dallas-based firm. Shope will lead retail strategy, merchandising and leasing execution for District Development Partners' portfolio of mixed-use and sports- and entertainment-anchored destinations nationwide. *** Affinius Capital LL","published_at":1794256101000,"mutable":false,"date_precision":"timestamp","modified_at":1794256141000,"extraction":"semantic","canonical":"https://bisnow.com/news/dallas-ft-worth/deal-sheet/trademark-and-morgan-to-build-luxury-apartments-in-oak-lawn-the-dfw-deal-sheet","content_hash":"0e44fa5b4e13c3cf3c8511125f74ff4ce31caac2cf8470099cb5f2db9dc69c1a","access":"public","evidence_status":"article","id":"c550e8463de998f7","source_family":"bisnow","is_research":false,"required_source":false,"first_seen_at":1794260239293,"acquisition_window":{"lower":1794171600000,"upper":1794258000000},"score":17,"tags":["multifamily","dfw","construction","developer"],"heat_signals":["dallas","dfw","austin"],"keep":true,"importance":3,"section":"sunbelt","capital_focus":false,"geo_evidence":"Dallas’ Oak Lawn neighborhood","duplicate_of":null,"selector_reason":"达拉斯Oak Lawn 362户公寓项目开工，提供规模、选址及预计交付时间，具有本地开发跟踪价值。","title_zh":"达拉斯 Oak Lawn 启动 362 户豪华公寓项目","summary_zh":"Trademark Property Co. 与 Morgan Group 在达拉斯 Oak Lawn 破土建设 362 户多户住宅项目，首批公寓预计于 2028 年秋季完成，全部交付预计在 2029 年第二季度。","impact":"short-pos","evidence_quote":"Trademark Property Co. and Morgan Group broke ground on their 362-unit community at 3900 Lemmon Ave. in Dallas’ Oak Lawn neighborhood.","evidence_basis":"body","cre_subcategory":null},{"source_id":"houston-agent","source_name":"Houston Agent Magazine","source_tier":"D","source_weight":6,"source_tags":["houston","brokerage"],"region":"texas","title":"Grange MPC begins second phase of development","link":"https://houstonagentmagazine.com/2026/11/09/grange-second-phase-of-development/?utm_source=rss&utm_medium=rss&utm_campaign=grange-second-phase-of-development","description":"Grange MPC begins second phase of development by Emily Marek November 09, 2026 The second phase includes Ricestead, Grange’s 20-acre amenity center. (via Johnson Development) Johnson Development’s Grange master-planned community in Katy has entered its second phase, with construction and sitework underway on an additional 500 homesites and a 20-acre amenity center. The new lots range from 40 feet wide up to 85 feet wide. The larger lots, which are new to the MPC, are suited for alley-access garages. Builders in this second phrase — including Highland Homes , J. Patrick Homes, David Weekley Homes, Newmark Homes, Chesmar Homes, Perry Homes, Drees Custom Homes, Westin Homes and Partners in Building — will receive 483 lots before the end of the year. “This is an exciting new chapter and a natural progression in our development of Grange,” the community’s vice president and general manager, Jacob Rice, said in a press release. “The demand is there for larger homesites which will allow our residents to move into more spacious homes in the community as their family needs dictate.” Construction is also underway on Ricestead , Grange’s 20-acre amenity center. Plans for the project include a resort-style pool, lap pool, pickleball and basketball courts and the Harvest Hall clubhouse, which will feature a fitness center and a co-working area. Space is also reserved for future retail offerings and a village green. “We view Ricestead as a modern-day town square where businesses and residents become true partners,” Rice added. “We envision people meeting for coffee, shopping local merchants and attending a concert or farmers market at the village green. Ricestead will move Grange from being a neighborhood to becoming a hometown.” Grange is currently home to over 500 residents in hundreds of new homes. Pricing in the community starts in the $300,000s. Read More Related to This Post New Jubilee homes earn IWBI WELL Residence certification InTown Homes building Avondale community in Spring Branch Tri Pointe begins construction, presales at 2 northwest Houston MPCs 1st Choice Development to add whole-home air quality system to new homes Houston homebuilders and developers honored at GHBA Houston’s Best PRISM Awards Lovett Homes to build gated community in Mid Lane New master-planned community, Peachtree, coming to Brazoria County The Trails expands builder lineup, announces new retail, amenity additions Join the conversation Cancel reply Save my name, email, and website in this browser for the next time I comment.","published_at":1794248415000,"source_family":"houston-agent","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794260239293,"id":"3b5406433eb986f7","acquisition_window":{"lower":1794171600000,"upper":1794258000000},"score":13,"tags":["housing","houston","construction","developer"],"heat_signals":["houston"],"date_precision":"timestamp","modified_at":0,"extraction":"semantic","canonical":"https://houstonagentmagazine.com/2026/11/09/grange-second-phase-of-development","content_hash":"5fba40694257bb2d0527a99710f9317445e59593a5cf541b41918cd355198f92","access":"public","evidence_status":"article","keep":true,"importance":3,"section":"sunbelt","capital_focus":false,"geo_evidence":"in Katy","duplicate_of":null,"selector_reason":"Katy大型总体规划社区进入第二期，新增500个住宅地块及配套设施，提供明确开发进度。","title_zh":"Katy Grange 二期新增 500 个住宅地块","summary_zh":"Johnson Development 的 Katy Grange 进入二期，施工覆盖新增 500 个住宅地块及 20 英亩配套中心；开发商称，对更大住宅地块的需求存在。","impact":"short-pos","evidence_quote":"Johnson Development’s Grange master-planned community in Katy has entered its second phase, with construction and sitework underway on an additional 500 homesites and a 20-acre amenity center.","evidence_basis":"body","cre_subcategory":null},{"source_id":"redfin-news","source_name":"Redfin News","source_tier":"A","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"Mortgage Rates Dip Ahead of a Big Week for Inflation Data","link":"https://www.redfin.com/news/economic-update-november-9/","description":"Mortgage Rates Dip Ahead of a Big Week for Inflation Data Published on November 9th, 2026 by Chen Zhao In A Nutshell: Mortgage rates are coming down as investors dial back expectations for rate hikes. But that could change: Key inflation data comes out this week. Last Week’s Highlights Two highlights from a busy election week: The landslide win for Democrats could impact markets in two ways. One, markets are starting to price in some political risk to the AI boom because Democratic officials are expected to limit the buildout of data centers. Two, there’s now a higher likelihood of stalemates during budget negotiations and debt limit increases. Friday’s jobs report barely made a splash, even though it was significantly stronger than expected. The economy is now adding about 100,000 jobs per month, likely a bit above the breakeven rate given the low rate of immigration. The unemployment rate remains at historical lows and wages are still increasing 3.1% annually. Upcoming Attractions This week’s economics highlight is the CPI inflation data coming Tuesday, coupled with Friday’s PPI data. Together, the two will form a complete picture of the core PCE inflation measure the Fed uses. The consensus forecast has core CPI coming in at 0.2% month-over-month, down slightly from last month. Forecasters are expecting a small statistical distortion in the data due to last year’s government shutdown. A very low read for inflation might convince the Fed to hold off on hiking rates at the December meeting, but they could just as easily write it off as one data point. They would evaluate how broader financial conditions have changed since the last meeting, including any further improvement in rates. Many Fed officials are holding speaking engagements this week. The ones to watch are Dallas Fed President Lorie Logan on Tuesday; Vice Chair Michelle Bowman on Monday, Tuesday, and Friday; Cleveland Fed President Beth Hammack on Thursday; and New York Fed President John Williams on Thursday. Latest Housing Market Reports Weekly Housing Market Update: Homebuyers Get Some Relief as Prices Decline For Third Straight Week, Monthly Payments Dip For Every Condo Buyer in the U.S., There Are More Than Two Sellers. That Gives Condo Buyers Strong Negotiating Power. Chen Zhao Chen Zhao is the head of economics research, where she produces research on the housing market for public and internal audiences. Previously, she was an executive director leading housing finance and financial markets research at the JPMorgan Chase Institute. Prior to joining JPMCI, Chen was an economics consultant at Analysis Group, Inc., where she worked on financial litigation cases and led teams conducting health economics and outcomes research on behalf of pharmaceutical companies. While in graduate school, Chen was with the Center for Economic Studies and the Social Economic and Housing Statistics Division at the US Census Bureau, where she conducted applied microeconomics research using large scale restricted-access linked survey-administrative data. She started her career at the White House Council of Economic Advisers, where she focused on labor and health economics. Email Chen Get a home loan that helps you win Get prequalified Join us on X for more #housingmarket updates Follow Us You Might Also Like Mortgage Rates Drop From September Highs as Midterms and Jobs Data Loom Fed Holds Rates Steady, But Sets Up a December Hike Geopolitics and AI to Drive Mortgage Rates This Week as an October Fed Rate Hike Appears Unlikely Core Inflation Tops Forecasts, Making an October Fed Rate Hike a Close Call All Eyes on Wednesday’s Inflation Report as Markets Weigh How Many More Fed Hikes Are Left Mortgage Rates Tick Up Even as the Odds of a Fed Rate Hike Decline Soft September Jobs Report May Give Fed Reason to Pause Rate Hikes, Slowing Ascent of Mortgage Rates Be the first to see the latest real estate news: Facebook This field is for validation purposes and should be left unchanged. Email * Sign up By submitting your email you agree to Redfin’s Terms of Use and Privacy Policy Add Redfin as a preferred source on Google &times; Scroll to Top","published_at":1794244836000,"source_family":"redfin-news","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794260239293,"id":"b0ef92d71d0c4b25","acquisition_window":{"lower":1794171600000,"upper":1794258000000},"score":20,"tags":["housing","national","rates","macro","lender"],"heat_signals":["rate hike","inflation","mortgage rate"],"date_precision":"timestamp","modified_at":0,"extraction":"semantic","canonical":"https://redfin.com/news/economic-update-november-9","content_hash":"84a2b2b1ceb846196f4d73587a6c5feb21b85d44af48bd803a2486a8a50eac81","access":"preview","evidence_status":"preview","keep":true,"importance":3,"section":"national","capital_focus":false,"geo_evidence":null,"duplicate_of":null,"selector_reason":"报道按揭利率回落及即将公布的通胀数据，并提供就业、工资和市场定价背景；属有参考价值的全国利率与宏观观察。","title_zh":"抵押贷款利率回落但通胀数据成关键变量","summary_zh":"Redfin 表示，投资者降低对加息的预期推动抵押贷款利率下行，但本周 CPI 和 PPI 数据可能改变判断；美国经济每月新增就业约 100,000 个。","impact":"neutral","evidence_quote":"Mortgage rates are coming down as investors dial back expectations for rate hikes. But that could change: Key inflation data comes out this week.","evidence_basis":"body","cre_subcategory":null},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Pro-housing coalition presses Senate on BAAJA permitting reforms","link":"https://www.housingwire.com/articles/pro-housing-coalition-baaja-reforms/","description":"A coalition of national housing organizations, homebuilders and 58 local pro-housing groups is urging Senate leaders to pass the Bipartisan American Affordability and Jobs Act (BAAJA), arguing its permitting reforms could sharply cut timelines and costs for federally supported housing. In a letter to key Senate committee leaders, co-led by Inclusive Abundance Action and summarized in a public statement Monday, the coalition backs the housing provisions in BAAJA (S. 5653), the Senate’s bipartisan permitting reform package. The groups say the bill could “transform how quickly federally supported housing gets built,” even though most public attention on BAAJA has focused on its energy and infrastructure impacts rather than its potential to accelerate affordable and multifamily projects. What BAAJA could change for housing Today, federally assisted affordable and multifamily housing typically faces National Environmental Policy Act (NEPA) reviews and National Historic Preservation Act (NHPA) reviews that do not apply to most private-market projects. Affordable housing developers report delays of a year or more to clear environmental review and up to three months just to document that a project is exempt, according to the letter. The coalition highlights several housing-specific changes in BAAJA that it says would help the following areas: Streamlined federal reviews: Projects using federal grants, loans or loan guarantees that are not primarily preservation-focused would no longer automatically trigger a federal historic preservation review, the groups say. The bill would also narrow and streamline when NEPA applies, allow qualified state or Tribal reviews to substitute for federal review, expand categorical exclusions and set clearer timelines. Potential savings per project: Streamlined Clean Water Act reviews could save up to an estimated $425,000 per project, according to materials cited by the coalition. Faster deployment of HUD dollars: At least $10 billion a year in U.S. Department of Housing and Urban Development funding could move more quickly under the bill’s changes, including Community Development Block Grants (CDBG), HOME funds, public housing capital and operating funds, and HUD loan programs, the coalition says. Building on prior reforms: BAAJA would extend and expand permitting reforms already enacted in the 21st Century ROAD to Housing Act , which Congress passed earlier this year with bipartisan majorities. For developers and public housing agencies that rely on layered federal funds, the changes would primarily affect front-end approvals rather than long-term compliance. But the groups argue that shaving months off NEPA and related reviews would materially improve feasibility for marginal projects and reduce soft costs. Who is backing the bill? The signatories span national trade groups, think tanks and local YIMBY organizations. Organizations named in the public statement include: National Association of Home Builders National Community Development Association Council of State Community Development Agencies National Housing &amp; Rehabilitation Association National Association of Home Builders Institute for Progress Niskanen Center Center for Public Enterprise Action Fund Up for Growth Action YIMBY Action They are joined by 58 local pro-housing or “Yes In My Backyard” (YIMBY) groups from across the country, according to the coalition’s announcement. The attached letter, addressed to Senate committee leadership, urges lawmakers to preserve and enact the housing-related provisions as part of any final permitting package. Why this matters The push around BAAJA highlights a growing focus on federal permitting as a bottleneck for subsidized housing, separate from local zoning and entitlement risk. For developers and public agencies, the proposed changes could mean: Shorter and more predictable federal review timelines on projects using HUD and other federal funds. Greater ability to rely on state or Tribal environmental review processes instead of duplicative federal NEPA reviews. Lower predevelopment and legal costs tied to environmental and historic preservation compliance. Related More: Homebuilders Housing Policy","published_at":1794244374000,"source_family":"housingwire","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794260239293,"id":"dea65628e41aec1a","acquisition_window":{"lower":1794171600000,"upper":1794258000000},"score":17,"tags":["mixed-asset","national","policy","developer"],"heat_signals":["fed"],"date_precision":"timestamp","modified_at":1794244376000,"extraction":"semantic","canonical":"https://housingwire.com/articles/pro-housing-coalition-baaja-reforms","content_hash":"6d814e3a95e719692a99af6487c50c84ca75a2e8ad32b04269e5c72915b090c7","access":"public","evidence_status":"article","keep":true,"importance":3,"section":"cre","capital_focus":false,"geo_evidence":null,"duplicate_of":null,"selector_reason":"全国住房组织及开发商联盟推动联邦许可改革，所述提案可能影响联邦支持的可负担及多户住宅审批时长。","title_zh":"住房组织推动 BAAJA 简化联邦审批","summary_zh":"住房组织、建商及 58 个地方团体敦促参议院通过 BAAJA，称其中的许可改革可缩短联邦支持住房项目的审批时间并降低成本，但法案影响仍属倡议方判断。","impact":"neutral","evidence_quote":"The groups say the bill could “transform how quickly federally supported housing gets built,” even though most public attention on BAAJA has focused on its energy and infrastructure impacts rather than its potential to accelerate affordable and multifamily projects.","evidence_basis":"body","cre_subcategory":"跨资产"},{"source_id":"rebusiness-online","source_name":"REBusiness Online","source_tier":"A","source_weight":6,"source_tags":["mixed-asset","deals"],"region":"national","title":"Larkspur Capital Begins Leasing 219-Unit Multifamily Project in Dallas","link":"https://rebusinessonline.com/larkspur-capital-begins-leasing-219-unit-multifamily-project-in-dallas/","description":"Larkspur Capital Begins Leasing 219-Unit Multifamily Project in Dallas by Taylor Williams November 9, 2026 November 9, 2026 4 DALLAS — Locally based developer Larkspur Capital has begun leasing The Juniper , a 219-unit multifamily project in Dallas. The site is located within a Qualified Opportunity Zone at 4003 Commerce St. in the Exposition Park area of Dallas. The site spans 1.4 acres, and the property feature studio, one- and two-bedroom units in addition to townhomes, penthouses and ground-floor retail space. Amenities include a pool, dog park, fitness center, multiple lounges, pickleball courts, outdoor grilling and dining stations and a clubhouse. Corgan designed the project, with Faulkner Design Group handling interior architecture. OHT Partners served as the general contractor. Rents start at roughly $1,600 per month for a studio apartment. Facebook Twitter Linkedin Email previous post Logistics Property Co. Breaks Ground on 217,758 SF Industrial Project in Metro Houston next post Marcus & Millichap Brokers Sale of 950-Unit Self-Storage Portfolio in Metro Fort Worth You may also like Marcus & Millichap Brokers Sale of 950-Unit Self-Storage... November 9, 2026 Logistics Property Co. Breaks Ground on 217,758 SF... November 9, 2026 Lee & Associates Negotiates 87,730 SF Industrial Lease... November 9, 2026 Berkadia Provides $219M in Agency Permanent Loan for... November 9, 2026 IPA Negotiates Sale of 71-Unit Apartment Building in... November 9, 2026 Walker & Dunlop Arranges $110M Financing for Multifamily... November 9, 2026 Blue Steel Acquires 309 Acres Near Louisville, Plans... November 9, 2026 Northmarq Negotiates Sale of 350-Unit Apartment Community in... November 9, 2026 TruAmerica Multifamily Breaks Ground on 154-Unit Townhome Community... November 9, 2026","published_at":1794240125000,"source_family":"rebusiness-online","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794260239293,"id":"dd3333ba31b69c93","acquisition_window":{"lower":1794171600000,"upper":1794258000000},"score":13,"tags":["multifamily","dfw","construction","developer"],"heat_signals":["dallas"],"date_precision":"timestamp","modified_at":1794240126000,"extraction":"semantic","canonical":"https://rebusinessonline.com/larkspur-capital-begins-leasing-219-unit-multifamily-project-in-dallas","content_hash":"33be52c1ff18f0d35901f395c65342768aa97f23c3141039170dc2164ebb6c6b","access":"public","evidence_status":"article","keep":true,"importance":3,"section":"sunbelt","capital_focus":false,"geo_evidence":"Multifamily Project in Dallas","duplicate_of":null,"selector_reason":"达拉斯219户公寓项目启动出租，提供新交付、户型及起租水平等本地供给信息。","title_zh":"达拉斯 219 户 The Juniper 开始招租","summary_zh":"Larkspur Capital 开始出租达拉斯 Exposition Park 的 The Juniper，共 219 户，含住宅、联排、顶层公寓及底层零售空间，单间户型起租约 1,600 美元。","impact":"short-pos","evidence_quote":"Locally based developer Larkspur Capital has begun leasing The Juniper , a 219-unit multifamily project in Dallas.","evidence_basis":"body","cre_subcategory":null},{"source_id":"nahb-eyeonhousing","source_name":"NAHB Eye on Housing","source_tier":"B","source_weight":8,"source_tags":["data","trend","policy"],"region":"national","title":"Residential Building Worker Wage Growth Rebounds, but Real Wages Continue to Decline","link":"https://eyeonhousing.org/2026/11/residential-building-worker-wage-growth-rebounds-but-real-wages-continue-to-decline/","description":"Residential Building Worker Wage Growth Rebounds, but Real Wages Continue to Decline November 9, 2026 Jing Fu No Comments Wage growth for residential building workers showed signs of a modest rebound in September 2026 following a sharp slowdown earlier in the year. According to the latest data from the U.S. Bureau of Labor Statistics , nominal wage growth picked up from its June pace, although it remained relatively modest. After adjusting for inflation, real wages continued to decline, indicating persistent pressure on workers’ purchasing power. In nominal terms, average hourly earnings (AHE) for residential building workers increased 2.8% year-over-year in September 2026, reaching $40.69 per hour. This marked an acceleration from the 1.2% year-over-year increase recorded in June 2026. After accounting for inflation, real wages declined 0.9% year-over-year in September 2026 to $12.1 per hour. Real wage growth strengthened temporarily during parts of 2024, reaching a peak of 6.2%, but has since weakened as nominal wage gains moderated and inflation continued to erode purchasing power. Meanwhile, the number of open, and unfilled construction sector jobs increased in September. Continued strength in construction-related activity, including data center construction, is supporting demand for construction workers. Despite the recent moderation in wage growth, residential building workers continue to earn relatively competitive wages compared with workers in other industries: 9.8% higher than the manufacturing sector ($37.06 per hour) 24.5% higher than the transportation and warehousing sector ($32.68 per hour) 3.6% lower than the mining and logging sector ($42.23 per hour) Note: Data used in this post relates to all employees in the residential building industry. This group includes both new single-family housing construction (excluding for-sale builders) and residential remodelers but does not include specialty trade contractors. average hourly earnings , Bureau of Labor Statistics (BLS) , residential building workers , wage growth Prev Previous Remodeling Activity Holds Flat in Second Quarter Amid Housing Slowdown Leave a Reply Cancel reply Your email address will not be published. Required fields are marked * Comment * Name * Email * Website Yes, add me to your mailing list Share this eal wages declined 0.9% year-over-year in September 2026 to $12.1 per hour.","evidence_basis":"body","cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"'Certainty Will Be The Buzzword': Stability, Not Sea Change, For CRE Post-Midterm","link":"https://www.bisnow.com/news/national/commercial-real-estate/-certainty-will-be-the-buzzword-stability-not-sea-change-for-cre-post-midterm","description":"The implications of an overwhelming Democratic midterm victory reverberated through markets in the second half of last week, reflecting skittishness among investors and business leaders over fears about the impact on the largest driver of today's economy: data center growth. Despite these initial shocks, there is a quiet expectation that a Democratic Congress will help bring calm to a period of significant economic volatility stemming in part from the unpredictable policymaking that has emerged during President Donald Trump 's second term. “Maybe ‘uncertainty’ was the buzzword of the last year, and hopefully ‘certainty’ will be the buzzword going forward,” said Jeff DeBoer , CEO of the Washington, D.C.-based trade group The Real Estate Roundtable . “We're much more certain that we're not going to wake up every day and have another wild fluctuation in some sort of policy.” Unsplash/Sebastian Schuster That semblance of certainty won't be a panacea, however. Major relief from the ubiquitous issues for commercial real estate today, including higher costs, low labor availability and expensive debt, is unlikely to come from the new Congress because those issues are closely tied to Trump's executive actions and powers. But housing affordability, the economy more generally and data centers were on the ballot in races around the country, where the results have set the stage for a string of policy debates that will hit landlords and investors. “If you look back in history, there are a number of examples where a great amount of very positive legislation has been done when there's divided government,” DeBoer said. “I'm not one who says, ‘Put your feet up, nothing's going to happen, we're in for gridlock.’ I think there's going to be some significant legislation.” Stock traders initially reacted positively to the midterm results, with all three major indexes climbing, but the mood changed Thursday. A massive sell-off focused on tech stocks but spread marketwide sucked $2.5T in market value out of the Nasdaq and pushed the index into correction territory. By Friday, the dust had settled and markets opened by gaining back some of Thursday’s losses. Investors are trying to reprice their bets on the pace of the artificial intelligence infrastructure build-out as they weigh the prospect of a Congress that is more skeptical of the major tech firms’ plans and a wave of local fervor against data centers that drove voters to the polls. AI and data centers emerged as a key political flashpoint, with more than half of respondents telling an NBC exit poll that it was a crucial or major factor in their decision to vote in the midterms. Across statewide races and referendums, voters roundly supported measures putting limits on data center development in more than 40 local ballot measures . “This election, whether federally or on the local level, was influenced by data centers,” said Commercial Real Estate Development Association CEO Marc Selvitelli. “This was the rare bipartisan issue that was out there right now.” The economy emerged as the top issue for voters headed into the election after the U.S. war with Iran drove up energy costs and added to already elevated inflation. The president’s tariffs are also contributing to the rising costs, but the Democratic sweep in Congress still has limited reach into trade policy that’s coming directly from the White House. \"The swing in Congress, the results of the election, are very unlikely to have a significant impact on the president's trade agenda and the tariffs that are in place,\" Blake Harden, managing director for trade policy at ​ Ernst & Young 's Washington Council office, told Reuters . \"This is because there is so much trade authority within the executive branch that's been delegated by Congress.\" Unsplash/Jesse Paul Democrats have floated the idea of changing the tariff laws the president is relying on to impose his protectionist trade regime, but the party would need to win over some Republicans because it remains short of a veto-proof majority. They’re also working on a plan to roll back Trump’s tariffs directed at Canada, The Wall Street Journal reported Thursday. “The midterm election results are unlikely to materially influence commercial real estate performance,” Cushman & Wakefield analysts wrote in a postelection report . A divided government adds some degree of fiscal policy stability that “should be calming for markets,” although the U.S. war in Iran and the downstream impacts on prices and inflation remain the greatest “swing factor for inflation and rates,” they wrote. The election was at least in part a referendum on the war in Iran, according to Hans Nordby , executive managing director of research and investment analytics at Transwestern . “And it was a ‘no’ vote,” Nordby wrote in an email to Bisnow on Friday. “The new Congress could defund the war or otherwise force a withdrawal. If that were to happen, it would seem likely that oil prices could retreat to prewar levels, which would put downward pressure on inflation.” The war and its economic fallout, particularly on the price of oil, has been a thorn in CRE's side since it broke out in February. The rising cost of oil has contributed to overall inflation remaining elevated, which in turn has kept borrowing rates higher. Yields for 10-year U.S. Treasury bonds , a key benchmark rate for all sorts of debt costs, notched lower following the midterms after climbing above 5% in October before retreating, shedding 6 basis points Wednesday and continuing to trade below 4.9% through Friday. The shift in Congress likely sets the stage for bitter political fights between Trump and Democrats, some of whom have pledged to launch investigations into the White House. But an expectation in policymaking circles is that there’s room for some legislation to be passed. Trump has shown a willingness to adopt bipartisan deals even if they don’t carry his own legislative priorities, with the 21st Century Road to H","published_at":1794174492000,"mutable":false,"date_precision":"timestamp","modified_at":1794191495000,"extraction":"semantic","canonical":"https://bisnow.com/news/national/commercial-real-estate/-certainty-will-be-the-buzzword-stability-not-sea-change-for-cre-post-midterm","content_hash":"05b0807d3334bbcd7c8de85168a3b2c82757058b1f094b01c5d011324dac800f","access":"public","evidence_status":"article","id":"24e07136f99ce848","source_family":"bisnow","is_research":false,"required_source":false,"first_seen_at":1794205331178,"acquisition_window":{"lower":1794171600000,"upper":1794258000000},"score":16,"tags":["mixed-asset","national","macro","trend"],"heat_signals":["fed","inflation"],"keep":true,"importance":3,"section":"cre","capital_focus":false,"geo_evidence":null,"duplicate_of":null,"selector_reason":"报道选举后CRE市场对政策确定性、数据中心投资及融资环境的看法，属有参考价值的行业情绪综述，但无独立量化研究。","title_zh":"中期选举后 CRE 关注政策确定性","summary_zh":"The Real Estate Roundtable 首席执行官预计，分裂政府可能带来立法机会，但新国会不太可能迅速缓解 CRE 面临的高成本、劳动力短缺和高融资成本。","impact":"neutral","evidence_quote":"Major relief from the ubiquitous issues for commercial real estate today, including higher costs, low labor availability and expensive debt, is unlikely to come from the new Congress because those issues are closely tied to Trump's executive actions and powers.","evidence_basis":"body","cre_subcategory":"跨资产"},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"loanDepot's Q3 loss grows while it chases 2027 break-even","link":"https://www.housingwire.com/articles/loandepot-q3-2026/","description":"loanDepot widened its net loss in the third quarter of 2026 as it sold mortgage servicing rights (MSRs), repurchased debt and leaned into higher-margin products. The California-based nonbank lender reported a $29 million net loss in Q3, compared with a $7 million loss in the prior quarter, according to its earnings release Monday. Founder and CEO Anthony Hsieh told analysts that the quarter was challenged by unexpectedly higher interest rates but said the company remains focused on gaining market share despite depressed volumes. “Getting over the seasonality of Q4 and Q1, and of course not knowing where the market will end up next year, but if it stays at this level, we are very confident that we'll get to a break even of profitability by first half or mid next year,” Hsieh said. loanDepot originated $7.05 billion in mortgages in the third quarter, down 12% from the prior quarter but up 7.8% year over year. Purchase loans made up more than 61% of total volume. On a unit basis, originations rose 7% quarter over quarter, helped by the company’s expansion into home equity products. Management said loanDepot estimates it ranked among the top three nonbank home equity lenders in the third quarter based on volume, a shift that helped push gain-on-sale margin to 399 basis points, up 54 basis points from the second quarter. “Since my return last year, we increased origination volume by 8%, grew unit volume by 33%, increased purchase volume by 10%, improved return on marketing by 14%, and reduced our cost to produce by 16%,” Hsieh said. “These results reflect the success of our ongoing efforts to diversify revenue sources, increase operating efficiency, and improve the scalability of our platform.” The company now expects its productivity and efficiency initiatives to deliver $25 million in annualized cost savings through the remainder of 2026, more than double the previous estimate of $12 million. MSR sales fund deleveraging push loanDepot continued to shrink its balance sheet and reduce debt through MSR sales in the quarter. The company closed the sale of $10 billion in agency MSRs and agreed to sell an additional $9 billion in government MSRs, a transaction expected to close in October. After these moves, loanDepot’s servicing portfolio stood at $115.7 billion at the end of the quarter. Proceeds were used to repurchase $87 million of senior notes at an average price of 88% of par. Chief Financial Officer David Hayes said the combination of MSR sales and debt repurchases reduced net debt obligations by about $114 million, strengthened liquidity and improved financial flexibility. Even with those steps, leverage remains elevated. Debt obligations, net to total equity, were 6.5x at the end of the quarter, up from 4.8x a year earlier. Hayes said the company is working “actively” to address nearing debt maturities and is pursuing financing options to refinance or extend with financing counterparties ahead of 2027 bond maturities. He did not provide more details during the calls with analysts. Guidance Looking to the fourth quarter of 2026, loanDepot guided to origination volume between $4.5 billion and $6.5 billion, implying potentially lower production than Q3. However, it expects gain-on-sale margin between 315 basis points and 355 basis points. Management framed the outlook as a continuation of the pivot toward more profitable products, a larger purchase footprint and a leaner cost base in the face of persistent rate pressure. “While elevated interest rates remain a headwind for mortgage demand, we believe the actions we have taken to diversify our product offerings, expand our purchase market presence, improve efficiency, strengthen margins, and optimize our balance sheet have positioned loanDepot to emerge from this cycle as a stronger and more competitive company,” Hsieh said in a statement. “We remain focused on growing market share, improving profitability, and creating long-term value for our shareholders.” Related More: Earnings loanDepot","published_at":1794251331000,"source_family":"housingwire","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794260239293,"id":"4859c61f966ef9a9","acquisition_window":{"lower":1794171600000,"upper":1794258000000},"score":15,"tags":["housing","national","earnings","lender"],"heat_signals":[],"date_precision":"timestamp","modified_at":1794251333000,"extraction":"semantic","canonical":"https://housingwire.com/articles/loandepot-q3-2026","content_hash":"5fe01f84b55e1ca8b7fe056ac9929ab61bc0de8f9c86fd0db19d2f0b6b6ab75c","access":"public","evidence_status":"article","keep":true,"importance":3,"section":"national","capital_focus":false,"geo_evidence":null,"duplicate_of":null,"selector_reason":"loanDepot季度业绩披露亏损扩大、贷款发放量变化及盈利目标，提供按揭贷款机构经营数据；常规经营财报不标记capital_focus。","title_zh":"loanDepot Q3 净亏损扩大至 2,900 万美元","summary_zh":"loanDepot Q3 净亏损由前季 700 万美元扩大至 2,900 万美元，抵押贷款发放额为 70.5 亿美元；管理层仍预计最早明年上半年实现盈亏平衡。","impact":"short-neg","evidence_quote":"The California-based nonbank lender reported a $29 million net loss in Q3, compared with a $7 million loss in the prior quarter, according to its earnings release Monday.","evidence_basis":"body","cre_subcategory":null},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"NAR membership proves more resilient than expected, topping 1.46 million","link":"https://www.housingwire.com/articles/nar-membership-revenue-budget-2026/","description":"It is no secret that the National Association of Realtors (NAR) had a challenging few years. From facing a sexual harassment scandal , navigating the commission lawsuits and the implementation of the resulting settlement, to looking to create a more accountable and responsible version of the trade group , NAR has experienced its fair share of growing pains. But, when it comes to the association’s financials, 2026 was far better than anticipated. In an update at NAR’s 2026 NXT Board of Directors meeting by NAR’s 2026 Treasurer Craig Sanford, it was revealed that at the end of September, the association had 1,469,127 members, 22% better than the 1.2 million members the association had budgeted for and just 1.5% lower than membership a year ago. In addition, Sanford said membership renewals for 2027 are tracking in line with where they were in 2026. Revenue from membership dues accounted for roughly $220 million of the more than $250 million in revenue NAR had reported as of the end of September. Sanford also noted that NAR’s expenses as of late September had come in roughly $7 million better than budgeted, but that he expected some of those savings to be diminished by fourth quarter advocacy spending due to the recent midterm elections. Despite this, Sanford said that NAR’s cash and investments remain strong, allowing the trade group to meet its upcoming settlement payments while still investing in new products and services for its members. “In my two years as treasurer, I have seen the start of one of the greatest financial modernization in transformation in NAR's history,” Sanford said. “We have implemented a new accounting system along with accounting and budgeting tools, moved to monthly accrual accounting, selected and onboarded the new auditor, managed through massive personnel changes, implemented zero-based budgeting and now we are minutes away from voting to send our third consecutive balanced budget to the Board for approval.” Despite this progress, Sanford said that the work is not done, instead it's just getting started. 2027 Budget votes The next stage of this work kicked off with the approval of three budgetary members by the board of directors. Sanford noted that this budget was created after stringent review of each department, resulting in a budget “that is more intentional, more strategically aligned and better positioned to support [NAR’s] core mission while maintaining financial discipline.” During the meeting, the board overwhelmingly approved a 2027 operating and advocacy budget of $280,169,801 in gross revenue, and $246,952,390 in gross expenses. Over 90% of the directors also approved a 2027 consumer advertising campaign budget of $12 million in gross revenue and $13.696 million in program expenses. Additionally, over 95% of the directors approved a recommendation that found that the capital expenditure needs identified for 2027 technology total $2.42 million and that the capital expenditure needs identified for 2027 building needs total $3.06 million. Other measures approved In addition to approving budgetary measures, the board also voted on proposed amendments to the bylaws of the institutes, societies and councils. During the meeting, Brown noted that the amendments were reviewed by NAR’s general counsel and were deemed to be “not inconsistent with the policies and constitution” of NAR. The proposed amendments were approved by 864 directors voting in favor and six opposed. Beyond voting on these measures, the meeting also saw the installation of the 2027 leadership team, including 2027 NAR President Christine Hansen, a HousingWire Woman of Influence , President-elect Colin Mullane , First Vice President Pete Kopf and Treasurer Patti Fitzgerald. The leaders were approved by the board of directors back in May at NAR’s Realtors Legislative Meetings. Related More: Commission Lawsuit National Association of Realtors","published_at":1794246194000,"source_family":"housingwire","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794260239293,"id":"bcfe6346b748685b","acquisition_window":{"lower":1794171600000,"upper":1794258000000},"score":15,"tags":["mixed-asset","national","data","brokerage"],"heat_signals":[],"date_precision":"timestamp","modified_at":1794246381000,"extraction":"semantic","canonical":"https://housingwire.com/articles/nar-membership-revenue-budget-2026","content_hash":"a0b19012bf355f5e38f43b4083e6fed94213aef6d1a8799e6580b8602fbab460","access":"public","evidence_status":"article","keep":true,"importance":3,"section":"cre","capital_focus":false,"geo_evidence":null,"duplicate_of":null,"selector_reason":"NAR披露会员数高于预算、会费收入及续会趋势，提供全国经纪行业组织的独立财务与会员数据。","title_zh":"NAR 会员数超 146 万，财务表现好于预算","summary_zh":"NAR 透露，截至 9 月会员数为 1,469,127 人，较预算高 22%，且现金与投资保持稳健，可满足即将到期的和解付款并继续投入会员产品服务。","impact":"neutral","evidence_quote":"At the end of September, the association had 1,469,127 members, 22% better than the 1.2 million members the association had budgeted for and just 1.5% lower than membership a year ago.","evidence_basis":"body","cre_subcategory":"跨资产"},{"source_id":"rebusiness-online","source_name":"REBusiness Online","source_tier":"A","source_weight":6,"source_tags":["mixed-asset","deals"],"region":"national","title":"Berkadia Provides $219M in Agency Permanent Loan for Upper Manhattan Affordable Housing Community","link":"https://rebusinessonline.com/berkadia-provides-219m-in-agency-permanent-loan-for-upper-manhattan-affordable-housing-community/","description":"Berkadia Provides $219M in Agency Permanent Loan for Upper Manhattan Affordable Housing Community by Taylor Williams November 9, 2026 November 9, 2026 2 NEW YORK CITY — Berkadia has provided a $219 million Fannie Mae permanent loan for the rehabilitation and preservation of Rangel Houses, a 984-unit affordable housing community in Upper Manhattan. Rangel Houses was originally built on 11 acres in 1951 as Colonial Park Houses and was renamed in 1977 in honor of tenant association president Ralph Rangel. Today, the community comprises eight high-rise buildings that are home to roughly 1,800 people. All units are reserved for households earning 80 percent or less of the area median income, with the majority (954 units) designated for “very low-income” residents. Rangel Houses also features playgrounds and open space, commercial space and specialized centers for seniors and children of varying ages. Matthew Baptiste and Heather Olson of Berkadia originated the financing in partnership with the New York City Housing Authority, the New York City Housing Development Corp. and Goldman Sachs on behalf of the owner, Genesis Cos. The loan was structured with a 15-year term, five years of interest-only payments and a 40-year amortization schedule. Facebook Twitter Linkedin Email previous post Marcus Partners Buys 155,000 SF Industrial Building in Salem, New Hampshire next post Lee & Associates Negotiates 87,730 SF Industrial Lease in Lewisville, Texas You may also like Larkspur Capital Begins Leasing 219-Unit Multifamily Project in... November 9, 2026 Marcus Partners Buys 155,000 SF Industrial Building in... November 9, 2026 IPA Negotiates Sale of 71-Unit Apartment Building in... November 9, 2026 Marcus & Millichap Brokers $14.6M Sale of Shopping... November 9, 2026 Walker & Dunlop Arranges $110M Financing for Multifamily... November 9, 2026 RED Development Receives $69.3M Refinancing for Offices at... November 9, 2026 Arrow Real Estate Secures $16.9M in Acquisition Financing... November 9, 2026 Northmarq Negotiates Sale of 350-Unit Apartment Community in... November 9, 2026 TruAmerica Multifamily Breaks Ground on 154-Unit Townhome Community... November 9, 2026","published_at":1794238150000,"source_family":"rebusiness-online","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794260239293,"id":"373611da84388c24","acquisition_window":{"lower":1794171600000,"upper":1794258000000},"score":14,"tags":["multifamily","nyc","deals","lender"],"heat_signals":["fannie mae"],"date_precision":"timestamp","modified_at":1794238151000,"extraction":"semantic","canonical":"https://rebusinessonline.com/berkadia-provides-219m-in-agency-permanent-loan-for-upper-manhattan-affordable-housing-community","content_hash":"89bab595049bb44be21f6ba3439ae25b869659cf17b96d2940b7cc47488836ae","access":"public","evidence_status":"article","keep":true,"importance":3,"section":"cre","capital_focus":false,"geo_evidence":"Upper Manhattan Affordable Housing Community","duplicate_of":null,"selector_reason":"为曼哈顿984户可负担住房提供2.19亿美元长期贷款，交易规模大且涉及住房保全；物业融资本身不构成capital_focus。","title_zh":"Berkadia 提供 2.19 亿美元保障性住房贷款","summary_zh":"Berkadia 为纽约上曼哈顿 984 户保障性住房社区提供 2.19 亿美元 Fannie Mae 永久贷款，用于修缮和保留，贷款期限 15 年并含 5 年只付息期。","impact":"long-pos","evidence_quote":"Berkadia has provided a $219 million Fannie Mae permanent loan for the rehabilitation and preservation of Rangel Houses, a 984-unit affordable housing community in Upper Manhattan.","evidence_basis":"body","cre_subcategory":"多户"},{"source_id":"realtor-news","source_name":"Realtor.com News","source_tier":"A","source_weight":6,"source_tags":["housing"],"region":"national","title":"The Latest Shift in How Appraisals Are Handled Could Save Homebuyers Hundreds in Closing Costs—Eventually","link":"https://www.realtor.com/news/trends/appraisals-uad-36-closing-costs-money-monday/","description":"It’s typically the last hurdle for homebuyers—and the process is about to get a face-lift. Last week, the Uniform Appraisal Dataset (UAD) 3.6 , a major update to property valuation standards introduced by Fannie Mae and Freddie Mac , became mandatory for all new UCDP appraisal report submissions. UAD 3.6 is a new, digital form that appraisers will use to evaluate homes . Now, rather than the appraiser meticulously jotting down notes in longform paragraphs, the new system will allow appraisers to use extensive drop-down menus and checkboxes to make their evaluations. A proper appraisal can determine not only whether a buyer can qualify for a loan , but also whether they can save significant money at closing. Understanding the Uniform Appraisal Dataset 3.6 After a buyer makes an offer, their mortgage lender will order an independent appraisal to confirm the home is worth at least what's being borrowed against it. If the appraised value comes in at or above the purchase price, the process moves forward as planned. But if it comes in low, that gap has to be resolved before the loan can close. The logic behind the UAD 3.6 update, according to Fannie and Freddie, is to create a “data-driven, dynamic reporting structure to capture property and market information.” This new form includes significantly more data fields, helping lenders and buyers better understand the property’s characteristics. But with more detail comes a longer commitment. “Be prepared for a lot more questions from the appraiser during the inspection,” explains Michael Mignogna , president of the Appraisal Institute . “There’s a lot more data to include, so be prepared to answer questions about renovations, repairs, new systems like heating and air conditioning, appliances, etc., or have that information ready if no one with that type of information can be at the inspection.” To that end, with UAD 3.6, appraisers will now not only grade individual rooms, but they can also highlight upgrades and features that might’ve been lost in the old system. So, features of a newly remodeled kitchen or new bathroom flooring get specifically noted, which will aid in the ease of deciding the home’s value. Still, Mignogna is skeptical that this will have much of an impact on the final value. “Not as much information is always known about the comparables, so expectations about condition/quality adjustments to the comps on a room-by-room basis should be tempered,” he adds. Loading... Appraisers are different from inspectors, as they establish the home's value, not it's condition. Getty Images How these new appraisals can save buyers money The buyer almost always pays for the appraisal. The cost is typically a few hundred dollars, and it’s often rolled into closing costs. This is the case even though the appraiser is hired by the lender, not the buyer. The hope is that because this new appraisal process is a clean, digital checklist, banks can review and approve it much faster, reducing delays. For example, under the former process, lenders had the option to kick back the report for corrections if anything about the report was unclear, which could happen if the appraiser’s report didn’t cover every facet necessary. When that happens, buyers may find themselves having to pay for expensive mortgage rate-lock extensions to keep their rates while they wait for the appraisal to clear. Extension fees typically range from 0.125% to 0.250% (or up to 0.500% or more) of the buyer's total loan balance per extension period, often broken into 15-day increments. On a $450,000 mortgage, a 15-day extension would usually cost between $500 and $1,000. Given that closing costs already run a buyer anywhere from 2% to 5% of the total loan amount, or about $8,000 to $20,000 for a $400,000 loan, according to Bankrate , another couple hundred to a thousand dollars is nothing to scoff at. The flip side But as the saying goes, all good things come with time, and right now, this new digital infrastructure may actually be coming at a cost to buyers as it finds its footing. Clear Capital, a real estate valuation technology company, reported via National Mortgage Professional an average $65 increase in appraisal fees in markets where it has enough production volume to compare UAD 3.6 with the older UAD 2.6 format. Additionally, Michael Farrell , president of the National Association of Mortgage Brokers, said that the number of field appraisers equipped to do UAD 3.6 is so limited at this point, demand bottlenecks are driving up prices for modernized reports. While older appraisals are being priced at around $550, modernized reports may cost borrowers closer to $850. “It’s basically all roads lead to chaos,” Farrell explained to Scotsman Guide . “From an originator standpoint, it's a delay. Delays cost money. Delays cost the consumer money.” Mignogna, meanwhile, says it’s important to remember that fees are affected by far more than just the process. “Appraisal fees are very specific to markets and are affected by the number of appraisers in a market, the demand for appraisals in that market, interest rates, and a host of other factors,” he says. Having said that, the transition to the UAD 3.6 format continues to be slow and Mignogna concedes that lenders may bid up prices for the few field appraisers who are fully onboarded like in any “supply-demand situation.” But while delays are happening as appraisers go through a “transition mode,” Mignogna says this won’t affect buyers' need for expensive mortgage rate-lock extensions. “This is really only meaningful or significant in times of interest rate uncertainty or expected rate increases,” he says. “The overall UAD 3.6 process is longer right now for the reasons above, but as the learning curve flattens, turnaround times will improve. It remains to be seen if the increased data requirements offset by UAD 3.6 familiarity gets us to the turnaround times seen before UAD 3.6 or faster turn times.” With that in mind, it’s a good id","published_at":1794217620000,"source_family":"realtor-com","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794260239293,"id":"ae934bc0a5d89d73","acquisition_window":{"lower":1794171600000,"upper":1794258000000},"score":14,"tags":["housing","national","policy","lender"],"heat_signals":["freddie mac","fannie mae"],"date_precision":"timestamp","modified_at":1794217620000,"extraction":"semantic","canonical":"https://realtor.com/news/trends/appraisals-uad-36-closing-costs-money-monday","content_hash":"ac0c00694b1f12b2ae013f7cca1a7f0796e150dbb97a9e41ad5de0f4a34eb8d3","access":"public","evidence_status":"article","keep":true,"importance":3,"section":"national","capital_focus":false,"geo_evidence":null,"duplicate_of":null,"selector_reason":"Fannie Mae与Freddie Mac要求采用新版统一估价数据格式，构成全国房屋估价流程的实质性制度变更。","title_zh":"UAD 3.6 评估表格正式强制使用","summary_zh":"Fannie Mae 和 Freddie Mac 推出的 UAD 3.6 已对新的 UCDP 评估报告提交强制使用，增加房产与市场数据字段，可能改善贷款评估信息，但评估环节将收集更多资料。","impact":"neutral","evidence_quote":"Last week, the Uniform Appraisal Dataset (UAD) 3.6 , a major update to property valuation standards introduced by Fannie Mae and Freddie Mac , became mandatory for all new UCDP appraisal report submissions.","evidence_basis":"body","cre_subcategory":null},{"source_id":"connect-cre","source_name":"Connect CRE","source_tier":"A","source_weight":7,"source_tags":["mixed-asset","deals"],"region":"national","title":"CRE Lending Enters Period of Transition as Q3 2026 Ends","link":"https://www.connectcre.com/stories/cre-lending-enters-period-of-transition-as-q3-2026-ends/","description":"National CRE News In Your Inbox. Sign up for Connect emails to stay informed with CRE stories that are 150 words or less. National + Finance | November 9, 2026 By: Paul Bubny CRE Lending Enters Period of Transition as Q3 2026 Ends Commercial real estate lending activity in the third quarter of 2026 reflected a market in transition as interest rates moved higher in September, CBRE said Monday. The latest CBRE Lending Momentum Index stood at 0.7 at the end of Q3, unchanged from a year ago but down from 1.0 at the end of Q2. As interest rates and Treasury yields both moved higher in September following the business-as-usual financing market in July and August, “The result was a repricing across both debt and equity markets for acquisitions, refinancings and recapitalizations, as investors weighed a wider range of potential outcomes amid continued inflation concerns and geopolitical uncertainty,” said James Millon, president & co-head of capital markets, U.S. & Canada, for CBRE. He continued, “Despite that volatility, capital remained available and credit continues to attract investor demand because of its yield and income characteristics. That ongoing appetite for credit should support capital availability even as markets work through near-term uncertainty.” Commercial loan-to-value
