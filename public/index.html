’s approval, this settlement provides certainty for the REMAX network and resolves the remaining claims from this matter. We look forward to continuing to support the REMAX network as they deliver the best experience in real estate,&#8221; the spokesperson added. The Batton 1 lawsuit was filed in January 2021 and later amended in July 2022 with Batton as the lead plaintiff. Like the home seller commission lawsuits, this suit alleges that the National Association of Realtors’ (NAR) policies have inflated agent commissions, resulting in higher home prices paid by homebuyers. In addition to REMAX and Keller Williams, other defendants in the Batton 1 suit include NAR and Anywhere Real Estate . Both NAR and Anywhere settled the homebuyer commission lawsuit claims by opting into a settlement negotiated in the Tuccori homebuyer commission lawsuit. While these settlements are up for final approval in early November 2026 , four retired federal judges are challenging the opt-in settlements, arguing that if they are approved it will encourage defendants in other class-action lawsuits to “forum shop” when looking to settle. These opt-in settlements received preliminary approval from the court in May 2026 . Keller Williams did not immediately responded to HousingWire ’s request for comment on the final approval. Related More: Commission Lawsuit Keller Williams REMAX","published_at":1786129511000,"score":15,"tags":["national","policy","brokerage"],"heat_signals":["fed"],"importance":4,"selector_reason":"REMAX和Keller Williams的购房佣金诉讼和解获得最终批准，正式确定大型经纪网络的法律责任和成本安排。该裁决会影响经纪佣金模式及行业合规，因此评为重要行业事件。","section":"national","title_zh":"REMAX与Keller Williams和解获批","summary_zh":"Batton 1佣金案终审通过，KW付$20M、REMAX付$8.5M且无新改制","impact":"long-pos","id":"0fdcd0f0","fetched_at":1786153543668},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Achieve closes $261.5 million HELOC securitization","link":"https://www.housingwire.com/articles/achieve-aaa-heloc-securitization/","description":"Achieve has closed a $261.5 million securitization of newly originated home equity lines of credit ( HELOCs ), its first of 2026 and ninth overall, the company announced Friday. The transaction is backed by 3,129 HELOCs. As of June 30, the cutoff date for the securitization, the pool had a total unpaid principal balance of about $261.5 million and a total credit line of about $276.5 million, with a weighted average seasoning of three months. The weighted average combined loan-to-value ratio, including borrowers’ first-lien mortgages, was 65.67%. “This transaction reflects the continued strength of Achieve&#8217;s HELOC platform and the confidence institutional investors have in the quality of the assets we originate,” Achieve co-founder and co-CEO Andrew Housser said in a statement. The HELOCs in the pool are fixed-rate and fully amortizing. The lines are fully drawn at origination and offered with 10- to 30-year terms that include a five-year draw period. There are no prepayment penalties. In April, Achieve lowered its best available fixed-rate APR to 5.875% for qualifying borrowers, according to the company. Most of the HELOCs are secured by junior liens on primary residences, although a small share are in first-lien positions. Achieve said it conducts a comprehensive financial assessment and thorough collateral valuation process to target low combined LTV ratios and preserve an equity cushion for borrowers. The securitization shows continued demand for HELOC-backed bonds even as high interest rates and weak affordability weigh on first-mortgage originations. The product is positioned for uses such as unsecured debt consolidation, home renovations and the funding of large purchases, or a combination of these needs. The structure includes six classes of rated mortgage-backed notes and three classes of unrated notes. The deal incorporates subordination, excess interest, a reserve account and other layers of credit enhancement. S P Global Ratings and Morningstar DBRS assigned ratings across the classes. Achieve’s cumulative HELOC securitization volume exceeds $1.7 billion. The deal was co-sponsored by Achieve and Canyon Partners LLC . Deutsche Bank Securities served as structuring agent and lead bookrunner, with Barclays and Jefferies as joint bookrunners and Guggenheim and Texas Capital acting as co-managers. This article was generated using HousingWire Automation and reviewed by a HousingWire editor before publication. Related More: HELOCs Home Equity Securitization","published_at":1786123063000,"score":14,"tags":["housing","deals","lender"],"heat_signals":["texas"],"importance":4,"selector_reason":"Achieve完成2.615亿美元HELOC证券化，且交易由3129笔住房净值贷款支持。该交易反映住宅信贷资本市场的流动性和风险定价，规模已达到行业重要水平。","section":"national","title_zh":"Achieve完成$261.5M HELOC证券化","summary_zh":"由3,129笔HELOC支持，CLTV 65.67%，显示机构需求延续","impact":"long-pos","id":"9b46a94d","fetched_at":1786153543668},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"The off-MLS debate moves to Washington, and agents need a clear script","link":"https://www.housingwire.com/articles/off-mls-antitrust-scrutiny/","description":"There is a number every listing agent should be able to explain this week: 4.6%. It is the premium Compass says its private listings earn sellers. There is a second number that says the opposite. And there is now a third party, the United States Congress, asking which one is true. Start with Washington, because that is what turns a marketing squabble into something bigger. On July 22, the House Judiciary Committee’s antitrust subcommittee sent letters to Compass CEO Robert Reffkin and MRED CEO Rebecca Jensen, giving both until August 5 to brief staff on their nationwide private listing network partnership. Chairman Scott Fitzgerald wrote that lawmakers are examining whether real estate companies use these networks “to insulate themselves from competition at the expense of consumers.” The letters named a specific worry: that private arrangements incentivize agents to steer sellers toward private listings so the brokerage can represent both sides of a transaction. Then, on August 6, Sen. Elizabeth Warren sent Compass and MRED a letter seeking details on their private listing network partnership and its national expansion. She cited concerns about hidden inventory, weaker pricing data, fair housing risk and consolidation, and requested responses by Aug. 21. Compass took its case straight to sellers. Studying 70,809 of its own closed transactions listed between April 2025 and March 2026, Compass reported that homes using phased marketing, a stretch as a Coming Soon or Private Exclusive before the MLS, sold for 4.6% more and 34% faster than homes listed straight to the open market. “The data is consistent,” said Compass Chief Data Officer Dave Crosby. “Giving homeowners marketing strategies to build interest in their home and refine the price before listing on the MLS and portals leads to a higher sale price.” Zillow’s research cuts the other way In a study of more than 15 million sales from 2023 through 2025, Zillow found that homes kept off the MLS typically sold for 1.3% less, a combined $1.36 billion. The pain was uneven. Lower-priced homes gave up 2.2%. Homes in communities of color lost 1.9%, versus 1.1% in majority-white neighborhoods. Zillow also found that when one agent worked both sides of a sale, sellers lost a combined $1.49 billion. “Sellers deserve an agent whose only job is to get them the best possible price, and a listing that every buyer in the market can see,” said Zillow Chief Economist Mischa Fisher. A third data point predates this fight and belongs to neither company. A Bright MLS and Drexel University analysis of more than a million sales found homes listed on the MLS sold roughly 17.5% more than comparable off-MLS homes, about $54,000 for a typical seller. Independent research has pointed toward exposure for years. Follow the incentive and the contradiction dissolves. Compass is building a growth story on private exclusives and keeping more deals inside its own walls, so a premium is the number that justifies the model to sellers and to shareholders. Zillow sells advertising against listings, so its business depends on those listings being visible, and a billion-dollar penalty is the number that protects that model. Both studies can be technically clean and still be built to flatter the company that ran them. Powerfact: A study is only as neutral as the company paying for it. Read the incentive before you read the percentage. The breakdown in the research But notice where the neutral research and Zillow’s own breakdown agree. The seller who gets hurt by going dark is rarely the luxury seller with 10 motivated buyers already circling. It is the ordinary seller, in the ordinary neighborhood, who needed every buyer to see the home. Powerfact: Maximum exposure is not a sales tactic. It is the seller’s money on the line, and protecting it is the job you were hired to do. What agents can do Do not walk into a listing appointment quoting one study and hoping the seller has not seen the other. Name the difference ","published_at":1786128161000,"score":13,"tags":["national","regulation","brokerage"],"heat_signals":[],"importance":4,"selector_reason":"私有挂牌和off-MLS模式已从经纪营销争议升级为国会关注的住房市场与公平性问题。若监管介入，可能改变挂牌分发、卖方曝光和经纪竞争规则，因此评为重要政策动态。","section":"national","title_zh":"off-MLS争议升至Washington审查","summary_zh":"国会追问Compass 4.6%溢价说法，隐性库存与dual agency风险升温","impact":"short-neg","id":"fe05ce49","fetched_at":1786153543668}],"errors":[{"source":"The Real Deal (National)","error":"HTTP 403","attempted_urls":["https://therealdeal.com/national/feed/"]},{"source":"Houston Agent Magazine","error":"HTTP 403","attempted_urls":["https://houstonagentmagazine.com/feed/"]},{"source":"Phoenix Agent Magazine",
