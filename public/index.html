ty,\" said Andy Walden, head of mortgage and housing market research at ICE, in a press release Monday. \"While a 0.32% monthly increase may not sound like much, when annualized, it's equivalent to home prices appreciating at nearly 4% if sustained over a 12-month period.\" Seventy of the largest 100 markets in the United States posted year-over-year gains. The Northeast led the country in appreciation again, accounting for seven of the eight fastest-growing markets last month. Scranton, Pennsylvania, topped the list with a 6.6% rise, followed by New Haven, Connecticut, at 6.4% and Milwaukee at 6%. Meanwhile, all 30 markets that posted annual price declines were located in the South and West, with Cape Coral, Florida, Austin, Texas, and Lakeland, Florida, recording the steepest drops at 5%, 4% and 3.5%, respectively, the report showed. \"The key question now is whether that momentum can withstand the recent upward pressure on interest rates heading into the heart of the spring buying season,\" Walden said. Mortgage rates have been up and down this spring. After dipping below 6% in February for the first time since 2022, the 30-year fixed-rate mortgage climbed for five consecutive weeks in part due to the war in Iran. It then decreased for three straight weeks in April, before spiking again the last two weeks to 6.37%. As a result of the rate drops early in the year, first-lien refinances totaled $242 billion in the first quarter, more than doubling year over year and marking the strongest quarter since early 2022. Refinances accounted for about 44% of all originations, the highest share in four years, with rate-and-term refinances making up 60% of all refinance activity, the highest mark in five years. The average rate-and-term refinancer also lowered their monthly payment by $257 through a 97-basis-point-rate reduction, the report said. First-time homebuyers made up more than half of all purchase loans closed in March, the highest share in nearly six years, which c  “effectively shut down” build‑to‑rent development, but the sector’s biggest public operators are acting like the threat won’t stick. Invitation Homes and AMH poured a combined...","published_at":1778265388000,"score":23,"tags":["btr-sfr","national","policy","btr-operator"],"heat_signals":["build-to-rent","invitation homes","amh"],"importance":4,"selector_reason":"国会住房法案可能对build-to-rent开发形成重大限制，而Invitation Homes和AMH等头部运营商仍在继续布局。该议题直接关系BTR行业监管和供给前景，属于重要政策风险，因此评为imp=4。","section":"btr","extended_window":true,"title_zh":"BTR企业押注参院房屋法案难落地","summary_zh":"若法案生效将重击 BTR，但头部运营商仍在加码布局","impact":"short-neg","id":"8b105176","fetched_at":1778560799921},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Policy uncertainty takes center stage as AMH reports revenue gains","link":"https://www.housingwire.com/articles/amh-reports-revenue-gains-q1-2026/","description":"The built-to-rent industry has been plagued by regulatory uncertainty over the past couple of months, but AMH , the nation’s premier BTR builder, with a portfolio of more than 60,000 rental homes, reported that 2026 started with strong demand and an improving supply picture. During the company’s Q4 2025 earnings call in February, AMH executives noted that the BTR industry faced an oversupply of new homes. As a result, leadership laid out plans to reduce deliveries and increase dispositions in a bid to align supply with demand. Since then, AMH executives noted progress in resolving the supply glut, despite lingering imbalances in many Sun Belt markets. The company also reported “record” demand during parts of the spring leasing season, along with revenue gains and positive momentum in rental rates. Nevertheless, regulatory uncertainty continues to obscure the business outlook, so much so that those policy questions took center stage in discussions on the company’s Q1 2026 earnings call held last Thursday. Regul
