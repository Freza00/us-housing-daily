 twitter bcynic mailto bonnie.sinnock@arizent.com linkedin bonnie-sinnock-115a829 Published November 06, 2026, 1:38 p.m. EST | Updated November 06, 2026, 3:35 p.m. EST 3 Min Read Facebook Twitter LinkedIn Email Key Insight: Discover why nonbank mortgage payrolls hit a 2026 low despite rising retail productivity gains. Expert Quote: \"For housing, stronger hiring cuts both ways.\" — Sam Williamson, Senior Economist, First American. Overview bullets generated by AI with editorial review. Nonbank mortgage payroll estimates dropped to a low for 2026 ahead of broader employment gains last month, pointing to a persistent need to manage origination staffing with retail productivity initiatives that have not yet reduced costs but at least contained them. Processing Content Industry-specific data the Bureau of Labor Statistics released with a one-month lag for real-estate credit and loan brokers, when combined, show industry payrolls dropped to 265,100 in August, marking the lowest point since the seasonally-slow first quarter. The statistics, combined with October's strong jobs report signaling a likelihood rates won't immediately fall further , suggest the industry is reducing origination staffing but are able to do so gradually as artificial intelligence has helped boost the number of loans closers handle. \"There are a lot of learnings that can happen in this tighter market,'\" Walter Mullen, chief strategy officer at Onity , said at IMN's mortgage servicing rights conference this week, noting that origination declines have forced companies to broadly explore operational innovation. Where retail fulfillment productivity stands The number of loans handled by full-time equivalent employees in retail fulfillment have inched up this year primarily due to a surge in closer gains, according to data the Mortgage Bankers Association and Stratmor Group have collected from lenders. The average monthly number of loans per closer jumped from 36.7 to 41.5 between 2025 and 2026 while lenders reported a far more modest gain for processors and a slight decline in productivity in underwriting in line with the more challenging origination environment. Lenders reported a mix of artificial intelligence and leaner staffing drove the productivity gains, which did not reduce costs but have prevented them from rising. Current employment trends: A mixed blessing While the latest industry-specific and total job numbers point to some challenges for mortgage companies, housing economists noted they do point to some offsetting positives for lenders too. \"For housing, stronger hiring cuts both ways. More jobs mean more income and more reasons to move, while a stronger economy could prolong the wait for mortgage-rate relief,\" Sam Williamson, senior economist at First American, wrote in an emailed press statement. October's stronger-than-anticipated gain of 165,000 and a decline in the unemployment rate from 4.2% to 4.1% came with wage gains, according to Williamson. However, MBA noted that there also were indications in the numbers that some workers are underemployed. \"While the headline unemployment rate decreased, some of this was due to individuals taking part-time work when they would have preferred a full-time position,\" MBA Chief Economist Mike Fratantoni wrote in his emailed statement. Despite some signs of weakness like this, Frantantoni said he still anticipates that the overall impact of the numbers will be an increased likelihood that the Federal Open Market Committee will raise short-term rates at one of two of its next meetings. \"A resilient job market, combined with inflation that is still too high, is likely to lead the FOMC to hike rates in December. MBA anticipates another hike as well in the first quarter of 2027,\" he said. While the short-term rates the Fed controls have some bearing on long-term mortgage rates that currently dominate the housing market, mortgage spreads also drive the cost of funds for homebuyers. Bonnie Sinnock Capital
