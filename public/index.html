ees an issue with how Google is using the IDX listing feeds supplied to it by HouseCanary. Sterbcow believes Google’s move will have a massive impact on IDX feeds from MLSs because it has moved the sites they power like portals or even a brokerage’s website further downstream in the consumer search process. “This is not going to go over well with the brokers or the MLSs because the IDX was designed as a reciprocal display license between cooperating brokerages. It was never an advertising license. So, the minute you display the listing becomes a paid media inventory on a global ad network like Google, you have completely changed the deal that the brokers originally agreed to. This is a seismic shift in the entire industry.” Competing for intent In Sterbcow’s view, instead of providing consumers with links to places to find listings, Google has completely shifted things by becoming the one to actually surface those listings and even monetizing leads before a consumer even reaches a listing portal. “They aren’t even going to be competing with the portals. Instead, they are competing for this moment of consumer intent,” he said. “I feel it is a much bigger deal in the broader scope of what is going on than what people realize. We have a situation where Google isn’t just entering the portal wars, they have moved the entire field.” Like Sterbcow, Amit Kulkarni, a co-founder of Alloy Advisors , also feels like Google’s expansion of this program is bigger than the world of real estate. In the past, consumers went to Google to receive a list of links to information or products relevant to their search, but that has changed with the widespread use and adoption of AI. “I think what they are trying to do is figure out what they can do to still have search results come up on Google, as AI is starting to erode and take traction away from the legacy ‘blue link’ search business,” Kulkarni said. What about the portals? Although Kulkarni does not believe Google’s expansion of this pilot program nationwide is a sign that the firm wants to get heavily involved in the real estate industry, Kulkarni does believe this will have an impact on the portals, many of whom have spent a lot of time on search engine optimization. “The portals are going to have to start thinking about how to optimize their AI search so they can get discovered,” Kulkarni said. “They are generally going to have a hard time existing in their current business model form if they can’t rely on the funnel that Google provides them with.” Industry analysts, however, are not quite as certain about how Google’s move will impact listing portals. “While incumbent portals retain several defensive advantages — including strong direct traffic from brand awareness, domain expertise, and vertical integration of downstream services — Google’s more formal entry into home listings is clearly an incremental negative,” Ryan Tomasello, Bose George and Jade Rahmani, analysts at Keefe, Bruyette and Woods , wrote in a note published on Thursday. “Given its top-of-funnel search dominance, Google is positioned to capture traffic earlier in the homeshopper journey, potentially eroding portal traffic share and economics over time.” The analysts say Zillow is the most exposed to potential downside b","published_at":1781292677000,"score":10,"tags":["housing","national","regulation","tech-adoption","brokerage"],"heat_signals":[],"importance":4,"selector_reason":"Google 全国扩展房地产 listing ads，可能改变 MLS 数据授权、门户流量和经纪行业分发格局。平台级入口变化具备行业中等影响，因此评为 imp=4。","section":"national","extended_window":true,"title_zh":"Google listing ads 引发 IDX 争议","summary_zh":"律师称 IDX 非广告许可，Google 扩张或冲击 MLS 与 brokerage 生态","impact":"short-neg","id":"8b217dd6","fetched_at":1781489838879},{"source_id":"redfin-news","source_name":"Redfin News","source_tier":"A","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"SpaceX Employees Could Buy 2 in 5 San Antonio Homes With Their IPO Windfall","link":"https://www.redfin.co
