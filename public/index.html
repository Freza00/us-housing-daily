ce_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Construction Costs Rise 6.2% Through April","link":"https://www.bisnow.com/national/news/construction-development/construction-costs-up-62-in-first-4-months-of-the-year-134557","description":"News Construction Costs Rise 6.2% Through April National Construction Dev View count: National C D May 13, 2026 | 1:38 p.m. ET Emily Wishingrad, Washington, D.C. The cost of construction materials in the U.S. continues to climb as inflation, tariffs and the conflict in Iran converge to make commodities like energy and lumber more expensive. Unsplash/Frames For Your Heart Input prices in April rose 6.2% since January, according to an analysis released Wednesday by Associated Builders and Contractors . The analysis was based on data from the Bureau of Labor Statistics’ producer price index. “Construction input prices surged again in April,” ABC Chief Economist Anirban Basu said in a release. “Input prices have now risen more during the first four months of 2026 (6.2%) than over the prior three years (4.8%).” Construction materials were 7% more expensive last month than in April 2025. For nonresidential materials, costs were up 7.4% year-over-year. Between March and April, overall construction input prices ticked up 1.7%, while nonresidential prices were up 1.8%. Breaking down the data by type of material shows that rising energy costs are playing a key role in how the overall price index is shifting. Between March and April, crude petroleum skyrocketed 11.3%, the sharpest rise of any commodity. The second-steepest rise was for unprocessed energy materials, the cost of which rose by 9.2% month-over-month. Natural gas rose by 4.9%. But some other materials also showed steep price spikes in April. The cost of softwood lumber rose by 5.5%, and hot rolled steel bars increased by 4.1%. Steel mill products and industrial controls equipment rose by 3.8%. Energy prices are also leading the price index surge year-over-year. Crude petroleum is up 61.8%, natural gas is up 27.3%, and unprocessed energy materials are up 48.9% since April 2025. Construction industry prices are part of a nationwide inflationary story. Wholesale inflation increased by 1.4% in April compared to March, double the increase of the month prior and substantially exceeding economists’ expectations of a 0.5% increase, The Wall Street Journal reported . Contact Emily Wishingrad at emily.wishingrad@bisnow.com Related Topics: Associated Builders and Contractors , Construction costs , U.S. Bureau of Labor Statistics , Anirban Basu","published_at":1778685801000,"score":17,"tags":["national","construction","macro"],"heat_signals":["inflation","year-over-year"],"importance":4,"selector_reason":"美国建筑成本截至4月上涨6.2%，会影响住宅和商业项目开工、利润率与交付节奏。它是全国性成本压力信号，重要性为行业中等，评为 imp=4。","section":"national","title_zh":"建设成本至4月已涨6.2%","summary_zh":"材料成本4个月涨幅超前三年，能源和木材推高新房开发压力","impact":"short-neg","id":"7b74a073","fetched_at":1778730652947},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Pandemic eviction freeze lawsuit could cost federal government over $1B","link":"https://www.multifamilydive.com/news/pandemic-eviction-moratorium-lawsuit-darby/820162/","description":"An article from Pandemic eviction freeze lawsuit could cost federal government over $1B A settlement agreement is underway after landlords successfully argued that the CDC’s pandemic policy violated their Fifth Amendment rights, a lawyer on the Darby case said. Published May 13, 2026 Julie Strupp Senior Editor Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Headquarters for the Center for Disease Control in Atlanta, Ga. Jessica McGowan via Getty Images Listen to the article 7 min This audio is auto-generated. Please let us know if you have feedback . The federal government could pay about $1 billion to settle claims from roughly 1,800 landlords and counting who say that the nearly yearlong eviction freeze during the COVID-19 pandemic cost them rental income and violated their Fifth Amendment rights, according to a lawyer for the plaintiffs in Darby Development Company, Inc. v. United States . The Centers for Disease Control and Prevention extended the March 2020 CARES Act’s nationwide eviction moratorium multiple times in an effort to slow the spread of COVID-19. That action constituted a “taking” by the federal government because landlords were unable to exercise their constitutional property rights and were not adequately reimbursed for lost rental income, according to the third amended complaint filed April 10 by a group of landlords in the U.S. Court of Federal Claims. Although the federal government did provide rental assistance, including through the Emergency Rental Assistance Program and the American Rescue Plan Act’s Homeowner Assistance Fund, the programs were slow to start and the rental housing industry still lost tens of billions of dollars due to the eviction moratorium, according to the complaint. Now, the legal teams are in discussions to determine how much the government should pay the affected landlords as the parties move toward a settlement agreement, John McDermott, co-counsel with Dorsey Whitney for the plaintiffs, told Multifamily Dive. “We have been operating under the assumption that it's going to be about a billion dollars, but to prove it, we've got to have everyone submit their data,” McDermott said. “We're asking the companies to submit … their actual rent rolls, how their internal documents tracked unpaid rent.” In order to create a reimbursement formula, the parties are also debating how long the eviction moratorium effectively lasted, McDermott said. “[It was] technically in effect from September of 2020 till August of 2021, but there's nobody in the business that could get into a courthouse to evict anybody in September of 2021 because the courts were jammed. Some of them, you couldn't get a court date for like, six months. So that's the other thing, like, how long do we take the data out?” McDermott said. “These are the discussions that we're having with Justice Department lawyers right now.” Property rights are evolving After the Alabama Association of Realtors and others sued over the moratorium, the Supreme Court ruled in August 2021 that the CDC lacked the authority to issue it. Around that time, Darby Development Co. and other landlords filed suit against the United States in the Court of Federal Claims, claiming that the CDC’s action constituted a physical taking of property. The court dismissed the argument in 2022 on the grounds that the CDC’s eviction ban was unauthorized and therefore could not be considered a taking. However, in August 2024, the U.S. Court of Appeals for the Federal Circuit reversed the decision and ruled that the government was nonetheless liable. In June 2025, the Federal Circuit denied the government’s petition for a rehearing and reaffirmed property owners’ right to bring takings claims against the government — opening up the possibility of billions of dollars in restitution , per a client alert from Philadelphia-headquartered law firm Duane Morris. The ruling that the moratorium constituted a physical taking of the property was ","published_at":1778703780000,"score":15,"tags":["housing","national","policy","landlord"],"heat_signals":["fed"],"importance":4,"selector_reason":"疫情驱逐禁令相关诉讼可能让联邦政府承担超过10亿美元成本，对房东、租赁政策和未来应急监管有示范意义。金额大且涉及联邦住房政策后果，评为 imp=4。","section":"national","title_zh":"eviction freeze 诉讼或令政府赔超$1B","summary_zh":"约1,800名房东索赔租金损失，若和解将强化业主产权预期","impact":"long-pos","id":"aa23a45f","fetched_at":1778730652947},{"source_id":"houston-agent","source_name":"Houston Agent Magazine","source_tier":"D","source_weight":6,"source_tags":["houston","brokerage"],"region":"texas","title":"HAR: Spring housing market shows new energy in greater Houston","link":"https://houstonagentmagazine.com
