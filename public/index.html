ire and safety officials. They bogged down the rules-and-regulations process to the point that lawmakers repealed the law in February. Smooth passage Two related bills advanced through the Michigan Senate after clearing the House earlier this year with bipartisan backing. Whitmer&#8217;s signature finalizes a two-tier structure: one law permits single-stair construction in buildings up to four stories. The second extends that allowance to buildings between five and six stories. This second measure takes effect only because the first passed, tying the two together as intended. The rules will sunset once Michigan&#8217;s Department of Labor and Economic Opportunity formally adopts the International Code Council&#8217;s own single-stairway standards. That frames the new rules as a bridge measure rather than a permanent break from the model code. Housing advocates who pushed for the change argue it will meaningfully lower construction costs, particularly for infill projects in dense urban corridors where lot sizes constrain design. A single-stairway layout frees up floor space that would otherwise go toward a second stairwell, letting developers fit more units or larger units into the same footprint. &#8220;It will allow us to build more homes for families of different sizes at lower costs — all on land we already have,&#8221; Matt Grocoff, an Ann Arbor-based developer and founder of Thrive Collaborative , said in a statement. &#8220;For families priced out of Michigan communities, this law may be the difference between a home that gets built and one that never gets built.&#8221; Still time for more housing reform The single-stair law stands out as one of the few housing wins on the governor&#8217;s desk this year. Whitmer&#8217;s agenda is &#8220;build, baby, build.&#8221; But the Housing Readiness package, which would loosen parking minimums, lot-size rules and accessory dwelling unit restrictions, has stalled for now. It faces resistance from local governments wary o l became law earlier this month, PPR announced that it was launching the PPR Keystone Housing Growth Fund, targeting $100 million in investments to buy BTR properties at or near certificate of occupancy, entering after development and construction risk has already been absorbed by the sponsor, according to a press release shared with Multifamily Dive. The firm is targeting 10 high-growth, supply constrained single-family markets with strong renter demand and has already made “soft commitments” to two properties in Charlotte, North Carolina, and one in Nashville, Tennessee, according to Johnson. He wouldn’t disclose the names of the communities. “In 60 to 90 days we're targeting for the first closing,” Johnson said. “But there's a little bit of flexibility there.” PPR plans five- to seven-year holds on its questions, according to Johnson. “The play obviously is to acquire and place some kind of aggregation facility that will last 12 to 18 months for each property and stabilize it,” he said. “Then once it stabilizes, flip it to agency debt.” Defining a target For many BTR developers, the original plan was to build their communities, lease them and then sell, according to Johnson. But the market is presenting some obstacles currently as their debt matures. “They are struggling with the lease-up because that environment is so much more competitive than they expected and they can't get the rents they wanted,” Johnson said. “They thought they could rent these for $3,000 a unit and they're sitting at $2,500.” On top of that, as the federal housing bill was debated, it created uncertainty in the market. It also opened up some opportunity, with a lot of “big capital players who had soft commits” exiting the market due to regulatory uncertainty. “The builders thought that there was going to be a soft landing for them on the capital front,” Johnson said. Right now, Johnson sees enough pipeline of vacant or partially leased properties in the market to support the $275 to $300 m
