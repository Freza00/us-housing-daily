 Taylor Williams November 16, 2026 November 16, 2026 2 HOUSTON — Stream Realty Partners has brokered the sale of Northwoods Industrial Park, a 2.7-million-square-foot development in northwest Houston.","market_evidence_id":"body-1","market_role":"asset_location","market_scope":"us","market_evidence":"Stream Realty Partners Brokers Sale of 2.7 MSF Industrial Park in Northwest Houston by Taylor Williams November 16, 2026 November 16, 2026 2 HOUSTON — Stream Realty Partners has brokered the sale of Northwoods Industrial Park, a 2.7-million-square-foot development in northwest Houston.","duplicate_of":null,"selector_reason":"Houston 2.7百万平方英尺、64栋工业园完成出售，成交时出租率98%，并由Fortress关联方安排收购融资及合资结构。","title_zh":"休斯顿 270 万平方英尺工业园完成出售","summary_zh":"Stream Realty Partners 促成西北休斯顿 Northwoods Industrial Park 出售，园区包含 64 栋建筑、占地 230 英亩，成交时出租率为 98%，买方为合资企业。","impact":"long-pos","evidence_quote":"Stream Realty Partners Brokers Sale of 2.7 MSF Industrial Park in Northwest Houston by Taylor Williams November 16, 2026 November 16, 2026 2 HOUSTON — Stream Realty Partners has brokered the sale of Northwoods Industrial Park, a 2.7-million-square-foot development in northwest Houston. The park consists of 64 buildings on a 230-acre site that were 98 percent leased at the time of sale.","evidence_basis":"body","cre_subcategory":"工业"},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Why EAH Housing moved into Oregon to buy 1K affordable units","link":"https://www.multifamilydive.com/news/affordable-apartment-supportive-housing-multifamily-transaction/874680/","description":"Why EAH Housing moved into Oregon to buy 1K affordable units The California-based developer acquired 19 properties from Catholic Charities of Oregon and opened a new affordable community in Sacramento. Published Nov. 13, 2026 Leslie Shaver Senior Reporter Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Good Shepherd Village in Happy Valley, Oregon. Permission granted by EAH Housing Properties: 19 Buyer: EAH Housing Seller: Catholic Charities of Oregon Property type: Affordable Units: More than 1,000 Location: Oregon EAH Housing has built a large presence in California and Hawaii with more than 25,000 affordable homes across 240 properties. Earlier this week, the San Rafael, California-based nonprofit owner, manager and developer expanded north by purchasing more than 1,000 affordable homes in the Portland area from Catholic Charities of Oregon, according to a press release. The 19 properties, which include a mix of family, senior and supportive housing communities, are located in the Portland metro area, including Eugene, Sandy and Happy Valley. The acquisition represents the latest in a series of large affordable transitions over the past couple of years. “We view this acquisition as the beginning of a broader presence in Oregon and will continue exploring opportunities to expand our affordable housing portfolio across the state,” Katherine Fleming, EAH’s chief portfolio officer, told Multifamily Dive in emailed comments. “We are focused on identifying mission-aligned opportunities that support the long-term preservation and availability of affordable housing in high-need areas.” Oregon expansion Catholic Charities of Oregon was seeking a mission-aligned nonprofit partner committed to the long-term preservation of affordable housing and approached EAH, according to Fleming. “The acquisition represents a natural extension of the organization’s mission into the Pacific Northwest, where EAH Housing sees significant opportunities to address growing affordable housing needs,” Fleming said. While the acquisition allows EAH to continue preserving affordable housing, Catholic Charities will continue to provide supportive services to residents, according to the release. Guardian Real Estate Services will stay on as manager following the sale. Purchase and sale agreements are now in place for the transaction, which EAH and Catholic Charities have been working on since January 2026, per the release. Financial closings and property transfers are expected to occur on a rolling basis until the second quarter of 2027. Fleming said EAH is “evaluating opportunities for improvement across the properties to ensure they continue to provide high-quality affordable housing for Oregon residents for years to come.” Catholic Charities remains involved CEO of Catholic Charities Kaleen Deatherage said transitioning the properties to EAH Housing allowed them “to remain in the hands of a nonprofit deeply committed to affordable housing.” “Catholic Charities got into affordable housing to serve people,” Deatherage said in the release. “That purpose has not changed. What has changed is our understanding of where we can make the greatest impact.” Catholic Charities was represented by Jackson Ross of Newmark's Affordable Housing Advisors team. In addition to the Oregon acquisition, EAH also opened On Broadway, a new 140-unit affordable mixed-use housing community in Sacramento, according to a Nov. 13 news release shared with Multifamily Dive. The property, which includes one-, two- and three-bedroom apartments across two five-story buildings, serves individuals and families earning between 30% and 60% of the area median income. Thirty-seven homes are permanent supportive housing for individuals and families experiencing or at risk of homelessness. Major affordable deals The EAH Oregon acquisition is only the latest large affordable housing transaction in recent years. In May, nonprofit multifamily affordable housing investment manager National Equity Fund completed a massive deal acquiring National Affordable Housing Trust’s properties and fund management portfolio. In all, NEF is gaining 165 properties, encompassing 15,000 affordable homes nationwide, across 29 funds from NAHT. In December 2025, New York City-headquartered affordable housing preservation company Hudson Valley Property Group acquired a 22-property portfolio comprising 4,768 units across the western United States from Spokane, Washington-based Inland Group. In November 2024, New York City- and Los Angeles-based Standard Communities acquired a 100% affordable housing portfolio of over 6,000 apartment homes in more than 60 communities in four states. With the purchase of the portfolio, valued at over $1 billion, Standard entered Arizona, Colorado and Texas and grew its California portfolio to nearly 11,000 apartments. In May 2023, Chicago-based Nuveen acquired a portfolio of more than 12,000 units concentrated in New York City from New York City-based Omni Holding Co. This portfolio included several large apartment properties in the Bronx, Brooklyn and Queens, as well as buildings in Maryland, Massachusetts, Texas and other states. Click here to sign up to receive multifamily and apartment news like this article in your inbox every weekday. Add us on Google Share Copy link Email LinkedIn X/Twitter Facebook Print License Filed Under: Transactions","published_at":1794602403000,"mutable":false,"date_precision":"day","published_date":"2026-11-13","modified_at":0,"extraction":"semantic","canonical":"https://multifamilydive.com/news/affordable-apartment-supportive-housing-multifamily-transaction/874680","content_hash":"c29975458bd99ab513fa199cd9d77022e34ef1a1b6def3501136f454be9dacf1","access":"preview","evidence_status":"preview","id":"a5fa87e31861ce50","source_family":"multifamily-dive","is_research":false,"required_source":false,"first_seen_at":1794778664289,"acquisition_window":{"lower":1794517200000,"upper":1794776400000},"late_discovery":true,"score":14,"tags":["multifamily","national","deals","policy","developer"],"heat_signals":["texas","nuveen"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Why EAH Housing moved into Oregon to buy 1K affordable units"},{"id":"body-1","text":"Why EAH Housing moved into Oregon to buy 1K affordable units The California-based developer acquired 19 properties from Catholic Charities of Oregon and opened a new affordable community in Sacramento."},{"id":"body-2","text":"Published Nov. 13, 2026 Leslie Shaver Senior Reporter Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Good Shepherd Village in Happy Valley, Oregon."},{"id":"body-3","text":"Permission granted by EAH Housing Properties: 19 Buyer: EAH Housing Seller: Catholic Charities of Oregon Property type: Affordable Units: More than 1,000 Location: Oregon EAH Housing has built a large presence in California and Hawaii with more than 25,000 affordable homes across 240 properties."},{"id":"body-4","text":"Earlier this week, the San Rafael, California-based nonprofit owner, manager and developer expanded north by purchasing more than 1,000 affordable homes in the Portland area from Catholic Charities of Oregon, according to a press release."},{"id":"body-5","text":"The 19 properties, which include a mix of family, senior and supportive housing"}],"keep":true,"importance":4,"section":"cre","capital_focus":false,"geo_evidence":"Oregon","primary_event":"property_transaction_financing","event_evidence_id":"body-1","event_evidence":"Why EAH Housing moved into Oregon to buy 1K affordable units The California-based developer acquired 19 properties from Catholic Charities of Oregon and opened a new affordable community in Sacramento.","market_evidence_id":"body-3","market_role":"asset_location","market_scope":"us","market_evidence":"Permission granted by EAH Housing Properties: 19 Buyer: EAH Housing Seller: Catholic Charities of Oregon Property type: Affordable Units: More than 1,000 Location: Oregon EAH Housing has built a large presence in California and Hawaii with more than 25,000 affordable homes across 240 properties.","duplicate_of":null,"selector_reason":"EAH Housing从Catholic Charities of Oregon收购19个项目、超过1,000套可负担住房，扩大其跨州非营利住房平台。","title_zh":"EAH Housing 收购俄勒冈超过 1,000 套保障性住房","summary_zh":"加州非营利机构 EAH Housing 从 Catholic Charities of Oregon 收购波特兰地区 19 个项目、超过 1,000 套保障性住房，涵盖家庭、老年及支持性住房。","impact":"long-pos","evidence_quote":"Why EAH Housing moved into Oregon to buy 1K affordable units The California-based developer acquired 19 properties from Catholic Charities of Oregon and opened a new affordable community in Sacramento. Published Nov. 13, 2026 Leslie Shaver Senior Reporter Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Good Shepherd Village in Happy Valley, Oregon.","evidence_basis":"body","cre_subcategory":"多户"},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Realpage’s New York lawsuit tests the limits of algorithmic rent-pricing bans","link":"https://www.multifamilydive.com/news/realpage-new-york-lawsuit-algorithmic-rent-ban/874678/","description":"Realpage’s New York lawsuit tests the limits of algorithmic rent-pricing bans RealPage Inc. v. James “could provide meaningful guidance on how far state and local governments can go in regulating or restricting these technologies,” a lawyer told Multifamily Dive. Published Nov. 16, 2026 Julie Strupp Senior Editor Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Scott Heins via Getty Images Listen to the article 6 min This audio is auto-generated. Please let us know if you have feedback . A lawsuit regarding New York state’s algorithmic rent-setting ban is testing how far the government can go in restricting such tools without also overly impeding commercial speech, and may provide more clarity about what is within legal bounds, legal experts say. Although it’s difficult to estimate how influential the ultimate decision in RealPage Inc. v. James will be, the preliminary ruling indicates “the case could provide meaningful guidance on how far state and local governments can go in regulating or restricting these technologies without running afoul of the First Amendment,” Corinne Migliazza, associate at real estate law firm Otten Johnson, told Multifamily Dive in emailed comments. In 2024, the Department of Justice and several states sued Realpage and several major landlords that used its pricing product, alleging in United States et al. v. RealPage Inc. et al. that the use of algorithmic software to coordinate rents violated antitrust law. As settlements from that case started rolling out, New York became the first state, in 2025, to impose an outright ban on residential rent-pricing algorithms with its antitrust law amendment S.7882 . Before New York’s ban was set to take effect last year, Realpage went on the offensive. It sued the state in November 2025 on free speech grounds rather than making antitrust arguments. Then it asked the court to halt the ban while its case was being heard. The federal judge agreed to grant a preliminary injunction at the end of September and also denied the state’s January request to dismiss the lawsuit. Judge Valerie Caproni said that some language of the ban likely restricts protected speech more broadly than necessary because it is “undiscerning in targeting software without regard to its use of public versus non-public data.” Although the judge indicated the decision would be a close call, her ruling hints that the court is skeptical of New York’s restrictions, “at least enough to allow more evidence and fact to be developed and presented,” according to Migliazza. “There are also suggestions that the Court may be more receptive to narrowly tailored restrictions, like the initial RealPage settlements, which restricted the algorithms to publicly available information, rather than prohibiting their use outright,” Migliazza said. It remains to be seen whether the court will address particular uses of algorithmic rent-pricing tools in depth. It may decide to only rule on the constitutionality of New York’s restrictions and put the ball in the legislature’s court to find a better solution, according to Migliazza. “Certainly, a First Amendment victory by RealPage would force the legislature back to the drawing board to contour the law towards constitutionality – meaning they would have to make the restrictions less severe,” Migliazza said. New York case impact Algorithmic rent-pricing restrictions are proliferating: New Jersey’s FAIR Act is set to take effect on July 1, 2027, although it is structured differently from New York’s law. Jersey City, New Jersey; Providence, Rhode Island; Philadelphia; Minneapolis; San Francisco; Seattle; Rockville, Maryland, have also passed similar measures. That growing patchwork of algorithmic pricing laws is making compliance more complicated for the rental housing industry, Peter Carstensen, antitrust expert and professor of law emeritus at the University of Wisconsin-Madison, told Multifamily Dive. “What's a developer to do, especially if those regulations are in some way contrary to each other?” Carstensen said. It’s important for rental housing firms to follow these information exchange lawsuits and antitrust litigation more broadly, and to ask, “What are the red lights or the yellow lights that we need to watch out for? How do we make sure that people down in marketing are not creating problems for us?” according to Carstensen. Indeed, landlords are not necessarily in the clear to use algorithmic pricing tools, legal experts at law firm Lowenstein Sandler wrote. They urged caution in New York, and said to prepare for changes in New Jersey and varied algorithmic pricing laws more generally. “Tools that pool competitors’ nonpublic data, discourage price reductions, standardize lease terms, or otherwise limit independent decision-making should be closely reviewed,” according to Lowenstein Sandler. Consultation on the front end to ensure compliance with the relevant jurisdiction’s regulations could save a lot of time, energy and money later on, according to Migliazza, particularly as such regulations continue to evolve. “There is no doubt that as the technological landscape surrounding artificial intelligence changes, the legal one will too,” she said. Recent case developments For now, the New York case continues to unfold. A few weeks following the court’s decision to halt the state’s ban, New York Attorney General Letitia James asked the judge to reconsider and vacate the injunction, per an Oct. 13 filing in the U.S. District Court, Southern District of New York. The state is arguing that Realpage lacks standing to represent third parties who are not named plaintiffs and that S.7882 represents constitutional regulation of commercial speech. Realpage responded by asking the court to stand by its prior ruling , saying in an Oct. 27 filing, “The State simply disagrees with the Court’s conclusion, which is not a proper basis for reconsideration.” Despite the parties’ differing positions, a settleme","published_at":1794840720000,"source_family":"multifamily-dive","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794865086470,"id":"907f9640656ff55d","acquisition_window":{"lower":1794776400000,"upper":1794862800000},"score":13,"tags":["multifamily","national","policy","regulation","regulator"],"heat_signals":[],"date_precision":"day","published_date":"2026-11-16","modified_at":0,"extraction":"semantic","canonical":"https://multifamilydive.com/news/realpage-new-york-lawsuit-algorithmic-rent-ban/874678","content_hash":"45796f21d5bbe310718d1fc5730583c80136442168d77938e35c5831817b52ae","access":"preview","evidence_status":"preview","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Realpage’s New York lawsuit tests the limits of algorithmic rent-pricing bans"},{"id":"body-1","text":"Realpage’s New York lawsuit tests the limits of algorithmic rent-pricing bans RealPage Inc. v."},{"id":"body-2","text":"James “could provide meaningful guidance on how far state and loca tral","evidence_quote":"Realpage’s New York lawsuit tests the limits of algorithmic rent-pricing bans RealPage Inc. v. James “could provide meaningful guidance on how far state and local governments can go in regulating or restricting these technologies,” a lawyer told Multifamily Dive. Published Nov.","evidence_basis":"body","cre_subcategory":"多户"},{"source_id":"realtor-research","source_name":"Realtor.com Research","source_tier":"B","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"October 2026 Hottest Housing Markets","link":"https://www.realtor.com/research/october-2026-hottest-housing-markets/","description":"October 2026 Hottest Housing Markets By Hannah Jones Nov 13, 2026 Highlights Hartford-West Hartford-East Hartford, Conn. claimed the top spot in October for the first time since a summer run on top from May – July 2026. Buyer demand remains highly concentrated in the hottest markets, where listings attracted 2.6 times the national average number of views per property. The Midwest and Northeast were the only regions represented in the Top 20 for the 37th consecutive month. The list was evenly split this month, with 10 markets in the Midwest and 10 in the Northeast. Homes in the hottest markets moved significantly faster than the national norm, with median time on market of 37 days, more than 3 weeks faster than the national norm. Among large U.S. metros, Jacksonville, FL posted the biggest year-over-year improvement, jumping 70 spots to rank 189th nationally. The Hartford, CT metro moved up one spot from last month to claim the top spot on the hottest housing markets list for the first time since the summer. Hartford has ranked in the top 20 a total of 57 times, but has claimed the top spot only eight times. Located in New England, midway between Boston and New York, Hartford is an ideal landing spot for homebuyers looking to take advantage of the relatively low home prices in an otherwise pricey part of the country. In October, Hartford attracted 4.1 times the national average number of viewers per property. Homes sold in just 37 days, one day slower than a year ago but almost a month faster than the national norm. At a median listing price of $440,000, Hartford is priced just above the national norm, in a region generally priced well-above. Realtor.com’s Market Hotness rankings take into account two aspects of the housing market: 1) market demand, as measured by unique views per property on Realtor.com, and 2) the pace of the market as measured by the number of days a listing remains active on Realtor.com. October 2026 – Top 20 Hottest Housing Markets Hottest Metros Hotness Rank Hotness Rank YoY Viewers per Property vs US Median Days On Market Days on Market YoY Median Listing Price Hartford-West Hartford-East Hartford, Conn. 1 -1 4.1 37 1 $440,000 Kenosha, WI 2 -1 2.8 36 4 $385,000 Lancaster, Pa. 3 -1 2.4 30 3 $400,000 Rochester, N.Y. 3 -3 2.5 31 -1 $290,000 Manchester-Nashua, N.H. 5 -1 2.8 38 1 $549,000 Peoria, Ill. 5 -8 2.4 36 -1 $180,000 Erie, Pa. 7 -20 2.8 38 -7 $230,000 Rockford, Ill. 8 -3 2.6 38 -1 $269,000 Waterbury-Shelton, CT 8 -24 2.8 42 -2 $400,000 Monroe, Mich 10 -19 2.8 39 -4 $311,000 Springfield, Mass. 11 10 2.6 39 9 $370,000 Canton-Massillon, Ohio 12 -8 2 35 1 $260,000 Racine, Wis. 13 7 2.2 37 4 $350,000 Reading, Pa. 14 -12 2.1 36 -2 $325,000 Bloomington, Ill. 15 -6 2.3 38 1 $280,000 New Haven-Milford, Conn. 15 10 2.9 43 6 $425,000 Akron, Ohio 17 -8 2.4 39 1 $237,000 Springfield, Ill. 18 0 2 36 0 $230,000 Oshkosh-Neenah, Wis. 19 -12 2.3 38 -7 $320,000 Norwich-New London, Conn. 20 -3 3 44 1 $460,000 Not in the top 20? See rankings for the top 300 markets Affordable New England Metros Retain Popularity Markets in the Northeast that buck the region’s big-city, high-price trend continue to prove popular with home shoppers. Hartford’s median listing price is about 6% above the national norm but 12% below the Northeast’s, and every other Northeast market on the list except Manchester-Nashua, N.H. ($549,000) is also priced below the regional norm. Connecticut accounts for four of the Top 20 markets, with Waterbury-Shelton, New Haven and Norwich joining Hartford at median list prices between $400,000 and $460,000. Springfield, Mass. and Rochester, N.Y. are priced below the national norm and well below the Northeast’s. New England’s compact geography is part of the draw. Hartford, New Haven, Waterbury and Springfield sit within roughly an hour’s drive of one another, so buyers can compare neighborhoods and price points across several metros without leaving the region. That flexibility concentrates demand, and inventory in these markets remains well below pre-pandemic norms. The pull shows up in buyer traffic, with all six New England markets on the list drawing at least 2.6 times the national average views per property, at or above the Top 20 average. For shoppers, widening the search within the region means more options but not much relief from competition, since the affordability that draws buyers to one market is drawing them to its neighbors as well. Most Improved Large Markets Large markets showed renewed momentum in October, moving up the list by 6 spots on average compared to last year. This suggests that big-city markets, while still trailing smaller and more affordable alternatives, are capturing renewed attention as buyers weigh the tradeoffs between affordability and access to larger job centers, especially as home prices soften across much of the country. Jacksonville, Fla. led all large markets with the biggest ranking improvement, climbing 70 spots year over year, while San Francisco and Denver posted notable gains of 38 and 33 spots respectively. Riverside jumped 32 spots, and Sacramento rounded out the top five most improved, advancing 31 spots. The biggest movers were still fairly low on the overall list, ranging from 73rd for San Francisco to 216th for Denver. Four of the five biggest movers were located in the West, with
