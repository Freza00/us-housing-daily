rs — a point at which some may have earmarked for buying a dip,\" said Molly Brooks, US rates strategist at TD Securities. The initial jump came after surging crude prices raised concern about inflationary pressures in the countdown to this week's Federal Reserve decision. The tenor's yield last breached the 5% level in October 2023, and only for one day. Bond prices fell globally on Monday, with UK and German debt sliding as Brent crude approached $110 a barrel. With the rise in energy prices showing little sign of easing, investors are watching whether 5% will again prove a line in the sand for 10-year Treasuries, as happened three years ago. While the yield pulled back to around 4.99% as of about 4:10 p.m. in New York, sentiment remains fragile. At one point, BlackRock Inc.'s iShares 20+ Year Treasury Bond ETF, the largest fund focused on long-duration US Treasuries, touched its lowest intraday level since its 2002 launch. The U.S. Treasury building in Washington. Al Drago/Bloomberg The rise in the US 10-year yield threatens to slow economic growth and weigh on equities that are trading at lofty valuations. This has prompted Treasury Secretary Scott Bessent, who has made long-term borrowing costs a key measure of the administration's success, to boost bond buybacks, encourage Japan to curb Treasury sales and open the door to potentially cutting long-maturity debt issuance. Little Effect None of it has had much effect. In fact, the selloff has only been quickening of late, with 10-year yields heading for their seventh month of increases, matching the longest monthly climb since 2011. Less than two months before the US midterm elections, the 10-year yield is now roughly a full percentage point above its level before the outbreak of the Iran war. The conflict has sparked a surge in oil prices, adding to inflation worries. Those concerns were reinforced by hotter-than-expected consumer-price data for August, prompting traders to boost bets on Fed interest-rate hikes old real estate wealth can continue to rise even as other measures may show a slowing in home price growth. Real estate secured liabilities of households’ balance sheets, i.e. mortgages, home equity loans, and HELOCs, increased 1.1.% in the second quarter to $14.0 trillion. This level is 3.0% higher compared to the second quarter of 2025. Owners’ equity share of real estate assets was 71.9% in the second quarter. This was the 13th consecutive quarter with this share being over 70%. Owners’ equity in real estate totaled $35.8 trillion in the second quarter. Distributional Financial Accounts The quarterly release of the financial accounts by the Federal Reserve includes extensive balance sheet data. As a supplement to the main release, additional data regarding households is released in the distributional financial accounts a few weeks after the main release. This data contains the level and share of aggregate household wealth by income, age, generation, education, and race. The section below focuses on real estate assets value by wealth percentile for households and is current through the first quarter of 2026. In the first quarter, households in the 50-90% wealth percentile held the largest level of real estate assets, totaling $22.7 trillion. Households in this wealth percentile have a net worth between $241,362 and $2,148,339. The wealth percentile with the second-largest level of real estate assets was 90-99%, at $14.8 trillion. These households have a net worth between $2,148,339 and $11,146,846. Households in the bottom 50% in terms of net worth held the third most, at $4.8 trillion, while the top 99-99.9% held $4.5 trillion and the top 0.1% held $1.9 trillion. Households in the top 0.1% wealth percentile have a minimum net worth of $46,369,052. Very few households fall into the three top wealth percentiles. Shifting the real estate asset value to a per household basis results in the top 0.1% owning far more than any other wealth percentile with a per household asset value of $14.2 million. Households in the 99-99.9% percentile had a per household asset value of $3.8 million. Households in the 90-99% wealth percentile held $1.2 million while households 50-90% wealth percentile held $418,893. Households in the bottom 50% of wealth percentile held $71,429 per household. Fed Flow of Funds , Federal Reserve Board Prev Previous Custom Home Premium Highest Since 2011 Leave a Reply Cancel reply Your email address will not be published. Required fields are marked * Comment * Name * Email * Website Yes, add me to your mailing list Share this Page Subscribe to Blog Subscribe Search by Category Construction Statistics Finance Home Sales and Prices Labor Force Macroeconomics Market Trends Policy Research Construction Statistics Finance Home Sales and Prices Labor Force Macroeconomics Market Trends Policy Research Video Updates View Economics Team on the ","published_at":1789399797000,"score":20,"tags":["housing","national","data"],"heat_signals":["fed","trend","trends"],"importance":4,"selector_reason":"美国家庭房地产资产总值接近50万亿美元，反映全国住房财富规模和家庭资产负债表的重要变化。该数据覆盖面广，对住房财富、消费和市场韧性都有参考价值。","section":"national","title_zh":"家庭住宅资产逼近$50T，房主权益稳健","summary_zh":"Q2住宅资产达$49.8T，环比增2.3%、同比增2.5%；房主权益占71.9%，利好财富效应","impact":"long-pos","id":"59460d6e","fetched_at":1789435376118},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Machine Investment Group Buys 490-Unit Multifamily Property In North Dallas: The DFW Deal Sheet","link":"https://www.bisnow.com/news/dallas-ft-worth/deal-sheet/machine-investment-group-buys-490-unit-multifamily-property-in-north-dallas-the-dfw-deal-sheet","description":"Machine Investment acquired the 75 West community in Dallas, with plans to stabilize and enhance its value.","published_at":1789415247000,"score":16,"tags":["multifamily","dfw","deals","institutional"],"heat_signals":["dallas","dfw"],"importance":3,"selector_reason":"Machin ay inflated rents.” Schwalb said that his office will continue to ensure that the district’s housing market is fair and competitive and that “law-abiding landlords can compete on a level playing field.” “District residents face severe housing affordability challenges, and yet some of the largest residential landlords made things worse by illegally colluding to artificially push rents even higher,” Schwalb said in the release. Separately, Schwalb also sued MAA at the end of April for allegedly charging junk fees and hiding the true cost of rent from prospe","published_at":1789415640000,"score":18,"tags":["multifamily","regulation","institutional"],"heat_signals":["housing market"],"importance":4,"selector_reason":"MAA和JBG因RealPage反垄断诉讼向华盛顿特区支付合计930万美元和解金。案件涉及租金算法和房东协调，对多户住宅监管与运营模式具有重要示范意义。","section":"institutional","title_zh":"MAA、JBG为RealPage案支付$9.3M","summary_zh":"MAA与JBG分别支付$1.2M和$8.1M并改进做法，增加multifamily合规与赔偿风险","impact":"short-neg","id":"a913c476","fetched_at":1789435376118},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Sales Of Lower-End Apartments Surge In Philly As Landlords Face Financial Issues","link":"https://www.bisnow.com/news/philadelphia/multifamily/class-c-philly-apartment-sales-surge-owners-squeezed","description":"Sales Of Lower-End Apartments Surge In Philly As Landlords Face Financial Issues September 14, 2026 | 6:52 pm ET Noah Zucker, Philadelphia An increasingly cumbersome regulatory environment has converged with a broad market downturn to make operating apartment buildings in Philadelphia’s outer neighborhoods a major challenge. Some landlords are now heading for the exit. The relative bargains they often leave behind are being scooped up by opportunistic investors. Philadelphia Housing Authority Northmarq tracked 31 sales of multifamily buildings with 25 units or more citywide between the start of the year and July 22, which was nearly double the 16 seen over the same period in 2025. Class-C properties comprised 71% of those transactions this year, up from 46% last year. Ballooning operating costs and a challenging interest rate environment have hit some of those owners hard, and landlords say post-pandemic renter protections have extended eviction timelines. “Everything is going against the small to medium-sized landlord right now,” Philly Office Retail President Ken Weinstein said. “There&#039;s a lot of landlords that are just simply frustrated with the new rules and regulations and how they&#039;re being treated and not appreciated for the services they provide,” he added. The Carlton Park Apartments at 2920 Midvale Ave. in East Falls sold for $20.9M in March 2024, equating to $178,800 per unit. That was down from the $29M and $247,900 per unit it traded for roughly a year and a half earlier. Aside from a student housing complex purchased by the University of Pennsylvania , the biggest Class-C sale Northmarq tracked this year was the Bryn Mawr Apartments at 5100 Lebanon Ave. in April. The 106 units went for $13.8M, or $130,200 each. The following month, the 36-unit St. Jude Apartments at 5016 Pine St. in West Philly sold for $2.5M, or $70K per unit. The price was down about 26% from the $3.4M the property traded for in 2019. While Northmarq Managing Director Lizann McGowan said not every Class-C sale in Philly’s outer neighborhoods this year was the result of financial issues, she said some of them were. “We are hearing that there is a growing amount of stress in the market,” she said. This is particularly true of properties that were purchased via loans originated between 2020 and 2022, when interest rates were exceptionally low. This led to underwriting that was more optimistic than what actually came to pass as many of those loans matured in recent months. “People probably underwrote a cap rate that&#039;s lower than where it would be today,” McGowan said. On top of interest rates, rising construction costs have made it a challenge for owners to implement the value-add plans they envisioned in the immediate aftermath of the pandemic. “That business plan did not materialize, and when the owner bought the property, they put floating-rate debt on it,” McGowan said. “Some of them went back to the lender,” she added. At the same time, elevated insurance premiums, higher salaries for employees, and rising property taxes and utility prices have been weighing on the multifamily sector citywide, said Riverwards Group Managing Partner Mo Rushdy . These broad financial pressures aren’t unique to Class-C properties, but they are hitting that sector particularly hard, since its margins are generally tighter. Google Maps The Bryn Mawr Apartments at 5100 Lebanon Ave. Operating expenses don’t vary much citywide, but owners in the outer neighborhoods can’t charge as much or increase rents to the same degree as owners in places like Center City or Fishtown, Weinstein said. The supply glut Philly proper experienced after developers raced to get projects underway before the expiration of the 10-year tax abatement in 2022 squeezed the low end of the market even further. As Class-B owners offered months of free rent, the effective cost of a lease at those buildings began to compete directly with Class-C in a way it didn’t before the pandemic, R","published_at":1789426344000,"score":14,"tags":["multifamily","deals","distress","institutional"],"heat_signals":[],"importance":3,"selector_reason":"费城低端公寓交易增加，反映运营监管压力与市场下行正迫使部分房东出售资产。该信号揭示了地方多户住宅的财务压力和资产重新定价。","section":"institutional","title_zh":"Philly低端公寓交易激增，房东承压","summary_zh":"截至7月22日交易31宗、近乎翻倍，Class-C占71%，成本与监管压力推高抛售","impact":"short-neg","id":"92dbde1d","fetched_at":1789435376118},{"source_id":"rebusiness-online","source_name":"REBusiness Online","source_tier":"A","source_weight":6,"source_tags":["mixed-asset","deals"],"region":"national","title":"Taylor Morrison Sells 424-Unit West End District Multifamily Property in Beavert ities noted. Furthermore, in the second quarter, insurers purchased 23% of the jumbo issuance. Meanwhile they bought 19% of the home equity line of credit/closed-end second issuance and a similar share of the non-QM issuance. \"In terms of net additions, we still see insurance adding across all RMBS sectors,\" the report said. When it comes to whole loans, insurers bought $11 billion in the second quarter, compared with $13 billion for the prior three-month period. This pace is \"slightly below\" the quarterly average during 2025, when insurance bought $59 billion of whole loans. While the report did not name names, \"at least one new insurance company purchased residential loans for the first time as of the second quarter. Another large insurance firm ramped up their total resi loan purchases to $1.6 billion for the first half of 2026 versus $100 million in 2025.\" However, an insurer which is a large holder of residential mortgages reduced its purchase activity to $2 billion in the second quarter from $3.1 billion for the first three months of 2026. The reason was a shift in investment focus to commercial real estate loans. \"Despite the decline in activity, they remain the top two buyer of resi loans,\" the report said. \"We also see their net resi loan holdings are flat through the first half of 2026, indicating they likely were a seller of resi assets.\" In its agency weekly report, B of A Securities noted based on company filings for 966 insurance companies — 715 property and casualty, 251 life — it estimated segment MBS purchases of $24 billion in the second quarter, $5.3 billion more than in the prior three months. It is also approximately $400 million higher than the quarterly average for 2025 of $23.6 billion. \"The composition of purchases largely followed the patterns observed in previous quarters: Lifers continued to allocate heavily to extra‑long‑duration products such as CMO Z‑bonds, while P C companies maintained a broader and more front‑loaded durat , Hines &#039; 22-24 Pratt St. in Allston, Nordblom Co .&#039;s 83 Leo Birmingham Parkways in Brighton and the New England Development-led Allston Yards Building D in Allston. The developments have all received Boston Planning Department approval, and the city said they would begin construction by 2027. &#34;Residents urgently need more housing now, and we can’t afford to let approved projects that are ready to build remain stalled because of today’s tough economic headwinds,&#34; Wu said in a statement . &#34;These targeted abatements would help put shovels in the ground within the next year, creating 1,400 new homes and over 1,500 jobs — all with no net revenue loss to the City. Boston is open for business and we’ll keep using every tool available to get more housing built for our residents.&#34; These abatements would be used to temporarily defer a portion of the projects&#039; property tax increases, giving the relief necessary to begin construction in the next year. The city said developers would pay at least the same amount in property taxes as they do preconstruction. In selecting these projects, officials said they prioritized larger developments with more than 100 units, including income-restricted housing and high energy-efficiency standards. These projects are set to generate more than $20M in inclusionary development funding and at least 185 income-restricted housing units. The BPDA board will need to approve the abatements at an October monthly meeting before they can be rolled out. A 30-day public comment period is open, and city staff members will hold public meetings to gather community feedback. The city had identified roughly 47 projects that would fit this program, totaling more than 10,000 stalled housing units, Banker Tradesman reported . Wu said other developments could receive similar tax breaks supporting up to $100M in similar agreements, B T reported. The four selected projects were the closest to breaking ground. Wu previously floated the
