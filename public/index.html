. &#8220;We&#8217;re thinking about an IPO for that. It&#8217;s not a rush.&#8221; The last reported talk around the GSEs&#8217; potential IPO was back in November . At that time, Pulte said while speaking at a conference in New York City that Fannie and Freddie would remain in federal conservatorship, but that the government was exploring the sale of up to 5% of their shares. The future of the GSEs has been a closely watched issue during Trump&#8217;s second term. The companies have operated under federal conservatorship since the 2008 financial crisis and now support roughly 70% of the U.S. mortgage market, making any changes to their ownership structure highly consequential for housing finance. Trump revived discussion of Fannie Mae&#8217;s and Freddie Mac&#8217;s future in May 2025 when he said he was giving &#8220;serious consideration&#8221; to taking the companies public while maintaining the government&#8217;s implicit guarantee. Since then, the administration has consulted with major bank executives, including JPMorgan Chase &#8216;s Jamie Dimon, Goldman Sachs &#8216; David Solomon and Bank of America &#8216;s Brian Moynihan. In August, the president signaled plans for an IPO. Investor enthusiasm surrounding the possibility of an IPO boosted shares of Fannie and Freddie last year. But Bloomberg reported that both companies&#8217; stocks have fallen more than 30% this year as doubts emerged about whether the administration would ultimately move forward with the plan. As of Friday at 4:15 p.m. EtT, Fannie Mae&#8217;s stock (FNMA) had dropped 0.74% and Freddie Mac&#8217;s (FMCC) was down 1.07%. Pulte&#8217;s double duty As Pulte is gearing up to add acting director of national intelligence to his resume on June 30, Trump told The Wall Street Journal on Friday that he wants him to begin reducing staffing across the U.S. intelligence community. The president said he believes the Office of the Director of National Intelligence is &#8220;unnecessary&#8221; or &#8220;too big.&#8221; Trump also indicated this week that he does not plan to nominate Pulte for the position permanently once his temporary appointment expires. He told reporters on Thursday that Pulte “is not going to be permanent” because “I don’t think he’d want to be permanent,” according to multiple media reports. Pulte&#8217;s selection has drawn criticism from Democrats and some Republicans who have questioned his lack of national security experience. The role requires Senate confirmation, although some lawmakers have indicated that they would not approve the nomination. Sens. Bill Cassidy (R-La.), Susan Collins (R-Maine) and Lisa Murkowski (R-Alaska) joined Democrats on Thursday in backing an amendment that would bar Pulte from serving as acting director of national intelligence while simultaneously leading the FHFA. Related More: Donald Trump Fannie Mae FHFA Freddie Mac GSE Reform","published_at":1780692184000,"score":21,"tags":["housing","national","ipo","policy","regulator"],"heat_signals":["fed","freddie mac","fannie mae"],"importance":5,"selector_reason":"特朗普称Fannie Mae和Freddie Mac IPO仍在考虑中，直接关系美国住房金融体系和GSE退出托管路径。该事项具有系统性政策和资本市场影响，评为imp=5。","section":"national","title_zh":"Trump称Fannie、Freddie IPO仍在考虑","summary_zh":"GSEs 支撑约70% mortgage 市场，IPO非紧急但未搁置","impact":"neutral","id":"8d5c29c1","fetched_at":1780709647028},{"source_id":"rebusiness-online","source_name":"REBusiness Online","source_tier":"A","source_weight":6,"source_tags":["mixed-asset","deals"],"region":"national","title":"BLS: U.S. Economy Adds 172,000 Jobs in May","link":"https://rebusinessonline.com/bls-u-s-economy-adds-172000-jobs-in-may/","description":"WASHINGTON, D.C. —&#160;Total nonfarm employment in the United States increased by 172,000 jobs in May, according to the U.S. Bureau of Labor Statistics (BLS). The figure shows a slight decrease from the upwardly revised 179,000 in April, and far above the 80,000 figure expected by Dow Jones economists, according to CNBC. The unemployment rate, which sits at 4.3 percent, changed little in May. In addition, March’s number increased by 29,000, raising the total to 214,000, while April revisions increased by 64,000, lifting the final figure to 179,000. With these revisions, employment in March an","published_at":1780668436000,"score":10,"tags":["national","macro","data","regulator"],"heat_signals":[],"importance":5,"selector_reason":"BLS数据显示美国5月新增非农就业17.2万人，失业率维持4.3%，显著高于市场预期。就业数据直接影响美联储利率路径、按揭利率和房地产融资环境，评为imp=5。","section":"national","title_zh":"BLS：美国5月新增172K jobs","summary_zh":"就业高于80K预期，失业率4.3%持平，Fed降息压力减弱","impact":"short-neg","id":"6b7296e0","fetched_at":1780709647028},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"HUD seeks feedback on FHA minimum property requirements","link":"https://www.housingwire.com/articles/hud-fha-mpr-feedback/","description":"The U.S. Department of Housing and Urban Development (HUD) is seeking public feedback on whether the Federal Housing Administration (FHA)&#8217;s property requirements for single-family homes should be updated to better reflect current market conditions and reduce barriers to homeownership. In a request for information (RFI) published in the Federal Register, HUD said it is reviewing FHA&#8217;s Minimum Property Requirements, or MPRs, which establish the standards homes must meet to qualify for FHA-insured financing. The agency said the effort is intended to help inform future policy changes aimed at supporting sustainable homeownership while maintaining safeguards for borrowers and the FHA&#8217;s Mutual Mortgage Insurance (MMI) Fund . Comments are due by June 29. FHA has required homes securing FHA-insured mortgages to meet minimum standards since the program&#8217;s inception. The requirements are intended to ensure that properties are safe, sound and secure while protecting the financial stability of the MMI Fund. Under current rules, FHA-approved lenders are responsible for determining whether a property meets FHA standards. When appraisals or inspections identify deficiencies that prevent a property from meeting FHA requirements, repairs generally must be completed before the loan becomes eligible for FHA insurance. HUD said the last major overhaul of the MPR framework occurred more than 20 years ago. That update, implemented through Mortgagee Letter 2005-48, reduced the agency&#8217;s emphasis on requiring repairs for minor cosmetic issues and normal wear and tear. According to HUD, many FHA appraisals still result in repair conditions or additional inspection requirements. While similar property standards exist for loans backed by the government-sponsored enterprises Fannie Mae and Freddie Mac , some industry stakeholders contend that FHA transactions experience higher rates of repair requirements and reinspections. HUD said these requirements can add costs and delays that may not always provide corresponding benefits to home quality or safety. The agency also noted concerns that some sellers may be reluctant to accept offers from buyers using FHA financing, due to a perception that FHA loans are more likely to require repairs before closing. Through the request for information, FHA is seeking feedback on whether current MPRs adequately protect borrowers and the mortgage insurance fund, which requirements may no longer be necessary, and whether additional flexibility for post-closing repairs should be considered. The agency is also requesting input on whether FHA&#8217;s appraisal process and appraisers&#8217; role in identifying property deficiencies remain consistent with modern appraisal practices, as well as ways to simplify and clarify the requirements for lenders, appraisers and borrowers. HUD&#8217;s RFI follows a letter sent last month from industry trade groups — including the Mortgage Bankers Association (MBA), Broker Action Coalition (BAC) and Community Home Lenders of America (CHLA) — to HUD Secretary Scott Turner that urged the FHA to address MPRs and other appraisal reforms. &#8220; MBA has long urged FHA to modernize its MPRs and better align its standards with the property condition rating frameworks used by Fannie Mae and Freddie Mac (the GSEs),&#8221; a spokesperson told HousingWire . &#8220;This would reduce operational friction while maintaining appropriate safety and soundness protections.&#8221; &#8220;We believe alignment between FHA and GSE property standards could help reduce appraisal-related delays, improve consistency across the market, and expand access to qualified appraisers. We will meet with our members to formulate our response by the June 29 deadline.&#8221; Steve Irwin , president of the National Reverse Mortgage Lenders Association (NRMLA), also issued a statement about the RFI. &#8220; NRMLA and its membership appreciate HUD’s publishing of the recent RFI on minimum property requir","published_at":1780688246000,"score":21,"tags":["housing","national","policy","regulator"],"heat_signals":["fed","freddie mac","fannie mae"],"importance":4,"selector_reason":"HUD就FHA单户住房最低物业要求征求意见，可能影响FHA贷款可及性和购房门槛。属于全国性住房金融监管政策调整，评为imp=4。","section":"national","title_zh":"HUD拟更新FHA最低房屋标准","summary_zh":"MPRs逾20年未大修，6月29日前征求意见，或降低购房门槛","impact":"long-pos","id":"5a186043","fetched_at":1780709647028},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Zillow’s MRED feed remains safe, but Realtracs showdown nears June 8 deadline","link":"https://www.housingwire.com/articles/zillow-tro-mred-extended/","description":"A federal judge in Chicago has extended Zillow ’s temporary restraining order against Midwest Real Estate Data (MRED) in the listing portal giant’s antitrust lawsuit against the Chicagoland MLS and Compass International Holdings . On Thursday morning, Zillow filed a motion to extend its temporary restraining order against
