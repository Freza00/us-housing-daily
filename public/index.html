es statewide, the first such ballot questions put to voters in the country. The challenge is making sure voters get to the question. It is the seventh on a nine-question ballot, tying the record for the most statewide questions in Massachusetts history. Housing advocates worry that voters may tire before they reach it or skip a question they don&#8217;t understand. &#8220;There&#8217;s risk of voter fatigue,&#8221; Jesse Kanson-Benanav, executive director of Abundant Housing Massachusetts , told HousingWire TBD . The housing question is competing with higher-profile fights. Voters are also being asked whether to repeal recreational marijuana, weigh in on recent gun law changes, change how primaries work and cap state revenue growth. What Question 7 would do The measure would cap minimum lot sizes at 5,000 square feet. It would apply only to residentially zoned lots with at least 50 feet of frontage and access to public water and sewer. Boston is excluded because the city has taken its own steps. The cap would reach most of the state&#8217;s populated areas but leave out most of Cape Cod, Martha&#8217;s Vineyard, Nantucket and the Berkshires. More than half of Eastern Massachusetts towns now require at least an acre per single-family lot, and some require two. The Massachusetts Municipal Association opposes the measure but still hasn&#8217;t formed a campaign committee to spend against it. The state Republican Party also opposes it but hasn&#8217;t mounted organized opposition. Meanwhile, Republican gubernatorial candidate Mike Minogue supports the measure as he tries to unseat Gov. Maura Healey, who also backs it. Supporters have raised heavily. The Legalize Starter Homes campaign has raised more than $1.7 million, with major contributions from real estate groups. Abundant Housing Massachusetts has launched a field operation to turn out supporters. Backers pitch the measure as one way to address the state&#8217;s housing affordability challenges, with a message built on smaller, lower-cost homes on smaller lots. Kanson-Benanav said no measure has ever won a simple majority and still missed the 30% mark. Housing supply advocates aren&#8217;t taking any chances. The measure&#8217;s odds improved when the state&#8217;s Supreme Judicial Court ruled that a controversial rent stabilization measure had to come off the ballot. Healey and others strongly opposed that measure, which could have fractured the loose coalition backing lot reform. Voters would have had to choose between the two, vote &#8220;yes&#8221; on both or reject one or both. With rent stabilization gone, housing advocates across the board could focus on a single affordability measure, Kanson-Benanav said. California: Proposition 45 Proposition 45 would set deadlines for environmental reviews and court challenges under the California Environmental Quality Act. It would cover housing, water, energy, education, health and transportation projects. Agencies would generally have 365 business days to finish a full environmental impact report, and courts would have 270 days to resolve challenges. The measure would also cap public-comment periods, narrow tribal consultation and limit judicial review. Opponents say that weakens environmental safeguards. Suppor","published_at":1792333590000,"score":13,"tags":["housing","national","policy"],"heat_signals":[],"importance":4,"selector_reason":"加州、佛州和马萨诸塞州选民将直接表决分区、许可和房产税等住房政策。多州住房可负担性政策进入选票，可能影响开发环境和住房供给。","section":"national","title_zh":"选民将表决住房可负担性方案","summary_zh":"California、Florida、Massachusetts将表决 zoning、许可和税制，结果待观察","impact":"neutral","id":"2c10c877","fetched_at":1792373054910},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Proposition 45 Would Set Deadlines For Some Projects&#039; CEQA Reviews","link":"https://www.bisnow.com/news/los-angeles/development/california-election-proposition-45-ceqa","description":"Proposition 45 pr e York Road in Katy. Sapphire Industrial Lending provided debt financing for the acquisition. Chaim Friedman led the financing for Sapphire. *** KBUSA Properties, the investment arm of Kingsley Beverages USA, purchased two Houston manufacturing buildings totaling 63K SF. The 100% leased properties are at 14406 and 14420 Wagg Way Road. Jason Tangen and Barrett Gibson of Colliers represented KBUSA. LEASES EōS Fitness leased 40K SF at 1234 Interstate 45 N. to open its first location in Willis. NewQuest represented the tenant, while Jarrett Adame with First Hartford Realty Corp. represented the landlord. CONSTRUCTION AND DEVELOPMENT Lovett Homes plans to build six freestanding homes in a half-acre gated community at 2614-2618 and 2704-2708 Mid Lane, near the River Oaks District and Highland Village. Lovett Homes acquired the property in March and anticipates breaking ground in ","published_at":1792365029000,"score":19,"tags":["office","houston","deals","developer"],"heat_signals":["texas","houston","occupancy"],"importance":3,"selector_reason":"休斯顿拟拆除并重建27层办公楼，反映办公资产重整与城市更新趋势。事件涉及大型城市核心资产，但尚未披露明确交易规模，因此评为常规动态。","section":"cre","title_zh":"Houston市推售767K SF办公楼重建机会","summary_zh":"Houston拟出售27层、767K SF办公楼，拆除重建或改住宅酒店","impact":"long-pos","id":"cfed89e1","fetched_at":1792373054910,"cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Bowser Wants To Lock In A $550M Spa Before She Leaves. D.C. Council Members Are Pushing Back","link":"https://www.bisnow.com/news/washington-dc/economic-development/bowser-wants-to-lock-in-a-550m-spa-before-she-leaves-d-c-council-members-are-pushing-back","description":"Bowser Wants To Lock In A $550M Spa Before She Leaves. D.C. Council Members Are Pushing Back October 18, 2026 | 12:25 pm ET Emily Wishingrad, Washington, D.C. Muriel Bowser has overseen a development boom in her nearly 12-year run as D.C. mayor: the revitalization of massive waterfront sites and new neighborhoods sprouting up out of obsolete federal lands and industrial districts. In her last year, she set the stage for the largest of them all: an NFL- stadium-anchored neighborhood . Before her tenure ends, she’s making a final push to set up one more project for success. Poplar Point , the District’s last major waterfront development opportunity, would be anchored by a $550M thermal bathing retreat. But the presumptive new mayor is standing in her way. And some members of the D.C. Council have questions about the proposed use and are pushing back against Bowser's ambitious timeline. “You're asking the Council to take a limited, now, amount of time to scrutinize a project proposal because it was sent to us late,” At-Large Councilmember Christina Henderson told Bisnow . “So I don't necessarily feel any sense of needing to rush.” Courtesy of Therme/DSR A rendering of Therme DC, the $550M spa planned to anchor Poplar Point A major hurdle to Bowser's plan comes from presumptive D.C. mayor Janeese Lewis George , who is raising concerns specifically about Therme Group 's proposed thermal bathing spa on a site she says should prioritize housing creation. Lewis George, who represents Ward 4 on the D.C. Council, heads one of the committees now reviewing two pieces of legislation that would move the project forward. But she told The Washington Sun earlier this month that she would not hold a hearing on them this year and will “wait until next year in some capacity.” But such a delay could threaten the project. The Bowser administration and Therme, which was selected to build the wellness retreat a year and a half ago, say there’s no time to wait. “I always think that when you have a deal with a private partner, particularly at a time of economic uncertainty or volatility, then it's important to secure a commitment from a private partner as quickly as possible, and that is what we are doing,” said Deputy Mayor for Planning and Economic Development Nina Albert. Therme Group US Executive Chairman John Alschuler told Bisnow that his company hopes to break ground in three years and finish construction three years after that — around 2033. But time is of the essence, he said, and it’s imperative for the Council to pass the legislation this session, which ends on Jan. 2. “Delay would create significant risk to the ability of the District to proceed,” he said. Road To 110 Acres Of Opportunity Poplar Point, a 110-acre parkland that sits on the eastern bank of the Anacostia River, has long been envisioned as a future waterfront neighborhood, much like the Navy Yard or The Wharf. In 2006, Congress passed legislation setting the requirements the District must meet to acquire the land, including environmental assessments and cleanup efforts and moving federal facilities off the site. Over the past few years, the Bowser administration has accelerated efforts to kick-start the project. In August 2024, it selected HR A Advisors as its owner's representative to guide the District through securing control and developing the site. At the same time, it put out a request for expressions of interest for a ​​“destination anchor” to take 15 acres of the land. Therme, an Austrian-based thermal bathing company with plans to scale globally, had been looking for a spot in D.C. since 2023 to plant its first U.S. location. The company was the only respondent to that RFEI, Albert told Bisnow . At the Bowser administration's annual March Madness event in 2025, Bowser announced that the District had selected Therme to anchor Poplar Point. Bisnow/Emily Wishingrad Therme Group US Executive Chairman John Alschuler speaks at D.C.'s March Madness event in 2025. “They have a","published_at":1792340700000,"score":17,"tags":["mixed-asset","deals","developer"],"heat_signals":["fed","annual"],"importance":4,"selector_reason":"华盛顿特区拟推动5.5亿美元大型水疗开发项目，并引发市议会争议。项目规模大且涉及地方政府重大开发决策，具有行业中等重要性。","section":"cre","title_zh":"D.C.议员阻击550M美元Therme温泉 mer protection provisions in the bill will make acquiring power much more expensive, adding significant development costs early in projects that could push smaller operators to the sidelines. “Upfront capex, especially speculative, is a death knell,” said Harmol Samra, CEO of AI data center provider Host Digital. “This is just going to slow everyone down.” BAAJA is centered on measures intended to speed up the construction of energy assets, power transmission and other infrastructure, plus other major industrial projects for industries like manufacturing and mining. To do so, the bill would impose firm deadlines for permit approvals, exempt more projects from lengthy reviews, limit how long approvals can be challenged and give previously approved projects greater legal protection. Controversially, it would also make significant changes to the National Environmental Policy Act, the Clean Water Act and the Endangered Species Act. Those provisions have drawn vocal opposition from some environmental groups, with the Center for Biological Diversity calling it a “back-door deal” meant specifically to accelerate data center development. “This would be a golden ticket for huge AI data centers and tech billionaires. Gutting environmental safeguards means opening the floodgates for more gas-powered data centers fouling the air and draining communities’ water supplies,” said Camden Weber, senior climate and energy policy specialist at the Center for Biological Diversity. While other environmental groups have been more receptive — particularly to provisions aimed at accelerating transmission infrastructure that could bring more renewable generation onto the grid — there is truth in the notion that data centers will benefit from faster permitting. Large campuses can face federal delays when projects affect wetlands or trigger environmental or historic preservation reviews. More consequentially, faster approvals for new transmission and generation could shorten the wait for electricity in markets where developers can wait years for grid connections. Yet beyond its permitting reforms, BAAJA also contains a separate set of provisions aimed squarely at data centers, specifically at one of the sector’s most contentious issues: who ends up paying for the billions of dollars of new power infrastructure needed to provide them with electricity. The measures, which apply to data centers larger than 20 megawatts, are intended to ensure that regular electricity customers don’t get stuck with the bi","published_at":1792360924000,"score":16,"tags":["data-center","national","policy","regulator"],"heat_signals":["fed"],"importance":4,"selector_reason":"两党参议员推动数据中心更快获得电力的许可改革法案。该政策可能影响AI数据中心建设速度与成本，属于重要监管动态。","section":"cre","title_zh":"参议院拟加速Data Center接电但提高成本","summary_zh":"法案可简化许可和电网接入，却可能推高data center建设成本，影响分化","impact":"neutral","id":"108b0657","fetched_at":1792373054910,"cre_subcategory":"数据中心"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Why Billionaire Andy Ansin Is Self-Funding 2 South Florida Megaprojects","link":"https://www.bisnow.com/news/south-florida/construction-development/andy-ansin-sunbeam-miramar-cove-north-bay-village","description":"Why Billionaire Andy Ansin Is Self-Funding 2 South Florida Megaprojects October 18, 2026 | 2:05 pm ET Chloe Gallivan, South Florida After Andy Ansin ’s father passed away in August 2020, the family’s media empire and vast real estate portfolio, including massive land holdings that had sat untouched for decades, were left to him. One of the first things the now-third-generation CEO of Sunbeam Properties did was meet with developers to discuss building something ambitious on one of his family's big, idle sites. Through those conversations, he discovered something about how he would approach leading the family business. Taking on hundreds of millions of dollars in debt or having to share control with an equity partner — both of which would have a heavy hand in project decision-making — was unfathomable. Instead, the billionaire decided to dip into his family’s fortune to pay for the $1B first phase of Miramar Cove, with thousands of apartments, shops, restaurants and a 5.5-acre blue-water cove with a fountain on 125 acres in southwest Broward County. Bisnow/Chloe Gallivan Andy Ansin discusses the plans for Miramar Cove in between pauses of the nearly seven-minute promotional video at his office in North Bay Village. Ansin said utilizing the inherited wealth allows him to have “the freedom to do what's right.” “When you're building all-cash, there's no risk of losing the project,” he said in an interview last week. “You don't have a lender that's going to foreclose or say that there’s some form of actual or technical default. Really, what your risk is is what return are you going to get, and at what point in time?” Ansin leads Sunbeam Television Corp., owner of local Fox and ABC affiliate WSVN-Channel 7 and two TV stations in Boston, and Sunbeam Properties, which has accumulated and developed a massive real estate portfolio across Florida, California and Indiana — both of which his grandfather founded in the 1950s. With his developer hat on, the 62-year-old has taken the reins of two massive mixed-use developments in Miramar and North Bay Village , which he plans to self-finance through at least their first phases. Ansin tapped Fort Lauderdale-based Stiles to lead the development of Miramar Cove on a fee basis, an agreement that allowed Sunbeam to keep control but have access to an experienced development and construction team, he said. “Most developers, if you went to and asked them to do it on a fee, they wouldn't because they want the equity,” Ansin said. “Even if they did, they might not get their best team, where Stiles had both the development side and the construction side that they deliver, which meant we didn't have to staff up.” Miramar Cove is set to rise on a site that Ansin’s grandfather purchased for $100 per acre in the late 1940s following World War II. It's on the cusp of the Broward and Miami-Dade county line and less than a 15-minute drive north of Hard Rock Stadium The lot was originally intended to house the sixth phase of the 500-acre, 5M SF Miramar Park of Commerce , a warehouse and office campus next to Miramar Cove that the Ansin family has developed in phases since the 1980s. Ansin’s father, Edmund Ansin, previously entertained selling the site to a cruise line or an indoor water park, but nothing stuck. Now, Sunbeam and Stiles are under construction on Miramar Cove’s first phase, which is planned to include 2,874 apartments, 400K SF of retail, dining and entertainment, 125K SF of office and a 185-key hotel surrounding a man-made cove by Blue Mar Basins, where visitors and residents will have access to recreational activities like swimming, rowboats and a water fountain show. Courtesy of Sunbeam Properties The Ansin family has owned the lot for decades. Foundation work is underway for the project’s two apartment buildings, referred to as MF1 and MF2, Ansin and Sunbeam Properties Executive Vice President of Development James Bry said in an interview at WSVN's North Bay Village office last week. Greystar , ","published_at":1792346700000,"score":12,"tags":["mixed-asset","florida","deals","developer"],"heat_signals":[],"importance":4,"selector_reason":"南佛州开发商将自筹资金推进两个大型综合开发项目。该事件体现高利率环境下高净值资本对Sun Belt大型项目的持续投入，具有区域市场代表性。","section":"cre","title_zh":"Andy Ansin全现金推进$1B South Florida项目","summary_zh":"Andy Ansin以家族资金投入$1B首期，避免债务和股权稀释，开发确定性高","impact":"long-pos","id":"38ffb6a3","fetched_at":1792373054910,"cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"San Pedro&#039;s West Harbor Announces 3 New Tenants: The Los Angeles Deal Sheet","link":"https://www.bisnow.com/news/los-angeles/deal-sheet/
