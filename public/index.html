cher program, but the federal government is refusing to distribute the funding. Tenants fear they could end up in shelters, while panicked landlords, caught between mounting expenses and diminishing capital reserves, try to figure out if they can afford to let vulnerable renters stay in their homes. Photo credit: Unsplash/Kateryna Hliznitsova “Lease renewals come up, and neither the tenant nor the landlord really know at this point for how long they can depend on this source of income,” Enterprise Community Partners Senior Director of Policy and Communications Patrick Boyle said. “These are not owners that are seeking to evict people … but eventually they&#039;re going to be at a place where the funding and the payments are going to stop.” Emergency Housing Vouchers were introduced during the pandemic as a temporary measure to help vulnerable, low-income residents avoid eviction. The $5B program was intended to run for 10 years — hopefully long enough for working-class Americans to get back on their feet after the most economically devastating event since the 2008 financial crisis. But apartment rents soared in the years that followed the pandemic. The cost of a one-bedroom apartment in the 50 largest U.S. metro areas grew by 41% between 2020 and 2025, according to a study from loan marketplace LendingTree. And even as rent growth wanes nationally , 39 of the 50 metro areas tracked by Apartments.com recorded year-over-year rent increases in July. The rapid increase in housing costs has exhausted the funding of vouchers four years early. Of the 70,000 vouchers HUD issued in 2021, almost 42,000 are still being used to lease apartments, according to federal data . The Department of Housing and Urban Development has said the vouchers won&#039;t be available after this year. Lawmakers have been trying to fix that. Earlier this year, Congress appropriated $264M for Tenant Protection Vouchers, a program that would help EHV holders stay in their homes. But HUD hasn’t issued the vouchers, with officials telling Gothamist last month that Congress didn’t specifically direct the agency to keep funding the program. “It&#039;s hard to not walk away from this feeling like HUD has just taken a position to end a very necessary program,” said Cathy Pennington, senior vice president and general manager at New York City nonprofit landlord and developer Phipps Houses . HUD didn’t respond to a request for comment. It isn’t just tenants who are afraid of the impacts of the funding drying up, said Rachel Fee , the executive director of nonprofit advocacy group the New York Housing Conference . “The affordable housing owners who were leasing up buildings at the time these vouchers came online, they took tenants with these vouchers, really not understanding that this would be such a short-term subsidy,” she said. “These owners are really stressed out.” Photo credit: Courtesy of Phipps Houses Owner Phipps Housing expects to face hundreds of thousands of dollars in losses on Apex Place Apartments, a 100% affordable housing development in Forest Hills, if the Emergency Housing Voucher program doesn’t receive more funds. Like other federal housing vouchers, ","published_at":1785971039000,"score":22,"tags":["housing","national","policy","regulator"],"heat_signals":["fed","year-over-year","rent growth"],"importance":4,"selector_reason":"HUD 扣留住房券资金影响租户和房东现金流，涉及联邦住房援助执行和租赁市场稳定。政策与资金链影响较广，评为 imp=4。","section":"national","title_zh":"HUD 扣留 voucher 资金压垮租赁链","summary_zh":"$264M voucher 资金未发放，租客面临失房，房东现金流承压","impact":"short-neg","id":"001f7e71","fetched_at":1785979431739},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"More Texas multifamily loans moved to servicing in late July","link":"https://www.multifamilydive.com/news/multifamily-cmbs-loans-special-servicing/827095/","description":"An article from More Texas multifamily loans moved to servicing in . HPP has sidestepped questions about Netflix and its future at HPP properties on previous earnings calls. Executives were noncommittal on Wednesday but did allude to speculation that Netflix was moving on from the Hollywood buildings. “All we can say is that our relationship and conversations are completely ongoing, to the contrary of what other people are talking about,” HPP CEO Victor Coleman said. Office leasing at HPP improved in the second quarter, due in part to an 894K SF lease with the city and county of San Francisco at 1455 Market St. The weighted average of the lease term in that deal is 24 years. Including that San Francisco deal, HPP signed 1.3M SF of new and renewal office leases, with 61% new leases and 39% renewals. It also has about 50% coverage on approximately 400K SF of leases set to expire through the remainder of the year. In Los Angeles, HPP is focusing on the Westside, where leasing activity and rents are on the rise. At HPP’s Fourth and Traction, in the Arts District, a PayPal subsidiary is set to vacate about 130K SF, but the REIT has signed on tenants to backfill 80% of that space. The company is also progressing on its efforts to bring the Quixote soundstage and production rentals business into profitability, reducing its losses from $18.6M in 2024 to about $4M in the second quarter. Of Quixote’s 10 existing leases, HPP has gotten out of five of them and is in negotiations to exit the remaining five. Once the exits are complete, Quixote will be a fleet business with about 1,000, largely LA-based vehicles, Lamas said. HPP’s studio stages were 74.6% leased during the second quarter, up 180 basis points from the previous quarter. HPP leadership anticipates a shift in the tide for stages, citing improved show counts in New York and pointing to “relatively stable” numbers in LA, and anticipating more business as the industry works its way through a backlog of tax-credit-approved projects. With entertainment unions the Screen Actors Guild-American Federation of Television and Radio Artists, Writers Guild and Directors Guild all ratifying new four-year agreements, “the labor risk that drove much of the industry&#039;s recent volatility is now off the table,” Coleman said. Continue reading this story with a free account Log in or register Contact Bianca Barragán at bianca.barragan@bisnow.com Related Topics: Harout Diramerian , Hudson Pacific Properties , Los Angeles office , Los Angeles office market , Soundstages , Victor Coleman","published_at":1785967938000,"score":20,"tags":["mixed-asset","california","distress","deals","institutional"],"heat_signals":["fed","blackstone"],"importance":5,"selector_reason":"Hudson Pacific 与 Blackstone 支持的 11 亿美元贷款进入特别服务，涉及大型 CRE 债务压力和头部机构资产。金额巨大且有违约/展期风险外溢，评为 imp=5。","section":"cre","title_zh":"Blackstone-HPP $1.1B loan 进 special servicing","summary_zh":"$1.1B CMBS 临近到期转 special servicing，虽谈延期但 refi 压力显著","impact":"short-neg","id":"36a06a36","fetched_at":1785979431739,"cre_subcategory":null},{"source_id":"connect-cre","source_name":"Connect CRE","source_tier":"A","source_weight":7,"source_tags":["mixed-asset","deals"],"region":"national","title":"Docusign Headquarters Hits the Market at Reported $250M","link":"https://www.connectcre.com/stories/docusign-headquarters-hits-the-market-at-reported-250m/","description":"An office property in San Francisco's South Financial District that's home to software firm Docusign Inc. is hitting the market with one of the highest asking prices seen locally since the pandemic, the San Francisco Business Times reported. The 383,000-square-foot 221 Main St., owned by Pimco Prime Real Estate and managed by Columbia Property Trust, ... The post Docusign Headquarters Hits the Market at Reported $250M appeared first on Connect CRE .","published_at":1785962321000,"score":13,"tags":["office","california","deals","institutional"],"heat_signals":[],"importance":4,"selector_reason":"旧金山 Docusign 总部物业以约 2.5 亿美元挂牌，是疫后当地高价办公资产交易信号。单体金额超过 2 亿美元，且反映办公市场 cing a suspension of its common dividend “to prioritize debt reduction and balance-sheet strength.” Second quarter earnings UWM reported loan origination volume of $39.7 billion in Q2, flat year over year and down from $44.9 billion in the first quarter. Total gain-on-sale margin was at 133 basis points, up from 123 bps in the first quarter and 113 bps in the second quarter of 2025 Despite stable volume and a higher gain-on-sale margin, UWM reported a net loss of $451.9 million for the quarter, compared with a profit of $170.4 million in the first quarter and $314.5 million in the second quarter of 2025. &#8220;We saw a net loss of $451.9 million primarily driven by a unique hedge-related event tied to the anticipated Two Harbors MSR transaction. It was a quarter-specific mark-to-market impact and does not reflect the underlying strength of UWM&#8217;s core business,&#8221; a UWM spokesperson said. On the servicing side, UWM’s MSR portfolio unpaid principal balance grew to $247.6 billion with a weighted average coupon of 5.93%, up from $229.5 billion and 5.90% as of March 31. UWM ended the second quarter with roughly $1.3 billion in available liquidity, including $498.4 million in cash and available borrowing capacity under secured and unsecured credit lines. The earnings release shows equity nearly halved to $985.3 million over the past year and non-funding leverage more than tripling to 6.13 times, explaining why UWM moved to raise permanent capital, suspend the dividend and prioritize deleveraging. Strategic moves UWM is bringing in $1.65 billion of preferred equity at closing from the Ishbia family and Oaktree, with an additional $400 million targeted through a rights offering for Class A shareholders, if needed. Investors will receive warrants in connection with the transaction, further linking returns to future performance. The company will suspend its quarterly common dividend and focus on debt reduction and balance-sheet strength, with a stated goal of using earnings and manageable leverage to pay down the preferred equity over time. Proceeds will be used on “balance sheet fortification, including repayment of existing debt, repayment of MSR financing facilities and support for general corporate purposes.” UWM’s board has also agreed to add an Oaktree representative and has given the firm the right to nominate one additional independent director, adding a large institutional credit investor to its governance mix. “We are thrilled to partner with Mat and the UWM team at a pivotal time for the mortgage industry,” Nick Basso, co-Head of North America for Oaktree’s Global Opportunities Group, said a statement. “Mat has built an exceptional business, and Oaktree’s commitment reflects our conviction in UWM’s differentiated platform, m","published_at":1785964291000,"score":18,"tags":["housing","national","fundraising","earnings","lender"],"heat_signals":["year over year"],"importance":5,"selector_reason":"UWM 宣布 20.5 亿美元战略资本合作，同时披露二季度亏损，影响美国最大按揭贷款机构的资本结构和竞争格局。融资规模远超 5 亿美元门槛，评为 imp=5。","section":"institutional","title_zh":"UWM 获 $2.05B 资本但 Q2 转亏","summary_zh":"UWM 创纪录募资$2.05B，同时暂停普通股分红以降债，增长伴随压力","impact":"neutral","id":"4922f2a5","fetched_at":1785979431739},{"source_id":"national-mortgage-news","source_name":"National Mortgage News","source_tier":"A","source_weight":7,"source_tags":["rates","macro"],"region":"national","title":"Real estate investors say conditions are getting bleaker","link":"https://www.nationalmortgagenews.com/news/real-estate-investors-say-conditions-are-getting-bleaker","description":"An industry sentiment index hit a new low, with 45% of investors saying the current business environment has worsened compared to a year ago.","published_at":1785959447000,"score":13,"tags":["mixed-asset","national","trend","institutional"],"heat_signals":[],"importance":4,"selector_reason":"房地产投资者情绪指数创新低，45% 投资者称经营环境较一年前恶化。该数据反映资本端风险偏好变化，对全国住房投资和融资有中等行业影响，评为 imp=4。","section":"institutional","title_zh":"地产投资者情绪再创新低","summar ousehold income that has been growing at the same time the amount of money these buyers would need to make has been on the decline. In June, median household income was $87,599, compared with $84,297 in 2025. This means the spread between the two increased to almost $17,000 from $12,500 over the time period. How Redfin defines affordability Affordability is reached when a buyer needs to spend no more than 30% of their income on a monthly mortgage housing payment, according to Redfin, which is now owned by Rocket Cos. But besides rising mortgage rates, prices for starter properties also have been trending higher to near record highs. Plus, even though these are labeled as starter homes, Redfin is finding competition for potential first-time owners with move-up buyers, who come to the table with equity left over from the home they sold. \"Affordability has improved modestly for entry-level buyers, but starter homes come with tradeoffs, and finding the right one is a challenge,\" said Yingqi Xu, a senior economist at Redfin, in a press release. Buyers are likely to find a lot of properties in the starter-home category needing some updating and many are already stretching their budgets and can't take on a rehab project. In 242 cities, starter home prices are over $1 million , a recent Zillow report said. \"Move-in ready starter homes attract strong demand, while fixer-uppers aren't quite as desirable because the buyers who are typically in the market for an inexpensive home don't have much financial cushion for renovations,\" Xu said. In 22 of the 46 most populous metro areas (four areas did not have sufficient data), every starter home listed for sale was affordable to a median-earning household. Finding an affordable starter home in several California markets was difficult, though. In Los Angeles and San Diego, no listing met the affordability standard. In San Francisco, it was 0.4%; Anaheim, 2.6%; and San Jose, 7.4%. In Austin, Texas, one of the markets where all starter listings were considered affordable, the income required to purchase a unit decreased by 6.1%. The second largest decline was in Oakland, California, where 6% less money than last year was needed in order to afford a starter home. Nearly 27% of starter home listings were affordable for a median income earning household. But a starter home buyer in Detroit must now earn 8.3% more than a year ago. The metro with the second largest gain was Cleveland, at 6.1% higher, followed by Nassau County, New York, at 3.7% over a year ago. But Detroit and Cleveland both remain very affordable for starter home buyers. Detroit's estimated median income was $65,687, while a buyer needed to earn $30,511 to buy a home. In Cleveland, these amounts were $78,519 and $43,336 respectively. The latest to offer a 1% down program Some lenders are attempting to help potential homebuyers by offering programs requiring extremely low down payments. T","published_at":1785959955000,"score":30,"tags":["housing","national","rates","trend","brokerage"],"heat_signals":["texas","austin","mortgage rate","30-year fixed","freddie mac","trend","housing market","primary mortgage market survey"],"importance":3,"selector_reason":"starter homes 可负担性改善但利率上升抑制需求，反映全国首次购房人市场的拉扯。属于常规住房金融与 affordability 动态，评为 imp=3。","section":"national","title_zh":"Starter homes 更可负担但 rates 压制","summary_zh":"6月 starter home affordability YoY 改善1.5%，但30Y mortgage 达6.66%","impact":"neutral","id":"f989aaa9","fetched_at":1785979431739},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"M/I Homes trades margin for market share as spec sales rise","link":"https://www.housingwire.com/articles/mi-homes-spec-margin/","description":"M/I Homes is trading some margin for sales growth, speed, and market share. Pair that spec-heavy operating model with an asset-light finished-lot supply, and the returns could become considerably stronger. M/I Homes is making a contrarian bet at a time when much of the homebuilding industry is becoming more cautious. While competitors are reducing speculative starts to protect margins and limit inventory exposure, M/I continues to put homes in the ground before buyers sign contracts. In the second quarter of 2026, 78% of its sales came from spec homes, and total sales increased 15% year over year. Gross margin declined from 24.7% to 22.0%. The straightforward interpretation is that M/I is buying volume through mortgage-rate buydowns, closing-cost assistance, and price incentives. There is some truth to that. Incentives are supporting demand, and the resulting pressure on margins is real. But that interpretation misses the broader strategic intelligence at play. M/I is not merely building more specs. Many builders do that. What M/I is doing is shortening the distance between a buyer’s decision and the delivery of a home. In today’s uncertain housing market, that may be one of the most valuable competitive advantages a builder can possess. Builders deposit dollars, not percentages The first question is whether the trade-off between growth and margin is economically rational. Using M/I Homes’ $4.4 billion in 2025 revenue as the base, a 15% growth rate would increase revenue to $5.06B. At a 22.0% gross margin, that revenue would generate $1.113B in gross profit. At the prior 24.7% gross margin, $4.4 billion in revenue would produce $1.087 billion in gross profit. Under that scenario, M/I would generate an additional $26.4 million in gross profit despite surrendering 2.7 percentage points of margin. Gross profit dollars would increase by approximately 2.4%. That calculation does not include the potential benefits of faster inventory turns, stronger community absorption, greater purchasing leverage, steadier work for trades, or the ability to recover and redeploy capital more quickly. Wall Street tends to focus on the margin percentage, but builders deposit dollars, not percentages. If M/I can maintain a 22.0% gross margin while materially growing sales and keeping inventory moving, it is not simply buying volume. It is expanding the gross profit pool, taking market share, and keeping its production platform operating while competitors pull back. The challenge is whether M/I can preserve that velocity while reducing the incentives required to sustain it. Speed to home is the real strategy A traditional build-to-suit model, historically associated with builders such as KB Home, begins with the customer. The buyer selects a homesite, chooses a floor plan, visits a design center, makes structural and cosmetic selections, signs a contract and then waits for construction. In a stable market, that model has meaningful advantages. It limits the builder’s exposure to unsold inventory, creates upgrade revenue and gives the customer a stronger sense of personalization. But in an unstable market, time becomes risk. Mortgage rates can move. Employment can change. A competing builder can introduce a more aggressive financing package. The customer can become uncomfortable with design-center upgrades or the final monthly payment. A home that appeared affordable when the contract was signed may feel very different six or nine months later. The longer the distance between signing and closing, the more opportunities there are for the transaction to break. A completed or nearly completed spec home compresses that exposure. The buyer can see the actual product, understand the final price, lock the financing package and move within weeks rather than months. M/I is not simply selling a house. It is selling certainty. A buyer who will not commit to a home scheduled for delivery nine months from now may still purchase one that can close in 30 or 60 days. T","published_at":1785959663000,"score":23,"tags":["housing","national","earnings","homebuilder"],"heat_signals":["mortgage rate","year over year","housing market"],"importance":3,"selector_reason":"
