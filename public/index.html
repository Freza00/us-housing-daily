"source_name":"Northmarq Research","source_tier":"B","source_weight":9,"source_tags":["multifamily","data","trend"],"region":"national","title":"Raleigh-Durham multifamily vacancy tightens as deliveries slow","link":"https://northmarq.com/insights/insights/raleigh-durham-multifamily-vacancy-tightens-deliveries-slow-q3-2026","description":"Download the full Q3 2026 Raleigh-Durham multifamily market report here.HighlightsProperty performance in the Raleigh-Durham multifamily market was mixed during the third quarter, with rents posting a seasonal decrease while vacancy continued to improve. Supply growth has slowed sharply. Projects totaling nearly 4,400 units have been delivered year to date, down 54% from the same period last year.Area vacancy declined 40 basis points for the second consecutive quarter, reaching 7.4%. Year over year, the rate is down 30 basis points.Apartment rents edged down 0.4% during the past three months to $1,585 per month. Still, rents are up 0.9% from one year ago, supported by steady gains during the first half of 2026.Although sales activity remains below traditional levels, a strong third quarter pushed year-to-date sales well ahead of last year’s pace. Activity through the third quarter is up more than 35% from the same period in 2025. Year to date, the median sale price is $218,000 per unit, up 8% from 2025.Raleigh-Durham multifamily market overviewVacancy in the Raleigh-Durham multifamily market continued to improve as supply growth tapered off, with the rate falling 80 basis points during the past six months. Year to date, renter demand remains well above traditional levels but trails the pace recorded in the same periods of 2024 and 2025. Demand has been concentrated in Central Raleigh and North Cary/Morrisville, which together accounted for nearly 30% of the market’s net move-ins totaling more than 8,500 units during the past year. Central Raleigh illustrates the sharp slowdown in supply growth across the broader market. From 2023 to 2025, more than 5,200 units were delivered in the submarket, compared with just 250 units year to date. Additionally, fewer than 400 units are currently under construction in Central Raleigh, down from a pipeline peak of roughly 4,000 units in late 2022.Total sales in the Raleigh-Durham multifamily investment market picked up in recent months after a slow first half. Sales during the third quarter nearly matched the total recorded in the preceding six months. Activity has been concentrated in a handful of submarkets year to date, with Central Raleigh, Northwest Raleigh, North Cary/Morrisville, and Northeast Raleigh accounting for 75% of transactions through the third quarter. Traditionally, the four most active submarkets have accounted for roughly 60% of sales. Operating conditions have improved across these areas, with all four recording vacancy declines during the past year, while Central Raleigh and North Cary/Morrisville led the region in absorption. Additionally, Northeast Raleigh was the only sizable submarket to post annual rent growth above 2%, and vacancy in Northwest Raleigh remains well below the market average.Employment:Year over year, total employment increased by 18,000 positions. Image Employment growth has ticked higher over the course of the past two quarters. Year over year, total employment increased by 18,000 positions, expanding 1.6%. In comparison, employers added roughly 14,000 workers last year.Although seasonal volatility remains, the leisure and hospitality sector has recorded significant job additions during the past year. In the past 12 months, employers in this sector have hired 3,700 workers, an increase of 3.4%.Private jet company FlyExclusive began operating from its new corporate headquarters in Raleigh during the third quarter. Located in North Hills, the 24,000-square-foot space houses roughly 150 employees, and the company plans to add another 100 positions in Eastern North Carolina.Forecast: In 2026, local payrolls are projected to expand by 22,000 jobs, a rise of 2.0%. In 2024 and 2025, 14,900 and 14,100 positions were added, respectively.Development and permitting:Approximately 9,400 units are under construction. Image After more than 13,000 units were completed in both 2024 and 2025, construction activity has slowed. Year to date, projects totaling nearly 4,400 units have come online, down 54% from the same period last year.Approximately 9,400 units are currently under construction in Raleigh-Durham, up 12% from one year ago. After declining rapidly in 2024 and 2025, the development pipeline has stabilized in recent periods.Multifamily permitting has rebounded after returning to traditional levels in the preceding two years. Developers pulled permits for roughly 9,500 units year to date, up 45% from the same period last year.Forecast: Projects totaling 6,000 units are expected to be delivered for the full year, in line with historical levels. Excluding the heightened completions of 2024 and 2025, an average of 6,100 units came online annually from 2017 to 2023.Vacancy:Year over year, vacancy is down 30 basis points. Image The vacancy rate in Raleigh-Durham continued to decline during the third quarter. In the past three months, the rate declined 40 basis points to 7.4%. Year over year, area vacancy is down 30 basis points.Vacancy has tightened significantly in Central Raleigh amid elevated renter demand. The rate declined 120 basis points in the past year to 7.4%. During the same period, Central Raleigh posted net move-ins of more than 1,300 units, leading the region.Vacancy for Class A assets declined 10 basis points during the past year to 8.0%, with most of the improvement occurring in recent months. Top-tier vacancy peaked in the first quarter but has since declined 130 basis points, as the pace of deliveries has remained modest.Forecast: Area vacancy will likely close the year at 7.5%, down 60 basis points for the full year. Areas with strong absorption and limited construction, like Central Raleigh and North Cary/Morrisville, should continue to support vacancy improvement.Rents:Rents are up 0.9% from one year ago. Image After trending higher in the first half, asking rents declined 0.4% during the third quarter to $1,585 per month. Despite the recent decline, rents are up 0.9% from one year ago, marking the firs","published_at":1794502800000,"date_precision":"day","published_date":"2026-11-12","modified_at":1794502800000,"extraction":"structured","canonical":"https://northmarq.com/insights/insights/raleigh-durham-multifamily-vacancy-tightens-deliveries-slow-q3-2026","content_hash":"7e1983cc8e9febd1d8c74d296ee3230cdba35692234905eb18587299714cb66e","access":"public","source_family":"northmarq-research","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794778664289,"id":"7fc7e33454a70638","acquisition_window":{"lower":1793307600000,"upper":1794776400000},"late_discovery":true,"score":29,"tags":["multifamily","carolinas","data","construction"],"heat_signals":["permits","forecast","trend","annual","year over year","rent growth","vacancy"],"evidence_status":"article","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Raleigh-Durham multifamily vacancy tightens as deliveries slow"},{"id":"body-1","text":"Download the full Q3 2026 Raleigh-Durham multifamily market report here.HighlightsProperty performance in the Raleigh-Durham multifamily market was mixed during the third quarter, with rents posting a seasonal decrease while vacancy continued to improve."},{"id":"body-2","text":"Supply growth has slowed sharply."},{"id":"body-3","text":"Projects totaling nearly 4,400 units have been delivered year to date, down 54% from the same period last year.Area vacancy declined 40 basis points for the second consecutive quarter, reaching 7.4%."},{"id":"body-4","text":"Year over year, the rate is down 30 basis points.Apartment rents edged down 0.4% during the past three months to $1,585 per month."},{"id":"body-5","text":"Still, rents are up 0.9% from one year ago, supported by steady gains during the first half of 2026."},{"id":"body-6","text":"Although sales activity remains below traditional levels, a strong third quarter pushed year-to-date sales well ahead of last year’s pace."},{"id":"body-7","text":"Activity through the third quarter is up more than 35% from the same period in 2025."},{"id":"body-8","text":"Year to date, the median sale price is $218,000 per unit, up 8% from 2025."},{"id":"body-9","text":"Raleigh-Durham multifamily market overviewVacancy in the Raleigh-Durham multifamily market continued to improve as supply growth tapered off, with the rate falling 80 basis points du"}],"keep":true,"importance":4,"section":"sunbelt","capital_focus":false,"geo_evidence":"Raleigh-Durham multifamily market","primary_event":"market_research_policy","event_evidence_id":"body-3","event_evidence":"Projects totaling nearly 4,400 units have been delivered year to date, down 54% from the same period last year.Area vacancy declined 40 basis points for the second consecutive quarter, reaching 7.4%.","market_evidence_id":"body-1","market_role":"asset_location","market_scope":"us","market_evidence":"Download the full Q3 2026 Raleigh-Durham multifamily market report here.HighlightsProperty performance in the Raleigh-Durham multifamily market was mixed during the third quarter, with rents posting a seasonal decrease while vacancy continued to improve.","duplicate_of":null,"selector_reason":"Raleigh-Durham多户交付同比下降54%至约4,400套，空置率降至7.4%，年内交易量较上年增长逾35%。","title_zh":"罗利--达勒姆多户住宅空置率收紧","summary_zh":"Northmarq Research 称，罗利--达勒姆年初至今交付近 4,400 套，同比下降 54%；空置率降至 7.4%，租金环比下降 0.4% 至每月 $1,585。","impact":"long-pos","evidence_quote":"Download the full Q3 2026 Raleigh-Durham multifamily market report here.HighlightsProperty performance in the Raleigh-Durham multifamily market was mixed during the third quarter, with rents posting a seasonal decrease while vacancy continued to improve. Supply growth has slowed sharply. Projects totaling nearly 4,400 units have been delivered year to date, down 54% from the same period last year.Area vacancy declined 40 basis points for the second consecutive quarter, reaching 7.4%.","evidence_basis":"body","cre_subcategory":null},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Hedge fund pressures Invitation Homes to speed up home sales","link":"https://www.housingwire.com/articles/land-buildings-invitation-homes-activist-letter/","description":"Activist investor Land & Buildings Investment Management is pressing single-family rental giant Invitation Homes to accelerate home sales, sharply increase capital returns and scale back growth plans, arguing the company’s stock trades at a steep discount to the value of its houses. In an open letter to shareholders released Monday, the Stamford, Connecticut-based hedge fund said it believes Invitation Homes is “among the most undervalued companies in the REIT sector” and criticized the board and management for what it called “complacency” and “half measures” in addressing the gap. Land & Buildings, which owns an undisclosed stake in Invitation Homes, is led by Jonathan Litt, a longtime activist in the real estate investment trust sector. Invitation Homes (NYSE: INVH) is the nation’s largest owner of single-family rental homes, with more than 80,000 properties concentrated in Sun Belt and other high-growth markets. Discount to home values at center of dispute Land & Buildings said the public market values Invitation Homes’ properties at roughly $270,000 per home, compared with an average sale price of about $460,000 on homes the company has sold since December 2025. That implies a discount of about 40%, according to the letter, which was disseminated via GlobeNewswire. The firm said it separately valued more than 90% of the company’s wholly owned portfolio, “address by address,” and arrived at an estimated average value of approximately $425,000 per home. That analysis underpins its net asset value estimate of about $45 per share, which Land & Buildings said is more than 65% above Invitation Homes’ current trading price even after assuming 6% selling costs on every home. “REITs with sound fundamentals and no distressed assets do not trade at such a discount indefinitely. Something has to give,” the firm said in the letter. Years of underperformance versus peers Land & Buildings also highlighted what it described as sustained underperformance. Over the trailing one-, three- and five-year periods, Invitation Homes has lagged the S&P 500, the broader REIT index, its closest peer American Homes 4 Rent and the proxy peer group the board uses for benchmarking executive compensation, the letter said. Over the past three years, Invitation Homes ranks second to last in that compensation peer group, trailing the group average by more than 35 percentage points, according to Land & Buildings. Shareholders who held the stock for five years have lost more than 20% of their investment, including dividends, the letter said, even as U.S. home prices have continued to climb. The firm noted that Invitation Homes’ shares now trade at an implied capitalization rate of about 7%, roughly 60 basis points wider than American Homes 4 Rent, and at a lower multiple of adjusted funds from operations. The stock trades only modestly above its $20 IPO price from early 2017 while national home prices are up nearly 80% over that period, according to the letter. Capital allocation and legal settlements under scrutiny Land & Buildings blamed Invitation Homes’ strategy for much of the gap. The company was a net buyer of homes in every year from 2022 through 2025 despite “a poor cost of capital,” and earnings have “repeatedly fallen short of expectations,” the firm said. The letter also pointed to legal and regulatory costs. Land & Buildings said Invitation Homes has paid more than $79 million to resolve four legal matters related to resident treatment and business practices, including a $48 million settlement with the Federal Trade Commission in 2024. At the same time, the board approved more than $25 million in special retention awards in March 2026 for the CEO and three other executives, according to the firm. “This troubling misalignment and lack of accountability is deeply concerning,” Land & Buildings said. Call for $2 billion a year in capital returns The activist laid out a three-part plan it says could unlock value and narrow the discount to net asset value: Commit to at least $2 billion a year in capital returns. Land & Buildings wants Invitation Homes to pledge to return a minimum of $2 billion annually to shareholders on a leverage-neutral basis, funded by selling homes individually into the for-sale market. Capital could be returned through share repurchases or special dividends for as long as the stock trades below estimated NAV. Offer renters a path to homeownership. The plan calls for providing existing tenants a 6% rebate to cover a down payment if they buy the home they rent. Land & Buildings argues that rebate roughly matches the brokerage, repair and vacancy costs of an open-market sale, allowing the company to expand homeownership opportunities “for thousands of renters at little or no incremental cost.” Scale back acquisitions and development. The firm recommended Invitation Homes “significantly curtail external growth activities” while its cost of capital is elevated, saying there is “no better use of the Company’s capital than its own stock.” Land & Buildings estimated that a multi-year, programmatic asset sale and capital return program could deliver “substantial annual accretion” to both earnings and NAV per share, supported by what it pegged as nearly $40 billion of gross asset value. Pushback on ‘half measures’ and new director The letter criticized what Land & Buildings characterized as incremental steps by Invitation Homes, including recent home sales and share repurchases, arguing those moves have not been sized or communicated in a way that would change how investors value the company. “Half measures appear to be this Board’s modus operandi: do just enough to relieve pressure while preserving the status quo,” the firm wrote. Land & Buildings also objected to the board’s Nov. 11 appointment of Colin Connolly, CEO of office REIT Cousins Properties, as a new director. The firm said the board had previously told it that refreshment was not needed and argued that adding another sitting REIT chief e","published_at":1794860695000,"mutable":false,"date_precision":"timestamp","modified_at":1794861314000,"extraction":"semantic","canonical":"https://housingwire.com/articles/land-buildings-invitation-homes-activist-letter","content_hash":"02f1c012d401c38a68f490738b1d77eb4ee33719dabb84fe8432c29bba1720ea","access":"public","evidence_status":"article","id":"b639aa4177adca45","source_family":"housingwire","is_research":false,"required_source":false,"first_seen_at":1794865086470,"acquisition_window":{"lower":1794776400000,"upper":1794862800000},"score":39,"tags":["btr-sfr","sun-belt","deals","earnings","btr-operator"],"heat_signals":["single-family rental","invitation homes","american homes 4 rent","sun belt","fed","annual","vacancy"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Hedge fund pressures Invitation Homes to speed up home sales"},{"id":"body-1","text":"Activist investor Land & Buildings Investment Management is pressing single-family rental giant Invitation Homes to accelerate home sales, sharply increase capital returns and scale back growth plans, arguing the company’s stock trades at a steep discount to the value of its houses."},{"id":"body-2","text":"In an open letter to shareholders released Monday, the Stamford, Connecticut-based hedge fund said it believes Invitation Homes is “among the most undervalued companies in the REIT sector” and criticized the board and management for what it called “complacency” and “half measures” in addressing the gap."},{"id":"body-3","text":"Land & Buildings, which owns an undisclosed stake in Invitation Homes, is led by Jonathan Litt, a longtime activist in the real estate investment trust sector."},{"id":"body-4","text":"Invitation Homes (NYSE: INVH) is the nation’s largest owner of single-family rental homes, with more than 80,000 properties concentrated in Sun Belt and other high-growth markets."},{"id":"body-5","text":"Discount to home values at center of dispute Land & Buildings said the"}],"keep":true,"importance":4,"section":"btr","capital_focus":true,"geo_evidence":"concentrated in Sun Belt and other high-growth markets","primary_event":"capital_governance","event_evidence_id":"body-1","event_evidence":"Activist investor Land & Buildings Investment Management is pressing single-family rental giant Invitation Homes to accelerate home sales, sharply increase capital returns and scale back growth plans, arguing the company’s stock trades at a steep discount to the value of its houses.","market_evidence_id":"body-4","market_role":"capital_subject","market_scope":"us","market_evidence":"Invitation Homes (NYSE: INVH) is the nation’s largest owner of single-family rental homes, with more than 80,000 properties concentrated in Sun Belt and other high-growth markets.","duplicate_of":null,"selector_reason":"激进投资者要求Invitation Homes加快出售、提高资本回报并放缓增长，直接涉及全国最大单户出租业主的资本治理。","title_zh":"激进投资者要求 Invitation Homes 加快售房","summary_zh":"Land & Buildings 要求 Invitation Homes 加快出售住房、提高资本回报并放缓扩张，称公司房产公开市场估值约为每套 $270,000，低于其估计的资产价值。","impact":"neutral","evidence_quote":"Activist investor Land & Buildings Investment Management is pressing single-family rental giant Invitation Homes to accelerate home sales, sharply increase capital returns and scale back growth plans, arguing the company’s stock trades at a steep discount to the value of its houses.","evidence_basis":"body","cre_subcategory":null},{"source_id":"cnbc-realestate","source_name":"CNBC Realty Check","source_tier":"A","source_weight":6,"source_tags":["macro"],"region":"national","title":"Rising rents draw Wall Street money to industrial outdoor storage lot investments across the U.S.","link":"https://www.cnbc.com/2026/11/14/real-estate-rental-income-industrial-storage-market.html","description":"Hottest outdoor storage property markets The numbers help explain the appetite. Rents for industrial outdoor storage roughly doubled across eight major markets between 2020 and the third quarter of this year, according to data from Newmark Research and Alterra IOS, an owner of such properties. Average rent per usable acre rose 103.5%, to nearly $11,000 a month, compared with a 66% increase for traditional industrial space, such as indoor warehouses. Rent growth, according to Alterra, is most closely tied to infrastructure and energy activity in the area, even more so than data center development specifically. The value of these properties can also increase if located near a seaport, rail line, or highway. But the gains weren't uniform. Baltimore (204%), Houston (159%) and Norfolk (148%) led, while South Florida and Savannah IOS actually trailed traditional industrial. Lisa DeNight, managing director, head of North American industrial research at Newmark, said that Savannah's IOS vacancy remains quite tight despite the rent figures. Recent port activity is a potential factor, according to Alterra. Savannah's container volumes more than doubled between 2010 and 2022 but have since declined, while Houston saw roughly 15% growth from 2022 to 2025. Petrillo said that there is still plenty of room left for values to increase, so an investor jumping in now hasn't missed the game. \"We are still in the very early innings,\" Petrillo said. Sam Cheema co-founder of CanTex Capital, a Dallas-based firm that acquires overlooked industrial real estate in Texas, is seeing increased demand for these lots. \"It comes down to supply and demand,\" he said. \"If you need a warehouse you can usually find one. Properly zoned infill IOS sites are much harder to find and every year more of them are converted to warehouses and other uses,\" he said, referencing multifamily housing units. The scarcity makes tenants sticky. \"So a limited supply keeps shrinking. And because so much of the value is in the land itself, owners keep the option to redevelop the site as the area grows,\" Cheema added. Because of the imbalance of supply and demand, rents and prices are rising across the board, according to Cheema, but no two IOS properties look alike, which has kept the door open for smaller investors. \"Big institutions want exposure to IOS, but ownership is fragmented across mom-and-pop owners and small businesses, so it's hard to deploy large amounts of capital without first aggregating these assets into portfolios,\" Cheema said. Unlike traditional warehouses, there's no standard spec like square footage or clear height to compare them. \"That lack of standardization along with the ongoing growth of the asset class, means there's still runway for small investors to find opportunities,\" Cheema said. \"Financing has improved as more lenders have a better understanding of IOS, but it's still largely local and regional banks,\" Cheema added. Zoning is the biggest challenge. \"If you don't understand the city's plans for the area, you may end up owning a use they're trying to phase out,\" Cheema said. CanTex Capital works with the city and neighborhoods before buying to ensure the impact aligns with the community's plan for its future. Advantages over traditional industrial, multifamily real estate Alex Sutterer, an executive vice president at NAI Hiffman, a Chicago-area commercial real estate firm, said that beyond being a place to store big equipment, IOS attracts investors for two main reasons: lower capital expenditure requirements than traditional industrial or multifamily properties and the potential for higher yields. \"Capital improvements are also less specific to individual tenants, so owners can direct spending toward the property's overall functionality,\" Sutterer said. For private investors, IOS typically trades at a yield around one percentage point higher than traditional industrial properties, helping attract smaller investors and family offices. \"We believe that gap will continue to narrow as more institutional capital enters this space,\" Sutterer added. Even for industrial properties with similar yields, he said the credit profile of tenants is generally stronger for IOS. Shallow-bay, multitenant industrial properties — industrial facilities that tend to be much smaller than big-box distribution warehouses — have comparable yields. But unlike the local businesses that tend to fill up shallow-bay sites, IOS tenants range from local businesses to those with investment-grade credit ratings, offering investors the potential for both yield and creditworthy tenants. And institutional money is making IOS more competitive. \"Institutional capital has increased competition in IOS, and property values and lease rates have risen overall,\" Sutterer said. He added smaller investors can still find opportunities below institutional deal-size thresholds, although that does not mean every smaller deal is priced fairly. \"We see opportunities to add value and earn yield in deals below $3 million–$5 million,\" Sutterer said. Kevin Williams | CNBC For local investors, that means there is the ability to build a portfolio at a smaller scale and hold the assets for cash flow, or aggregate more than $10 million in assets and seek a portfolio premium when selling to institutional capital. But buyers need to understand what they are getting into. Due diligence on tenant demand by site and site function, and tenant turnover ratio, are important factors in buying the right asset. Market diversity can also provide protection, Sutterer said. \"In Chicago, no single user category accounts for more than 18% of IOS tenants, helping insulate the market from industry-specific slowdowns,\" he said. Tenants' tendency to stay and tight vacancy rates nationally are current advantages of the asset class. In Chicagoland, for example, vacancy is below 3%. Still, all the due diligence in the world can't protect investors from some variables. \"No one outside the Feder","published_at":1794669297000,"mutable":false,"date_precision":"timestamp","modified_at":1794669297000,"extraction":"body_fallback","canonical":"https://cnbc.com/2026/11/14/real-estate-rental-income-industrial-storage-market.html","content_hash":"3a3f5892536efd4dc6888958f558d7690dc5312d704c0a935ec363237cf688a0","access":"public","evidence_status":"article","id":"a5e68cc6f0a63ff6","source_family":"cnbc-realestate","is_research":false,"required_source":false,"first_seen_at":1794778664289,"acquisition_window":{"lower":1794517200000,"upper":1794776400000},"late_discovery":true,"score":18,"tags":["industrial","national","data","trend","institutional"],"heat_signals":["texas","houston","dallas","fed","rent growth","vacancy"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Rising rents draw Wall Street money to industrial outdoor storage lot investments across the U.S."},{"id":"body-1","text":"Hottest outdoor storage property markets The numbers help explain the appetite."},{"id":"body-2","text":"Rents for industrial outdoor storage roughly doubled across eight major markets between 2020 and the third quarter of this year, according to data from Newmark Research and Alterra IOS, an owner of such properties."},{"id":"body-3","text":"Average rent per usable acre rose 103.5%, to nearly $11,000 a month, compared with a 66% increase for traditional industrial space, such as indoor warehouses."},{"id":"body-4","text":"Rent growth, according to Alterra, is most closely tied to infrastructure and energy activity in the area, even more so than data center development specifically."},{"id":"body-5","text":"The value of these properties can also increase if located near a seaport, rail line, or highway."},{"id":"body-6","text":"But the gains weren't uniform."},{"id":"body-7","text":"Baltimore (204%), Houston (159%) and Norfolk (148%) led, while South Florida and Savannah IOS actually trailed traditional industrial."},{"id":"body-8","text":"Lisa DeNight, managing director, head of North American industrial research at Newmark, said that Savannah's IOS vacanc"}],"keep":true,"importance":4,"section":"cre","capital_focus":false,"geo_evidence":null,"primary_event":"market_research_policy","event_evidence_id":"body-3","event_evidence":"Average rent per usable acre rose 103.5%, to nearly $11,000 a month, compared with a 66% increase for traditional industrial space, such as indoor warehouses.","market_evidence_id":"body-2","market_role":"market_policy","market_scope":"us","market_evidence":"Rents for industrial outdoor storage roughly doubled across eight major markets between 2020 and the third quarter of this year, according to data from Newmark Research and Alterra IOS, an owner of such properties.","duplicate_of":null,"selector_reason":"独立研究显示八大市场工业户外仓储租金自2020年以来平均上涨103.5%，明显快于传统工业，并给出Houston等市场的分化数据。","title_zh":"工业户外仓储租金增长吸引机构资金","summary_zh":"Newmark Research 和 Alterra IOS 数据显示，八大市场工业户外仓储平均可用英亩租金较 2020 年上涨 103.5% 至近每月 $11,000，但不同市场表现差异明显。","impact":"long-pos","evidence_quote":"Hottest outdoor storage property markets The numbers help explain the appetite. Rents for industrial outdoor storage roughly doubled across eight major markets between 2020 and the third quarter of this year, according to data from Newmark Research and Alterra IOS, an owner of such properties. Average rent per usable acre rose 103.5%, to nearly $11,000 a month, compared with a 66% increase for traditional industrial space, such as indoor warehouses.","evidence_basis":"body","cre_subcategory":"工业"},{"source_id":"realpage-research","source_name":"RealPage Analytics","source_tier":"B","source_weight":9,"source_tags":["multifamily","data","trend"],"region":"national","title":"Realpage Economy Express Episode 75","link":"https://www.realpage.com/analytics/economy-express-episode-75/","description":"Realpage Economy Express Episode 75 by Arben Skivjani Posted November 13, 2026 in Insights A surprisingly strong jobs report and stubborn inflation have all but settled the Fed's December decision, even as households and homebuyers keep feeling the squeeze. According to the Bureau of Labor Statistics, the October jobs report showed 165,000 new jobs, almost three times what forecasters expected. Unemployment slipped to 4.1%, and paychecks grew 0.4% in a single month, the fastest pace since January. Job openings climbed to 7.5 million in September, more than expected, even though hiring remains slow. Consumer prices rose 0.4% in October and core prices were up 0.3% for the third month in a row, while the annual inflation rate could not be published because prices were never collected during last year's shutdown. Producer prices rose a calmer 0.3% in October after September's jump, but they are still up 6.5% from a year ago, the most since 2022. Fed funds futures pricing now treats a December rate hike as a sure thing, with some traders even betting on a half-point move. The University of Michigan's consumer survey found sentiment rose to 51, the best reading since August, while expected inflation eased to about 4.3%. Federal Reserve data show credit card balances grew in September at their fastest pace in nearly three years. Per the National Association of Realtors, existing home sales fell to their slowest pace since 2010, even with more homes for sale than at any point since 2019. For more information on the state of the U.S. Economy, including forecasts, watch all the episodes of the Economy Express series. SHARE Tags Economy Express Previous Article Renewals Carry Apartment REIT Pricing as Coastal and Sun Belt Results Split Next Article Jacksonville’s apartment market is recovering, but the pace varies by asset class","published_at":1794643214000,"source_family":"realpage-research","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794778664289,"id":"e75001b411953d46","acquisition_window":{"lower":1794517200000,"upper":1794776400000},"late_discovery":true,"score":17,"tags":["housing","national","macro","rates","regulator"],"heat_signals":["fed","inflation","forecast"],"date_precision":"timestamp","modified_at":1794816008000,"extraction":"semantic","canonical":"https://realpage.com/analytics/economy-express-episode-75","content_hash":"4752c2b4e8e3d7ddde0866e9b90d751b7cc3c00f3aebd3451c2b9a42af084811","access":"public","evidence_status":"article","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Realpage Economy Express Episode 75"},{"id":"body-1","text":"Realpage Economy Express Episode 75 by Arben Skivjani Posted November 13, 2026 in Insights A surprisingly strong jobs report and stubborn inflation have all but settled the Fed's December decision, even as households and homebuyers keep feeling the squeeze."},{"id":"body-2","text":"According to the Bureau of Labor Statistics, the October jobs report showed 165,000 new jobs, almost three times what forecasters expected."},{"id":"body-3","text":"Unemployment slipped to 4.1%, and paychecks grew 0.4% in a single month, the fastest pace since January."},{"id":"body-4","text":"Job openings climbed to 7.5 million in September, more than expected, even though hiring remains slow."},{"id":"body-5","text":"Consumer prices rose 0.4% in October and core prices were up 0.3% for the third month in a row, while the annual inflation rate could not be published because prices were never collected during last year's shutdown."},{"id":"body-6","text":"Producer prices rose a calmer 0.3% in October after September's jump, but they are still up 6.5% from a year ago, the most since 2022."},{"id":"body-7","text":"Fed funds futures pricing now treats a December rate hike as a sure thing, with some traders even betting on a half-point move."},{"id":"body-8","text":"The University of Michigan's consumer survey found sentiment rose to 51, the best reading since August, while expec"}],"keep":true,"importance":4,"section":"national","capital_focus":false,"geo_evidence":null,"novelty_evidence":"According to the Bureau of Labor Statistics, the October jobs report showed 165,000 new jobs, almost three times what forecasters expected. Unemployment slipped to 4.1%, and paychecks grew 0.4% in a single month, the fastest pace since January.","primary_event":"market_research_policy","event_evidence_id":"body-2","event_evidence":"According to the Bureau of Labor Statistics, the October jobs report showed 165,000 new jobs, almost three times what forecasters expected.","market_evidence_id":"body-2","market_role":"market_policy","market_scope":"us","market_evidence":"According to the Bureau of Labor Statistics, the October jobs report showed 165,000 new jobs, almost three times what forecasters expected.","duplicate_of":null,"selector_reason":"新增10月就业数据为新增16.5万个岗位、失业率4.1%、职位空缺750万，并显示市场将12月加息视为确定事件。","title_zh":"就业报告强劲，利率与住房需求承压","summary_zh":"RealPage Analytics 引述劳工统计局称，10 月新增就业 165,000 个，失业率降至 4.1%，工资单月增长 0.4%；报告同时称成屋销售降至 2010 年以来低位。","impact":"short-neg","evidence_quote":"Realpage Economy Express Episode 75 by Arben Skivjani Posted November 13, 2026 in Insights A surprisingly strong jobs report and stubborn inflation have all but settled the Fed's December decision, even as households and homebuyers keep feeling the squeeze. According to the Bureau of Labor Statistics, the October jobs report showed 165,000 new jobs, almost three times what forecasters expected. Unemployment slipped to 4.1%, and paychecks grew 0.4% in a single month, the fastest pace since January.","evidence_basis":"body","cre_subcategory":null},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Apartment rents diverge: San Francisco rises, the Sun Belt falls","link":"https://www.housingwire.com/articles/apartment-rents-diverge-2026/","description":"America's apartment landscape has become a tale of two opposing rent trends. Rents are climbing in the Bay Area and the Midwest, while much of the Sun Belt is still sliding. National same-store asking rents edged up 1.7% from a year earlier in October, the biggest annual gain since May 2023, apartment industry data firm RealPage reported Nov. 11. The national figure hides a wide gap. San Francisco rents jumped 14.7%, evidence of why city officials are pressing the supply button to drive housing construction. San Antonio rents dropped 2.6%. The month-over-month picture illustrates less dramatic change. RealPage showed that rents fell 0.7% in October, the first monthly cut of 2026. The company said the annual gain came less from strong pricing than from weak months dropping out of the calculation, making for stronger year-over-year comparables. Other trackers show the same upward drift, with different monthly readings. Yardi Matrix reported rents up 0.1% in October, with annual growth of 1.4%, the strongest in more than three years. Apartments.com put annual growth at 1.6%, even as rents slipped 0.15% for the month. Supply wave cools Supply and demand are edging toward balance. RealPage said renters absorbed nearly 304,800 conventional apartments in the year ending in Q3 2026. Developers completed nearly 318,000 units over the same period, almost half the late-2024 peak. Occupancy eased to 95%, down 20 basis points from September. It is still up 40 basis points this year and 10 basis points above October 2025. Landlords hit the brakes Improving rents haven't translated into a property buying spree. Camden Property Trust , a large apartment landlord, walked away from two acquisitions and canceled two planned development projects. The Federal Reserve's rate hike was a main reason, rental economist Jay Parsons wrote on LinkedIn. Two deals under contract fell through after the hike, Camden CEO Alex Jessett said on the third-quarter earnings call. Camden asked for lower prices, and the sellers declined. Buying also beat building on cost. Camden bought an asset at about $370,000 a door, while building it would have cost north of $600,000, Jessett said. Camden's earnings show an unevenly improving market. Funds from operations, a standard earnings measure for real estate investment trusts, were $1.70 per diluted share in the third quarter. Core funds from operations were $1.71, $0.02 above the company's guidance midpoint. \"A higher-for-longer rate environment may equate to a lower-for-longer supply environment,\" Parsons wrote. Fewer projects penciling out means fewer new apartment options for renters. Coasts and Midwest lead Northern California took the top three spots for rent power among the 50 largest markets, RealPage said. San Francisco rose 14.7%, San Jose 9.5% and Oakland 8.5%. All three are running near 97% occupancy. Midwest metros fill much of the rest of the top 10. Milwaukee led at 4.2%, followed by Chicago at 3.3%, and Kansas City and Cleveland at 3.1% each. Detroit and St. Louis each gained 2.7% and just missed the cut. Sun Belt still lags Most Sun Belt and Florida markets continued to decline. The South as a region returned to annual growth, but only by 0.5%. San Antonio had the deepest decline in rents among big markets at 2.6%. Its occupancy of 92.5% was the lowest of the 50 largest markets. Houston fell 1.8%, followed by drops in Tampa of 1%, Charlotte of 0.9% and Denver of 0.8%. Several Sun Belt markets have turned the corner, however. Jacksonville rose 2.6%, Raleigh 1.0%, Atlanta 0.8%, Austin and Miami 0.6% each, and Phoenix 0.4%. Related More: Multifamily Housing Rent Prices","published_at":1794603976000,"mutable":false,"date_precision":"timestamp","modified_at":1794603978000,"extraction":"semantic","canonical":"https://housingwire.com/articles/apartment-rents-diverge-2026","content_hash":"0caa904bf52c9574eb7cc168277614d16db51449404aad2eafb9eacfc8e23431","access":"public","evidence_status":"article","id":"583884d382fe2260","source_family":"housingwire","is_research":false,"required_source":false,"first_seen_at":1794778664289,"acquisition_window":{"lower":1794517200000,"upper":1794776400000},"late_discovery":true,"score":33,"tags":["multifamily","sun-belt","data","trend"],"heat_signals":["houston","austin","san antonio","sun belt","fed","rate hike","trend","trends","annual","year-over-year","occupancy"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Apartment rents diverge: San Francisco rises, the Sun Belt falls"},{"id":"body-1","text":"America's apartment landscape has become a tale of two opposing rent trends."},{"id":"body-2","text":"Rents are climbing in the Bay Area and the Midwest, while much of the Sun Belt is still sliding."},{"id":"body-3","text":"National same-store asking rents edged up 1.7% from a year earlier in October, the biggest annual gain since May 2023, apartment industry data firm RealPage reported Nov. 11."},{"id":"body-4","text":"The national figure hides a wide gap."},{"id":"body-5","text":"San Francisco rents jumped 14.7%, evidence of why city officials are pressing the supply button to drive housing construction."},{"id":"body-6","text":"San Antonio rents dropped 2.6%."},{"id":"body-7","text":"The month-over-month picture illustrates less dramatic change."},{"id":"body-8","text":"RealPage showed that rents fell 0.7% in October, the first monthly cut of 2026."},{"id":"body-9","text":"The company said the annual gain came less from strong pricing than from weak months dropping out of the calculation, making for stronger year-over-year comparables."},{"id":"body-10","text":"Other trackers show the same upward drift, with different monthly readings."},{"id":"body-11","text":"Yardi Matrix reported rents up 0.1% in October, with annual growth of"}],"keep":true,"importance":4,"section":"sunbelt","capital_focus":false,"geo_evidence":"much of the Sun Belt is still sliding","primary_event":"market_research_policy","event_evidence_id":"body-3","event_evidence":"National same-store asking rents edged up 1.7% from a year earlier in October, the biggest annual gain since May 2023, apartment industry data firm RealPage reported Nov. 11.","market_evidence_id":"body-2","market_role":"market_policy","market_scope":"us","market_evidence":"Rents are climbing in the Bay Area and the Midwest, while much of the Sun Belt is still sliding.","duplicate_of":null,"selector_reason":"RealPage数据显示10月全国公寓同店要价租金同比上涨1.7%，但San Francisco上涨14.7%、San Antonio下降2.6%，呈现沿海与Sun Belt显著分化。","title_zh":"公寓租金区域分化，供应浪潮降温","summary_zh":"RealPage 称，10 月全国同店要价租金同比上涨 1.7%，但环比下降 0.7%；旧金山上涨 14.7%，圣安东尼奥下降 2.6%，年末前供应增长正在放缓。","impact":"neutral","evidence_quote":"America's apartment landscape has become a tale of two opposing rent trends. Rents are climbing in the Bay Area and the Midwest, while much of the Sun Belt is still sliding. National same-store asking rents edged up 1.7% from a year earlier in October, the biggest annual gain since May 2023, apartment industry data firm RealPage reported Nov.","evidence_basis":"body","cre_subcategory":null},{"source_id":"realpage-research","source_name":"RealPage Analytics","source_tier":"B","source_weight":9,"source_tags":["multifamily","data","trend"],"region":"national","title":"Renewals Carry Apartment REIT Pricing as Coastal and Sun Belt Results Split","link":"https://www.realpage.com/analytics/reit-update-3rd-quarter-2026/","description":"Renewals Carry Apartment REIT Pricing as Coastal and Sun Belt Results Split by Meggan Taylor Posted November 12, 2026 in REIT Renewals and low turnover continued to support apartment REIT pricing in 3rd quarter 2026, while new lease performance remained pressured across much of the Sun Belt. Results from Camden Property Trust, Essex Property Trust, Mid-America Apartment Communities (MAA), UDR and Vivmark Residential highlighted a sharp divide between coastal and Sun Belt markets, as coastal-heavy operators raised guidance and Sun Belt-focused peers lowered expectations. A merger and major portfolio shifts reshaped the group Vivmark Residential reported its first quarterly results since AvalonBay Communities and Equity Residential completed their merger on Aug. 17, creating a same-store portfolio of 157,377 apartment homes. The company raised its target for yearly cost savings and revenue gains from the combination by $10 million to $135 million. COO Michael Manelis said years of separate operations gave Vivmark “a multi-year A/B test,” letting it compare the two companies’ practices and keep what works best. Other operators also changed their portfolio exposure. Camden completed the roughly $1.6 billion sale of 11 California communities on July 29, and UDR formed a $2 billion partnership with Apollo, covering 19 communities. As a result, three of the five REITs now operate meaningfully different portfolios than a year ago. Renewals continued to carry lease pricing Renewals remained the primary source of pricing strength. Renewal lease rates rose 5.3% at Essex, MAA and Vivmark and 3.6% at Camden, while retention remained elevated across portfolios. UDR reported a record-high 3rd quarter retention rate of 52%, and MAA recorded a record-low share (10.1%) of move-outs to homeownership. Management tied that stability largely to housing costs. “We see sustained high homeownership costs, and we see residents continuing to stay in place, both for cyclical and structural reasons,” UDR CFO Dave Bragg said. MAA added that the dollar gap between new and renewal rents has held at about $190 to $200 for four quarters, a small difference next to the cost and hassle of moving. New lease pricing stayed negative as concessions persisted New lease pricing told a different story. New lease rates declined at four of the five REITs, ranging from -6.0% at MAA to -0.2% at Essex. Vivmark was the only exception, with new lease rates up 0.4%. Camden and MAA attributed the weakness largely to lease-up discounting and lease mix. “Concessions have remained remarkably sticky, seemingly led by many merchant builders now turned reluctant operators,” Camden CEO Alex Jessett said. MAA said its year-to-date new lease decline narrows to -1.9% when the departing resident stayed only one lease term, a figure it views as a better gauge of market rents. Northern California and Denver marked the extremes Regional performance diverged sharply. Northern California led results at both Vivmark and Essex, where same-store NOI rose 11.2% and 7.0%, respectively. At UDR, new lease rates rose 5.7% in the West region but fell 7.2% in the Southwest region. Denver sat at the other end, with same-store NOI down 9.6% at Vivmark and nearly 7% at both Camden and MAA. Essex linked Northern California’s strength to limited supply and rents that remain below historical norms relative to incomes. By its estimate, rents could rise more than 20%, assuming no wage growth, before rent-to-income ratios returned to pre-COVID levels. Meanwhile, Camden tied most of its Denver revenue decline to local legislation that stopped it from billing residents for common-area utilities, on top of persistent concessions. Guidance split along portfolio lines Full-year outlooks followed the same divide. Essex, UDR and Vivmark raised same-store revenue guidance, while Camden and MAA lowered theirs. Both Sun Belt-focused REITs cited timing: MAA said new lease pricing is recovering later than expected, and Camden said September was softer than expected. Both still pointed to early improvement as supply eases. “October new resident lease pricing improved from September, counter to the normal seasonal pattern,” MAA CEO Brad Hill said. What to watch in 4th quarter The key question for 4th quarter is whether easing supply translates into firmer revenue growth in Sun Belt markets. With completions declining and demand holding up, those results should show whether supply-heavy markets are beginning to close the gap with coastal markets. SHARE Tags REITs Previous Article Fall 2027 Pre-Lease Season Holds Steady in October Next Article Realpage Economy Express Episode 75","published_at":1794643213000,"source_family":"realpage-research","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794778664289,"id":"3aeb5e529cc1ae47","acquisition_window":{"lower":1794517200000,"upper":1794776400000},"late_discovery":true,"score":11,"tags":["multifamily","national","earnings","trend","institutional"],"heat_signals":["sun belt"],"date_precision":"timestamp","modified_at":1794816008000,"extraction":"semantic","canonical":"https://realpage.com/analytics/reit-update-3rd-quarter-2026","content_hash":"a9a33dd80b5eae2f7d3b48e2769e5386e354f38206291bada0b0eb31dd457bfc","access":"public","evidence_status":"article","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Renewals Carry Apartment REIT Pricing as Coastal and Sun Belt Results Split"},{"id":"body-1","text":"Renewals Carry Apartment REIT Pricing as Coastal and Sun Belt Results Split by Meggan Taylor Posted November 12, 2026 in REIT Renewals and low turnover continued to support apartment REIT pricing in 3rd quarter 2026, while new lease performance remained pressured across much of the Sun Belt."},{"id":"body-2","text":"Results from Camden Property Trust, Essex Property Trust, Mid-America Apartment Communities (MAA), UDR and Vivmark Residential highlighted a sharp divide between coastal and Sun Belt markets, as coastal-heavy operators raised guidance and Sun Belt-focused peers lowered expectations."},{"id":"body-3","text":"A merger and major portfolio shifts reshaped the group Vivmark Residential reported its first quarterly results since AvalonBay Communities and Equity Residential completed their merger on Aug. 17, creating a same-store portfolio of 157,377 apartment homes."},{"id":"body-4","text":"The company raised its target for yearly cost savings and revenue gains from the combination by $10 million to $135 million."},{"id":"body-5","text":"COO Michael Manelis said years of separate operations gave Vivmark “a multi-year A/B test,” letting it compare the two companies’ practices and keep what works best."},{"id":"body-6","text":"Other operators also changed their portfolio exposure."},{"id":"body-7","text":"Camden completed th"}],"keep":true,"importance":4,"section":"cre","capital_focus":false,"geo_evidence":null,"primary_event":"company_operations","event_evidence_id":"body-1","event_evidence":"Renewals Carry Apartment REIT Pricing as Coastal and Sun Belt Results Split by Meggan Taylor Posted November 12, 2026 in REIT Renewals and low turnover continued to support apartment REIT pricing in 3rd quarter 2026, while new lease performance remained pressured across much of the Sun Belt.","market_evidence_id":"body-2","market_role":"capital_subject","market_scope":"us","market_evidence":"Results from Camden Property Trust, Essex Property Trust, Mid-America Apartment Communities (MAA), UDR and Vivmark Residential highlighted a sharp divide between coastal and Sun Belt markets, as coastal-heavy operators raised guidance and Sun Belt-focused peers lowered expectations.","duplicate_of":null,"selector_reason":"Q3公寓REIT结果显示续租和低周转支撑定价，但Sun Belt新租约承压；同时披露AvalonBay与Equity Residential合并后的157,377套组合及1.35亿美元协同目标。","title_zh":"续租支撑公寓 REIT 定价，阳光地带承压","summary_zh":"RealPage Analytics 称，第三季度续租和低流失率支撑公寓 REIT 定价，但阳光地带新租约表现承压；Essex、MAA 和 Vivmark 续租租金上涨 5.3%。","impact":"neutral","evidence_quote":"Renewals Carry Apartment REIT Pricing as Coastal and Sun Belt Results Split by Meggan Taylor Posted November 12, 2026 in REIT Renewals and low turnover continued to support apartment REIT pricing in 3rd quarter 2026, while new lease performance remained pressured across much of the Sun Belt.","evidence_basis":"body","cre_subcategory":"多户"},{"source_id":"nahb-eyeonhousing","source_name":"NAHB Eye on Housing","source_tier":"B","source_weight":8,"source_tags":["data","trend","policy"],"region":"national","title":"No Relief: Credit Conditions for Builders Still Tightening","link":"https://eyeonhousing.org/2026/11/no-relief-credit-conditions-for-builders-still-tightening/","description":"No Relief: Credit Conditions for Builders Still Tightening November 13, 2026 Paul Emrath No Comments Credit conditions on loans for residential Land Acquisition, Development & Construction (AD&C) were still tightening in the third quarter of 2026, according to NAHB’s quarterly survey on AD&C Financing. The net easing index derived from the survey posted a third-quarter reading of -15.3 (the negative number indicating net tightening). This marks the nineteenth consecutive quarter during which residential builders and developers have reported tightening credit conditions. The NAHB survey agrees closely with the third-quarter results reported by lenders in the Federal Reserve’s survey of senior loan officers, as the net easing index constructed from the Fed survey posted a third-quarter reading of -15.5. Although lenders previously reported a slight easing in 2026 Q2, lenders have generally agreed with builders and developers that credit conditions have been tightening since the beginning of 2022. The Fed survey’s net easing index was in negative territory (indicating net tightening) for 18 of the past 19 quarters. More details from the Fed’s survey of lenders—including measures of demand and net easing for residential mortgages—appeared in a previous post . Meanwhile, measures on the cost of AD&C credit exhibited a combination of relatively small quarter-to-quarter changes, signaling no clear trend in either direction. The average contract interest rate declined from 8.09% in the second quarter to 7.83% in the third quarter on loans for land development, but increased for the other three categories of loans tracked in the NAHB AD&C survey: from 7.77% to 8.08% on loans for land acquisition, from 7.28% to 7.72% on loans for speculative single-family construction, and from 7.01% to 7.27% on loans for pre-sold single-family construction. However, the initial points charged by lenders declined on all four categories of AD&C loans in the third quarter: from 1.05% to 0.86% on loans for land acquisition, from 1.05% to 0.97% on loans for land development, from 0.85% to 0.71% on loans for speculative single-family construction, and from 0.71% to 0.51% on loans for pre-sold single-family construction. Those changes left the average effective interest rate (taking both contract rate and initial points into account) essentially unchanged at 11.83% (compared 11.82% in the second quarter) on loans for speculative single-family construction. The average effective rate increased from 10.43% to 10.55% on loans for land acquisition, but declined from 12.59% to 11.69% on loans for land development, and from 11.67% to 11.47% on loans for pre-sold single-family construction. The NAHB AD&C survey also revealed that 32% of respondents who built single-family homes during the third quarter of 2026 financed some of their homes with a construction-to-permanent (one-time-close) loan made to the ultimate home buyer. On average, 58% of the homes these respondents built were financed in this manner. While the market for residential mortgages has been showing signs of stress recently—including a recent decline in mortgage applications and increase in delinquencies —it is important not to overlook the role access to AD&C credit plays in helping builders and developers expand the supply of affordable housing. More detail on credit conditions for residential builders and developers is available on NAHB’s AD&C Financing Survey web page . AD&C Financing Survey , Residential Construction Loans (AD&C) Prev Previous Existing Home Sales Fell to 16-Year Low Next Building Material Price Inflation Remains High Despite Energy Price Declines Next Leave a Reply Cancel reply Your email address will not be published. Required fields are marked * Comment * Name * Email * Website Yes, add me to your mailing list Share this Page Subscribe to Blog Subscribe Search by Category Video Updates View Please leave this field empty Subscribe to Blog via Email Email Frequency * Instant Daily Weekly Check your inbox or spam folder to confirm your subscription. Construction Statistics Single-Family Multifamily Remodeling Labor Force Construction Wages Employment Data Job Openings Finance Builder Loans Consumer Finance Mortgages Home Sales and Prices Housing Affordability Housing Prices Housing Sales Macroeconomics Federal Reserve GDP Inflation Market Trends Housing Characteristics Housing Demand Industry Demographics Policy Research Building Materials Homeownership Tax Policy Local Data NAHB Indices Research Studies","published_at":1794577446000,"source_family":"nahb-eyeonhousing","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794778664289,"id":"6a062da69541c323","acquisition_window":{"lower":1794517200000,"upper":1794776400000},"late_discovery":true,"score":8,"tags":["housing","national","rates","distress","lender"],"heat_signals":[],"date_precision":"day","published_date":"2026-11-13","modified_at":0,"extraction":"body_fallback","canonical":"https://eyeonhousing.org/2026/11/no-relief-credit-conditions-for-builders-still-tightening","content_hash":"2acfd3dcee54c71f7c465a74e6e285a875674f5c84f99e7dcbfbc1092a000c38","access":"public","evidence_status":"article","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"No Relief: Credit Conditions for Builders Still Tightening"},{"id":"body-1","text":"No Relief: Credit Conditions for Builders Still Tightening November 13, 2026 Paul Emrath No Comments Credit conditions on loans for residential Land Acquisition, Development & Construction (AD&C) were still tightening in the third quarter of 2026, according to NAHB’s quarterly survey on AD&C Financing."},{"id":"body-2","text":"The net easing index derived from the survey posted a third-quarter reading of -15.3 (the negative number indicating net tightening)."},{"id":"body-3","text":"This marks the nineteenth consecutive quarter during which residential builders and developers have reported tightening credit conditions."},{"id":"body-4","text":"The NAHB survey agrees closely with the third-quarter results reported by lenders in the Federal Reserve’s survey of senior loan officers, as the net easing index constructed from the Fed survey posted a third-quarter reading of -15.5."},{"id":"body-5","text":"Although lenders previously reported a slight easing in 2026 Q2, lenders have generally agreed with builders and developers that credit conditions have been tightening since the beginning of 2022."},{"id":"body-6","text":"The Fed survey’s net easing index was in negative territory (indicating net tightening) for 18 of the past 19 quarters."},{"id":"body-7","text":"More details from the Fed’s survey of lenders—including measures of de"}],"keep":true,"importance":4,"section":"national","capital_focus":false,"geo_evidence":null,"primary_event":"market_research_policy","event_evidence_id":"body-2","event_evidence":"The net easing index derived from the survey posted a third-quarter reading of -15.3 (the negative number indicating net tightening).","market_evidence_id":"body-1","market_role":"market_policy","market_scope":"us","market_evidence":"No Relief: Credit Conditions for Builders Still Tightening November 13, 2026 Paul Emrath No Comments Credit conditions on loans for residential Land Acquisition, Development & Construction (AD&C) were still tightening in the third quarter of 2026, according to NAHB’s quarterly survey on AD&C Financing.","duplicate_of":null,"selector_reason":"NAHB建商融资调查显示住宅AD&C贷款净宽松指数为-15.3，信用条件连续第19个季度收紧，并与Fed贷款官调查的-15.5相互印证。","title_zh":"住宅开发商融资条件连续第十九季度收紧","summary_zh":"NAHB 调查显示，住宅土地取得、开发及建设贷款净放宽指数为 -15.3，标志着信贷条件连续第十九季度收紧；部分贷款利率环比上升。","impact":"long-neg","evidence_quote":"No Relief: Credit Conditions for Builders Still Tightening November 13, 2026 Paul Emrath No Comments Credit conditions on loans for residential Land Acquisition, Development & Construction (AD&C) were still tightening in the third quarter of 2026, according to NAHB’s quarterly survey on AD&C Financing. The net easing index derived from the survey posted a third-quarter reading of -15.3 (the negative number indicating net tightening).","evidence_basis":"body","cre_subcategory":null},{"source_id":"nrhc","source_name":"National Rental Home Council (NRHC)","source_tier":"E","source_weight":9,"source_tags":["btr-sfr","institutional"],"region":"national","title":"U.S. Treasury’s Proposed Regulations Concerning Title X Of The 21st Century ROAD To Housing Act: What Real Estate Developers, Investors and Lenders Need to Know – National Law Review","link":"https://natlawreview.com/article/us-treasurys-proposed-regulations-concerning-title-x-21st-century-road-housing-act","description":"John Cagigas Email 678-390-3055 Bio and Articles Find Your Next Job ! Commercial Litigation Attorney Paralegal - Washington, Dist. Columbia Senior Attorney - Arizona or New Mexico Explore More Job Openings U.S. Treasury’s Proposed Regulations Concerning Title X Of The 21st Century ROAD To Housing Act: What Real Estate Developers, Investors and Lenders Need to Know by: John Cagigas , Winstead - News Alert Monday, November 9, 2026 Related Practices & Jurisdictions Real Estate Financial Institutions Banking Administrative Regulatory All Federal Print Mail Download />i Introduction On July 11, 2026, the 21st Century ROAD to Housing Act became law, codified at 42 U.S.C. § 19521 (the “ Act ”). As discussed in our June 24 article, “Title X of the 21st Century ROAD to Housing Act: What Real Estate Developers, Investors and Lenders Need to Know” (the “ Initial Article ”), Title X of the Act generally bars a “ large institutional investor ” from buying—or entering into a contract to buy—a “ single-family home ” unless a statutory exception applies. Under the Act, a covered investor must be a qualifying for-profit entity engaged in the single-family rental (“ SFR ”) business that, alone or with others acting “ in concert ,” has direct or indirect “ investment control ” over at least 350 single-family homes. Homes acquired through statutory exceptions after July 11, 2026, are excluded from that count. For this purpose, a “ single-family home ” generally means a structure with no more than two dwelling units, excluding manufactured homes. On October 23, 2026, the U.S. Department of the Treasury (the “ Treasury ”) issued proposed regulations under Title X (proposed 31 C.F.R. Part 36, the “ Proposed Regulations ”). The Proposed Regulations explain several exceptions for build-to-rent (“ BTR ”), renovate-to-rent, homeownership programs, creditor enforcement and institutional resales, as well as rules affecting investment funds and managers. However, some of the Treasury’s proposals could also complicate common BTR development and sale structures. As of the date hereof, the Proposed Regulations are not binding or final, and the Treasury expects additional rulemakings. Public comments on the Proposed Regulations will be due by November 23, 2026, and the statutory purchase prohibition under the Act becomes effective January 7, 2027, independent of when final regulations are adopted. Key Takeaways The headline for BTR is mixed: the Treasury proposes a purchase deadline of 18 months after a home receives its certificate of occupancy, but also confirms that qualifying homes can be resold repeatedly between covered institutional investors. The Treasury also proposes a written-program requirement for several exceptions and a more detailed test for passive investors. Important gaps remain that are unresolved in the Proposed Regulations, including how the Act applies to fund aggregation, equity transfers, pre-effective-date purchase contracts and BTR homes leased before an institutional sale. The discussion below distinguishes what Congress expressly provided in the Act from the additional conditions the Treasury now offers in the in the Proposed Regulations. BTR Protection: Greater Certainty, but a Narrower Initial Acquisition Window The Act expressly allows purchases under a BTR program in which a large institutional investor “ purchases, constructs, or constructs and retains ” newly constructed homes to be managed as rentals. Our Initial Article explained why that language appeared to protect traditional BTR development and institutional takeout sales. The Treasury’s proposed definition, however, focuses on when a home is purchased and how it is first occupied. Proposed § 36.5 would require a home acquired under the BTR exception to (i) have no previous owner-occupant, (ii) be purchased within 18 months after its certificate of occupancy (or local equivalent), and (iii) be first occupied by renters after the purchase. The Treasury rejected an alternative that would treat an older home as “ newly constructed ” solely because it was originally built and continuously used as a rental. The proposal does not separately explain how these purchase-focused requirements apply when an institutional investor itself constructs and retains the homes, a scenario the Act expressly includes. This may matter for merchant-builders that deliver a community in phases, lease homes as they are completed and sell the stabilized project in one transaction. Because the proposed deadline is tied to each home’s certificate of occupancy, earlier phases could fall outside the proposed BTR exception even while later phases qualify. The Treasury has not proposed a project-wide extension measured from the final phase or stabilization. Another statutory exception may be needed for homes that miss the 18-month window. A second issue concerns lease-up before closing. The proposed § 36.5(c) states that homes must be “ after the purchase, first occupied by renters .” That language appears to require that first-time rental occupancy occur after the institutional buyer purchases the homes, so a home already renter-occupied before sale would appear ineligible for this exception. The Proposed Regulations do not expressly disqualify pre-leased homes or analyze pre-sale lease-up, so clarification remains warranted before buyers rely on this exception. The Act permits BTR homes in both entirely rental and mixed rental/owner-occupied communities, and the Treasury confirms that the exception is not lost simply because a development also contains other property types. The rule still applies home-by-home: conventional apartment buildings with three or more dwelling units per structure generally fall outside the Act’s definition of “ single-family home ,” while qualifying SFR homes within the same development remain subject to the applicable exception. Other points not addressed in the Proposed Regulations that require additional guidance include (i) potenti","published_at":1794596937000,"mutable":false,"date_precision":"timestamp","modified_at":1794244142000,"extraction":"semantic","canonical":"https://natlawreview.com/article/us-treasurys-proposed-regulations-concerning-title-x-21st-century-road-housing-act","content_hash":"31731dc14ee9eb98e15ee954b392a531521c2a76510cb1321e6e9c8bd3f2776c","access":"public","evidence_status":"article","id":"a7fa18d8aca604c2","source_family":"nrhc","is_research":false,"required_source":false,"first_seen_at":1794778664289,"acquisition_window":{"lower":1794517200000,"upper":1794776400000},"late_discovery":true,"score":36,"tags":["btr-sfr","national","policy","regulation","regulator"],"heat_signals":["build-to-rent","btr"," sfr","single-family rental","fed","permits","occupancy"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","t 2 U.S.C. § 19521 (the “ Act ”).","market_evidence_id":"body-3","market_role":"market_policy","market_scope":"us","market_evidence":"Columbia Senior Attorney - Arizona or New Mexico Explore More Job Openings U.S. Treasury’s Proposed Regulations Concerning Title X Of The 21st Century ROAD To Housing Act: What Real Estate Developers, Investors and Lenders Need to Know by: John Cagigas , Winstead - News Alert Monday, November 9, 2026 Related Practices & Jurisdictions Real Estate Financial Institutions Banking Administrative Regulatory All Federal Print Mail Download />i Introduction On July 11, 2026, the 21st Century ROAD to Housing Act became law, codified at 42 U.S.C. § 19521 (the “ Act ”).","duplicate_of":null,"selector_reason":"法律分析说明7月生效的ROAD法案Title X通常禁止大型机构投资者购买或签约购买相关单户住宅，直接影响开发商、投资者和贷款方。","title_zh":"财政部拟定单户住宅机构投资规则","summary_zh":"National Rental Home Council 材料称，财政部已发布 ROAD 法案第十章拟议规则，解释 BTR 例外条款；大型机构投资者购买单户住宅将受法定门槛约束。","impact":"neutral","evidence_quote":"John Cagigas Email 678-390-3055 Bio and Articles Find Your Next Job ! Commercial Litigation Attorney Paralegal - Washington, Dist. Columbia Senior Attorney - Arizona or New Mexico Explore More Job Openings U.S.","evidence_basis":"body","cre_subcategory":null},{"source_id":"houston-agent","source_name":"Houston Agent Magazine","source_tier":"D","source_weight":6,"source_tags":["houston","brokerage"],"region":"texas","title":"HAR named among defendants in new Compass litigation","link":"https://houstonagentmagazine.com/2026/11/16/har-among-defendants-new-compass-litigation/?utm_source=rss&utm_medium=rss&utm_campaign=har-among-defendants-new-compass-litigation","description":"HAR named among defendants in new Compass litigation by Emily Marek November 16, 2026 HAR is one of 15 MLSs named in a new slate of Compass lawsuits. Compass filed new antitrust lawsuits against 15 different MLSs, with the Houston Association of REALTORS ’® Houston Realtors Information Service, Inc., named among the defendants. All MLSs named in Compass’ new slate of suits have rules that require real estate agents to share listings with the MLS when they begin publicly marketing those properties, a practice that directly contradicts Compass’ highly contested three-phase marketing strategy . “Only the law and the homeowner should tell agents how to market a home, and the MLS is neither the law nor the homeowner,” a Compass representative said in a press release. “Agents should be free to compete on the marketing strategies they offer.” In its complaint against HAR, Compass called the association a “competition-killing real estate industry organization” and asserted that HRIS and its “co-conspirators” have banded together to “deprive homeowners of choice.” In addition to HAR, the listing services named in Compass lawsuits include: Arizona Regional MLS bridgeMLS Bay East MLS Canopy MLS Contra Costa MLS Doorify MLS Hive MLS MLSListings The MLS-CLAW NorthstarMLS OneKey MLS REcolorado San Diego MLS Stellar MLS Compass maintains that the lawsuits will ultimately decide whether homeowners or MLSs get to decide how properties are marketed. “It’s almost as if these MLSs are asking people to ignore the evidence that proves their claims aren’t true,” the Compass representative added. “For years, seven of the top 25 MLSs, covering 340,000 agents across 12 states, have allowed agents to publicly market ‘office exclusives’ without fines, and none of the problems they warn about have happened. If what we are asking for is so bad, why has it worked for years in nearly 30% of the country?” HAR declined to comment. Read More Related to This Post Existing-home sales miss estimates in October Why insurance and property taxes are becoming Houston’s biggest housing obstacles Houston single-family home sales dip 15% in October HAR expands Platinum access to San Antonio with LERA MLS partnership Home trends you’ll see in 2027, according to Zillow NAR recommends new MLS policy changes amid Compass private-listings kerfuffle H lor Williams November 16, 2026 November 16, 2026 2 HOUSTON — Stream Realty Partners has brokered the sale of Northwoods Industrial Park, a 2.7-million-square-foot development in northwest Houston. The park consists of 64 buildings on a 230-acre site that were 98 percent leased at the time of sale. Jon Farris of Stream Realty Partners represented the seller, The Texas Development Co., in the transaction and has also been retained as the park’s leasing agent. The late Travis Land of Partners Real Estate represented the buyer, a joint venture between Houston-based Adkisson Group and Los Angeles-based PCCP LLC. Cullen Atchison, Jeremy Slocumb and Hayden Sieling of Institutional Property Advisors (IPA), a division of Marcus & Millichap, arranged acquisition financing for the deal through affiliates of Fortress Investment Group and structured the joint venture between the two groups. Facebook Twitter Linkedin Email previous post IPA Arranges $40.3M in Financing for North San Antonio Apartment Community You may also like IPA Arranges $40.3M in Financing for North San... November 16, 2026 Shorenstein Acquires 300,000 SF Office Tower in North... November 16, 2026 SLX Capital Breaks Ground on Entertainment Venue for... November 16, 2026 Tilden Properties Sells 325-Bed Student Housing Property Near... November 16, 2026 Vestar Acquires 20 Acres in Phoenix, Plans 120,000... November 16, 2026 Joint Venture Buys Google-Occupied, 49,560 SF Office Building... November 16, 2026 Avison Young Arranges $8M Sale of Industrial Property... November 16, 2026 TerraCRG Negotiates $21.5M Sale of Former Drugstore Building... November 16, 2026 Newmark Brokers Sale of 226-Unit Ashford at Geneva... November 16, 2026","published_at":1794845997000,"source_family":"rebusiness-online","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794865086470,"id":"81ea513f67613ec4","acquisition_window":{"lower":1794776400000,"upper":1794862800000},"score":14,"tags":["industrial","housto
