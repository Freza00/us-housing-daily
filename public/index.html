revious year. Total active listings in the Austin area were up 1.4% from a year ago, and new listings were up 2.1%. Loading... Austin, TX (above), had the largest drop in median listing prices in September, followed by Memphis, TN, and Tampa, FL. Raymond/Adobe Stock Memphis, where the median listing price decreased to slightly less than $300,000, saw active listings increase 8.1 % from a year ago. New listings, however, decreased 4.6%. Tampa's median listing price decreased 6.6% to $385,398, while the price per square foot decreased 6.0%. California 's two metro areas in the top 10 continue to be some of the most expensive housing markets in the country. San Diego's median listing price decreased 6.3% to $888,450, while Los Angeles' median listing price decreased 5.9% to just over $1 million. Both metros also reported annual decreases in the price per square foot. Denver and Phoenix, two markets that experienced significant housing demand during the COVID-19 pandemic-era boom, also saw asking prices decrease. Denver's median listing price decreased 4.9% to $569,900, while Phoenix's decreased 4.8% to $475,000. St. Louis saw listing prices decrease 4.7% and active listings increase 16.3%. In Washington, DC, listing prices decreased by 4.6% while active listings increased by 16.2%. Both metro areas now provide buyers with more homes to choose from than they did a year ago. Providence, RI, had the smallest decrease among the 10 metro areas, with its median listing price dipping 4.2% to $569,450. However, its median listing price per square foot increased 8.4% from last year. Price cuts continue to be an indication of pressure on the fall housing market. Nationwide, sellers continue to lower their expectations, according to the Realtor.com September 2026 Monthly Housing Trends Report . In September, 20.8% of all active listings had a price reduction, which was 0.9 percentage points higher than a year ago and the largest share for the month since 2018. Active inventory in ion Homes,” “we,” “our,” and “us”), the nation’s\npremier single-family home leasing and management company, today announced our Third Quarter (“Q3”) 2026 financial and\noperating results.\n\n\nQ3 2026 Highlights\n•   Year over year, total revenues increased 6.3% to $731 million, property operating and maintenance costs increased 2.0% to\n    $264 million, and net income available to common stockholders increased 15.6% to $158 million, or $0.27 per diluted\n    common share.\n•   Year over year, Core FFO per share increased 2.4% to $0.48, while AFFO per share increased 0.1% to $0.38.\n•   Same Store NOI increased 1.1% year over year on 1.6% Same Store Core Revenues growth and 2.5% Same Store Core\n    Operating Expenses growth.\n•   Same Store Average Occupancy was 96.4%, a reduction of 10 basis points year over year.\n•   Same Store renewal rent growth of 4.3% and Same Store new lease rent growth of (0.2)% resulted in Same Store blended\n    rent growth of 3.0%.\n•   We sold 658 wholly owned homes, most to families purchasing for their own use, and acquired 216 wholly owned homes,\n    for net dispositions of 442 homes and net proceeds of approximately $245 million that we used to fund share repurchases.\n•   As previously announced, on July 8, 2026, we closed a public offering of $500 million aggregate principal amount of 4.950%\n    senior notes (the “Notes”). The Notes were priced at 99.291% of the principal amount and mature on February 1, 2032. Net\n    proceeds were used to prepay a portion of our secured debt obligation maturing in June 2027.\n\n\nCapital Allocation Update\nFrom December 1, 2025 through October 27, 2026, we bought back nearly $1 billion of our shares. This includes an aggregate\nof 36,923,753 shares repurchased to date at an average stock price of $26.78, and represents an implied value per home of\napproximately $280,000 against a gross average sales price of approximately $460,000 for homes sold during that same period.\n\n\nOn October 26, 2026, our board of directors authorized an additional $500 million share repurchase program.\n\n\nComments from Chief Executive Officer Dallas Tanner\n“Our third quarter reflected steady execution across the platform. Same Store NOI grew 1.1% year over year, blended rent growth\nwas 3.0%, and with the benefit of our share repurchases, Core FFO per share grew 2.4%. Since December 2025, we’ve\nrepurchased nearly $1 billion of our stock at a substantial valuation discount. We believe that is more than any other residential\nREIT. With the new $500 million share repurchase program our board just authorized, we intend to keep funding buybacks with\nhome sale proceeds whenever our stock trades at a meaningful discount to the value of our homes, guided by market conditions\nand a disciplined approach to the balance sheet.”\n\n\n“Following a solid third quarter, we are raising our full year guidance midpoints for Core FFO per share by $0.01 to $1.96, Same\nStore NOI growth guidance to 1.2%, and wholly owned home sales to $950 million, which supports our continued focus on\nclosing the gap between public and private market values.”\n\fGlossary & Reconciliations of Non-GAAP Financial and Other Operating Measures\nFinancial and operating measures found in the Earnings Release and Supplemental Information include certain measures used by\nInvitation Homes management that are measures not defined under accounting principles generally accepted in the United States\n(“GAAP”). These measures are defined herein and, as applicable, reconciled to the most comparable GAAP measures.\nFinancial Results\nNet Income, FFO, Core FFO, and AFFO Per Share — Diluted\n                             Q3 2026         Q3 2025           YTD 2026        YTD 2025\nNet income                 $      0.27     $      0.22       $      0.90     $      0.72\nFFO                               0.36            0.44              1.25            1.35\nCore FFO                            0.48            0.47              1.46            1.43\nAFFO                                0.38            0.38              1.23            1.22\n\nNet Income\nNet income per common share — diluted for Q3 2026 was $0.27, compared to net income per common share — diluted of $0.22\nfor Q3 2025. Total revenues and total property operating and maintenance expenses for Q3 2026 were $731 million and $264\nmillion, respectively, compared to $688 million and $259 million, respectively, for Q3 2025.\n\n\nNet income per common share — diluted for YTD 2026 was $0.90, compared to net income per share — diluted of $0.72 for\nYTD 2025. Total revenues and total property operating and maintenance expenses for YTD 2026 were $2,213 million and\n$771 million, respectively, compared to $2,044 million and $741 million, respectively, for YTD 2025.\n\n\nCore FFO\nYear over year, Core FFO per share for Q3 2026 increased 2.4% to $0.48, while Core FFO per share for YTD 2026 increased\n2.1% to $1.46, primarily due to a lower share count from stock repurchases and Same Store NOI growth.\n\n\nAFFO\nYear over year, AFFO per share for Q3 2026 increased 0.1% to $0.38, while AFFO per share for YTD 2026 increased 1.1% to\n$1.23, primarily due to the increase in Core FFO per share described above.\n\fOperating Results\nSame Store Operating Results Snapshot\nNumber of Homes, period-end                                      Q3 2026\nTotal Portfolio                                                    85,961\nNumber of homes in Same Store Portfolio:                           76,687\n   Same Store % of Total                                             89.2 %\n\n                                                                 Q3 2026         Q3 2025          YTD 2026       YTD 2025\nCore Revenues growth (year over year)                                1.6 %                            1.7 %\nCore Operating Expenses growth (year over year)                       2.5 %      ","published_at":1793218500000,"mutable":false,"date_precision":" Processing Content Sales of senior living and care facilities reached roughly $28 billion this year through September, more than any full-year total in data from Newmark Group Inc. going back to 2001. That transaction value is up 111% from the first nine months of 2025, the biggest jump for any real estate class after data centers. The sector has been lucrative for investors, generating 16.2% returns on average in the second quarter, compared with 4.9% for industrial real estate and 4.1% for offices, Newmark said. READ MORE: Boomers, Millennials lead cash-rich buyer opportunities Investors anticipate that an increasing population of elderly Americans will generate a greater need for senior living communities. The oldest baby boomers, born in 1946, are turning 80 this year. The number of Americans who are that age or older is projected to jump more than 50% in the decade through 2035, the US Census Bureau estimates . At the same time, new development has been limited, keeping property values high. \"A combination of 80-plus population growth exploding in the US, which is driving the growth and demand for senior housing, and low birth rates in the last 20 to 40 years, which resulted in the dearth of caregivers,\" is enticing investors to the sector, said Adam Doneger, executive vice chairman of US capital markets at Newmark. READ MORE: Most popular cities for boomers to live High construction costs as a result of inflation, tariffs and elevated interest rates as well as a more complicated development process have constrained the supply of new senior housing, Doneger said. Hines, which has $91 billion of assets under management, is interested in buying senior housing properties in locations that are close to urban centers, said Alfonso Munk, co-head of investment management at the firm. \"There is significant demand for senior housing but not enough stock in the US,\" Munk said. Shawna Kwan Bloomberg News","published_at":1793195766000,"source_family":"national-mortgage-news","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1793223428172,"id":"e053223b6b2bb187","score":13,"tags":["institutional","senior-housing","deals","trend"],"heat_signals":["inflation"],"date_precision":"timestamp","modified_at":1793195766056,"extraction":"semantic","canonical":"https://nationalmortgagenews.com/articles/aging-boomers-fuel-28-billion-investor-rush-into-senior-housing","content_hash":"86b77781d2aa2989ffe70d8265bbc10df8bcbddb307c51cd63920ae5dfa159b8","access":"public","evidence_status":"article","keep":true,"importance":4,"section":"institutional","duplicate_of":null,"selector_reason":"养老住宅交易额截至9月约280亿美元，超过任何完整年度总额，显示老龄化需求带动的资本流入","title_zh":"美国老年住房交易额升至 280 亿美元","summary_zh":"Newmark 数据显示，美国老年生活及护理设施交易额截至 9 月约为 280 亿美元，超过其自 2001 年以来记录的任何全年总额；投资者看好老年人口增长带来的需求。","impact":"long-pos","evidence_quote":"Sales of senior living and care facilities reached roughly $28 billion this year through September, more than any full-year total in data from Newmark Group Inc. going back to 2001.","evidence_basis":"body","cre_subcategory":null},{"source_id":"realtor-research","source_name":"Realtor.com Research","source_tier":"B","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"Homeownership Rate Holds at 65.5% in Q3","link":"https://www.realtor.com/research/homeownership-q3-2026/","description":"Economic Coverage , Homeownership Homeownership Rate Holds at 65.5% in Q3 By Hannah Jones Oct 28, 2026 2026 Q3 Homeownership and Housing Vacancy Key Takeaways Homeownership rate holds steady. The U.S. homeownership rate was 65.5% in Q3 2026, statistically unchanged from both the prior quarter (65.0%) and a year earlier (65.3%). The rate continues to plateau in a narrow low-to-mid-65% band, with affordability pressures and limited supply showing little sign of easing their grip on the market. Homeowner vacancy remains low and steady. The homeowner vacancy rate held at 1.2% in Q3, virtually unchanged from both the prior quarter and a year earlier. Rental vacancy reaches its highest level in over a decade. The rental vacancy rate rose to 7.6%, up both quarter-over-quarter (7.3%) and year-over-year (7.1%), its highest level since 2014. Renting remains a critical pressure valve, though conditions vary by geography. With a national rental vacancy rate of 7.6%, rental markets continue to offer more flexibility for households unable to buy. Principal cities (8.8%) remain looser than suburbs (6.5%) and non-metro areas (6.4%), which were statistically similar to each other. The South leads in vacancy levels, while the Northeast and West saw the clearest year-over-year shifts. The South posted the highest rental vacancy rate (9.2%) and homeowner vacancy rate (1.5%) of any region, though neither was statistically different from a year ago. Rental vacancy rose significantly in the Northeast (5.0% to 6.2%) and the West (6.0% to 6.7%). Ownership slipped among 35-to-44-year-olds, while older households gained. Homeownership among 35-to-44-year-olds fell from 61.1% to 60.1% year-over-year. Households under 35 remain the lowest at 36.6%, statistically unchanged from 37.5% a year earlier. Meanwhile, 65+ homeownership rose from 77.9% to 79.1%. Racial ownership gaps remain entrenched. Homeownership among Black households fell from 45.7% to 44.4% year-over-year, while White homeownership rose from 74.0% to 75.1%. All other groups did not see statistically significant shifts. What happened this quarter The U.S. homeownership rate held at 65.5% in the third quarter of 2026, statistically unchanged compared with both the prior quarter (65.0%) and a year earlier (65.3%). While the rate remains within the narrow low-to-mid-65% range that has characterized the market in recent years, it continues to run well below the 2020 pandemic-era peak. Mortgage rates pushed back above 7% in late September for the first time in more than a year, which could weigh on would-be buyers heading into the fourth quarter. The homeowner vacancy rate held at 1.2% in Q3 2026, virtually the same as the previous quarter and the previous year. While homeowner vacancy remains below pre-pandemic norms, the recent pick up in inventory could mean vacancy drifts higher if demand is not sufficient to absorb supply. The rental vacancy rate rose to 7.6% in the third quarter, higher than both the previous quarter (7.3%) and the previous year (7.1%). With mortgage rates moving back above 7%, renting continues to stand out as a more affordable alternative to homeownership. However, climbing rental vacancy suggests that units are sitting empty as affordability pressure may discourage household formation. Vacancy was highest in principal cities (8.8%). Suburbs (6.5%) and non-metro areas (6.4%) were lower and not statistically different from each other. Regional differences remain pronounced . The South recorded the highest rental vacancy rate at 9.2%, followed by the Midwest (7.1%), the West (6.7%), and the Northeast (6.2%). The Midwest was higher than the Northeast and statistically similar to the West, while the Northeast and West were not statistically different from each other. Of the four regions, only the Northeast (up from 5.0%) and West (up from 6.0%) saw a statistically significant year-over-year increase in rental vacancy. Rental vacancy has stalled in the South as the wave of supply has subsided . The post-pandemic construction boom flooded these markets with new supply, but as multifamily construction has slowed, vacancy growth has stalled. On the ownership side, the South again led with the highest homeowner vacancy rate at 1.5%, while the other three regions saw vacancy between 0.9% and 1.1%. The Midwest continues to stand out for its high homeownership rate, reaching 69.5% in Q3 2026, though not statistically different from a year earlier, and remains well above the South (67.2%), Northeast (62.9%), and West (60.6%). Different outcomes by race/ethnicity Homeownership rates by race and ethnicity were mixed year over year. In the third quarter, the rate for non-Hispanic White householders rose to 75.1% from 74.0%, while the rate for Asian, Native Hawaiian, and Pacific Islander householders was statistically unchanged at 62.3%. The rate for Black householders fell to 44.4% from 45.7%, and the rate for Hispanic householders was statistically unchanged at 48.1%. The gap between the highest and lowest rates remains more than 30 percentage points, underscoring the persistence of structural barriers to ownership. Different outcomes by age Ownership among younger households remains low, while older householders saw improvement. Homeownership among those under 35 was the lowest of any age group at 36.6%, statistically unchanged from 37.5% a year earlier. Homeownership among households aged 35 to 44 fell from 61.1% in Q3 of 2025 to 60.1% in Q3 of 2026. Ownership in the 45 to 54 and 55 to 64 cohorts held steady at 70.4% and 75.4%, respectively, while the 65+ group saw a 1.2 percentage point improvement to 79.1%. Ample starter-home inventory is crucial for young homeownership, and availability varies significantly across the country .","published_at":1793203943000,"mutable":false,"date_precision":"timestamp","modified_at":0,"extraction":"semantic","canonical":"https://realtor.com/research/homeownership-q3-2026","content_hash":"0be7aa2e6f13163210a5c00dac5c3cb867a1a93cf0ccb12de2dd47d8647415ad","access":"public","evidence_status":"article","id":"360d4f04aac1b5fa","source_family":"realtor-com","is_research":true,"required_source":true,"first_seen_at":1793223428172,"score":28,"tags":["national","housing","data","trend"],"heat_signals":["mortgage rate","year over year","year-over-year","rental market","vacancy"],"keep":true,"importance":4,"section":"national","duplicate_of":null,"selector_reason":"报告住房拥有率、房主空置率和租赁空置率，租赁空置率升至2014年以来最高，提供独立市场信号","title_zh":"美国住房自有率持平，租赁空置率升至 7.6%","summary_zh":"Realtor.com 数据显示，2026 年第三季度美国住房自有率为 65.5%，与上季及上年同期相比统计上均无显著变化；租赁空置率升至 7.6%，为 2014 年以来最高。","impact":"neutral","evidence_quote":"The rental vacancy rate rose to 7.6%, up both quarter-over-quarter (7.3%) and year-over-year (7.1%), its highest level since 2014.","evidence_basis":"body","cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"CoStar Acquiring Aerial Imaging Firm Vexcel For $730M","link":"https://www.bisnow.com/news/national/technology/costar-to-acquire-aerial-imagery-company-for-730m","description":"CoStar Group is taking to the skies with its latest acquisition. But after announcing the purchase of an aerial imaging company along with its third-quarter earnings, the commercial real estate tech giant's stock is hitting some turbulence. Pixabay/Hotshoe55 Arlington, Virginia-based CoStar has reached a $730M all-cash deal to buy Vexcel, which uses manned aircraft and proprietary imaging technology to collect tens of millions of high-resolution aerial photographs a year across 45 countries. CoStar for years has used fleets of cars to capture photographs of buildings for its vast property database. It plans to complement that with Vexcel's aerial photography and use artificial intelligence to \"recognize and extract information and features from them,\" CEO Andy Florance said Tuesday on CoStar's earnings call. \"It is clearly aligned with our mission of digitizing the world's real estate with an incredible ability to leverage AI to create proprietary real estate data of durable value,\" Florance added. Vexcel brought in $140M in revenue over the last 12 months, up 30% year-over-year, with a six-person sales team, Florance said. He said CoStar can supercharge that growth by expanding Vexcel's sales workforce with CoStar's own 2,000-person sales team. Erik Jorgensen is expected to continue as CEO of Vexcel, which will keep operating its data program and serve its customers under its own brand, CoStar's press release says. The deal is slated to close early next year. \"By joining CoStar Group, we gain the scale, technology, and resources to broaden our reach, accelerate innovation, and deliver even greater value to customers worldwide,\" Jorgensen said in the release. The deal continues CoStar's decades-long strategy of growing through acquisitions. In August, it closed the previously announced acquisition of housing data provider Zonda for $815M. The company's biggest acquisition in recent years was the $1.6B deal to acquire 3D imaging company Matterport that closed in February 2025 . During a question-and-answer session with analysts, Florance compared the Vexcel acquisition to Matterport for the way it will continue to operate as its own company. \"In terms of exclusivity, I think this works a little bit like Matterport,\" Florance said. \"Matterport continues to grow as a standalone product, but because it's a combined entity with CoStar, the team at Matterport does a great job in making sure their products are responsive to the needs of our product areas, whether it be apartments, LoopNet [or] homes.\" Matterport's subscription revenue grew 11% year-over-year in the third quarter, and CoStar expects it to be profitable by the end of next year, Florance said. CoStar's overall revenue rose 14% year-over-year to $952M, and its net income totaled $74M, according to its earnings statement, released after markets closed Tuesday. The company raised its full-year guidance for revenue and earnings from its second-quarter estimates. But Wall Street reacted negatively to CoStar's earnings report, with the company's share price plunging by more than 13% Wednesday. Its stock is down 65% over the last year. Investors appeared to be spooked by CoStar's decline in annualized net new bookings, which totaled $37M last quarter, compared to $84M a year earlier. According to Investing.com , analysts BTIG and Jefferies cut their price targets for CoStar following Tuesday's earnings report. Florance said net new bookings came in below his expectations due to \"economic headwinds and slower-than-expected sales force growth.\" Continue reading this story with a free account Log in or register Related Topics: Andy Florance , CoStar , CoStar Group , Matterport , Vexcel , Zonda","published_at":1793214987000,"mutable":false,"date_precision":"timestamp","modified_at":1793214996000,"extraction":"semantic","canonical":"https://bisnow.com/news/national/technology/costar-to-acquire-aerial-imagery-company-for-730m","content_hash":"ed60afcfc59bbdd1904189b7049ef9e582294f38da08f2d047279ad3b4a8b92a","access":"public","evidence_status":"article","id":"9cdb12c9db5f2463","source_family":"bisnow","is_research":false,"required_source":false,"first_seen_at":1793223428172,"score":20,"tags":["mixed-asset","national","tech-adoption","deals","brokerage"],"heat_signals":["annual","year-over-year"],"keep":true,"importance":4,"section":"cre","duplicate_of":null,"selector_reason":"人工复核：房地产影像平台收购横跨资产，不虚构具体物业行业","title_zh":"CoStar 拟以 7.3 亿美元收购 Vexcel","summary_zh":"CoStar 达成 7.3 亿美元全现金收购 Vexcel 的协议。Vexcel 在 45 个国家采集航拍影像，CoStar 计划将其影像与人工智能用于识别和提取房地产信息；交易预计明年初完成。","impact":"neutral","evidence_quote":"has reached a $730M all-cash deal to buy Vexcel","evidence_basis":"body","cre_subcategory":"跨资产"},{"source_id":"houston-bj-resi","source_name":"Houston Business Journal — Residential RE","source_tier":"D","source_weight":7,"source_tags":["houston","housing"],"region":"texas","title":"Houston jumps to No. 1 in homebuilding prospects on PwC-ULI annual list of real estate markets to watch - The Business Journals","link":"https://news.google.com/rss/articles/CBMiqgFBVV95cUxNOHo5VVpaVXJ2ZVE4RXpib2M5bkUtZmRNaVpOcE54RVdQaHJlVzRNMVIwM1N3N2xpcnM1LVUwbjN0amRuYVg4MXNYLXIxbGk1ajJmaXA2aGRQNDdsTEtyWGRqUzUwcUhFQ2pXWUFMUUlEcGNJVG9KVnpoWWpmRWxLZmNjNERZZ3YzNXh3ckFZT3RyNFN2MlVSMlNKaTFTOGNXS2d2UVlBOXM2QQ?oc=5","description":"Houston jumps to No. 1 in homebuilding prospects on PwC-ULI annual list of real estate markets to watch &nbsp;&nbsp; The Business Journals","published_at":1793216100000,"mutable":false,"evidence_status":"insufficient","source_family":"bizjournals","is_research":false,"required_source":false,"first_seen_at":1793223428172,"id":"34eb563c906f28cf","score":17,"tags":["sun-belt","housing","homebuilder","trend"],"heat_signals":["houston","annual"],"keep":true,"importance":4,"section":"sunbelt","duplicate_of":null,"selector_reason":"休斯敦在PwC-ULI年度住宅建设前景榜单中排名第一，反映机构对区域市场的评估","title_zh":"休斯敦登上 PwC-ULI 建房前景榜首","summary_zh":"《休斯敦商业期刊》标题称，休斯敦在 PwC-ULI 年度房地产市场观察榜单中的建房前景排名升至第 1。","impact":"neutral","evidence_quote":"Houston jumps to No. 1 in homebuilding prospects on PwC-ULI annual list of real estate markets to watch","evidence_basis":"body","cre_subcategory":null},{"source_id":"national-mortgage-news","source_name":"National Mortgage News","source_tier":"A","source_weight":7,"source_tags":["rates","macro"],"region":"national","title":"Post-2022 loans drive 43% of foreclosure starts; act early","link":"https://www.nationalmortgagenews.com/news/post-2022-loans-drive-43-of-foreclosure-starts-act-early","description":"Servicing Post-2022 loans drive 43% of foreclosure starts; act early By Colin McNamara Published October 28, 2026, 5:43 a.m. EDT | Updated October 28, 2026, 4:52 p.m. EDT 2 Min Read Facebook Twitter LinkedIn Email What's at Stake: Mortgage servicers risk rising defaults if they fail to spot early borrower distress. Supporting Data: 43% of September's foreclosure starts came from loans originated since 2022. Overview bullets generated by AI with editorial review. Recently originated loans are driving the current default pipeline , signaling mortgage servicers should be proactive in identifying financial distress. Processing Content Loans originated in 2022 or later accounted for 43% of September's foreclosure starts and 49% of completed sales, according to the September 2026 ICE First Look report. Because new borrowers have accumulated less equity and face higher borrowing costs, servicers should contact borrowers before they become seriously delinquent and find appropriate solutions to prevent foreclosure. \"Today's market landscape highlights the value of risk management systems that can seamlessly adapt as the book changes,\" Andy Walden, head of mortgage and housing market research at ICE, told National Mortgage News. \"That means scaling workflows up and down as delinquency volumes shift, spotting borrower stress early, responding quickly and having systems that keep pace with changing loan mix and program requirements with regulatory compliance at the forefront,\" he added. Loans originated over the last four years accounted for 36% of active mortgages and 40% of loans that were 90 or more days delinquent or in foreclosure, so their share largely reflects market makeup and the distribution of active loans. Lower-credit-score and high-loan-to-value lending accounted for the bulk of struggling loans, with the majority of 2022-2026 vintage defaults coming from borrowers with credit scores below 660 or down payments of 5% or less, Walden said. The report also showed the national delinquency rate increased 12 basis points to 3.66% last month, which was in line with the seasonal norm. The rate remained 34 basis points below September 2019 and less than every other prepandemic September on record. Loans 30 days or more past due rose 5% year over year, while serious delinquencies were up 21% from a year ago. Meanwhile, foreclosure starts decreased 3% on an annual basis last month, completed sales climbed 15% and active foreclosure inventory jumped 37%, its highest level since early 2019, the report found. Prepayment speed also fell to a 19-month low, as single-month mortality declined by four basis points to 0.59%, marking the sixth straight monthly decline from March's 1.06%. Speeds were down 20% annually as mortgage rates, now sitting comfortably above 7% , continue to suppress prepayment activity. \"Serious delinquencies and active foreclosures are drawing renewed attention, and they're also where technology makes the most difference,\" said Bob Hart, president of mortgage technology at ICE, in a press release Tuesday. \"Servicers need to reach homeowners early to help keep them in their homes and move quickly from first contact to an executable workout without manual handoffs.\" Colin McNamara Reporter Colin McNamara is a reporter for National Mortgage News. He recently graduated with a bachelor's degree in journalism and minor in general business... Read full bio","published_at":1793180626000,"mutable":false,"date_precision":"timestamp","modified_at":1793220778842,"extraction":"semantic","canonical":"https://nationalmortgagenews.com/news/post-2022-loans-drive-43-of-foreclosure-starts-act-early","content_hash":"daee6a33d31bc204fea11cb39af165db0bfa493596f21380fbe14dbe0d3f2db4","access":"public","evidence_status":"article","id":"f8abb773597cb259","source_family":"national-mortgage-news","is_research":false,"required_source":false,"first_seen_at":1793223428172,"score":22,"tags":["national","housing","lender","distress","data"],"heat_signals":["mortgage rate","annual","year over year","housing market"],"keep":true,"importance":4,"section":"national","duplicate_of":null,"selector_reason":"数据显示2022年后发放贷款占9月止赎启动量43%，是住宅信贷压力的重要风险信号","title_zh":"2022 年以来发放贷款占 9 月止赎启动量 43%","summary_zh":"ICE 9 月报告显示，2022 年及之后发放的贷款占当月止赎启动量的 43%、完成止赎出售量的 49%。报道援引 ICE 研究主管建议，贷款服务机构应及早识别借款人压力并联系借款人。","impact":"short-neg","evidence_quote":"Loans originated in 2022 or later accounted for 43% of September's foreclosure starts and 49% of completed sales","evidence_basis":"body","cre_subcategory":null},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Essex ups 2026 guidance amid vigorous Northern California performance","link":"https://www.multifamilydive.com/news/essex-q3-earnings-west-coast/872844/","description":"An article from Essex ups 2026 guidance amid vigorous Northern California performance “West Coast multifamily fundamentals offer a compelling case for continued growth above the U.S. average,” CEO Angela Kleiman said on the REIT’s third-quarter earnings call. Published Oct. 28, 2026 Julie Strupp Senior Editor Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Getty Images Essex Property Trust’s West Coast portfolio saw property revenues grow in the third quarter, driven primarily by the red-hot Northern California market, the San Mateo, California-based REIT reported in its third-quarter 2026 earnings release . Despite the uncertain outlook for the U.S. economy and labor market, “West Coast multifamily fundamentals offer a compelling case for continued growth above the U.S. average,” CEO Angela Kleiman said on the REIT’s earnings call Wednesday. Deliveries are expected to remain low next year, while “technology center innovation continues to attract investment and drive economic activity, supporting our expectation for job and income growth.” The firm slightly upped its full-year 2026 guidance for net income per diluted share, core FFO per diluted share, same-property revenue and same-property NOI. Essex had also raised its guidance in Q2 . Essex’s net income per diluted share in Q3 stood at $1.52, down 40.6% compared to $2.56 in Q3 2025, due primarily to gains on the sale of real estate and land recognized in Q3 2025. Driven by same-property revenue growth, the company’s core FFO per diluted share increased by 0.8% YOY, exceeding the midpoint of its guidance range by $0.01 per diluted share. The REIT saw strong renewals in the third quarter, with Northern California leading the pack, according to Kleiman. Concessions were similar to Q3 last year, at about 10 days, although Essex is offering almost no discounts at its Northern California properties. Regional matters With Northern California's booming tech sector, Essex saw a blended rent growth of 7.3% in the region in Q3, “elevated by a strong leasing season with an extended peak that continued through September,” Kleiman said. Within NoCal, Santa Clara, San Mateo and San Francisco counties outperformed, while Alameda and Contra Costa lagged. Market rents are still catching up in San Francisco, and Kleiman sees plenty of room for more growth. “Just to return to pre-COVID affordability levels, rents could actually increase by over 20% with no wage growth,” Kleiman said. The rent-to-median income ratio in San Francisco currently sits at 25.7%, compared to the 20-year average of just under 30%, according to Kleiman, while Oakland and San Jose are seeing ratios of around 21%. “Affordability remains a tailwind in this market for us, and we continue to have conviction that there's more room to run there,” Kleiman said. Seattle has gradually recovered from a soft start to the year, led by the east side, where tenants are migrating from downtown and other markets, according to Kleiman. The city’s tech jobs are recovering, “and with the office expansion announcements that occurred last year and as supply deliveries continue to decline, we do anticipate that Seattle will have a nice rebound toward the end of next year,” she said. Southern California’s operating conditions remain stable, with Orange County and San Diego performing most strongly in the region, according to Kleiman. She expects to see a lift there from the defense and aerospace industry, which is estimated to surpass $1.5 trillion in the next decade, with “a third of that funding allocated in Southern California.” BY THE NUMBERS Category Q3 YOY Change Revenue $449.9 million 3% Net operating income $313.2 million 3.1% Operating expenses $136.7 million 2.8% Core FFO $4.00 0.8% Average rent $2,777 2.5% Occupancy rate 96.3% 30 bps SOURCE: Essex With SpaceX’s engineering and manufacturing headquarters in the Los Angeles region and Anduril Industries building a new campus in the Long Beach area, “two major industry giants having a footprint in those markets is a very good indication,” Kleiman said. That said, “these are relatively new, and money is just getting allocated. Companies are just starting to hire, and so it would be way too early to see that translate to job growth.” There are “green shoots in LA,” where housing supply has fallen more than 40% over the past two years, according to Kleiman. Even though there have been more entertainment industry layoffs, they make up a small portion of the economy, while professional services remain stable. Essex’s Q3 activity One drag on results was legal settlements. Essex agreed to resolve its case related to RealPage in July for $36.5 million and spent $19.3 million on another litigation matter, per the earnings report. Essex paid the second sum to settle a class-action lawsuit alleging it wrongly withheld security deposits , the Times of San Diego reported. In September, the firm obtained a $275 million unsecured term loan that matures in three years, with two one-year extension options. In the third quarter, Essex sold three apartment communities for a pro rata contract price of $111.9 million, including a 76-unit community in Seattle for $30 million, according to its release. On Tuesday, the firm also closed on a 474-unit community built in 2022 in the East Bay area of Northern California, Kleiman announced on the call. “Priced over $200 million and well below replacement cost, this asset is expected to generate a mid-5% yield,” Kleiman said. Essex bought another 378-unit apartment community built in 2024 in Oakland, California, after the end of Q3, per its earnings report. West Coast transaction volume for institutional assets in Q3 was comparable to last year, according to Kleiman, but with “ recent increases in the Treasury rates is still being factored into the transaction market, it would not be a surprise if fourth quarter volume declines as buyers and sellers adjust to the new rate environment.” C mark Arranges $108M Sale of Multifamily Community in... October 28, 2026 Scannell Properties Buys 7.5 Acres in Auburn, Washington... October 28, 2026 SK Investment, Weaver Capital Acquire Office Portfolio in... October 28, 2026 CBRE Brokers $14.3M Sale of Office Property in... October 28, 2026","published_at":1793199860000,"source_family":"rebusiness-online","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1793223428172,"id":"5ee6a4461cf169be","score":15,"tags":["industrial","texas","deals","institutional"],"heat_signals":["texas","dallas","fort worth"],"date_precision":"timestamp","modified_at":1793199861000,"extraction":"semantic","canonical":"https://rebusinessonline.com/alliance-industrial-bgo-acquire-266152-sf-building-in-fort-worth","content_hash":"624da2251fdd51bba882e903f9c861315420166d5e15dbf1b10f091db7854d3f","access":"public","evidence_status":"article","keep":true,"importance":3,"section":"cre","duplicate_of":null,"selector_reason":"Alliance Industrial与BGO收购Fort Worth工业资产，体现机构资本在DFW工业市场的交易活动","title_zh":"Alliance 与 BGO 收购 Fort Worth 工业物业","summary_zh":"Alliance Industrial 与 BGO 合资收购 Fort Worth 的 Northwest Commerce Park 2 号楼，面积 266,152 平方英尺，建于 2020 年。交易通过非公开市场完成，卖方及成交价格未披露。","impact":"neutral","evidence_quote":"has acquired Northwest Commerce Park Building 2","evidence_basis":"body","cre_subcategory":"工业"},{"source_id":"zillow-research","source_name":"Zillow Research","source_tier":"B","source_weight":9,"source_tags":["housing","data","trend"],"region":"national","title":"Down Payment Assistance Could Cut the Time to Save for a Home by a Year and a Half or More","link":"https://www.zillow.com/research/down-payment-assistance-october-2026/","description":"Down Payment Assistance Could Cut the Time to Save for a Home by a Year and a Half or More Nationally, a 3.5% down payment boost allows a typical buyer to save for a 10% down payment 35% faster October 28, 2026 Anushna Prakash Written by Anushna Prakash Key findings: A median-income household could save 10% down on the typical U.S. home after 4.2 years, according to Zillow’s estimates. With down payment assistance covering 3.5% of that, the time to save would be cut to 2.7 years. Moving from a 6.5% down payment to 10% on a typical U.S. home would save a buyer $1,080 per year in monthly payments. Nationally, those monthly savings would bring an additional 26,338 homes within reach for a median-income buyer. Saving 10% down on the typical U.S. home takes the median household an estimated 4.2 years, or about four years and two months. With a down payment assistance program covering 3.5% of that 10% down payment, the same household could have enough saved a year and a half sooner. The same assistance also lowers a typical buyer’s mortgage payments by $1,080 a year, putting more homes within reach. Nationally, about 26,300 more active listings would become affordable in this scenario. For this analysis, Zillow is assuming a buyer puts a total of 10% down and receives an FHA loan . However, the minimum down payment for an FHA loan is 3.5%, meaning a buyer could also use this level of assistance to cover the entirety of their down payment. Making a smaller down payment does bring up the monthly mortgage payment some, but is a viable option for a buyer with the financial means to cover the monthly payment but without the necessary savings for a down payment. Zillow research has shown that one in five renter households headed by someone ages 29 to 43 could afford the monthly cost of owning a typical home in their market with just 5% down. A 3.5% boost cuts the time to save a 10% down payment by as much as 3.2 years Nationally, a median-income household saving for a 10% down payment on a typical U.S. home needs 4.2 years. That number could be cut to 2.7 years with a 3.5% boost from down payment assistance, a difference of 1.5 years. The benefit is biggest for a buyer in some of the most expensive metro areas, led by Los Angeles, where the years to save fall from 9.1 years to 5.9 years, putting homeownership within reach more than three years sooner. Three other major California metros see gaps of more than two and a half years: San Jose (8.5 years to 5.5 years with down payment assistance), San Diego (7.9 to 5.1) and San Francisco (7.7 to 5). Pittsburgh is the only major metro area where down payment assistance does not shave at least a year off the time needed to save 10% down on a typical home. A median-income Pittsburgh household could save 10% down after 2.7 years, which would be shortened to 1.8 years with down payment assistance. Lower payments save buyers $1,080 a year, bringing more listings within budget With a 6.5% down payment and a 6.78% mortgage rate (the average rate for an FHA loan in September), the monthly payment on a $366,157 home (the typical home value in September, according to the Zillow Home Value Index) would have been $3,010, including estimates for taxes, insurance and maintenance. If given a 3.5% boost via down payment assistance, that same home purchase would come with a monthly payment of $2,920, a savings of $1,080 per year. The annual savings are largest in San Jose ($4,608), San Francisco ($3,396), Los Angeles ($2,880), San Diego ($2,808) and New York ($2,160). Those monthly payment savings can bring more homes within reach. Nationally, 359,434 active listings were affordable to this hypothetical buyer with 6.5% down in September, representing 25.7% of what was listed for sale. With the 3.5% down payment assistance, 26,338 more listings would have been affordable, raising the share of affordable listings to 27.6%. Receiving 3.5% in down payment assistance would have brought the most listings newly within reach in Dallas (864), Atlanta (712), Miami (558) and Washington, D.C. (555). How the numbers work For years-to-save calculations , Zillow assumes a median-income household saves 10% of its income each month. This analysis assumes a household is buying the typical home in a given metro, as measured by the Zillow Home Value Index as of September 2026 . This analysis assumes a buyer is receiving an FHA loan, aligning with the down payment assistance program recently announced by Zillow Home Loans. Monthly housing costs assume a buyer purchases the typical home in a given metro, as measured by the Zillow Home Value Index as of September 2026. Estimates assume a mortgage rate of 6.78%, the average for an FHA loan in September, and include estimates for taxes, insurance and maintenance. Homes are considered affordable if the household would spend no more than 30% of its income on the total monthly payment. What a 3.5% down payment boost could mean for buyers in the 50 largest metro areas Metro area* Years to save 10% on the typical home without down payment assistance Years to save 10% on the typical home with 3.5% down payment assistance Annual savings on total monthly housing costs for the typical home with assistance Affordable listings without assistance, September 2026 (6.5% down) Affordable listings with assistance, September 2026 (10% down) Affordable listings added with assistance, September 2026 United States 4.2 2.7 $1,080 359,434 385,772 26,338 New York, NY 6.8 4.4 $2,160 4,776 5,110 334 Los Angeles, CA 9.1 5.9 $2,880 591 669 78 Chicago, IL 3.7 2.4 $1,056 7,245 7,651 406 Dallas, TX 3.6 2.3 $1,056 7,056 7,920 864 Houston, TX 3.5 2.3 $900 9,320 9,672 352 Washington, D.C. 4.2 2.7 $1,692 6,008 6,563 555 Philadelphia, PA 3.9 2.6 $1,140 5,916 6,155 239 Miami, FL 5.5 3.6 $1,404 10,763 11,321 558 Atlanta, GA 3.8 2.5 $1,116 8,954 9,666 712 Boston, MA 5.7 3.7 $2,148 1,143 1,324 181 Phoenix, AZ 4.6 3.0 $1,296 3,418 3,918 500 San Francisco, CA 7.7 5.0 $3,396 844 914 70 R","published_at":1793181000000,"mutable":false,"date_precision":"timestamp","modified_at":0,"extraction":"body_fallback","canonical":"https://zillow.com/research/down-payment-assistance-october-2026","content_hash":"cd71ae2eea76ed53ece3a6f0d72e7b90d772e6791035b8590622c83f08e279d9","access":"public","evidence_status":"article","id":"41c66b54bab2a426","source_family":"zillow-research","is_research":true,"required_source":true,"first_seen_at":1793223428172,"score":20,"tags":["national","housing","policy","data"],"heat_signals":["houston","dallas","mortgage rate","annual"],"keep":true,"importance":3,"section":"national","duplicate_of":null,"selector_reason":"量化首付援助对购房储蓄时间、月供及可负担房源的影响，为住房政策分析提供参考","title_zh":"首付援助可将购房储蓄时间缩短 1.5 年以上","summary_zh":"Zillow 估算，典型美国住房首付存款时间为 4.2 年；若首付援助覆盖 3.5%，时间可缩短至 2.7 年，并使典型买家每年少支付 1,080 美元按揭款，全国约有 26,300 套挂牌房源进入负担范围。","impact":"long-pos","evidence_quote":"With down payment assistance covering 3.5% of that, the time to save would be cut to 2.7 years.","evidence_basis":"body","cre_subcategory":null},{"source_id":"rebusiness-online","source_name":"REBusiness Online","source_tier":"A","source_weight":6,"source_tags":["mixed-asset","deals"],"region":"national","title":"Joint Venture Breaks Ground on Retail Component of 101-Acre Mixed-Use Project in Kyle, Texas","link":"https://rebusinessonline.com/joint-venture-breaks-ground-on-retail-component-of-101-acre-mixed-use-project-in-kyle-texas/","description":"NewQuest will handle development, leasing and property management of Kyle Park while Transwestern Investments will serve as the capital partner and co-sponsor. Development Retail Texas Joint Venture Breaks Ground on Retail Component of 101-Acre Mixed-Use Project in Kyle, Texas by Taylor Williams October 28, 2026 October 28, 2026 2 KYLE, TEXAS — A joint venture between Houston-based developer NewQuest and Transwestern Investments has broken ground on the retail component of Kyle Park, a 101-acre mixed-use project located at the northeast corner of I-35 and Bebee Road in Central Texas. The retail component of Kyle Park will feature a 412,588-square-foot lifestyle center that is preleased to tenants such as Dick’s Sporting Goods, Burlington, HomeGoods, ULTA Beauty, TJ Maxx, Barnes & Noble, Boot Barn and EōS Fitness . The development is also planned to include hospitality and multifamily uses. An expected completion date for the retail component was not announced. Facebook Twitter Linkedin Email previous post Alliance Industrial, BGO Acquire 266,152 SF Building in Fort Worth You may also like Alliance Industrial, BGO Acquire 266,152 SF Building in... October 28, 2026 Henley Capital Underway on Hotel Redevelopment Project Near... October 28, 2026 Three Tenants Sign Retail Leases in The Woodlands,... October 28, 2026 Partnership Completes 22-Story Apartment Building in Brooklyn October 28, 2026 Scannell Properties Buys 7.5 Acres in Auburn, Washington... October 28, 2026 Cushman & Wakefield | Commercial Advisors Brokers $11.1M... October 28, 2026 Hanley Investment Group, Summit Real Estate Arrange $12.7M... October 28, 2026 Baldwin Supply to Expand Sioux Falls Facility to... October 28, 2026 CBRE Negotiates $15.6M Sale of Convenience Store Property... October 28, 2026","published_at":1793199986000,"source_family":"rebusiness-online","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1793223428172,"id":"9051043be0f06539","score":15,"tags":["retail","texas","construction","deals"],"heat_signals":["texas","houston","fort worth"],"date_precision":"timestamp","modified_at":1793199988000,"extraction":"semantic","canonical":"https://rebusinessonline.com/joint-venture-breaks-ground-on-retail-component-of-101-acre-mixed-use-project-in-kyle-texas","content_hash":"3177466d40ee93100eeb148591bbdfb03839a4cbf8869eb2327d9c8b3bda26c7","access":"public","evidence_status":"article","keep":true,"importance":3,"section":"cre","duplicate_of":null,"selector_reason":"人工复核：Kyle 零售开发按资产归 CRE，Texas 仅为地理标签","title_zh":"德州 Kyle Park 综合项目零售部分开工","summary_zh":"NewQuest 与 Transwestern Investments 合作开发的 Kyle Park 零售部分已在德州 Kyle 开工。该 101 英亩综合项目包含约 412,588 平方英尺生活方式中心，已预租给多家零售及健身品牌。","impact":"long-pos","evidence_quote":"has broken ground on the retail component of Kyle Park, a 101-acre mixed-use project","evidence_basis":"body","cre_subcategory":"零售"},{"source_id":"connect-cre","source_name":"Connect CRE","source_tier":"A","source_weight":7,"source_tags":["mixed-asset","deals"],"region":"national","title":"NYC Median Apartment Rents Reach Record High","link":"https://www.connectcre.com/stories/nyc-median-apartment-rents-reach-record-high/","description":"New York & Tri-State CRE News In Your Inbox. Sign up for Connect emails to stay informed with CRE stories that are 150 words or less. New York & Tri-State + Apartments | October 28, 2026 By: Paul Bubny NYC Median Apartment Rents Reach Record High The median asking rent for New York City apartments reached a record $3,785 in the third quarter of 2026, up $162, or 4.5%, from a year ago, while buying a median-priced home cost $6,952 more per month than renting. With mortgage rates above 7%, the estimated monthly cost of that home would rise to about $11,008, according to the Realtor.com 2026 Q3 NYC Rental Report. Across four of the five boroughs excluding Staten Island, the median asking rent is now at its highest level since Realtor.com began tracking the data in Q2 2019. Affordability pressure is especially concentrated among smaller homes: the median asking rent for units with zero to two bedrooms rose 7.1% year-over year to $3,662, while rent for units with three or more bedrooms rose 2.9% to $5,089. “New York City’s rent growth is broad-based, but the sharpest increase is in the smaller-unit segment, where affordability-minded renters are competing for limited options,” said Jiayi Xu, senior economist at Realtor.com. “At the same time, the cost of buying a typical home is nearly three times the cost of renting, and a mortgage rate above 7% would push that monthly cost even higher. That combination makes it harder for renters to build savings and move toward homeownership.” Connect Inside The Story About Paul Bubny Paul Bubny serves as Senior Content Director for Connect Commercial Real Estate, a role to which he brings 19-plus years’ experience covering the commercial real estate industry and 35-plus years in business-to-business journalism. In this capacity, he oversees daily operations while also reporting on both local/regional markets and national trends, covering individual transactions across all property types, as well as delving into broader subject matter. He produces 11-15 daily news stories per day and works with the Connect team and clients to develop longer-form content, ranging from Q&As to thought-leadership pieces. Prior to joining Connect, Paul was Managing Editor for both Real Estate Forum and GlobeSt.com at American Lawyer Media, where he oversaw operations at both publications while also producing daily news and feature-length articles. His tenure in B2B publishing stretches back into the print era, and he has served as Editor in Chief on four national trade publications. Since 1999, Paul has volunteered as the newsletter editor of passenger rail advocacy groups (one national, one local). Order Reprints ◦ Lease Apartment buildings for sale Check out the latest properties available on apartmentbuildings.com REO | 76 Units Multifamily Property New York, NY New York & Tri-State Listing Status: Available Listing Type: Auction Price: $700,000 No. of Units: 76 Year Built: 1927 Building Size: 63750 Sq ft Lot Size: 21910 Acres No. of Stories: 5 Opportunity Zone: No Price per unit: $9,210 Learn More REO | 23 Units Multifamily Property New York, NY New York & Tri-State Listing Status: Available Listing Type: Auction Price: $450,000 No. of Units: 23 Year Built: 1906 Building Size: 25790 Sq ft Lot Size: 6653 Acres No. of Stories: 5 Opportunity Zone: No Price per unit: $19,565 Learn More View all apartments |Lease New York & Tri-State Apartments NYC Median Apartment Rents Reach Record High Paul Bubny October 28, 2026 Load More","published_at":1793214225000,"source_family":"connect-cre","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1793223428172,"id":"6fb55dc90f591689","score":24,"tags":["national","multifamily","data","trend"],"heat_signals":["mortgage rate","trend","trends","rent growth"],"date_precision":"timestamp","modified_at":1793214233000,"extraction":"semantic","canonical":"https://connectcre.com/stories/nyc-median-apartment-rents-reach-record-high","content_hash":"4f96292fc92a662a6ba719728f70740646e5e68028f4903a399c3cfd6d458717","access":"preview","evidence_status":"preview","keep":true,"importance":3,"section":"national","duplicate_of":null,"selector_reason":"纽约市三季度公寓中位要价租金创纪录，并量化租住与购房成本差距","title_zh":"纽约市公寓租金中位数创纪录","summary_zh":"Realtor.com 报告显示，2026 年第三季度纽约市公寓挂牌租金中位数升至 3,785 美元，同比上涨 4.5%；同期购买中位价住房的月成本约为租赁的近 3 倍。","impact":"short-neg","evidence_quote":"The median asking rent for New York City apartments reached a record $3,785 in the third quarter of 2026","evidence_basis":"body","cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"JLL's Q3 Revenue Surges Amid Strong Leasing","link":"https://www.bisnow.com/news/national/capital-markets/jll-revenue-surges-strong-leasing-capital-markets-activity","description":"Strong performance from JLL ’s leasing and capital markets businesses helped the company record strong revenue growth in the third quarter and beat analyst estimates, it announced Wednesday. The brokerage blew past analysts’ consensus earnings estimates, and its stock surged following the Q3 earnings results, up about 12% as of Wednesday afternoon . Google Maps JLL's Houston office JLL CEO Christian Ulbrich downplayed the impact of elevated interest rates on the company’s capital markets business during its third-quarter earnings call, pointing to a strong deal pipeline and his confidence that deals will close on planned timelines. Ulbrich said rates are just one component of capital cost, and property income and rent growth projections can have a far bigger impact on deals than higher debt financing costs. “While bond yields have risen sharply, the interest rate outlook has been well telegraphed and is working through the market in a measured way,” Ulbrich said on the call with analysts Wednesday morning. “Investors are recalibrating their underwriting to adjust for higher borrowing costs and tighter credit structure.” Adjusted earnings per share was up 50% year-over-year to $6.76, beating the consensus analyst estimate of $6.15. JLL announced it intends to execute a new $500M accelerated share repurchase imminently, bringing full-year repurchases to more than $1B. JLL’s revenue was up 12% in Q3 to $7.3B. Leasing advisory growth was up 27% to $941M, led by U.S. growth in industrial, office and data centers, while capital markets services was up 21% to $736M. “This was a good print, in our view, especially considering the concerns/fears surrounding capital markets (interest rate implications) and leasing (tough comps),” analysts from JPMorgan Chase wrote in a note. “On both fronts, we think JLL provided some comfort with a generally positive tone on where the business stands and its own market share gains and margin expansion.” Ulbrich said very few of the company’s capital markets deals “are actually collapsing,” and not many deals are being renegotiated. He said JLL’s capital markets segment is still a very healthy business, especially in the U.S. “The pipeline in itself is actually still growing,” Ulbrich said. “What is happening is that deal time to close is getting a bit longer. It's more intense price negotiations.” On the leasing front, Chief Financial Officer Kelly Howe said the company is seeing an increase in transaction volume and deal sizes across asset classes. In office, JLL’s U.S. clients in the technology and artificial intelligence industries are looking for large swaths of space, she said. Additionally, growth rates in gateway markets have been significantly higher than in nongateway markets, leading to larger office deal sizes. On the industrial side, some of the brokerage’s clients are looking for larger blocks of high-end warehouse space, contributing to deal growth. Data center leasing can be “a bit lumpy” from quarter to quarter, Howe said, but in Q3, the asset class contributed 5% to total leasing revenue. “We feel good about the underlying drivers of our leasing business,” Howe said. “We think we've got momentum going into the fourth quarter.” JLL’s capital markets revenue was up about 21% through the first three quarters, but the company’s full-year guidance projects revenue in the midteens, with implied fourth-quarter growth flat up to low single digits. Howe and Ulbrich said tough Q4 2025 comps were the driver behind its forecast. The company’s capital markets business brought in $854M during the fourth quarter last year. Ulbrich said the company still has a lot of confidence that most of its capital markets deals planned for Q4 will close then and that not many will fall into 2027. “The question around the increase in interest rates is something which makes it a bit more unpredictable,” Ulbrich said. “Our forecast is probably a bit on the cautious side.” Ultimately, rate predictability is more important for markets than the actual yields, Ulbrich said. If volatility declines and the rate environment becomes more predictable, then capital markets will “immediately” start to increase transaction volumes, he said. “Volatility is worse than the absolute level we are on,” Ulbrich said. “People can live with 5% interest rates. We had many, many years where we had to live with that type of interest levels, and we would have said at the time that's fairly low. Now we have to get used to those types of levels again.” Continue reading this story with a free account Log in or register Related Topics: Christian Ulbrich , JLL , JPMorgan Chase , Kelly Howe","published_at":1793212762000,"source_family":"bisnow","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1793223428172,"id":"f092712eb523aadd","score":27,"tags":["mixed-asset","national","earnings","deals","brokerage"],"heat_signals":["houston","outlook","forecast","year-over-year","rent growth"],"date_precision":"timestamp","modified_at":1793212793000,"extraction":"semantic","canonical":"https://bisnow.com/news/national/capital-markets/jll-revenue-surges-strong-leasing-capital-markets-activity","content_hash":"629a64f9ca2183005d64767a9fc571ef0e6f40bf717f92844e6aa7e1cfaf3506","access":"public","evidence_status":"article","keep":true,"importance":3,"section":"cre","duplicate_of":null,"selector_reason":"人工复核：JLL 集团业绩横跨资产，不虚构具体物业行业","title_zh":"JLL 第三季度收入同比增长 12%","summary_zh":"JLL 第三季度收入同比增长 12% 至 73 亿美元，租赁咨询收入增长 27% 至 9.41 亿美元，资本市场服务收入增长 21% 至 7.36 亿美元；公司同时宣布拟实施 5 亿美元加速股票回购。","impact":"long-pos","evidence_quote":"JLL’s revenue was up 12% in Q3 to $7.3B.","evidence_basis":"body","cre_subcategory":"跨资产"},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"CoStar wants faster Homes.com growth, is shifting sales into the field","link":"https://www.housingwire.com/articles/costar-q3-2026-bookings/","description":"CoStar Group may have recorded its 62nd consecutive quarter of double-digit annual revenue growth in the third quarter of 2026, but CEO and founder Andy Florance wants more. Company-wide, net new bookings came in at $37 million for the quarter, below expectations. “Our renewal rates remained high, but with a growing multibillion-dollar subscription base, we need to continue to grow high ROI sales force headcount,” Florence, the 2026 HousingWire Vanguard award winner, said on his firm’s Q3 2026 earnings call with investors and analysts Tuesday night. “Our sales team met with hundreds of thousands of clients and prospects, but they lack the scale to reach the hundreds of thousands of additional prospects we have.” According to Florance, CoStar currently has roughly 2,000 sales professionals on staff, down roughly 10% compared to a year ago. Looking ahead, Florance said CoStar is focused on making changes to the Homes.com sales team, which originally launched with a large, centralized inside sales team based out of the company’s headquarters in Richmond, Virginia. “We'll continue to build the Richmond team, but we are shifting most of our growth effort to the field sales professionals with prior real estate and sales experience in our top cities,” Florance said. “Field reps who meet with clients face-to-face are, on average, much more productive than inside sales and having visited prospects and clients with our home field sales teams at the agents' open houses and offices.” For the quarter, Homes.com generated $7 million of annualized net new bookings, despite reducing inside sales reps from a peak of 655 a year ago to 267 today. “When we demo Homes membership to an agent, we consistently achieved close rates above 40%,” Florance said. “The objective is more demos and expanding our field sales team is how we get in front of more agents.” This performance comes a little over six months after activist investor campaigns called on CoStar to divest its Homes.com assets. Overall, CoStar’s residential real estate segment generated $460 million in revenue, up from $373 million a year ago. In total, the company generated $952 million in revenue for the quarter, up 14% annually. Additionally, CoStar Group reported $74 million in net income, up $105 million from a year prior. As CoStar looks to continue to maintain its profitability, executives noted that the firm had achieved $150 million in cost efficiencies so far this year, noting the ongoing expense reviews have identified potential additional savings of at least $200 million, which the firm expects to realize over the next 12 to 18 months. Acquisitions performing well CoStar also called out the performance of some of its recent acquisitions during the call, noting that Matterport’ s subscription revenue was up 11%, direct sales bookings was up 14% and new enterprise customers was up 46% year-over-year during the quarter. Executives added that they expect Matterport to be profitable by the end of 2027. In addition to this, executives also highlighted Zonda ’s performance. CoStar closed its $815 million acquisition of Zonda in late August. According to CoStar, Zonda's pro forma third quarter revenue was $42 million, roughly 75% of which was subscription, which grew 4% despite a difficult new homes market. The company also announced its agreement to acquire survey-grade aerial imagery program Vexcel Group for roughly $730 million in cash. CoStar said it expects the deal, which will be funded with cash on hand and CoStar’s existing revolving credit facility, to close during the first quarter of 2027. Vexcel operates a global aerial imagery and geospatial data program that captures more than 60 million images a year across millions of square kilometers. Its coverage spans more than 45 countries, 320 major global metros and 99.6% of the U.S. population. The firm refreshes major U.S. metros as often as three times per year and flies disaster zones within 24 hours of an event for catastrophe assessment and response. “Rapid technology advances in aerial photography and lidar are enabling Vexcel to produce extremely high-resolution images and survey-grade measurements of land, houses, office buildings, industrial properties, retail properties, apartment buildings, construction sites and other infrastructure in the built environment,” Florance said in the announcement. Following closing, Vexcel will continue to operate its data program under the Vexcel brand and serve its existing customers and partners. CEO Erik Jorgensen and the current leadership team are expected to remain in place. For CoStar, which owns Homes.com, Apartments.com , LoopNet and other marketplaces, Vexcel’s imagery and derived data could support richer listing content, more accurate property attributes, improved lead qualification and new data products for lenders, investors and government clients. Related More: Andy Florance CoStar Group Homes.com","published_at":1793219943000,"mutable":false,"date_precision":"timestamp","modified_at":1793220017000,"extraction":"semantic","canonical":"https://housingwire.com/articles/costar-q3-2026-bookings","content_hash":"6d06e37815e09b38239086018c2b40d733433780ff03c820d896bc620c2f75f5","access":"public","evidence_status":"article","id":"1a43072dd2f326ba","source_family":"housingwire","is_research":false,"required_source":false,"first_seen_at":1793223428172,"score":21,"tags":["housing","national","earnings","tech-adoption","brokerage"],"heat_signals":["annual","year-over-year"],"keep":true,"importance":3,"section":"national","duplicate_of":null,"selector_reason":"人工复核：Homes.com 住宅销售平台增长属于全国住宅","title_zh":"CoStar 将 Homes.com 增长重心转向外勤销售","summary_zh":"CoStar 第三季度净新增预订额为 3,700 万美元，低于预期。公司计划将 Homes.com 的增长重点转向主要城市、拥有房地产销售经验的外勤团队；Homes.com 当季年化净新增预订额为 700 万美元。","impact":"neutral","evidence_quote":"we are shifting most of our growth effort to the field sales professionals with prior real estate and sales experience in our top cities","evidence_basis":"body","cre_subcategory":null},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Toll Brothers underwrites lots for tomorrow's market, not yesterday's","link":"https://www.housingwire.com/articles/toll-brothers-land-strategy/","description":"As margins for error narrow in homebuilding’s land rules of engagement, boundaries between strategy and tactics have begun to blur. As slower sales , weaker demand, moderating sales prices and declining margins continue to look for a stabilizing floor, homebuilding land acquisition decision-makers now typically take a more discriminating, granular and real-time look at each deal to ensure it measures up to indefinitely challenging selling conditions. While many builders contend with land bought in a stronger market that is now becoming a liability, Toll Brothers has spent the last few years raising its underwriting bar and tightening it further. That approach is shaping more than what the builder will pay for land. It is influencing where Toll considers building, how it structures deals and where it finds opportunity as competitors reassess older purchases. Rob Paul, Texas and Arkansas group president, and Dustin Bowersett, VP of land acquisition for Toll’s Central Florida division, elaborated on the company’s land strategy during a session last week at the HousingWire Homebuilder Summit , moderated by longtime Wall Street housing analyst Dan Oppenheim. That strategy follows a clear thread. Stricter underwriting, a focus on the best locations, selectivity when sellers won’t budge on price and an emphasis on trusted relationships with land sellers all show how Toll Brothers tries to stay out ahead of a slowing market rather than react to it. Toll Brothers raises the bar for new land Toll Brothers began reassessing its underwriting criteria for evaluating land a few years ago. At the time, lots traded aggressively on the expectation that homes would sell quickly and at high margins, particularly in many high-growth Sun Belt markets. Paul noted that Toll Brothers' land committee is getting much stricter when evaluating deals. As market conditions tightened, the company course-corrected its approach and began scoring land based on a combination of gross margin and internal rate of return (IRR). “The increase of that threshold and making the underwriting more strict over the course of the last couple of years has put us in a position where, should the market turn, we retain some value,” Paul said. This underwriting criteria also considers recent sales performance, while discounting sales performance experienced during the spring, since conditions have worsened since then. “The sales in the last…60 to 90 days absolutely drive decisions. We’re starting to look at what’s happened in the last couple of weeks,” Paul said. Essentially, Toll Brothers expects its newer land purchases to pencil even if the market worsens, because they were completed under higher hurdle-rate standards. The finer point is that the market has changed enough to demand a shift in mindset, with Paul arguing that builders should underwrite the conditions they are likely to face, not the ones they operated through earlier in the year. The Toll Brothers “main and main” advantage Since its inception, Toll Brothers has abided by a “Main-and-Main” philosophy, characterized by purchasing lots in the best locations, i.e. Main Street. This strategy makes sense for Toll Brothers, which has the highest average sales price of any public homebuilder in the country, coming in at roughly $1 million nationally. Bowersett noted that, while Toll Brothers’ Central Florida division sells homes between about $350,000 and $5 million, the vast majority of the division’s volume falls in the $850,000 to $1.3 million range. The bulk of those transactions are domestic move-up buyers, but many are wealthy foreign buyers from Latin America. Regardless of where they come from, they seek top-tier locations in neighborhoods with good schools and a high quality of life. Another reason validates Toll Brothers' focus on Main-and-Main locations. Many fringe areas are now struggling as demand for more affordably priced homes softens or stalls. When buyers are plentiful and demand is high, outlying locations can look like smart bets. However, when that demand thins, the gap between prime and peripheral land can widen quickly. Bowersett pointed to Polk County, Florida, a growing suburban and exurban county located between Orlando and Tampa as an example. During the post-COVID building boom, builders aggressively pursued peripheral land in Polk County. Production builders posted strong absorption rates, developers offered relatively attractive lot pricing and deal structures were easier to negotiate. Now, as population growth and demand in Polk County moderate, that submarket has lost some luster. In hindsight, Toll Brothers’s decision not to pull the trigger on opportunities there proved to be prudent. “We decided not to. We stayed in our core markets, and if you look right now…the lots are essentially worthless in some instances,” Bowersett noted. Peripheral markets nationwide mirror Polk County's dynamics. “The fringe is what gets hurt first, period,” Paul said. “When there are fewer buyers, the market gets a little tough. There’s a flight to quality.” Paul said buyer psychology helps explain the phenomenon. Even when homes are comparable on paper, buyers weigh the risk of being wrong about where they buy. “Buyers don’t want to feel stupid. They don’t want to feel dumb. They don’t want to feel like they’re making a mistake,” he said. “There’s safety in a community that’s already half-built-out. There’s safety in a community that has 10 home sites left.” That preference gives established communities an edge over new fringe developments, reinforcing how Toll Brothers thinks about land. A softer market isn’t lowering demand equally across the board. Instead, demand often remains strongest in central, established locations, leaving builders with outer-ring exposure with a weaker hand to play. Land sellers concede on terms before they cut price Despite a more challenging sales environment, Paul said land sellers are mostly standing pat on lot prices. Toll Brothers ","published_at":1793220499000,"mutable":false,"date_precision":"timestamp","modified_at":1793220521000,"extraction":"semantic","canonical":"https://housingwire.com/articles/toll-brothers-land-strategy","content_hash":"0b7b4765557786b9765f46181accd0448e905bb826e6666d76ae6d71a2ac0eed","access":"public","evidence_status":"article","id":"dc7d0545934d49f5","source_family":"housingwire","is_research":false,"required_source":false,"first_seen_at":1793223428172,"score":17,"tags":["national","housing","homebuilder","trend"],"heat_signals":["texas","sun belt"],"keep":true,"importance":3,"section":"national","duplicate_of":null,"selector_reason":"报道住宅开发商在销售与利润承压时收紧土地承销标准，对住宅建设决策有参考价值","title_zh":"Toll Brothers 收紧土地收购标准","summary_zh":"在销售放缓、需求减弱、售价趋稳及利润率下降的环境下，Toll Brothers 提高土地项目承保标准，聚焦更优地段，并在卖方不愿降价时保持选择性，以应对持续具有挑战性的市场条件。","impact":"short-neg","evidence_quote":"Stricter underwriting, a focus on the best locations, selectivity when sellers won’t budge on price","evidence_basis":"body","cre_subcategory":null},{"source_id":"cnbc-realestate","source_name":"CNBC Realty Check","source_tier":"A","source_weight":6,"source_tags":["macro"],"region":"national","title":"Mortgage rates fell for the second straight week, but more borrowers still sought savings in riskier loans","link":"https://www.cnbc.com/2026/10/28/mortgage-rates-fell-for-the-second-straight-week.html","description":"Skip Navigation Markets Business Investing Tech Politics & Policy Video Watchlist Investing Club PRO Livestream Menu Key Points The average contract interest rate for 30-year fixed-rate mortgages with conforming loan balances, $832,750 or less, decreased to 7.37% from 7.41% Applications for a mortgage to purchase a home rose 4% for the week but were still 18% lower than the same week one year ago. The ARM share of applications increased to 11.3% last week, the highest level in more than a year. In an aerial view, two-story single family homes line the streets of a neighborhood on Sept. 23, 2026 in Thousand Oaks, California. Kevin Carter | Getty Images Mortgage rates fell for the second straight week, and that finally brought consumers back to their brokers. A growing share, however, applied for riskier loans at even lower rates. Total mortgage application volume rose 3.4% last week compared with the previous week, according to the Mortgage Bankers Association's seasonally adjusted index. The average contract interest rate for 30-year fixed-rate mortgages with conforming loan balances, $832,750 or less, decreased to 7.37% from 7.41%, with points increasing to 0.76 from 0.75, including the origination fee, for loans with a 20% down payment. \"The decline in rates gave borrowers some relief, with applications rebounding slightly, particularly conventional applications,\" said Joel Kan, vice president and deputy chief economist at the MBA, in a release. \"Mortgage rates are still more than a percentage point higher than the same week last year and most homeowners still have rates much lower than prevailing market rates.\" And that is why refinance is still running well behind where it was last year. Applications to refinance a home loan climbed 3% for the week but were 61% lower than the same week one year ago. About half of all borrowers today have a mortgage rate below 4%, according to data from the Federal Housing Finance Agency's National Mortgage Database. Applications for a mortgage to purchase a home rose 4% for the week but were still 18% lower than the same week one year ago. While mortgage rates have pulled back some in the last few weeks, they are still much higher than they were just a few months ago, and home prices are still rising. Potential homebuyers are also worried about the broader economy, and, anecdotally, some agents say buyers are waiting to see the results of the midterm elections. Get Property Play directly to your inbox CNBC's Property Play with Diana Olick covers new and evolving opportunities for the real estate investor, delivered weekly to your inbox. Subscribe here to get access today . As borrowers search for savings, more are opting for adjustable-rate mortgages. The ARM share of applications increased to 11.3% last week, the highest level in more than a year. The average contract interest rate for 5/1 ARMs decreased to 6.41% from 6.46%. ARMs are considered riskier because they adjust to whatever the current market rate is That’s the goal of this Ohio county’s streamlining plan The Cuyahoga County, Ohio, Planning Commission says its proposal would modernize zoning standards, unlock development and reduce barriers across the county’s jurisdictions. Published Oct. 28, 2026 Ryan Kushner Reporter Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google South Euclid, Ohio, is among the first six cities to partner with the Cuyahoga County Planning Commission on a unified zoning code initiative. Retrieved from City of South Euclid on October 28, 2026 First published on Listen to the article 3 min This audio is auto-generated. Please let us know if you have feedback . To address the housing affordability crisis, many local governments are attempting to untangle decades-old zoning codes that can hamper development. The Cuyahoga County, Ohio, Planning Commission this summer proposed not only updating its zoning code, but developing one code to rule them all: a unified zoning code for all 59 of its jurisdictions. The plan, known as the unified zoning code initiative, “provides local governments with modern regulations that streamline development processes while developing a coordinated approach with partnering communities,” Mary Cierebiej, executive director of the Cuyahoga County Planning Commission, said in a news release unveiling the initiative in June. The Planning Commission on Sept. 28 issued a request for proposals to find a consultant to begin developing the code. The initiative has six initial participant cities, including Brook Park, East Cleveland, Euclid, Maple Heights, North Olmsted and South Euclid. Cuyahoga County has 1.2 million residents in cities, villages and townships that range from dense urban areas to small suburban communities, many of which have outdated zoning codes that are often incompatible with deve l opment needs , the commission said. Cleveland, which serves as the county seat, has been in the process of updating and implementing its own form-based zoning code . “Many communities lack updated zoning maps or rely on outdated hard copy versions, further complicating redevelopment efforts,” the Planning Commission said. Localities that opt in to the county’s unified zoning code will be able to adopt, administer and enforce the new code and be part of a centralized online zoning map. “Developing a Unified Zoning Code all communities in the County could use would greatly benefit our community in ensuring we have the most up-to-date zoning code possible,” South Euclid, Ohio, Mayor and Cuyahoga County Planning Commission Board member Georgine Welo said in a news release. Money could be a barrier for some local governments. Comprehensive zoning updates in Cuyahoga County regularly exceed $200,000 per community, according to the Planning Commission. “Many communities seek assistance for full zoning code updates or only have the resources to undertake small pieces at a time,” the Planning Commission said. “The UZC process allows multiple community zoning codes to be updated at once and adds the benefit of regional collaboration and ongoing maintenance support.” The Planning Commission said it anticipates working with a zoning consulting firm, legal advisors and its approximately 20-person in-house staff to maintain the unified zoning code. The initiative has three funding partners: the Cleveland Foundation, Cuyahoga Land Bank and Akron Cleveland Association of Realtors. “Our county is mainly built out, and new approaches are needed to repopulate our communities and build upon existing infrastructure,” Cierebiej said. “The Unified Zoning Code initiative supports neighborhood reinvestment by giving communities a faster, more cost‑effective path to updated zoning.” Recommended Reading For affordable housing fund, Cleveland embraces private partnerships Smart Cities Dive After major zoning reform, Cambridge, Massachusetts, launches dashboard to track housing Smart Cities Dive These 3 housing programs are showing r
