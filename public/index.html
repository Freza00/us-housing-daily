x while advancing broader zoning changes that would allow denser apartment construction near transit hubs. One early focus is a proposed Brooklyn rezoning along the future Interborough Express corridor, where the administration hopes to unlock thousands of apartments. The city is also pushing further into the ADU space with new technical and financial support for homeowners building basement apartments, backyard cottages and garage conversions. Those policies build on the Adams administration’s City of Yes framework, but Mamdani is clearly embracing them as part of a broader push to expand housing supply outside traditional large-scale development. The production side of the plan includes new financing mechanisms aimed at keeping deals alive in a difficult market. One proposal would create a revolving loan fund for mixed-income developments that cannot secure traditional financing because of difficult sites or weak economics. Another financing tool would support NYCHA redevelopment projects under the federal PACT program. But the development agenda is only half the story. Mamdani’s administration is preparing a far more aggressive approach toward landlords the city considers negligent or financially distressed. Later this year, the city plans to launch “Fix the City,” an initiative that would coordinate roof-to-cellar inspections in targeted buildings alongside expanded use of the city’s 7A program, which allows courts to strip owners and managers of day-to-day control of troubled properties. The administration also plans to work more closely with lenders and prosecutors to pressure landlords into compliance or initiate foreclosure proceedings in severe cases. Officials framed the strategy as targeting a relatively small group of “bad actor” landlords , though industry groups warn the policies could further destabilize already struggling rent-stabilized buildings. That tension hovered over nearly every conversation surrounding the plan this week. Even before the ful nd Moderates; Small Space Needs Gain There was continued weakness in the first quarter across North American industrial markets. The slowing has produced an overhang of newly delivered speculative logistics space, while rent growth has fallen to virtually nil. In the United States, net absorption totaled 32.8 million square feet in Q1, or 0.2 percent of the 19.3-billion-square-foot inventory. It was the lowest rate of tenant growth in more than a decade aside from the 17.6-million-square-foot contraction in Q2 following the U.S.’s initial tariff announcements. The overall vacancy rate in Q1 settled at 7.5 percent, which has nearly doubled since 2022 as new supply exceeds demand. There was an 8.4 percent Q1 vacancy rate among 13.6-billion square feet of logistics buildings, which account for 68 percent of the total industrial inventory in the U.S. The U.S. industrial market has posted three years of weaker tenant demand. Net absorption last year was 122 million square feet, less than half the pre-pandemic annual average. Over the last 12 months leasing volume, excluding renewals, has risen above the prior two-year average in only about a third of markets surveyed. Markets with the strongest rise in leasing activity include Gettysburg, Pa.; Lancaster, Pa.; Ann Arbor, Mich.; Dover, Del.; Indianapolis; San Francisco; Worcester, Mass.; Raleigh, N.C.; Memphis, Tenn.; Miami; and Philadelphia. This chart shows net absorption, net deliveries and vacancy for industrial space in suburban Philadelphia. The Eastern Pennsylvania industrial market closed Q1 2026 with fundamentals continuing to stabilize and move toward equilibrium. Vacancy remained elevated but showed signs of plateauing following the recent wave of speculative deliveries. Source: Lee Associates Q1 2026 North America Market report. The U.S. industrial scene is nearing the end of a record development wave. While new deliveries have peaked, several Sun Belt and Midwest markets with fewer constraints on new development are amid a record supply surge that could take more than two years to absorb. Austin, Texas; Indianapolis; Greenville/Spartanburg, S.C.; Phoenix; and San Antonio stand out as markets with risks of prolonged higher availability rates with sizable inventories of big box logistics properties. Due to stronger demand and chronically low availability of small spaces, the sub-5 percent vacancy rate in buildings up to 50,000 square feet is still near pre-pandemic levels. Spaces less than 50,000 square feet were listed for less than five months last year compared to 6.2 months for 50,000- to 100,000-square-foot spaces and more than eight months for spaces larger than 100,000 square feet. Some of the most acute shortages of small and multi-tenant buildings are found in Tampa, Fla.; Charlotte, N.C.; Nashville, Tenn.; Jacksonville, Fla.; and Orlando, Fla., fueled by demand from construction contractors and other businesses that serve local housing markets, such as HVAC installers and exterminators. Office Overview: Modest Recovery","published_at":1780073539000,"score":26,"tags":["mixed-asset","national","trend"],"heat_signals":["texas","austin","san antonio","sun belt","trend","annual","housing market","rent growth","vacancy"],"importance":4,"selector_reason":"Lee & Associates报告覆盖工业、多户、办公和零售多个北美CRE板块，提供跨资产类别的市场拐点信号。作为全国性商业地产市场报告，行业参考价值较高，因此评为imp=4。","section":"cre","extended_window":true,"title_zh":"Lee：multifamily 放缓，retail 仍紧","summary_zh":"Q1 工业与multifamily消化供应潮，retail vacancy 2.7%-9%，需求仍稳","impact":"neutral","id":"1be8ab86","fetched_at":1780276796253,"cre_subcategory":"工业"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Brookfield Sells FIGat7th To JH Real Estate Partners","link":"https://www.bisnow.com/los-angeles/news/retail/figat7th-brookfield-sale-jh-real-estate-partners-134743","description":"Brookfield has sold a key property in Downtown Los Angeles in its ongoing q
