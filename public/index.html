he sidelines as they wait for lower mortgage rates, more certainty on inflation and a clearer economic outlook,” NAHB Chairman Bill Owens said in a statement. “The recently enacted 21st Century ROAD to Housing Act contains important provisions on land-use and zoning, regulatory reform and financing tools that address obstacles facing builders and buyers, but these reforms will take time to implement.” “With the HMI below 40 for 15 straight months, affordability remains the home building industry’s primary challenge, as elevated mortgage rates, costly land, rising material prices, and persistent skilled labor shortages continue to affect the market,” NAHB chief economist Robert Dietz added. “Looking ahead, the newly enacted housing law is a positive step that will help expand housing supply and lower overall housing costs, although more policy change is needed at the state and local level.” The recently released June 2026 BTIG / HomeSphere monthly homebuilder survey, which surveys small- and mid-sized homebuilders, also found that homebuilders, by and large, remained cautious. According to the survey, sales rose for a second consecutive month, but only 35% of builders reported higher year-over-year sales, while 27% reported lower year-over-year sales. Customer traffic strengthened more sharply, the survey found. In June, 38% of builders reported higher year-over-year traffic, nearly doubling the 20% who reported higher traffic in May and nearing February’s recent high of 43%. Traffic had been steadily deteriorating from February through May, partially due to increased economic and geopolitical uncertainty. The survey additionally reported that 29% of builders said June sales were better than expected, while 31% reported worse-than-expected sales. Traffic relative to expectations was also relatively weak, as only 27% of builders reported better-than-expected traffic, while 33% reported worse-than-expected traffic. Additionally, 19% of builders raised some, most or all
