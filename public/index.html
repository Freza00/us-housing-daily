 a complaint filed in the U.S. District Court for the Northern District of Georgia , regulators alleged that the company advertised rental prices that did not reflect the full amount tenants would be required to pay, imposed hidden or inadequately disclosed fees and charges, and mishandled security deposits. The claims also included that Progress misrepresented the condition and move-in readiness of properties, restricted tenants’ ability to share reviews, and failed to adequately address tenant complaints and maintenance issues. In a statement given to HousingWire , a representative of Progress Residential and Pretium said the companies have reached an agreement “with the FTC and four states to resolve the Commission’s Civil Investigative Demand related to certain aspects of our resident experience during the period of 2021 to 2025.” “The agreement contains no admission of wrongdoing, and we maintain Progress’ practices have been transparent, fair, and consistent with industry practice,” the spokesperson said. “Although we disagree with the FTC’s claims, this resolution allows us to move forward with our mission of expanding access to quality, affordable rental housing in neighborhoods of opportunity.” The deal was reached by the FTC, the attorneys general of Arizona, Indiana and Colorado, and the Utah Division of Consumer Protection . It combines monetary relief for renters across the country. “We will always welcome investment in housing and recognize the important role private capital can play in increasing opportunities for Hoosier families,” Indiana Attorney General Todd Rokita said in a statement. “But no company, regardless of size or financial backing, gets a free pass to mislead consumers, impose hidden charges or treat tenants unfairly.” “Consumers searching for housing should have access to straightforward information about the costs associated with renting a home,” said Christopher Mufarrige, director of the FTC’s Bureau of Consumer Protection. “Transparency regarding rental prices and fees helps consumers compare options and make informed choices. Clear pricing practices also support competition by allowing housing providers to compete on the basis of price, quality and service. \"The FTC is monitoring the rental housing market and will continue to take action where appropriate to ensure that consumers receive clear and accurate information about the costs of renting a home.” Per the settlement terms, Progress must disclose the total monthly rental price in advertisements and listings, along with mandatory fees and charges, before a consumer commits to rent. The company also must stop withholding funds for ordinary wear and tear and is prohibited from misleading claims about property conditions. The consumer redress funds created by the settlement total $48.5 million and will be used for relief as directed by the stipulated order entered in the federal case. Arizona is receiving $1.25 million. In 2024, Invitation Homes , the largest owner of U.S. single-family rental homes, agreed to pay $48 million to consumers and change some of its practices. Editor's note: This story was updated with a statement from the FTC. Related More: Federal Trade Commission Pretium Partners Single-Family Rentals","published_at":1793998948000,"mutable":false,"date_precision":"timestamp","modified_at":1794004431000,"extraction":"semantic","canonical":"https://housingwire.com/articles/progress-residential-ftc-settlement-49-8m","content_hash":"3250d3a4fd1153922aca5a0d7946a8fabf86d1f075c422c509898b1aeb51111a","access":"public","evidence_status":"article","id":"eaf62f0b9a9f6d95","source_family":"housingwire","is_research":false,"required_source":false,"first_seen_at":1794173831876,"acquisition_window":{"lower":1793912400000,"upper":1794171600000},"score":31,"tags":["btr-sfr","national","regulation","deals"],"heat_signals":["single-family rental","invitation homes","progress residential","fed","housing market"],"keep":true,"importance":5,"sec or market. The labor force participation rate increased to 61.9% from 61.8% as more workers rejoined the workforce. Combined with strong increases in employment, the unemployment rate fell to 4.1% from 4.2%. Why it matters for housing: Stable employment and wage growth give households the confidence to buy a home or sign a new lease, but the housing market is already feeling the chilling effects of the recent surge in mortgage rates. Zillow data points to a colder-than-usual fall market: our preliminary measure of existing home sales fell 8.7% year over year in October. Newly pending listings — a leading indicator of next month’s closed sales — fell 16.8% year over year, the biggest decrease since August 2023. With mortgage rates above 7%, affordability headwinds in the housing market may still feel insurmountable — even for those who have a job or recently found one. This is consistent with our expectation for a more substantial decline in existing home sales and slower growth in home value in Q4. While mortgage rates have been declining from their recent peak, it is difficult to know how far they will fall when forces pushing up Treasury yields, such as anxiety over government deficits and geopolitical impact on energy prices, remain at play. But when mortgage rates come down, eventually, buyers will be ready. The Bureau of Labor Statistics report today is consistent with a stable labor market in a growing economy. The resilient labor market will pave the way for a housing market thaw. Sign up for Zillow Research updates Subscribe to receive weekly emails for the latest Zillow research, weekly housing data, market insights and more. Email Subscribe By submitting this form, you agree to receive email communication from Zillow. We respect your privacy. See our privacy policy . Related Articles 5 min read Zillow: CPI Shelter Forecast, October 2026 5 min read September 2026 Jobs Report: Labor demand continued to slow 5 min read Zillow: CPI Shelter Forecast, September ins, while most Sun Belt markets kept logging rent declines. Northern California's tech-driven markets posted the three strongest gains among the 50 largest apartment markets in the year-ending October. San Francisco saw rents hike 14.7% over the past year, San Jose followed at 9.5%, and Oakland reached 8.5%. All three markets are running near 97% occupancy. Midwest markets make up much of the rest of the top 10 list. Milwaukee led the major Midwest markets with annual rent growth of 4.2%, followed by Chicago (3.3%), Kansas City (3.1%) and Cleveland (3.1%). Detroit and St. Louis both fell just shy of making the cut, with annual rent growth of 2.7% in each market. Sun Belt rents still trail, but the gap is narrowing The South region overall has returned to annual rent growth, though barely, at 0.5% in October. Sun Belt and Florida markets continue to see the nation’s steepest declines. San Antonio had the deepest cut among big markets at 2.6%, stemming from occupancy at 92.5%, also dead last among the largest 50 markets. Also posting rent declines in the year-ending October were Houston (-1.8%), Tampa (-1%), Charlotte (-0.9%) and Denver (-0.8%). The bigger story, however, is how many Sun Belt markets have stopped seeing rent positioning hemorrhage. Annual increases have returned to Phoenix (0.4%) and Austin (0.6%), as well as Atlanta (0.8%), Raleigh (1.0%), Miami (0.6%) and Jacksonville (2.6%). SHARE Tags US apartment market Previous Article San Diego apartment supply is about to peak Next Article U.S. job gains bounce back in October","published_at":1794038408000,"source_family":"realpage-research","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794173831876,"id":"6f31c56cfa67c3aa","acquisition_window":{"lower":1793912400000,"upper":1794171600000},"score":20,"tags":["multifamily","national","data","trend"],"heat_signals":["annual","year-over-year","rent growth"],"date_precision":"timestamp","modified_at":1794124812000,"extraction":"semantic","canonical":"https://realpage.com/analytics/october-2026-us-data-update","content_hash":"49a97665cd618963835041bfca8197aa81560150c6fda49280406ac93115cf02","access":"public","evidence_status":"article","keep":true,"importance":4,"section":"cre","capital_focus":false,"geo_evidence":null,"duplicate_of":null,"selector_reason":"全国公寓市场10月首次出现月度租金下降，入住率降至95%，但年度租金仍上涨1.7%，清晰反映供需再平衡。","title_zh":"美国公寓租金 10 月环比首次下降","summary_zh":"RealPage Analytics 数据显示，美国公寓有效要价租金 10 月环比下降 0.7%，但同比仍增长 1.7%；入住率降至 95%。","impact":"neutral","evidence_quote":"In fact, rents came down a mild 0.7% during October, marking the first monthly rent cut in the U.S. in calendar 2026.","evidence_basis":"body","cre_subcategory":"多户"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Bank Reportedly Looking To Sell $500M In Data Center Loans Following Elections","link":"https://www.bisnow.com/news/national/data-center-capital-markets/ing-unloads-500m-in-data-center-loans-in-wake-of-midterms","description":"Dutch Bank ING is reportedly seeking buyers for roughly $500M of data center loans, an unusual move that comes as fears mount that Democratic gains in the U.S. midterm elections could derail data center projects across the country. WikimediaCommons/Someone Not Awful The bank is accepting offers for 12 loans through a process known as bids wanted in competition, Bloomberg reports . Bids on the debt are due later this month, with individual offers required to exceed $10M. The loans being offered include $25M of debt backing Project Jupiter, the 1,400-acre New Mexico campus being developed by Blue Owl-backed Stack Infrastructure for OpenAI , Oracle and SoftBank 's Stargate initiative. The potentially 2.45-gigawatt project had faced concerns about possible delays before ING began marketing this debt — in September, Oracle sent developers a force majeure notice that would allow it to defer payments if the project is delayed or derailed. ING is also reportedly looking to sell debt tied to data centers being developed by major operators like Vantage and CyrusOne . The Dutch lender is a significant player in data center financing, having been involved in more than 200 deals globally. The auction is reportedly among the first to involve a portfolio made up exclusively of data center debt, and it comes as global markets are reassessing the risks surrounding U.S. data center development following the midterms. Democrats won gubernatorial races in states such as Texas, Georgia and Pennsylvania where data centers became a key campaign issue. According to market research firm Cleanview , about 40% of planned data center capacity in the U.S. is in states where newly elected governors have called for a pause to data center construction. The shifting political winds also extend to Washington, D.C., where Democrats’ control of both chambers of Congress has industry leaders bracing for more aggressive oversight and new restrictions on a sector already struggling to build fast enough to meet demand. Wall Street has reacted accordingly . The Nasdaq 100 fell 6.4% on Thursday, its worst day since 2020, as investors sold stocks tied to the artificial intelligence infrastructure boom. The index gained back about 1.5% on Friday. The bond markets also experienced major declines in the price of structured debt tied to AI infrastructure firms like CoreWeave and Galaxy Digital. Continue reading this story with a free account Log in or register Related Topics: CyrusOne , ING , OpenAI , Oracle , REITs take advantage of low rates , Stack Infrastructure , Stargate","published_at":1794001498000,"source_family":"bisnow","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794173831876,"id":"dbca46e0c4c757dc","acquisition_window":{"lower":1793912400000,"upper":1794171600000},"score":10,"tags":["data-center","national","deals","distress"],"heat_signals":[],"date_precision":"timestamp","modified_at":1794001506000,"extraction":"semantic","canonical":"https://bisnow.com/news/national/data-center-capital-markets/ing-unloads-500m-in-data-center-loans-in-wake-of-midterms","content_hash":"f94577a713eec711277c60002472deaa352de8224512e1e3293a8a6997496e55","access":"public","evidence_status":"article","keep":true,"importance":4,"section":"institutional","capital_focus":true,"geo_evidence":"New Mexico campus","duplicate_of":null,"selector_reason":"ING拟出售约5亿美元数据中心贷款组合，包含与Project Jupiter相关的债务，反映数据中心项目延期风险向信贷市场传导。","title_zh":"ING 据报拟出售约 5 亿美元数据中心贷款","summary_zh":"据报道，ING 正为约 5 亿美元的数据中心贷款寻找买家，市场正重新评估美国数据中心开发面临的政策和项目延期风险。","impact":"short-neg","evidence_quote":"Dutch Bank ING is reportedly seeking buyers for roughly $500M of data center loans","evidence_basis":"body","cre_subcategory":null},{"source_id":"connect-cre","source_name":"Connect CRE","source_tier":"A","source_weight":7,"source_tags":["mixed-asset","deals"],"region":"national","title":"Office Vacancy Eases in Q3 as New Supply Nears Record Lows","link":"https://www.connectcre.com/stories/office-vacancy-eases-in-q3-as-new-supply-nears-record-lows/","description":"National CRE News In Your Inbox. Sign up for Connect emails to stay informed with CRE stories that are 150 words or less. National + Weekender | November 5, 2026 By: Amy Wolff Sorter Office Vacancy Eases in Q3 as New Supply Nears Record Lows The U.S. office market continued its recovery in Q3, according to national reports from CBRE , JLL , Cushman & Wakefield , Colliers and Lee & Associates . All reported lower vacancy year over year, new construction fell to its lowest level in decades, and demand continued to favor higher-quality buildings. Vacancy Declines Everywhere Colliers reported a 17.7% vacancy, representing a 60 basis-point decrease from the year before, and the lowest since Q4 2023. CBRE also noted a 60 bps drop, with vacancy at 18.2%; a fifth consecutive quarterly decline. Cushman & Wakefield had vacancy at 19.8%, down 30 bps from its Q3 2025 peak. JLL reported a vacancy of 21.5%, while Lee & Associates ended up at 13.8%, about 20 bps below its 2025 high. Leasing Favors the Best CBRE said leasing rose 4% year-over-year to 63.8 million square feet, the highest quarterly total since the fourth quarter of 2024, and expects 2026 leasing to surpass its 2022 record. JLL said leases signed over the past 12 months carried an average footprint increase of 13%, even as companies continue to downsize. All agreed that quality continued to drive demand. Cushman & Wakefield said Class A buildings accounted for two-thirds of third-quarter leasing, well above the 10-year average of 61%. Colliers pointed to demand from AI and tech occupiers. At the same time, Lee & Associates credited stricter attendance requirements at major financial firms and AI-driven startups in San Francisco and Silicon Valley, CA. Construction Pipeline Hits Bottom CBRE said completions fell 76% year-over-year to 1.5 million square feet, putting 2026 on track for the lowest annual total since the company started tracking in 1990. JLL said 9.6 million square feet were removed from inventory for conversions or redevelopment during the quarter; completions totaled 3.5 million square feet, and inventory has fallen by more than 45 million square feet since late 2023. Cushman & Wakefield said 23 million square feet is under construction, a 20% increase from its Q1 low, while CBRE reported a slight rise to 20.1 million square feet, driven largely by new starts in Manhattan and Miami, FL. Reports Split on Absorption Total The firms agreed on most Q3 metrics. But absorption figures depended greatly on who was counting. Colliers put positive absorption at 9.5 million square feet of positive net absorption, the ninth consecutive positive quarter. JLL reported the sixth straight positive quarter, citing 5 million square feet. CBRE noted absorption at 4.9 million square feet, representing the 10 th quarter of positive growth, while Cushman & Wakefield’s 50,000 square feet marked its fifth straight positive absorption. Lee & Associates said absorption was negative, ending four straight quarters of gains, with 70% of the shortfall involving Class B buildings. The Q4 Crystal Ball JLL expects interest rate volatility to slow some Q4 sales and delay lease decision-making. Still, tenant requirements in key markets are still above year-ago levels. At the same time, Cushman & Wakefield said a limited construction pipeline should help protect fundamentals from economic pressures. In contrast, Colliers said it anticipates a gradual improvement versus a broader recovery. Photo: Rawpixel.com/Shutterstock Read More News Stories About: CBRE , Colliers , Cushman & Wakefield , JLL , Lee & Associates Connect Inside The Story CBRE Colliers Cushman & Wakefield JLL Lee & Associates About Amy Wolff Sorter I love content. I love writing it, visualizing it, and manipulating it to fit into different formats. I have years of experience in working with content, both as creator and editor. The content I create and edit provides assistance with many goals, ranging from lead generation, to developing street cred through well-timed thought-leadership pieces. Content skills include, but aren't limited to, articles and blogs, e-mails, promotional collateral, infographics, e-books and white papers, website copy and more. Order Reprints ◦ Lease ◦ Economy |Lease |Economy National Office|Weekender Office Vacancy Eases in Q3 as New Supply Nears Record Lows Amy Wolff Sorter November 5, 2026 Load More","published_at":1793913957000,"source_family":"connect-cre","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1793914632855,"id":"ae078bb0f49313af","acquisition_window":{"lower":1793912400000,"upper":1794171600000},"score":14,"tags":["office","national","data","construction"],"heat_signals":["year over year","vacancy"],"date_precision":"day","published_date":"2026-11-05","modified_at":1793913964000,"extraction":"semantic","canonical":"https://connectcre.com/stories/office-vacancy-eases-in-q3-as-new-supply-nears-record-lows","content_hash":"500d5b84df3e0e7de17cf448585d45508bdfc116972daffa9a26a3cbaed50e74","access":"preview","evidence_status":"preview","keep":true,"importance":4,"section":"cre","capital_focus":false,"geo_evidence":null,"duplicate_of":null,"selector_reason":"汇总多个主要研究机构的全国办公市场数据，显示空置率同比下降且新建供应接近数十年低位，具有独立CRE研究价值。","title_zh":"美国办公楼空置率第三季度普遍下降","summary_zh":"多家研究机构报告显示，美国办公楼第三季度空置率同比下降，新建供应降至数十年来低位，租赁需求继续偏向高品质楼宇。","impact":"long-pos","evidence_quote":"All reported lower vacancy year over year, new construction fell to its lowest level in decades, and demand continued to favor higher-quality buildings.","evidence_basis":"body","cre_subcategory":"办公"},{"source_id":"nahb-eyeonhousing","source_name":"NAHB Eye on Housing","source_tier":"B","source_weight":8,"source_tags":["data","trend","policy"],"region":"national","title":"Hiring Rebounds in October, but Residential Construction Employment Declines","link":"https://eyeonhousing.org/2026/11/hiring-rebounds-in-october-but-residential-construction-employment-declines/","description":"Hiring Rebounds in October, but Residential Construction Employment Declines November 6, 2026 Jing Fu No Comments The U.S. labor market rebounded in October, with nonfarm payroll employment increasing by 165,000 jobs and the unemployment rate declining to 4.1%. However, the improvement in overall employment contrasts with continued weakness in residential construction, where employment fell by 16,400 jobs, the largest monthly decline since March 2021. Despite the October rebound, the labor market has recorded job losses in seven of the past 22 months. Wage growth continued to moderate, with average hourly earnings rising 3.1% year over year in October, down from an upwardly revised 3.2% in September. Average hourly earnings reached $38.00. The continued deceleration in wage growth suggests easing wage pressures. National Employment According to the Employment Situation Summary reported by the Bureau of Labor Statistics (BLS), total nonfarm payroll employment increased by 165,000 in October, following an upwardly revised gain of 60,000 in September. Revisions to prior months were broadly positive, reversing last month’s downward revisions. August’s job growth was revised up by 53,000, from the 133,000 reported last month to 186,000, while September’s gain was revised up by 31,000, from an initial estimate of 29,000 to 60,000. Combined, these revisions added 84,000 jobs to previously reported totals, compared with the 60,000 downward revision reported in the prior month. Job growth has strengthened in 2026. Through October, monthly payroll gains have averaged 86,000 on the current data vintage, up from the 68,000 monthly average reported through September. This improvement reflects October's solid employment gain and upward revisions to August and September. The current pace compares with an average of just 10,000 per month in 2025 and 122,000 per month in 2024. Over the past 12 months, total nonfarm employment has grown by 885,000, compared with a 496,000 gain reported a month ago. The unemployment rate fell to 4.1% in October from 4.2% in September. Over the month, the number of employed persons rose by 463,000, while the number of unemployed persons decreased by 41,000. Combined, the civilian labor force expanded by 421,000 in October, extending the labor force growth that began in August. Meanwhile, the labor force participation rate—the proportion of the population either looking for a job or already holding a job—rose 0.1 percentage point to 61.9% in October, marking its fourth consecutive monthly increase. However, the rate remains well below its pre-pandemic level of 63.3% recorded at the start of 2020. Among prime working-age individuals (aged 25 to 54), the participation rate remained unchanged at 83.7%, matching its level a year earlier. Outside of construction, employment gains in October were led by health care (+42,000) and transportation and warehousing (+25,000). Financial activities (+7,000) and retail trade (+6,000) also posted gains. These increases were partially offset by declines in leisure and hospitality (-13,000) and wholesale trade (-9,100). Construction Employment Employment in the overall construction sector declined by 3,000 jobs in October, marking its first monthly decline since February, following an upwardly revised gain of 16,000 in September. Within the industry, residential construction employment fell by 16,400, the largest monthly decline since March 2021. In contrast, non-residential construction employment increased by approximately 13,300. Residential construction employment stood at 3.3 million in October, including 921,000 workers employed by builders and remodelers, down from 922,000 in September, and approximately 2.3 million residential specialty trade contractors. The six-month moving average of residential construction employment changes worsened to a loss of approximately 4,583 jobs per month in October, from a loss of roughly 3,283 in September. Over the last 12 months, residential construction has shed a net of 40,200 jobs, marking the twentieth consecutive month of year-over-year decline. This represents a widening decline from the 26,100 job loss reported a month earlier. Residential construction employment remains 1,270,900 positions above its post-Great Recession low, with that cushion narrowing from 1,287,300 in September. Meanwhile, the unemployment rate for construction workers declined to 4.1% in October on a seasonally adjusted basis, down from 4.3% in September. It remained at a relatively low level. Bureau of Labor Statistics (BLS) , employment , job growth , labor force participation rate , residential construction employment , unemployment rate , wage growth Prev Previous Multifamily Developer Confidence Weakens in Third Quarter Leave a Reply Cancel reply Your email address will not be published. Required fi ,{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"NYC Claims Nearly Half Of State's Opportunity Zones, Putting New Neighborhoods In Play","link":"https://www.bisnow.com/news/new-york/economic-development/nyc-claims-half-of-state-s-opportunity-zones-putting-new-neighborhoods-in-play","description":"The opportunity zone guessing game is over. On Thursday, the Treasury Department released the official list of census tracts eligible for the federal tax incentive program's second iteration, giving investors sitting in Park Avenue towers a new map to pore over. Pexels/Raphael Loquellano Brooklyn’s Bedford-Stuyvesant is among the neighborhoods designated as opportunity zones. “About $100B was deployed in the last decade to the program, probably half of that was quote-unquote institutional capital,” Ackman-Ziff Real Estate Group Director Andrew Rudy said. “I wouldn't be surprised if there was a doubling of capital formation for this iteration of the law versus the last.” Leading up to the release, New York was among the few states to publicize little information about the process. Stricter requirements for census tracts qualifying as “economically distressed” and Congress’ aim of funneling more money toward rural areas raised concerns over which New York City neighborhoods would be selected. The final deadline for states to submit their opportunity zone nominations was Oct. 28, after which Treasury reviewed them before releasing the full list. New York ultimately had 430 census tracts designated as opportunity zones, 210 of which are in the five boroughs. Brooklyn and the Bronx received the greatest number of designations, with 67 and 57, respectively. Another 41 are in Manhattan , 35 are in Queens and 10 are on Staten Island . The program allows investors to defer capital gains taxes and lower the basis on which they are taxed by investing in real estate projects or businesses that spur economic growth in select low-income communities. OZ 1.0, created under the Tax Cuts and Jobs Act of 2017 , used 2010 census data, allowing several neighborhoods already booming with development to qualify. It also gave benefits to projects in tracts adjacent to qualifying zones — a loophole that was removed from 2.0 — further drawing investment to highly developed neighborhoods. Because OZ 2.0 is based on the 2020 census, many areas that benefited the most under the program’s predecessor no longer qualify. Still, New York City’s density, alongside public housing developments and rent-stabilized units, means that some neighborhoods that don’t seem blighted qualify under the poverty threshold. The new map includes parts of Manhattan’s Lower East Side , Harlem and the Upper West Side , but the more appealing sites may be in areas where developers can layer subsidies, according to Ackman-Ziff Director Jordan Brustein. “For example, Yonkers , which is a more emerging area, is still well located on the transportation line and near the city. Developers are able to get unique incentives that yield better returns, which ultimately end up attracting more equity,” Brustein said. “So to us, we're more interested there than maybe even some of these better-located assets that have thinner return profiles.” Prized areas of the outer boroughs include Brooklyn’s Bedford-Stuyvesant , which has become increasingly gentrified, and areas of the East Bronx near the Metro-North’s station expansion. Queens’ Sunnyside Yards , where Mayor Zohran Mamdani is seeking to advance a 12,000-unit residential development , also received designation, despite not being on the initial list of eligible tracts. It is only one of two tracts nationwide to do so, with the other being in Hawaii. But unlike rural areas of the country, where the primary issue for development is attracting capital interest, New York City developers struggle with policies that make building more difficult. Under 485-x , higher construction wage requirements kick in for larger housing projects. As a result, the vast majority of proposals filed in the last two years are for buildings with 99 units or less. Rudy and Brustein said many investors are gravitating toward shovel-ready sites eligible under 1.0 as they raise capital for 2.0. Despite stronger markets like Long Island City no longer being included, the two-year transition period allows developers to continue accepting funds. Faced with higher interest rates and stricter lending standards , some developers in OZ 1.0 zones have pushed through the predevelopment process only to stall out before getting shovels in the ground. As long as they’ve followed compliance, those projects are likely to be among the first to be injected with OZ 2.0 funds. “Think about it this way: There’s a reason why they’re not in 2.0 maps,” Brustein said. “The capital markets have been challenging, and the one bright spot right now in the market is opportunity zones .” Continue reading this story with a free account Log in or register Related Topics: Ackman-Ziff Real Estate Group , Brooklyn , Manhattan , Opportunity zones , opportunity zones 2.0 , Queens , Staten Island , Sunnyside Yards , The Bronx","published_at":1794003838000,"mutable":false,"date_precision":"timestamp","modified_at":1794003865000,"extraction":"semantic","canonical":"https://bisnow.com/news/new-york/economic-development/nyc-claims-half-of-state-s-opportunity-zones-putting-new-neighborhoods-in-play","content_hash":"6a26df2d10c47b985c28a0a040e3a87fc6118e62266fa8eaf6101b2cbe4701c2","access":"public","evidence_status":"article","id":"0ccbdf9444b78b8b","source_family":"bisnow","is_research":false,"required_source":false,"first_seen_at":1794173831876,"acquisition_window":{"lower":1793912400000,"upper":1794171600000},"score":12,"tags":["mixed-asset","nyc","policy","fundraising"],"heat_signals":["fed"],"keep":true,"importance":4,"section":"institutional","capital_focus":true,"geo_evidence":"New York","duplicate_of":null,"selector_reason":"财政部公布第二轮Opportunity Zone地块名单，报道涉及纽约市资格区域及约1000亿美元历史机构资本，可能影响新一轮资本形成。","title_zh":"纽约州公布 430 个第二轮机会区","summary_zh":"美国财政部公布第二轮机会区名单，纽约州共有 430 个指定区域，其中 210 个位于纽约市五大行政区，布鲁克林和布朗克斯数量最多。","impact":"long-pos","evidence_quote":"New York ultimately had 430 census tracts designated as opportunity zones, 210 of which are in the five boroughs.","evidence_basis":"body","cre_subcategory":null},{"source_id":"rebusiness-online","source_name":"REBusiness Online","source_tier":"A","source_weight":6,"source_tags":["mixed-asset","deals"],"region":"national","title":"ULI Emerging Trends Report: DFW Three-Peats as Top Market to Watch in 2027, Houston Holds Serve","link":"https://rebusinessonline.com/uli-emerging-trends-report-dfw-three-peats-as-top-market-to-watch-in-2027-houston-holds-serve/","description":"ULI Emerging Trends Report: DFW Three-Peats as Top Market to Watch in 2027, Houston Holds Serve by Taylor Williams November 6, 2026 November 6, 2026 4 LAS VEGAS — For the third consecutive year, Dallas-Fort Worth (DFW) has secured the top spot as the U.S. market with the best overall real estate prospects. That’s according to the Emerging Trends in Real Estate 2027 report, which is jointly produced every year by the Urban Land Institute (ULI) and accounting firm PwC. After finishing third and fifth in the 2025 and 2026 rankings, respectively, Houston has more or less maintained the status quo, claiming the No. 6 ranking in the 2027 report. Austin, meanwhile, continued to slip in the rankings, ostensibly due to the market’s ongoing struggles to catch up to recent building booms in the industrial and multifamily sectors. The state capital’s real estate prospects ranked 21st on this year’s list, marking the third consecutive year in which the market has failed to crack the Top 10. In explaining the top ranking, ULI and PwC immediately pointed to t he Texas Stock Exchange (TXSE) , which launched in downtown Dallas earlier this year and has been credited with fueling the growth of a major new vertical within the local economy: financial services. The report identified two nameless financial institutions — known within the real estate community to be Goldman Sachs and Morgan Stanley — that are developing new office campuses in Uptown Dallas in conjunction with the debut of TXSE. According to the report, combined, these projects could bring as many as 8,800 new jobs to Dallas over the next decade. In addition, the report noted that DFW is a top market for new development of data centers, though a statewide moratorium on permitting of those facilities and questions about the state’s ability to meet power requirements represent concerns to actualizing some of those projects. Oversupply in the metroplex’s industrial market is also burning off thanks to strong absorption of large-format facilities, while absorption of office space is also on the rise in conjunction with residential conversion projects that are putting dents in the existing inventory of vacant office space. Lastly, the report cited the decisions of both the NBA’s Dallas Mavericks and NHL’s Dallas Stars to pursue new arenas and surrounding mixed-use districts as fresh sources of growth on the retail, restaurant and entertainment sectors. Facebook Twitter Linkedin Email previous post Newmark Provides $53.9M Agency Acquisition Loan for Multifamily Property in Northlake, Texas You may also like Newmark Provides $53.9M Agency Acquisition Loan for Multifamily... November 6, 2026 Cushman & Wakefield Brokers Sale of 754,822 SF... November 6, 2026 Marcus & Millichap Arranges Sale of 359-Unit Self-Storage... November 6, 2026 Lee & Associates’ Q3 2026 Report: Industrial Rebounds,... November 6, 2026 Provident Industrial Completes 497,280 SF Project in El... November 5, 2026 LaSalle Acquires Stake in CityWest Office Campus in... November 5, 2026 Lee & Associates Brokers Sale of 22,000 SF... November 5, 2026 STRIVE Arranges Sale of Small-Bay Industrial Property in... November 5, 2026 InterFace Panel(s): Grocery Anchors, Pad Users Bookend DFW... November 5, 2026","published_at":1793980746000,"source_family":"rebusiness-online","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794173831876,"id":"02d28ad97354c623","acquisition_window":{"lower":1793912400000,"upper":1794171600000},"score":18,"tags":["mixed-asset","dfw","trend"],"heat_signals":["houston","dallas","fort worth","dfw","austin","trend","trends"],"date_precision":"timestamp","modified_at":1793980748000,"extraction":"semantic","canonical":"https://rebusinessonline.com/uli-emerging-trends-report-dfw-three-peats-as-top-market-to-watch-in-2027-houston-holds-serve","content_hash":"f46ea6e3a4b57294a19a0d0277b19a80ba76de3256a989f5294adb582d408508","access":"public","evidence_status":"article","keep":true,"importance":4,"section":"cre","capital_focus":false,"geo_evidence":"Dallas-Fort Worth (DFW)","duplicate_of":null,"selector_reason":"ULI/PwC报告连续第三年将DFW列为最值得关注市场，且比较Houston和Austin排名变化，具有区域资本市场参考价值。","title_zh":"ULI 与 PwC 连续三年看好 DFW","summary_zh":"ULI 与 PwC 的《Emerging Trends in Real Estate 2027》将 Dallas-Fort Worth 连续第三年列为美国综合地产前景最佳市场，Houston 排名第 6。","impact":"long-pos","evidence_quote":"For the third consecutive year, Dallas-Fort Worth (DFW) has secured the top spot as the U.S. market with the best overall real estate prospects.","evidence_basis":"body","cre_subcategory":"跨资产"},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Vivmark finds additional efficiencies after completing AVB-EQR merger","link":"https://www.multifamilydive.com/news/vivmark-earnings-release-blended-rent-growth/873941/","description":"The REIT&rsquo;s net run-rate operating synergies increased by $10 million to $135 million, driven by increased portfolio net operating income opportunities, according to its Q3 earnings release.","published_at":1793914194000 to a live/work building with approximately 260 residential units, while the 241,000 square-foot APEX North office tower on Peachtree Road has already undergone a $4 million capital improvement program that added a new lobby and on-site café to replace a former bank branch. The 386,000 square-foot APEX Tower is slated for a comprehensive redevelopment that will take the 19-story building down to its slabs and columns and rebuild it with a new curtain wall façade, lobby, elevators, town hall and conference center, rooftop skydeck and architectural crown. Additional details on APEX Tower and APEX South will be announced later. The overall goal is to reposition the entire property as a \"premier Buckhead mixed-use destination.\" “The launch of APEX Atlanta reflects our conviction in Buckhead and establishing a new beginning for this irreplaceable landmark property,” said Zac Gruber, principal and president of the Office Division at Banyan Street Capital. “Tenant demand in Buckhead continues to concentrate in the highest-quality buildings, and we are approaching each of the three towers with a distinct strategy to meet it. The work currently underway at APEX North is the first step in a broader, campus-wide plan.” Read More Related to This Post Atlanta Housing Scorecard: Inventory ticks higher as sales slow Lennar begins selling at King Oaks in McDonough Case-Shiller: Atlanta home-price growth ticks higher in August Engel & Völkers Atlanta promotes Managing Broker Kristen Skebe to chief people officer David Weekley to launch third Forsyth County community, Heritage Oaks Peachtree Residential slashing prices up to $100,000 to move inventory Elmington Residential acquires The Asher at Sugarloaf affordable-housing community RangeWater, Nippon Steel break ground on Ellory House community in Lulah Hills Join the conversation Cancel reply Cancel reply Save my name, email, and website in this browser for the next time I comment.","published_at":1793973947000,"source_family":"atlanta-agent","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794173831876,"id":"5b41284e9203e353","acquisition_window":{"lower":1793912400000,"upper":1794171600000},"score":7,"tags":["office","atlanta","deals","construction"],"heat_signals":[],"date_precision":"timestamp","modified_at":0,"extraction":"semantic","canonical":"https://atlantaagentmagazine.com/2026/11/06/atlanta-financial-center","content_hash":"457af5869aa3bb05f1bbd0e8b54063620ba94ad2e3cf66a1848727b96d53015e","access":"public","evidence_status":"article","keep":true,"importance":4,"section":"cre","capital_focus":false,"geo_evidence":"Atlanta Financial Center","duplicate_of":null,"selector_reason":"Atlanta办公楼拟改造约260套住宅并保留改进后的办公空间，是明确的办公转住宅和混合用途再定位项目。","title_zh":"亚特兰大办公楼拟改造为含住宅的综合项目","summary_zh":"Atlanta Financial Center 将更名为 APEX Atlanta，其中 APEX South 计划改造为约 260 套住宅的工作生活楼，其他楼栋也将升级重建。","impact":"long-pos","evidence_quote":"The 284,000-square-foot office tower, APEX South, will be converted into a live/work building with approximately 260 residential units","evidence_basis":"body","cre_subcategory":"办公"},{"source_id":"houston-agent","source_name":"Houston Agent Magazine","source_tier":"D","source_weight":6,"source_tags":["houston","brokerage"],"region":"texas","title":"Housing affordability improves quarterly, annually in Houston","link":"https://houstonagentmagazine.com/2026/11/06/har-affordability-report-q3-2026/?utm_source=rss&utm_medium=rss&utm_campaign=har-affordability-report-q3-2026","description":"Housing affordability improves quarterly, annually in Houston by Emily Marek November 06, 2026 The typical monthly mortgage payment — including principal, taxes and insurance — decreased to $2,520 in Houston during the third quarter. (via HAR) Forty-two percent of Houston-area households could afford a median-priced home during the third quarter, according to the Houston Association of REALTORS ’® new Housing and Rental Affordability Report. That was up from 40% a quarter ago and 39% during the third quarter of 2025. Single-family affordability Despite a higher average 30-year fixed mortgage rate , median home prices declined 0.4% year over year to $340,300. That meant the typical monthly mortgage payment — including principal, taxes and insurance — decreased to $2,520, down from $2,510 a year ago and $2,550 in Q2. Given that cost, Houston households needed an annual income of at least $100,800 to afford a median-priced home. Forty-two percent fell into that income range. “ Affordability is moving in the right direction, and that’s encouraging, but we also know many consumers are still concerned about the cost of buying a home, particularly with mortgage rates remaining elevated,” said HAR Chair Theresa Hill . “For buyers who may have been sitting on the sidelines, it’s worth taking another look at what’s possible. A Realtor can help buyers understand their options and determine what’s realistic for their budget.” Statewide, 45% of households could afford a median-priced home ($335,000) in the third quarter, up from 42% a year prior; nationally, 38% could afford the median of $432,900, which was up from $426,800 a year ago. Rental affordability Among Houston’s single-family rental properties, 44% of households could afford the median lease price in the third quarter. That was down from 45% in both the third quarter of 2025 and the second quarter of 2026. The median monthly lease cost was $2,195, down from $2,200 a year prior. That meant households needed an annual income of $87,800 to afford a single-family rental, down from $88,000 last year. Read More Related to This Post Cotality: Northeast, Midwest drive US home-price growth in September New construction and affordability determine Houston’s hottest communities in Q3 Houston leads the nation in millionaire renter growth 1st Choice Development to add whole-home air quality system to new homes Pace of new-home sales speeds up for fifth-straight month in Houston Home prices rise in majority of Texas metros but decrease statewide Houston homebuilders and developers honored at GHBA Houston’s Best PRISM Awards HAR: Housing market activity cools in Houston amid higher mortgage rates Join the conversation Cancel reply Save my name, email, and website in this browser for the next time I comment.","published_at":1793987398000,"source_family":"houston-agent","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794173831876,"id":"48e55b647684f5ed","acquisition_window":{"lower":1793912400000,"upper":1794171600000},"score":11,"tags":["housing","houston","data","rates"],"heat_signals":["houston","annual"],"date_precision":"timestamp","modified_at":1793992962000,"extraction":"semantic","canonical":"https://houstonagentmagazine.com/2026/11/06/har-affordability-report-q3-2026","content_hash":"c912d181d099ba707adad3f88a2707d95a41dd45ebb0d0608563dbd4ddbc8c57","access":"public","evidence_status":"article","keep":true,"importance":3,"section":"sunbelt","capital_focus":false,"geo_evidence":"Houston-area","duplicate_of":null,"selector_reason":"Houston住房负担能力季度和年度改善至42%，同时中位房价同比下降0.4%，提供当地支付能力数据。","title_zh":"Houston 住房可负担率第三季度升至 42%","summary_zh":"HAR 报告显示，第三季度 Houston 地区 42% 的家庭可负担中位价住房，高于上季度的 40% 和上年同期的 39%；中位房价同比下降 0.4%。","impact":"long-pos","evidence_quote":"Forty-two percent of Houston-area households could afford a median-priced home during the third quarter","evidence_basis":"body","cre_subcategory":null},{"source_id":"houston-agent","source_name":"Houston Agent Magazine","source_tier":"D","source_weight":6,"source_tags":["houston","brokerage"],"region":"texas","title":"Pending listings fall 28.7% in Houston","link":"https://houstonagentmagazine.com/2026/11/06/har-weekly-activity-snapshot-week-44-2026/?utm_source=rss&utm_medium=rss&utm_campaign=har-weekly-activity-snapshot-week-44-2026","description":"Pending listings fall 28.7% in Houston by Emily Marek November 06, 2026 The Houston Weekly Activity Snapshot from the Houston Association of REALTORS. Pending home sales declined again in Houston during the week ended Nov. 11, according to the Weekly Activity Snapshot from the Houston Association of REALTORS® . Houston Realtors helped buyers contract on 1,511 listings, down from 2,119 pending listings during the same week in 2025. Pending listings haven’t increased annually in Houston since early June. Closings also declined annually, with 1,711 home sales during the week, down from 2,023. That was a drop of 15.4%. Meanwhile, new listings decreased 8.3% year over year as 3,054 sellers joined the market, down from 3,330 a year ago. Showings and listing views on HAR.com also declined by 6% and 8.2%, respectively, although open houses increased 2% year over year. Read More Related to This Post Cotality: Northeast, Midwest drive US home-price growth in September Open houses jump 19% in Houston Houston sellers increase slightly in week ended Oct. 19 Home prices rise in majority of Texas metros but decrease statewide Decreased pending sales, showings, listing views indicate slow coming weeks for Houston real estate HAR: Housing market activity cools in Houston amid higher mortgage rates NAR: Existing-home sales post surprise 1.5% gain in September New, pending, closed listings all decline annually in Houston Join the conversation Cancel reply Save my name, email, and website in this browser for the next time I comment.","published_at":1793992842000,"source_family":"houston-agent","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794173831876,"id":"c7d128dc39ba7264","acquisition_window":{"lower":1793912400000,"upper":1794171600000},"score":11,"tags":["housing","houston","data"],"heat_signals":["houston","annual"],"date_precision":"timestamp","modified_at":1793992906000,"extraction":"semantic","canonical":"https://houstonagentmagazine.com/2026/11/06/har-weekly-activity-snapshot-week-44-2026","content_hash":"a74a382765956495862f983ae45d3758f4df0d2aced00dea85fa86e0b61c7d3d","access" gnated economic development zones than within them. ATTOM’s latest Opportunity Zones Report also noted that the third quarter of 2026 represented the highest median home value since the beginning of the Great Recession in 2008 for 9.4 percent (357) of Opportunity Zone census tracts. In addition, 27.1 percent of the tracts recorded double-digit annual growth in median home values. In this post , we examine the data behind ATTOM’s Q3 2026 Opportunity Zones Report to identify the 10 Opportunity Zones, with third quarter median price points at $200,000 or greater, where median home prices nearly doubled from the third quarter of 2025 to the third quarter of 2026. Those Opportunity Zones include: 1. Opportunity Zone # 47175925200 – Van Buren County, TN Q3 2025 Median Sales Price: $164,000.00 Q3 2026 Median Sales Price: $327,500.00 Year-over-Year Change: 99.7% 2. Opportunity Zone # 13043950300 – Candler County, GA Q3 2025 Median Sales Price: $184,163.00 Q3 2026 Median Sales Price: $367,324.00 Year-over-Year Change: 99.5% 3. Opportunity Zone # 06073001600 – San Diego County, CA Q3 2025 Median Sales Price: $442,500.00 Q3 2026 Median Sales Price: $882,500.00 Year-over-Year Change: 99.4% 4. Opportunity Zone # 34003023402 – Bergen County, NJ Q3 2025 Median Sales Price: $342,000.00 Q3 2026 Median Sales Price: $662,500.00 Year-over-Year Change: 93.7% 5. Opportunity Zone # 13277960700 – Tift County, GA Q3 2025 Median Sales Price: $132,821.00 Q3 2026 Median Sales Price: $256,900.00 Year-over-Year Change: 93.4% 6. Opportunity Zone # 30061964600 – Mineral County, MN Q3 2025 Median Sales Price: $262,143.00 Q3 2026 Median Sales Price: $499,500.00 Year-over-Year Change: 90.5% 7. Opportunity Zone # 45081960400 – Saluda County, SC Q3 2025 Median Sales Price: $122,922.00 Q3 2026 Median Sales Price: $233,768.00 Year-over-Year Change: 90.2% 8. Opportunity Zone # 18003000500 – Allen County, IN Q3 2025 Median Sales Price: $113,500.00 Q3 2026 Median Sales Price: $215,000.00 Year-over-Year Change: 89.4% 9. Opportunity Zone # 42101013800 – Philadelphia County, PA Q3 2025 Median Sales Price: $212,000.00 Q3 2026 Median Sales Price: $400,000.00 Year-over-Year Change: 88.7% 10. Opportunity Zone # 45023020300 – Chester County, SC Q3 2025 Median Sales Price: $124,219.00 Q3 2026 Median Sales Price: $232,882.00 Year-over-Year Change: 87.5% Conclusion ATTOM’s Q3 2026 Opportunity Zones Report shows that annual median home-price growth remained widespread across the designated zones, although gains were slightly more common outside them. Nearly half of the Opportunity Zone tracts analyzed posted year-over-year increases, more than one-quarter recorded double-digit growth, and the top 10 tracts highlighted here saw annual gains ranging from 87.5 percent to 99.7 percent. Want to learn more about Opportunity Zones in your market? Contact us to find out how! Access the Data Behind This Analysis Discover how businesses leverage ATTOM property data to uncover market trends, evaluate opportunities, and make more informed decisions. Complete the form below to connect with an ATTOM data expert. Tags related to this post median home prices median sales prices opportunity zones property data top ten Top Ten Opportunity Zones About The Author Megan Hunt Megan is a Marketing Manager with a proven track record of success in building relationships, creating compelling content, and achieving goals. With over 20 years of experience in various industries, she brings a breadth of knowledge and aptitude to the table. She developed a strong Midwestern foundation growing up in the Midwest and now thrives on the West coast in California. She is a passionate individual who enjoys surfing, skiing, hiking, yoga, Reiki, exploring the world, and spending time with her family. All posts by Megan Hunt","published_at":1793988690000,"date_precision":"timestamp","modified_at":0,"extraction":"semantic","canonical":"https://attomdata.com/news/market-trends/figuresfriday/top-10-opportunity-zones-where-median-home-prices-nearly-doubled-in-q3-2026","content_hash":"6f0737ef41eb221c8dda2a98089beb978a2b14d81c0d7df5252eeb56b3cdf170","access":"preview","source_family":"attom","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794173831876,"id":"8304d88890577563","acquisition_window":{"lower":1793912400000,"upper":1794171600000},"score":25,"tags":["housing","national","data","trend"],"heat_signals":["trend","trends","annual","year over year","year-over-year"],"evidence_status":"preview","keep":true,"importance":3,"section":"national","capital_focus":false,"geo_evidence":null,"duplicate_of":null,"selector_reason":"ATTOM对3,431个Opportunity Zone地块进行季度和年度房价比较，显示指定区域价格上涨并不普遍优于区外，具有独立统计价值。","title_zh":"机会区中位房价同比上涨并不普遍","summary_zh":"ATTOM 报告显示，第三季度有数据的机会区中，48.9% 的区域中位房价同比上涨；区外上涨比例为 51.6%，略高于机会区。","impact":"neutral","evidence_quote":"The analysis found that outside Opportunity Zones, typical home prices increased year over year in 51.6 percent (28,212) of the 54,704 census tracts with sufficient data.","evidence_basis":"body","cre_subcategory":null},{"source_id":"rebusiness-online","source_name":"REBusiness Online","source_tier":"A","source_weight":6,"source_tags":["mixed-asset","deals"],"region":"national","title":"Newmark Provides $53.9M Agency Acquisition Loan for Multifamily Property in Northlake, Texas","link":"https://rebusinessonline.com/newmark-provides-53-9m-agency-acquisition-loan-for-multifamily-property-in-northlake-texas/","description":"Newmark Provides $53.9M Agency Acquisition Loan for Multifamily Property in Northlake, Texas by Taylor Williams November 6, 2026 November 6, 2026 6 NORTHLAKE, TEXAS — Newmark has provided a $53.9 million Fannie Mae acquisition loan for Dry Creek Ranch, a 456-unit multifamily property in Northlake, located north of the metroplex in Denton County. Built on 29 acres between 2014 and 2017, Dry Creek Ranch features one-, two- and three-bedroom units and amenities such as multiple pools, a fitness center, clubhouse, business center, basketball court and a car wash station. Adam Randall, John Westby-Gibson and Drake Blodgett of Newmark originated the five-year, fixed-rate loan on behalf of the buyer, Denver-based Bow River Capital. Drew Kile, Taylor Hill, Joey Tumminello, Michael Ware and Shelby Vosburg of Institutional Property Advisors, a division of Marcus & Millichap, represented the seller, Western Securities, in the transaction and procured Bow River as the buyer. Facebook Twitter Linkedin Email previous post Cushman & Wakefield Brokers Sale of 754,822 SF Industrial Building in Hutchins, Texas next post ULI Emerging Trends Report: DFW Three-Peats as Top Market to Watch in 2027, Houston Holds Serve You may also like ULI Emerging Trends Report: DFW Three-Peats as Top... November 6, 2026 Cushman & Wakefield Brokers Sale of 754,822 SF... November 6, 2026 Marcus & Millichap Arranges Sale of 359-Unit Self-Storage... November 6, 2026 Affinius Capital Provides $226M Loan for Refinancing of... November 6, 2026 JLL Arranges $67.3M Loan for Refinancing of Metro... November 6, 2026 Cushman & Wakefield Arranges $115M Sale of Chicago... November 6, 2026 United Properties Acquires Two Retail Centers in Iowa,... November 6, 2026 Northmarq Brokers Sale of 56-Unit Apartment Complex in... November 6, 2026 A&C Properties Sells Grocery-Anchored Retail Portfolio in Arizona... November 6, 2026","published_at":1793980164000,"source_family":"rebusiness-online","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794173831876,"id":"5dd02842a9304a8b","acquisition_window":{"lower":1793912400000,"upper":1794171600000},"score":10,"tags":["multifamily","dfw","deals","lender"],"heat_signals":["texas","fannie mae"],"date_precision":"timestamp","modified_at":1793980169000,"extraction":"semantic","canonical":"https://rebusinessonline.com/newmark-provides-53-9m-agency-acquisition-loan-for-multifamily-property-in-northlake-texas","content_hash":"6181693bd14138472aa99670c391edb887a827f0e8bde6c75a93c67c888db6fb","access":"public","evidence_status":"article","keep":true,"importance":3,"section":"sunbelt","capital_focus":false,"geo_evidence":"Northlake, Texas","duplicate_of":null,"selector_reason":"Northlake 456套公寓获得5,390万美元Fannie Mae收购贷款，提供DFW多户资产融资和机构买家案例。","title_zh":"Newmark 为 Northlake 多户住宅提供 5,390 万美元贷款","summary_zh":"Newmark 为 Texas 州 Northlake 的 Dry Creek Ranch 提供 5,390 万美元 Fannie Mae 收购贷款，该项目包含 456 套多户住宅。","impact":"long-pos","evidence_quote":"Newmark has provided a $53.9 million Fannie Mae acquisition loan for Dry Creek Ranch, a 456-unit multifamily property in Northlake","evidence_basis":"body","cre_subcategory":null},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Mortgage rates fell and demand steadied as inventory dipped","link":"https://www.housingwire.com/articles/rates-fall-demand-stabilizes/","description":"Mortgage rates fell, demand stabilized and inventory had a noticeable decline last week. But are the changes in demand and inventory data about seasonality, or has the housing market changed with the recent mortgage rate decline? Let’s take a look at the weekend tracker and see what the data is telling us with rates falling the last three weeks. 10-year yield and mortgage rates In the 2026 HousingWire forecast , I anticipated the following ranges: Mortgage rates between 5.75% and 6.75% The 10-year yield fluctuating between 3.80% and 4.60% What a crazy time in the bond market recently: the key level of 5.35% has not only held since early October, but the reversal has been truly nice to watch. The midterm elections , which changed the control of the House and Senate, have added another variable into the mortgage rate equation. I discussed what Congress can do to help lower mortgage rates on this episode of the HousingWire Daily podcast with Editor in Chief Sarah Wheeler, but for now the head-and-shoulders pattern of the 10-year yield is still somewhat intact, though a fight for it to break lower is happening. I wouldn’t get too excited about mortgage rates until the 10-year yield can break under 4.70% and have follow-through bond buying, but mortgage rates have fallen and demand has stabilized over the last few weeks. Mortgage spreads Mortgage spreads have worsened recently, but they’re still trending near multiyear lows. Traditionally, when mortgage rates escalate with the 10-year yield and then make a big reversal — like we just had from a 5.35% 10-year yield top that dropped down toward 4.82% — spreads do get worse to try to compress mortgage rate volatility. That said, if mortgage spreads weren’t near multiyear lows right now, we'd have no chance of getting mortgage rates below 7.25%, and demand wouldn't have stabilized recently. Now that spreads have moved up from this year's lows, we can clearly see that mortgage rates would be sub-7% if spreads return to that level. Historically, mortgage spreads have ranged from 1.60% to 1.80%. Last week, spreads rose to 2.27% from 2.23% a week earlier. Let’s compare last week’s mortgage rates to where they would have been at the best spread levels this year and the worst levels of this cycle. If we had the best levels of spreads in 2026, mortgage rates would be 6.72% today, not 7.17% . If we had the worst mortgage spread levels of 2023, mortgage rates would be 8.11% today, not 7.17% . Weekly pending sales Our pending home sales data provides a week-to-week perspective, though holidays and short-term fluctuations can affect results. This weekly pending sales data typically takes 30-60 days to reflect in sales data. The key for the last three weeks: lower rates, even above 7%, have stabilized demand, as our weekly pending sales have shown. Now, this isn’t growth, just stabilization from a noticeable slowdown when mortgage rates got toward 7.60%. The last three years and 10 months show that housing demand grows when mortgage rates fall below 6.64% and head toward 6%; above 7%, we don’t have much growth data beyond seasonal demand. Last year at this time, mortgage rates were headed toward 6%, so the year-over-year comps will be hard for some time. Here are the pending sales for last week over the last two years: 2026: 51,764 2025: 59,164 Purchase applications Purchase application data, which looks out 30-90 days, has softened as mortgage rates rose above 6.64% and are now above 7%. We had a small decline week to week; I can see the stabilization here as well and the year-over-year comps will also be very difficult here, as last year at this time rates were heading toward 6%. Earlier in the year, when rates were lower, pretty much every week this year showed growth. Here are the stats on purchase apps so far in 2026: 16 positive week-to-week prints 24 negative week-to-week prints 5 flat week-to-week prints 10 weeks of double-digit year-over-year growth 25 weeks of positive year-over-year growth 15 negative year-over-year prints Housing inventory Housing inventory growth has been very tame this year, with some weeks being down year over year. However, when mortgage rates got above 6.64% and then headed toward 7.60%, we did see some growth pick up. Also, rates were lower last year so demand was heading toward a nine-month high in December, which means it the comps will be easier to show growth in inventory. Inventory growth is running at 7.18% even with easier comps. Weekly inventory change (Oct. 30-Nov. 6): Inventory fell from 914,833 to 902,740 Same week last year (Oct. 31-Nov 7): Inventory fell from 856,751 to 842,257 New listings New listings are in their typical seasonal decline; 2026 has been the healthiest new-listings year since 2022, with over 80,000 new listings per week a few times this year. The concern I had was that if higher rates cause sellers to stop listing their homes — as they did in the second half of 2022 — that would hurt supply and demand. However, that hasn’t happened in any meaningful way. Most home sellers are buyers, and now that rates have fallen a smidge, it looks like we can end the year on a positive note for 2026 for new listings. In a normal environment, new listings range from 80,000 to 100,000 per week during peak periods. For context, during the housing bubble years, new listings ranged from 250,000 to 400,000 per week for several years . Here is last week’s new listings data for the past two years: 2026: 54,479 2025: 55,486 Price-cut percentage Typically, about one-third of homes see price reductions before they sell, reflecting the housing market’s dynamic nature. Overall, price-cut percentages this year have been lower than last year. This held true until rates moved above 6.64% and then above 7%; demand fell, and the year-over-year price-cut percentage rose 1%. In my 2026 home-price forecast, I called for a national decline of -0.62% for the year. Home-price growth really isn’t going anywhere this year, and my -0.","published_at":1794095691000,"mutable":false,"date_precision":"timestamp","modified_at":1794098211000,"extraction":"semantic","canonical":"https://housingwire.com/articles/rates-fall-demand-stabilizes","content_hash":"6fa9ac36efc51e98cc288ca4369bb5bb9808066025b6555f71ca31c2ed661d06","access":"public","evidence_status":"article","id":"4e1429f43860da91","source_family":"housingwire","is_research":false,"required_source":false,"first_seen_at":1794173831876,"acquisition_window":{"lower":1793912400000,"upper":1794171600000},"score":35,"tags":["housing","national","rates","trend"],"heat_signals":["mortgage rate","pending home sales","forecast","trend","year over year","year-over-year","housing market","pending home sales"],"keep":true,"importance":3,"section":"national","capital_focus":false,"geo_evidence":null,"duplicate_of":null,"selector_reason":"跟踪按揭利率、需求和库存变化，并讨论中期选举后债券市场对住房融资的影响，具有市场观察价值。","title_zh":"按揭利率回落后住宅需求趋稳","summary_zh":"HousingWire 周末跟踪称，按揭利率连续三周回落，住宅需求趋稳，但 10 年期国债收益率能否持续跌破 4.70% 仍是观察重点。","impact":"neutral","evidence_quote":"mortgage rates have fallen and demand has stabilized over the last few weeks.","evidence_basis":"body","cre_subcategory":null},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"How a new Pulte Florida agrihood makes conservation a buyer desire","link":"https://www.housingwire.com/articles/how-a-new-pulte-florida-agrihood-makes-conservation-a-buyer-desire/","description":"For years, Central Florida’s exploding population growth and rapidly expanding suburban sprawl have clashed with local efforts to protect the region’s dwindling green space and undeveloped land. PulteGroup ’s new 1,200-acre community on Orlando's eastern edge aims to balance these seemingly contradictory interests. The community is called The Grow . Once undeveloped, rural land, the property is set to begin morphing into a roughly 2,200-home “agrihood” centered around a 9-acre working farm. In keeping with its conservation focus, the plan calls for reserving just over half of the site from development, including wetlands, conservation areas and shared green space. The Grow offers a potential case study in balancing growth and conservation, a tension deeply felt in Central Florida and many other high-growth Sun Belt markets. Between 2000 and 2025, the Orlando metro area’s population grew nearly 80%, from 1.64 million to 2.95 million. That growth reshaped once-rural communities on the region’s edges, replacing undeveloped land with new subdivisions, apartments and shopping centers. Many long-time Sunshine State residents now lament the loss of “Old Florida,” marked by a landscape of open land, working ranches and orange groves that are now developed. When Pulte, the sole homebuilder at The Grow, purchased the community’s lots in 2023, it set out to build a premier community that responded to these tensions. \"One of our biggest selling features is the openness of the community and how much greenery we left. Everywhere you look, you're surrounded by trees,” Patrick McNamara, a Sales Manager at Pulte, told HousingWire TBD . However, the true distinguisher between The Grow and other local communities will be its working farm, a rare amenity that carries the conservation theme beyond protecting land to putting it to use. For Pulte, which held a grand opening for the community in late September, the farm and the extensive conservation space give the builder a way to stand out to prospective homebuyers, a crucial edge considering the challenging sales environment homebuilders are facing. The Grow will feature a nine-acre working farm, along with two smaller, resident-only farms. (Photo courtesy of The Grow) \" data-large-file=\"https://www.housingwire.com/wp-content/uploads/2026/11/Untitled-Design-2026-11-06T145242.701.jpg?w=840\" height=\"576\" width=\"1024\" src=\"https://www.housingwire.com/wp-content/uploads/2026/11/Untitled-Design-2026-11-06T145242.701.jpg?w=840\" alt=\"Untitled Design - 2026-11-06T145242.701\" class=\"wp-image-610511\" srcset=\"https://www.housingwire.com/wp-content/uploads/2026/11/Untitled-Design-2026-11-06T145242.701.jpg 1200w, https://www.housingwire.com/wp-content/uploads/2026/11/Untitled-Design-2026-11-06T145242.701.jpg?resize=150,84 150w, https://www.housingwire.com/wp-content/uploads/2026/11/Untitled-Design-2026-11-06T145242.701.jpg?resize=300,169 300w, https://www.housingwire.com/wp-content/uploads/2026/11/Untitled-Design-2026-11-06T145242.701.jpg?resize=768,432 768w, https://www.housingwire.com/wp-content/uploads/2026/11/Untitled-Design-2026-11-06T145242.701.jpg?resize=1024,576 1024w\" sizes=\"(max-width: 1024px) 100vw, 1024px\" /> The Grow will feature a nine-acre working farm, along with two smaller, resident-only farms. (Photo courtesy of The Grow) How the agrihood will work in practice The working farm is central to the community’s agrihood concept – providing fresh, sustainably grown produce. Residents will support it by buying products, volunteering and joining educational activities. McNamara argued that the farm creates a direct connection between residents and their food. A professional third-party company will manage the farm, but residents and families will be allowed to volunteer and then buy the finished produce at a resident-only general store that will serve as an anchor for The Grow’s commercial and retail street. The development will include two other farms: a small demonstration farm, covering about an eighth of an acre, and a separate community farm where homeowners can practice what they learn. These smaller farms will serve as an educational, hands-on amenity for families, where residents can learn each stage of growing produce and then put what they learn into practice. An existing program, “Seed the Table,” will allow residents to plant crops, watch them grow and eat what they produced. The farmers will also work with the lifestyle director to hold chef-led cooking classes at the community’s gathering barn, and will host seasonal celebrations and festivals that bring homeowners together. Beyond conservation and sustainability, the farm is meant to build community, encourage learning and offer a unique lifestyle. PulteGroup conserved hundreds of acres at The Grow, which recently held its grand opening in Orlando. (Photos courtesy of The Grow) \" data-large-file=\"https://www.housingwire.com/wp-content/uploads/2026/11/Untitled-Design-2026-11-06T144719.693.jpg?w=840\" height=\"576\" width=\"1024\" src=\"https://www.housingwire.com/wp-content/uploads/2026/11/Untitled-Design-2026-11-06T144719.693.jpg?w=840\" alt=\"Untitled Design - 2026-11-06T144719.693\" class=\"wp-image-610510\" srcset=\"https://www.housingwire.com/wp-content/uploads/2026/11/Untitled-Design-2026-11-06T144719.693.jpg 1200w, https://www.housingwire.com/wp-content/uploads/2026/11/Untitled-Design-2026-11-06T144719.693.jpg?resize=150,84 150w, https://www.housingwire.com/wp-content/uploads/2026/11/Untitled-Design-2026-11-06T144719.693.jpg?resize=300,169 300w, https://www.housingwire.com/wp-content/uploads/2026/11/Untitled-Design-2026-11-06T144719.693.jpg?resize=768,432 768w, https://www.housingwire.com/wp-content/uploads/2026/11/Untitled-Design-2026-11-06T144719.693.jpg?resize=1024,576 1024w\" sizes=\"(max-width: 1024px) 100vw, 1024px\" /> PulteGroup conserved hundreds of acres at The Grow, which recently held its grand opening in Orlando. (Photos courtesy of The Grow) How the agrihood and conservation space offers a ","published_at":1793997811000,"source_family":"housingwire","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794173831876,"id":"b6dc848a8b6abf78","acquisition_window":{"lower":1793912400000,"upper":1794171600000},"score":10,"tags":["housing","florida","construction","deals"],"heat_signals":[],"date_precision":"timestamp","modified_at":1793997813000,"extraction":"semantic","canonical":"https://housingwire.com/articles/how-a-new-pulte-florida-agrihood-makes-conservation-a-buyer-desire","content_hash":"c06c4b7b5bc0da7740d028c2101a403354d7de166a5f81ac5ac8db841b534408","access":"public","evidence_status":"article","keep":true,"importance":3,"section":"sunbelt","capital_focus":false,"geo_evidence":"Orlando's eastern edge","duplicate_of":null,"selector_reason":"Pulte在Central Florida推进约2,200套住宅、保留超过一半土地用于保护和绿地，是大型住宅开发与土地保护结合的案例。","title_zh":"Pulte 在佛罗里达推进 2,200 户农庄社区","summary_zh":"PulteGroup 在 Orlando 东部规划约 2,200 户的 The Grow 社区，以 9 英亩农场为核心，并计划将略超过一半土地保留为湿地、保护区和公共绿地。","impact":"long-pos","evidence_quote":"The plan calls for reserving just over half of the site from development, including wetlands, conservation areas and shared green space.","evidence_basis":"body","cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Centennial Shopping Center Sells For $31M: The Denver Deal Sheet","link":"https://www.bisnow.com/news/denver/retail/centennial-shopping-center-sells-for-31m-the-denver-deal-sheet","description":"Courtesy of Continental Realty Corp. Quebec Village Shopping Center at 8223 S. Quebec St. in Centennial A 125K SF shopping center in Centennial sold to an out-of-state investment and management company on Thursday. Baltimore, Maryland-based Continental Realty Corp . purchased Quebec Village Shopping Center, at 8223 S. Quebec St., from Kensington Development Partners . CRC purchased the shopping center at a “significant discount to replacement cost,” CRC co-Chief Investment Officer Josh Dinstein said in a statement. Quebec Village Shopping Center was built in 1988. Its tenants include Chase Bank, Starbucks, Golf Haus, Subway, Great Clips and GNC. Amazon also leases 43K SF at the center for a planned Amazon Fresh grocery store that never opened . This is CRC’s second retail center purchase in the Denver metro. The company acquired the 266K SF Thornton Town Center for $25.5M in late 2025. CRC has acquired about $1B worth of real estate since early 2021, the company said in a statement. The company, founded in 1960, specializes in acquiring and managing retail and multifamily properties. CBRE represented Illinois-based Kensington Development Partners. PEOPLE Denver Urban Renewal Authority named a new executive director. Kenneth Ho will take over the role on Dec. 1. He has more than 25 years of experience in urban planning and real estate development and investment. Ho previously worked as chief operating officer at Fitzsimons Innovation Community. SALES Courtesy of Cushman & Wakefield Lamar Station Plaza is home to Casa Bonita. Chicago-based Core Acquisitions and Midloch Investment Partners purchased Lamar Station Plaza, a nearly 272K SF shopping center that's home to Casa Bonita, for about $30.3M. Cushman & Wakefield brokered the sale. Core Acquisitions and Midloch Investment Partners secured a loan for the property from Old National Bank. *** Avanti Residential bought an 88-unit apartment complex in Denver’s Cheesman Park neighborhood for $31M. Park Cheesman Apartments is an 11-story apartment tower at 1177 Race St. Avanti Residential, a Denver-based multifamily investment and management firm, financed the acquisition by assuming the property’s existing long-term loan from Nationwide Life Insurance Co. LEASES Chicago tax firm RSM US LLP⁠ signed a 62K SF lease at 1900 Lawrence St., a 30-story office tower that opened in 2024 . The company will consolidate its two offices in downtown Denver and the Denver Tech Center and move its more than 400 employees to 1900 Lawrence next year, the Denver Business Journal reports . *** An 8K SF food hall and small business incubator opened at 2500 W. 10th Ave. in Denver’s Sun Valley neighborhood. Eats on the Platte opened with five local concepts. The food hall is operated by the Denver Housing Authority and Kitchen Network. *** Courtesy of Tipsy Putt A rendering of Tipsy Putt in Denver Tipsy Putt is opening its first location outside of California later this year in downtown Denver. The 12,500 SF space at 1755 Blake St. will feature a nine-hole mini-golf course, a tabletop game that combines mini-golf and shuffleboard, a bar and chef-driven food. Tipsy Putt replaces bocce ball and mini-golf venue Lob, which closed in May . *** Retailer Woody Baxter opened a 436 SF store at Union Station. The brick-and-mortar shop sells brightly colored hoodies, T-shirts, hats and socks. CONSTRUCTION AND DEVELOPMENT Affordable senior housing development Iliff Terrace opened in Denver’s University Hills neighborhood. The four-story project, at 4750 E. Iliff Ave., includes 50 apartments for adults ages 62 and older who earn between 30% and 80% of the area median income. The project was developed by Denver-based MGL Partners, which specializes in affordable, senior, workforce and multifamily housing. *** Life Time will open its ninth Colorado location on Nov. 18 in Castle Pines. The approximately 103K SF fitness center at 7373 Canyon Forge Drive will feature indoor and outdoor pickleball courts, boutique-style fitness studios, personal training and more. FINANCING Development and property management company Urban Inc. secured a $24.5M loan to refinance The Heights by Marston Lake, a 220-unit apartment and townhome community in Lakewood. The 10-year Fannie Mae loan has an interest rate of 6.23%. Newmark helped Urban secure the loan. Continue reading this story with a free account Log in or register Related Topics: Continental Realty Corp. , Kensington Development Partners","published_at":1794002508000,"mutable":false,"date_precision":"timestamp","modified_at":1794002517000,"extraction":"semantic","canonical":"https://bisnow.com/news/denver/retail/centennial-shopping-center-sells-for-31m-the-denver-deal-sheet","content_hash":"7c988a0089efd1e53bc25787920dc4f2e88ff0cc9f830348921a160143932bae","access":"public","evidence_status":"article","id":"00245ae5c03251fb","source_family":"bisnow","is_research":false,"required_source":false,"first_seen_at":1794173831876,"acquisition_window":{"lower":1793912400000,"upper":1794171600000},"score":12,"tags":["retail","national","deals","fundraising"],"heat_signals":["fannie mae"],"keep":true,"importance":3,"section":"institutional","capital_focus":true,"geo_evidence":"Denver metro","duplicate_of":null,"selector_reason":"Continental Realty以相对重置成本显著折价收购12.5万平方英尺购物中心，提供零售资产定价和机构配置案例。","title_zh":"Denver Centennial 购物中心以 3,100 万美元出售","summary_zh":"Continental Realty Corp. 以 3,100 万美元收购 Centennial 的 Quebec Village Shopping Center，项目面积约 125,000 平方英尺，价格显著低于重置成本。","impact":"long-pos","evidence_quote":"CRC purchased the shopping center at a “significant discount to replacement cost,” CRC co-Chief Investment Officer Josh Dinstein said in a statement.","evidence_basis":"body","cre_subcategory":null},{"source_id":"cushman-research","source_name":"Cushman & Wakefield Research","source_tier":"B","source_weight":9,"source_tags":["mixed-asset","data","trend"],"region":"national","title":"MarketBeat Reno Multifamily Q3 2026","link":"https://cushmanwakefield.com/en/united-states/insights/us-marketbeats/reno-marketbeats/multifamily","description":"Share: Share on Facebook Share on Twitter Share on LinkedIn I recommend visiting cushmanwakefield.com to read:%0A%0A {0} %0A%0A {1} Insights Reno Multifamily MarketBeat MarketBeat Reno Multifamily Q3 2026 provides an overview of economic conditions, supply and demand, and pricing trends in the Reno multifamily market. Read the report for the full details. DOWNLOAD THE Q3 2026 REPORT Key Takeaways In third quarter 2026, the Reno area recorded 287,200 jobs, with unemployment declining 20 bps YOY to 4.0%. The Reno multifamily market continued to tighten in third quarter 2026, with overall vacancy declining 230 bps YOY and 10 bps QOQ to 5.5%, the lowest level since 2022. Improved occupancy was driven by continued tenant demand, as the market recorded 166 units of net absorption during the quarter and 898 units YTD, extending Reno's streak of positive net absorption to 17 consecutive quarters. Limited new supply further supported market fundamentals, with just 96 units completed during both the quarter and YTD, well below the 10-year average of 1,344 annual construction completions. Average monthly asking rents increased 5.9% YOY to $1,813 per unit, while effective rents rose 7.1% YOY to $1,776 per unit. Economy In third quarter 2026, the Reno area recorded 287,200 jobs, with unemployment declining 20 basis points (bps) year-over-year (YOY) to 4.0%. The region continued to exhibit steady growth, with households increasing 1.7% YOY to 239,300. Wage growth remained a key driver of labor force expansion, as median household income reached $95,300, up 3.9% YOY. Supply & Demand The Reno multifamily market continued to tighten in third quarter 2026, with overall vacancy declining 230 bps YOY and 10 bps quarter-over-quarter (QOQ) to 5.5%, the lowest level since 2022. Improved occupancy was driven by continued tenant demand, as the market recorded 166 units of net absorption during the quarter and 898 units year-to-date (YTD), extending Reno's streak of positive net absorption to 17 consecutive quarters. The University submarket led both quarterly and YTD net absorption with gains of 61 units and 222 units, respectively, while South Reno added 31 units during the quarter and 176 units YTD. In contrast, Carson City County was the only submarket to post negative net absorption in the third quarter, recording a loss of eight units. Limited new supply further supported market fundamentals, with just 96 units completed during both the quarter and YTD, well below the 10-year average of 1,344 annual construction completions. Construction activity remains modest with only 698 units underway, including Village at Cross Creek in Carson City County and Argent Flats in South Reno. Tight conditions in several submarkets continued to constrain available inventory, particularly in areas near major employment centers and newer housing stock. As demand continues to outpace construction completions and the development pipeline remains limited, the market is well positioned for continued occupancy gains through the remainder of 2026. Pricing Average monthly asking rents increased 5.9% YOY to $1,813 per unit, while effective rents rose 7.1% YOY to $1,776 per unit. Rent growth remained broad-based across the market, with South Reno and Sparks/Spanish Springs posting the highest effective annual rent growth at 9.3%, followed by West Reno at 7.2% and the University submarket at 7.1%. South Reno continued to command the region's highest effective rent at $2,045 per unit, reflecting strong demand for newer product and amenity-rich communities. As vacancy continues to decline and development activity remains limited, rental rates are expected to maintain positive momentum through 2027. Insights in your Inbox Subscribe to the latest local market research, insights a
