r — despite its status as a hub for telecommunications firms — has remained largely stagnant. The Denver market added just 6.5 megawatts of data center capacity in the first half of this year, according to CBRE . By comparison, Northern Virginia alone added more than 1,000 megawatts. For years, many in the data center sector have attributed Colorado’s surprisingly limited growth to the absence of a critical data center tax incentive available in most other states and widely considered a prerequisite for large-scale development. But with the prospect of the state implementing these tax breaks fading, attention is turning to other factors keeping data centers away — and whether policymakers will be able to address them. Speaking at Bisnow ’s DICE: Rockies event in Denver last month, leaders from the state’s data center and energy sector said an overwhelmed power grid and outdated regulations make Colorado a particularly difficult place for developers to quickly acquire large chunks of power. That makes the state a tough sell in an industry where “speed to power” is now the largest site selection criterion for hyperscalers. Without addressing the “multilayered” barriers developers face in Colorado, the market that is home to data center giants like Vantage , CoreSite and Flexential will continue to see development go elsewhere, said Capitol Solutions founder Sandra Hagen Solin. “We have a tremendous number of companies corporate-headquartered here in Colorado … none of whom are investing in Colorado because we aren&#039;t competitive on the economics,” Hagen Solin said at DICE: Rockies, held at The Westin Denver Downtown. Hagen Solin, along with a majority of other panelists, still points to the lack of a targeted sales-and-use tax exemption as the primary factor keeping data centers away from Colorado. Such incentives, which limit the tax liability on equipment housed in data centers, can be worth billions to the largest data center users and are now available in the
