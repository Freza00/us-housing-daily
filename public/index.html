s longstanding calls for lower rates, which would stimulate the economy and reduce government borrowing costs. However, members of the FOMC judged inflation to be a resurgent threat and responded with the rate hike. Mortgage rates have already surged to a three-year high of more than 7% in recent weeks amid a global bond sell-off, and minutes from the September meeting released on Wednesday suggest that the Fed's work isn't done. \"With regard to the outlook for monetary policy beyond the current meeting, most participants assessed that another increase in the target range for the federal funds rate would likely be appropriate by year end,\" the minutes state. Financial markets currently assess a 70% probability that the Fed will raise its benchmark rate by the end of the year, according to CME FedWatch . However, traders view a hike at the December meeting as more likely than a rate move at the meeting scheduled for later this month. The Fed uses higher interest rates to fight inflation and lower rates to stimulate the job market, in line with the central bank's dual mandate to maintain price stability and maximum employment. The Fed doesn't directly set mortgage rates, which instead move in response to investor expectations about future inflation and financial conditions. It appears increasingly likely that the Fed will hold interest rates steady at the next FOMC meeting on Oct. 27–28, after recent labor market data came in cooler than expected. As well, the October meeting falls just one week before the midterm elections, and the central bank has historically shied away from making dramatic moves close to elections unless it is responding to a clear crisis. \"We are much more likely to see a rate hike in December than in October,\" says Realtor.com® senior economist Jake Krimmel . \"Prediction markets have become more certain of an October hold in recent weeks, and the release of today's minutes seemed to have little impact on the odds of an October pause.\" Loading... Meanwhile, mortgage rates, which closely follow the yield on the 10-year Treasury, have surged in recent weeks amid a global bond sell-off that appears to be only partly related to Fed policy. The 10-year yield touched its highest level in 24 years on Wednesday morning, as investors expressed fears about widening government deficits and prolonged inflation. A successful Treasury auction on Wednesday afternoon steadied the market and sent yields slightly lower. For homebuyers, the bond market turmoil has been most apparent in mortgage rates, which surged to a three-year high of 7.28% last week, according to Freddie Mac . New weekly mortgage rate data due out on Thursday is expected to show rates continued to climb this week, driven by higher Treasury yields as well as a widening yield spread, or the gap between the 10-year yield and mortgage rates. However, Krimmel says he doesn't expect the Fed meeting minutes released on Wednesday to have a significant impact on mortgage rates. \"As for mortgage rates, I think a second hike for 2026 has probably already mostly been priced in. That is, I would not expect the release of today's minutes to cause any notable or immediate movement in the 10-year Treasury yield or mortgage rates, by extension.\" Get real estate news in your inbox Sign up now Keith Griffith i","published_at":1791397965000,"score":25,"tags":["national","rates","macro","regulator"],"heat_signals":["fed","fomc","rate hike","inflation","mortgage rate","freddie mac","outlook"],"importance":5,"selector_reason":"美联储会议纪要显示决策者认为年内可能还需加息，直接影响全国融资成本与住房需求。其政策影响覆盖住宅和商业地产，属于系统性利率信号。","section":"national","title_zh":"Fed 年内或再加息，30Y mortgage 超7%","summary_zh":"FOMC 认为年内再加息合适，市场定价概率达70%，mortgage rate 持续承压","impact":"short-neg","id":"4c32ef59","fetched_at":1791422556345},{"source_id":"realtor-news","source_name":"Realtor.com News","source_tier":"A","source_weight":6,"source_tags":["housing"],"region":"national","title":"13 Million High-Risk Homes Sit Outside FEMA Flood Zones as El Niño Looms","link":"https://www.realtor.com/news/trends/13-million-high-risk-homes-fema-flood-zones-el-nino/","description":"Nearly 13 million high-risk properties sit outside FEMA’s mapped flood zones, where just 2% carried federal flood insurance as of April.","published_at":1791386961000,"score":12,"tags":["national","housing","policy","regulator"],"heat_signals":["fed"],"importance":5,"selector_reason":"报道指出约1300万套高风险住宅位于FEMA洪水区划之外，揭示全国房产风险识别与保险覆盖缺口。其影响涉及住房资产风险定价和政策，是重要的全国性风险数据。","section":"national","title_zh":"13M 高风险住宅未纳入 FEMA 洪区","summary_zh":"近13M套高风险住宅处于 FEMA 洪区外，4月仅2%拥有联邦洪水保险，灾损敞口高","impact":"short-neg","id":"fa2e971f","fetched_at":1791422556345},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"HUD opens probe into Wells Fargo’s race-based mortgage programs","link":"https://www.housingwire.com/articles/hud-investigation-wells-fargo-race/","description":"The U.S. Department of Housing and Urban Development (HUD) has opened an investigation into Wells Fargo ’s mortgage programs that aim to boost Black homeownership rates , saying the initiatives may violate the Fair Housing Act. HUD is focused on Wells Fargo ’s 2017 and 2022 commitments to increase homeownership among Black borrowers and to advance racial equity in homeownership through a Special Purpose Credit Program ( SPCP ). “Even if Wells Fargo did not violate the law, its practice of dividing Americans based on race is immoral, unethical and un-American,” HUD Secretary Scott Turner said in a statement. “Wells Fargo and all of its employees that engaged in race-based decision-making should be ashamed of themselves.” A Wells Fargo spokesperson did not immediately reply to HousingWire &#8216;s request for comments. In February 2017, the bank committed to lend $60 billion to qualified African American consumers for home purchases by 2027. In 2022 , it announced new efforts, including $210 million to advance racial equity in homeownership and $150 million to lower mortgage rates and refinancing costs, following a Bloomberg investigation that found the bank approved fewer than half of Black applicants for a home refinancing in 2020. In a letter to Wells Fargo CEO Charles Scharf on Wednesday, Craig Trainor, HUD&#8217;s assistant secretary for fair housing and equal opportunity, said the department is investigating the bank’s “mortgage lending policies, practices, and programs” under Section 805 of the Fair Housing Act. The probe is being led by HUD’s Office of Special Investigations. “The Fair Housing Act forbids racial discrimination in housing. It does not say: discriminate, so long as the discrimination is called a ‘special purpose credit program’ and justified as advancing ‘racial equity in homeownership,’” Trainor said in a statement. HUD’s letter cites the bank’s 2023 diversity, equity and inclusion ( DEI ) report, which framed its efforts as closing gaps between Black, Hispanic and white homeownership rates, and its disclosure that it exceeded the $150 million Special Purpose Credit Program commitment. In his letter to Scharf, Trainor said Wells Fargo’s public statements and commitments “over an extended period” raise questions about whether the bank “continues to make loans and craft their terms according to the race of the applicant,” despite removing explicit DEI language from its website in 2025. Trainor cited public records, including archived DEI reports and coverage of Wells Fargo’s quiet rebranding of DEI as “inclusion and accessibility,” as a basis for HUD’s concern. HUD’s Office of Special Investigations will examine whether Wells Fargo “has violated or intends to violate” the Fair Housing Act’s ban on discrimination in residential real estate-related transactions because of race or national origin. Depending on the findings, the Office of Fair Housing and Equal Opportunity could file an administrative complaint or refer the matter to the Department of Justice for enforcement . HUD also directed Wells Fargo to preserve “all existing and future records and materials related to your mortgage lending policies, practices, and programs,” including emails, texts and other electronic messages sent from personal devices and accounts. Wells Fargo, once the largest depository mortgage lender in America, announced in early 2023 that it would exit the correspondent channel and shrink its servicing portfolio as part of a strategic pullback from the broader mortgage market. From January to June of this year, it was the 15th-largest mortgage lender in the country, with $15.3 billion in volume, up almost 30% year over year. Over the same period, it had a $603 billion owned servicing portfolio, the sixth-largest in the nation, according to Inside Mortgage Finance. Related More: Black Homeownership HUD Scott Turner Wells Fargo","published_at":1791405047000,"score":20,"tags":["national","housing","regulation","regulator"],"heat_signals":["mortgage rate","year over year"],"importance":4,"selector_reason":"HUD调查大型银行面向黑人购房者的贷款项目，可能影响公平住房执法和贷款产品设计。联邦监管行动具有行业影响，但目前仍是调查而非最终裁定。","section":"national","title_zh":"HUD 调查 Wells Fargo 种族贷款项目","summary_zh":"HUD 调查 Wells Fargo 的 SPCP 与相关承诺，或触发 Fair Housing Act 合规风险","impact":"neutral","id":"e8371e70","fetched_at":1791422556345},{"source_id":"realtor-research","source_name":"Realtor.com Research","source_tier":"B","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"Small Mortgages are Disappearing, but Congress is Trying to Save Them","link":"https://www.realtor.com/research/small-mortgages-2026/","description":"Affordability , Housing Finance Small Mortgages are Disappearing, but Congress is Trying to Save Them By Joel Berner Oct 07, 2026 Highlights New federal legislation aims to encourage mortgages under $100,000 by offering financial incentives to lenders, reforming processes calibrated to larger loans, and relaxing appraisal requirements. Small mortgages are becoming less common since the pandemic as home prices and the frictions of originating these loans have grown. Rural states see an outsized share of small mortgages currently, and small mortgages tend to make up a larger share of home sales in areas where home prices are lower. Small mortgages are more likely to be used on investment properties and tend to carry higher rates. The 21st Century ROAD to Housing Act , passed earlier this year, contains a variety of measures meant to enable homebuying and incentivize home construction . One of the law’s goals is to make it easier for homebuyers to obtain a small mortgage. Small mortgages, defined as those with principal balances of $100,000 or less, have historically been difficult for borrowers to get as lenders tend to view them as an unprofitable line of business due to the high fixed costs of originating a mortgage. This often leaves buyers of lower-priced homes without options for financing their purchase. The Act takes a multi-pronged approach to encouraging small mortgage origination. Under Section 105, HUD is authorized to run a four-year FHA pilot program designed to offset the fixed costs of small mortgage loans through direct payments to lenders, adjusted loan terms, grants to cover closing costs, and outreach and technical assistance to build lender participation. Sections 401 and 402 tap the CFPB to study how loan originator compensation structures as well as points and fees limits affect the availability of small-dollar mortgages. In order to be a “Qualified Mortgage” under CFPB rules and receive legal protections against ability-to-pay suits from borrowers as well as to be able to sell the loans to Fannie and Freddie, lenders must not charge more than $3,000 for a loan of $60,000-$100,000. They can still offer non-QM loans with higher points and fees, but these loans are often less attractive because of higher underwriting costs, more legal exposure, and a less robust secondary market. The idea is that these financial protections for borrowers are calibrated to larger loans and may be getting in the way of originating smaller ones. The Act also tackles appraisals, which are a disproportionate cost and delay for low-balance loans. Section 403 reforms FHA appraiser licensing and training standards, adds flexibility for trainee appraisers, and funds appraisal workforce development grants, while Section 704 requires lenders on federally backed mortgages to set up processes for borrowers to request value reconsiderations or second appraisals. Cutting through red tape and expanding credit access to more would-be homebuyers is the ultimate goal of this legislation. To better understand what and who could be empowered by these changes, this report looks at the small mortgages that currently do exist, analyzing how they are used and by whom. Small Mortgages Dwindling in Recent Years The share of mortgages that have a loan balance of $100,000 or less at origination is shrinking. The main explanation for this is that the number of low-priced homes on the market is shrinking, so there are simply fewer opportunities for buyers to take out small mortgages. The 21st Century ROAD to Housing Act includes provisions that address the other structural issues preventing small mortgage origination, such as fixed fee limits and appraisal requirements. In 2013 and 2014, loans under $100K made up over 12% of all home loans originated. In 2025 and so far through 2026, they make up less than 3% of all loans. The decline has been steady since 2013. How much of the retreat by small dollar mortgages is driven by the bureaucratic frictions that ","published_at":1791367239000,"score":14,"tags":["national","housing","policy","regulator"],"heat_signals":["fed"],"importance":4,"selector_reason":"拟议联邦立法为10万美元以下小额房贷提供激励并调整评估要求，针对住房融资中的结构性缺口。若推进，将影响贷款机构和低价位住房买家。","section":"national","title_zh":"国会拟拯救低于$100K的小额 mortgage","summary_zh":"新法拟用激励、简化 appraisal 推动小额 mortgage，改善低价房融资可得性", g with local opposition that is making projects harder to finance, the prospect of officials canceling existing approvals could be a sign of additional risks to come — particularly in a county that has long served as a canary in the coal mine for the industry&#039;s biggest challenges. Wikimedia Commons/Rsparks3 Loudoun County, Virginia, is the world’s largest data center hub, with more than 250 such facilities in operation and more than 120 in the development pipeline. Much of the world’s internet traffic passes through the county’s eastern edge, where a dense cluster known as Data Center Alley established the county as the industry&#039;s global capital. This status emerged in part because Loudoun was among the first areas to intentionally court data centers when the sector was still relatively niche, building a political and regulatory environment considered uniquely friendly to the industry’s needs. That landscape has shifted sharply. In March 2025, the county Board of Supervisors effectively ended by right zoning for new data centers, requiring even projects in industrial areas to undergo legislative review and receive a special exemption from the board. For many projects, the chances of being derailed by local opposition are far higher. Still, some projects already seeking approval were exempted from review under the old rules. Today, 15 projects totaling roughly 10.5M SF of data center development across 30 buildings are advancing without having to go through the new special exemption process. But last month, two Loudoun supervisors introduced legislation to revoke the exemption provision for legacy projects. If passed, the bill would effectively strip those 15 projects of their by right zoning approval. The measure stalled Tuesday after supervisors tabled the discussion without a vote amid little support beyond the bill’s sponsors. The board also tabled another measure introduced by the same lawmakers, framed as a compromise, that would have required an audit of the legacy projects. Board Vice Chair Mike Turner was among the measure’s opponents, despite voting against the initial legacy resolution in 2025. He said canceling it now amounted to pulling the rug out from under developers in bad faith. “I don&#039;t support changing grandfathering. To me, it&#039;s just unethical,” he said at Tuesday&#039;s meeting . “We set the rules. Businesses made decisions based on those rules. We live by the rules.” The 15 projects range from just over 100K SF to more than 4M SF and are spread across Loudoun County. The largest is Digital Realty ’s Digital Dulles Phase 3, a seven-building expansion near Dulles International Airport that would bring the existing campus to 7.8M SF. Other prominent projects include BlackChamber Group ’s Tech Park at Dulles and three proposed data centers adjacent to the Washington Commanders ’ practice facility. Proponents of ending the legacy protections say they are acting on behalf of residents who want to further rein in data center growth. While 15 projects may seem insignificant compared to the scale of development already built in the county, these projects would amount to a major development wave in almost any other U.S. community. Supervisors Juli E. Briskman and Laura A. TeKrony, who filed the rollback legislation, said in a joint statement that data centers are creating sprawl and unsightly infrastructure that have brought the county to “a breaking point.” “We owe it to the community,” TeKrony said Tuesday. “It will assure residents that we not only care about data center development but we also care about their health, safety, quality of life an","published_at":1791415988000,"score":14,"tags":["data-center","policy","regulator"],"heat_signals":[],"importance":3,"selector_reason":"劳登县暂缓撤销15个数据中心项目既有审批，反映数据中心建设面临的地方阻力。事件关系重要产业枢纽，但尚无政策结果。","section":"cre","title_zh":"Loudoun 暂缓撤销15个 data center 批文","summary_zh":"Loudoun 暂缓撤销15个项目批准，但监管阻力上升，Data Center Alley 融资风险仍存","impact":"short-neg","id":"5dc
