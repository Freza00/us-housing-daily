Zillow’s latest forecast predicts home sales for full-year 2026 will decline slightly, while home values will have risen only modestly in nominal terms (i.e., home values rising slower than the rate of inflation). Home values are projected to rise 0.4% this year, revised down from 0.7% last month, driven mainly by the run-up in inventory. Mortgage rates hit 7.3% in October and could stay above 7% through mid-2027, which will keep many buyers on the sidelines while listings pile up. Despite new listings slowing year over year, total active listings could be as much as 10% higher than last year by December. Because the labor market is marked by low hiring and low firing, widespread job loss has been avoided, and that has held up best where supply is still tight, in the Central and Northeast regions. The West, with more inventory growth, faces more downward pressure on prices despite the relatively low unemployment rate. Existing home sales are now projected to reach 3.71 million in 2026, down from last month’s estimate of 3.75 million. This means that despite the stronger months during higher-volume portions of the year, the acute slowdown in the lower-volume fourth quarter is putting enough downward pressure on existing home sales that 2026 will finish with slightly fewer home sales than 2025 (but still 2.2% more than 2024). Zillow’s forecast of existing home sales, as measured by NAR, is expected to fall 1.4% to 4.0 million. Zillow projects single-family rents will rise 2.9% in 2026, while multifamily rents are expected to grow 1.8%. The rent forecast was adjusted upward because elevated rates and affordability pressure are pushing more would-be buyers to keep renting. Rent growth is still below historical norms. The Bottom of the bottom? All markets are cyclical, and in time, this too shall pass. But this existing and forecasted acute decline in sales activity, from an already low baseline, does prompt the question: where is the bottom of the bottom? The answer depends in part on which metric we use to define the bottom, and so it is susceptible to shifting with timing, level of aggregation, and seasonal adjustment. For example, Zillow’s existing home sales metric is calculated by counting the complete actuals of sales transactions and comparing those totals to the prior year. This is different method from NAR’s existing sales process, which is based on regional samples and converted into a seasonally adjusted annual rate. Practically, this means the low point of the two methods can differ, and NAR’s could be affected by any drift in regional mix that isn’t picked up by the sampling. But for now, if we define the bottom of the bottom as the peak rate of decline in existing sales from a low baseline level, I think October and November of 2026 have a high likelihood of being the bottom of the post-COVID years. Even though timing the total level of low sales is sensitive to how the trend annualizes, it stands to reason that these months may also represent the lowest total sales volume of the post-COVID era, regardless of whether or not one measures using NAR’s sampled, seasonally adjusted annual rate or Zillow’s full count of transactions. Less volatility, lower inflation, a slowdown in debt issuance to hyperscalers, and the unwinding of some of the global conflicts could all contribute to lower treasuries, lower yield spreads, and higher home sales in the final third of the 2020s. Annual forecasts as of December 2026 Typical home value growth (ZHVI) +0.4% annually Existing home sales (Zillow sales count nowcast) 3.71M (-0.2% YoY) Existing home sales (NAR) 4M (-1.4% YoY) Typical single-family rent growth (ZORI) $2.2K (+2.9% YoY) Typical multifamily rent growth (ZORI) $1.7K (+1.8% YoY) Tags Existing Home Sales home values Explore the data Stay up to date on competitiveness of housing markets across the country. See the dashboard Related Articles 5 min read Number of High-Intent Home Shoppers Dropped to a New Low Last Quarter as S , so users can see who is actually buying in a given market. Here's what that data shows, according to Malloy : Data centers aren't everywhere builders are. They're active in only about 10% of the markets where homebuilders operate. But where they're active, they pay far more. On average, data centers are paying about 4x what builders pay for comparable land. For powered land, the gap widens to 10x, 15x, even 20x. Malloy pointed to Central Ohio, where he said the premium is 10x or more across the whole region. The bigger problem is seller expectations. \"The problem for us as builders is not, oh, I lost that one parcel,\" Malloy said. Landowners already had high asking prices, and when a data center moves into the area, they push prices even higher. Malloy called it \"an acute problem, not a broad one.\" Builders don't need to bid on the same parcel as a data center to feel it. If a data center is going up nearby, land costs more, and homes are harder to sell when buyers know there will be a \"24/7” noise down the street. Malloy said local governments are pushing back on data centers more and more. Acres' tracking counts more than 400 local data center moratoriums, and he said even that number is low. His bigger worry for builders is where that pushback goes next. Acres' data also shows moratoriums on residential development, multifamily housing, and subdivisions. Once a city council finds out it can stop one kind of development, Malloy said, it may be more willing to stop others. \"That is a thing that we are all going to face, I believe, more in the coming year than we have yet.\" On technology, Malloy said the most innovative builders are doing much more than chatting with ChatGPT. Some, like Lennar and Toll Brothers, have set up in-house development teams that build their own AI tools and connect them to their CRM and ERP systems. Put one person in charge of evaluating AI tools. There are a lot more vendors now. Put a formal AI governance policy in writing, and lders are."},{"id":"body-7","text":"They're active in only about 10% of the markets where homebuilders operate."},{"id":"body-8","text":"But where they're active, they pay far more."},{"id":"body-9","text":"On average, data centers are paying about 4x what builders pay for comparable land."},{"id":"body-10","text":"For powered land, the gap widens to 10x, 15x, even 20x."},{"id":"body-11","text":"Malloy pointed to Central Ohio, where he said the premium is 10x or more across the whole region."},{"id":"body-12","text":"The bigger problem is seller expectations."},{"id":"body-13","text":"\"The problem for us as builders is not, oh, I lost that one parcel"}],"keep":true,"importance":4,"section":"cre","capital_focus":false,"geo_evidence":null,"primary_event":"market_research_policy","event_evidence_id":"body-9","event_evidence":"On average, data centers are paying about 4x what builders pay for comparable land.","market_evidence_id":"body-3","market_role":"market_policy","market_scope":"us","market_evidence":"It closed about 150 deals across the country before turning its in-house tools into a land data platform.","duplicate_of":null,"selector_reason":"Acres.com数据显示，数据中心在约10%的建商活跃市场中竞地， comparable land平均支付约为建商4倍，通电土地溢价可达10至20倍，反映AI基础设施对住宅土地成本的结构性挤压。","title_zh":"Acres.com：在数据中心活跃的市场，其同类土地买价平均约为住宅开发商的 4 倍","summary_zh":"Acres.com 首席执行官称，数据中心仅在住宅开发商布局的约 10% 的市场活跃，但在这些市场购买同类土地的均价约为住宅开发商的 4 倍，并推高当地土地要价。","impact":"short-neg","evidence_quote":"At ResiDay 2026 in New York City on Friday, November 6, ResiClub spoke with Carter Malloy , CEO of Acres.com , to talk about a new competitor for land: AI data centers. Acres.com started as a land acquisition business. It closed about 150 deals across the country before turning its in-house tools into a land data platform.","evidence_basis":"body","cre_subcategory":"数据中心"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Florida Slashed Homestead Taxes. Commercial Real Estate Could Pay The Price","link":"https://www.bisnow.com/news/south-florida/economy/florida-amendment-3-property-taxes-commercial-real-estate-impact","description":"The Florida commercial real estate industry is holding its collective breath — and hitting pause on some deals — as cities and counties grapple with a new state law that will slash their budgets by millions. Unsplash/Zoshua Colah Miami City Hall at 3500 Pan American Drive Amendment 3, approved on Election Day by 62% of Florida voters, raises the state’s homestead exemption, which only applies to permanent residences, from $50K to $150K next year and $250K in 2028. Set to go into effect by Jan. 1, the law doesn't include tax levies for school district properties. While the new law was passed on the promise of affordability, its impact is prompting local authorities to weigh service reductions, spending freezes, increased fees, and tax rate adjustments that would ultimately leave the private sector to fill the gap. “Our biggest concern, and it applies across the board and all our expenses, is uncertainty,” said Rick Porras, chief financial officer of multifamily developer Neology. “We need to know what playing field we're going to be dealing with.” Gov. Ron DeSantis campaigned on slashing property taxes last year as a way to lower housing costs for homeowners in Florida, where the cost of living index is nearly 2% above the national benchmark, according to a third-quarter Missouri Economic Research and Information Center report . The affordability crisis is more acute in South Florida, where Miami’s cost of living has surpassed that of New York and where more than 50% of Miami-Dade County households are living paycheck to paycheck, the Miami Herald reported . Property taxes account for 43% of municipal general fund revenue, according to a Florida League of Cities study conducted by Wichita State University. Losing a large chunk of that poses a significant risk to local budgets, especially those with smaller commercial real estate tax bases and higher debt levels. Local governments are projected to lose nearly $5B of funding in the next fiscal year, CBS News reported . In response, cities all over the state are canceling Christmas parades , ending funding for transportation services and eyeing hiring freezes and spending cuts . “There are cities that do not have the commercial tax base that would help them offset some of the loss in revenue,” Porras said. “If the cities are heavily dependent on residential properties, they're going to suffer even more than others.” But even cities with a large commercial base are expecting to take a hit, especially to public services. Miami Mayor Eileen Higgins said at Bisnow’s Condoverse conference in April that the city was prepping a 25% budget cut , which would hit city services like local hospitals, police, fire, parks, public schools and water management. Her office didn't respond to a request for comment for this story. Billionaire developer and “ Condo King of Miami ” Jorge Pérez warned such moves could threaten Miami’s ability to attract and retain residents. Some municipalities are considering raising millage rates, or taxing a higher percentage of a property's value. Not only could a higher millage rate cut into the savings homeowners would get with Amendment 3, but commercial owners would face the same higher rate without an exemption to help offset it. Fort Lauderdale Mayor Dean Trantalis told Bisnow the week the amendment passed that he was “very real about raising” his city's millage rates and that he will lean on the community, which will make a decision on “whether they want to increase taxes or reduce services.” “[You] can’t have the same level of service you have come to expect over the years,” he said. “Cities are going to have to deal with it,” he added. “That was a bad choice, but now we have to live with that.” Palm Beach County Administrator Joe Abruzzo told 25 WPBG News in September there were three options for the county to help offset a hit to the budget: cut the budget, significantly affecting first responders and county departments; raise the millage rate; or a combination of both. Assuming there is no taxable value growth, South Florida counties would need to raise their millage rates more than 10% per county to collect the equivalent quantity of tax and keep budgets the same, according to a white paper written by Nick Mau, partner at property tax advisory firm FirstPoint Advisors LLC. A raise in millage rates would likely trickle down to commercial tenants, especially on leases where tenants pay property taxes separately from rent, said Melissa Tapanes Llahues, a land use and zoning attorney and CEO of Bercow Radell Fernandez Larkin and Tapanes. Unsplash/Martley U The Fort Lauderdale skyline While Florida bars municipalities from raising fees on services to generate revenue, a rising concern for the development community is that local governments expand their powers to require greater public improvements and the payment of impact fees, she said. The new law could affect what localities will want developers to build, she added. \"I think that government will be more open, welcoming, and incentivize commercial and industrial land uses versus more residential,\" Tapanes Llahues said. Localities could also shift ad valorem taxes, a challengeable tax based on the assessed value of a property, toward special assessment fees that are based on physical characteristics like square footage or unit count, Mau said. “What we're concerned with is those items being shifted over to the non-ad valorem, and then the property owner has really no way of contesting,” Mau said. DeSantis has tried to take away avenues for localities to raise taxes to compensate for the raised homestead exemption, including passing a law in June that requires a two-thirds vote from local officials to exceed the rollback rate — roughly the same revenue generated from existing properties as the previous year. The larger the proposed increase in the millage rate, the higher the approval threshold. The governor, who will be replaced by fellow Republican Byron Donalds next","published_at":1795650442000,"extraction":"semantic","date_precision":"timestamp","mutable":false,"modified_at":1795650460000,"canonical":"https://bisnow.com/news/south-florida/economy/florida-amendment-3-property-taxes-commercial-real-estate-impact","content_hash":"46494333f89335f99f72530c77cc52bad6eebc16de326d8de04fba22df52a4aa","access":"public","final_url":"https://www.bisnow.com/news/south-florida/economy/florida-amendment-3-property-taxes-commercial-real-estate-impact","evidence_status":"article","id":"4e563d3d54356209","mode":"active","source_family":"bisnow","is_research":false,"required_source":false,"first_seen_at":1795729038674,"acquisition_window":{"lower":1795640400000,"upper":1795726800000},"score":14,"tags":["mixed-asset","florida","policy","regulation","regulator"],"heat_signals":["rate cut"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Florida Slashed Homestead Taxes. Commercial Real Estate Could Pay The Price"},{"id":"body-1","text":"The Florida commercial real estate industry is holding its collective breath — and hitting pause on some deals — as cities and counties grapple with a new state law that will slash their budgets by millions."},{"id":"body-2","text":"Unsplash/Zoshua Colah Miami City Hall at 3500 Pan American Drive Amendment 3, approved on Election Day by 62% of Florida voters, raises the state’s homestead exemption, which only applies to permanent residences, from $50K to $150K next year and $250K in 2028."},{"id":"body-3","text":"Set to go into effect by Jan. 1, the law doesn't include tax levies for school district properties."},{"id":"body-4","text":"While the new law was passed on the promise of affordability, its impact is prompting local authorities to weigh service reductions, spending freezes, increased fees, and tax rate adjustments that would ultimately leave the private sector to fill the gap."},{"id":"body-5","text":"“Our biggest concern, and it applies across the board and all our expenses, is uncertainty,” said Rick Porras, chief financial officer of multifamily developer Neology."},{"id":"body-6","text":"“We ne"}],"keep":true,"importance":4,"section":"cre","capital_focus":false,"geo_evidence":"Florida voters","primary_event":"market_research_policy","event_evidence_id":"body-2","event_evidence":"Unsplash/Zoshua Colah Miami City Hall at 3500 Pan American Drive Amendment 3, approved on Election Day by 62% of Florida voters, raises the state’s homestead exemption, which only applies to permanent residences, from $50K to $150K next year and $250K in 2028.","market_evidence_id":"body-2","market_role":"market_policy","market_scope":"us","market_evidence":"Unsplash/Zoshua Colah Miami City Hall at 3500 Pan American Drive Amendment 3, approved on Election Day by 62% of Florida voters, raises the state’s homestead exemption, which only applies to permanent residences, from $50K to $150K next year and $250K in 2028.","duplicate_of":null,"selector_reason":"佛州选民通过的同类住宅税收豁免扩张将削减地方财政收入，地方政府可能转向削减服务、冻结支出、加费或调整税率，已影响商业地产交易决策。","title_zh":"佛州扩大自住房免税额，部分商业地产交易暂停","summary_zh":"佛州将把常住住宅房产税免税额从 5 万美元提高至明年的 15 万美元，2028 年再升至 25 万美元；修正案不涉及学区税项。地方政府正考虑提高收费或调整税率等措施，部分商业地产交易已暂停。","impact":"short-neg","evidence_quote":"The Florida commercial real estate industry is holding its collective breath — and hitting pause on some deals — as cities and counties grapple with a new state law that will slash their budgets by millions. Unsplash/Zoshua Colah Miami City Hall at 3500 Pan American Drive Amendment 3, approved on Election Day by 62% of Florida voters, raises the state’s homestead exemption, which only applies to permanent residences, from $50K to $150K next year and $250K in 2028.","evidence_basis":"body","cre_subcategory":"跨资产"},{"source_id":"realtor-news","source_name":"Realtor.com News","source_tier":"A","source_weight":6,"source_tags":["housing"],"region":"national","title":"Why the Northeast Could Lead a Factory-Built Housing Boom","link":"https://www.realtor.com/news/trends/why-the-northeast-could-lead-a-factory-built-housing-boom/","description":"Most Americans picture sun-drenched mobile home parks across the South and Southeast when they think of manufactured housing , but more manufactured housing may soon start popping up across the Northeast and West. A new economic research report from Realtor.com® senior economist Joel Berner takes an in-depth look at the manufactured housing guidelines in the 21st Century Road to Housing Act, which became law in June. Berner found that cities across the Northeast—including Hartford, CT , Allentown, PA , and Albany, NY —have ideal conditions for a manufactured housing boom: “affordable land, unaffordable traditional new construction, and a low share of single-family starter home inventory.” If you’re not quite sure about what “manufactured housing\" means, you’re not alone. For years, people seemingly used “mobile home” and “manufactured housing” interchangeably. But they’re not the same thing. For one, the “mobile home” classification was retired in 1980, though many still use it colloquially. That year, it was replaced by the term “manufactured home.” Broadly, manufactured homes are those built in a factory and then transported to a site. For years, federal Housing and Urban Development code required that all manufactured homes have a permanent steel towing frame underneath. New provisions in the Road to Housing Act, meant to spur more affordable housing, eliminated that requirement. The act further entitles these new chassis-free homes to the same financing, titling, insurance, taxes, transport, and installation as conventional homes. The hope is that creating this new category of manufactured home will help blunt one of the housing industry’s sharpest pain points: affordable starter homes. Loading... In Hartford, CT, starter homes make up just 17.9% of housing inventory, a sign that manufactured housing could have a significant impact on the market. Getty Images Since the COVID-19 pandemic, the number of affordable starter homes for sale has markedly decreased. Realtor.com research found roughly 300,000 fewer affordable “starter” listings on the market today than before the pandemic. The cost of those starter homes rose from $256,000 in 2019 to $344,000 in 2026. By comparison, the median price of a manufactured home in April 2026 was $134,800. To understand what metros might see the biggest impact from this new type of manufactured home, Realtor.com scored the 100 largest metro areas on three metrics: the percentage of single-family starter homes (defined as listings priced at or below 80% of the local median) in the area; the relative price-per-square-foot premiums for traditional new construction; and the availability of affordable vacant land. Loading... The price per square foot for new construction in Albany, NY, is 47% higher than for existing homes. Getty Images Six of the 10 opportunity metros were in the Northeast, including Hartford; Allentown; Albany; Rochester, NY ; Syracuse, NY ; and Worcester, MA . Other metros that made the list were Denver ; Colorado Springs, CO ; Albuquerque, NM ; and Spokane, WA . In Hartford, which ranked first, starter homes account for just 17.9% of single-family inventory, while site-built new construction costs 29.1% more per square foot than existing homes. In third-ranked Allentown, single-family starter homes made up 22.9% of housing in the area, but new-construction costs were 33.6% more than existing homes. In sixth-ranked Albany, starter homes comprised 31.6% of the single-family inventory, but the price per square foot for new construction is 47% higher than for existing homes. That’s nothing compared with seventh-ranked Rochester, where 33.7% of homes are starter but site-built new construction costs 97% more per square foot than existing homes. While the economics in these cities are compelling, another reason manufactured housing may become more popular in these metros is that frigid Northeastern winters limit conventional housing construction. Meanwhile, manufactured housing can be assembled year-round. Before Hartford, Albany, or any other metro can begin taking advantage of the Road to Housing Act’s new manufactured housing rules, municipal zoning laws will need to change, Berner found. According to Land Use Labs data cited in the report, only about 17% of zoned land nationwide explicitly permits manufactured housing communities, and many municipalities enforce minimum floor-size rules or design restrictions that block factory-built units. Julie Gerstein is a writer and editor based in Philadelphia. She previously worked at Business Insider as an executive editor covering news, entertainment, and digital culture, and was the company's founding Singapore bureau chief. She was also a senior editor at BuzzFeed, covering lifestyle, fashion, and beauty. She earned a B.A. in women's studies from the University of Pennsylvania and an M.A. in media and cultural studies from the University of Sussex.","published_at":1795687200000,"extraction":"semantic","date_precision":"timestamp","mode":"active","source_family":"realtor-com","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1795729038674,"id":"9bbcd4619238fab1","acquisition_window":{"lower":1795640400000,"upper":1795726800000},"score":10,"tags":["housing","national","policy","trend","brokerage"],"heat_signals":[],"modified_at":1795687200000,"canonical":"https://realtor.com/news/trends/why-the-northeast-could-lead-a-factory-built-housing-boom","content_hash":"750530cd98c1d789e347cfb5400eb67e42037700c3308c733ad52b1f5232ae78","access":"public","final_url":"https://www.realtor.com/news/trends/why-the-northeast-could-lead-a-factory-built-housing-boom/","evidence_status":"article","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Why the Northeast Could Lead a Factory-Built Housing Boom"},{"id":"body-1","text":"Most Americans picture sun-drenched mobile home parks across the South and Southeast when they think of manufactured housing , but more manufactured housing may soon start popping up across the Northeast and West."},{"id":"body-2","text":"A new economic research report from Realtor.com® senior economist Joel Berner takes an in-depth look at the manufactured housing guidelines in the 21st Century Road to Housing Act, which became law in June."},{"id":"body-3","text":"Berner found that cities across the Northeast—including Hartford, CT , Allentown, PA , and Albany, NY —have ideal conditions for a manufactured housing boom: “affordable land, unaffordable traditional new construction, and a low share of single-family starter home inventory.”"},{"id":"body-4","text":"If you’re not quite sure about what “manufactured housing\" means, you’re not alone."},{"id":"body-5","text":"For years, people seemingly used “mobile home” and “manufactured housing” interchangeably."},{"id":"body-6","text":"But they’re not the same thing."},{"id":"body-7","text":"For one, the “mobile home” classification was retired in 1980, though many still use it colloqu"}],"keep":true,"importance":4,"section":"national","capital_focus":false,"geo_evidence":null,"primary_event":"market_research_policy","event_evidence_id":"body-2","event_evidence":"A new economic research report from Realtor.com® senior economist Joel Berner takes an in-depth look at the manufactured housing guidelines in the 21st Century Road to Housing Act, which became law in June.","market_evidence_id":"body-1","market_role":"market_policy","market_scope":"us","market_evidence":"Most Americans picture sun-drenched mobile home parks across the South and Southeast when they think of manufactured housing , but more manufactured housing may soon start popping up across the Northeast and West.","duplicate_of":null,"selector_reason":"Realtor.com经济研究基于六月生效的住房法案，指出东北部多个城市具备制造住宅扩张条件，独立分析了低价土地、传统新建成本和入门级库存不足之间的关系。","title_zh":"研究称美国东北部部分城市具备发展工厂制造住宅的条件","summary_zh":"Realtor.com 经济学家认为，土地价格相对可负担、传统新建住宅昂贵且独栋入门级住宅在房源库存中占比较低，使美国东北部部分城市具备发展工厂制造住宅的条件。新法已取消这类住宅必须配备永久钢制拖运底架的要求。","impact":"neutral","evidence_quote":"Most Americans picture sun-drenched mobile home parks across the South and Southeast when they think of manufactured housing , but more manufactured housing may soon start popping up across the Northeast and West. A new economic research report from Realtor.com® senior economist Joel Berner takes an in-depth look at the manufactured housing guidelines in the 21st Century Road to Housing Act, which became law in June.","evidence_basis":"body","cre_subcategory":null},{"source_id":"rebusiness-online","source_name":"REBusiness Online","source_tier":"A","source_weight":6,"source_tags":["mixed-asset","deals"],"region":"national","title":"Omaha’s Industrial Market Rewards an Integrated Approach","link":"https://rebusinessonline.com/omahas-industrial-market-rewards-an-integrated-approach/","description":"Omaha’s Industrial Market Rewards an Integrated Approach by Kristin Harlow November 26, 2026 November 26, 2026 1 By Chris Trosper, Opus Omaha can look deceptively simple from a development perspective. Land appears plentiful, industrial vacancy remains tight and the metro continues to attract companies looking for modern space. But the amount of land that is actually ready for development is considerably smaller than a map might suggest. The role of infrastructure Omaha’s approach to infrastructure helps explain why. Sanitary and improvement districts, or SIDs, have helped extend roads, water, sewer and other infrastructure into developing areas for decades. They also help explain why land that is available is not necessarily ready for development. Chris Trosper, Opus Turning available land into a development-ready site can require significant time and capital, particularly when a SID and new infrastructure are involved. The process can take nine months to a year, and the commitment becomes even more substantial when a developer is contemplating a large tract that will be built out in phases over many years. Even experienced, well-capitalized developers have to be selective about when that investment makes sense. For those that move forward, that upfront investment is reflected in the value of the development-ready land. A development-ready parcel may carry a premium over nearby undeveloped property because the time, cost and uncertainty involved in preparing the site have already been addressed. The SID process therefore helps moderate the pace of development in Omaha. The metro has room to grow, but converting raw land into industrial inventory takes time, which can help keep new supply from getting too far ahead of demand. Current market conditions bring that dynamic into sharper focus. Industrial vacancy remained below 3 percent during the first half of 2026, leaving fewer options for users with requirements that cannot easily be accommodated in existing buildings. Yet tight vacancy does not mean every available site should become a speculative industrial project. Once a viable site is available, the more consequential question is what kind of development best responds to demand in that location. Different demand, solutions Two Opus projects underway in the same northwest Omaha industrial park illustrate how different the answer can be. Rainwood Industrial is a 272,000-square-foot speculative industrial building designed to accommodate a broad range of warehouse and distribution users. The other project is a 65,000-square-foot build-to-suit headquarters and operations facility for Viking Industrial Painting. They are advancing in the same submarket and responding to the same broader market conditions, but the design and development strategies are fundamentally different. For the speculative building, flexibility is central to managing the uncertainty inherent in developing without a committed tenant. The building can accommodate as many as six users, while its loading configuration can expand as tenant needs become known. Those decisions preserve optionality without attempting to anticipate every possible requirement. An integrated design-build approach allows that flexibility to be considered from the outset. Development, design, engineering and construction teams can weigh marketability alongside constructability, cost and schedule as the building takes shape. Instead of designing the building first and pricing it later, the team can continually test decisions against both the market and the economics of the project. The objective is not to create a building for every possible user. It is to make deliberate choices that preserve flexibility where it matters. A build-to-suit calls for a different application of the same integrated thinking. With a known user, the focus shifts from preserving optionality to determining how the real estate can best support the company’s operations and long-term objectives. The 65,000-square-foot headquarters project in the same industrial park provides a great example. The company needed a new home base to accommodate its national growth, but the facility also presented an opportunity to address recruitment and retention. In addition to operational and warehouse functions, nearly 20,000 square feet is dedicated to office and employee areas, including a fitness center, locker rooms and a lounge-style break space. In a build-to-suit setting, the value of design-build goes beyond customization. A user may know what they want from a facility without knowing how those priorities translate into square footage, cost or design. When development, design and construction expertise are engaged together, operational needs, workplace goals, budget and schedule can inform one another while decisions are still fluid. The process helps distinguish features that create meaningful value from those that may add cost without advancing the business objective. Start with the business need Integrated thinking can begin even earlier, before a company has determined what form its real estate solution should take. In a market with limited existing inventory, a user may assume that building new is the only alternative. Another may dismiss a build-to-suit because of the perceived time, capital or complexity involved. Neither conclusion should be reached before the options have been tested. Starting with the business requirement rather than a predetermined real estate solution allows an integrated team to evaluate existing buildings, speculative space and build-to-suit opportunities against the same operational, financial and schedule considerations. Early design and construction input can establish what is feasible without requiring a company to advance a full design or commit to a site before it understands the implications. Omaha’s infrastructure environment makes this kind of early evaluation especially useful. Site readiness cannot be taken for granted, and limited existing ","published_at":1795699800000,"extraction":"semantic","date_precision":"timestamp","mode":"active","source_family":"rebusiness-online","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1795729038674,"id":"719dda4718edea96","acquisition_window":{"lower":1795640400000,"upper":1795726800000},"score":13,"tags":["industrial","national","construction","trend","developer"],"heat_signals":["vacancy"],"modified_at":0,"canonical":"https://rebusinessonline.com/omahas-industrial-market-rewards-an-integrated-approach","content_hash":"196c26a9a72091935c2ab5b83f415072109b89d31f9da2f71e6225e16ca0d2f8","access":"public","final_url":"https://rebusinessonline.com/omahas-industrial-market-rewards-an-integrated-approach/","evidence_status":"article","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Omaha’s Industrial Market Rewards an Integrated Approach"},{"id":"body-1","text":"Omaha’s Industrial Market Rewards an Integrated Approach by Kristin Harlow November 26, 2026 November 26, 2026 1 By Chris Trosper, Opus Omaha can look deceptively simple from a development perspective."},{"id":"body-2","text":"Land appears plentiful, industrial vacancy remains tight and the metro continues to attract companies looking for modern space."},{"id":"body-3","text":"But the amount of land that is actually ready for development is considerably smaller than a map might suggest."},{"id":"body-4","text":"The role of infrastructure Omaha’s approach to infrastructure helps explain why."},{"id":"body-5","text":"Sanitary and improvement districts, or SIDs, have helped extend roads, water, sewer and other infrastructure into developing areas for decades."},{"id":"body-6","text":"They also help explain why land that is available is not necessarily ready for development."},{"id":"body-7","text":"Chris Trosper, Opus Turning available land into a development-ready site can require significant time and capital, particularly when a SID and new infrastructure are involved."},{"id":"body-8","text":"The process can take nine months to a year, and the commitment be"}],"keep":true,"importance":3,"section":"cre","capital_focus":false,"geo_evidence":"Omaha’s Industrial Market","primary_event":"property_development_leasing","event_evidence_id":"body-7","event_evidence":"Chris Trosper, Opus Turning available land into a development-ready site can require significant time and capital, particularly when a SID and new infrastructure are involved.","market_evidence_id":"body-1","market_role":"asset_location","market_scope":"us","market_evidence":"Omaha’s Industrial Market Rewards an Integrated Approach by Kristin Harlow November 26, 2026 November 26, 2026 1 By Chris Trosper, Opus Omaha can look deceptively simple from a development perspective.","duplicate_of":null,"selector_reason":"文章指出奥马哈工业开发中真正具备开发条件的土地远少于表面供应，基础设施和SID可能使项目准备耗时9个月至1年，具有工业开发成本与供给参考价值。","title_zh":"奥马哈工业空置率仍低，基础设施制约供地","summary_zh":"Opus 撰稿人指出，奥马哈工业物业空置率仍低，涉及新增基础设施的地块可能需 9 个月至 1 年才能具备开发条件，有助于避免新增供应过快超过需求。","impact":"neutral","evidence_quote":"Omaha’s Industrial Market Rewards an Integrated Approach by Kristin Harlow November 26, 2026 November 26, 2026 1 By Chris Trosper, Opus Omaha can look deceptively simple from a development perspective. Land appears plentiful, industrial vacancy remains tight and the metro continues to attract companies looking for modern space. But the amount of land that is actually ready for development is considerably smaller than a map might suggest.","evidence_basis":"body","cre_subcategory":"工业"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"New Northeast Philly Warehouse Sells For $32M: The Philadelphia Deal Sheet","link":"https://www.bisnow.com/news/philadelphia/deal-sheet/warehouse-sale-northeast-crow-spears","description":"A construction materials manufacturer has shelled out $32M for a newly built 103K SF warehouse it will use as a distribution center. Courtesy of Crow Holdings 2748 Grant Ave. Crow Holdings Development sold the 10-acre property across from the Northeast Philadelphia Airport to Spears Manufacturing, which produces plastic pipe fittings and valves. “The rapid sale of 2748 Grant Avenue following delivery, along with the significant interest it generated, underscores pent-up demand for modern, Class A warehouse space in a market where new construction remains limited,” CHD Director Johanna Chervak said in a statement. “For industrial owner-users, finding quality, ‘close-in’ properties available for purchase can be challenging.” The property features 32-foot clear heights, 32 loading dock doors and enough parking for 99 vehicles. A CBRE team including Paul Touhey, Sean Bleiler and James Bolt represented the buyer, while JLL's Jeff Lockard, Larry Maister and Mitch Russell represented the seller. SALES Brennan Investment Group purchased a 100K SF warehouse outside Bethlehem at 47 Commerce Way. The acquisition from the nonprofit Feed the Children came out to $11.5M, according to property records. *** Realterm bought a 7-acre final-mile warehouse and industrial outdoor storage fleet maintenance facility at 461 Harrisport Court in Middletown, south of Harrisburg. It includes a 33K SF warehouse and a 6K SF maintenance shop. Realterm declined to share a sale price. The property was sold to UGI Utilities for $775K in 2022, according to property records. Jennifer Stein of JDS Real Estate Services and an Axiom Capital Advisors team including Jose Sasson-Lerner and Roberto Susi helped facilitate the transaction. *** Courtesy of Post Road Management 303–309 N. 65th St. Post Road Management has acquired two West Philadelphia properties spanning 48 units for a combined $1.35M and plans to renovate both properties. The new additions to its portfolio are 303-309 N. 65th St. and 6522-6526 W. Girard Ave., both of which had been foreclosed on. CONSTRUCTION AND DEVELOPMENT J.G. Petrucci Co. and Mediplex Property Group are working to bring 100K SF of healthcare and retail space to a 15-acre site at 1300 Easton Road in Horsham. Work on the parcel across from the former Willow Grove Naval Air Station is scheduled to begin in the first quarter. *** Shadowbrook Development has received permission from municipal officials in Cinnaminson to build a 45K SF flex warehouse at 2203-2205 Wallace Blvd. The decision was rendered at a meeting Thursday night. PEOPLE Multifamily owner Arden Residential has added two new people to its roster. Brian Collins has joined as president, and Max Spencer has been tapped as managing director of acquisitions and development. THIS AND THAT The Philadelphia Housing Authority and the Philadelphia Building and Construction Trades Council are offering a reward of up to $30K for information leading to the arrest and conviction of the people who shot and injured a PHA employee at the Morton Homes in East Germantown on Saturday. “This was a senseless and cowardly act of violence against a dedicated public servant who comes to work every day to make our communities a better place to live,” PHA CEO Kelvin Jeremiah said in a statement. “An attack on any member of the PHA family is an attack on all of us, and on the residents we serve. We will not tolerate it.” Anyone with information is encouraged to call the Citizens Crime Commission at 215-546-6532 or the PHA Police Department at 215-684-1911. Anonymous tips may be given by calling 215-684-3350 or emailing Phacrimetips@pha.phila.gov . Continue reading this story with a free account Log in or register Related Topics: CBRE , Crow Holdings Development , James Bolt , Jeff Lockard , JLL , Johanna Chervak , Larry Maister , Mitch Russell , Paul Touhey , Sean Bleiler , Spears Manufacturing","published_at":1795648856000,"extraction":"semantic","date_precision":"timestamp","mutable":false,"modified_at":1795650006000,"canonical":"https://bisnow.com/news/philadelphia/deal-sheet/warehouse-sale-northeast-crow-spears","content_hash":"f5426ebd9195b45a03452ede55a1de86e0f87023fe8fb15cbfaa2ae4307e0912","access":"public","final_url":"https://www.bisnow.com/news/philadelphia/deal-sheet/warehouse-sale-northeast-crow-spears","evidence_status":"article","id":"85a3802a933d8e1b","mode":"active","source_family":"bisnow","is_research":false,"required_source":false,"first_seen_at":1795729038674,"acquisition_window":{"lower":1795640400000,"upper":1795726800000},"score":12,"tags":["industrial","national","deals","institutional"],"heat_signals":[],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"New Northeast Philly Warehouse Sells For $32M: The Philadelphia Deal Sheet"},{"id":"body-1","text":"A construction materials manufacturer has shelled out $32M for a newly built 103K SF warehouse it will use as a distribution center."},{"id":"body-2","text":"Cou
