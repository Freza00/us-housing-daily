eople trying to time the market, Waller said at a conference sponsored by the Bank of Italy on July 6. While forward guidance can speed up policy transmission, it can just as easily hinder the Fed's mission, he said. \"I continue to believe that forward guidance can be a valuable tool that has, at times, significantly strengthened policymaking and will continue to be useful,\" Waller said. \"But forward guidance is more art than science, and there have been times when it has hindered, rather than helped, policymaking.\" Because mortgage rates often move based on market predictions of future Fed interest rate moves, a more opaque Fed could introduce new uncertainty and volatility into mortgage markets. But homebuyers should already be wary of attempting to predict future rates or time the market, says Realtor.com® senior economist Jake Krimmel . \"For homebuyers, the risks from trying to time interest rate movements far outweigh the rewards,\" says Krimmel. \"Finding the right lender and best offer is a much better use of time for homebuyers than trying to time up the Fed's moves and predicting how they might ripple through financial markets.\" The 30-year fixed-rate mortgage now stands at 6.43%, according to Freddie Mac . That's up from 5.98% at the end of February. President Donald Trump campaigned on a vow to get mortgage rates down. He also installed Warsh as Fed chair. Warsh is also supportive of lowering rates , but the FOMC has, as a body, remained more conservative. Recent history lessons on guidance In his speech, Waller pointed to recent instances where the Fed signaled an intent to change interest rates in the future. In late 2021, the Fed signaled it might tighten policy in the coming months, causing an immediate market reaction. \"The two-year Treasury yield rose nearly 200 basis points,\" Waller said. \"That rise effectively shaved off about six months from the usual 12- to 24-month lag that one might conjecture would be needed to see the 200 basis points of actual tightening affect the economy.\" The other case he cited came from September 2020. At that point, the Fed said it would hold off on rate increases until conditions improved. But that guidance created uncertainty when inflation picked up. \"In the end, this restrictive guidance tied the hands of the FOMC in 2021 and unnecessarily delayed rate increases,\" Waller said. The Fed is currently facing an uncertain economy. In recent meetings, its members have been divided on how to act , given persistent inflation and concerns that fast-changing current events like the Iran conflict could change the economy. At its most recent meeting, the FOMC voted to leave the federal funds rate unchanged in the range of 3.50% to 3.75%, where it has remained since December. Loading... What does less guidance mean for homebuyers? Krimmel says that forward guidance from the Fed \"can be really useful when the Fed knows which way it wants to move and when it wants to influence economic conditions more quickly. \"But if the Fed's future path is more uncertain or if the economic landscape is shifting quickly, forward guidance might be ineffective or counterproductive,\" he adds. \"It can box the Fed in, reduce its influence over the market, or make it more difficult for the market and the Fed to read one another's signals.\" For ho","published_at":1783371946000,"score":24,"tags":["housing","national","rates","macro","regulator"],"heat_signals":["fed","fomc","inflation","mortgage rate","30-year fixed","freddie mac"],"importance":5,"selector_reason":"美联储官员释放减少利率前瞻指引的信号，直接影响购房者、抵押贷款利率预期和资本市场定价。虽然不是正式议息决定，但涉及Fed政策沟通框架，评为imp=5。","section":"national","title_zh":"Fed 拒给 rate 路线图，mortgage 波动或加大","summary_zh":"Waller 支持减少 forward guidance，买家更难押注降息，短期不确定性上升","impact":"short-neg","id":"4616a2a5","fetched_at":1783387030913},{"source_id":"national-mortgage-news","source_name":"National Mortgage News","source_tier":"A","source_weight":7,"source_tags":["rates","macro"],"region":"national","tit "source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"San Diego to get more transit housing density as SB 79 row settles","link":"https://www.housingwire.com/articles/san-diego-sb79-map-widens/","description":"San Diego has spent recent years earning a reputation as one of California&#8217;s most aggressive housing builders, streamlining permits citywide. But city leaders hesitated when state law required them to draw boundaries for new housing near neighborhood bus stops. San Diego officials proposed a far tighter map than regional and state regulators wanted. They limited eligible transit stops to just four locations. That narrower approach didn&#8217;t survive engagement with the San Diego Association of Governments, the region&#8217;s transit planning authority. SANDAG posted a draft map in June identifying 17 additional bus stops that qualify for high-density housing. The stops qualify under Senate Bill 79, the state&#8217;s new transit-oriented development law. The change could add tens of thousands of housing units to the city&#8217;s capacity. Those stops join 47 trolley stations that no one disputes are eligible under the law. SANDAG expects to finalize the map in the coming weeks. San Diego&#8217;s situation reflects a broader statewide struggle. Cities and counties across California are digesting the law, which took effect July 1. Some have embraced it, while others have sought ways around full implementation by phasing in density over years. In March, Gov. Gavin Newsom threatened to take legal action against noncompliant cities and counties. The warning came as the Los Angeles City Council voted to limit density. California wasn&#8217;t the trendsetter when it enacted this law, unlike its role in other housing reforms. It took three tries over eight years to pass. Massachusetts was the first to set the precedent in 2021, and state officials there a
