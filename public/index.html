 of the recent affordability gains for potential homebuyers. At HousingWire 's Mortgage Rates Center on Tuesday, rates for 30-year conforming loans averaged 7.58%, up 23 basis points from one week ago . Rates for 30-year jumbo loans jumped 31 bps to average 7.87%, while rates for 30-year loans through the Federal Housing Administration (FHA) rose 15 bps to 7.37%. HousingWire Lead Analyst Logan Mohtashami wrote over the weekend that \"last week wasn't good for mortgage rates or the bond market\" due to hawkish statements from Federal Reserve officials and hot inflation data from the U.S. Bureau of Labor Statistics (BLS). Additionally, the U.S. conflict with Iran and potential tariff increases against Mexico propelled long-term Treasury rates and mortgage rates upward. Interest rate traders took notice. According to the CME Group 's FedWatch tool , more than 93% expect benchmark rates to increase by 25 bps at next month's Fed meeting. That's up from 76% one month ago. It would be the second hike of the year by the Fed and put the federal funds rate at a range of 4% to 4.25%. Kyle Bass, business production manager at Refi.com , pointed to Mortgage Bankers Association application data showing that recent downward moves in rates had positive impacts on loan demand . But with visible volatility in rates on a day-to-day basis, he said, preparation between loan officers and borrowers is needed to lock in the lowest possible rate and get lower monthly payments. \"Borrowers who benefit are the ones who prepared before the number moved. A shadow application, with income documents, statements and credit in order, lets a homeowner ask what their current mortgage could do for them the day rates cooperate. Waiting for a better number only works if you are ready when it arrives,\" Bass said. Better affordability in new homes? A report released Tuesday by Realtor.com shows that the new-home segment is giving the typical buyer lower rates and better affordability than existing homes. Homebuilders, who are also under financial pressure, continue to offer rate buydowns and other incentives as they seek to offload their inventory. Realtor.com reported that the average mortgage rate for a new-home buyer in the third quarter was 5.01%, more than a full percentage point lower than the 6.15% rate for an existing-home buyer. That translates to a difference of $258 in monthly payments for someone buying a $400,000 home with a 10% down payment . \"Builders have adjusted to a market where affordability is still a major hurdle, but that adjustment isn't always visible in the listing price,\" Joel Berner, senior economist at Realtor.com, said in a statement. \"Reduced mortgage rates can help make a new home more affordable for buyers while allowing builders to hold asking prices relatively steady.\" The report noted that reduced rates are often temporary and only last for the first few years after origination. But even when comparing 30-year fixed rates, those who bought a new home in the third quarter saved, with average rates of 6.19% compared to 6.68% for existing home-buyers. On the same $400,000 purchase with 10% down, the new-home buyer saves about $117 per month in interest. \"Mortgage-rate incentives can make a meaningful difference in what a buyer pays each month, but it's important to understand how long the lower rate lasts,\" Berner said. \"A temporary buydown can provide relief early on, while a lower rate fixed for the life of the loan offers a different kind of savings.\" Selma Hepp , chief economist at Cotality , said in a statement that tariff-driven increases to building materials are putting pressure on the new-home segment. In turn, this winds up being felt by consumers through higher home purchase prices. Regardless of the type of home being purchased, rising insurance premiums and property taxes are also straining budgets. \"For housing, the key question is not simply whether mortgage rates decline, but whether they fall enough to meaningfully improve purchasing power and bring more buyers and sellers back to the market,\" Hepp said.\" Until then, I expect activity to remain relatively subdued, making the spring homebuying season an increasingly important test of whether the market can finally turn a corner.\" Persistent strength in the economy While housing market professionals continue to grapple with fewer home sales and lower mortgage origination volumes, the U.S. economy as a whole continues to show resilience to inflation, tariffs and geopolitical uncertainty. Melissa Cohn, regional vice president at William Raveis Mortgage , pointed to last week's Producer Price Index (PPI), which showed 6.5% inflation on an annualized basis in October. It was the largest year-over-year increase since November 2022. That came only days after the Consumer Price Index showed monthly inflation of 0.4%. “Unfortunately, the CPI number that we got earlier this week has set off bond yields, and bond yields were probably up almost 25 basis points from where they were at the end of the previous week,\" Cohn said Friday in a statement. \"It’s not just because of the CPI number, but because of expectations about the Fed, where members are saying, ‘Well, we’re definitely going to have to hike rates.’ We know that the market’s expecting it. “All of the benefit that we got in mortgage rates over the course of the past three weeks was basically just thrown out the window again, because mortgage rates are really tied to the rate of inflation. We’re back on the inflation wagon.” Federal Reserve Chair Kevin Warsh offered some forward-looking remarks on Monday during a jobs and productivity conference in San Francisco, saying that the central bank continues to look closely at the development of \"super intelligence\" and its impacts on the global and national economies. \"At the Fed, our role in all this is neither advocacy nor opposition. Our respo","published_at":1794938968000,"source_family":"housingwire","is_research":fa e firm announced in a press release. The units primarily serve households that depend on federal rental assistance. Affordable housing veteran Gregory Jones leads the new firm, bringing his two decades of experience in the sector to the CEO role, per the release. Perennial’s inaugural portfolio encompasses nearly 4,000 apartments across 10 states, 97% of which are supported through project-based Section 8 housing assistance contracts, according to the release. Newmark, on behalf of Infinity, served as financial advisor on the transaction. Backed by institutional capital, the Alpharetta, Georgia-headquartered firm expects to partner with Low-Income Housing Tax Credit developers and public housing agencies, per the release. LIHTC remains the largest source of funds for affordable rental housing construction. Perennial is targeting additional project-based Section 8 and other affordable housing communities as it seeks to “build a durable portfolio through disciplined acquisitions and hands-on asset management,” according to the release. The firm also plans to invest in capital improvements that extend the useful life of its properties and to maintain them “with the goal of meeting or exceeding federal inspection requirements.” Jones said he aims to grow the business to more than $1 billion in asset value over the next few years to build Perennial “into one of the largest and best-in-class owners of affordable housing.” “We hold ourselves to high operational standards and are committed to the residents and communities we serve,” Jones said in the release. “As we look ahead, we are excited to grow the platform through acquisitions that extend that commitment to more communities.” Previously, Jones served as CEO of Infinity Real Estate Management, where he led its affordable multifamily platform and oversaw underwriting, contract negotiation and capital structuring, per the release. Perennial’s leadership team has experience in acquisition, operations, finance, rehabilitation and disposition. Click here to sign up to receive multifamily and apartment news like this article in your inbox every weekday. Recommended Reading HUD launches ‘express lane’ for LIHTC multifamily construction loans By Julie Strupp • Nov. 3, 2026 How this firm turns market-rate housing affordable: Post CEO By Julie Strupp • Sept. 28, 2026 Navigating LIHTC projects ‘takes a village’: Walker & Dunlop expert By Danielle McLean • May 15, 2026 Add us on Google Share Copy link Email LinkedIn X/Twitter Facebook Print License Filed Under: Capital , Operations","published_at":1794946620000,"source_family":"multifamily-dive","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794951480753,"id":"30eeefe85d29cd8e","acquisition_window":{"lower":1794862800000,"upper":1794949200000},"score":15,"tags":["multifamily","national","deals","institutional"],"heat_signals":[],"date_precision":"day","published_date":"2026-11-17","modified_at":0,"extraction":"semantic","canonical":"https://multifamilydive.com/news/perennial-housing-launch-affordable-owner-operator/874932","content_hash":"5dadd90a3f1d6c8365e5bd282d7d620c9185ee9a33e80e847e8aff8c5a93960b","access":"preview","evidence_status":"preview","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Perennial Housing launches as affordable owner, operator"},{"id":"body-1","text":"Perennial Housing launches as affordable owner, operator CEO Gregory Jones intends to grow its inaugural 31-property, 4,000-unit portfolio in the Southeast and Midwest with more Section 8 and other affordable housing properties."},{"id":"body-2","text":"Published Nov. 17, 2026 Julie Strupp Senior Editor Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Christopher Furlong via Getty Images Listen to the article 2 min This audio is auto-generated."},{"id":"body-3","text":"Please let us know if you have feedback ."},{"id":"body-4","text":"Perennial Housing Group launched Friday enerated.","evidence_basis":"body","cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Austin Office Campus Lands $228M Refinancing Deal","link":"https://www.bisnow.com/news/austin-san-antonio/office/austin-office-campus-lands-228m-refinancing-deal","description":"Developer Jay Paul Co. has secured $227.5M in green financing to recapitalize an 881K SF office campus in Austin. The deal marks the largest commercial property assessed clean energy, or C-PACE , transaction in Texas to date, according to Nuveen Green Capital, which closed the financing for the property. Unsplash/micheile henderson The $227.5M refinanced a construction loan on Springdale Green, a Class-A office campus at 1011 Springdale Road, Nuveen announced in a press release . C-PACE allows commercial property owners to secure long-term, low-cost financing for sustainable projects. The fixed-rate loans are often used for properties looking to make upgrades in terms of energy efficiency, water conservation and renewable energy. \"The closing on Springdale Green reinforces the widespread adoption of C-PACE by institutional owners and developers,\" Cory Jubran, senior director of originations at Nuveen, said in an emailed statement. \"C-PACE’s flexibility and lower cost of capital compared to other forms of finance are helping drive large-scale development, including notable projects like this one in Austin, across Texas, and in other MSAs.\" C-PACE momentum has picked up over the past couple of years, with a record $3.7B deployed in 2025, a 53% year-over-year surge, according to nonprofit PACENation. Springdale Green is a LEED Gold and Fitwel-certified property. It comprises two six-story office buildings on a 30-acre site and features a fitness center, a covered parking garage and more than 31K SF of outdoor space. Austin's office market posted strong net absorption in the third quarter, reaching 124K SF in Class-A space and 253K SF total, according to a CBRE report . That total surpassed the 50K SF posted in the second quarter as tenants took substantially more space than they vacated. Average office asking rents trended \"gradually higher\" throughout the quarter, with Class-A office space averaging $58.54 per SF, a 2.5% year-over-year increase, according to the report. Continue reading this story with a free account Log in or register Related Topics: C-PACE , C-Pace Financing","published_at":1794872542000,"mutable":false,"date_precision":"timestamp","modified_at":1794872577000,"extraction":"semantic","canonical":"https://bisnow.com/news/austin-san-antonio/office/austin-office-campus-lands-228m-refinancing-deal","content_hash":"e9d29b2c4eb93bcadbbd16b704012d06ac38f943dac2dc5004188cd283816897","access":"public","evidence_status":"article","id":"d952c04fb10f9a6e","source_family":"bisnow","is_research":false,"required_source":false,"first_seen_at":1794884592843,"acquisition_window":{"lower":1794862800000,"upper":1794949200000},"score":24,"tags":["office","austin","deals","developer"],"heat_signals":["texas","austin","nuveen","trend","year-over-year"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Austin Office Campus Lands $228M Refinancing Deal"},{"id":"body-1","text":"Developer Jay Paul Co. has secured $227.5M in green financing to recapitalize an 881K SF office campus in Austin."},{"id":"body-2","text":"The deal marks the largest commercial property assessed clean energy, or C-PACE , transaction in Texas to date, according to Nuveen Green Capital, which closed the financing for the property."},{"id":"body-3","text":"Unsplash/micheile henderson The $227.5M refinanced a construction loan on Springdale Green, a Class-A office campus at 1011 Springdale Road, Nuveen announced in a press release ."},{"id":"body-4","text":"C-PACE allows commercial property owners to secure long-term, low-cost financing for sustainable projects."},{"id":"body-5","text":"The fixed-rate loans are often used for properties looking to make upgrades in terms of energy efficiency, water conservation and renewable energy."},{"id":"body-6","text":"\"The closing on Springdale Green reinforces the widespread adoption of C-PACE by institutional owners and developers,\" Cory Jubran, senior director of originations at Nuveen, said in an emailed statement."},{"id":"body-7","text":"\"C-PACE’s flexibility and lower cost of capital compare"}],"keep":true,"importance":4,"section":"cre","capital_focus":false,"geo_evidence":"Austin","primary_event":"property_transaction_financing","event_evidence_id":"body-1","event_evidence":"Developer Jay Paul Co. has secured $227.5M in green financing to recapitalize an 881K SF office campus in Austin.","market_evidence_id":"body-1","market_role":"asset_location","market_scope":"us","market_evidence":"Developer Jay Paul Co. has secured $227.5M in green financing to recapitalize an 881K SF office campus in Austin.","duplicate_of":null,"selector_reason":"Jay Paul Co.以2.275亿美元绿色融资为奥斯汀881,000平方英尺甲级办公园区再融资并进行资本重组；报道称这是德州迄今最大C-PACE交易。","title_zh":"奥斯汀写字楼园区获 2.275 亿美元再融资","summary_zh":"奥斯汀甲级写字楼园区 Springdale Green 获得 2.275 亿美元 C-PACE 绿色融资，置换原建设贷款。融资方 Nuveen 称，这是得州迄今规模最大的同类交易。","impact":"short-pos","evidence_quote":"Developer Jay Paul Co. has secured $227.5M in green financing to recapitalize an 881K SF office campus in Austin. The deal marks the largest commercial property assessed clean energy, or C-PACE , transaction in Texas to date, according to Nuveen Green Capital, which closed the financing for the property. Unsplash/micheile henderson The $227.5M refinanced a construction loan on Springdale Green, a Class-A office campus at 1011 Springdale Road, Nuveen announced in a press release .","evidence_basis":"body","cre_subcategory":"办公"},{"source_id":"zillow-research","source_name":"Zillow Research","source_tier":"B","source_weight":9,"source_tags":["housing","data","trend"],"region":"national","title":"A Better Credit Score Could Save Buyers $864 a Year on a Typical Mortgage","link":"https://www.zillow.com/research/credit-score-mortgage-rate-savings/","description":"A Better Credit Score Could Save Buyers $864 a Year on a Typical Mortgage New Zillow analysis finds that in October 2026, buyers in the highest credit band got a mortgage rate 36 basis points lower than buyers in the lowest band Written by Kara Ng on November 17, 2026 Key findings In October 2026, buyers with a credit score of 740 or higher were quoted a 7.23% rate on average on a 30-year fixed mortgage. Those with a credit score between 680 and 739 typically were quoted a 7.45% rate, while those with a score below 680 on average were quoted a rate of 7.59%, a 36-basis-point spread between the highest and lowest credit bands. With a 20% down payment, the total monthly payment on a typical U.S. home in October, worth $364,812, would have been $2,656 in the lowest credit score band and $2,584 in the highest. That’s an annual savings of $864 for those with the best credit scores. As of October 2026, a median-income household with a score of 740 or higher could afford a $317,572 home, versus $308,924 for a score below 680. That gap puts about 21,500 more active listings within reach nationwide. A higher credit score can be worth real money. A buyer with a strong credit score (740 or higher) can save more than $800 per year compared to a buyer with a low credit score (300-679) when buying the typical U.S. home. Those savings would have brought about 21,500 additional listings within budget nationwide for a median-income household in October. A better credit score changes the affordability math Home buyers with higher credit scores often receive a lower mortgage rate on their loan, which means a lower monthly payment. In October, the average mortgage rate offered to buyers with strong credit scores was 7.23%, while buyers with low credit scores were quoted a 7.59% rate, on average. For a typical U.S. home ($364,812) with a 20% down payment, that would mean a difference of $72 in each month’s mortgage payment, or $864 a year. Buyers with good scores of 680 to 739 sat in between, with a 7.45% rate, on average. That means they would pay $348 a year less than someone with a low credit score, but $516 a year more than someone with a strong credit score. These savings stretch a home buyer's budget, bringing more homes within reach. In October, a median-income household with a low credit score could afford a $308,924 home — meaning it would spend no more than 30% of its income on housing costs — given the average mortgage rate on offer. If that same median-income household had a strong credit score, it could afford a $317,572 home, an increase of about $8,650 in buying power. Where a better score is worth the most A better credit score brings the biggest potential savings in coastal markets, where home values are higher. Across the 50 largest metro areas, moving from a low credit score to a strong one saves anywhere from $45 a month in Pittsburgh to $304 in San Jose. A home buyer in San Jose could save $3,648 a year by moving from a low credit score to a strong one, followed by San Francisco ($2,688), Los Angeles ($2,256), San Diego ($2,208) and New York ($1,740). San Jose buyers would also enjoy the largest gain in buying power from improving their credit score at $18,778, ahead of Seattle ($14,896), San Francisco ($14,602), Raleigh ($13,688) and Washington, D.C. ($13,489). The smallest annual savings are in Pittsburgh ($540), Oklahoma City ($576), Memphis ($576) and Cleveland ($588). These are markets where mortgage payments are relatively inexpensive already, so there is less room for improvement with a lower rate. October's rate gap was the narrowest of 2026 The 36-basis-point spread in mortgage rates offered to buyers with strong and low credit scores in October was the narrowest of the year. Across the first 10 months of 2026, the rate difference between the lowest and highest credit bands ranged from 36 basis points in October to 58 basis points in April, with a median of 46 basis points. The monthly payment gap ranged from $72 in October to $110 in April, with a median of about $88, so the typical buyer in the lowest band paid roughly $1,050 a year more than a buyer in the highest band over that stretch. Improving their credit score is not the only way a buyer can secure a better rate. Buyers can also compare offers from multiple lenders , yet few actually do. Among buyers who contacted a lender, 62% contacted only one, according to Zillow's 2026 Consumer Housing Trends Report . Methodology Rates come from Zillow's Custom Quotes marketplace and reflect 30-year fixed conventional conforming purchase loans with 20% down or more. Credit bands are 300-679, 680-739 and 740+, and rates are quoted nationally. Quotes do not come from Zillow Home Loans. Data is as of October 2026. Affordability is calculated for a median-income household in a given region. Monthly payment is the total estimated payment for a typical home in a given region with 20% down, including estimates for taxes, insurance and maintenance. Affordability difference by credit score, October 2026 Metro area* Annual savings, strong credit score (740+) vs. low credit score (300-679) Buying power gain, strong credit score (740+) vs. low credit score (300-679) Share of affordable listings, low credit score (300-679) Share of affordable listings, strong credit score (740+) Additional listings in budget, strong credit score (740+) vs. low credit score (300-679) United States $864 $8,648 34.1% 35.7% 21,478 New York, NY $1,740 $9,478 13.5% 14.2% 358 Los Angeles, CA $2,256 $10,699 3.2% 3.5% 99 Chicago, IL $840 $8,720 45.6% 48.4% 688 Dallas, TX $852 $8,228 30.8% 32.7% 658 Houston, TX $720 $7,504 35.1% 36.9% 651 Washington, D.C. $1,356 $13,489 39.1% 41.4% 491 Philadelphia, PA $924 $9,202 45.9% 48.6% 503 Miami, FL $1,140 $7,063 26.7% 28.0% 605 Atlanta, GA $888 $8,958 33.3% 35.9% 860 Boston, MA $1,728 $12,974 14.4% 15.2% 105 Phoenix, AZ $1,044 $10,964 23.5% 26.4% 776 San Francisco, CA $2,688 $14,602 12.1% 13.8% 139 Riverside, CA $1,380 $9,495 10.","published_at":1794913200000,"mutable":false,"date_precision":"timestamp","modified_at":1794936059000,"extraction":"body_fallback","canonical":"https://zillow.com/research/credit-score-mortgage-rate-savings","content_hash":"0813ae760ae31a6ab7c1a49c64f459514823b1143ef428869e0f27f95024b079","access":"public","evidence_status":"article","id":"ac58b049fb4925dd","source_family":"zillow-research","is_research":true,"required_source":true,"first_seen_at":1794951480753,"acquisition_window":{"lower":1794862800000,"upper":1794949200000},"score":28,"tags":["housing","national","rates","data"],"heat_signals":["houston","dallas","mortgage rate","30-year fixed","trend","trends","annual"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"A Better Credit Score Could Save Buyers $864 a Year on a Typical Mortgage"},{"id":"body-1","text":"A Better Credit Score Could Save Buyers $864 a Year on a Typical Mortgage New Zillow analysis finds that in October 2026, buyers in the highest credit band got a mortgage rate 36 basis points lower than buyers in the lowest band Written by Kara Ng on November 17, 2026 Key findings In October 2026, buyers with a credit score of 740 or higher were quoted a 7.23% rate on average on a 30-year fixed mortgage."},{"id":"body-2","text":"Those with a credit score between 680 and 739 typically were quoted a 7.45% rate, while those with a score below 680 on average were quoted a rate of 7.59%, a 36-basis-point spread between the highest and lowest credit bands."},{"id":"body-3","text":"With a 20% down payment, the total monthly payment on a typical U.S. home in October, worth $364,812, would have been $2,656 in the lowest credit score band and $2,584 in the highest."},{"id":"body-4","text":"That’s an annual savings of $864 for those with the best credit scores."},{"id":"body-5","text":"As of October 2026, a median-income household with a score of 740 or higher could afford a $317,572 home, versus $308,924 for a score below 680."},{"id":"body-6","text":"That gap puts about 21,500 more active listings within reach nationwide."},{"id":"body-7","text":"A higher credit score can be worth real money."},{"id":"body-8","text":"A buyer with a strong credit score (740 or hi"}],"keep":true,"importance":4,"section":"national","capital_focus":false,"geo_evidence":null,"primary_event":"market_research_policy","event_evidence_id":"body-2","event_evidence":"Those with a credit score between 680 and 739 typically were quoted a 7.45% rate, while those with a score below 680 on average were quoted a rate of 7.59%, a 36-basis-point spread between the highest and lowest credit bands.","market_evidence_id":"body-3","market_role":"market_policy","market_scope":"us","market_evidence":"With a 20% down payment, the total monthly payment on a typical U.S. home in October, worth $364,812, would have been $2,656 in the lowest credit score band and $2,584 in the highest.","duplicate_of":null,"selector_reason":"Zillow分析显示，2026年10月最高与最低信用分组的30年期房贷报价相差36个基点；典型购房者年度月供差额为864美元，最高分组可负担的房源多约21,500套。","title_zh":"Zillow：高信用评分买家每年可少付 864 美元","summary_zh":"Zillow 测算，2026 年 10 月购买美国典型住宅并首付 20% 时，信用评分 740 分及以上的买家，相比低于 680 分的买家，每年可少付 864 美元。","impact":"neutral","evidence_quote":"A Better Credit Score Could Save Buyers $864 a Year on a Typical Mortgage New Zillow analysis finds that in October 2026, buyers in the highest credit band got a mortgage rate 36 basis points lower than buyers in the lowest band Written by Kara Ng on November 17, 2026 Key findings In October 2026, buyers with a credit score of 740 or higher were quoted a 7.23% rate on average on a 30-year fixed mortgage.","evidence_basis":"body","cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"HSBC Sells $300M Of Data Center Debt Tied To Stargate Project At Big Discount","link":"https://www.bisnow.com/news/national/data-center-capital-markets/hsbc-sells-300m-of-data-center-debt-at-steep-discount","description":"Financial giant HSBC has sold $300M in data center construction debt at less than 90 cents on the dollar, the latest sign of lender wariness of the growing risks facing large-scale data center development. Wikimedia Commons/Barry Caruth The debt is part of an $18B financing package assembled by 20 banks for Project Jupiter, a massive data center development in Doña Ana County, New Mexico, Bloomberg reports . The construction financing closed last year after being marketed to lenders under the code name Project Miner amid a boom in debt financing for hyperscalers ’ artificial intelligence campuses. But Project Jupiter has since run into problems. The 1,400-acre campus is being developed by Blue Owl-backed Stack Infrastructure for OpenAI , Oracle and SoftBank 's Stargate initiative and could eventually reach 2.45 gigawatts. The project has faced concerns about potential delays due to community opposition and regulatory hurdles involving air and pipeline permits. In September, Oracle sent the developers a force majeure notice that would allow it to defer payments if the project is delayed or derailed. HSBC reportedly unloaded the $300M chunk of its debt tied to the project immediately after the force majeure notice, according to Bloomberg. HSBC isn't the only lender that has tried to reduce its exposure to Project Jupiter. Dutch bank ING is also reportedly seeking buyers for $25M of debt backing the development, along with nearly a dozen other data center loans. The debt sales are just the latest sign of growing volatility across data center credit markets. Lenders are showing concerns about escalating risks surrounding data center development — from community opposition and restrictive regulations to uncertainty about the future of AI cloud providers and alarm at the pace of hyperscale infrastructure spending. Jensen Huang ’s sudden resignation from Nvidia has only added to the unease surrounding the sector. Lender anxiety has been most apparent in the structured debt markets. In recent weeks, yields on some bonds tied to data center projects have climbed into the double digits, while even debt issued by major hyperscalers has traded at higher spreads than the investment-grade standard. At the same time, credit default swaps on data center debt have hit an all-time high. Analysts also say the lenders are concerned about concentration risk . The scale of capital required for the AI data center boom is unprecedented, and there is only so much capital that any lender is comfortable having tied up in just a handful of companies all pursuing broadly similar strategies. Continue reading this story with a free account Log in or register Related Topics: HSBC , Oracle , Project Jupiter , Stack Infrastructure , Stargate","published_at":1794947729000,"mutable":false,"date_precision":"timestamp","modified_at":1794947748000,"extraction":"semantic","canonical":"https://bisnow.com/news/national/data-center-capital-markets/hsbc-sells-300m-of-data-center-debt-at-steep-discount","content_hash":"90f63512c946db10ed7113d91aa7f0ff9fcf3b25c646ed65c36da1446adf050a","access":"public","evidence_status":"article","id":"4c80ccc9cfb00233","source_family":"bisnow","is_research":false,"required_source":false,"first_seen_at":1794951480753,"acquisition_window":{"lower":1794862800000,"upper":1794949200000},"score":16,"tags":["data-center","national","deals","distress","lender"],"heat_signals":["permits"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"HSBC Sells $300M Of Data Center Debt Tied To Stargate Project At Big Discount"},{"id":"body-1","text":"Financial giant HSBC has sold $300M in data center construction debt at less than 90 cents on the dollar, the latest sign of lender wariness of the growing risks facing large-scale data center development."},{"id":"body-2","text":"Wikimedia Commons/Barry Caruth The debt is part of an $18B financing package assembled by 20 banks for Project Jupiter, a massive data center development in Doña Ana County, New Mexico, Bloomberg reports ."},{"id":"body-3","text":"The construction financing closed last year after being marketed to lenders under the code name Project Miner amid a boom in debt financing for hyperscalers ’ artificial intelligence campuses."},{"id":"body-4","text":"But Project Jupiter has since run into problems."},{"id":"body-5","text":"The 1,400-acre campus is being developed by Blue Owl-backed Stack Infrastructure for OpenAI , Oracle and SoftBank 's Stargate initiative and could eventually reach 2.45 gigawatts."},{"id":"body-6","text":"The project has faced concerns about potential delays due to community opposition and regulatory hurdles involving air and pipeline permits."},{"id":"body-7","text":"In September, Oracle sent"}],"keep":true,"importance":4,"section":"cre","capital_focus":false,"geo_evidence":"New Mexico","primary_event":"property_transaction_financing","event_evidence_id":"body-1","event_evidence":"Financial giant HSBC has sold $300M in data center construction debt at less than 90 cents on the dollar, the latest sign of lender wariness of the growing risks facing large-scale data center development.","market_evidence_id":"body-2","market_role":"asset_location","market_scope":"us","market_evidence":"Wikimedia Commons/Barry Caruth The debt is part of an $18B financing package assembled by 20 banks for Project Jupiter, a massive data center development in Doña Ana County, New Mexico, Bloomberg reports .","duplicate_of":null,"selector_reason":"汇丰以低于面值九折出售3亿美元数据中心建设债务；该债务属于新墨西哥州Project Jupiter的180亿美元银团融资，折价反映项目风险与贷款方谨慎。","title_zh":"汇丰折价出售 Jupiter 数据中心 3 亿美元建设债务","summary_zh":"据彭博社报道，汇丰以每美元面值不足 90 美分的价格出售 Jupiter 项目 3 亿美元建设债务。若项目延期或无法推进，甲骨文可依据已发出的不可抗力通知推迟付款。","impact":"short-neg","evidence_quote":"Financial giant HSBC has sold $300M in data center construction debt at less than 90 cents on the dollar, the latest sign of lender wariness of the growing risks facing large-scale data center development. Wikimedia Commons/Barry Caruth The debt is part of an $18B financing package assembled by 20 banks for Project Jupiter, a massive data center development in Doña Ana County, New Mexico, Bloomberg reports .","evidence_basis":"body","cre_subcategory":"数据中心"},{"source_id":"cotality-research","source_name":"Cotality / CoreLogic Research","source_tier":"B","source_weight":9,"source_tags":["housing","data","trend"],"region":"national","title":"A conflict of interest","link":"https://cotality.com/insights/articles/a-conflict-of-interest","description":"Non-QM loans are part of the equation helping investors expand their footprint in the property market. Financing edge: Five-year, interest-only loans can maximize rental margins over short hold periods. Market shift: As institutional investment retreats, mom-and-pop buyers stepped in, acquiring 20% more homes than they sold. Buyer fallout: Heavy investor demand keeps prices and rents high, contributing to locking gig and freelance workers out of ownership. Millions of Americans now embrace freelancing, small-business ownership, or gig-economy careers, but the industry hasn’t widely adopted lending structures that correspond to this shift. Add to that dynamic the increasingly unaffordable price tag for homes, and many would-be homeowners are stuck as renters. Many are renting from similarly minded entrepreneurs: mom-and-pop investors. The difference is that investors are turning to non-QM mortgages to finance property transactions, according to Cotatlity data. Many are doing so to take advantage of interest-only payments. The five-year flip The U.S. housing market offers an ideal proposition to small investors. Rents have increased 25% in the last five years, the federal government has curbed institutional investment, and home equity continues to rise. Investors are responding by reasserting their presence in markets across the U.S. Cotality data shows that the share of investors making home purchases has climbed since mid-2022 and now represents about a third of all transactions. Small investors represent about half of that transaction volume. Investment transactions occur frequently, making them an ideal candidate for interest-only loans. Nearly half of investor hold onto a property for five years or less — that precise timeframe makes an interest-only mortgage worth the equity tradeoff. Most interest-only loans have an initial period of five years before principal repayment begins where monthly commitments are reduced to create wider profit margins on rents. While investors who finance this way won’t reap the benefits of accrued equity, they can profit from the persistently high home prices and a tight inventory that makes short-term commitments profitable. How long does each investor type hold property Data source: Cotality, 2026 The U.S. is short 4.7 million homes . The ones that are available are in high demand. Add in mortgage rates near 7%, and affordability is being tested at its limits. Home prices reflect that squeeze. That dynamic has allowed investors in states like California, where they buy over a third of all homes, to profit on investments financed by interest-only loans. Investors nearly doubled the number of purchases they made in Los Angeles between Q1 and Q2 2026. Home prices jumped 2% during that period. This localized surge in investment is colliding directly with broader national price pressures—a dynamic we analyzed in our piece, Bend It Like Buyers. In major metros, that friction has created a stalemate between buyers and sellers, leaving the door open to more financially flexible investors. Many blame Wall Street. Institutional investors ban themselves Injecting corporate-backed demand into a market where local buyers are already stretched, extends even the most flexible buyers past their breaking point. Local residents who are priced out of home purchases find themselves competing with incoming industrial contractors for the exact same rental inventory. The resulting rent escalation drives up investor yields in the short term, but it simultaneously compresses local household purchasing power and accelerates affordability risk. That has a direct influence on local markets. In states like California, Texas, and Georgia, where investors buy over a third of all homes, prices have risen disproportionately. In Texas, home prices jumped 38% as investor share climbed to 31% between 2020 and 2023. In Georgia, prices jumped 54% alongside an investor share increase to 29%. But the passage of the 21 st Century ROAD to Housing Bill disrupted that playbook. Even before the passage of the bill, Cotality data shows that institutional investment contracted from around 250 home purchases a week to 100. Mom-and-pop investors filled the gap. Small-time landlords entered a market where equity was on the rise, which allowed them to build a cash cushion to insulate them from current high-interest rates and create wider profit margins that allow them to redeploy capital elsewhere. When that equity cushion is layered atop monthly rental income profit, these landlords can offset systemic hurdles such as interest rates and rising home insurance costs. Much of that extra capital is going into increasing their market share. Small mom-and-pop investors purchased 20% more homes than they offloaded last year, according to Cotality data. Their persistent presence is reshaping the housing market. Main street moves in Across the country, investors are the ones with the financial wherewithal to purchase homes in the current high-cost, high-rate environment. This is contributing to keeping costs — from home prices to rents — elevated and widening the gap for aspiring homeowners. Some renters will be blocked from homeowership by these costs. Others will bend and stretch to make the homeownership math work. Some will look to non-QM mortgages themselves. Forward-looking lenders who are optimizing for long-term growth will cater to both sides. There is now a path forward. It may be unconventional, but it is a door through which an increasing number of investors and homeowners are stepping to make the dream of homeownership a reality. Webinar Non-QM mortgages are remixing the mortgage market Property market economics Mortgage banking & financial technology","published_at":1794934800000,"date_precision":"day","published_date":"2026-11-17","modified_at":0,"extraction":"semantic","canonical":"https://cotality.com/insights/articles/a-conflict-of-interest","content_hash":"f6e0c16171ab4c85a5055130b3cf6e7e0b4863cdfba321e29e7efd671d20ed65","access":"public","source_family":"cotality","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794951480753,"id":"f09a973c93412b14","acquisition_window":{"lower":1794862800000,"upper":1794949200000},"score":23,"tags":["housing","national","deals","trend","landlord"],"heat_signals":["texas","fed","mortgage rate","housing market"],"evidence_status":"article","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"A conflict of interest"},{"id":"body-1","text":"Non-QM loans are part of the equation helping investors expand their footprint in the property market."},{"id":"body-2","text":"Financing edge: Five-year, interest-only loans can maximize rental margins over short hold periods."},{"id":"body-3","text":"Market shift: As institutional investment retreats, mom-and-pop buyers stepped in, acquiring 20% more homes than they sold."},{"id":"body-4","text":"Buyer fallout: Heavy investor demand keeps prices and rents high, contributing to locking gig and freelance workers out of ownership."},{"id":"body-5","text":"Millions of Americans now embrace freelancing, small-business ownership, or gig-economy careers, but the industry hasn’t widely adopted lending structures that correspond to this shift."},{"id":"body-6","text":"Add to that dynamic the increasingly unaffordable price tag for homes, and many would-be homeowners are stuck as renters."},{"id":"body-7","text":"Many are renting from similarly minded entrepreneurs: mom-and-pop investors."},{"id":"body-8","text":"The difference is that investors are turning to non-QM mortgages to finance property transactions, according to Cotatlity data."},{"id":"body-9","text":"Many are doing so to take advantage of interest-only payments."},{"id":"body-10","text":"The five-year flip The U.S. housing market offers an ideal proposition to small investors."},{"id":"body-11","text":"Rents have increased 25% in the last five years, the federal government"}],"keep":true,"importance":4,"section":"national","capital_focus":false,"geo_evidence":null,"primary_event":"market_research_policy","event_evidence_id":"body-3","event_evidence":"Market shift: As institutional investment retreats, mom-and-pop buyers stepped in, acquiring 20% more homes than they sold.","market_evidence_id":"body-10","market_role":"market_policy","market_scope":"us","market_evidence":"The five-year flip The U.S. housing market offers an ideal proposition to small investors.","duplicate_of":null,"selector_reason":"CoreLogic研究指出，机构投资收缩时小型投资者买入量较卖出量多20%，并利用非QM及五年只付息贷款融资；报道讨论其对住房竞争与租户转业主机会的影响。","title_zh":"Cotality：小型投资者借非合格按揭扩大布局","summary_zh":"Cotality 指出，机构投资回撤之际，小型投资者借助非合格按揭扩大住宅投资，5 年期仅付息贷款可改善短期持有的租赁利润；该机构认为，投资需求使房价和租金维持高位。","impact":"neutral","evidence_quote":"Non-QM loans are part of the equation helping investors expand their footprint in the property market. Financing edge: Five-year, interest-only loans can maximize rental margins over short hold periods. Market shift: As institutional investment retreats, mom-and-pop buyers stepped in, acquiring 20% more homes than they sold.","evidence_basis":"body","cre_subcategory":null},{"source_id":"colliers-research","source_name":"Colliers Research","source_tier":"B","source_weight":9,"source_tags":["mixed-asset","data","trend"],"region":"national","title":"Multifamily Rebalancing Advances","link":"https://colliers.com/en/research/nrep-uscm-usmf-colliers-capital-markets-multifamily-report-q3-2026","description":"Multifamily Rebalancing Advances Nov 17, 2026 | 4 min read U.S. Multifamily Capital Markets | Q3 2026 Multifamily fundamentals continued to rebalance as occupancy edged higher, rent recovery broadened, and the construction pipeline contracted, creating a firmer foundation heading into 2027. Download the full report Experts David Amsterdam President, Capital Markets | U.S. David Goodhue Executive Managing Director | Boston & Head of Multifamily Capital Markets | U.S Rachael Rothman Director, National Capital Markets Research View All [5] Experts Share Article Top Highlights Occupancy continued to improve, edging higher to 95.7% despite more subdued leasing activity in the third quarter. Demand moderated from the exceptional second-quarter pace, with absorption trailing new deliveries but remaining well above year-ago levels. The development pipeline continued to contract, improving the longer-term supply outlook while near-term pressure remains concentrated in select markets. Rent recovery broadened across markets, with 40 of the Top 60 markets posting positive annual rent growth. Capital markets remain selective, as underlying transaction activity and pricing continue to reflect price discovery rather than a broad recovery in liquidity. Key Statistics Multifamily fundamentals remain resilient as the market continues to work through recent supply additions and the development pipeline moderates. Occupancy Remains Resilient National occupancy remained healthy in Q3 2026 as markets continued to absorb recently delivered units. While conditions vary across geographies, supply-constrained markets continue to demonstrate particularly strong operating fundamentals, while higher-supply markets remain more competitive. Source: Colliers Research, RealPage, MSCI Real Capital Analytics Rent Recovery Broadens Rent performance improved across a broader share of markets during the third quarter, signaling a more widespread recovery in pricing conditions. Performance remains uneven, however, with supply levels and local demand continuing to drive meaningful differences between markets. Supply Risk Remains Concentrated The national development pipeline continued to contract during the third quarter as financing challenges, elevated construction costs, and capital constraints limited new development. While the pullback should ease supply pressure nationally over time, several markets still face elevated construction pipelines that will continue to influence near-term performance. Capital Markets Navigate a Selective Recovery Investment activity continues to reflect a market in transition. Multifamily transaction volume reached $114.1 billion in Q3 2026, but the increase primarily reflected an entity-level merger rather than a broad recovery in liquidity. Excluding entity-level transactions, volume declined 7% to $44.5 billion, while apartment pricing remained under pressure. Investors continue to prioritize durable cash flow, realistic acquisition pricing, and manageable refinancing exposure as the market works through continued price discovery. Source: Colliers Research, MSCI Real Capital Analytics Sector Spotlight: Seniors Housing Seniors housing is benefiting from a combination of powerful demographic demand, improving operating performance, and constrained new supply. Growth in the older U.S. population is expanding the long-term demand base for independent living, assisted living, and nursing care, while limited development is supporting occupancy and rent fundamentals. Capital markets activity is also strengthening as investors respond to improving fundamentals and the sector's long-term demographic outlook. The report examines operating trends, regional performance, transaction activity, and the investment landscape across seniors housing and care. Looking Ahead Multifamily enters the final months of 2026 with healthy occupancy, a shrinking development pipeline, and a broader rent recovery, creating a more constructive operating backdrop. At the same time, capital markets remain selective, and refinancing pressure continues to create challenges and opportunities across the sector. Heading into 2027, the pace of new supply, local demand trends, and financing conditions will remain critical to determining where operating performance and investment opportunities strengthen most. U.S. Market Overviews The report features key statistics across the Top 60 U.S. multifamily markets, along with detailed spotlights on 15 select markets: Baltimore, Cincinnati, Denver, Greensboro, Indianapolis, Las Vegas, Memphis, Nassau County, Northern/Central New Jersey, Orange County, Pittsburgh, Richmond, San Diego, St. Louis, and Washington, D.C. Explore local trends in occupancy, rent growth, demand, supply, development activity, and investment performance across each market. Download Report Share Experts David Amsterdam President, Capital Markets | U.S. New York David Goodhue Executive Managing Director | Boston & Head of Multifamily Capital Markets | U.S Boston Rachael Rothman Director, National Capital Markets Research Charlottesville Steig Seaward Senior Director, National Research Los Angeles - El Segundo Haley Boatright Research Manager Miami Related insights Oct 21, 2026 Fundamentals Take the Lead as Capital Stays Selective Read More Sep 15, 2026 The Luxury Divide Shapes U.S. Hotel Brand Performance Read More Sep 3, 2026 Global Capital Flows | H1 2026 Read More","published_at":1794941400000,"date_precision":"timestamp","modified_at":0,"extraction":"semantic","canonical":"https://colliers.com/en/research/nrep-uscm-usmf-colliers-capital-markets-multifamily-report-q3-2026","content_hash":"2616db00155a6aa8e99cc1366b52f47f18cc16577c739dcf1afef3fbdfe5008 evidence":null,"primary_event":"market_research_policy","event_evidence_id":"body-2","event_evidence":"Multifamily Capital Markets | Q3 2026 Multifamily fundamentals continued to rebalance as occupancy edged higher, rent recovery broadened, and the construction pipeline contracted, creating a firmer foundation heading into 2027.","market_evidence_id":"body-1","market_role":"market_policy","market_scope":"us","market_evidence":"Multifamily Rebalancing Advances Nov 17, 2026 | 4 min read U.S.","duplicate_of":null,"selector_reason":"Colliers全国第三季度多户研究显示入住率升至95.7%、前60个市场中40个租金同比增长，开发管线继续收缩；需求较第二季度放缓且资本市场仍具选择性。","title_zh":"高力国际：美国多户住宅入住率升至 95.7%","summary_zh":"高力国际称，2026 年第 3 季度美国多户住宅入住率升至 95.7%，净吸纳低于新增交付，开发管线继续收缩；60 个主要市场中有 40 个租金同比上涨。","impact":"long-pos","evidence_quote":"Multifamily Rebalancing Advances Nov 17, 2026 | 4 min read U.S. Multifamily Capital Markets | Q3 2026 Multifamily fundamentals continued to rebalance as occupancy edged higher, rent recovery broadened, and the construction pipeline contracted, creating a firmer foundation heading into 2027. Download the full report Experts David Amsterdam President, Capital Markets | U.S.","evidence_basis":"body","cre_subcategory":"多户"},{"source_id":"nahb-eyeonhousing","source_name":"NAHB Eye on Housing","source_tier":"B","source_weight":8,"source_tags":["data","trend","policy"],"region":"national","title":"Builder Sentiment Continues to Fall on Affordability Concerns","link":"https://eyeonhousing.org/2026/11/builder-sentiment-continues-to-fall-on-affordability-concerns/","description":"Builder Sentiment Continues to Fall on Affordability Concerns November 17, 2026 Robert Dietz No Comments Builder confidence has dropped to a 14-year low, dragged down by high mortgage rates, ongoing inflation pressure, elevated energy and material costs, rising labor shortages and hesitant buyers. Builder confidence in the market for newly built single-family homes fell four points to 25 in November, according to the National Association of Home Builders (NAHB)/Wells Fargo Housing Market Index (HMI). The reading was the lowest since April 2012. The housing market faces a range of supply-side challenges, including building material costs pushed higher by tariffs, an ongoing shortage of construction workers and excessive regulations that undermine housing affordability. Stepped up immigration enforcement is affecting labor availability in some markets. Higher fuel prices are prompting subcontractors to raise their rates. Mortgage rates above 7%, softer consumer confidence and an uncertain economic outlook are holding buyers back. Consequently, single-family home builders are pulling back on construction volumes. In November, 46% of builders reduced prices, the highest share in the post-Covid period, according to the latest HMI survey. The average price reduction held at 6% for an eighth straight month. Meanwhile, 68% of builders offered sales incentives, also a post-Covid high, marking the 20th consecutive month in which at least 60% of builders used them. Derived from a monthly survey that NAHB has been conducting for more than 40 years, the NAHB/Wells Fargo HMI gauges builder perceptions of current single-family home sales and sales expectations for the next six months as “good,” “fair” or “poor.” The survey also asks builders to rate traffic of prospective buyers as “high to very high,” “average” or “low to very low.” Scores for each component are then used to calculate a seasonally adjusted index where any number over 50 indicates that more builders view conditions as good than poor. All three of the major HMI indices posted losses in November. The index measuring current sales conditions fell six points to 28, the index gauging future sales expectations dropped two points to 30 and the index charting prospective buyer traffic fell two points to 16 – its lowest level in 15 years, excluding the start of the pandemic in 2020. Looking at the three-month moving averages for regional HMI scores, the Northeast dropped four points to 34, the Midwest fell five points to 35, the South fell three points to 27 and the West posted a three-point decline to 23. The HMI tables can be found at nahb.org/hmi . HMI , Housing Market Index (HMI) Prev Previous Single-Family Permitting Weakens While Multifamily Activity Remains Stronger Next Custom Home Building Share Rises in 2025 Next Leave a Reply Cancel reply Your email address will not be published. Required fields are marked * Comment * Name * Email * Website Yes, add me to your mailing list Share this Page Subscribe to Blog Subscribe Search by Category Video Updates View Please leave this field empty Subscribe to Blog via Email Email Frequency * Instant Daily Weekly Check your inbox or spam folder to confirm your subscription. Construction Statistics Single-Family Multifamily Remodeling Labor Force Construction Wages Employment Data Job Openings Finance Builder Loans Consumer Finance Mortgages Home Sales and Prices Housing Affordability Housing Prices Housing Sales Macroeconomics Federal Reserve GDP Inflation Market Trends Housing Characteristics Housing Demand Industry Demographics Policy Research Building Materials Homeownership Tax Policy Local Data NAHB Indices Research Studies","published_at":1794927720000,"source_family":"nahb-eyeonhousing","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794951480753,"id":"dbca7809a75c21e5","acquisition_window":{"lower":1794862800000,"upper":1794949200000},"score":18,"tags":["housing","national","data","trend","homebuilder"],"heat_signals":["inflation","mortgage rate"],"date_precision":"day","published_date":"2026-11-17","modified_at":0,"extraction":"body_fallback","canonical":"https://eyeonhousing.org/2026/11/builder-sentiment-continues-to-fall-on-affordability-concerns","content_hash":"d69a2c8b8c849754e8af0a85cf9402d445fa3ef73f1c6d672d8ba887bef4e45b","access":"public","evidence_status":"article","editorial_protocol":"evidence-refs-v2","editor_evidence h increasing demand. Net absorption has slowed in back-to-back quarters, as deliveries have been quiet, but remains positive, with 2,077 units absorbed in the third quarter. The pipeline, however, is growing, as units under construction have risen for five consecutive quarters, reaching 18,625 units through the third quarter. The effective rent as of the end of the third quarter was $2,982 per unit, up nearly 10% YOY. Economy: Solid Fundamentals Bay Area nonfarm employment increased year-over-year (YOY) by 0.9% to over 4.0 million. At the same time, the unemployment rate declined by 40 basis points (bps) to 4.1%. Employment growth is expected to continue rising over the next 12 months. Median household income increased by 6.7% YOY, to $153,800, remaining the highest of all metropolitan markets in the US. While tech layoffs have persisted, the artificial intelligence and machine learning (AI/ML) sector continues to expand its hiring and concurrently leasing large blocks of space. Through the third quarter of 2026, Bay Area-based companies captured 75.9% ($324.5 billion) of venture capital funding into AI/ML in the U.S. Supply and Demand: Demand Outpaces Supply Vacancy fell across the Bay Area for the 12th consecutive quarter, to 3.9%, as new construction has not been able to keep up with increasing demand. Vacancy is down 110 bps YOY and currently sits at the lowest level since the fourth quarter of 2007. Net absorption has slowed in back-to-back quarters, as deliveries have been quiet, but remains positive, with 2,077 units absorbed in the third quarter. As the number of available units continues to dwindle, absorption may continue to slow until new supply meets demand. Units delivered in the third quarter totaled 969, up 306 units from the prior quarter but down by over 500 units YOY. Excluding the prior quarter, it was the lowest quarterly total since the second quarter of 2013. The pipeline, however, is growing, as units under construction have risen for five consecutive quarters, reaching 18,625 units through the third quarter. There are over 100,000 units proposed across the Bay Area, but development is not likely to see a significant uptick in the short term as rising construction costs and a difficult financing environment prove to be headwinds. However, strong market conditions and state housing mandates may help to counteract these challenges. Pricing: Record Rents Rents have surpassed record highs yet again as vacancy continued to decrease. The effective rent as of the end of the third quarter was $2,982 per unit, up nearly 10% YOY. San Francisco County is responsible for much of this growth, as it reached $3,756 per unit in the third quarter, an increase of over 15% YOY. San Francisco is showing no signs of slowing down having posted YOY rental growth greater than 10% for three consecutive quarters, a feat that has not occurred since 2001. Insights in your Inbox Subscribe to the latest local market research, insights and analysis from Cushman & Wakefield across the United States. Subscribe Author Jason Karbelk Research Manager Current Marketbeats MarketBeat Bay Area Multifamily MarketBeat This MarketBeat report covers the SF Bay Area multifamily market for Q3 2026. Read the report for a detailed look at market conditions and trends. Jason Karbelk &bull; 11/17/2026 MarketBeat San Francisco Retail MarketBeat This MarketBeat report covers the San Francisco retail market for Q3 2026, including narrative insights on the economy, market overview, Union Square/Post Street activity, and the investment market. Read the report for the full details. Jason Karbelk &bull; 10/28/2026 MarketBeat North Bay Retail MarketBeat This MarketBeat report covers retail real estate conditions in the San Francisco/North Bay region for Q3 2026. Read the report for the latest market context and key trends. Jason Karbelk &bull; 10/23/2026 MarketBeat North Bay Industrial MarketBeat This MarketBeat report covers the North Bay industrial market for nt community along the Monon Trail in downtown Indianapolis.","market_evidence_id":"body-1","market_role":"asset_location","market_scope":"us","market_evidence":"Onyx+East, EJF Capital to Develop $17.5M Build-to-Rent Community in Indianapolis by Kristin Harlow November 17, 2026 November 17, 2026 5 INDIANAPOLIS — Onyx+East has finalized a joint venture with EJF Capital LP to build Monon 21, a $17.5 million build-to-rent community along the Monon Trail in downtown Indianapolis.","duplicate_of":null,"selector_reason":"EJF Capital与Onyx+East的1,750万美元合资项目将在印第安纳波利斯开发57套BTR住房，其中7套面向收入不超过地区中位数60%的家庭；施工预计明年启动。","title_zh":"Onyx+East 与 EJF 合资开发印第安纳波利斯 BTR","summary_zh":"Onyx+East 与 EJF Capital 敲定合资开发，总投资 1,750 万美元的 Monon 21 将建 57 套出租住宅。项目已完成拆除并开始场地准备，计划于 2028 年底完工。","impact":"short-pos","evidence_quote":"Onyx+East, EJF Capital to Develop $17.5M Build-to-Rent Community in Indianapolis by Kristin Harlow November 17, 2026 November 17, 2026 5 INDIANAPOLIS — Onyx+East has finalized a joint venture with EJF Capital LP to build Monon 21, a $17.5 million build-to-rent community along the Monon Trail in downtown Indianapolis. The 57-unit project will comprise 53 townhomes across 12 three-story buildings and four detached single-family homes. Seven townhomes will be designated for households earning up to 60 percent of the area median income.","evidence_basis":"body","cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"LAHSA To Return $150M Of HUD Funding In Finalized Settlement","link":"https://www.bisnow.com/news/los-angeles/affordable-housing/lahsa-stripped-of-hud-funding-in-finalized-settlement","description":"A federal judge signed an agreement between the Department of Housing and Urban Development and the Los Angeles Homeless Services Authority , removing the LA program from HUD oversight. The settlement resolves an ongoing dispute in which HUD suspended payments to LAHSA amid a fraud investigation. The agreement requires LAHSA to give back about $150M in federal funding. HUD previously announced the deal, but it is now final, the agency said in a release Tuesday . The agreement also shifts federal money from LAHSA to the Los Angeles County government in stages, LAist reported , adding that the deal preserves the LA region’s request for $240M in annual federal funding for housing services. Pixabay/ValterM Databases and systems maintained by LAHSA will switch over to the county over the coming months, and tighter oversight will be implemented. “Today's settlement closes a difficult chapter for LAHSA and allows us to move forward with greater clarity and stability,” LAHSA interim CEO Gita O’Neill said in a release. “Our focus now is on working closely with our local partners to ensure continuity of services, support an orderly transition, and remain true to our mission of connecting our unhoused neighbors with the services, resources, and pathways to housing they need.” LAHSA has been the subject of scrutiny at the local level since at least 2024, when an LA County audit found that the organization mismanaged hundreds of millions of dollars for homeless services. Executives connected with organizations that received money from LAHSA were charged with misappropriating millions of dollars, including an instance of homeless funds allegedly being diverted to a nightclub . An LAist investigation last year showed that a former LAHSA co-CEO finalized a $2.1M contract with a nonprofit where her husband was an executive, despite telling the publication she was recused from the decision-making. HUD officials, including Secretary Scott Turner, pointed the finger for the removal directly at LAHSA. “Year after year, LAHSA funneled billions of dollars in federal funding to organizations with no oversight, which resulted in nothing but skyrocketing homelessness, failing at their most basic responsibility,” Turner said in HUD’s statement. But U.S. District Judge David Carter, who presided over the case, placed blame at the feet of both LAHSA and HUD. “This has been an absolute past dereliction of duty by the federal government,” Carter said at a Friday hearing, as reported by LAist. “I termed it a partnership in failure,” he said. “Local government turned an absolute blind eye to the distribution of these funds and transparency and accountability for these funds.” Continue reading this story with a free account Log in or register","published_at":1794946381000,"mutable":false,"date_precision":"timestamp","modified_at":1794946396000,"extraction":"semantic","canonical":"https://bisnow.com/news/los-angeles/affordable-housing/lahsa-stripped-of-hud-funding-in-finalized-settlement","content_hash":"ee49f94e2aad603c4d7ac801ba2b15fbbc430a2c1ece414b1f8f6f419a72bac0","access":"public","evidence_status":"article","id":"798d9d58d162a190","source_family":"bisnow","is_research":false,"required_source":false,"first_seen_at":1794951480753,"acquisition_window":{"lower":1794862800000,"upper":1794949200000},"score":19,"tags":["housing","california","policy","regulation","regulator"],"heat_signals":["fed","annual"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"LAHSA To Return $150M Of HUD Funding In Finalized Settlement"},{"id":"body-1","text":"A federal judge signed an agreement between the Department of Housing and Urban Development and the Los Angeles Homeless Services Authority , removing the LA program from HUD oversight."},{"id":"body-2","text":"The settlement resolves an ongoing dispute in which HUD suspended payments to LAHSA amid a fraud investigation."},{"id":"body-3","text":"The agreement requires LAHSA to give back about $150M in federal funding."},{"id":"body-4","text":"HUD previously announced the deal, but it is now final, the agency said in a release Tuesday ."},{"id":"body-5","text":"The agreement also shifts federal money from LAHSA to the Los Angeles County government in stages, LAist reported , adding that the deal preserves the LA region’s request for $240M in annual federal funding for housing services."},{"id":"body-6","text":"Pixabay/ValterM Databases and systems maintained by LAHSA will switch over to the county over the coming months, and tighter oversight will be implemented."},{"id":"body-7","text":"“Today's settlement closes a difficult chapter for LAHSA and allows us to move forward with greater clarity and stability,” LAHSA interim CEO Gita O"}],"keep":true,"importance":3,"section":"institutional","capital_focus":true,"geo_evidence":"Los Angeles County","primary_event":"capital_governance","event_evidence_id":"body-3","event_evidence":"The agreement requires LAHSA to give back about $150M in federal funding.","market_evidence_id":"body-5","market_role":"capital_subject","market_scope":"us","market_evidence":"The agreement also shifts federal money from LAHSA to the Los Angeles County government in stages, LAist reported , adding that the deal preserves the LA region’s request for $240M in annual federal funding for housing services.","duplicate_of":null,"selector_reason":"法院正式签署HUD与LAHSA和解，要求返还约1.5亿美元联邦资金，并分阶段将相关资金与系统转交洛杉矶县，构成此前协议的实质后续行动。","title_zh":"洛杉矶无家可归者服务机构将退还约 1.5 亿美元","summary_zh":"联邦法官签署和解协议，要求洛杉矶无家可归者服务管理局退还约 1.5 亿美元联邦资金。资金将分阶段转由洛杉矶县管理，地区每年 2.4 亿美元的住房服务拨款申请得以保留。","impact":"neutral","evidence_quote":"A federal judge signed an agreement between the Department of Housing and Urban Development and the Los Angeles Homeless Services Authority , removing the LA program from HUD oversight. The settlement resolves an ongoing dispute in which HUD suspended payments to LAHSA amid a fraud investigation. The agreement requires LAHSA to give back about $150M in federal funding.","evidence_basis":"body","cre_subcategory":null},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Promise Robotics raises $25M to scale automated homebuilding","link":"https://www.housingwire.com/articles/promise-robotics-25m-katerra-economics/","description":"Any way you look at it, homebuilding comes down to three things: how many homes a company can produce and sell, how much it costs to produce them, and how consistently the business can turn those homes into positive net margins. There’s no getting around throughput. Homebuilding leaders who do those three things well rarely have qualms about finding ways to do them even better. Innovation, however, is another matter. Homebuilders like innovation. Many believe it's necessary, even inevitable. But do they have to embrace it? Do they have to change how they operate to adopt and integrate it? Do they dare risk what works, warts and all, for what hasn’t yet proven to solve the throughput riddle economically? Evidence suggests that if innovation were a necessity rather than a choice, or a known rather than a leap into a chasm of unknowns, more of the dozens of companies launched over the past decade with promises to transform homebuilding, lower costs and make homes more attainable would still be in business today. Which brings us to Promise Robotics , a company whose name might as well be its business plan: Say what you're going to do, and then do what you say. Fresh off a multiyear commercial agreement with D.R. Horton , the nation's largest homebuilder, Promise Robotics today announced a $25 million Series B financing round led by White Star Capital , with participation from Horizons Ventures , Radical Ventur es and the Public Sector Pension Investment Board . The financing follows Promise's agreement to support the production of more than 1,250 homes for D.R. Horton as the company prepares to bring its first U.S. manufacturing facility online in Phoenix in 2027. Promise already operates production facilities in Calgary and Nisku, Alberta, and reports more than 2,000 housing units under contract across three markets. For Promise co-founder and CEO Ramtin Attar, the latest investment adrenaline shot is an opportunity to show that the company has figured out how to turn advanced robotics, artificial intelligence and factory-built construction into a sustainable business capable of weathering homebuilding's inevitable ups and downs, which, by the way, are now mostly downs. That's where this homebuilding innovation’s never-ending story takes a turn. Because the history of industrialized homebuilding is littered with companies that developed impressive technologies, attracted enthusiastic investors, and secured commitments from builders, only to discover that the economics of operating their businesses – and the critical factor of the time value of money in a stubbornly high cost of money backdrop – were far less forgiving than the promise of their innovations. Attar is all too familiar with that history. So are his investors. \"Every investor's question often starts by asking what went wrong with Katerra, what went wrong with X and Y and Z,\" Attar told HousingWire TBD in an exclusive interview. His determination is to transform Promise Robotics into a fundamentally different kind of construction technology business, one that uses venture capital to develop its technology platform while seeking lower-cost financing to scale its physical production capacity. \"We have been very clear about what we want to use this funding for,\" Attar said. \"It's not for funding factories; it's for funding the platform.\" Attar’s laser clarity on how the strategy will be operationalized may prove more important to Promise's long-term prospects than the robots themselves. The distinction goes directly to the problem that has defeated so many would-be homebuilding innovators: scaling manufacturing capacity without accumulating fixed costs that become unsustainable when housing demand weakens. A smaller factory, and a different cost structure One of the more revealing details from Attar's latest interview concerns what Promise calls a factory. The company's Phoenix operation is being set up in a 16,000-square-foot warehouse with existing electrical infrastructure and a loading bay. Attar said the facility requires almost no tenant improvements and is under a relatively short-term lease. Importantly, the robotic equipment itself can be ported from market to market. \"It was the same two robots that were producing homes in Calgary,\" Attar said. \"We just moved them to Phoenix two weeks ago. They're already set up. We're just hiring, and we're going to start producing.\" Portability is central to Promise's effort to avoid the fixed-cost exposure associated with large, purpose-built manufacturing facilities. The company can theoretically deploy equipment in markets where customer demand supports production, rather than making a substantial permanent investment in each market before securing sufficient orders. The model still depends on reliable demand, efficient material handling, trained workers, and economical installation. But it offers more flexibility to respond to changing market conditions. Attar also described an operational improvement that provides a clearer view of the company's economic progress. When Promise initially relied on outside contractors to install its prefabricated components, installation costs averaged about C$9 per square foot. After developing its own installation workforce, the company reduced that figure to about C$4.50. That 50% reduction is significant, though it applies to installation costs rather than to total home construction costs. For Attar, it shows that the opportunity to improve construction economics extends beyond robotic manufacturing. \"There are still tremendous gains to be made on the human side of things,\" he said. The company's recursive learning process increasingly involves understanding labor requirements, installation sequencing, material logistics and how production crews work alongside existing trades. Those improvements and the ongoing learning may prove as important as advances in robotic speed or capability. The D.R. Horton effect Promise's agreement with D.R. Horton es","published_at":1794938007000,"source_family":"housingwire","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794951480753,"id":"498ef400695e1f71","acquisition_window":{"lower":1794862800000,"upper":1794949200000},"score":15,"tags":["housing","national","fundraising","tech-adoption","homebuilder"],"heat_signals":[],"date_precision":"timestamp","modified_at":1794938009000,"extraction":"semantic","canonical":"https://housingwire.com/articles/promise-robotics-25m-katerra-economics","content_hash":"b7b76390a05d74374d77d39c05dd47ce72e147d8b0a24b218c894c96cf2f766e","access":"public","evidence_status":"article","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Promise Robotics raises $25M to scale automated homebuilding"},{"id":"body-1","text":"Any way you look at it, homebuilding comes down to three things: how many homes a company can produce and sell, how much it costs to produce them, and how consistently the business can turn those homes into positive net margins."},{"id":"body-2","text":"There’s no getting around throughput."},{"id":"body-3","text":"Homebuilding leaders who do those three things well rarely have qualms about finding ways to do them even better."},{"id":"body-4","text":"Innovation, however, is another matter."},{"id":"body-5","text":"Homebuilders like innovation."},{"id":"body-6","text":"Many believe it's necessary, even inevitable."},{"id":"body-7","text":"But do they have to embrace it?"},{"id":"body-8","text":"Do they have to change how they operate to adopt and integrate it?"},{"id":"body-9","text":"Do they dare risk what works, warts and all, for what hasn’t yet proven to solve the throughput riddle economically?"},{"id":"body-10","text":"Evidence suggests that if innovation were a necessity rather than a choice, or a known rather than a leap into a cha tom home market consists of contractor-built and owner-built houses—homes built one at a time for owner occupancy on the owner’s land, with either the owner or a builder acting as a general contractor. The alternatives are homes built for sale (on the builder’s land, often in subdivisions, with the intention of selling the house and land in one transaction) and homes built for rent. In 2025, 71.8 % of the single-family homes started were built for sale, and 8.6 % were built for rent according to the most recent release of the Census Bureau’s Survey of Construction (SOC). While the custom-home percentage increased in 2025, the number of custom homes started in 2025 (182,869) also increased compared to the number of custom homes started in 2024 (176,932). Quarterly published statistics show that the custom-home share of single-family starts remained flat in 2026. Although the quarterly statistics are more timely, they lack the geographic detail available in the annual data set. When analyzed across the nine census divisions, the annual data show that the highest custom home share in 2025 was 47.0% in the New England division. The lowest shares were in the West South-Central Division at just 12.7%, 13.7% in the Mountain Division , and 15.7% in the South Atlantic Division . custom homes , Survey of Construction (SOC) Prev Previous Builder Sentiment Continues to Fall on Affordability Concerns Leave a Reply Cancel reply Your email address will not be published. Required fields are marked * Comment * Name * Email * Website Yes, add me to your mailing list Share this Page Subscribe to Blog Subscribe Search by Category Video Updates View Please leave this field empty Subscribe to Blog via Email Email Frequency * Instant Daily Weekly Check your inbox or spam folder to confirm your subscription. Construction Statistics Single-Family Multifamily Remodeling Labor Force Construction Wages Employment Data Job Openings Finance Builder Loans Consumer Finance Mortgages Home Sales and
