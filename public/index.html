ent_evidence_id":"body-1","event_evidence":"Formation Interests closed on a 48-acre tract and broke ground on a 673K SF industrial development in Spring.","market_evidence_id":"title","market_role":"asset_location","market_scope":"us","market_evidence":"Formation Breaks Ground On 673K SF Industrial Park: The Houston Deal Sheet","duplicate_of":null,"selector_reason":"Formation与Ares合作的休斯敦都会区67.3万平方英尺工业园已购地并开工，规划六栋楼，预计2027年底完工。","title_zh":"休斯顿 Spring 673K SF 工业园开工","summary_zh":"Formation Interests 与 Ares Management 合作，在休斯顿 Spring 开发 673K SF 工业园，含 6 栋楼和配套设施，预计 2027 年底完工。","impact":"neutral","evidence_quote":"Formation Interests closed on a 48-acre tract and broke ground on a 673K SF industrial development in Spring. Formation Interests The Grand at Formation Park, located at the southwest corner of the Grand Parkway and Interstate 45, is being developed in partnership with Ares Management Corp. It will have six buildings ranging from 34K SF to 169K SF and will include an amenity area.","evidence_basis":"body","cre_subcategory":"工业"},{"source_id":"nrhc","source_name":"National Rental Home Council (NRHC)","source_tier":"E","source_weight":9,"source_tags":["btr-sfr","institutional"],"region":"national","title":"How Much of a Pay Raise Would Today’s Renters Need to Afford a Home? – MortgagePoint","link":"https://themortgagepoint.com/2026/11/13/todays-renters-would-need-more-than-a-14k-pay-raise-to-afford-a-home/","description":"How Much of a Pay Raise Would Today's Renters Need to Afford a Home? Demetria C. Lester November 13, 2026 Seeking a more suburban lifestyle—with the additional space, yard, and private garage often found in a single-family home—does not necessarily require stretching the budget to buy. For most families, buying is a significant financial stretch. A household that can comfortably afford rent on a single-family home would need a $14,408 pay increase to cover the monthly costs of owning one, even before setting aside money for a down payment. Across the country, the typical rent for a single-family home is $2,243 per month, compared with $2,603 per month to own one with a 20% down payment—a difference of $360 each month. Using the common guideline of spending no more than 30% of household income on housing, a household needs to earn $89,724 to comfortably afford rent and $104,132 to buy. For many households, renting a house is a deliberate choice, not a fallback. It requires less income than ownership and leaves more room in the monthly budget. The income increase required to buy a home is now the largest since early 2025, exceeding twice the $6,463 needed in February 2026, when mortgage rates briefly dipped below 6%. The difference varies considerably by market. It is greatest in San Jose, where the income needed to buy ($404,925) is more than twice the income needed to rent ($190,561)—a gap of $214,364. San Francisco has the next-largest gap at $139,353, followed by San Diego ($84,101), New York ($78,208) and Los Angeles ($78,003). The smallest annual differences are in Pittsburgh ($2,554), Houston ($4,500) and Cincinnati ($4,774). Buffalo is the only market where buying would not require an income increase. Even after securing that increase, prospective buyers face another challenge: saving for a 20% down payment. According to Zillow’s 2026 Consumer Housing Trends Report, about 30% of mortgage buyers receive a gift or loan from family or friends, while 46% rely on at least two sources, including down payment assistance programs. Beyond monthly expenses, households weighing renting against buying should consider purchase-related upfront costs, the potential to build equity and renters’ option to invest the money they would otherwise use for a down payment. Zillow’s rent-versus-buy analysis estimates the national break-even point—the time an owner must stay in a home for buying to become more advantageous than renting—at 7.8 years with a 20% down payment. As renting a house becomes an increasingly attractive value, more people are choosing to rent. Nationwide rental demand has risen 22.1% year over year, according to the Zillow Observed Renter Demand Index (ZORDI). Demand for single-family rentals is up 24.3%, about twice the 12.1% increase for multifamily rentals. Demand increased most in San Jose, where ZORDI is 78.9% higher than a year ago. San Francisco followed at 60.5%, then Austin at 59.6%, Miami at 51.5% and Jacksonville at 47.9%. San Jose and San Francisco are also among the markets where homebuying is least attainable and rents are climbing rapidly, rising 8.9% and 12.2%, respectively. Rent growth is more modest in Austin, Miami and Jacksonville, at 1.1%, 2.1% and 2.6%, respectively. Some markets are bucking the national trend. ZORDI has declined year over year in Providence (-4.3%), Richmond (-1.9%), Baltimore (-1.7%), Hartford (-1.3%) and Washington, D.C. (-0.9%). A Grand Overview In October, the typical asking rent was $1,913, unchanged from the previous month. Before the pandemic, rents typically declined by 0.1% month over month at this time of year. Rents have risen 38.5% since the pandemic began. Compared with a year ago, rents are also up 2.9%. Monthly rents declined in 24 major metro areas. The steepest drops were in Denver (-0.5%), Seattle (-0.4%), New York (-0.4%), Austin (-0.3%), and Boston (-0.3%). Rents were higher than a year earlier in 49 of the 50 largest metro areas. The largest annual increases were in San Francisco (12.2%), San Jose (8.9%), Virginia Beach (7.5%), Chicago (4.7%), and Milwaukee (4.7%). In October, the typical asking rent for a single-family home was $2,243, a 0.1% increase from the previous month. Since the pandemic began, single-family rents have risen 47.1%. Rents for single-family homes are 3.2% higher than a year ago. Monthly single-family rents declined in 27 major metro areas. The steepest decreases were in Seattle (-0.5%), Denver (-0.5%), Cincinnati (-0.4%), Minneapolis (-0.4%), and Austin (-0.4%). Single-family rents are now above year-ago levels in all 50 of the largest metro areas. The greatest annual increases were recorded in San Jose (7.6%), Buffalo (6.5%), San Francisco (6.3%), Providence (6.2%), and Hartford (6.1%). The median asking rent for multifamily homes stood at $1,744 in October, a 0.1% decline from the previous month. Since the pandemic began, multifamily rents have risen 30.1%. Multifamily rents are 2.5% higher than a year ago. Monthly multifamily rents declined in 28 major metro areas. The steepest decreases were recorded in Oklahoma City (-0.5%), Denver (-0.5%), Richmond (-0.4%), New York (-0.4%), and Orlando (-0.4%). Rents were above year-ago levels in 46 of the 50 largest metro areas. The biggest annual increases occurred in San Francisco (13.3%), San Jose (9.4%), Virginia Beach (8.2%), Chicago (4.8%), and Milwaukee (4.5%). The Zillow Observed Renter Demand Index (ZORDI) stood at 38 in October, declining 6.7% from the previous month. Rental demand rose 22.1% compared with the same period last year. Single-family rental demand increased 24.3% year over year, while multifamily rental demand grew 12.1%. On a monthly basis, rental demand declined in 48 major metro areas. The steepest drops were recorded in Minneapolis (-15%), Seattle (-12.6%), San Diego (-12%), Providence (-11.6%), and Kansas City (-11.1%). Compared with a year ago, rental demand increased in 45 of the 50 largest metro areas. The strongest annual gains w","published_at":1795205329000,"mutable":false,"date_precision":"timestamp","modified_at":1794608990000,"extraction":"body_fallback","canonical":"https://themortgagepoint.com/2026/11/13/todays-renters-would-need-more-than-a-14k-pay-raise-to-afford-a-home","content_hash":"472bcc776488245e62f9e68f449eb6b8b9376a47d1051b071542f0fcab20be09","access":"public","evidence_status":"article","id":"7e57083710fcc754","source_family":"nrhc","is_research":false,"required_source":false,"first_seen_at":1795383442856,"acquisition_window":{"lower":1795122000000,"uppe er Adjustment and Retraining Notification (WARN) filing, indicating that the hotel's 423 employees would soon be working for a new operator. A sale price has not been publicly announced, as of this report.","evidence_basis":"body","cre_subcategory":"酒店"},{"source_id":"northmarq-research","source_name":"Northmarq Research","source_tier":"B","source_weight":9,"source_tags":["multifamily","data","trend"],"region":"national","title":"Atlanta multifamily sales accelerate in the third quarter","link":"https://northmarq.com/insights/insights/atlanta-multifamily-sales-accelerate-third-quarter-q3-2026","description":"HighlightsOperating fundamentals improved during the third quarter, with vacancy declining and rents continuing to rise. Nearly 3,100 units were delivered, while the construction pipeline represented just 3.0% of the existing inventory at quarter-end.Vacancy fell 10 basis points in the third quarter to 5.7% as absorption exceeded new supply. Atlanta’s vacancy rate was unchanged year over year.Asking rents ticked higher by 0.4% in the third quarter to $1,663 per month. On an annual basis, rents increased 1.3%.The number of property sales through September increased 20% from the same period of 2025. The median sale price was $169,000 per unit, with activity concentrated in garden-style properties despite a steady quarterly increase in mid- and high-rise sales. Atlanta multifamily market overviewAtlanta’s multifamily market continued to improve in the third quarter of 2026, as asking rents edged higher and vacancy declined. Deliveries increased for a second consecutive quarter, rising 15% from the prior three months to about 3,100 units completed. Even so, completions remained 23% below the year-earlier level, and year-to-date deliveries are down 42% from the same period of 2025. The construction pipeline contracted to roughly 18,200 units underway, down 11% from the prior quarter. New deliveries spanned multiple submarkets, led by Northeast Gwinnett County and Buckhead. Buckhead also recorded the strongest absorption, followed by Northeast Gwinnett County and Kennesaw/Acworth. Marketwide absorption totaled nearly 3,900 units, exceeding deliveries by roughly 800 units and lowering vacancy for a second consecutive quarter, leaving the rate even with the same period last year.Investment activity strengthened through the first three quarters of 2026, with volume rising 23% from the same period of 2025 to approximately $4.4 billion. Third-quarter volume was nearly as much as the first half combined. The year-to-date median sale price reached $169,000 per unit, with quarterly medians rising steadily through September. Pricing remained segmented by product type, with median mid- and high-rise pricing of $264,000 per unit compared with $144,300 per unit for garden-style properties. Mid- and high-rise assets accounted for approximately 26% of transactions but 43% of dollar volume. Higher-priced third-quarter trades included properties in Buckhead and select northern suburbs, including Kennesaw and Alpharetta, with large sales spanning newer Atlanta communities and older suburban assets. Reported cap rates ranged from approximately 4% to 7%, averaging 5.6%. Mid- and high-rise rates generally clustered in the low-4% to low-5% range, while garden-style rates clustered between 5% and the upper-6% range.Employment: Healthcare and social assistance expanded 3.9% year over year. Image Employment growth in Atlanta weakened during the third quarter of 2026. Area employers shed 9,900 jobs year over year, marking a decline of 0.3% year over year.The healthcare and social assistance sector expanded by 3.9% year over year, adding 15,000 jobs. Year-over-year growth in the sector has remained positive at every quarter-end since the second quarter of 2021.DeltaX, a South Korea-based battery energy storage provider, announced plans to establish its North American manufacturing headquarters in Walton County, investing $141 million and creating approximately 250 jobs. The project will begin with a 100,000-square-foot assembly facility in Monroe, followed by component production buildings and a corporate office.Forecast: Atlanta employment is projected to increase by 15,000 jobs year over year by the end of 2026, representing annual growth of 0.5%. Hiring is expected to strengthen late in the year, though overall gains will remain moderate compared with recent years.Development and permitting:Year-to-date completions are down 42% from 2025. Image Multifamily deliveries rose 15% to roughly 3,100 units during the third quarter but fell 23% year over year. Year-to-date completions totaled approximately 7,800 units, down 42% from the same period in 2025.The construction pipeline narrowed in the third quarter to roughly 18,200 units underway. Development remained broadly distributed across Atlanta, with Northeast Gwinnett County, the Far West Atlanta Suburbs, Sandy Springs, and Johns Creek/Suwanee/Buford accounting for 35% of units under construction.Multifamily permitting activity slowed during the third quarter. Developers pulled permits for roughly 2,900 units, down 21% from the second quarter’s elevated pace.Forecast: New supply is expected to decline nearly 40% in 2026 compared with last year, with total deliveries projected to reach approximately 10,300 units. Vacancy:Vacancy fell 10 basis points in the third quarter. Image Absorption of nearly 3,900 units exceeded new supply during the third quarter, lowering vacancy 10 basis points to 5.7%, in line with the same period last year. Since peaking in the second quarter of 2024, vacancy has declined 220 basis points.Annual absorption outpaced new supply in Atlanta’s three largest apartment submarkets. Midtown’s vacancy declined 10 basis points year over year to 5.1%, while Buckhead and West Atlanta recorded declines of 40 and 50 basis points to 5.3% and 6.0%, respectively.Class A vacancy fell 50 basis points both quarter over quarter and year over year to 5.0%. Class B vacancy declined 10 basis points to 5.7% but remained slightly above its year-earlier level, while Class C held essentially steady both quarterly and annually at 6.1%.Forecast: Vacancy is projected to edge up to 5.9% by year-end 2026, while remaining 40 basis points below year-end 2025.Rents:Rents increased 1.3% year over year. Image Asking rents rose 0.4% during the third quarter to $1,663 per month, a slower pace of growth than was recorded in the second quarter. Rents increased 1.3% year over year.Performance varied across submarkets. North DeKalb led the market with asking rents increasing 4.6% year o","published_at":1795194000000,"date_precision":"day","published_date":"2026-11-20","modified_at":1795194000000,"extraction":"structured","canonical":"https://northmarq.com/insights/insights/atlanta-multifamily-sales-accelerate-third-quarter-q3-2026","content_hash":"c22d9fcb46b0f9956bdbec22582ece0c5865f6222906d19f110728c42ae682f1","access":"public","source_family":"northmarq-research","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1795383442856,"id":"1fd4d2932b9a46f0","acquisition_window":{"lower":1795122000000,"upper":1795381200000},"score":30,"tags":["multifamily","atlanta","data","deals"],"heat_signals":["permits","forecast","annual","year-end","year over year","year-over-year","vacancy"],"evidence_status":"article","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Atlanta multifamily sales accelerate in the third quarter"},{"id":"body-1","text":"HighlightsOperating fundamentals improved during the third quarter, with vacancy declining and rents continuing to rise."},{"id":"body-2","text":"Nearly 3,100 units were delivered, while the construction pipeline represented just 3.0% of the existing inventory at quarter-end.Vacancy fell 10 basis points in the third quarter to 5.7% as absorption exceeded new supply."},{"id":"body-3","text":"Atlanta’s vacancy rate was unchanged year over year.Asking rents tick e existing inventory at quarter-end.Vacancy fell 10 basis points in the third quarter to 5.7% as absorption exceeded new supply. Atlanta’s vacancy rate was unchanged year over year.Asking rents ticked higher by 0.4% in the third quarter to $1,663 per month.","evidence_basis":"body","cre_subcategory":null},{"source_id":"connect-cre","source_name":"Connect CRE","source_tier":"A","source_weight":7,"source_tags":["mixed-asset","deals"],"region":"national","title":"Vacant Since 2012 Fire, East Flatbush Site Will Yield 134 New Apartments","link":"https://www.connectcre.com/stories/vacant-since-2012-fire-east-flatbush-site-will-yield-134-new-apartments/","description":"Vacant Since 2012 Fire, East Flatbush Site Will Yield 134 New Apartments MSquared and project partners broke ground on the redevelopment of 665 New York Ave. in Brooklyn's East Flatbush neighborhood. The project will bring 134 homes back to a site that has been vacant since a 2012 fire. The project marks the first use of the Mamdani administration’s Subordinate Market Rate Revolving Term Loan, a new public financing tool included in the administration’s housing plan. The loan is designed to return revenue from financed projects to the city, creating a revolving source of public investment that can be reinvested in future affordable housing development. When complete, the mixed-income development will include 90 affordable apartments, including 18 apartments for formerly displaced tenants and 14 homes for formerly homeless New Yorkers. The all-electric building will replace the gas system that served the property before the fire and include parking, bike storage, a rooftop deck and a fitness center. Construction is expected to be complete in 2028. Connect Inside The Story MSquared About Paul Bubny Paul Bubny serves as Senior Content Director for Connect Commercial Real Estate, a role to which he brings 19-plus years’ experience covering the commercial real estate industry and 35-plus years in business-to-business journalism. In this capacity, he oversees daily operations while also reporting on both local/regional markets and national trends, covering individual transactions across all property types, as well as delving into broader subject matter. He produces 11-15 daily news stories per day and works with the Connect team and clients to develop longer-form content, ranging from Q&As to thought-leadership pieces. Prior to joining Connect, Paul was Managing Editor for both Real Estate Forum and GlobeSt.com at American Lawyer Media, where he oversaw operations at both publications while also producing daily news and feature-length articles. His tenure in B2B publishing stretches back into the print era, and he has served as Editor in Chief on four national trade publications. Since 1999, Paul has volunteered as the newsletter editor of passenger rail advocacy groups (one national, one local). Order Reprints ◦ Development Apartment buildings for sale Check out the latest properties available on apartmentbuildings.com 545 West 148th Street New York, NY New York & Tri-State + Apartment Buildings Listing Status: Available Listing Type: Highest & best offer Price: $5,500,000 No. of Units: 37 Building Size: 39845 Sq ft Opportunity Zone: No Price per unit: $148,648 Learn More 3187 Grand Concourse Bronx, NY New York & Tri-State + Apartment Buildings Listing Status: Available Listing Type: Highest & best offer Price: $9,000,000 No. of Units: 32 Cap Rate: 8.33 Opportunity Zone: No Price per unit: $281,250 Learn More View all apartments |Development New York & Tri-State | Outer Boroughs Apartments Vacant Since 2012 Fire, East Flatbush Site Will Yield 134 New Apartments Paul Bubny November 20, 2026 Load More","published_at":1795210899000,"source_family":"connect-cre","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1795383442856,"id":"0f7d8a5d587e9270","acquisition_window":{"lower":1795122000000,"upper":1795381200000},"score":9,"tags":["multifamily","nyc", the week ended Nov. 16, according to the Weekly Activity Snapshot from the Houston Association of REALTORS® . Buyers purchased 1,115 properties, down from 1,412 during the same week in 2025.","evidence_basis":"body","cre_subcategory":null},{"source_id":"connect-cre","source_name":"Connect CRE","source_tier":"A","source_weight":7,"source_tags":["mixed-asset","deals"],"region":"national","title":"FPA Multifamily Picks Up 599-Unit MF Community in Portland","link":"https://www.connectcre.com/stories/fpa-multifamily-picks-up-599-unit-mf-community-in-portland/","description":"Seattle & Northwest CRE News In Your Inbox. Sign up for Connect emails to stay informed with CRE stories that are 150 words or less. Seattle & Northwest + Portland + Apartments | November 20, 2026 By: Allen Wolfsheimer FPA Multifamily Picks Up 599-Unit MF Community in Portland FPA Multifamily purchased Wimbledon Square and Gardens, a 599-unit residential community in Portland, OR. The property is located at 2837 SE Colt Drive, on over 14 acres. Constructed in phases in 1973 and 1975, Wimbledon Square and Gardens comprises 83 three-story residential buildings offering studio, one-, and two-bedroom apartments and townhomes. Community amenities include three outdoor heated swimming pools with sundecks, a clubhouse, and tennis, basketball, and volleyball courts. The property is adjacent to the Reed College campus and near D.A. Grout Elementary School and Cleveland High School. The nearby SE 17th Avenue and Holgate Boulevard MAX Light Rail Orange Line station provides direct access to Oregon Health & Science University, one of the region's major employers. The surrounding neighborhoods of Sellwood, Woodstock, Division, and Hawthorne offer easy access to numerous restaurants, retail shops, grocery stores, farmers markets, parks and trails. The property is also near Downtown Portland. Anthony Palladino, Philip Assouad, Giovanni Napoli, Ryan Harmon, and Nick Ruggiero of IPA, in association with David Tabata, an in response to rapid shifts in the economy and housing landscape. You can count on a new Weekly Housing Trends update, fresh weekly data each Thursday, and a weekly video from our economists to help you stay informed. What this week’s data shows Mortgage rates remain in the lower 7% range, and both sides of the market continue to pull back. Active inventory is up 8.6% from a year ago. However, this is not because sellers are rushing in. New listings are still running below last year’s pace, and homes are taking 2 days longer to sell, the widest gap since mid-April. Sellers have kept cutting their asking prices, with the median listing price down 2.4% year over year, matching its steepest decline since early October, yet buyers have not returned in force. The latest contract data shows how deep the pullback runs. Pending home sales fell 4.7% in October to another record low and were down 16.7% from a year earlier, as mortgage rates peaked at 7.4%. Rates have since eased, but October’s hot inflation data has markets expecting a Fed rate hike in December, which could push borrowing costs higher again. For buyers who can afford to act, there is an upside with fewer shoppers meaning less competition, more homes to choose from, and sellers who are more open to negotiating on price, repairs, or closing costs. Active inventory climbed 8.6% year-over-year The number of homes for sale rose 8.6% compared to a year ago, the fourth straight week of growth at 8% or higher. Inventory has been building momentum since July, rising from roughly 2% year-over-year growth in mid-July to nearly 9% now. This pickup is not being driven by a flood of new sellers, but by a pullback in buyer activity that is letting unsold listings pile up. Year-to-date, active inventory is up 5.1%. Homes spent 2 days longer on the market compared to a year ago Median days on market came in at 66 days, with homes selling 2 days slower than the same time last year. This marks the fourth week in a row that time on market has slowed, and the widest gap since mid-April, after a long stretch reaching back to May of homes selling at the same pace or faster than last year. As mortgage rates stay above 7%, more buyers are retreating to the sidelines, and the shift could be an early signal of market slowdown. Year-to-date, time on market remains 2 days behind last year’s pace. New listings, a measure of sellers putting homes up for sale, fell 3.5% year-over-year New listing activity fell 3.5% year over year, the seventh straight week of annual declines. That is a milder drop than last week’s 10.3%, but sellers are still staying put because buyers remain disengaged. Our latest analysis of Census data found that 59% of owner-occupied homes still carry a mortgage , and owners with low-rate loans are reluctant to give up that rate for a costlier loan on their next home, which makes relocating a less attractive proposition. Year-to-date, new listings are down 0.6%. The median listing price fell 2.4% year-over-year The median listing price was $405,000, down 2.4% from the same week last year. Listing prices have now been negative on a year-over-year basis for 44 consecutive weeks. The median price per square foot also declined, falling 1.2% year over year, and the number of listings with price cuts rose 10.5%. Mortgage rates have buyers in an affordability crunch, and sellers are responding slowly. The softness is concentrated in existing homes: our latest new construction report found existing home prices 1.5% below 2025 levels in the third quarter, while new home listing prices were flat, with builders offering reduced mortgage rates to sweeten deals. Year-to-date, median listing prices sit 1.9% below 2025 levels.","published_at":1795082407000,"source_family":"realtor-com","is_research":true,"required_source":true,"mutable":false,"first_seen_at":1795383442856,"id":"431af3af1718f16b","acquisition_window":{"lower":1795035600000,"upper":1795381200000},"late_discovery":true,"score":1
