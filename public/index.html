tain financial stability and secure a place to live and raise a family,” Ellison said in a statement. “I brought this action to stop practices that attempted to evade those protections and misled consumers.” His office claimed that when origination fees and equity stakes were treated as finance charges, the company charged an initial amount equal to 100% to 140% of the amount advanced and collected up to 22% in annualized interest, despite marketing the agreements as not creating debt and not charging interest. The investigation also found that Unlock did not verify borrowers’ ability to repay without refinancing or foreclosure , Ellison said. Minnesota tightened its Mortgage Originator and Servicer Licensing Act after the 2008 foreclosure crisis to require ability-to-repay assessments and to curb equity-based lending that can strip homeowner wealth and potentially lead to repossession of a property. Unlock, which cooperated with the investigation, agreed to stop offering its HEAs in Minnesota unless it becomes licensed by the Minnesota Department of Commerce and complies with the state’s mortgage laws, including rate caps. Unlock&#8217;s response The company issued a statement to HousingWire in which it said it has been &#8220;actively engaged&#8221; with state commerce officials on developing purpose-built regulations for shared equity products. The framework includes plain-language disclosures, rescission periods and caps on sharing percentages, which Unlock and other members of the Coalition for Home Equity Partnership (CHEP) already apply voluntarily. &#8220;We&#8217;ve been at the table with regulators because we believe the best long-term outcome — for homeowners and for this industry — is regulation written specifically for how shared equity products actually work,” said Michael Micheletti, chief communications officer at Unlock. “We&#8217;re committed to helping build that framework, and we&#8217;ll keep showing up until it&#8217;s done.&#8221; The company  like I&#039;ve trained my whole life for this sprint,” Shah told Bisnow in a Zoom interview Friday. Courtesy of Delshah Capital Delshah Capital CEO Michael Shah Back in 2023, Shah was eyeing down $59M in Israeli bonds coming due in September and was on track to sell 55 Gansevoort St., a boutique hotel in the Meatpacking District , to repay the debt. The firm reached a contract months earlier, but the buyer got cold feet, leaving Delshah’s financial future in question. Shah had spent his career building a roughly $1B portfolio , spanning federally subsidized affordable housing complexes, luxury retail, ground-up condo development and debt. One looming deadline put it all at risk. The situation took a toll on more than Delshah’s balance sheet. Chad Roberson, Delshah&#039;s then-head of capital markets, took his own life in 2024, Shah said. “I wish he was still around for the comeback, but I guess he felt pretty hopeless,” he said. “I happened to be lucky enough to have figured out that money and success aren&#039;t everything, but the people that you really care about are.” Lessons Early in the crisis, Shah called two people: LIHC Investment Group principal Charlie Gendron and Ziel Feldman , founder of the now-defunct HFZ Capital Group . Feldman faced his own set of troubles after his partner, Nir Meir , allegedly used the firm to conduct an $86M fraud scheme. Meir has pleaded not guilty and is scheduled to face trial in October . Meanwhile, Feldman, who wasn’t implicated in any wrongdoing, was left to pick up the pieces and move on with his career. Shah crossed paths with Feldman years earlier while working on a deal for 40 Broad St. “I asked Ziel what he did to keep himself sane when HFZ was imploding,” Shah said. “He gave me really good advice: Spend half your day figuring out the problems. Spend the other half of your day thinking about new business and other things.” Then, while building his business back up, Shah encountered Gendron. “His whole approach to business is that he tries to help his transaction partner achieve whatever is most important to them, and then he finds that things usually work out for him,” Shah said. Acts of compassion can be rare in the cutthroat culture of New York City real estate. As Shah put it, the mentality in the industry is oftentimes “$1 for you is $1 less for me.” With so much money at stake, it&#039;s why lenders are quick to battle defaulted borrowers, why buyers squabble among each other, and why some investors hang on for dear life. It’s why the average real estate attorney’s rate nears $1K an hour , with New York&#039;s elite litigators commanding much more. “I’ve brought enough foreclosures to know that inevitably you lose, but it costs the lender a lot of money. The asset value drops in the interim. Tenants leave,” Shah said. “Everyone&#039;s just shrinking the pie instead of helping each other out.” “I’m almost 50,” he added. “Life is way too short for that.” Recovery Shah filed two prepackaged bankruptcies in late 2023. Doing so bought time, holding off the bondholders’ trustee from seizing control of his company, while speeding up a prior deal to sell 100 Christopher St. Unlike a traditional bankruptcy filing, a prepackaged deal is largely negotiated in advance. The process is faster, more predictable and comes at a lower cost. “We were able to get our creditors meaningfully more money, millions","published_at":1787616810000,"score":16,"tags":["mixed-asset","nyc","deals","distress","institutional"],"heat_signals":["fed"],"importance":4,"selector_reason":"Michael Shah 半年内完成近 4 亿美元收购，显示 distressed 后资本重新入场和资产重组活跃。交易总额超过 2 亿美元，因此评为 imp=4。","section":"institutional","title_zh":"Shah从破产后迅速转向4亿买入","summary_zh":"Delshah 过去6个月完成近4亿美元收购，显示 distressed 资产回购与融资回暖","impact":"long-pos","id":"2d391cb0","fetched_at":1787629537521},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Real
