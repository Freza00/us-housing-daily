use funding rather than deposits to finance mortgage originations. CHLA said qualified IMBs should be allowed to join the FHLBank System under appropriate capital, collateral, borrowing and risk-management requirements. “Providing qualified IMBs with access to FHLBank liquidity would better align the System’s public benefits with the institutions that now perform a substantial share of the nation’s mortgage lending,” CHLA said. The group also urged FHFA to consider whether continued FHLBank membership should be linked more directly to ongoing mortgage lending. FHFA previously declined to require members to maintain a specific minimum level of residential mortgage assets. CHLA said the agency should consider annual reviews of members’ mortgage lending activity to ensure continued access to FHLBank benefits remains connected to the system’s housing mission. CHLA ultimately supports repealing Part 1272 but said the change should include safeguards around new activities and modernization of FHLBank membership. Related More: Community Home Lenders of America Federal Home Loan Banks FHFA IMBs","published_at":1786996173000,"score":24,"tags":["housing","policy","regulation","regulator"],"heat_signals":["fed","freddie mac","fannie mae","annual"],"importance":4,"selector_reason":"CHLA 要求 FHFA 允许独立按揭银行加入 FHLBank，可能改变房贷机构的流动性来源。涉及住房金融监管框架，属于重要政策动态。","section":"national","title_zh":"CHLA 促 IMB 纳入 FHLBank 会员","summary_zh":"若放宽准入，IMB 可获更多流动性；FHFA 仍需保留风险护栏","impact":"long-pos","id":"df5c9c03","fetched_at":1787016904304},{"source_id":"cnbc-realestate","source_name":"CNBC Realty Check","source_tier":"A","source_weight":6,"source_tags":["macro"],"region":"national","title":"Trump says NYC pied-à-terre tax 'must be stopped,' eyes federal block","link":"https://www.cnbc.com/2026/08/11/trump-nyc-pied-a-terre-tax-mamdani-lawsuit.html","description":"Trump in a Truth Social post called Mamdani's pied-à-terre tax a \"dangerous political 'experiment' in New York will destroy\" the city and s ed higher in August, builders continue to contend with high construction costs and broader economic uncertainty,” NAHB Chairman Bill Owens said in a statement. “Rising gas and diesel prices are pushing up material costs, and spec home building remains weak as many prospective buyers stay on the sidelines. However, the Midwest remains a bright spot for the home building industry, with new home sales up in that region more than 2% so far in 2026.” The latest HMI survey found that current sales conditions rose two points to 39 in August, while the components tracking sales expectations over the next six months and prospective buyer traffic held steady at 43 and 23, respectively. For reference, any HMI number below 50 means that more homebuilder survey respondents have a negative outlook that those with a positive one. Looking at the three-month moving averages for regional HMI scores, the Northeast slipped one point to 44, the Midwest was unchanged at 45, the South declined two points to 31 and the West held at 27. “Our latest builder survey continues to show signs of weakness in the home building market,” said NAHB Chief Economist Robert Dietz. “August marked the 16th straight month that at least 30% of builders reported cutting prices to support demand, as well as the 16th consecutive month with the HMI below 40. Custom home builders continue to report stronger market conditions than spec builders, reflecting better conditions at the higher end of the market. Smaller, less dense markets are also outperforming larger metropolitan areas, and smaller builders report relatively stronger conditions than larger builders.” Incentives remain elevated According to NAHB, 35% of builders cut prices in August, down from 37% in July and unchanged from June. The average price reduction was 6% in August, the same as the previous month, and the share of builders using sales incentives was 63% in August, unchanged from July. The problem of elevated incentives is particularly acute among entry-level and affordable-price-tier buyers, who are most sensitive to mortgage rate volatility and affordability pressures. Builders that focus predominantly on affordable price points often must choose between maintaining volume by &#8220;buying&#8221; sales through incentives or pulling back to protect margins. Smith Douglas Homes &#8216; strategy and performance illustrate this dilemma. The builder posted commendable year-over-year growth, with closings growing 25% and new home orders increasing 32%. However, to support this sales activity, the company had to employ generous incentives last quarter, resulting in gross profit margins falling 560 basis points to 17.6%. Many private builders struggle to match the incentives offered by ","published_at":1786999194000,"score":31,"tags":["housing","trend","rates","homebuilder"],"heat_signals":["mortgage rate","new home sales","outlook","year-over-year","housing market","new home sales"],"importance":3,"selector_reason":"建商信心继续低迷反映新房订单、激励和 affordability 压力。该数据是住宅市场常规领先指标，但不是系统性宏观数据。","section":"national","title_zh":"房贷高利率压制订单，builder sentiment 仍弱","summary_zh":"8月 HMI 升至35但仍偏负面，成本与 affordability 继续压 margins","impact":"short-neg","id":"9e633448","fetched_at":1787016904304},{"source_id":"rebusiness-online","source_name":"REBusiness Online","source_tier":"A","source_weight":6,"source_tags":["mixed-asset","deals"],"region":"national","title":"Haven Housing Acquires 264-Unit Apartment Complex in Pflugerville, Texas","link":"https://rebusinessonline.com/haven-housing-acquires-264-unit-apartment-complex-in-pflugerville-texas/","description":"PFLUGERVILLE, TEXAS — California-based investment firm Haven Housing has acquired Wells Park Apartments, a 264-unit multifamily complex in the northern Austin suburb of Pflugerville. Built in 2018, the property offers one-, two- and three-bedroom units and amenities such as a pool, fitness center, resident clubhouse, business center and outdoor gathering spaces. Kevin Dufour, Matt Poh sh that has led to regulatory and zoning changes, the Phoenix Business Journal reported . Photo credit: Pixabay/aiamkay Some of the delayed projects include facilities by developers Vermaland LLC and LPI Co., both in Pinal County. Arizona boasts 160 data centers , according to Data Center Map, with Phoenix home to 149 of them. Last year, the city ranked top among data center markets by sales volume. Developers delaying data center build-out in the region mirrors a national trend. Public outcry in response to the rapid construction of data centers across the country , sparked by the artificial intelligence boom, is prevalent. Two massive data center projects south of Phoenix have had to pause development. Vermaland LLC, which is building La Osa Energy Center near the city of Eloy, put plans on hold in May after facing significant community opposition. The company eventually decreased the project’s size from 59 buildings to 11 buildings in response and will bring updated plans to the board for a vote later this month. Project Midway is also seeing delays with its proposed five-building, 1.25M SF campus in the area. Last month, an attorney for the developer, Nevada-based LPI Co., reportedly requested a continuance after the county’s planning and zoning commission questioned how the project might impact the power grid. Some developers are responding to increased opposition by increasing their community outreach efforts . “Getting local communities on board is now the biggest obstacle for the industry,” the PBJ reported, citing a new report from JLL . Despite an influx of data center moratoriums across the country — at city, county and state levels — demand for the facilities “shows no sign of waning,” the PBJ reported, as the AI industry continues to grow. More than 66 gigawatts of data center capacity are currently being built in North America, with 2 GW in Arizona, according to the JLL report. But obtaining entitlements for new data centers is now harder in Arizona, the PBJ reported. In June, Arizona enacted a three-year pause on new tax incentives and exemptions for data centers. While this means the construction and operation of new and existing centers can continue, as AZ Family reported , it also creates headaches for a few developers that have had to request waivers or compensation for disrupted projects, such as a data center campus in Casa Grande . Last year, Phoenix modernized its data center zoning ordinance to add the centers as “a permitted use that must address health and safety concerns when applying for a special permit for construction.” The PBJ reported that the state of Arizona maintains the power to pass legislation that overrides local ordinances. But for now, municipalities are holding their own. This month, the city of Gilbert voted unanimously to recommend approval of an amendment to its land development code that would establish development standards for data centers, addressing factors such as water, power, sound, lighting and design. Continue reading this story with a free account Log in or register Contact Jessica Beebe at jessica.beebe@bisnow.com","published_at":1787002388000,"score":17,"tags":["data-center","phoenix","policy","regulation","developer"],"heat_signals":["trend"],"importance":4,"selector_reason":"Phoenix 数据中心项目因公众反弹和监管变化而延迟，反映高增长 Sun Belt 市场的基础设施约束。数据中心是 CRE 热点资产，监管拐点具备行业中等重要性。","section":"cre","title_zh":"凤凰城数据中心项目因反弹与监管延迟","summary_zh":"社区反对推动 zoning 收紧，多处 AI 数据中心项目被迫暂停或缩减","impact":"short-neg","id":"6dda5419","fetched_at":1787016904304,"cre_subcategory":"数据中心"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Millennium Partners Lands $281M Loan For Winthrop Center Tower","link":"https://www.bisnow.com/news/boston/capital-markets/millennium-partners-secures-largest-new-england-clean-energy-loan-for-winthrop-center-tower","description":"Millennium Partners locked down $281M in PACE funding og","source_tier":"B","source_weight":9,"source_tags":["multifamily","data","trend"],"region":"national","title":"U.S. Industrial Market Outlook – July 2026","link":"https://www.yardimatrix.com/blog/u-s-industrial-market-outlook-july-2026/","description":"Industrial Market Real Estate Trends U.S. Industrial Market Outlook – July 2026 Diana Firtea August 17, 2026 3 Min Read Image by Александр Ивасенко/AdobeStock The industrial market continued to normalize in June as vacancy stabilized, rent growth slowed and the premium on newly signed leases narrowed, the latest Yardi Matrix Industrial National Report shows. Report highlights National in-place rents reached $9.20 per square foot, up 5.3 percent year over year. Vacancy measured 9.1 percent, only 10 basis points higher than a year earlier. Recently signed leases averaged $10.02 per square foot, an $0.82 premium over in-place rents. The construction pipeline totaled 399.5 million square feet, equal to 1.9 percent of stock. First-half industrial sales reached $40.7 billion at an average of $141 per square foot. New-lease premium continues to narrow Industrial rent growth remained positive but has become less widespread. The Inland Empire led major markets with an 8.4 percent annual increase, followed by Atlanta at 8.1 percent and Miami at 7.3 percent. Only three markets posted growth above 7 percent, compared with eight one year earlier. Vacancy held at 9.1 percent nationally, signaling that availability has plateaued as new supply slows and demand normalizes. Leases signed during the past 12 months averaged $10.02 per square foot, compared with the $9.20 national in-place average. The resulting 82-cent spread was nearly half the $1.58 premium recorded one year earlier. Miami had the largest metro spread at $3.26, followed by Nashville at $2.92, Bridgeport at $2.63, Dallas at $2.17 and the Bay Area at $2.15. Phoenix and Dallas lead the pipeline Industrial space under construction reached 399.5 million square feet nationally. Dallas led all listed markets by total volume with 31.2 million square feet underway, narrowly ahead of Phoenix at 30.2 million. Phoenix had the largest pipeline relative to inventory at 6.7 percent, followed by Columbus at 4.1 percent and Denver at 3.3 percent. Atlanta’s warehouse pipeline is expanding again after a two-year slowdown. The market recorded 8 million square feet of warehouse and distribution starts in 2025 and 5.3 million square feet during the first half of 2026. The resurgence includes three buildings totaling 3.3 million square feet at River Park E-Commerce Center. Industrial transactions totaled $40.7 billion through June. Dallas led metro sales volume with $2.6 billion, followed by Chicago at $2.2 billion and Los Angeles at $1.9 billion. Pricing ranged from $318 per square foot in the Bay Area and $298 in Los Angeles to $81 in the Twin Cities and Kansas City. Bay Area pricing was boosted by manufacturing transactions in Fremont, where six properties sold for an average of $447 per square foot. Read the full Yardi Matrix Industrial Market Outlook: July 2026 . Tags Industrial Real Estate Outlook You may also like Real Estate Trends Self Storage Market Self Storage Market Outlook – July 2026 August 5, 2026","published_at":1786961870000,"score":35,"tags":["industrial","national","trend","data"],"heat_signals":["dallas","outlook","trend","trends","annual","year over year","rent growth","vacancy"],"importance":3,"selector_reason":"Yardi 全国工业市场展望提供空置率、租金和租赁价差等核心 CRE 指标。它是全国市场月度趋势，重要性为常规动态。","section":"cre","title_zh":"美国工业市场7月报告：租金增速放缓","summary_zh":"空置率9.1%持平，新租金溢价收窄至82美分，市场继续正常化","impact":"neutral","id":"a5332195","fetched_at":1787016904304,"cre_subcategory":"工业"},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Why Varia US teamed up with Brookfield to expand its multifamily portfolio","link":"https://www.multifamilydive.com/news/varia-brookfield-joint-venture-workforce-housing/828062/","description":"An article from Dive Brief Why Varia US teamed up with Brookfield to expand its multifamily portfolio The $694 million joint venture allows Varia to unlock substantial liquidity, improve its balance sheet and gain greater flexibility in managing the business. Published Aug. 17, 2026 Leslie Shaver Senior Reporter Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google The Mission Palms apartments in Tucson, Az. Varia US Properties owns the asset. Permission granted by Varia US Dive Brief: On Aug. 13, affiliates of Brookfield Asset Management entered into a $694 million joint venture with Varia US Properties AG, a Swiss-listed investor in multifamily that is, externally managed by Stoneweg, an SWI Group company, according to a press release. The joint venture, which covers 13 properties in Varia's 17-asset U.S. multifamily portfolio, will provide access to up to $200 million to fund future acquisitions. Those assets have been divided into two newly formed vehicles. With the capital injection, Varia said it can expand and improve the quality of its portfolio. Varia plans to invest in the JV assets to maximize value ahead of disposals. It will then recycle proceeds into higher-quality acquisitions. The 13 properties Varia is contributing to the JV encompass 4,112 units and span nine states. Dive Insight: Over the past several years, Varia US Properties has been focused on building and operating a high-quality U.S. multifamily portfolio while creating long-term value for shareholders, and the Brookfield JV is the next step in the process, a spokesperson told Multifamily Dive in emailed comments. “We see Brookfield’s decision to partner with us as a strong external validation of both the quality of our underlying real estate portfolio and the capabilities of our operating platform,” the spokesperson said. Varia focuses on secondary and tertiary markets that are characterized by strong population and employment growth. “Varia US Properties is exclusively investing in the US multifamily market [‘workforce housing’ market],” the spokesperson said. The $694 million asset value reflects a blended discount of approximately 9.5% to the 13 properties’ first-quarter 2026 appraised fair value, reflecting current institutional multifamily portfolio transaction pricing and the scale, liquidity and certainty provided by the transaction, per the release. The transaction also significantly strengthens Varia’s financial position. “It unlocks substantial liquidity, improves our balance sheet and gives us greater flexibility in managing the business, while reducing our exposure to older and more capital-intensive assets,” the spokesperson said. In the first JV portfolio of four properties totaling 1,060 units with an asset value of $178.4 million, Brookfield will hold a 90% equity interest, while Varia US will retain a 10% equity interest. As the majority holder, Brookfield will hold traditional major decision-making rights. Varia US will retain day-to-day operational control of the portfolio. In the second portfolio of nine properties, totaling 3,052 units with an asset value of $515.5 million, Brookfield will hold a 40% equity interest and Varia US will retain a 60% equity interest. Varia US will continue to hold major decision rights over asset sales for the first two years following closing and maintain day-to-day operational control. The plan calls for a full disposition of this portfolio in 12 to 36 months, with proceeds reinvested into new acquisitions. Varia US expects to sell two of the four properties it will continue to wholly own within 12 months of closing. With the closing of the JV and the sale of the additional properties, it expects to generate $101.9 million. Newmark was Varia US’ financial advisor, and Ropes Gray LLP was its legal advisor in the transaction. Kirkland Ellis LLP served as Brookfield's legal advisor. Click here to sign up to lle Hale Aug 17, 2026 Highlights July 2026 marks three full years of year-over-year rent declines for 0–2 bedroom properties across the 50 largest metros.The national median asking rent fell $24, or 1.4%, compared to a year ago. The median asking rent in the 50 largest metros registered at $1,695, $69 (-3.9%) lower than its summer 2022 peak but $225 (15.3%) higher than the pre-pandemic level. Median rent declined in all size categories: studio: $1,435, down $20 (-1.4%) year over year; 1-bed: $1,581, down $21 (-1.3%) year over year; 2-bed: $1,893, down $26 (-1.4%) year over year. Amid rental declines, renting a starter home remains a more affordable option than buying one in all 50 metros, with an average monthly savings of $858. While renting is still cheaper today, home price, rent trends, and wage growth in 7 markets suggest a buying opportunity may be near even as the Realtor.com Market Clock ® is signaling buyer friendly or buyer-leaning conditions in these areas. In July 2026, U.S. median rent recorded its 36th consecutive year-over-year decline. Rent for 0-2 bedroom properties across the 50 largest metropolitan areas dropped by 1.4% compared to the previous year, with the median asking rent at $1,695—$24 lower than the prior year. While the median asking rent remains $225 (15.3%) above pre-pandemic levels recorded in July 2019, it has fallen $69 (-3.9%) from its August 2022 peak. This persistent softness is increasingly translating into real savings for renters navigating a market that once felt out of reach. As we enter the summer, we expect the median asking rent to tick up on a monthly basis—a typical seasonal pattern. However, given the surge in multifamily construction over the past few years , we anticipate continued year-over-year declines. In other words, modest rent relief is likely to continue in 2026. All unit sizes saw rent declines In July 2026, the median asking rent for two-bedroom units dropped 1.4% year over year, marking the 38th consecutive month of annual declines. At $1,893, the national median for two-bedroom units now sits $75 (-3.8%) below its July 2022 peak. Despite this extended period of softness, two-bedroom rents remain $282 (17.5%) above their level seven years ago. The rent for one-bedroom units slipped 1.3% in July 2026 on a year over year basis, and now stands at $1,581. This was the 38th consecutive month of annual declines. Rent was $80 (-4.8%) lower than the peak observed during August 2022, but still $201 (14.6%) higher than in July 2019. In July 2026, the median asking rent for studios fell by 1.4%, marking the 35th consecutive month of annual declines. The median rent of studios was $1,435 in July, down by $51 (-3.4%) from its peak, seen in October 2022. Nevertheless, the median asking rent for studios was still $173 (13.7%) higher than seven years ago. Table 1: National Rents by Unit Size, July 2026 Unit Size Median Rent Rent YoY Consecutive Months of Decline Total Decline from Peak Rent Change &#8211; 7 Years Overall $1,695 -1.4% 36 -3.9% 15.3% Studio $1,435 -1.4% 35 -3.4% 13.7% 1-Bedroom $1,581 -1.3% 38 -4.8% 14.6% 2-Bedroom $1,893 -1.4% 38 -3.8% 17.5% Renting a starter home remains a more affordable option than buying in all the largest 50 metros A common question potential first-time homebuyers face is whether it makes sense to continue renting or make a home purchase. One of the top considerations is the financial costs and benefits of renting versus owning, and one approach is to compare the monthly housing costs of renting a home against the costs of buying a home. This approach does not factor in longer-run costs and benefits such as the opportunity cost of not investing upfront closing costs or the equity built over time that tools like the Realtor.com Rent vs. Buy calculator can help households t","published_at":1786960849000,"score":30,"tags":["housing","trend","data"],"heat_signals":["trend","trends","annual"," yoy","year over year","year-over-year"],"importance":3,"selector_reason":"Realtor.com 月度租赁报告显示大城市租金连续三年同比下滑且租买差距收窄。它覆盖全国租赁与入门住宅负担能力，属于常规市场趋势。","section":"national","title_zh":"7月租金报告：租 starter home 仍更便宜","summary_zh":"50大都市租金同比连跌36月，买租价差收窄但租房仍平均省858美元","impact":"neutral","id":"8c5cedfe","fetched_at":1787016904304},{"source_id":"national-mortgage-news","source_name":"National Mortgage News","source_tier":"A","source_weight":7,"source_tags":["rates","macro"],"region":"national","title":"Investor debates Fannie Mae, Freddie Mac valuations","link":"https://www.nationalmortgagenews.com/news/investor-debates-fannie-mae-freddie-mac-valuations","description":"Secondary markets Investor debates Fannie Mae, Freddie Mac valuations By Bonnie Sinnock CloseText About Bonnie twitter bcynic mailto bonnie.sinnock@arizent.com linkedin bonnie-sinnock-115a829 Published August 17, 2026, 4:06 p.m. EDT | Updated August 17, 2026, 6:22 p.m. EDT 2 Min Read Facebook Twitter LinkedIn Email Trends in how Fannie Mae and Freddie Mac's legacy shares trade are similar, but there is some variation in views of the two that recent investor disagreement over their prospects highlights. Processing Content Jon Oksenholt, who holds more of Freddie's shares, recently took issue with Pershing Square's assessment of the two government-sponsored enterprises late last year, in which that company valued Freddie at 13x and Fannie at 16x. Pershing is more heavily invested in Fannie. \"I think Pershing has it backwards,\" Oksenholt wrote in a recent report in which he also noted that he generally agrees with that company's chief executive, Bill Ackman, on other matters concerning the GSEs. While the positions the two investors have taken may be in part due to which GSE they hold more shares in, the disagreement does raise questions about whether one the enterprises objectively has a more favorable outlook as an investment. \"When you look at the capital efficiency, growth and competitive momentum, I think there is a real argument that Freddie should get the higher multiple,\" Oksenholt contends. Oksenholt also said Freddie has been giving Fannie more of a run for its money in some areas. He points to a change in a GSE tax diversification measure used to determine the share of uniform mortgage-backed securities allocated to a particular enterprise. That measure, the deemed issuance ratio, most recently was 52% allocated to Freddie, in contrast to a period between 2019 and 2021 when it was closer to 40%, Oksenholt said. \"Deemed issuance is not a valuation formula, and we are not pretending it is. But it is a meaningful fact: Freddie has gained ground,\" he wrote. \"That should matter when somebody is trying to justify a permanent discount.\" Broader views of Fannie vs. Freddie Fannie is historically a larger player and that plays a big role in why investors like Pershing Square have favored that enterprise. While Fannie and Freddie's stock price moves mirror each other in many ways, the former tends to trade ahead of the latter for that reason. However, there is debate over which enterprise would be able to get in position for a stock offering or conservatorship exit most quickly. Tomas Riva , an analyst at Seeking Alpha that assigned Fannie a relatively higher multiple last year, views that enterprise as being on a faster path to rebuilding enough capital for an exit. Others like Wedbush have viewed Freddie Mac as likely to be able to move more quickly. Those who view Fannie as potentially moving faster are typically focused on its historical scale allowing it to build more dollars worth of capital at a quicker pace. That said, Fannie's size also calls for it to raise more capital than Freddie under existing standards. In addition, Freddie has historically been more active in use of credit-risk transfer structures that can reduce capital requirements. Current officials appear comfortable with CRT as a means of reducing capital requirements, in contrast to their oversight chief during Trump's first term. Overall, analysts do have som
