 to face delays in selling property, all signs of a sector still struggling to find its footing amid a deep and persistent supply glut. Photo credit: Pexels/ThisIsEngineering And while the life sciences industry itself is seeing signs of improvement , landlords aren’t seeing those indicators translating to leasing activity. The industry has “decoupled from demand on the ground,” Alexandria Chairman Joel Marcus said on the company’s earnings call Tuesday. Since the stock market opened Tuesday, Alexandria stock has dropped roughly 4% to just under $49, which still places it above the $40 year-to-date low point this past April. Alexandria and its competitors continue to struggle amid a life sciences real estate sector simply unable to regain momentum during a prolonged supply glut. Rent for labs was down 5.3% year-over-year to $64 per SF, and vacancy crept up to 24.3%, according to Cushman Wakefield’s Q2 life sciences report . While Alexandria’s Q2 leasing volume did just surpass 1M SF, beating the average of the last few quarters and jumping 60% from the sluggish leasing performance last quarter, the news was decidedly mixed. Rental rates dropped 0.7%, a much more palatable drop than the 15% decline the company posted in the first quarter, but not a reversal back into growth territory. Occupancy slid to 86.9%, a noticeable decline from 91.7% in Q1 of 2025, and impacting NOI. The tenant mix of this quarter’s leases demonstrates some of the shifts that life sciences landlords have had to make, bringing in tenants outside the traditionally defined world of biotech. Just 6% of the tenants that signed leases this quarter were public biotech companies, a step up from last quarter, when none signed new deals with Alexandria, but still indicative of fundraising troubles. Public biotech right now is “slow and lagging,” Alexandria Executive Vice President Hallie Kuhn said. Roughly 40% of leasing came from medical product and device firms, the “picks and shovels” of the biotech olution that was taken offline after Bisnow noted the word “moratorium” appeared in the URL. “I do not assign the web links, so I guess that came from IT,” Chesapeake city attorney Catherine Lindley said in a July 30 email. “I will inquire about it as that is misleading. As you see in the resolution, we do not use the word moratorium!” To Pause Or Not To Pause Loudoun County has been the center of digital infrastructure for nearly as long as the asset class has been around. As an early connectivi","published_at":1785885442000,"score":14,"tags":["data-center","policy","regulator"],"heat_signals":[],"importance":4,"selector_reason":"全球最大数据中心集群所在地Loudoun County考虑暂停新设施申请，反映数据中心扩张与地方基础设施、政治和法律约束的正面冲突。该政策可能影响美国最重要的数据中心市场，属于重要CRE监管信号。","section":"cre","title_zh":"Loudoun 拟暂停 data center 开发","summary_zh":"全球最大 hub 讨论冻结新申请，合法性存疑但项目延误风险上升","impact":"short-neg","id":"106ce8c3","fetched_at":1785894879241,"cre_subcategory":"数据中心"},{"source_id":"realtor-news","source_name":"Realtor.com News","source_tier":"A","source_weight":6,"source_tags":["housing"],"region":"national","title":"Homebuilders Accuse Data Centers of Snapping Up Prime Land at ‘Impossible Prices’","link":"https://www.realtor.com/news/real-estate-news/homebuilders-accuse-data-centers-of-snapping-up-prime-land-at-impossible-prices/","description":"Data center developers could be complicating the housing market by outbidding homebuilders, at least in one fast-growing area.","published_at":1785788602000,"score":11,"tags":["data-center","construction","developer"],"heat_signals":["housing market"],"importance":4,"selector_reason":"数据中心开发商以高价争夺土地，可能挤压快速增长地区的住宅开发用地，直接连接数据中心扩张与住房供应矛盾。该冲突具有跨行业和区域土地市场影响，评为4分。","section":"cre","extended_window":true,"title_zh":"Data center 高价抢地挤压 builder","summary_zh":"开发商被指以 impossible prices 抢 prime land，住宅供地压力加剧","impact":"short-neg","id":"ca3dd743","fetched_at":1785894879241,"cre_subcategory":"数据中心"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_ e0b4","fetched_at":1785894879241},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"M/I Homes doubles down on specs as other builders pull back","link":"https://www.housingwire.com/articles/mi-homes-earnings-q2-2026/","description":"As many homebuilders scale back on spec inventory to preserve margins, M/I Homes continues to hew to a contrarian strategy: More specs. During earnings calls for Q4 2025 and Q1 2026, M/I Homes executives reiterated their plans to maintain a spec-heavy playbook. The company’s Q2 2026 earnings call last week indicates that the M/I team will stay the course as an outlier. About 78% of M/I Homes’ second-quarter orders were for spec homes. During the call, M/I Homes executives said that the company kept spec inventory high due to the current rate and demand environment. The builder, ranked 11th in HousingWire’s Homebuilder Rankings , leaned on this steady supply of spec homes to boost overall sales volume. Executives say the company has been able to maintain elevated spec sales while controlling risk by improving construction cycle time to reduce overhead costs and concentrating inventory on precisely the right lots, home floor plans and elevations. Still, this spec inventory typically requires generous incentives and mortgage rate buydowns to sell. As a result, margins on these homes tend to fall below those of build-to-order homes. “That number varies from market to market. In nearly every one of our 17 markets, the margins on to-be-builts are better. In some, just slightly. In others, it could be one or 200 basis points, perhaps more in a couple of select instances. In general, the margins are higher on to-be-builts. It’s just that the differences can vary pretty meaningfully market to market,” Robert Schottenstein, M/I Homes Chairman, CEO and President, said during the earnings call. The company’s emphasis on spec homes highlig e. However, M/I Homes doesn’t take a one-size-fits-all approach. The builder leverages its own in-house mortgage business, M/I Financial, LLC, to carefully align incentives to each community and buyer profile. More affordable communities typically require greater closing cost assistance, while other buyers may prefer adjustable-rate mortgages (","published_at":1785876519000,"score":25,"tags":["housing","national","earnings","homebuilder"],"heat_signals":["mortgage rate","new home sales","year over year","new home sales"],"importance":3,"selector_reason":"M/I Homes坚持高规格库存策略，反映建商在库存、利润率与销售速度之间的判断分歧。属于单一建商经营策略，对全国市场有参考价值但不构成系统性变化。","section":"national","title_zh":"M/I Homes 逆势加码 spec homes","summary_zh":"Q2 订单 78% 来自 spec homes，销量受益但 incentives 压制 margins","impact":"neutral","id":"9cad8cb0","fetched_at":1785894879241},{"source_id":"national-mortgage-news","source_name":"National Mortgage News","source_tier":"A","source_weight":7,"source_tags":["rates","macro"],"region":"national","title":"Proprietary reverse loans overtake HECMs for 54% market share","link":"https://www.nationalmortgagenews.com/news/proprietary-reverse-loans-overtake-hecms-for-54-market-share","description":"Reverse mortgages Proprietary reverse loans overtake HECMs for 54% market share By Spencer Lee CloseText About Spencer twitter Spencer_NYC linkedin spencer-lee-journo Published August 04, 2026, 4:00 p.m. EDT 3 Min Read Facebook Twitter LinkedIn Email The government-backed Home Equity Conversion Mortgage is seeing proprietary products noticeably eat into its share of the reverse lending market, with the latter now providing much of the business momentum, according to new analysis. Processing Content Both HECM endorsements and secondary market issuances contracted on a year-over-year basis in July. New endorsements declined to 2,034, compared to 2,064 in June and 2,365 in July 2025, representing drops of 1.5% and 14%, respectively, a monthly report from Reverse Market Insights said. Meanwhile, new ap
