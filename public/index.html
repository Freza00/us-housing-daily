hat after the first MOU deal broke apart in June and we were fighting with Iran during market hours, the 10-year yield and oil prices have moved more in lockstep than before. Last week was very wild. Last week I talked about what could get mortgage rates toward 8%. The case for 8% mortgage rates From last weekend: For me, the case for 8% is simple: the conflict needs to get worse. We are seven months into this conflict, and we have other parties joining the war, as the Houthis bombed a Saudi Arabian airport over the weekend. President Trump has said nothing will change until the midterm elections are over. So, if there is no deal with Iran, the odds of things getting worse are in play . Last week, the Houthis continued their attacks on Saudi Arabia, and the bond market and oil prices jumped together. Also, the economic data was good, as I wrote about here , and Fed members sounded very hawkish last week in their speeches, which was a perfect storm to drive yields higher to levels we haven’t seen since 2006. On Saturday, President Trump rejected the peace plan from Iran, then on Sunday he said there should be more talks this week, so it might be very crazy until the midterms are over — something I talked about on this episode of the HousingWire Daily podcast. The key level for me now is 5.40% on the 10-year yield; if the drama over the next few weeks takes us there, that is your base case for 8% rates, but a key level too. Mortgage spreads Mortgage spreads are now front and center and the most important housing story this year and the next two years. Mortgage spreads improving have not only kept rates below 8%, but also made it easier to get below 7% in the future. If mortgage spreads get worse again, it would be the most negative story in the housing market. But for now, mortgage spreads are closer to normal and haven’t gotten terrible lately, even though we are higher than the lows in 2026. Historically, mortgage spreads have ranged from 1.60% to 1.80%. Last week, oss PJM and in most major data center markets, the requirement for flexibility could unlock access to power on far shorter timelines. Power grids are designed to ensure demand doesn&#039;t exceed supply during short periods of peak use. But typically, electricity demand only comes close to exceeding supply a few days a year. Curtailment means developers no longer have to wait years for grid connections while utilities build the infrastructure needed to accommodate the most extreme demand scenarios. And with speed to power becoming the sector’s top priority, DICE panelists said developers are increasingly willing to accept curtailment if it means bringing projects online earlier. “I have seen more and more developers … where they are willing to take some curtailment risk, the data center is going to be more flexible in exchange for faster power,” sa","published_at":1790526308000,"score":14,"tags":["data-center","national","trend","developer"],"heat_signals":["fed"],"importance":5,"selector_reason":"AI数据中心用电激增正在迫使区域电网和开发商重新考虑负荷管理，可能影响全国数据中心建设和电力基础设施。该问题连接AI投资、能源供给和大型商业地产开发，具有系统性影响。","section":"cre","title_zh":"数据中心寻求灵活用电应对电网压力","summary_zh":"AI需求推高电力负荷，PJM拟要求新数据中心可削减用电，开发难度上升","impact":"short-neg","id":"5908ee6d","fetched_at":1790558669421,"cre_subcategory":"数据中心"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"More Developments Getting Mothballed Because Of Spiking Costs","link":"https://www.bisnow.com/news/national/construction-development/spiking-material-costs-diesel-prices-are-canceling-construction-projects","description":"More Developments Getting Mothballed Because Of Spiking Costs September 27, 2026 | 12:50 pm ET Jarred Schenke, Atlanta Developers around the country are continuing to scrap commercial projects as soaring diesel prices and the rising cost of construction materials are breaking the budgets of long-planned undertakings. Earlier this month, packaging-making giant Georgia-Pacific abandoned plans it announced in 2024 to turn part of its 51-story headquarters building into apartments, retail and entertainment space, canceling its high-profile Atlanta conversion project over construction costs. A major redevelopment project in Virginia is also being abandoned after the site’s owner proposed to terminate its approved plan for more than 700 residential units plus retail. In August, a New York developer pivoted from its plans to build a luxury residential high-rise in Philadelphia to instead pursue a 34K SF retail building — nearly four years after it bought the vacant parcels. Those are just a few of a spate of cancellations that reflect an economic environment defined by tariffs , higher fuel prices and elevated interest rates, which are putting pressure on some developers and slowing pipelines. A continued increase in costs could impact some of the hundreds of billions of dollars in private commercial projects that are underway in the U.S. ”It’s just too much sometimes for them, and they back out of the project,” Daniel Perdomo, CEO of electrical services provider 5 Points Electrical, said in an interview. “You put a lobster in regular cold water, and then you heat it up, and the lobster doesn’t know it until it gets cooked,” he said. “That’s what’s happening now.” Unsplash/Mads Eneqvist Prices of construction-related materials skyrocketed 13.3% year-over-year in the U.S., nearly five times the rate last year, according to a Cushman Wakefield Construction Insights report released earlier this month. A handful of metals led the price surge, with aluminum climbing nearly 41%, copper nearly 40% and nonferrous metals at 38.5%. Steel and aluminum have faced a 50% import tariff since June 2025. Materials are increasingly replacing labor as the primary driver of construction cost growth, according to Cushman, as material prices climb and wage growth moderates. Those cost increases will ultimately be borne by the developer, Perdomo said. “We have to transfer the costs to the clients. It’s a domino effect that is going all the way to the top,” he said. The conflict in Iran has pushed the price of diesel — which powers construction site equipment and is critical for transporting materials to and from jobsites — above $6.50 per gallon this past week, an all-time high and up nearly $3 per gallon from two years ago, according to the U.S. Energy Information Administration . “Diesel affects the transportation of every other input,” Associated Builders and Contractors economist Zack Fritz said. “If diesel prices ever come back to earth — they’re at the highest they’ve ever been — you&#039;d see an immediate fall in materials prices.” The Trump administration is weighing several options, short of an export ban, to bring down diesel prices, Politico reported on Friday, citing people familiar with the matter. Google Maps Georgia-Pacific Center in Downtown Atlanta Total U.S. construction starts in August fell nearly 25% to a seasonally adjusted annual rate of $1.34T, according to data compiled by Dodge Construction Network . Commercial construction starts dropped 37.6%, led by canceled offices and parking garages. The trend is largely a reversal and normalization from a July surge but still reflects how the commercial sector is grappling with labor shortages and rising material prices, Dodge Director of Economic Research Sarah Martin said in a press release last week. In Atlanta, Georgia-Pacific had planned to build 400 apartment units on the upper floors of its 50-story skyscraper, along with 125K SF of retail and entertainment space. But Georgia-Pacifi","published_at":1790527842000,"score":21,"tags":["mixed-asset","national","construction","trend","developer"],"heat_signals":["trend","annual","year-over-year"],"importance":4,"selector_reason":"建设成本和柴油价格飙升正在导致全国商业地产项目搁置，反映开发周期和投资回报面临普遍压力。该趋势影响多个地产子行业和新项目供给，重要性高于单一项目动态。","section":"cre","title_zh":"建设成本飙升，更多开发项目被搁置","summary_zh":"柴油、材料与利率上涨导致A cle from Dive Brief Why this Illinois owner entered property management T2 Capital Management has hired Kairos Living alum Tyler Yates to lead Base Living, its new operations group. Published Sept. 25, 2026 Leslie Shaver Senior Reporter Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Getty Images Listen to the article 3 min This audio is auto-generated. Please let us know if you have feedback . While some firms are jettisoning property management because they lack sufficient scale, others have jumped into the sector . Count T2 Capital Management among those deciding to operate apartments. On Sept. 21, the Wheaton, Illinois-based private equity real estate investment firm with more than $1.6 billion in assets under management announced it was launching a property operations platform called Base Living, according to a press release. T2 has continued to grow to become a fully integrated private equity real estate company, principal Aaron Tink told Multifamily Dive. “And this is the next step of that evolution for us.” At launch, Base Living manages more than 850 apartment units across three properties in Florida and a 1 million-square-foot industrial property. “We chose these in Florida because we felt that these three were best suited for us to increase capacity, increase and maximize revenue and increase performance,” Tink said. “These were three that we felt were struggling and that we've owned for a while. We wanted to come in and really get our hands dirty and make a difference.” Over time, Base Living plans to expand across T2’s portfolio, including into student housing, where the private equity firm has a track record. “T2 has been opportunistic in terms of asset class, and what we've been targeting,” Tink said. “We have had a lot of success in the student housing space historically, and really want to keep that as a focus and pursue that.” In conjunction with the Base Living launch, the firm hired Tyler Yates as director of property management, responsible for the operational and financial performance of the firm’s property portfolio, per the release. He manages 24 new associates across Illinois, Indiana and Florida and is supported by eight members of T2's corporate team. Yates, who reports to Tink, has more than a decade of residential operating experience across student housing and multifamily. Most recently, he was vice president of central operations and asset management at Kairos Living, where he oversaw a national portfolio of 5,000-plus homes and 125-plus full-time employees, per the release. “From sourcing deals to due diligence and underwriting to closing deals to executing a business plan, and now down to the day-to-day operations and day-to-day management of our properties, we'll be able to get into the weeds and be hands-on and proactive and really do our best to control everything that we can control for our assets,” Tink said. “So we're really excited about it.” T2 is using artificial intelligence to handle the resident journey from prospect engagement and tour scheduling to maintenance coordination and lease renewals, per the release. “Our goal is to make that work [property management] as efficient and clean and as quick as possible,” Tink said. “We're not trying to replace humans by any stretch of the imagination, but to help on-site staff use their time more efficiently.” Click here to sign up to receive multifamily and apartment news like this article in your inbox every weekday. Add us on Google Share Copy link Email LinkedIn X/Twitter Facebook Print License Filed Under: Operations , People","published_at":1790365260000,"score":10,"tags":["multifamily","trend","institutional"],"heat_signals":[],"importance":3,"selector_reason":"T2 Capital Management新设运营团队并吸纳Kairos Living背景人才，显示住宅物业管理平台正在加强内部运营能力。它对多户和租赁资产管理有一定行业意义，但规模和财务影响有限。","section":"institutional","extended_window":true,"title_zh":"Illinois业主T2 Capital进军物业管理","summary_zh":"T2设立Base Living，首批管理850套公寓及1M SF工业物业以提升运营 er, Compass claims that vendors like Courted, Brokerkit and Brokermetrics package its “agent-level production metrics, agent-level listing information, agent-level closing transaction history and agent roster movements into platforms that brokerages buy and use to target and recruit [its] agents.” “While we support MLS data sharing for cooperation, the data we provide the MLS for cooperation purposes should not be sold to a technology company like Courted that in turn further sells that data with their agent recruitment technology,” the letter states. Compass goes on to claim that the MLS “powering competitor recruitment tools strays far beyond the core mission of the MLS.” “The MLS exists to facilitate real estate transactions—not to weaponize our operational data against us for competitor poaching,” the letter states. Due to this, Compass asks the MLSs to confirm which data feeds they provide these brokerage recruiting software companies, to exclude any data related to its listings or agents from any data the MLSs give to Courted and any other brokerage recruiting software and to clarify Compass’s right as a participant broker to opt out of non-IDX/VOW vendor data distribution. The letter notes that its franchise broker owners would be allowed to opt-in to sending this data to these vendors if they so choose. “Mandatory listing submission to the MLS when the MLS profits from selling that same agent level data to technology companies that sell to brokerages that recruit our agents, results in damage claims to the MLS,” the letter states. Compass goes on to state that it will release any claims against the MLSs if they agree to these requests and implement the action within 30 days of receiving the letter. This is not the first time Compass International Holdings has sent a letter to the MLSs requesting changes to their practices. In March, Compass, along with Rocket and Redfin sent a letter to MLSs urging them to adopt policies that support pre-marketing and phased
