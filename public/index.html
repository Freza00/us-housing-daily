 not yet eligible for delivery to either GSE. On social media, Pulte said he is in discussions with FICO over pricing. &#8220;Just like I asked Vantage, I have asked FICO to provide competitive pricing to the market for their FICO 10T product. It seems that FICO is not interested in offering competitive costs but instead uses various means to increase price on the American people. So unnecessary,&#8221; he said. FICO did not immediately reply to HousingWire ’s request for comment. Pulte also announced changes in the secondary market via social media. He wrote that &#8220;ALL Mortgage Backed Securities (MBS), ALL Credit Risk Transfers (CRT), and ANY Securitized Product issued by Fannie Mae and Freddie Mac will now carry a VantageScore, in addition to a FICO score.&#8221; &#8220;One company cannot hold the market hostage. Americans and Investors and the market want change,&#8221; Pulte said. Classic FICO remains on manual underwrites Effective immediately, lenders may originate and deliver eligible loans to the GSEs using either the traditional Classic FICO score model or VantageScore 4.0. But when a lender elects to use VantageScore 4.0, both GSEs require that the same credit score model be used for all borrowers on the loan. Lenders cannot mix Classic FICO and VantageScore 4.0 scores among borrowers on the same mortgage. For manually underwritten loans, lenders and sellers must continue to use Classic FICO only and comply with existing minimum credit score requirements. Fannie has updated its loan-level price adjustment ( LLPA ) matrix to include pricing guidance for loans delivered using the VantageScore 4.0 credit score model. Meanwhile, Freddie updated Exhibit 19, Credit Fees, to add base grids and custom mortgage insurance option grids specific to each credit score model, including VantageScore 4.0. HousingWire reached out to the GSEs and FHFA for more details on the pricing grids, but they did not immediately respond. According to the GSEs’ websites, pricing adjustments for FICO scores are applied to VantageScore 4.0 scores at 20 points higher. The top purchase tier for FICO remains at 780+, equivalent to the new VantageScore bucket of 800+. This makes official what had already been the practice among lenders participating in a limited rollout. For lenders not yet ready to operationalize VantageScore 4.0, Fannie and Freddie will continue to accept Classic FICO scores. Both GSEs stated that the changes are effective immediately. Alternatives to the tri-merge model? Under both policies, if a lender chooses VantageScore 4.0 for an eligible loan, the lender must request VantageScore 4.0 from each of the three national credit repositories when ordering a new credit report. Pulte said discussions on alternatives to the tri-merge model are happening with the credit bureaus. “We have been meeting with various credit bureaus, and this week we will be meeting with all three credit bureaus — Experian , Equifax , and TransUnion — and are focused on lowering costs while also studying using only a single credit report and bi-merge credit reporting. Stay tuned,” he posted on X . “In the era of AI, credit bureaus and credit scoring companies need to add real value to hold their prices, much less dramatically increase their prices,&#8221; he added. &#8220;Unfortunately, I see these companies more focused on pricing, which could lead some to ruin, than innovation and compet","published_at":1788971373000,"score":19,"tags":["housing","national","policy","regulator"],"heat_signals":["fed","freddie mac","fannie mae"],"importance":4,"selector_reason":"Fannie Mae和Freddie Mac向所有获批单户贷款机构开放VantageScore 4.0，扩大了可用信用评分模型。该变化直接影响住房信贷准入和贷款定价，属于重要联邦住房金融政策，因此评为imp=4。","section":"national","title_zh":"GSE全面开放VantageScore 4.0","summary_zh":"Fannie Mae与Freddie Mac批准的single-family lenders均可选择新评分模型","impact":"long-pos","id":"ee51a90a","fetched_at":1789003374039},{"source_id":"inman","source_name":"Inman News","source_tier":"A","source_weight":8,"source_tags":[ ir kids to the South in ‘baby chaser’ boom","link":"https://www.housingwire.com/articles/parents-follow-kids-south-baby-chaser-boom/","description":"Raleigh, North Carolina, ranked as the nation’s top market for “baby chasing,” a term that describes the trend of older Americans who are moving to be closer to their children and grandchildren. That&#8217;s according to data released Wednesday by NewHomeSource and Zonda via their 2026 Baby Chaser Index. The annual index identifies housing markets that are experiencing growth among both younger Americans and their parents’ generation. The report comes as one in four baby boomers say they plan to retire near their children or grandchildren. Raleigh moved from third to first on this year’s list, supported by household growth among both generations. The region added 24,000 households in 2025, putting it ahead of Nashville, Houston, Dallas and Charlotte. The top 10 baby chaser markets in 2026 are Raleigh; Nashville ; Houston; Dallas; Charlotte; Boise, Idaho; Charleston, South Carolina; Austin; San Antonio and Atlanta . “Family connections are a powerful driver of where people decide to live, especially for older Americans with more freedom and flexibility to choose their new location,” Ali Wolf, chief economist at NewHomeSource and Zonda, said in a statement. “While the life stages driving the Baby Chaser phenomenon hold strong, the markets best positioned for continued strength will be those that can meet the needs of young families settling down and the parents who want to spend time with their grandbabies.” The baby chaser markets tend to combine strong job markets with quality-of-life factors such as educational opportunities, healthcare and recreational options. Housing affordability also plays a role, providing younger buyers with more accessible homeownership options while allowing older households to manage long-term savings and living costs. Carolinas and Texas see strong growth Markets in the Carolinas and Texas continued to perform strongly in this year’s index. Charleston and Charlotte climbed two and three positions, respectively, while Raleigh moved into the top spot. In Texas, Houston and Dallas moved ahead of Austin, which saw slower demand among older households. Florida markets were absent from this year&#8217;s top 10 after Orlando led the index and Jacksonville ranked sixth in the previous year’s report. “Our consumer research reveals that the number one reason retirees choose to relocate is to be close to family,” said Shaun McCutcheon, a Charlotte-based vice president at Zonda Advisory. “The Carolinas’ ability to attract young professionals and working families, while offering housing options for older buyers who follow, helps explain why the region continues to dominate the Baby Chaser index.” The Baby Chaser Index evaluates U.S. metropolitan areas with populations of at least 750,000 residents. It analyzes short- and long-term population trends among two age cohorts using U.S. Census Bureau data. Its methodology considers year-over-year growth to measure recent momentum, along with population growth since 2010 to provide a longer-term view of market trends. Market data matches index trends HousingWire Data for the week ending Sept. 4 shows that buyers in these fast-growing metros are encountering more inventory , longer selling times and frequent price reductions. That could give seniors considering a move closer to children and grandchildren more flexibility than the strong population growth numbers alone might suggest. Raleigh-Cary had a median list price of $484,069, with 5,134 single-family homes listed for sale. Homes spent an average of 102 days on the market, while 48% of listings had experienced a price cut. Charlotte showed a similar pattern, with a $479,000 median list price, 5,843 homes available and 54% of properties seeing price cuts. The median time on market was 63 days. Housing costs varied considerably across the markets. San Antonio had the lowest median list price at $334,599, followed by Houston at $370,000 and Dallas at $440,000. At the higher end, Boise had a median list price of $594,","published_at":1788989560000,"score":35,"tags":["housing","carolinas","trend"],"heat_signals":["texas","houston","dallas","austin","san antonio","trend","trends","annual","year-over-year","housing market"],"importance":3,"selector_reason":"Raleigh等南部市场吸引年长居民追随子女迁移，显示Sun Belt住宅需求存在人口结构驱动。该指数覆盖多个市场但不是全国宏观指标，因此评为imp=3。","section":"sunbelt","title_zh":"Raleigh领跑“baby chaser”迁居潮","summary_zh":"Raleigh新增24,000户，子女与父母两代人口增长推升Sun Belt住房需求","impact":"long-pos","id":"45a17899","fetched_at":1789003374039},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Lender Requests Receiver For X Denver Apartment Building Near Coors Field","link":"https://www.bisnow.com/news/denver/multifamily/lender-requests-receiver-for-x-denver-apartment-building-near-coors-field","description":"Lender Requests Receiver For X Denver Apartment Building Near Coors Field September 9, 2026 | 5:33 pm ET Cassidy Ritter, Denver Google Maps X Denver apartment building at 3000 and 3100 Inca St. The developers of X Denver, a 455-unit apartment building near Coors Field, defaulted on a $170M loan tied to the property. Now the lender is requesting that a receiver be appointed to manage the property, according to the Denver Business Journal . X Denver was built in 2021 at 3000 and 3100 Inca St. by Chicago-based The X Co. The property features a fitness center, coliving suites, coworking spaces, offices and conference rooms, according to X Denver’s website. In January 2022, real estate developer The X Co. secured a $170M loan for X Denver from an LLC tied to New York-based Mack Real Estate Group , according to the DBJ. The loan matured three years later. MREG claims that The X Co. defaulted on the loan and didn’t pay the outstanding principal balance, interest and “any and all other outstanding amounts payable under the Loan Documents,” the DBJ reported, citing court documents. Debt on the Denver property and another The X Co. building in Phoenix was listed for sale in May 2025 . The X Co. did not respond to a request for comment from Bisnow . MREG is asking the court to appoint Trigild IVL LLC as the receiver of X Denver. Trigild is a national commercial real estate asset management firm that specializes in court-appointed receivership , turnaround services and bankruptcy. Trigild was recently appointed the receiver of Republic Plaza , Denver’s tallest tower at 370 17th St., after the building’s owner defaulted on a $280M loan. The X Co. built X Denver 2, a 22-story apartment building in Five Points at 2134 Arapahoe St., in 2023. The building sold in November 2024 for about $102M to CIM Group , which loaned The X Co. $105.3M to build X Denver 2, according to previous Bisnow reporting . The X Co.’s portfolio lists additional properties in Chicago, Houston, Phoenix, Tampa, Florida, and Oakland, California. The company’s project pipeline spans 3,000 beds and more than $1B of asset value, according to its website. Denver’s apartment market has been inundated with new units coming online, causing vacancy rates to jump and concessions to rise . Earlier this month, an 11-story apartment building in downtown Denver sold for $110M . Continue reading this story with a free account Log in or register Contact Cassidy Ritter at cassidy.ritter@bisnow.com Related Topics: Denver apartments , Mack Real Estate Group , The X Company , Trigild IVL , X Denver 2","published_at":1788989598000,"score":18,"tags":["multifamily","distress","lender"],"heat_signals":["houston","vacancy"],"importance":3,"selector_reason":"Denver一栋455套公寓因1.7亿美元贷款违约，贷款方申请指定接管人，体现高利率环境下多户资产的再融资压力。单一项目且金额低于2亿美元，因此评为imp=3。","section":"sunbelt","title_zh":"X Denver违约，贷款方申请receiver","summary_zh":"455套公寓拖欠$170M贷款，Mack关联贷款方寻求法院接管资产","impact":"short-neg","id":"e5c4e436","fetched_at":1789 ssachusetts-data-center-restrictions-executive-order","description":"Healey&#039;s New Data Center Rules Make Massachusetts A Tough Sell For Developers September 9, 2026 | 7:26 pm ET Dan Rabb, Data Centers Massachusetts has largely sat out the data center building boom that has swept across much of the country. An executive order signed by Gov. Maura Healey this week ensures that, for better or worse, the commonwealth will remain on the sidelines. Flickr/Maura Healey/Emily Boyle Gov. Maura Healey at the Tuesday press conference on data center rules The Healey administration unveiled an executive order Tuesday that puts up new hurdles for developers looking to build data centers in Massachusetts. While stopping short of an outright moratorium, the order requires developers to reach agreements with local communities before obtaining state permits and imposes a series of new requirements intended to limit impacts on the electrical grid and environment. Healey said at a press conference that the measures are meant “to protect residents, to protect our ratepayers, and to block any irresponsible development so that our communities and our state are in a good place.” The order comes as data centers emerge as a hot-button political issue and as states increasingly seek to regulate the expansion of artificial intelligence infrastructure. But while data center construction has boomed elsewhere, Massachusetts has seen almost none of this growth, with just one large-scale project in the planning stages. Industry leaders say Healey’s action is likely to further entrench this trend, effectively ensuring that few, if any, developers will be looking to move data center projects forward in the commonwealth. “There’s a high burden for developers to meet,” said Gregory Sampson, a partner with Sullivan Worcester who leads the firm’s permitting and energy and infrastructure practices. “In the short run, this is going to keep most big developers out of the state.” The executive order applies to data center projects of 25 megawatts or more and is designed to give municipalities veto power over new data center developments and limit projects’ impact on the state’s already strained electrical grid and high utility bills. It comes months after the Healey administration stopped accepting applications for the state’s data center sales tax exemption. According to the order, developers will now be required to cover the costs associated with delivering the massive amounts of power they require. Failing that, they will be required to pay into a ratepayer protection fund intended to prevent the cost of grid upgrades from being passed along to other electricity customers. The order also significantly expands local oversight. State agencies are prohibited from issuing “permits or authorizations” for data center projects unless the developer can negotiate a community benefit agreement with its host municipality. The order also bars nondisclosure agreements between state agencies and data center developers. “We’re giving communities full voice in the process,” Healey said Tuesday. “Unless the community says yes to a data center, we’re saying no.” Healey is one of many governors responding to a swell of community opposition and concern over the industry’s impact on power grids, natural resources and quality of life in surrounding communities. Data center development is proving to be deeply unpopular with voters from both parties, and it is becoming a national political issue that could sway the balance of power in November’s midterm elections. New York Gov. Kathy Hochul signed a statewide data center moratorium in July , the first in the country. Last month, Pennsylvania Gov. Josh Shapiro signed an executive order restricting data center development in the state, while Texas Gov. Greg Abbott mandated a pause on all data center grid connections . State legislatures from Maine to Virginia have considered similar measures in recent months. These other initiatives have largely come in states experiencing a surge in data center construc","published_at":1788996411000,"score":20,"tags":["data-center","policy","regulator"],"heat_signals":["texas","permits","trend"],"importance":4,"selector_reason":"马萨诸塞州通过新的数据中心规则和行政命令，可能显著影响开发审批、能源需求和项目选址。它属于对全国数据中心扩张具有参考意义的重要监管政策，因此评为imp=4。","section":"cre","title_zh":"Massachusetts新规提高data center门槛","summary_zh":"开发商须先获社区协议并满足电网环保要求，项目落地难度上升","impact":"short-neg","id":"b61d8377","fetched_at":1789003374039,"cre_subcategory":"数据中心"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Charles Cohen Plans $350M Office Project After Resolving Debt Ordeal","link":"https://www.bisnow.com/news/south-florida/office/charles-cohen-new-office-complex-fort-lauderdale-after-debt-resolution","description":"Charles Cohen Plans $350M Office Project After Resolving Debt Ordeal September 9, 2026 | 8:08 pm ET Chloe Gallivan, South Florida Real estate billionaire Charles Cohen is catching a second wind after resolving his debt woes with longtime lender Fortress Investment Group this summer. Courtesy of Cohen Brothers Realty Corporation of Florida The development encompasses two office buildings and two parking garages. Cohen Brothers Realty Corp., which Cohen leads as CEO and chairman, is planning a $350M office project in Dania Beach near Fort Lauderdale-Hollywood International Airport. Plans include two 10-story office towers with floor plates that will span roughly 14K SF, connected with terraces and promenades and two four-story parking garages, according to a news release. The project, named Office Center of the Americas, will feature 400K SF of office space designed by Nichols Brosch Wurst Wolfe Associates. Cohen is planning to build the project in two phases over about four years. New York-based Cooper Horowitz is handling construction financing. &#34;We couldn&#039;t be more excited about this new project,&#34; Cohen said in a statement. OCTA will rise at 1805 and 1815 Griffin Road, replacing the 60K SF, four-story office building within the Design Center of the Americas campus that Cohen purchased in 2006 for $13.7M, according to the Broward County property appraiser. The 40-year-old building will be torn down to make way for the new development, a spokesperson for Cohen confirmed. While the current building is attached to the DCOTA brand, it isn&#039;t connected to the neighboring showroom and office at 1855 Griffin Road, which Cohen lost in a UCC foreclosure auction in 2024 to Fortress Investment Group after defaulting on a $534M loan originated in 2022. Fortress has since invested roughly $3M in updating the campus, tapped Atlanta-based Jamestown to lead asset management, leasing and marketing, and landed a $45M refinancing loan . Cohen and Fortress were locked in a bitter, yearslong legal dispute over the 2022 loan after the foreclosure, which didn’t satisfy the outstanding debt. The Le Méridien hotel in Dania Beach, as well as a New York property and a UK theater company, were also sold as part of the foreclosure. But those properties didn&#039;t come close to paying off the balance of the loan, and Fortress went after Cohen, who had personally guaranteed the debt. It accused him of shielding assets and even had a yacht temporarily seized. A New York court ordered Cohen last year to pay Fortress $187.3M to cover the guarantee. While he started to sell off properties to cure the debt, Fortress accused him of slow-walking the process and began pushing for a receiver to take over his company&#039;s 12M SF portfolio. Amid the dispute, Cohen Brothers lost its 350K SF Manhattan headquarters to its lender in a foreclosure auction in January. In March, a New York state judge ordered Cohen to come up with $135M in 45 days, or a chunk of his company assets would be handed over to Fortress. The dispute came to a close when Cohen satisfied the outstanding balance in June after selling multiple office buildings and pieces of land in New York, paying off the $187.3M, plus interest and attorney fees. But Cohen wasn’t ready to forgive and forget. Later that week, he filed a separate lawsuit against Fortress, seeking $203.7M in damages over what he claimed was a botched sale process. But without the cloud of forced payments hanging over him, the developer is getting back on his feet in South Florida, where the project announcement marks his second new endeavor this summer. After resolving a $10M foreclosure claim for a site he owns in Downtown West Palm Beach in July, the billionaire has revisited plans for another 400K SF office project, The Real Deal reported . Continue reading this story with a free account Log in or register Contact Chloe Gallivan at chloe.gallivan@bisnow.com Related Topics: Charles Cohen , Cohen Brothers Realty , Co","published_at":1788998882000,"score":14,"tags":["office","florida","construction","developer"],"heat_signals":[],"importance":4,"selector_reason":"Charles Cohen计划投入3.5亿美元建设办公项目，此前还刚解决与Fortress的债务问题。金额超过2亿美元且涉及办公地产融资修复和新增开发，因此评为imp=4。","section":"cre","title_zh":"Charles Cohen筹划$350M佛州办公项目","summary_zh":"Dania Beach将新增400K SF office space，债务问题解决后重启扩张","impact":"long-pos","id":"5bd9ed31","fetched_at":1789003374039,"cre_subcategory":"办公"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"SL Green Selling SoHo Building For $226M","link":"https://www.bisnow.com/news/new-york/capital-markets/sl-green-selling-soho-building-for-223m","description":"Little-known Natora Group purchased the 13-story building at 110 Greene St.","published_at":1788983996000,"score":14,"tags":["office","nyc","deals","institutional"],"heat_signals":[],"importance":4,"selector_reason":"SL Green以2.26亿美元出售纽约SoHo一栋13层办公楼，提供了核心城市办公资产定价和交易流动性的信号。单笔交易超过2亿美元，符合行业中等重要交易标准，因此评为imp=4。","section":"cre","title_zh":"SL Green拟以$226M出售SoHo大楼","summary_zh":"110 Greene St. 13层物业易主，买方为Natora Group，交易细节有限","impact":"neutral","id":"37d71079","fetched_at":1789003374039,"cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Solar Projects In Georgia Meet Local Backlash As Data Centers Drive Demand For Power","link":"https://www.bisnow.com/news/atlanta/energy/solar-power-projects-georgia-local-backlash-data-centers-demand","description":"Solar Projects In Georgia Meet Local Backlash As Data Centers Drive Demand For Power September 9, 2026 | 7:55 pm ET Jarred Schenke, Atlanta Solar companies are racing to develop thousands of acres of new panel farms in Georgia as they seek to take advantage of expiring federal tax incentives and help satiate booming power demand in the state. Pixabay/Bru-nO But despite being a clean energy source, some projects are facing local backlash, with at least one facing a lawsuit. The opposition is partly because solar farms help generate power for data centers, which are experiencing their own national backlash , sustainability experts say. As the data center surge continues, developers are increasingly looking to solar for a portion of the power. Data centers are expected to drive an additional terawatt of utility-scale solar power in the next decade, TechCrunch reported , citing energy consulting firm BloombergNEF. Opposition is “just growing with the growth of solar,” said David Hess, a professor and sustainability studies chair at Vanderbilt University . “But I think it’s merging with the data center sentiment.” Georgia Power obtained approval last year to expand the state’s energy grid by 10 gigawatts by 2030, mainly to accommodate the influx of data centers . Renewable energy sources make up 6% of the energy generated by Georgia Power’s grid, but the utility is working to boost solar as demand increases. Earlier this year, it approved 16 solar power purchase agreements . Backlash at the local level could threaten to derail those efforts. As of September, eight developers have 16 planned utility-scale solar projects in Georgia, according to data center analysis firm Cleanview. The Georgia Department of Community Affairs is reviewing at least four solar projects in Georgia as part of its development of regional impact program, including San Diego-based EDF Renewable Energy’s proposed 1,600-acre site in Miller County . The community affairs agency reviews and approves land use changes for development projects that will impact regional infrastructure. Other projects under consideration include a 150-acre, 27-megawatt solar park by Atlanta-based Inman Solar in Effingham County, about 20 miles north of the new Hyundai Metaplant near Savannah ; a 2,500-acre solar farm by San Antonio-based OCI Energy about 25 miles south of Albany; and two NextEra Energy Resources projects . NextEra spokesperson Alexis Jones said in an email that its $430M Amber Meadow project , once built, is expected to contribute about $49.2M to local taxing authorities over the life of the project. Many developers are looking to take advantage of renewable energy incentives that are being phased out under President Donald Trump’s One Big Beautiful Bill Act . Under the law, solar projects must be in service by the end of 2027 to qualify for a tax credit, unless a developer can show that construction began by July 4, 2026. Google Maps The site along Five Bridge Road in Ocilla, Georgia, where NextEra Energy is planning a solar farm But local residents are worried the projects could hurt nearby property values, create stormwater and other ecological issues, and change the makeup of a community. In July, an Irwin County couple sued NextEra and the local development authority over plans for Amber Meadow, alleging the project is utilizing tax incentives for a project that they say will ultimately harm their neighboring property values, TGV News reported . In June, the Lee County Board of Commissioners rejected a request for Inman Solar to build a nearly 16 MW, utility-scale solar farm on 123 acres just outside of Albany, Georgia, following concerns over environmental impacts, property rights and industrializing a residential area, The Albany Herald reported . And in Bacon County, residents have protested a plan by Nashville-based Silicon Ranch to develop a $300M solar farm that would generate enough electricity for 50,000 houses, The Atlanta Journal-Constitution reported ","published_at":1788998157000,"score":17,"tags":["data-center","atlanta"],"heat_signals":["san antonio","fed"],"importance":3,"selector_reason":"乔治亚州太阳能项目因数据中心带来的电力需求增长而扩张，同时遭遇地方反弹。它揭示Sun Belt数据中心发展对土地、能源和地产开发的外溢影响，因此评为imp=3。","section":"cre","title_zh":"Georgia太阳能项目遭地方反弹","summary_zh":"data center推高电力需求，太阳能项目面临诉讼与阻力，扩张成本或上升","impact":"short-neg","id":"1aeb7983","fetched_at":1789003374039,"cre_subcategory":"数据中心"},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Centerspace, Independence Realty Trust merge to creat $8B REIT","link":"https://www.multifamilydive.com/news/apartment-reit-merger-centerspace-independence-realty-trust/829884/","description":"The IRT-Centerspace combination shows that multifamily REITs of all stripes are chasing scale as the costs of doing business continue to rise. &nbsp;","published_at":1788955249000,"score":13,"tags":["multifamily","deals","institutional"],"heat_signals":[],"importance":5,"selector_reason":"Centerspace与Independence Realty Trust合并后将形成约80亿美元的多户住宅REIT。大型REIT整合直接改变行业规模、资本效率和竞争格局，因此评为imp=5。","section":"institutional","title_zh":"Centerspace与IRT合并组建$8B REIT","summary_zh":"multifamily REIT通过规模整合应对运营成本上升，行业M&A继续加速","impact":"long-pos","id":"e93aeb89","fetched_at":1789003374039},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Wh
