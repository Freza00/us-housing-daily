ed 8,747 units in Q3, down from 42,166 a year ago and bringing the year-to-date total to 260,500 units. Average monthly rent increased by 1% year-over-year in Q3 and 0.5% quarter-over-quarter to $2,268. Construction completions totaling 85,300 units fell by 11% year-ovrer-year in Q3. Multifamily investment volume rose by 140% year-over-year in Q3 to $112.3 billion due to a $69.6 billion entity-level transaction. Excluding that deal, volume was down by 8.7%. Individual asset sales declined by 15% to $32.7 billion, while portfolio sales increased by 20.7% to $10 billion.","published_at":1793376000000,"date_precision":"day","published_date":"2026-10-30","modified_at":0,"extraction":"semantic","canonical":"https://cbre.com/insights/figures/q3-2026-us-multifamily-figures","content_hash":"3dc2cae6a5fcdccfa6718057ddc98d4fb73d0078ebe14b3ce69890cad21b7aef","access":"public","source_family":"cbre-research","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1793569048991,"id":"056cdd1a2300514a","acquisition_window":{"lower":1793307600000,"upper":1793566800000},"score":16,"tags":["multifamily","national","data","construction"],"heat_signals":["year-over-year","vacancy"],"evidence_status":"article","keep":true,"importance":5,"section":"national","duplicate_of":null,"selector_reason":"CBRE全国Q3多户数据覆盖空置率、吸收、租金、完工和投资交易，且披露实体级大额交易对总量的影响。","title_zh":"美国多户住宅空置率升至 4.7%，租金小幅上涨","summary_zh":"CBRE Research 称，2026 年第三季度美国多户住宅空置率升至 4.7%，租金同比上涨 1% 至每月 2,268 美元；新完工量同比下降 11%，投资交易额受一笔大型实体层面交易显著拉动。","impact":"neutral","evidence_quote":"The overall multifamily vacancy rate rose by 40 basis points (bps) in Q3 to 4.7%, as completions outpaced net absorption for the first time since Q4 2025.","evidence_basis":"body","cre_subcategory":null},{"source_id":"realpage-research","source_name":"RealPage Analytics","source_tier":"B","source_weight":9,"source_tags":["multifamily","data","trend"],"region":"national","title":"Realpage Economy Express Episode 74","link":"https://www.realpage.com/analytics/economy-express-episode-74/","description":"Realpage Economy Express Episode 74 by Arben Skivjani Posted October 30, 2026 in Insights The Fed held rates steady, but two dissenters wanted a hike now, and strong growth and rising inflation are keeping a December increase firmly on the table. The Federal Reserve held rates steady in a 10-to-2 vote, with both dissenters wanting an immediate quarter-point hike. Its statement also upgraded growth to strong and called inflation still elevated, while Warsh declined to commit on December until he sees more data. Fed funds futures now put the odds of a December hike at about 82%, down slightly after Thursday's data but higher than a week ago. Thursday's GDP report showed the economy grew 3.4% last quarter, faster than expected, with investment doing more of the lifting than consumers. The Fed's preferred inflation gauge rose 3.6% from a year ago in September, with core climbing to 3.1% and prices jumping 0.5% in a single month. Income and spending figures for September show take-home pay fell after inflation and spending went nowhere, with gasoline taking the biggest bite. Consumer surveys diverged, as Conference Board confidence jumped while University of Michigan sentiment barely moved and respondents there expect inflation near 5% over the next year. The National Association of Realtors reported pending home sales at the lowest level on record, as mortgage rates remain above 7% and buyers stay on the sidelines. Housing starts data show apartment starts down about 26% from a year ago, though permits picked up in September, suggesting some builders are lining up projects for later. For more information on the state of the U.S. Economy, including forecasts, watch all the episodes of the Economy Express series. SHARE Tags Economy Express Previous Article Gateway Markets Regain Development Momentum","published_at":1793430010000,"source_family":"realpage-research","is_research":true,"required_source":false,"mu The latest forecast calls for a continuation of the slow-but-steady revival, with an ongoing supply-side adjustment offsetting historically weak office demand growth,” Phil Mobley , national director of office analytics at CoStar Group, said in a statement. CoStar projects absorption to be around 20M SF in 2026 and 9M SF in 2027, up from 13M SF and 5M SF, respectively, from its previous forecast released in August. Office vacancy is expected to end the year around 13.6%, just below the previous 13.7% forecast. High-quality properties will continue to drive pricing higher, with CoStar predicting asking rents will climb 2.5% in each of the next few quarters before rising closer to 3% annually. The upward revision to the rent forecast was more to do with a shift in inventory accounting than an expected boost in activity. “The upgraded projection for office rent growth has less to do with the overall reduction in supply caused by the removal of non-competitive space and more to do with the dramatic slowdown in new construction,” Mobley said. CoStar Group The office market has continued to rebound from pandemic-era lows, driven by demand from tech firms and the more general push from tenants into high-quality spaces. Leasing activity totaled 63.8M SF in the third quarter, up 4% from last year and on track to exceed a 2022 record, according to CBRE . Absorption was positive for the 10th consecutive quarter at just under 5M SF at the end of September, with the construction pipeline a paltry 1.5M SF, down 76% from the prior year. Rent growth is accelerating at its fastest pace since 2016, according to CBRE. Analysts at CoStar said the risks on either side of its forecast seemed roughly in balance in terms of probability, but with larger downside risks in terms of size. “Persistent inflation and higher interest rates could slow economic growth further and precipitate additional business cost-cutting even in an environment of continued economic expansion,” Mobley said. “Furthermore, the recent productivity gains evident in knowledge work could accelerate with further adoption of artificial intelligence , resulting in lower demand for some types of knowledge workers.” Continue reading this story with a free account Log in or register Related Topics: CBRE , Colliers , CoStar , CoStar Group , Phil Mobley","published_at":1793291947000,"source_family":"bisnow","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1793309852130,"id":"df54aeeedfdb93db","late_discovery":true,"acquisition_window":{"lower":1793221200000,"upper":1793307600000},"score":17,"tags":["office","national","data","trend"],"heat_signals":["forecast","rent growth","vacancy"],"date_precision":"timestamp","modified_at":1793291964000,"extraction":"semantic","canonical":"https://bisnow.com/news/national/office/office-recovery-moving-faster-than-expected-costar-finds","content_hash":"d82010b0927fd3efe3f396c72b8bc4a10d5b78fcd0d3669a2b8709e9c3013c09","access":"public","evidence_status":"article","keep":true,"importance":4,"section":"cre","duplicate_of":null,"selector_reason":"CoStar上调办公吸收预测并下调空置率预期，基于需求改善和新供给近乎停滞，属于重要全国办公市场修订。","title_zh":"CoStar 上调办公楼吸纳预测","summary_zh":"CoStar 上调办公楼吸纳预测，预计 2026 年约为 2,000 万平方英尺、2027 年为 900 万平方英尺；机构将预测调整归因于需求改善及新建供应放缓，预计优质物业继续推动租金上涨。","impact":"long-pos","evidence_quote":"CoStar projects absorption to be around 20M SF in 2026 and 9M SF in 2027, up from 13M SF and 5M SF, respectively, from its previous forecast released in August.","evidence_basis":"body","cre_subcategory":"办公"},{"source_id":"northmarq-research","source_name":"Northmarq Research","source_tier":"B","source_weight":9,"source_tags":["multifamily","data","trend"],"region":"national","title":"Las Vegas multifamily rent pressures persist despite leasing gains","link":"https://northmarq.com/insights/insights/las-vegas-multifamily-rent-pressures-persist-despite-leasing-gains-q3-2026","description":"Download the full Q3 2026 Las Vegas multifamily market report here.HighlightsLas Vegas multifamily operating conditions remain soft, with elevated vacancy, rising concessions and declining rents. Net absorption has exceeded deliveries in 2026, but the improved supply-demand balance has yet to translate into rent growth.Stabilized vacancy reached 9.1% at the end of the third quarter, flat from the prior quarter but up 20 basis points from one year earlier. Vacancy remains 30 basis points below the year-end 2025 rate.Asking rents averaged $1,479 per month by the end of September, down 1.4% year over year and 0.9% lower than in the prior quarter, the second consecutive quarterly decline.Investment sales volume during the third quarter totaled roughly $209 million across five deals, with Class B properties accounting for four of the five deals. The year-to-date median sale price reached $225,900 per unit.Las Vegas multifamily market overviewLas Vegas multifamily fundamentals remain under pressure despite improved absorption and a slowdown in new deliveries in 2026. Net absorption has exceeded deliveries by roughly 650 units year to date, after trailing them by nearly 1,700 units in 2025. Absorption has already surpassed the full-year 2025 total, supported by continued job growth, while completions have slowed as fewer projects remain under construction. The recovery has been concentrated in the suburbs, where Summerlin/Spring Valley, Henderson and Enterprise/South Paradise captured more than two-thirds of that demand with less than half of the metro’s inventory. Rent growth has been slower to rebound. Asking rents remain below year-ago levels, with the steepest declines in older urban core submarkets, where vacancy is above 10%. By contrast, rents in suburban submarkets remain close to year-ago levels.Investment activity in 2026 has become concentrated in two of the suburban submarkets that are leading the leasing recovery. Summerlin/Spring Valley and Henderson accounted for roughly three-quarters of metro sales volume through the third quarter, up from 43% in 2025. Third-quarter activity followed the same pattern, with three of the five trades located in those two submarkets. Pricing has remained stable in Summerlin/Spring Valley and Henderson, with median sale prices near $250,000 per unit in both submarkets, above levels elsewhere in the metro, where recent trades have skewed toward smaller, older properties. The median price across the Las Vegas region has remained near its 2025 level, highlighting the influence of property location on pricing trends.Employment:Area employers added 21,400 jobs year over year. Image Area payrolls increased by 21,400 jobs year over year as of the third quarter of 2026, a gain of 1.8%. Hiring slowed from the first half of the year and held below the 10-year average annual growth rate of 2.4%.Professional and business services remained the leading source of new jobs, adding 10,900 positions and expanding 6.3% year over year. Education and health services added 5,400 jobs, while leisure and hospitality, the largest local employment sector, shed 2,200 positions, a 0.7% decline.Hyve Solutions, a manufacturer of storage and AI computing hardware, is establishing a new production facility in North Las Vegas. The project, the largest of four business expansions approved for state tax incentives in August, is expected to create 240 jobs over the next two years.Forecast: Employers are forecast to add roughly 20,000 jobs in 2026, a 1.7% increase, maintaining a pace similar to 2025. Development and permitting:Developers completed roughly 600 units in the third quarter. Image Developers completed roughly 600 units in the third quarter, all in Central Las Vegas. Year-to-date deliveries total around 2,600 units, down 23% from the same period in 2025. Roughly 6,100 units were under construction at the end of the third quarter, down more than 25% from the end of 2025, which is expected to ease supply pressure on operators heading into 2027. Six active projects in Spring Valley total more than 2,000 units.Multifamily permitting activity is regaining momentum. Developers pulled permits for 1,130 multifamily units in the third quarter, more than double the total from one year earlier.Forecast: Developers are expected to complete roughly 4,000 units in 2026, in line with both the 2025 total and the 10-year average.Vacancy:Vacancy ended the third quarter at 9.1% Image Stabilized vacancy ended the third quarter at 9.1%, up 20 basis points year over year. Despite the annual increase, net absorption has exceeded deliveries in 2026, pushing vacancy down 30 basis points from year-end 2025.Class B properties account for roughly 70% of net absorption this year, with vacancy flat year over year at 9.0%. Class A vacancy edged up to 8.4%, while Class C, the only tier with negative net absorption in 2026, posted the highest vacancy at 10.0%.Suburban submarkets continue to pull away from the urban core. Summerlin/Spring Valley, Henderson and Enterprise/South Paradise captured more than two-thirds of net absorption this year, each with vacancy below 7.5%. Las Vegas Strip vacancy rose 170 basis points year over year to 12.1%.Forecast: Vacancy is expected to tick up 20 basis points to 9.3% by year-end 2026, though it would remain 10 basis points below the year-end 2025 rate.Rents:Asking rents averaged $1,479 per month. Image Asking rents averaged $1,479 per month in the third quarter, down 0.9% from the prior quarter and 1.4% year over year. Rents have declined for two consecutive quarters, erasing the gain recorded at the start of the year.Rent performance varied across submarkets. Henderson posted a modest 1.0% year-over-year rise to $1,580 per month, while rents declined in each submarket with vacancy rates above 10%, including a 5.0% annual drop on the Las Vegas Strip.Class A was the only tier to post annual rent growth, up 0.7% to $1,772 per month. Class B, the largest tier by unit count","published_at":1793376000000,"date_precision":"day","published_date": ss Bluejack’s footprint. The financing follows Lantern’s corporate reorganization of Bluejack and the creation of Bluejack Management Partners, an integrated owner-operator platform overseeing club operations, residential construction, hospitality, and development. Bluejack’s properties include Bluejack National in Montgomery—home to the first Tiger Woods-designed golf course in the U.S.—and Bluejack Ranch, a 914-acre community in Aledo. “We’ve spent the last twelve years proving what Bluejack can be, and now we have the leadership and partners to think much bigger about what comes next,” said Andy Mitchell , chairman and CEO of Bluejack Management Partners and Lantern. “Fortress understands what we’ve built, believes in where we’re going and brings tremendous experience to the table.” Introducing: The POWER 50 Our new program spotlights North Texas executives under 50 shaping the region’s future. Nominations are open through Nov. 13. Learn More SpendRule Secures $4 Million Seed Round Led by Mark Cuban’s Radical Investments Dallas-based AI contract enforcement startup SpendRule has raised $4 million in seed funding led by Mark Cuban ’s Radical Investments, with participation from Zeal Capital Partners. The round brings total funding to $6 million and will support product engineering, expansion into new enterprise verticals, and deeper deployment across healthcare systems. “Companies spend all this time negotiating contracts, but what’s the point if nobody checks whether they’re getting what they paid for? That’s the problem SpendRule is solving,” Cuban said. Founded in 2025, SpendRule provides an automated verification platform that reconciles negotiated contract terms against incoming vendor invoices before payments clear. The platform currently oversees $2.91 billion in annual purchased services spend across 2,187 business relationships for healthcare providers including OSF HealthCare, Kettering Health, MemorialCare, and MUSC Health. Rainier Partners Acquires Richardson-Based Apex Insurance Services Seattle-based private equity firm Rainier Partners has acquired Apex Insurance Services, a managing general agency (MGA) platform serving the Texas non-standard auto insurance market. Headquartered in Richardson, Apex operates five MGA brands: Apollo MGA, Apollo Specialty, Newstar General Agency, Excellent Insurance Services, and Ignition Insurance Services. Founded in 2014, Apex distributes through more than 1,000 independent agent contracts across roughly 2,500 retail locations statewide. With Rainier’s backing, the company plans to expand its footprint in Texas, enter adjacent geographic markets, evaluate new product lines, and pursue add-on acquisitions among personal lines MGAs. “We’ve built an enduring and diversified insurance platform at Apex, and we see significant runway for further expansion in the state of Texas and beyond,” said Apex CEO Bryan Ward. “Rainier’s experience in our industry, as well as their compatible team culture and roll-up-your-sleeves approach to partnership, made us confident they were the right partners for Apex’s next stage of growth.” SAP Selects Addison for Integrated North Texas Regional Headquarters Enterprise software firm SAP will consolidate its North Texas operations into a regional hub at Spectrum Center in Addison. The consolidation brings approximately 1,000 employees from SAP’s Plano office and SAP Concur’s Allen office to 5080 Spectrum Drive. Set to open in mid-2027, the facility will house regional business operations, software development, and a customer experience center showcasing SAP's enterprise software and AI applications. “This new space in Addison is a meaningful moment for our team,” said Michael May, managing director for SAP's U.S. South Market Unit. “It will be a space built around the things that matter most to us: our people, our customers, and our communities. Being able to do that in one of the country’s top innovation and tech talent hubs makes it even more exciting.” The Addison City Council approved an incentive package on Oct. 13 that includes a capital investment grant of up to $500,000, alongside performance milestones. SAP joins a growing cluster of enterprise tech firms along the Lower Dallas North Tollway, including Google, ServiceNow, Tanium, and Hitachi Digital Services. Aspire Fiber Secures $80 Million Credit Facility and $75 Million Equity Commitment Moorpark, California-based internet provider Aspire Fiber has closed an $80 million senior secured credit facility led by Third Coast Bank and CIBC. Concurrently, equity partner Arenova Capital increased its equity commitment to $75 million to accelerate the buildout of Aspire’s 10 Gigabit-capable fiber network across Southern California. Arenova, which is based in Dallas, originally backed Aspire’s founding team in February 2026. The new debt capital will fund underground fiber infrastructure in Santa Clarita following the company's initial network launch in Moorpark. “We are deeply excited about the additional capital and partnership from Arenova, Third Coast Bank, and CIBC,” said Stephen Weatherford, founder and CEO of Aspire Fiber. “As a local company, we see first-hand the underinvestment in 100% fiber infrastructure in Southern California and we see huge opportunities to use the capital to accelerate our vision.” Disruptive Launches $10 Billion Flagship Fund for Late-Stage Tech Investments Dallas-based global investment firm Disruptive Technology Advisers has launched the Disruptive Flagship Fund, a $10 billion vehicle targeting growth- and late-stage private technology companies. The fund plans to back roughly 10 companies, with all","published_at":1793389128000,"source_family":"d-magazine","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1793569048991,"id":"0b765a4f4795f413","acquisition_window":{"lower":1793307600000,"upper":1793566800000},"score":7,"tags":["mixed-asset","institutional","texas","fundraising","deals"],"heat_signals"  gives some context as to why this quarter’s ranking elevates markets where a dollar goes farther. Nineteen of the top 20 markets are in the Midwest and Northeast where, in many cases, prices still pencil out against local incomes. The Fall 2026 WSJ/Realtor.com Housing Market Ranking highlights the markets best positioned to deliver stability, livability and long-term value. Fall 2026 WSJ/Realtor.com Housing Market Ranking Volatile mortgage rates through the summer and into the fall squeezed buyer budgets and many would-be buyers decided to opt out of the market once again. Sellers responded by pricing lower and reducing prices more, but transaction volume still suffered. In this challenging affordability environment, metros that combine lower prices with steady demand, improving supply conditions, and strong quality-of-life fundamentals continue to stand out. The Fall 2026 ranking evaluates the 200 most populous U.S. metropolitan areas using a combination of housing market conditions and broader measures of economic health and livability. Together, these factors highlight markets where buyers are more likely to find balance in an otherwise challenging housing environment. Rank Metro Pop. Unemployment Rate (%) Median Home Listing Price Sept 2026 1 Appleton, Wis. 249,876 2.8% $405,000 2 South Bend-Mishawaka, Ind.-Mich 324,538 3.8% $322,000 3 Canton-Massillon, Ohio 400,246 3.7% $266,000 4 Manchester-Nashua, N.H. 433,415 2.9% $580,000 5 Lancaster, Pa. 563,159 2.9% $401,000 6 Waterbury-Shelton, CT 463,349 5.7% $404,000 7 Reading, Pa. 440,072 4.0% $327,000 8 Fort Wayne, Ind. 466,258 3.0% $309,000 9 Rockford, Ill. 337,242 5.0% $269,000 10 Harrisburg-Carlisle, Pa. 617,427 3.4% $327,000 11 Springfield, Mass. 464,338 5.3% $377,000 12 Springfield, Mo. 500,694 3.4% $347,000 13 Grand Rapids-Wyoming, Mich 1,183,645 3.9% $400,000 14 Portland-South Portland, Maine 577,635 2.7% $625,000 15 Bridgeport-Stamford-Norwalk, Conn. 978,179 4.9% $776,000 16 Kalamazoo-Portage, Mich 263,795 4 s/","description":"SEG Solar Acquires Two Manufacturing Buildings Totaling 1.1 MSF in Tomball, Texas by Taylor Williams October 30, 2026 October 30, 2026 6 TOMBALL, TEXAS —SEG Solar has acquired two manufacturing buildings totaling roughly 1.1 million square feet within Northwest 99 Business Park in Tomball, a northwestern suburb of Houston. Building 2 totals 450,320 square feet and is under construction as a planned conversion into an additional solar module manufacturing facility. Building 3 totals 704,080 square feet and is also under construction to support the company’s distribution operations. Jon Lindenberger and Barkley Peschel of Colliers represented SEG Solar, which previously purchased the 425,360-square-foot Building 1 within the park in 2025, in both transactions. Clay Development owns Northwest 99 Business Park. Facebook Twitter Linkedin Email previous post Alliance Residential Underway on 388-Unit Multifamily Project in Spring, Texas next post Matthews Brokers Sale of Magnolia Marketplace Shopping Center in New Orleans You may also like JLL Negotiates $32.5M Sale of Power Retail Center... October 30, 2026 Matthews Brokers Sale of Magnolia Marketplace Shopping Center... October 30, 2026 Alliance Residential Underway on 388-Unit Multifamily Project in... October 30, 2026 Realty Capital Breaks Ground on 289-Unit Apartment Complex... October 30, 2026 Core Acquisitions, Midloch Investment Buy Shopping Center Near... October 30, 2026 Thorofare Capital Provides $16.5M Acquisition Loan for Houston... October 30, 2026 CBRE Brokers $18.3M Sale of Five Retail Properties... October 30, 2026 Resource Realty Negotiates Sale of 53,252 SF Industrial... October 30, 2026 Construction Resources Co. Signs 32,000 SF Industrial Lease... October 30, 2026","published_at":1793370724000,"source_family":"rebusiness-online","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1793569048991,"id":"5f69f082a8cc5e36","acquisition_window":{"lower":1793307600000,"upper":1793566800000},"score":9,"tags":["industrial","texas","deals","construction"],"heat_signals":["texas","houston"],"date_precision":"timestamp","modified_at":1793370725000,"extraction":"semantic","canonical":"https://rebusinessonline.com/seg-solar-acquires-two-manufacturing-buildings-totaling-1-1-msf-in-tomball-texas","content_hash":"361f21bc1fb07966c4a32cfec417a1d7845b8e02d619da10ee8834f10dba038d","access":"public","evidence_status":"article","keep":true,"importance":4,"section":"cre","duplicate_of":null,"selector_reason":"SEG Solar收购Tomball两栋合计110万平方英尺制造建筑，并转为太阳能组件制造和配送用途，属于大型工业资产交易。","title_zh":"SEG Solar 收购德州 Tomball 两栋厂房","summary_zh":"SEG Solar 收购休斯敦西北郊 Tomball 的 2 栋制造业建筑，总面积约 110 万平方英尺；其中一栋计划改造为太阳能组件制造设施，另一栋将支持公司的分销业务。","impact":"long-pos","evidence_quote":"SEG Solar has acquired two manufacturing buildings totaling roughly 1.1 million square feet within Northwest 99 Business Park in Tomball, a northwestern suburb of Houston.","evidence_basis":"body","cre_subcategory":"工业"},{"source_id":"northmarq-research","source_name":"Northmarq Research","source_tier":"B","source_weight":9,"source_tags":["multifamily","data","trend"],"region":"national","title":"Washington, D.C. multifamily sales volume surpasses 2025 total","link":"https://northmarq.com/insights/insights/washington-dc-multifamily-sales-volume-surpasses-2025-total-q3-2026","description":"Download the full Q3 2026 Washington, D.C. report here.HighlightsOperating conditions in the Washington, D.C., region were mixed in the third quarter as annual job losses narrowed for a second straight quarter and new deliveries slowed. Permitting reached its highest year-to-date level since 2022.Regional vacancy declined 10 basis points during the third quarter to 5.7%, the first quarterly decline in more than a year, though it remains 60 basis points above one year ago. Vacancy in the District and Suburban Maryland has eased for two straight quarters.Asking rents were unchanged from the second quarter at $2,233 per month but remain down 0.8% year over year. Northern Virginia rents were nearly flat from a year ago, and the decline in Class A rents has narrowed.Investment activity strengthened in the third quarter, with 16 properties trading for $1.8 billion, pushing year-to-date volume above the 2025 total. The year-to-date median sale price is $297,800 per unit.Washington, D.C. multifamily market overviewThe Washington, D.C., multifamily market showed further signs of stabilization in the third quarter as a slower pace of new deliveries coincided with easing employment losses. Vacancy declined for the first time in more than a year, although the improvement has yet to translate into rent growth. Northern Virginia continued to record the region's tightest vacancies and more stable rents, while the District and Suburban Maryland posted a second consecutive quarter of declining vacancy. Performance also varied across property classes, with Class A vacancy retreating and rent declines moderating, while Class C vacancy continued to rise. These trends point to a gradual improvement in operating conditions, though ongoing employment losses and uneven property performance continue to limit the recovery.Investment activity continued to strengthen across the Washington, D.C., region in the third quarter, with Fairfax County accounting for much of the increase in sales volume. Earlier in the year, transactions in Fairfax were concentrated in newer apartment communities, but activity shifted toward older Class B and Class C properties in the third quarter. These properties accounted for roughly three-quarters of the county's quarterly dollar volume. While sales volume in Fairfax remained near first-quarter levels, the county's median price declined from approximately $418,000 to $305,000 per unit. This decline largely reflects the changing mix of properties sold rather than evidence of a broader reduction in property values.Employment:Annual job losses eased for a second straight quarter. Image The region continues to post net job losses, although the deepest cuts have already occurred an conditions have begun to stabilize in recent periods. During the past 12 months, total employment has contracted by 1.6% with losses totaling more than 50,000.Federally linked sectors remained the largest drag on employment in the third quarter. Government payrolls were down 30,600 positions year over year, a 4.4% decline, while professional and business services, the federal contractor base, was down 16,700 positions, or 2.1%, roughly half the annual loss recorded in the first quarter.In Suburban Maryland, AI platform company Cloudforce announced an expansion of its National Harbor headquarters in August, with plans to add 250 jobs.Forecast: Regional employment is projected to decline by roughly 10,000 jobs in 2026, a 0.3% contraction, compared with a 10-year average annual gain of 0.5%.Development and Permitting:Year-to-date completions totaled roughly 7,600 units. Image Developers completed roughly 2,500 units in the third quarter, about 30% below the quarterly average of 2025. Suburban Maryland accounted for roughly 1,200 of those units, followed by Northern Virginia at around 900 units and the District at approximately 450 units.Nearly 16,000 units are under construction, with Northern Virginia containing roughly 8,800 units, more than the District and Suburban Maryland combined. Developers pulled permits for 10,200 multifamily units year to date, surpassing new deliveries for the first time since 2022.Forecast: Regional deliveries are projected to total roughly 9,000 units in 2026, about 20% below the 10-year average.Vacancy:The vacancy rate ended the third quarter at 5.7%. Image Regional vacancy fell 10 basis points during the third quarter to 5.7%, the first quarterly decline in more than a year, but remains 60 basis points above one year ago. The pullback came as deliveries ran below the 2025 pace and annual job losses narrowed.Northern Virginia remained the tighter subregion at 4.7%, though vacancy is up 70 basis points over the past year. Vacancy in the District and Suburban Maryland has eased for two straight quarters to 6.5%, down from the first-quarter peak of 6.7%.Class A vacancy remained the tightest segment at 5.1%, while Class C had the highest vacancy rate at 7.2%, up 110 basis points year over year. Class C vacancy has risen for eight consecutive quarters, while Class A has eased for two.Forecast: Regional vacancy is projected to reach 5.8% by year-end 2026, 30 basis points above the level recorded at the end of 2025. Rents:Regional asking rents are down 0.8% year over year. Image Regional asking rents ended the third quarter at $2,233 per month, unchanged from the second quarter and up just 0.1% year to date. Rents have fallen year over year for the fourth consecutive quarter, though the pace of decline has eased.Northern Virginia rents fell 0.4% year over year to $2,341 per month, while rents in the District and Suburban Maryland declined 1.5% to $2,147 per month. Northern Virginia has outperformed the rest of the region for two consecutive quarters.Class A rents remained the weakest, falling 1.2% year over year, though the decline has narrowed from 1.8% in the second quarter. Class B and Class C rents decreased 0.9% and 0.5%, respectively.Forecast: Regional asking rents are projected to rea","published_at":1793376000000,"date_precision":"day","published_date":"2026-10-30","modified_at":1793376000000,"extraction":"structured","canonical":"https://northmarq.com/insights/insights/washington-dc-multifamily-sales-volume-surpasses-2025-total-q3-2026","content_hash":"107f163e8d23aeaab18b3a93647166e77ac7d553ca2cd553af5ddf64a3709816","access":"public","source_family":"northmarq-research","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1793569048991,"id":"1ab5be0680570b40","acquisition_window":{"lower":1793307600000,"upper":1793566800000},"score":38,"tags":["multifamily","national","data","deals"],"heat_signals":["fed","permits","forecast","trend","trends","annual","year-end","year over year","rent growth","vacancy"],"evidence_status":"article","keep":true,"importance":4,"section":"national","duplicate_of":null,"selector_reason":"华盛顿多户市场显示空置率环比下降、租金同比变化、许可回升及年初至今交易额超过上年全年。","title_zh":"华盛顿特区多户住宅年内销售额已超 2025 年","summary_zh":"Northmarq Research 称，华盛顿特区区域第三季度空置率降至 5.7%，但租金同比仍下降 0.8%；第三季度 16 处物业成交，总额 18 亿美元，年内交易额已超过 2025 年全年。","impact":"neutral","evidence_quote":"Investment activity strengthened in the third quarter, with 16 properties trading for $1.8 billion, pushing year-to-date volume above the 2025 total.","evidence_basis":"body","cre_subcategory":null},{"source_id":"realpage-research","source_name":"RealPage Analytics","source_tier":"B","source_weight":9,"source_tags":["multifamily","data","trend"],"region":"national","title":"Gateway Markets Regain Development Momentum","link":"https://www.realpage.com/analytics/metro-permits-september-2026/","description":"Gateway Markets Regain Development Momentum by Chuck Ehmann Posted October 29, 2026 in Multifamily Construction Permits Whether you call them “gateway” markets or the “sexy six,” the primary coastal hubs that traditionally attract the majority of domestic and international capital are well represented among the top markets for annual multifamily permitting in September’s data release from the U.S. Census Bureau, and in most cases are dramatically increasing their permitting activity. New York continues to lead the nation for multifamily permitting with 37,691 units permitted in the year-ending September, an increase of more than 13,000 units from last year or a jump of 52.7%. Los Angeles again ranked #2 with about 18,000 units permitted, almost doubling their annual total from one year ago. Washington, DC remained among the top permitting markets at #5 in September, increasing their annual permitting by 47.4% or about 3,900 units, while Seattle slipped to #11 this month but still increased their multifamily permitting total by 36.7% or roughly 2,400 units. Rounding out the “sexy six,” Boston ranked #16 among Realpage’s top 150 markets with a 44.7% annual increase (+2,303 units) to 7,460 units, while the Bay Area markets of San Jose, Oakland and San Francisco ranked well down the list individually but would have ranked #7 with a combined total of 11,543 units permitted, up 46.8% from last year (+5,407 units). Conversely, among the secondary high-growth markets, development activity has stalled or fallen back as top 10 markets Phoenix and Atlanta permitted close to the same amount as last year, while Dallas, Houston, Austin and Miami decreased their permitted unit counts by a combined 11,004 units. Only Raleigh/Durham saw a significant increase in multifamily permitting (+3,153 units) among the non-gateway top 10 markets. Despite declining permitting in four of September’s top 10 markets, their combined total of 148,456 units was up 14.5% from last September for an increase of 18,765 units. Compared to August, the top 10 markets’ annual permitting total was little changed (-0.7%). In addition to the expanding top 10 and the gateway markets mentioned, other markets with significant increases in annual units permitted in September were Kansas City (+2,187 units), West Palm Beach (+1,932 units), College Station-Bryan, TX (+1,762 units), Tacoma (+1,712 units) and Fort Worth (+1,672 units). Orlando (-4,572 units) led for annual permitting decreases, followed by Dallas and Houston. Significant decreases occurred in Columbus, OH (-2,911 units), Riverside-San Bernardino (-2,162 units), San Diego (-2,100 units) and Lakeland-Winter Haven, FL (-1,995 units). Permitting by Place Below the metro level, eight of August’s top 10 permit-issuing places returned to this month’s list with the first five remaining in order. The list of top individual permitting places (cities, towns, boroughs, and unincorporated counties) generally includes the principal city of some of the most active metro areas. The city of Los Angeles again led the nation for multifamily permitting at the local level with New York’s three most active boroughs returning among the top five. The city of Phoenix also placed in the top five while the city of Fort Worth jumped to #6 in September from #10 last month. The cities of Austin and Atlanta each slipped one spot as the cities of Columbus and Houston fell out of the top 10 entirely. The cities of Miami and Denver joined the top 10 list this month, permitting about 5,500 units apiece. Among the top 10 metros for multifamily permitting, Dallas, Houston, Washington, DC and Raleigh/Durham were not represented on the top 10 list of permitting places, although the core cities of Dallas, Houston, Raleigh and Durham were among the top 20 places. Washington, DC’s multifamily permitting was spread diversely around that metro’s area. SHARE Tags Multifamily Permits Previous Article Apartment Market Turns a Corner as Supply Finally Exhales Next Article Realpage Economy Express Episode 74","published_at":1793430010000,"source_family":"realpage-research","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1793569048991,"id":"484048d156b14387","acquisition_window":{"lower":1793307600000,"upper":1793566800000},"score":17,"tags":["multifamily","national","construction","data"],"heat_signals":["annual","year-end"],"date_precision":"timestamp","modified_at":1793520011000,"extraction":"semantic","canonical":"https://realpage.com/analytics/metro-permits-september-2026","content_hash":"77a147859fdb35065c12f0708cbbcbe5b53f19e5351442c00c6be2f8aa29a53d","access":"public","evidence_status":"article","keep":true,"importance":4,"section":"national","duplicate_of":null,"selector_reason":"基于Census许可数据，显示纽约、洛杉矶、华盛顿等Gateway市场多户许可显著回升，反映开发周期变化。","title_zh":"沿海门户城市多户住宅许可明显回升","summary_zh":"RealPage Analytics 称，纽约、洛杉矶、华盛顿特区等门户市场多户住宅许可增长显著；相比之下，达拉斯、休斯顿、奥斯汀和迈阿密许可量合计减少 11,004 套。","impact":"long-pos","evidence_quote":"New York continues to lead the nation for multifamily permitting with 37,691 units permitted in the year-ending September, an increase of more than 13,000 units from last year or a jump of 52.7%.","evidence_basis":"body","cre_subcategory":null},{"source_id":"costar-research","source_name":"CoStar / Apartments.com Research","source_tier":"B","source_weight":9,"source_tags":["multifamily","data","trend"],"region":"national","title":"October Report: Accelerating Rent Growth Hits 1.6%","link":"https://apartments.com/grow/learning-center/rent-growth-update-october-2026","description":"October Report: Accelerating Rent Growth Hits 1.6% National rent growth reached 1.6 percent in October as oversupply challenges eased nationally. Formerly struggling Austin achieved positive rent growth for the first time in years, and all five regions of the country saw rent gains. Image","published_at":1793275200000,"date_precision":"timestamp","modified_at":0,"extraction":"semantic","canonical":"https://apartments.com/grow/learning-center/rent-growth-update-october-2026","content_hash":"0f5a1a3c7705c39bbf9ca11d211df38399a3a96b0e970a1392cbd11ac887c611","access":"public","source_family":"costar","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1793309852130,"id":"c0dcb7bac97279f2","late_discovery":true,"acquisition_window":{"lower":1793221200000,"upper":1793307600000},"score":13,"tags":["multifamily","national","data","trend"],"heat_signals":["austin","rent growth"],"evidence_status":"article","keep":true,"importance":4,"section":"national","duplicate_of":null,"selector_reason":"全国租金增速升至1.6%，并指出供给过剩缓解及Austin恢复正增长，具有多户市场拐点参考价值。","title_zh":"CoStar：10 月全美租金增幅升至 1.6%","summary_zh":"CoStar / Apartments.com Research 称，10 月全美租金同比增幅达到 1.6%，全国供应过剩压力有所缓和；奥斯汀租金多年后首次转为正增长，且 5 个地区均录得租金上涨。","impact":"long-pos","evidence_quote":"National rent growth reached 1.6 percent in October as oversupply challenges eased nationally.","evidence_basis":"body","cre_subcategory":null},{"source_id":"nahb-eyeonhousing","source_name":"NAHB Eye on Housing","source_tier":"B","source_weight":8,"source_tags":["data","trend","policy"],"region":"national","title":"Housing’s Share of the Economy Falls Again as It Continues to Face Headwinds","link":"https://eyeonhousing.org/2026/10/housings-share-of-the-economy-falls-again-as-it-continues-to-face-headwinds/","description":"Housing’s Share of the Economy Falls Again as It Continues to Face Headwinds October 30, 2026 Jesse Wade No Comments Housing’s share of the economy was 15.7% in the third quarter of 2026, according to the latest estimates of GDP produced by the Bureau of Economic Analysis . This share is down from 15.8% in the second quarter and down from 16.0% a year ago. Residential construction, measured by residential fixed investment, fell for the sixth time over the past eight quarters. The more cyclical home building and remodeling component–residential fixed investment (RFI)–was 3.6% of GDP, even with the previous quarter. The second component, housing services, was 12.2% of GDP, also even with the previous quarter. The graph below plots the share for housing services and RFI, along with housing’s total share of nominal GDP. Housing service expenditures are much less volatile when compared to RFI due to the cyclical nature of RFI. Historically, RFI has averaged roughly 5% of GDP, while housing services have averaged between 12% and 13%, for a combined 17% to 18% of GDP. These shares tend to vary over the business cycle. However, the housing share of GDP lagged during the post-Great Recession period due to underbuilding, particularly in the single-family sector. Residential Fixed Investment In the third quarter, RFI subtracted 12 basis points from the headline GDP growth rate. This reversed the 10 basis points that RFI added to GDP growth in the second quarter. RFI declined 3.3% in the third quarter on an annualized basis to a seasonally adjusted annual rate of $1.17 trillion, down from $1.18 trillion in the second quarter. RFI can be split into two segments: structures and equipment. Residential structure investment not only consists of new single-family and multifamily units but also includes manufactured homes, improvements, and dormitories. Residential equipment, which accounts for under 2% of total RFI, consists of furniture or household appliances that are purchased by landlords for rental to tenants. Real private investment in structures fell 3.6%, while investment in residential equipment rose 9.9%. Breaking down the components of residential structures, single-family RFI fell 5.0%, while multifamily RFI rose 0.3%. Permanent site structure RFI, which is made up of single-family and multifamily RFI, fell 3.8%. The “other structures” RFI category was down 3.4% in the third quarter. This component consists primarily of manufactured homes, improvements, and dormitories. On a seasonally adjusted annual basis in the third quarter, private investment in permanent site structures was at $514.9 billion, while other structures totaled $635.4 billion. While RFI has declined over the past year, nonresidential fixed investment has grown substantially. In the third quarter, nonresidential fixed investment grew 12.7%, the seventh straight quarter of growth. Most of this investment is in nonresidential equipment, as it grew 20.9% in the third quarter. This was led by investment in information processing equipment, specifically computer equipment. Nonresidential structure investment rose 5.4% in the third quarter, led by commercial and health care structure investment. Notably, investment in manufacturing structures fell by double digits for the seventh straight quarter, with a decline of 15.3% on an annualized rate in the third quarter. Housing Services The second impact of housing on GDP is the measure of housing services. Similar to RFI, housing services consumption can be broken into two components. The first component, housing, includes gross rents paid by renters, owners’ imputed rent (an estimate of how much it would cost to rent owner-occupied units), rental value of farm dwellings, and group housing. The inclusion of owners’ imputed rent is necessary from a national income accounting approach, because without this measure, increases in homeownership would result in declines in GDP. The second component, household utilities, is composed of consumption expenditures on water supply, sanitation, electricity, and gas. For the third quarter, housing services represented 12.2% of the economy or $4.0 trillion on a seasonally adjusted annual basis. Real housing services expenditure rose 2.8% at an annual rate in the third quarter. Real personal consumption expenditure for housing grew 1.1%, while real household utilities expenditures rose 15.3%. Personal consumption expenditure (PCE) on housing services is the largest component of PCE, making up 18.0% in the third quarter. The second largest component of PCE is health care services, at 17.0%. Expenditure on services was $15.4 trillion on a seasonally adjusted annual basis in the third quarter, more than double the expenditure on goods ($6.9 trillion). housing share of gdp , U.S. Bureau of Economic Analysis (BEA) Prev Previous PCE Inflation Accelerated in September Next Student Housing Construction Rises in the Third Quarter Next Leave a Reply Cancel reply Your email address will not be published. Required fields are marked * Comment * Name * Email * Website Yes, add me to your mailing list Share this Page Subscribe to Blog Subscribe Search by Category Video Updates View Please leave this field empty Subscribe to Blog via Email Email Frequency * Instant Daily Weekly Check your inbox or spam folder to confirm your subscription. Construction Statistics Single-Family Multifamily Remodeling Labor Force Construction Wages Employment Data Job Openings Finance Builder Loans Consumer Finance Mortgages Home Sales and Prices Housing Affordability Housing Prices Housing Sales Macroeconomics Federal Reserve GDP Inflation Market Trends Housing Characteristics Housing Demand Industry Demographics Policy Research Building Materials Homeownership Tax Policy Local Data NAHB Indices Research Studies","published_at":1793367466000,"source_family":"nahb-eyeonhousing","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1793569048991,"id":"e5b3e6ededa3819d","acquisition_window":{"lower":1793307600000,"upper":1793566800000},"score":9,"tags":["housing","national","macro","data"],"heat_signals":[],"date_precision":"day","published_date":"2026-10-30","modified_at":0,"extraction":"body_fallback","canonical":"https://eyeonhousing.org/2026/10/housings-share-of-the-economy-falls-again-as-it-continues-to-face-headwinds","content_hash":"f386e349c1bd8e4e707d8073ed02e58cfb0f2af4912610ee6b9c1171014c5700","access":"public","evidence_status":"article","keep":true,"importance":4,"section":"national","duplicate_of":null,"selector_reason":"NAHB基于GDP数据显示住房占经济比重降至15.7%，住宅固定投资连续八个季度中第六次下降。","title_zh":"住房占 GDP 比重降至 15.7%","summary_zh":"NAHB Eye on Housing 根据美国经济分析局数据称，2026 年第三季度住房占 GDP 比重为 15.7%，低于第二季度的 15.8% 和一年前的 16.0%；住宅固定投资当季下降 3.3%。","impact":"short-neg","evidence_quote":"Housing’s share of the economy was 15.7% in the third quarter of 2026, according to the latest estimates of GDP produced by the Bureau of Economic Analysis .","evidence_basis":"body","cre_subcategory":null},{"source_id":"nrhc","source_name":"National Rental Home Council (NRHC)","source_tier":"E","source_weight":9,"source_tags":["btr-sfr","institutional"],"region":"national","title":"New Trump housing order targets mortgage and title insurers – Insurance Business","link":"https://www.insurancebusinessmag.com/us/news/property/new-trump-housing-order-targets-mortgage-and-title-insurers-594846.aspx","description":"New Trump housing order targets mortgage and title insurers A White House plan to pull private mortgage insurance off loans sooner, and to let refinancing borrowers skip the lender's title policy, affects two insurance lines that say they already help keep costs down PROPERTY By Stephen Owens Oct 25, 2026 Share Mortgage insurers and title underwriters are the latest targets of the White House's pre-election push on housing costs. President Donald Trump on Oct. 22 signed an executive order, Decreasing Housing Costs for the American People , that leans on the Federal Housing Finance Agency to squeeze costs out of the mortgage process. Two of its four main provisions deal with insurance: a pilot to cancel mortgage insurance premiums ahead of schedule, and a permanent version of FHFA's experiment letting some refinances skip the traditional lender's title policy, according to the White House fact sheet . The rest of the order sets up a federal task force on factory-built housing and tells the Agriculture and Veterans Affairs departments to cut rates on their direct home loans. FHFA Director Bill Pulte called it \"the greatest Housing Executive Order in History\" on X. The fact sheet, however, sets no equity thresholds, no start dates and no estimate of how many loans would qualify, so mortgage insurers, title underwriters and agents can't yet tell how much business is at stake. Read next: Why home insurance prices are quietly becoming a 2026 midterm flashpoint Mortgage insurers say cancellation rules already exist The mortgage insurance piece would have Fannie Mae and Freddie Mac use automated valuation models to recheck home values on loans they own from time to time, then drop the coverage once a borrower appears to have built enough equity, according to Mortgage Professional America's breakdown of the order . Servicers would have to tell borrowers when cancellation might be possible. The pilot covers only loans originated after it launches. Borrowers already paying premiums would not benefit directly. Mortgage insurers point out that borrowers already have cancellation rights. Under the federal Homeowners Protection Act, borrower-paid coverage on a conventional loan must end automatically once the balance hits 78% of the home's original value, and borrowers can ask to cancel at 80%, with some able to qualify on the strength of home price gains if conditions are met, according to U.S. Mortgage Insurers (USMI) , the trade group whose members include Enact, Essent, MGIC, National MI and Radian. USMI President Seth Appleton welcomed the focus on costs and said the industry was already lowering them. \"Private MI is designed to be temporary, and the system already works much the way the order envisions, because when MI is cancelled, a borrower's monthly payment goes down,\" he said in the group's statement. USMI's statement describes the order as telling FHFA to consider a pilot, not to launch one. The group says premium rates have fallen 25% since 2017, that more than 800,000 buyers used private coverage in 2025, two-thirds of them first-timers, and that its members insure more than $1.6 trillion in mortgages. Insurers have paid over $62 billion in claims since 2008 that would otherwise have hit the government-sponsored enterprises, lenders and investors, USMI said. The pilot could also affect pricing. Mortgage insurance is priced on how long an insurer expects to keep collecting premiums. Some industry voices warned that a program clipping off late-life, low-risk loans could push insurers to build that lost income into pricing on new business, MPA reported . The order comes during a strong year for mortgage insurers. New insurance written across the six active private insurers (Arch, Enact, Essent, MGIC, NMI and Radian) hit a multi-year high in the second quarter of 2026, with strong credit performance, according to Milliman's quarterly market update . Read next : Old Republic prevails as Massachusetts court rejects title coverage expansion Title waiver pilot would become permanent For title underwriters, the order expands a program their trade group has opposed since 2024. The title acceptance pilot dates to March 2024, when the Biden-era FHFA approved waiving the lender's title policy, or an attorney opinion letter, on certain low-risk refinances where there is confidence the property is free of prior liens, according to a statement from then-Director Sandra Thompson . Fannie Mae launched it in November 2024 with Doma Title Insurance and added Westcor Land Title Insurance Co. in July 2025. Pulte said in June that Fannie would grow it. The order would make the program permanent and broaden it. The order directs FHFA to lift the current 80% loan-to-value cap on eligibility, bring in more title-assessment providers and scrap the geographic limits, according to MPA's reading of the text. It also calls for waiving appraisals and income re-verification on limited cash-out refinances that cut a borrower's monthly payment. The American Land Title Association responded the same day, warning that any cost-cutting push must keep protections for homeowners and their property rights in place rather than shift risk to consumers and taxpayers. In 2024, ALTA called the original pilot a political gesture that offered a false promise of savings. Analysts expect a limited effect for now. Analysts at Keefe, Bruyette & Woods wrote in an Oct. 21 note that refinances account for only about 7% of title premiums, so the earnings hit should be modest while the program stays refi-only. They said the risk would be greater if the waiver ever reached purchase loans, where there is no scalable substitute for a title policy. Refinance volume is low with 30-year rates above 7%, but a rate drop would quickly enlarge the pool of loans eligible for a waiver, and the order would also remove the program's geographic limits. Read next: First American hits title agency with suit over alleged rebrand scheme What happens next The orde","published_at":1793374859000,"mutable":false,"date_precision":"timestamp","modified_at":1792997387000,"extraction":"body_fallback","canonical":"https://insurancebusinessmag.com/us/news/prop  totaling 6,806 units, with 54.8% of that activity located in Hillsborough County. Total absorption through Q3 2026 reached over 1,700 units, up from the 160 units recorded one year ago. Stabilized occupancy (which excludes properties in initial lease-up or delivered within the past 18 months) fell to 91.6%. The average sale price climbed 0.7% YOY to $234,000 per unit, largely driven by continued investor preference for newer, well-located assets and a limited number of stabilized offerings coming to market. Supply & Demand Throughout the year, a total of 4,135 units across 13 buildings were delivered, up 2.3% year-over-year (YOY). At the end of Q3, there were 22 buildings under construction totaling 6,806 units, with 54.8% of that activity located in Hillsborough County. Starts were down to 672 units from the 3,104 units recorded at the peak over the past five years. The decrease in new units being built should help rebalance supply and demand. This coupled with projected higher long-term interest rates and hindered homebuying could provide more time for newly completed developments to reach stabilized occupancy. Additionally, rising building material costs and upward pressure on labor expenses are also constraining new development activity, further limiting future supply and creating near-term breathing room for existing and newly completed assets. Total absorption through Q3 2026 reached over 1,700 units, up from the 160 units recorded one year ago. Stabilized occupancy (which excludes properties in initial lease-up or delivered within the past 18 months) fell to 91.6%. Several submarkets continued to post strong occupancy rates, including Downtown St. Petersburg (94.3%), Downtown Tampa (93.9%) and Northwest Tampa (93.8%). These submarkets are supported by favorable supply-demand dynamics, proximity to key employment centers, and comparatively limited competitive deliveries. Market Pricing Effective rents declined 1.6% YOY. This was attributed to increased availa to thoughtfully balance land conservation and environmental stewardship of the quarry with the growing needs of modern industrial users,” Orchard Partners Managing Partner Tyler Higgins said in a statement. DevCon is the general contractor for the Quarry Innovation Center, with Ware Malcomb serving as project architect. Leasing will be handled by JLL’s Jason Ovadia, Greg Matter, Jason Cranston and Patrick Murdock. SALES Interstate Equities Corp. acquired the 2022-built The Dylan apartments at 2200 John Muir Parkway in Hercules for $83.5M from Hercules Development Partners. The property includes 217 market-rate keys and 15 below-market doors. JLL’s Capital Markets debt advisory team of Charles Halladay and Matt Cimino arranged a five-year acquisition loan through Freddie Mac for the buyer, while its investment and advisory sales team of Ryan Wagner, Brandon Geraldo, Matt Kroger and Fatai Alashe represented Hercules Development Partners. *** Carmel Partners of San Francisco acquired the 268-unit Silver apartment complex at 333 Sunol St. in central San Jose for $122M from an affiliate of Essex Property Trust. It is the fourth Bay Area transaction for Carmel Partners’ Carmel Fund 9. Built in 2018, Silver consists of studio, one- and two-bedroom units. Carmel plans to reposition the property through strategic upgrades to boost net operating income, Mike Ruiz, partner and head of acquisitions, said in a statement. *** Sausalito-based FH One Investments acquired a 1988-built, 106K SF office building at 500 Ygnacio Valley Road in Walnut Creek for $22.5M in a deed-in-lieu-of-foreclosure transaction. The building was about 70% leased and was purchased for a nearly 40% discount from what former owner Broadshore Capital Partners paid about a decade earlier. *** An affiliate of Oberndorf Real Estate Management and The Bascom Group purchased the 117-door Museum Park Apartments at 465 W. San Carlos St. in San Jose for $53.1M. An affiliate of Lakevision Capital purchased the 2002-built, Class-B garden-style multifamily property in 2020 for $57M. *** KKR and TMG partners acquired the 419K SF Skyport Plaza office and retail property in north San Jose from Hudson Pacific for $75.5M. Skyport Plaza consists of two mostly vacant eight-story office buildings and two occupied retail buildings. HPP said in a statement it will use sale proceeds to pay down an unsecured revolving credit facility, leaving a $30M balance. *** Marcus & Millichap’s Teodar Vacev of the firm’s Palo Alto office brokered the $5M sale of a 17K SF Caliber Collision repair facility at 3207 Shattuck Ave. in Berkeley to a private Bay Area-based investor. Marcus & Millichap’s Kirk Trammell and Josh Johnson represented the buyer in purchase negotiations. *** TruAmerica Multifamily of Los Angeles acquired Bridges at San Ramon, a 1988-built garden-style multifamily community of 200 doors, for $78M from Acacia Capital. The property, located near the 585-acre Bishop Ranch mixed-use office hub, hadn’t changed hands in the past 15 years and saw strong investor interest. Jason Parr, Scott MacDonald, Sydney Ladrech and John Hansen of Berkadia’s San Francisco office arranged the sale on behalf of San Mateo-based Acacia Capital. *** The Davis Cos. of Boston acquired a 65K SF office and research and development building at 51 Rio Robles in San Jose for $17M. Maxeon Solar Technologies is the sole tenant at the facility, which features 3,000 amps of power. The Davis Cos. plans to reposition the property in 2027 with a new roof, upgraded mechanical and HVAC systems, and interior improvements. Colliers’ Andy Zighelboim, Kevin Moul, Brad Idleman and Bob Gilley brokered the purchase on behalf of The Davis Cos. *** Sterling Organization of West Palm Beach, Florida, acquired two Bay Area grocery-anchored retail centers through its Sterling United Properties fund. Safeway Burlingame is a 70K SF, 100% leased retail center on the Peninsula, while Pleasanton Gateway Shopping Center is a 128K SF, 99% leased
