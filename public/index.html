 attacks. Oil prices are up a smidge today and the question now is: how much higher can mortgage rates go with so much already priced into the markets? 10-year yield and mortgage rates In the 2026 HousingWire forecast , I anticipated the following ranges: Mortgage rates between 5.75% and 6.75% The 10-year yield fluctuating between 3.80% and 4.60% When I do a yearly forecast range, it is created to encompass a lot of variables, including the 10-year yield, mortgage rates and spreads. I believe 65%-75% of the slow dance between the 10-year yield and mortgage rates is Fed policy. Because mortgage spreads have improved, my forecast didn’t have rates above 6.75% for 2026. We entered the year with two or three rate cuts priced in, and the 10-year yield was acting in line with that premise. Then we started the conflict with Iran in February , which gave us a new variable. Now we have to look at what happens if the Iran conflict continues for many more months. The 10-year yield and 30-year mortgage rate have mostly stayed in their range all year, but a prolonged conflict should change the calculus because the bond market doesn’t like this conflict. As I am writing this article today, the 10-year yield is at 4.60% after the news of the weekend and this morning, even though oil prices currently are roughly at $82, not even above $100. Worst-case situation for now Even if the conflict ended today, I believe the base pricing for the 10-year yield should be between 4.46%-4.48%. This accounts for the labor market improving, inflation above target and Fed rate hikes in play now versus cuts. Also, the base level for mortgage rates should be between 6.50%-6.75%. This range has stuck during all the drama we have had to deal with. Now, for the good news: mortgage spreads are much better now than in previous years. If we were in 2023, 2024 or 2025 with the 10-year yield at this level, mortgage rates would already be above 7%, and (in 2023) closer to 8% today. This is the main reason I tate policymakers on housing finance issues, beginning with recommendations to the Federal Housing Finance Agency regarding condominium financing . The initiative has already taken off running. In a July 1 policy letter addressed to Bill Pulte , director of the FHFA , AD Mortgage outlined concerns about upcoming changes to condominium project eligibility requirements for loans purchased by Fannie Mae and Freddie Mac . According to AD&#8217;s press release, &#8220;the submission follows a recent meeting between AD Mortgage leadership and FHFA officials focused on housing affordability, condominium financing, and other emerging issues in the residential mortgage market.&#8221; AD Mortgage&#8217;s initiative and letter dovetail with previously addressed concerns by those in the housing space. Several industry talking heads are worried that the changes could increase monthly association dues and make it more difficult for some borrowers and condominium projects to qualify for financing. Corey Chubner, AD Mortgage&#8217;s senior vice president of government affairs and investor relationships, told HousingWire in an interview that the goal of the initiative is to be a &#8220;collaborative partner&#8221; to policymakers. &#8220;We had a great meeting with FHFA back in the middle of June of this year, and we discussed, amongst other things, the changes to the condo guidelines and the sunset of the limited review process and the update to the reserve requirements from 10% to 15%, and we expressed our concerns that it may squeeze what would otherwise be very creditworthy borrowers outside of the conventional financing that would be afforded to them otherwise,&#8221; Chubner said. The company said its recommendations are supported by proprietary lending data showing the importance of the Enterprises&#8217; Limited Review process for conventional condominium loans, particularly in Florida. &#8220;It wasn&#8217;t our goal to demand that they delay or revoke the changes, but it was to provide insight, and we have access to an abundance of data, and I think it&#8217;s our responsibility as partners with FHFA, with Fannie, with Freddie, to share some of that data and show the real-world implications,&#8221; Chubner added. &#8220;The hope is that there&#8217;s a dialog.&#8221; According to AD Mortgage, more than 750 Florida condominium loans it originated since 2021 used the Limited Review process, representing 53% of its conventional condominium originations in the state during that period. &#8220;AD Mortgage supports prudent project eligibility standards and shares FHFA&#8217;s objective of promoting sustainable homeownership and long-term project stability,&#8221; the letter said. &#8220;At the same time, we are concerned that the combined effect of eliminating Limited Review and increasing reserve funding requirements may materially reduce access to Enterprise-backed financing for otherwise creditworthy borrowers.&#8221; The lender also said about 30% of condominium projects it manually reviewed had reserve funding below the new 15% threshold established under updated Fannie Mae and Freddie Mac guidelines. AD Mortgage is urging the FHFA to monitor how the revised standards affect borrower access to conventional financing and consider future adjustments if data shows the changes reduce credit availability. Chubner told HousingWire that the letter has not yet gotten a response from Pulte. &#8220;Our objective is simple: bring practical market experience and real-world lending data into policy discussions,&#8221; Chubner said in a statement. &#8220;The mortgage industry has an important responsibility to help policymakers understand how regulatory changes affect borrowers.&#8221; The letter also addressed the Florida -headquartered company&#8217;s concerns about statewide impact. &#8220;In Florida, it&#8217;s unique as compared to most of ","published_at":1784577430000,"score":21,"tags":["housing","national","policy","lender"],"heat_signals":
