me":"NAHB Eye on Housing","source_tier":"B","source_weight":8,"source_tags":["data","trend","policy"],"region":"national","title":"Single-Family Built-to-Rent Slowed at Start of 2026","link":"https://eyeonhousing.org/2026/05/single-family-built-to-rent-slowed-at-start-of-2026/","description":"Single-Family Built-to-Rent Slowed at Start of 2026 &#8211; Eye On Housing Skip to content Search Research/Data Housing Economics Plus Books Dashboards Local Data Research Studies Services Indices Team Videos Research/Data Housing Economics Plus Books Dashboards Local Data Research Studies Services Indices Team Videos Eye On Housing National Association of Home Builders Economic Research Blog Single-Family Built-to-Rent Slowed at Start of 2026 May 25, 2026 Robert Dietz No Comments Single-family built-for-rent (or built-to-rent, BTR) construction fell back in the first quarter of 2026, as a higher cost of financing, increased multifamily supply and policy concerns over Congressional legislation related to institutional capital froze parts of the development market. Fortunately, recent changes by the House of Representatives have addressed a harmful Senate proposal. The legislation, as approved by the Senate, would have required institutionally financed new-construction single-family rental housing to be sold to individual home buyers within seven years. This requirement would decrease investable capital and lower housing supply. A preliminary NAHB estimate indicates the proposed rule places approximately 40,000 units per year at-risk. The House version of the bill removes this anti-supply provision. Nonetheless, concerns over the Senate version limited capital investment in the BTR sector at the beginning of 2026. According to NAHB’s analysis of data from the Census Bureau’s Quarterly Starts and Completions by Purpose and Design , there were approximately 14,000 single-family built-for-rent ( SFBFR ) starts during the first quarter of 2026. This is down measurably from the first quarter of 2025 (19,000). Over the last four quarters, 62,000 such homes began construction, which is a 26% decrease compared to the 84,000 estimated BTR starts for the prior four quarter period. The BTR market is a source of inventory amid challenges regarding housing affordability and down payment requirements in the for-sale market, particularly during a period when a growing number of people want more space and a single-family structure. Single-family built-for-rent construction differs in structural characteristics compared to other newly-built single-family homes, particularly with respect to home size. However, investor demand for single-family homes, both existing and new, has cooled with higher interest rates. Given the relatively small size of this market segment, the quarter-to-quarter movements typically are not statistically significant. The current four-quarter moving average of market share (just under 7%) is nonetheless higher than the historical average of 2.7% (1992-2012). Importantly, as measured for this analysis, the estimates noted above include only homes built and held by the builder for rental purposes. The estimates exclude homes that are sold to another party for rental purposes, which NAHB estimates may represent another three to five percent of single-family starts based on industry surveys. The Census data note an elevated share of single-family homes built as condos (non-fee simple), with this share averaging about 4% over recent quarters. Some, but certainly not all, of these homes will be used for rental purposes. Additionally, it is theoretically possible that some single-family built-for-rent units are being counted in multifamily starts, as a form of “horizontal multifamily,” given that these units are often built on a single plat of land. However, spot checks by NAHB with permitting offices indicate no evidence of this data issue occurring. With the onset of the Great Recession and declines in the homeownership rate , the share nt is tied to its strong growth in office-using employment, with the financial activities sector being the key driver. Miami experienced a wave of corporate relocations in recent years, as many companies took advantage of Florida’s business-friendly environment. Palantir plans to move its headquarters here from Denver, while JPMorgan, Amazon and Citadel all expanded their operations in the metro. Manhattan followed with a 13.1 percent rate and recording the same year-over-year improvement. In contrast, Seattle’s 25.2 percent stood out as the highest vacancy rate nationwide, despite a 180-basis-point recovery. As for vacancy improvement, San Francisco led all markets, down 570 basis points year-over-year, followed by Denver (-470 basis points). The national full-service equivalent listing rate stood at $32.91 per square foot—up 11 cents from the previous month and down 1.3 percent year-over-year. Manhattan remained the top metro for office rents, at $69.29 per square foot, followed by San Francisco’s $62.03 per square foot. Class A development still the driver as activity dwindles The national office pipeline included 29.4 million square feet in April—accounting for 0.4 percent of existing stock. Class A and Class A+ space represented the majority of pipeline, as these projects total 25.2 million square feet of 86 percent of the under-construction inventory. In contrast, Class B accounts for only 14 percent of the pipeline, at just 4.1 million square feet. Boston led the charts for construction activity, with 3.9 million square feet underway. Manhattan and Dallas followed, with 2.9 million square feet and 2.7 million square feet, respectively. Orlando, Fla., stood at the end of the list, with 196,925 square feet underway, just below Chicago’s 202,568 square feet. Construction activity remains low. In 2025, construction starts totaled 21.6 million square feet. General office starts accounted for 47.6 percent of that volume, while medical office represented 25.8 percen
