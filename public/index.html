r the third month in a row, slipping 1.6%, followed by Las Vegas (-1.3%), and Denver (-0.8%). \"The years-long East-West divide persists, with six out of the eight Eastern metropolitan markets recording greater year-over-year changes in July versus June, compared with just two of the eight Western metropolitan markets,\" says Kaufman. As in June and July, a gap of nearly 9 percentage points separated the strongest housing market, Chicago, which was bolstered by tight resale supply and limited new construction, from the weakest, Seattle. Loading... What this means for homebuyers Looking ahead, Realtor.com® senior economist Anthony Smith reminds that the rate backdrop has become considerably more challenging since the end of August. The 30-year fixed rate climbed to 7.40% in mid-October, the highest level of the year, before easing to 7.32% as of Oct. 22 , after the Federal Reserve raised its benchmark rate on Sept. 16 and September Consumer Price Index (CPI) rose to 3.7%. Pending home sales plunged 7.3% in September to the lowest reading on record and were down 11.3% from a year ago, with declines in all four regions. \"With inventory at its highest level since 2019 and rates above 7%, buyers have more homes to choose from but less power to pay for them,\" says Smith. The Case-Shiller Index reports on a two-month delay and reflects a three-month moving average of home sales prices. Homes usually go under contract a month or two before they close, so the August report primarily reflects purchase decisions made in late spring and early summer. Although the Index's price data is delayed by several months, it is considered one of the best available measures of changing home values, because it is based on repeat transactions on the same properties. Get real estate news in your inbox Sign up now Snejana Farberov is a reporter at Realtor.com covering the U.S. housing market and the latest ","published_at":1793109919000,"score":49,"tags":["housing","national","data","macro"] nsive-to-fix","description":"Houston&#039;s Office Woes Are Getting Too Expensive To Fix October 27, 2026 | 5:27 pm ET Maddy McCarty, Houston Houston office investors should plan to spend double a building’s purchase price. Older office buildings need upgrades and renovations that will cost just as much as the building itself to compete for tenants, brokers said at Lee Associates Houston's third-quarter market briefing on Tuesday. And increasingly, they said, landlords getting work done are not able to pay for it. Unsplash/Emilio Williams Brokers check for a mechanic's lien, a legal document filed by contractors who haven’t been paid for their work, as a standard practice before bringing tenants to tour an office building, Lee Associates co-Managing Principal Chris Lewis said. With loans coming due and financial distress spreading throughout Houston’s office market, the presence of liens is “quite prevalent” lately, he said. “That's probably not a good sign that they're going to be maintaining the building well,” Lewis said. Identifying these issues early can prevent trouble later, as tenants have high standards in Houston’s split office market, where rents are rising due to demand for top-tier space. The metro has a direct vacancy rate of about 23% — well above the national vacancy rate of about 18% — with much of that concentrated in old, poorly located and obsolete buildings. Tenants may think they’re getting a good deal on an acceptable building recently acquired by a newer investor. But if that investor can’t afford to maintain the building’s mechanical, electrical and other systems, the tenant will be itching to leave long before their lease expires, Lewis said. “For the owners that aren't putting money into the assets, they're going to move,” he said. “They're going to have air conditioning problems. The elevator doesn't work. Things like that. You only put up with that for so long.” There’s been a shift from institutional to local office investors in Houston. Some of them may not realize that their $10M building also needs $10M of work, Lewis said. A lack of capital to invest in maintenance and upgrades will send tenants scattering, unless the building trades to an institutional investor. “We are seeing a little bit more institutional capital interest in Houston on the office side than we have seen, but it's still not on the radar of the big institutions yet,” he said. If these buildings are not sufficiently upgraded and maintained or traded, there is a significant chance that they will empty and fall into the obsolete category, for which options are extremely limited. “Most of these office buildings need to be torn down,” said Jason Dannatt, who specializes in commercial resource capital for Lee Associates. That includes some midblock office buildings that never should have been built and some 1970s vintage product, he said. “There are millions of square feet of office buildings that need to be taken off the sheet because no one will ever occupy them ever again, because they don't make sense,” Dannatt said. In some cases, even demolition is not financially feasible. Asbestos can add tens of millions of dollars to the upgrade or demolition costs, Dannatt said. But despite the challenges, the continued flight-to-quality trend is pushing market rents to all-time highs. The weighted average asking gross rent rose to about $31.50 per SF in the third quarter, 4% above the 2025 average of $30.26 per SF, according to Lee Associates data. “The good stuff is good, and the bad stuff is bad, and there's not much in the middle,” Dannatt said. Continue reading this story with a free account Log in or register Contact Maddy McCarty at maddy.mccarty@bisnow.com Related Topics: Chris Lewis , Houston office , Jason Dannatt , Lee Associates , Lee Associates Houston","published_at":1793136443000,"score":19,"tags":["office","houston","distress"],"heat_signals":["houston","trend","vacancy"],"importance":3,"selector_reason":"休斯敦老旧办公楼翻新成本可能达到 o far in 2026, according to a Sept. 26 press release shared with Multifamily Dive. “We look at our deals [when deciding to sell] on an asset-by-asset basis, and this deal was just performing very well,” Bainbridge Senior Vice President of Development for the Mid-Atlantic Greg Cavanaugh told Multifamily Dive. “We stabilized the asset in the summer of 2025. We just continued to add value through operations, and we saw rent growth.” But the sale is only part of the story. The Wellington, Florida-based apartment owner, developer and manager also retained the property management contract from the buyer, Frontier Group of Cos., after achieving a strong lease-up performance of 30 units per month. “We stabilized the property,” Cavanaugh said. “We kept occupancy high. We increased NOI throughout the ensuing year. I think there is just a lot of confidence in our team that we can continue to do that.” Property basics The four-building property sits on 25.8 acres in Chesterfield County and includes studio, one-, two- and three-bedroom apartments averaging 1,017 square feet. Units feature open floor plans, quartz countertops, stainless steel appliances, smart-home technology and hardwood-style flooring, per the release. Amenities include a saltwater pool, a 24-hour fitness center, a clubhouse, coworking areas, a pickleball court, a dog park and wooded walking trails, per the release. The property offers easy access to Route 288 and Midlothian Turnpike, with connections across the greater Richmond region, per the release. Wegmans-anchored Stonehenge Village, Westchester Commons and Chesterfield Towne Center are among the nearby shopping, dining and employers. The firm began working on the project in 2021 and saw great potential in the location. It aimed to develop a property with an experience that “feels more like hospitality,” Cavanaugh said. “We felt like there was an opportunity, given the demographic profile and income profile in the area,” he said. “We thought that there was an opportunity to bring a more elevated resident experience, and that extends to the level of amenities we offer and the finishes at the property.” Now that the sale is complete, Bainbridge continues to seek new projects. “We thought that we'd achieve a strong value for Bainbridge Midlothian and that came to fruition,” Cavanaugh said. “It allows us to recycle capital into new opportunities.” Click here to sign up to receive multifamily and apartment news like this article in your inbox every weekday. Add us on Google Share Copy link Email LinkedIn X/Twitter Facebook Print License Filed Under: Transactions","published_at":1793126970000,"score":19,"tags":["multifamily","deals","institutional"],"heat_signals":["rent growth","occupancy"],"importance":3,"selector_reason":"弗吉尼亚一处公寓资产以1.077亿美元成交，并创当地市场单价纪录。交易规模达到常规重要交易区间，评为3。","section":"institutional","title_zh":"Bainbridge以$107.7M创Virginia单套公寓高价","summary_zh":"310套Bainbridge Midlothian按$347,500每套成交，创2026年当地market-rate multifamily单价纪录","impact":"long-pos","id":"b9dad176","fetched_at":1793180644203},{"source_id":"redfin-news","source_name":"Redfin News","source_tier":"A","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"U.S. Pending Home Sales Sink to a New Low","link":"https://www.redfin.com/news/housing-market-update-pending-home-sales-sink-high-rates/","description":"Would-be homebuyers are pulling back as mortgage rates remain in the mid-7% range. What to know about the U.S. housing market for the four weeks ending October 18: Pending home sales fell. They declined 1.9% from a week earlier to the lowest level in records dating back to 2021. Weekly average mortgage rates are holding [&#8230;] The post U.S. Pending Home Sales Sink to a New Low appeared first on Redfin Real Estate News .","published_at":1792670430000,"score":18,"tags":["housing","national","data","rates"],"heat_signals":["mortgage rate","pending home sales","housing market","pending home sales"],"importance":3,"selector_rea st be in ORE too. Nothing sits in a drawer. Public listings go everywhere at once. A listing in “market” view is delivered to the MLS, the portals, appraisers and data services at the same time it reaches members. No one gets a head start. The MLS is invited in. ORE says local MLSs will keep making and enforcing local rules, and invites them to help shape how ORE itself is run. A private listing shared across every member company beats one hidden inside a single office. That is real progress. 5 things ORE must get right to succeed 1. Nearly everyone has to join. ORE works exactly as far as its membership reaches. A listing in the members-only section, which ORE calls “participant view,” is visible only to agents at participating brokerages. Neither the public nor agents outside the club can see it. The largest brokerage in the country is not in, and neither are thousands of independents. Until most of the industry is inside, ORE is simply a second silo, bigger than the first (we’re talking Compass ), hiding listings from everyone who has not joined. Joining has to be simple, free and on equal terms for the three-agent shop and the 30,000-agent franchise alike. 2. Answer who owns it, and keep the biggest brokers from running it. Today, ORE is company owned and run by a handful of the largest brokerages in the country. Whoever holds the keys to the nation’s inventory decides where listings are syndicated, sets the data standards everyone else must follow, decides who gets in and on what terms and decides how the money is split. The FAQ says ORE holds “full discretion” over syndication and that will be a huge flag for many brokers and their agents. If the founders hold those keys, every small broker and independent agent becomes a tenant in a building owned by their largest competitors. And companies change hands. Real’s acquisition of REMAX this year is a reminder of how quickly ownership moves in this business. If ORE is ever sold to a corporate buyer, that next owner did not sign the founders’ letter and every brokerage that has come to rely on ORE will live with whatever that owner decides. 3. Call it for what it really is. ORE says it is not a national MLS. Granted, it does not make local MLS rules. But unless I’m missing something, ORE will take an agent&#8217;s listing and share it with other members, it will control where the listing is syndicated and it plans a national listing standard. If it walks like a duck, quacks like a duck and looks like a duck, it is probably a duck. The industry, and the regulators now watching private listings closely, will judge ORE by what it does, no","published_at":1793121889000,"score":16,"tags":["housing","national","policy","brokerage"],"heat_signals":["housing market"],"importance":3,"selector_reason":"讨论开放房源平台如何应对私下挂牌扩张，涉及全国经纪与房源流通规则。议题具有行业影响，但本文偏分析且缺少明确量化结果，评为3。","section":"national","title_zh":"Open Real Estate联手遏制私有listing垄断","summary_zh":"Keller Williams等四家brokerage要求签约后1个工作日内录入ORE，扩大MLS公开库存","impact":"long-pos","id":"f3afcca4","fetched_at":1793180644203}],"errors":[{"source":"Houston Agent Magazine","error":"HTTP 403","attempted_urls":["https://houstonagentmagazine.com/feed/"]},{"source":"Phoenix Agent Magazine","error":"HTTP 403","attempted_urls":["https://phoenixagentmagazine.com/feed/"]},{"source":"Atlanta Agent Magazine","error":"HTTP 403","attempted_urls":["https://atlantaagentmagazine.com/feed/"]},{"source":"Miami Agent Magazine","error":"fetch failed","attempted_urls":["https://miamiagentmagazine.com/feed/"]},{"source":"Texas Real Estate Research Center (TRERC)","error":"HTTP 403","attempted_urls":["https://trerc.tamu.edu/feed/"]},{"source":"PERE News","error":"HTTP 404","attempted_urls":["https://www.perenews.com/feed/"]}],"_diagnostics":{"writer_mode":"global","sectionsUnderMin":[],"window_hours":24,"pool_sizes":{"24h":103,"48h":141,"72h":142},"us_holiday":{"today_us":"2026-10-28","today_us_holiday":null,"yesterday_us_holiday":null,"tomorrow_us_holiday":null,"is_us_weeke
