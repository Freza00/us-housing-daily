d The World September 8, 2026 | 6:34 pm ET Mike Phillips, Europe Editor When Prologis first tried to buy Segro in March 2024, it was rebuffed in a curt, 75-word letter from the chairman of the British logistics giant, describing its bid as opportunistic and inadequate. The fact that San Francisco-based Prologis is now about to buy Segro for $19B, swallowing whole its largest European rival, sums up the qualities that have helped Prologis rise to the top of not just the world of logistics but real estate and business more broadly: patience, cold-eyed analysis and determination. Prologis Prologis is a ubiquitous name in real estate. Its assets are valued at $240B, it leases an average of 1M SF every day, and goods representing 3% of global GDP flow through the 1.3B SF of warehouses it owns and manages. It is also a major developer of data centers, planning to spend as much as $87B on construction of the booming property type over the next few years. How it got to that position is a story of adversity overcome, both corporate and on the part of a CEO who left his family and homeland as a teenager. It combines a deep knowledge of its existing market with a willingness to experiment: It knows what racks its customers want in warehouses and buys them in bulk, but it has also expanded into renewable energy generation and storage and electric vehicle charging. The Segro deal highlights one of Prologis’ most crucial strengths: It has a rare track record of never missing on huge corporate acquisitions, on which it has now spent more than $75B in the past decade. And each merger has built scale that allows Prologis to throw its weight around even further. “They can come in and dominate any market that they want to dominate, especially from a development perspective,” said Reed Vestal , CEO of industrial developer, investor and brokerage Junction Commercial Real Estate . Prologis declined to comment for this article. The modern Prologis was formed by the merger of two companies. AMB was an investment manager founded in 1983 by Hamid Moghadam , along with partners Douglas Abbey and Robert Burke. Security Income Capital was founded in 1991 and changed its name to Prologis in 1998. Both companies went public in the 1990s, became logistics specialists in the 2000s, expanded globally into Europe and Asia, and raised money from investors through funds they managed, as well as using their own balance sheets. And both hit the skids in 2008 with the onset of the Global Financial Crisis, with their share prices dropping as much as 90%. Prologis was particularly exposed because it had gone on a speculative development jag before the crash and was left with an overhang of unleased assets as the economy tanked and global consumer spending dropped. AMB was also hit by a combination of falling asset values and elevated debt. It was the first REIT in that cycle to raise equity from investors to shore up its balance sheet in March 2009, a move that allowed the company to switch from defense to offense, Moghadam told the Leading Voices in Real Estate podcast in 2024. In 2011, AMB proposed a merger with Prologis — it was the smaller company, with a market capitalization of $6B compared with Prologis’ $9B, and had a smaller portfolio, but it was in healthier financial shape. It essentially acquired its larger rival, creating the largest industrial REIT in the world. In spite of being the driving force behind the deal, AMB knew Prologis had more name recognition with customers, and thus the Prologis name was retained for the combined firm. “They swallowed their pride, in some ways,” Jack Fraker , Newmark president and global head of industrial and logistics capital markets, told Bisnow . Courtesy of Prologis Prologis Executive Chairman Hamid Moghadam Moghadam and Prologis CEO Walter Rakowich led the combined company as co-CEOs, in the explicit knowledge that Rakowich would soon retire and Moghadam would take sole charge, as happened in 20","published_at":1788 建设贷","summary_zh":"Park Tower将建1,049套公寓，Journal Square新增大型multifamily供给","impact":"long-pos","id":"747af150","fetched_at":1788917036174},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Multifamily rents up slightly in August, dampened by high lease-ups: Yardi","link":"https://www.multifamilydive.com/news/multifamily-rents-august-lease-ups-yardi/829832/","description":"An article from Multifamily rents up slightly in August, dampened by high lease-ups: Yardi Last month’s numbers “point to an increasingly uneven, market-specific rent recovery,” according to a report from the real estate data firm. Published Sept. 8, 2026 Julie Strupp Senior Editor Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Getty Images Listen to the article 4 min This audio is auto-generated. Please let us know if you have feedback . Multifamily rent prices ticked up on a monthly and yearly basis in August, with increases moderated by the high number of newly built apartments in the lease-up phase, according to a Sept. 4 report from real estate data firm Yardi Matrix. Last month the average advertised U.S. rent rose $2, or 0.1%, to $1,773 from July. Year over year, rent prices were up 0.4% in August — the highest rate of increase in almost a year. Rent growth is “highly correlated” with the number and share of new building stock in lease-up in a given market, according to Yardi’s analysis. For example, the Sun Belt metros with weak rent growth still have a large percentage of new apartments competing for renters. At the beginning of August, 1.2 million units were in lease-up nationwide — down from the early 2025 peak of 1.4 million apartments, but about double the average seen in the previous decade. Overall, the supply-demand balance is moving in a positive direction, as demand persists while apartment deliveries and incoming developments taper, per Yardi. Starts and deliveries have dropped by one-third from cycle highs in 2023 and 2024 while absorption has stayed relatively strong, creating “expectations that rent growth will return soon, especially in high-growth Sun Belt markets,” according to Yardi. Performance by segment Last month, rent prices in Gateway and Midwest markets continued to outperform, although momentum in certain Midwest metros cooled. Buoyed by strong artificial intelligence- and tech-related demand plus limited new supply, San Francisco remained the leader in both occupancy and rent growth in August, with rents up 6.1% YOY. It was followed by New York City (rents up 5.3% YOY), Kansas City in Kansas and Missouri (3%), Chicago (2.6%) and the Twin Cities in Minnesota (2.4%). At the same time, rent prices in some high-supply markets like Denver; Portland, Oregon; and Austin, Texas; became less negative, indicating that supply-driven pricing pressure is easing. Rent declines continued to moderate in some Sun Belt metros like Austin (-2.8% YOY), Denver (-2%), Tampa, Florida, (-1.8%), Houston (-1.7%) and Phoenix (-1.6%). The national occupancy rate stood at 94.2% in July, the same rate as June, but down 0.5% YOY. Occupancy weakness was widespread, with San Francisco the only Yardi Matrix top 30 market to post an increase, up 0.5% YOY. In nearly half of Yardi’s markets, occupancy fell 50 basis points or more. Tampa tumbled the furthest, down 1.2% YOY, followed by Washington, D.C., and Las Vegas (both -0.9%), and then Houston and Columbus, Ohio (both -0.8%). Overall, August’s numbers “point to an increasingly uneven, market-specific rent recovery,” per Yardi. By segment, single-family build-to-rent prices were up 0.5% YOY in August at a record high of $2,246, while occupancy rates for SF BTR fell 20 basis points to 94.8%. Renter-by-necessity rent prices increased 0.6% YOY in August, while lifestyle rents were up 0.4% YOY. As the industry enters the second half, “normal seasonal slowing, trade tensions and broader economic uncertainty will test whether recent momentum can carry through year-end,” according to Yardi. Click here to sign up to receive multifamily and apartment news like this article in your inbox every weekday. Recommended Reading Multifamily rents grew in July, buoyed by Sun Belt: Yardi By Julie Strupp &#8226; Aug. 7, 2026 Add us on Google Share Copy link Email LinkedIn X/Twitter Facebook Print License Filed Under: Rents","published_at":1788897480000,"score":44,"tags":["multifamily","national","trend"],"heat_signals":["build-to-rent","btr","texas","houston","austin","sun belt","year-end"," yoy","year over year","rent growth","occupancy"],"importance":3,"selector_reason":"Yardi数据显示美国多户租赁市场租金在高供应背景下仅小幅上涨，反映全国租赁基本面分化。该数据覆盖面广且直接涉及租金与新增供应，是常规但有参考价值的市场趋势。","section":"national","title_zh":"August multifamily租金微涨，lease-up压制复苏","summary_zh":"平均租金升至$1,773，月增0.1%、年增0.4%，全国1.2M套仍在lease-up","impact":"neutral","id":"d740c7a4","fetched_at":1788917036174},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Where Crow Holdings sees ‘green shoots’ in the rental market","link":"https://www.multifamilydive.com/news/construction-costs-multifamily-development-equity/829822/","description":"An article from Q A Where Crow Holdings sees ‘green shoots’ in the rental market The Texas-based developer still sees potential in California, along with other metros around the country, according to Sean Rae, senior managing director in the Capital Markets Group at the firm. Published Sept. 8, 2026 Leslie Shaver Senior Reporter Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Alexan Marmont in Monrovia, California. Permission granted by Crow Holdings Development Heading into 2024 and 2025, apartment executives expected the next 12 months to bring signs of a rental recovery. Then, as months passed, they realized they needed to wait just a little bit longer. “It has been kind of Groundhog Day for the last couple of years,” Sean Rae, senior managing director in the Capital Markets Group at Crow Holdings Development, told Multifamily Dive. But Rae thinks this time may actually be different, with suburban Boston, the West Coast and Sun Belt markets “starting to see some green shoots.” But that’s not universal. In the Sun Belt, it’s still a little challenging. “In some of the Sun Belt markets, maybe you have to dig through to the very base layer of dirt to see the green shoot,” Rae said. “It's early, but you are starting to see concessions burn off.” Rae is well positioned to see where recovery is sprouting around the country in his role overseeing the capital markets platform for Crow Holdings Development, which includes Crow Holdings Industrial, Crow Holdings Office and multifamily powerhouse Trammell Crow Residential. “As we work back towards equilibrium, each submarket is going to be different, and of course, each market in the U.S. is going to be different,” Rae said. “As far as where they are in the recovery, it's not going to snap your fingers, and everything's rosy.” The 20-year company veteran expects a moderate increase in starts next year with things continuing to “ratchet up” in 2028 and beyond. But all real estate is local, and timelines vary by geography. “In California, it could be seven or eight years, and in Texas, it's three in most cases,” Rae said. “So we're playing for a pretty far-out place in the future.” Here, Rae talks with Multifamily Dive about the best markets for construction, development equity, and the market where he’s seeing green shoots. This interview has been edited for brevity and clarity. MULTIFAMILY DIVE: What are the major roadblocks in getting deals out of the ground? SEAN RAE : As far as apartment development, the deals are hard to underwrite. Capital is constrained. Debt is certainly available, but equity capital is very tough. As we look at the fundamental supply-demand, demand has actually stayed quite strong. Supply has been the issue. What kind of wind is there for developers who can start projects in the next year or so? We may be underwriting in this market, and that adds to the challenge because your investors aren't going to underwrite significant rent-growth projections. The reality is, if you're delivering into a very supply constrained market in 2030, 2031 — or let's just back it up in 2029 — the results could be quite strong. Our general mindset is that for assets we can start on now, we're very excited about the prospects for when they’re delivering and leasing up. What markets do you like? We develop across the U.S. You'll typically find us in the Tier 1 markets — call it the top 20. We don't develop in Manhattan. We don't develop in Chicago, but everywhere else, you'll generally find us. In the markets that got beat up the most and have been the longest to recover — think of a Phoenix, think of an Austin, think of a Nashville — we think there are some very solid opportunities there. The job-growth markets in the Sun Belt continue to be very attractive. We love Northern Virginia. We love the suburban Boston plays. Then you go out to California, and the fact is, people want to be in California. Some big names have moved out of California. What d","published_at":1788888598000,"score":19,"tags":["multifamily","national","trend","developer"],"heat_signals":["texas","austin","sun belt","rental market"],"importance":3,"selector_reason":"Crow Holdings对租赁市场出现复苏苗头的判断，提供了大型开发商对不同区域需求和投资机会的前瞻观察。该信息反映机构市场情绪，但属于单家公司观点，重要性为常规级。","section":"national","title_zh":"Crow Holdings在租赁市场看到复苏苗头","summary_zh":"Boston、西海岸和部分Sun Belt concessions开始消退，但市场恢复仍早且不均衡","impact":"long-pos","id":"4609f389","fetched_at":1788917036174}],"errors":[{"source":"The Real Deal (National)","error":"HTTP 403","attempted_urls":["https://therealdeal.com/national/feed/"]},{"source":"Houston Agent Magazine","error":"HTTP 403","attempted_urls":["https://houstonagentm
