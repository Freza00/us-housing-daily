ngoing dispute in which HUD suspended payments to LAHSA amid a fraud investigation. The agreement requires LAHSA to give back about $150M in federal funding. HUD previously announced the deal, but it is now final, the agency said in a release Tuesday . The agreement also shifts federal money from LAHSA to the Los Angeles County government in stages, LAist reported , adding that the deal preserves the LA region’s request for $240M in annual federal funding for housing services. Pixabay/ValterM Databases and systems maintained by LAHSA will switch over to the county over the coming months, and tighter oversight will be implemented. “Today's settlement closes a difficult chapter for LAHSA and allows us to move forward with greater clarity and stability,” LAHSA interim CEO Gita O’Neill said in a release. “Our focus now is on working closely with our local partners to ensure continuity of services, support an orderly transition, and remain true to our mission of connecting our unhoused neighbors with the services, resources, and pathways to housing they need.” LAHSA has been the subject of scrutiny at the local level since at least 2024, when an LA County audit found that the organization mismanaged hundreds of millions of dollars for homeless services. Executives connected with organizations that received money from LAHSA were charged with misappropriating millions of dollars, including an instance of homeless funds allegedly being diverted to a nightclub . An LAist investigation last year showed that a former LAHSA co-CEO finalized a $2.1M contract with a nonprofit where her husband was an executive, despite telling the publication she was recused from the decision-making. HUD officials, including Secretary Scott Turner, pointed the finger for the removal directly at LAHSA. “Year after year, LAHSA funneled billions of dollars in federal funding to organizations with no oversight, which resulted in nothing but skyrocketing homelessness, failing at their most basic responsibility,” Turner said in HUD’s statement. But U.S. District Judge David Carter, who presided over the case, placed blame at the feet of both LAHSA and HUD. “This has been an absolute past dereliction of duty by the federal government,” Carter said at a Friday hearing, as reported by LAist. “I termed it a partnership in failure,” he said. “Local government turned an absolute blind eye to the distribution of these funds and transparency and accountability for these funds.” Continue reading this story with a free account Log in or register","published_at":1794946381000,"mutable":false,"date_precision":"timestamp","modified_at":1794946396000,"extraction":"semantic","canonical":"https://bisnow.com/news/los-angeles/affordable-housing/lahsa-stripped-of-hud-funding-in-finalized-settlement","content_hash":"ee49f94e2aad603c4d7ac801ba2b15fbbc430a2c1ece414b1f8f6f419a72bac0","access":"public","evidence_status":"article","id":"798d9d58d162a190","source_family":"bisnow","is_research":false,"required_source":false,"first_seen_at":1794951480753,"acquisition_window":{"lower":1794862800000,"upper":1794949200000},"score":19,"tags":["housing","california","policy","regulation","regulator"],"heat_signals":["fed","annual"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"LAHSA To Return $150M Of HUD Funding In Finalized Settlement"},{"id":"body-1","text":"A federal judge signed an agreement between the Department of Housing and Urban Development and the Los Angeles Homeless Services Authority , removing the LA program from HUD oversight."},{"id":"body-2","text":"The settlement resolves an ongoing dispute in which HUD suspended payments to LAHSA amid a fraud investigation."},{"id":"body-3","text":"The agreement requires LAHSA to give back about $150M in federal funding."},{"id":"body-4","text":"HUD previously announced the deal, but it is now final, the agency said in a release Tuesday ."},{"id":"body-5","text":"The agreement also shifts federal money from earning up to 60 percent of the area median income.","evidence_basis":"body","cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"HSBC Sells $300M Of Data Center Debt Tied To Stargate Project At Big Discount","link":"https://www.bisnow.com/news/national/data-center-capital-markets/hsbc-sells-300m-of-data-center-debt-at-steep-discount","description":"Financial giant HSBC has sold $300M in data center construction debt at less than 90 cents on the dollar, the latest sign of lender wariness of the growing risks facing large-scale data center development. Wikimedia Commons/Barry Caruth The debt is part of an $18B financing package assembled by 20 banks for Project Jupiter, a massive data center development in Doña Ana County, New Mexico, Bloomberg reports . The construction financing closed last year after being marketed to lenders under the code name Project Miner amid a boom in debt financing for hyperscalers ’ artificial intelligence campuses. But Project Jupiter has since run into problems. The 1,400-acre campus is being developed by Blue Owl-backed Stack Infrastructure for OpenAI , Oracle and SoftBank 's Stargate initiative and could eventually reach 2.45 gigawatts. The project has faced concerns about potential delays due to community opposition and regulatory hurdles involving air and pipeline permits. In September, Oracle sent the developers a force majeure notice that would allow it to defer payments if the project is delayed or derailed. HSBC reportedly unloaded the $300M chunk of its debt tied to the project immediately after the force majeure notice, according to Bloomberg. HSBC isn't the only lender that has tried to reduce its exposure to Project Jupiter. Dutch bank ING is also reportedly seeking buyers for $25M of debt backing the development, along with nearly a dozen other data center loans. The debt sales are just the latest sign of growing volatility across data center credit markets. Lenders are showing concerns about escalating risks surrounding data center development — from community opposition and restrictive regulations to uncertainty about the future of AI cloud providers and alarm at the pace of hyperscale infrastructure spending. Jensen Huang ’s sudden resignation from Nvidia has only added to the unease surrounding the sector. Lender anxiety has been most apparent in the structured debt markets. In recent weeks, yields on some bonds tied to data center projects have climbed into the double digits, while even debt issued by major hyperscalers has traded at higher spreads than the investment-grade standard. At the same time, credit default swaps on data center debt have hit an all-time high. Analysts also say the lenders are concerned about concentration risk . The scale of capital required for the AI data center boom is unprecedented, and there is only so much capital that any lender is comfortable having tied up in just a handful of companies all pursuing broadly similar strategies. Continue reading this story with a free account Log in or register Related Topics: HSBC , Oracle , Project Jupiter , Stack Infrastructure , Stargate","published_at":1794947729000,"mutable":false,"date_precision":"timestamp","modified_at":1794947748000,"extraction":"semantic","canonical":"https://bisnow.com/news/national/data-center-capital-markets/hsbc-sells-300m-of-data-center-debt-at-steep-discount","content_hash":"90f63512c946db10ed7113d91aa7f0ff9fcf3b25c646ed65c36da1446adf050a","access":"public","evidence_status":"article","id":"4c80ccc9cfb00233","source_family":"bisnow","is_research":false,"required_source":false,"first_seen_at":1794951480753,"acquisition_window":{"lower":1794862800000,"upper":1794949200000},"score":16,"tags":["data-center","national","distress","deals","lender"],"heat_signals":["permits"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"HSBC Sells $300M lest multifamily property in the immediate area. 605 Davis will also feature a comprehensive, full-floor amenity package, including a rooftop pool, a state-of-the-art fitness center, and a 13th-floor amenity level spanning over 7,000 square feet with coworking spaces, a lounge, and outdoor terraces. Join us for the Connect Midwest Multifamily conference on the afternoon of Tuesday, June 8, 2027, at Joe’s Live in Rosemont, Illinois. Read More News Stories About: JLL Connect Inside The Story JLL About Jasmine Kilman Jasmine Kilman is Content Director of Connect Commercial Real Estate, covering Chicago and greater Chicagoland, the Midwest, Seattle, and the Pacific Northwest. She covers industry trends, transaction deals, market research, and produces daily news stories. With experience in marketing and communications for academic nonprofits and corporate clients, including Hearst Media, Hilton, and Coldwell Banker, Kilman has written about commercial real estate, environmental, social, and corporate governance (ESG), technology, healthcare, and philanthropy. She was born and raised in California and graduated with a degree in public relations. In her spare time, Kilman enjoys hiking and traveling to new locations with her family. Order Reprints Apartment buildings for sale Check out the latest properties available on apartmentbuildings.com 7801 South Shore Drive Chicago, IL Chicago & Midwest + Apartment Buildings Listing Status: Available Listing Type: Call for offers Price: $2,895,000 No. of Units: 32 Year Built: 1961 Opportunity Zone: No Price per unit: $90,468 Learn More 1900 Euclid Ave Cleveland, OH Chicago & Midwest + Apartment Buildings Listing Status: Available Listing Type: Call for offers Price: $19,000,000 No. of Units: 83 Year Built: 1912 Lot Size: 0.70289256198347 Acres Opportunity Zone: No Price per unit: $228,915 Learn More View all apartments Chicago & Midwest | Greater Chicagoland Apartments Debt, Equity Secured for Evanston Luxury High-Rise Development n Evanston and will be the tallest multifamily"}],"keep":true,"importance":4,"section":"cre","capital_focus":false,"geo_evidence":"downtown Evanston, Illinois","primary_event":"property_development_leasing","event_evidence_id":"body-3","event_evidence":"Chicago & Midwest + Greater Chicagoland + Apartments | November 17, 2026 By: Jasmine Kilman Debt, Equity Secured for Evanston Luxury High-Rise Development JLL has arranged financing and equity placement for 605 Davis, a 419-unit luxury high-rise multifamily development in downtown Evanston, Illinois.","market_evidence_id":"body-3","market_role":"asset_location","market_scope":"us","market_evidence":"Chicago & Midwest + Greater Chicagoland + Apartments | November 17, 2026 By: Jasmine Kilman Debt, Equity Secured for Evanston Luxury High-Rise Development JLL has arranged financing and equity placement for 605 Davis, a 419-unit luxury high-rise multifamily development in downtown Evanston, Illinois.","duplicate_of":null,"selector_reason":"JLL为Evanston 419套高层公寓项目安排Kayne Anderson合资股权及CIBC、ULLICO高级建设贷款，资本结构清晰且项目规模较大。","title_zh":"埃文斯顿 419 户高层项目完成债务与股权融资","summary_zh":"JLL 为伊利诺伊州埃文斯顿 605 Davis 安排 Kayne Anderson 合资股权及 CIBC、ULLICO 高级建设贷款；项目计划于 2028 年 5 月完成，交付 419 户住宅。","impact":"short-pos","evidence_quote":"Chicago & Midwest CRE News In Your Inbox. Sign up for Connect emails to stay informed with CRE stories that are 150 words or less. Chicago & Midwest + Greater Chicagoland + Apartments | November 17, 2026 By: Jasmine Kilman Debt, Equity Secured for Evanston Luxury High-Rise Development JLL has arranged financing and equity placement for 605 Davis, a 419-unit luxury high-rise multifamily development in downtown Evanston, Illinois.","evidence_basis":"body","cre_subcategory":"多户"},{"source_id":"trd-national","source_name":"The Real Deal (National)","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Congress eyes overhaul that could pile billions in fees on data center developers","link":"https://therealdeal.com/national/2026/11/16/congress-eyes-overhaul-for-data-center-development/","description":"The data centers pacing the AI boom could get a faster path to power, but at a steep price. A sweeping congressional permitting proposal would make it easier to build data center infrastructure, while potentially saddling developers with billions of dollars in additional electricity costs, the New York Times reported . The bill would streamline federal environmental reviews for projects including transmission lines, gas pipelines and power generation facilities, potentially easing one of the biggest obstacles to data center development: securing enough electricity to operate. But it would also force data centers to pay more to access the electric grid, shifting costs historically spread among utility customers. One provision would direct the Federal Energy Regulatory Commission to establish rules requiring data centers to cover both the cost of grid upgrades needed to serve them and the expense of using existing transmission infrastructure. The proposal would upend longstanding regulatory principles that prevent utilities from charging customers twice for the same grid capacity. Federal grid charges alone could cost data centers an additional $35 billion over the next decade, according to a report from consulting firm Grid Strategies. States could potentially collect another $136 billion under separate provisions. “The day of data center freeloading ends when this bill passes,” said Sen. Sheldon Whitehouse, a co-author of the bill. The Data Center Coalition, a prominent trade group, has not taken a stance yet on the bill. SIGN UP The proposal arrives as data center developers face mounting political resistance over the facilities’ enormous power demands. Many campuses consume as much electricity as small cities, raising concerns about infrastructure costs, utility bills and the strain on local grids. Voters approved at least 40 local ballot initiatives restricting data centers in this month’s midterm elections. For developers, the legislation presents a complicated trade-off. Faster federal approvals could help unlock power infrastructure and make more sites viable. But higher electricity costs could alter project economics, particularly in markets where grid capacity is already constrained. The bill could also encourage data center development on federal land, where the Interior Department is considering at least 17 applications, according to the Center for Western Priorities. Even if Congress moves forward, state and local approvals would remain a hurdle. — Holden Walter-Warner Read more Development Texas Love ‘em or hate ‘em, data centers grab real estate spotlight in Texas elections","published_at":1794862800000,"source_family":"trd-national","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794865086470,"id":"5d8fb7aa5187c1cf","acquisition_window":{"lower":1794862800000,"upper":1794949200000},"score":12,"tags":["data-center","national","policy","construction","regulator"],"heat_signals":["fed"],"date_precision":"timestamp","modified_at":0,"extraction":"semantic","canonical":"https://therealdeal.com/national/2026/11/16/congress-eyes-overhaul-for-data-center-development","content_hash":"6984fe904d5449f6d51fc9b9d38da3a2e2a3709dd3997a0956a3a34274b59f3f","access":"preview","evidence_status":"preview","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Congress eyes overhaul that could pile billions in fees on data center developers"},{"id":"body-1","text":"The data centers pacing the AI boom could get a faster path to power, but at a steep price."},{"id":"body-2","text":"A sweeping congressional permitting proposal would make it easier to build data center infrastructure, while potentially saddling developers with billions of dollars in additional electricity costs, the New York Times reported ."},{"id":"body-3","text":"The bill would streamline federal environmental reviews for projects including transmission lines, gas pipelines and power generation facilities, potentially easing one of the biggest obstacles to data center development: securing enough electricity to operate."},{"id":"body-4","text":"But it would also force data centers to pay more to access the electric grid, shifting costs historically spread among utility customers."},{"id":"body-5","text":"One provision would direct the Federal Energy Regulatory Commission to establish rules requiring data centers to cover both the cost of grid upgrades needed to serve them and the expense of using existing transmission infrastructure."},{"id":"body-6","text":"The proposal would upend longstanding regulat"}],"keep":true,"importance":4,"section":"cre","capital_focus":false,"geo_evidence":null,"primary_event":"market_research_policy","event_evidence_id":"body-2","event_evidence":"A sweeping congressional permitting proposal would make it easier to build data center infrastructure, while potentially saddling developers with billions of dollars in additional electricity costs, the New York Times reported .","market_evidence_id":"body-3","market_role":"market_policy","market_scope":"us","market_evidence":"The bill would streamline federal environmental reviews for projects including transmission lines, gas pipelines and power generation facilities, potentially easing one of the biggest obstacles to data center development: securing enough electricity to operate.","duplicate_of":null,"selector_reason":"国会提案拟简化数据中心及电力基础设施环境审查，同时要求数据中心承担电网升级和输电使用成本，可能重塑项目经济性。","title_zh":"数据中心电网费用或新增 350 亿美元","summary_zh":"国会提案拟加快数据中心基础设施审批，但要求开发商承担电网升级及输电使用成本；Grid Strategies 估计，联邦电网费用未来十年或新增 350 亿美元。","impact":"short-neg","evidence_quote":"The data centers pacing the AI boom could get a faster path to power, but at a steep price. A sweeping congressional permitting proposal would make it easier to build data center infrastructure, while potentially saddling developers with billions of dollars in additional electricity costs, the New York Times reported .","evidence_basis":"body","cre_subcategory":"数据中心"},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Ackman says Trump can still end GSE conservatorships, relist this term","link":"https://www.housingwire.com/articles/ackman-fannie-freddie-conservatorship-relisting-trump/","description":"Bill Ackman still believes Fannie Mae and Freddie Mac can be relisted on the New York Stock Exchange and exit their conservatorships before the end of President Donald Trump’s second term, even after Democrats won control of both chambers in the midterm elections. In a letter to Pershing Square Holdings shareholders signed in early November, Ackman, the company's founder and CEO, and chief investment officer Ryan Israel wrote that “a relisting and release from conservatorship can be accomplished by the President using his executive authority without any involvement of Congress .\" They argue that the administration has a political incentive to act before 2029 to avoid “handing control” of the government-sponsored enterprises (GSEs) to a future administration, given the influence they have over housing policy. Ackman and Israel said the GSEs can be released “in a manner that maintains and enhances mortgage affordability while maximizing the long-term value of American taxpayers’ 79.9% ownership of the two companies.” The Department of the Treasury holds warrants to acquire 79.9% of each enterprise’s common stock. Pershing first detailed a road map in November 2025. The plan begins with a new agreement between the Treasury and the Federal Housing Finance Agency (FHFA) that addresses repayment or restructuring of Treasury’s senior preferred stock. The next step would be for the Treasury to exercise its warrants to purchase 79.9% of the GSEs' common shares. The final step would be FHFA approval for the GSEs to relist on the NYSE as privately owned operating companies. “The relisting and release of F2 will be one of the few major pieces of economic policy the President can still achieve after the midterms,” Ackman and Israel wrote. “We believe that there is no credible alternative to F2 exiting conservatorship and relisting on the NYSE as private-sector-owned operating companies.” The memo also says Treasury Secretary Scott Bessent has indicated the administration will focus on the GSEs and their future ownership status in 2027 and 2028. 18 years under consevatorship Fannie and Freddie have been in conservatorship for 18 years. According to the Pershing memo, they now have more than $200 billion of shareholder equity. Over the past decade, average annual credit losses have been “only 0.05%,” and current capital levels are described as roughly 50 times that loss rate. Ackman and Israel estimate that combined capital could grow to more than $375 billion over the next five years, or more than 4% of the mortgage-backed securities guaranteed by the enterprises. On valuation, the memo says the GSEs currently trade at about 1.5 times their earnings. From Trump’s election through the end of last year, when talk of a relisting was more active, their share prices rose by about eight times. This year, by contrast, their share prices have fallen more than 60% as the administration has remained “silent” on the issue, the investors said. Pershing Square is heavily exposed to the outcome. The fund holds about 99 million shares of Fannie Mae, with a market value of roughly $422.5 million, along with roughly 95 million shares of Freddie Mac valued at about $386.9 million, according to the memo. Related More: Conservatorship Fannie Mae Freddie Mac Trump Administration","published_at":1794865257000,"mutable":false,"date_precision":"timestamp","modified_at":1794865259000,"extraction":"semantic","canonical":"https://housingwire.com/articles/ackman-fannie-freddie-conservatorship-reli ange and exit their conservatorships before the end of President Donald Trump’s second term, even after Democrats won control of both chambers in the midterm elections.","market_evidence_id":"body-1","market_role":"capital_subject","market_scope":"us","market_evidence":"Bill Ackman still believes Fannie Mae and Freddie Mac can be relisted on the New York Stock Exchange and exit their conservatorships before the end of President Donald Trump’s second term, even after Democrats won control of both chambers in the midterm elections.","duplicate_of":null,"selector_reason":"Pershing Square负责人提出总统可在任期内推动两房退出监管托管并重新上市，属于重要住房金融政策观点，但仍是投资者判断而非已实施行动。","title_zh":"Ackman 仍预计 GSE 可在本届任期内重组上市","summary_zh":"Bill Ackman 及 Ryan Israel 认为，Fannie Mae 与 Freddie Mac 可在总统第二任期结束前退出监管并重新上市，但该判断属于 Pershing Square 的政策观点，且仍存在政治与执行不确定性。","impact":"neutral","evidence_quote":"Bill Ackman still believes Fannie Mae and Freddie Mac can be relisted on the New York Stock Exchange and exit their conservatorships before the end of President Donald Trump’s second term, even after Democrats won control of both chambers in the midterm elections.","evidence_basis":"body","cre_subcategory":null},{"source_id":"zillow-research","source_name":"Zillow Research","source_tier":"B","source_weight":9,"source_tags":["housing","data","trend"],"region":"national","title":"Zillow: CPI Shelter Forecast, November 2026","link":"https://www.zillow.com/research/cpi-forecast-2026-nov/","description":"Zillow: CPI Shelter Forecast, November 2026 Zillow forecasts 3.0% rent inflation, 3.6% OER inflation annually in October, as measured by the Consumer Price Index. Written by Treh Manhertz on November 17, 2026 New shelter inflation numbers from the Bureau of Labor Statistics are scheduled to be released on Thursday, December 10, 2026 at 8:30 ET. Key Takeaway CPI housing inflation is expected to firm into the end of the year. We currently forecast annual rent inflation to finish 2026 around 3.0% and OER near 3.5%. Part of the year-end rise is mechanical, as the BLS folded October 2025's increase ,missed during the government shutdown, into April 2026. This adjustment will add about 0.3 points to the true underlying annual rate until April 2027. From last month's forecast, the year-end outlook was revised up for OER (3.44% to 3.53%) and down for rent (3.06% to 3.04%). New-lease rents have been growing at their fastest pace of 2025-2026, no longer pulling down housing inflation measures. Forecasts for on-market rents have been revised higher for the past few months. The Forecast Period Owners’ Equivalent Rent Rent of Primary Residence Shelter Forecast MoM (YoY) Actual MoM (YoY) Forecast MoM (YoY) Actual MoM (YoY) Forecast MoM (YoY) Forecast MoM (YoY) June 2026 0.27% (3.28%) 0.24% (3.25%) 0.26% (2.96%) 0.15% (2.84%) 0.26% (3.40%) 0.12% (3.26%) July 2026 0.27% (3.25%) 0.26% (3.23%) 0.22% (2.82%) 0.26% (2.86%) 0.18% (3.21%) 0.14% (3.16%) August 2026 0.26% (3.16%) 0.19% (3.08%) 0.27% (2.85%) 0.17% (2.75%) 0.22% (2.99%) 0.26% (3.03%) September 2026 0.22% (3.15%) 0.35% (3.28%) 0.17% (2.70%) 0.25% (2.75%) 0.19% (3.02%) 0.39% (3.22%) October 2026 0.27% (3.33%) 0.32% (X) 0.23% (2.82%) 0.20% (X) 0.28% (3.39%) 0.30% (X) November 2026 0.27% (3.56%) -- 0.23% (3.04%) -- 0.28% (3.57%) -- + + + + + + + + + + + + + + + + + + + + + December 2026 0.28% (3.53%) -- 0.27% (3.04%) -- 0.28% (3.47%) -- + + + + + + + + + + + + + + + + + + + + + October 2027 0.26% (3.26%) -- 0.22% (2.77%) -- 0.26% (3.28%) -- Owners’ Equivalent Rent (OER) Monthly outlook: Owner's Equivalent Rent, which measures what homeowners would theoretically pay to rent their own homes, is projected to increase 0.27% in November 2026 (95% interval 0.15% – 0.40%). This would bring the annual increase in the index to 3.56%. We expect the monthly growth to trend toward a 0.26% pace over the coming year. Annual outlook: We forecast OER to rise 3.53% over 2026, slightly exceeding the 2025 increase of 3.36%. Annual outlook: We forecast OER to rise 3.53% over 2026, slightly exceeding the 2025 increase of 3.36%.* Rent of Primary Residence Monthly outlook: Rent of Primary Residence, which tracks rent payments, is projected to increase 0.23% in November 2026 (95% interval 0.09% – 0.37%). This would bring the annual increase in the index to 3.04%. We expect the monthly growth to trend toward a 0.21% pace over the coming year. Annual outlook: We forecast the Rent of Primary Residence index to rise 3.04% over 2026, slightly exceeding the 2025 increase of 2.92%.* *Both annual figures are distorted by the October 2025 shutdown: the 2025 increase reads low and the 2026 increase high, each by about 0.27 percentage points for OER, 0.28 for rent and 0.30 for shelter: our estimate of October 2025's increase, which BLS booked in April 2026. Market Rents Single-family: Zillow’s expectations for on-market rent growth for single-family units was revised up: Single-family rents are expected to rise 3.4% year-over-year in 2026. Multifamily: Zillow’s expectations for on-market rent growth for apartments was revised up: Multifamily rents are expected to rise 2.9% year-over-year in 2026. Looking further out, single-family rents are expected to rise 3.0% and multifamily rents 2.6% over the 12 months to October 2027, against 3.2% and 2.5% over the year to October 2026. Methodology These forecasts are based on predictions from a model that makes explicit the relationship between on market rents (measured by the Zillow’s Observed Rent Index) and the shelter components of the Consumer Price Index (CPI). The model incorporates: Expected on-market rent growth (Zillow’s Observed Rent Forecast, ZORF) Assumptions about how landlords adjust rents at lease renewal Renter mobility rates, which determine what share of tenants face a market rent increase. Sign up for Zillow Research updates Subscribe to receive weekly emails for the latest Zillow research, weekly housing data, market insights and more. Email Subscribe By submitting this form, you agre ty Bankers of America Key Insight: Why a proposed accounting standard complicates mortgage servicing valuations for some financial institutions.","market_evidence_id":"body-1","market_role":"capital_subject","market_scope":"us","market_evidence":"Facebook X (Twitter) LinkedIn Email Ron Haynie, senior vice president of mortgage finance policy at the Independent Community Bankers of America Key Insight: Why a proposed accounting standard complicates mortgage servicing valuations for some financial institutions.","duplicate_of":null,"selector_reason":"拟议FASB会计规则可能改变抵押贷款服务权估值，并促使社区银行出售servicing资产，涉及金融机构资本治理。","title_zh":"拟议 FASB 规则或促使社区银行出售服务权","summary_zh":"National Mortgage News 称，拟议会计准则可能使部分金融机构的抵押贷款服务权估值更复杂，并增加社区银行出售服务权的压力。","impact":"short-neg","evidence_quote":"Facebook X (Twitter) LinkedIn Email Ron Haynie, senior vice president of mortgage finance policy at the Independent Community Bankers of America Key Insight: Why a proposed accounting standard complicates mortgage servicing valuations for some financial institutions. Expert Quote: Allowing exceptions “would preserve, and in our view could widen, the diversity in practice the project was undertaken to resolve,” — PennyMac Financial Services CFO Dan Perotti wrote. Overview bullets generated by AI with editorial review.","evidence_basis":"body","cre_subcategory":null},{"source_id":"zillow-research","source_name":"Zillow Research","source_tier":"B","source_weight":9,"source_tags":["housing","data","trend"],"region":"national","title":"A Better Credit Score Could Save Buyers $864 a Year on a Typical Mortgage","link":"https://www.zillow.com/research/credit-score-mortgage-rate-savings/","description":"A Better Credit Score Could Save Buyers $864 a Year on a Typical Mortgage New Zillow analysis finds that in October 2026, buyers in the highest credit band got a mortgage rate 36 basis points lower than buyers in the lowest band Written by Kara Ng on November 17, 2026 Key findings In October 2026, buyers with a credit score of 740 or higher were quoted a 7.23% rate on average on a 30-year fixed mortgage. Those with a credit score between 680 and 739 typically were quoted a 7.45% rate, while those with a score below 680 on average were quoted a rate of 7.59%, a 36-basis-point spread between the highest and lowest credit bands. With a 20% down payment, the total monthly payment on a typical U.S. home in October, worth $364,812, would have been $2,656 in the lowest credit score band and $2,584 in the highest. That’s an annual savings of $864 for those with the best credit scores. As of October 2026, a median-income household with a score of 740 or higher could afford a $317,572 home, versus $308,924 for a score below 680. That gap puts about 21,500 more active listings within reach nationwide. A higher credit score can be worth real money. A buyer with a strong credit score (740 or higher) can save more than $800 per year compared to a buyer with a low credit score (300-679) when buying the typical U.S. home. Those savings would have brought about 21,500 additional listings within budget nationwide for a median-income household in October. A better credit score changes the affordability math Home buyers with higher credit scores often receive a lower mortgage rate on their loan, which means a lower monthly payment. In October, the average mortgage rate offered to buyers with strong credit scores was 7.23%, while buyers with low credit scores were quoted a 7.59% rate, on average. For a typical U.S. home ($364,812) with a 20% down payment, that would mean a difference of $72 in each month’s mortgage payment, or $864 a year. Buyers with good scores of 680 to 739 sat in between, with a 7.45% rate, on average. That means they would pay $348 a year less than someone with a low credit score, but $516 a year more than someone with a strong credit score. These savings stretch a home buyer's budget, bringing more homes within reach. In October, a median-income household with a low credit score could afford a $308,924 home — meaning it would spend no more than 30% of its income on housing costs — given the average mortgage rate on offer. If that same median-income household had a strong credit score, it could afford a $317,572 home, an increase of about $8,650 in buying power. Where a better score is worth the most A better credit score brings the biggest potential savings in coastal markets, where home values are higher. Across the 50 largest metro areas, moving from a low credit score to a strong one saves anywhere from $45 a month in Pittsburgh to $304 in San Jose. A home buyer in San Jose could save $3,648 a year by moving from a low credit score to a strong one, followed by San Francisco ($2,688), Los Angeles ($2,256), San Diego ($2,208) and New York ($1,740). San Jose buyers would also enjoy the largest gain in buying power from improving their credit score at $18,778, ahead of Seattle ($14,896), San Francisco ($14,602), Raleigh ($13,688) and Washington, D.C. ($13,489). The smallest annual savings are in Pittsburgh ($540), Oklahoma City ($576), Memphis ($576) and Cleveland ($588). These are markets where mortgage payments are relatively inexpensive already, so there is less room for improvement with a lower rate. October's rate gap was the narrowest of 2026 The 36-basis-point spread in mortgage rates offered to buyers with strong and low credit scores in October was the narrowest of the year. Across the first 10 months of 2026, the rate difference between the lowest and highest credit bands ranged from 36 basis points in October to 58 basis points in April, with a median of 46 basis points. The monthly payment gap ranged from $72 in October to $110 in April, with a median of about $88, so the typical buyer in the lowest band paid roughly $1,050 a year more than a buyer in the highest band over that stretch. Improving their credit score is not the only way a buyer can secure a better rate. Buyers can also compare offers from multiple lenders , yet few actually do. Among buyers who contacted a lender, 62% contacted only one, according to Zillow's 2026 Consumer Housing Trends Report . Methodology Rates come from Zillow's Custom Quotes marketplace and reflect 30-year fixed conventional conforming purchase loans with 20% down or more. Credit bands are 300-679, 680-739 and 740+, and rates are quoted nationally. Quotes do not come from Zillow Home Loans. Data is as of October 2026. Affordability is calculated for a median-income household in a given region. Monthly payment is the total estimated payment for a typical home in a given region with 20% down, including estimates for taxes, insurance and maintenance. Affordability difference by credit score, October 2026 Metro area* Annual savings, strong credit score (740+) vs. low credit score (300-679) Buying power gain, strong credit score (740+) vs. low credit score (300-679) Share of affordable listings, low credit score (300-679) Share of affordable listings, strong credit score (740+) Additional listings in budget, strong credit score (740+) vs. low credit score (300-679) United States $864 $8,648 34.1% 35.7% 21,478 New York, NY $1,740 $9,478 13.5% 14.2% 358 Los Angeles, CA $2,256 $10,699 3.2% 3.5% 99 Chicago, IL $840 $8,720 45.6% 48.4% 688 Dallas, TX $852 $8,228 30.8% 32.7% 658 Houston, TX $720 $7,504 35.1% 36.9% 651 Washington, D.C. $1,356 $13,489 39.1% 41.4% 491 Philadelphia, PA $924 $9,202 45.9% 48.6% 503 Miami, FL $1,140 $7,063 26.7% 28.0% 605 Atlanta, GA $888 $8,958 33.3% 35.9% 860 Boston, MA $1,728 $12,974 14.4% 15.2% 105 Phoenix, AZ $1,044 $10,964 23.5% 26.4% 776 San Francisco, CA $2,688 $14,602 12.1% 13.8% 139 Riverside, CA $1,380 $9,495 10.","published_at":1794913200000,"mutable":false,"date_precision":"timestamp","modified_at":1794936059000,"extraction":"body_fallback","canonical":"https://zillow.com/research/credit-score-mortgage-rate-savings","content_hash":"0813ae760ae31a6ab7c1a49c64f459514823b1143ef428869e0f27f95024b079","access":"public","evidenc alse,"geo_evidence":null,"primary_event":"market_research_policy","event_evidence_id":"body-1","event_evidence":"A Better Credit Score Could Save Buyers $864 a Year on a Typical Mortgage New Zillow analysis finds that in October 2026, buyers in the highest credit band got a mortgage rate 36 basis points lower than buyers in the lowest band Written by Kara Ng on November 17, 2026 Key findings In October 2026, buyers with a credit score of 740 or higher were quoted a 7.23% rate on average on a 30-year fixed mortgage.","market_evidence_id":"body-3","market_role":"market_policy","market_scope":"us","market_evidence":"With a 20% down payment, the total monthly payment on a typical U.S. home in October, worth $364,812, would have been $2,656 in the lowest credit score band and $2,584 in the highest.","duplicate_of":null,"selector_reason":"Zillow量化信用评分对按揭定价的影响：最高与最低信用区间相差36个基点，典型借款人年利息差864美元。","title_zh":"高信用买家典型房贷年省 864 美元","summary_zh":"Zillow 分析显示，2026 年 10 月信用分数 740 及以上买家平均获报 7.23% 房贷利率，较低信用组低 36 个基点，典型住房年节省 864 美元。","impact":"neutral","evidence_quote":"A Better Credit Score Could Save Buyers $864 a Year on a Typical Mortgage New Zillow analysis finds that in October 2026, buyers in the highest credit band got a mortgage rate 36 basis points lower than buyers in the lowest band Written by Kara Ng on November 17, 2026 Key findings In October 2026, buyers with a credit score of 740 or higher were quoted a 7.23% rate on average on a 30-year fixed mortgage.","evidence_basis":"body","cre_subcategory":null},{"source_id":"cotality-research","source_name":"Cotality / CoreLogic Research","source_tier":"B","source_weight":9,"source_tags":["housing","data","trend"],"region":"national","title":"A conflict of interest","link":"https://cotality.com/insights/articles/a-conflict-of-interest","description":"Non-QM loans are part of the equation helping investors expand their footprint in the property market. Financing edge: Five-year, interest-only loans can maximize rental margins over short hold periods. Market shift: As institutional investment retreats, mom-and-pop buyers stepped in, acquiring 20% more homes than they sold. Buyer fallout: Heavy investor demand keeps prices and rents high, contributing to locking gig and freelance workers out of ownership. Millions of Americans now embrace freelancing, small-business ownership, or gig-economy careers, but the industry hasn’t widely adopted lending structures that correspond to this shift. Add to that dynamic the increasingly unaffordable price tag for homes, and many would-be homeowners are stuck as renters. Many are renting from similarly minded entrepreneurs: mom-and-pop investors. The difference is that investors are turning to non-QM mortgages to finance property transactions, according to Cotatlity data. Many are doing so to take advantage of interest-only payments. The five-year flip The U.S. housing market offers an ideal proposition to small investors. Rents have increased 25% in the last five years, the federal government has curbed institutional investment, and home equity continues to rise. Investors are responding by reasserting their presence in markets across the U.S. Cotality data shows that the share of investors making home purchases has climbed since mid-2022 and now represents about a third of all transactions. Small investors represent about half of that transaction volume. Investment transactions occur frequently, making them an ideal candidate for interest-only loans. Nearly half of investor hold onto a property for five years or less — that precise timeframe makes an interest-only mortgage worth the equity tradeoff. Most interest-only loans have an initial period of five years before principal repayment begins where monthly commitments are reduced to create wider profit margins on rents. While investors who finance this way won’t reap the benefits of accrued equity, they can profit from the persistently high home prices and a tight inventory that makes short-term commitments profitable. How long does each investor type hold property Data source: Cotality, 2026 The U.S. is short 4.7 million homes . The ones that are available are in high demand. Add in mortgage rates near 7%, and affordability is being tested at its limits. Home prices reflect that squeeze. That dynamic has allowed investors in states like California, where they buy over a third of all homes, to profit on investments financed by interest-only loans. Investors nearly doubled the number of purchases they made in Los Angeles between Q1 and Q2 2026. Home prices jumped 2% during that period. This localized surge in investment is colliding directly with broader national price pressures—a dynamic we analyzed in our piece, Bend It Like Buyers. In major metros, that friction has created a stalemate between buyers and sellers, leaving the door open to more financially flexible investors. Many blame Wall Street. Institutional investors ban themselves Injecting corporate-backed demand into a market where local buyers are already stretched, extends even the most flexible buyers past their breaking point. Local residents who are priced out of home purchases find themselves competing with incoming industrial contractors for the exact same rental inventory. The resulting rent escalation drives up investor yields in the short term, but it simultaneously compresses local household purchasing power and accelerates affordability risk. That has a direct influence on local markets. In states like California, Texas, and Georgia, where investors buy over a third of all homes, prices have risen disproportionately. In Texas, home prices jumped 38% as investor share climbed to 31% between 2020 and 2023. In Georgia, prices jumped 54% alongside an investor share increase to 29%. But the passage of the 21 st Century ROAD to Housing Bill disrupted that playbook. Even before the passage of the bill, Cotality data shows that institutional investment contracted from around 250 home purchases a week to 100. Mom-and-pop investors filled the gap. Small-time landlords entered a market where equity was on the rise, which allowed them to build a cash cushion to insulate them from current high-interest rates and create wider profit margins that allow them to redeploy capital elsewhere. When that equity cushion is layered atop monthly rental income profit, these landlords can offset systemic hurdles such as interest rates and rising home insurance costs. Much of that extra capital is going into increasing their market share. Small mom-and-pop investors purchased 20% more homes than they offloaded last year, according to Cotality data. Their persistent presence is reshaping the housing market. Main street moves in Across the country, investors are the ones with the financial wherewithal to purchase homes in the current high-cost, high-rate environment. This is contributing to keeping costs — from home prices to rents — elevated and widening the gap for aspiring homeowners. Some renters will be blocked from homeowership by these costs. Others will bend and stretch to make the homeownership math work. Some will look to non-QM mortgages themselves. Forward-looking lenders who are optimizing for long-term growth will cater to both sides. There is now a path forward. It may be unconventional, but it is a door through which an increasing number of investors and homeowners are stepping to make the dream of homeownership a reality. Webinar Non-QM mortgages are remixing the mortgage market Property market economics Mortgage banking & financial technology","published_at":1794934800000,"date_precision":"day","published_date":"2026-11-17","modified_at":0,"extraction":"semantic","canonical":"https://cotality.com/insights/articles/a-conflict-of-interest","content_hash":"f6e0c16171ab4c85a5055130b3cf6e7e0b4863cdfba321e29e7efd671d20ed65","access":"public","source_family":"cotality","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794951480753,"id":"f09a973c93 mpus A Westcore-affiliated entity acquired Woodinville Corporate Center I, a multi-tenant, light industrial park located in the Woodinville submarket east of Seattle, in a transaction reported to be worth $51.1 million. Located at 17606–17683 128th Place NE, along the SR-522 Corridor, Woodinville Corporate Center I was sold by Blackstone's Link Logistics, one of the largest owners and operators of last-mile warehouse and industrial real estate in North America.","evidence_basis":"body","cre_subcategory":"工业"},{"source_id":"nahb-eyeonhousing","source_name":"NAHB Eye on Housing","source_tier":"B","source_weight":8,"source_tags":["data","trend","policy"],"region":"national","title":"Custom Home Building Share Rises in 2025","link":"https://eyeonhousing.org/2026/11/custom-home-building-share-rises-in-2025/","description":"Custom Home Building Share Rises in 2025 November 17, 2026 Ashok Chaluvadi No Comments Custom homes accounted for 19.6 % of all single-family homes started in 2025 up from the 17.5 % in 2024. The custom home market consists of contractor-built and owner-built houses—homes built one at a time for owner occupancy on the owner’s land, with either the owner or a builder acting as a general contractor. The alternatives are homes built for sale (on the builder’s land, often in subdivisions, with the intention of selling the house and land in one transaction) and homes built for rent. In 2025, 71.8 % of the single-family homes started were built for sale, and 8.6 % were built for rent according to the most recent release of the Census Bureau’s Survey of Construction (SOC). While the custom-home percentage increased in 2025, the number of custom homes started in 2025 (182,869) also increased compared to the number of custom homes started in 2024 (176,932). Quarterly published statistics show that the custom-home share of single-family starts remained flat in 2026. Although the quarterly statistics are more timely, they lack the geographic detail available in the annual data set. When analyzed across the nine census divisions, the annual data show that the highest custom home share in 2025 was 47.0% in the New England division. The lowest shares were in the West South-Central Division at just 12.7%, 13.7% in the Mountain Division , and 15.7% in the South Atlantic Division . custom homes , Survey of Construction (SOC) Prev Previous Builder Sentiment Continues to Fall on Affordability Concerns Leave a Reply Cancel reply Your email address will not be published. Required fields are marked * Comment * Name * Email * Website Yes, add me to your mailing list Share this Page Subscribe to Blog Subscribe Search by Category Video Updates View Please leave this field empty Subscribe to Blog via Email Email Frequency * Instant Daily Weekly Check your inbox or spam folder to confirm your subscription. Construction Statistics Single-Family Multifamily Remodeling Labor Force Construction Wages Employment Data Job Openings Finance Builder Loans Consumer Finance Mortgages Home Sales and Prices Housing Affordability Housing Prices Housing Sales Macroeconomics Federal Reserve GDP Inflation Market Trends Housing Characteristics Housing Demand Industry Demographics Policy Research Building Materials Homeownership Tax Policy Local Data NAHB Indices Research Studies","published_at":1794927900000,"source_family":"nahb-eyeonhousing","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794951480753,"id":"cce5893e0706c3e2","acquisition_window":{"lower":1794862800000,"upper":1794949200000},"score":17,"tags":["housing","national","data","construction","homebuilder"],"heat_signals":["occupancy"],"date_precision":"day","published_date":"2026-11-17","modified_at":0,"extraction":"body_fallback","canonical":"https://eyeonhousing.org/2026/11/custom-home-building-share-rises-in-2025","content_hash":"7b2003f74b9eccc5bf8d9f55b9e890d2b90ce6f9dbeeb64fafe9948522d2f044","access":"public","evidence_status":"article","editorial_protocol":"evi d through the 30-year life of the loan, new home buyers pay $117 per month less. National Overview The median listing price for newly built homes in the United States rose slightly in the third quarter of 2026, reaching $451,071. This is right in line with where new home prices were last year in the third quarter as well as in the third quarter of 2024. New home listing prices have been remarkably stable throughout the post-pandemic period of elevated mortgage rates. Existing home prices, on the other hand, continued to grow through 2025 but have given up ground so far in 2026. For the third quarter this year, existing home prices came in 1.5% below 2025 levels, landing at $402,883. Builders were quicker to adjust to the realities of muted buyer demand in this high rate environment, while existing home sellers had pricing expectations based on the market from 2021 and 2022 that were slower to dissolve. The overall price softness we’ve seen through 2026 is driven primarily by the existing home segment. The recovery in the number of homes for sale has slowed significantly in 2026 for both new construction and resale homes, as inventory on the market is inching closer to pre-pandemic levels. In 2026Q3, new home inventory grew just 0.1% year over year and existing home inventory grew 3.1%. Existing home sellers have been reluctant to put their homes on the market as selling conditions have softened: falling prices, longer times on market, more price reductions. Builders are facing challenges as well–increased labor and material costs, decreased buyer demand–that have led to the completion rate of new single family homes falling 11.0% year over year in September. New resale listings and newly completed homes are slowly trickling onto the market rather than surging like they were a few years ago. One notable result from the past three quarters of this data series is that builders were cutting listing prices at a higher rate than existing home sellers. We chalked this up to the resale market finally adjusting its expectations and setting initial prices lower, lessening the need for price adjustments, but this quarter existing home price reductions came roaring back. Resellers are now cutting prices on 21.6% of homes for sale while builders are doing the same for 20.9%. Both measures are higher than they were last year at this time, but while builders are steadily increasing their share of price reductions, resale homes with price cuts are resurgent after taking a step back early this year. Regardless of their relative positions, the growing incidence of price reductions for new and existing homes is an indication of softness in the housing market in general and gives reason to expect that the diminished pace of inventory growth will continue. Though there is nearly a $50,000 gap between the median new home price and the median existing home price, new homes tend to be larger (a median of 2,056 square feet compared to 1,790 square feet this quarter). Adjusting for size, this price gap disappears. The median price per square foot for new homes was $218 in 2026Q3 and for existing homes it was $219. This counterintuitive result can be attributed to the three most important factors in real estate: location, location, location. New builds are heavily concentrated in the South and in the suburbs where land is less expensive. If the current trends in listing prices continue, though, we could see the median existing home price per square foot drop back below the same measure for new homes in the coming quarters. The recent pullback by builders is making new construction less impactful in the market than it has been in the past. The new construction share of listings fell from 17.2% in 2025Q3 to 16.7% in 2026Q3 and the new construction premium (the percent difference in median listing price between new and existing homes) rose from 10.3% to 12.0%. Buyers are finding fewer new homes for sale and the ones they do find are relatively more expensive. New Home Buyers Pay Lower Mortgage Rates than Existing Home Buyers Since April, an odd outcome has presented itself: the median price of newly built homes sold in the United States is lower than the median price of existing homes sold. In September, the median sales price for new homes , which has been falling faster over the past few years than new home asking prices, was $400,400 while for existing homes it was $417,500. This does not imply that a new build in the same neighborhood with similar specifications to an older home is selling at a lower price. It has much more to do with geographic mix. The pricier Northeast, home to some of the hottest home sales markets in the country right now and home to relatively little new construction activity, makes up 11.8% of existing home sales and just 4.7% of new home sales. The more affordable South, where many markets are seeing home sales fall and where new construction activity is heavily concentrated, makes up 61.1% of new home sales to just 46.6% of existing home sales. Geographic mix can also help explain the difference between our observed median listing price for new homes and the median sale price, as Northeastern new home listings are a larger share of the market tha","published_at":1794909606000,"source_family":"realtor-com","is_research":true,"required_source":true,"mutable":false,"first_seen_at":1794951480753,"id":"67fb452fec05bd6f","acquisition_window":{"lower":1794862800000,"upper":1794949200000},"score":14,"tags":["housing","national","construction","trend","homebuilder"],"heat_signals":["mortgage rate"],"date_precision":"timestamp","modified_at":1794596421000,"extraction":"semantic","canonical":"https://realtor.com/research/new-construction-insights-2026q3","content_hash":"6ace10a7be735adb4a87f85c3b4ca1c2c8ce0c1694564263f4f8dd04e96c579e","access":"public","evidence_status":"article","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"New-Construction Insights: Builders Hol urce_weight":9,"source_tags":["mixed-asset","data","trend"],"region":"national","title":"MarketBeat Minneapolis Multifamily Q3 2026","link":"https://cushmanwakefield.com/en/united-states/insights/us-marketbeats/minneapolis-marketbeats/multifamily","description":"Share: Share on Facebook Share on Twitter Share on LinkedIn I recommend visiting cushmanwakefield.com to read:%0A%0A {0} %0A%0A {1} Insights Minneapolis Multifamily MarketBeat This MarketBeat report covers the Minneapolis multifamily market for Q3 2026, highlighting key themes across the local economy, supply, demand, and pricing. Read the report for the full details and context. DOWNLOAD THE Q3 2026 REPORT Key Takeaways The Minneapolis–St. Paul economy showed signs of cooling in Q3 2026. Nonfarm employment held at just over 2.0 million workers, while the local unemployment rate climbed 30 bps YOY to 4.1%. Deliveries totaled 1,070 units in Q3 2026, lifting YTD completions to 3,267 units, nearly equal to the 3,364 units delivered in all of 2025, and pushing total inventory to 274,491 units. Renters absorbed 1,141 units in Q3 2026, below the 1,664 units recorded in Q2 2026 but roughly even with the 1,169 units in Q3 2025, lifting YTD absorption to 3,987 units. Effective rents averaged $1,535 per unit and $1.80 psf in Q3 2026, representing 2.0% YOY growth as gains cooled across much of the market. Economic Overview The Minneapolis–St. Paul economy showed signs of cooling in Q3 2026. Nonfarm employment held at just over 2.0 million workers, while the local unemployment rate climbed 30 basis points (bps) year-over-year (YOY) to 4.1%. At just 10 bps below the U.S. average of 4.2%, the gap between local and national labor market conditions narrowed, reflecting a departure from the metro’s longstanding pattern of outperforming national employment trends. Supply: Deliveries Slow as Pipeline Continues to Contract Deliveries totaled 1,070 units in Q3 2026, lifting year-to-date (YTD) completions to 3,267 units, nearly equal to the 3,364 units delivered in all of 2025, and pushing total inventory to 274,491 units. Units under construction shrank to 5,705 units, a 5.4% decline quarter-over-quarter (QOQ), as higher borrowing costs and uncertainty about the direction of debt markets kept new starts in check. Upcoming supply is largely confined to projects already underway. The starts that did proceed relied on financing already in-place or alternative capital sources, while conventional ground-up development remains difficult to launch. Demand: Homeownership Costs Support Rental Demand Renters absorbed 1,141 units in Q3 2026, below the 1,664 units recorded in Q2 2026 but roughly even with the 1,169 units in Q3 2025, lifting YTD absorption to 3,987 units. New inventory continued to lease without disrupting occupancy, with stabilized vacancy flat QOQ at 5.3% and 30 bps lower YOY. With conventional mortgage rates climbing back above 7.0% and home prices still elevated, ownership has moved further out of reach for households already priced out, keeping renters firmly anchored to rental housing and sustaining strong demand for the foreseeable future. Pricing: Rent Growth Slows as Owners Prioritize Retention Effective rents averaged $1,535 per unit and $1.80 per square foot (psf) in Q3 2026, representing 2.0% YOY growth as gains cooled across much of the market. Owners continued to work off concessions and prioritized occupancy and resident retention over aggressive rent increases. As a result, rent growth remained below operating expense growth and short of peak levels recorded two years ago, with performance strongest in select neighborhoods rather than broad-based across the metro. Insights in your Inbox Subscribe to the latest local market research, insights and analysis from Cushman & Wakefield across the United States. Subscribe Authors Patrick Hamilton Director, Minneapolis Research Current Marketbeats MarketBeat Minneapolis Multifamily MarketBeat This MarketBeat report covers the Mi sector continues to expand its hiring and concurrently leasing large blocks of space. Through the third quarter of 2026, Bay Area-based companies captured 75.9% ($324.5 billion) of venture capital funding into AI/ML in the U.S. Supply and Demand: Demand Outpaces Supply Vacancy fell across the Bay Area for the 12th consecutive quarter, to 3.9%, as new construction has not been able to keep up with increasing demand. Vacancy is down 110 bps YOY and currently sits at the lowest level since the fourth quarter of 2007. Net absorption has slowed in back-to-back quarters, as deliveries have been quiet, but remains positive, with 2,077 units absorbed in the third quarter. As the number of available units continues to dwindle, absorption may continue to slow until new supply meets demand. Units delivered in the third quarter totaled 969, up 306 units from the prior quarter but down by over 500 units YOY. Excluding the prior quarter, it was the lowest quarterly total since the second quarter of 2013. The pipeline, however, is growing, as units under construction have risen for five consecutive quarters, reaching 18,625 units through the third quarter. There are over 100,000 units proposed across the Bay Area, but development is not likely to see a significant uptick in the short term as rising construction costs and a difficult financing environment prove to be headwinds. However, strong market conditions and state housing mandates may help to counteract these challenges. Pricing: Record Rents Rents have surpassed record highs yet again as vacancy continued to decrease. The effective rent as of the end of the third quarter was $2,982 per unit, up nearly 10% YOY. San Francisco County is responsible for much of this growth, as it reached $3,756 per unit in the third quarter, an increase of over 15% YOY. San Francisco is showing no signs of slowing down having posted YOY rental growth greater than 10% for three consecutive quarters, a feat that has not occurred since 2001. Insig he SF Bay Area multifamily market for Q3 2026. Read the report for a detailed look at market conditions and trends. Download The Q3 2026 Report Key Takeaways Bay Area nonfarm employment increased YOY by 0.9% to over 4.0 million.","evidence_basis":"body","cre_subcategory":"多户"},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"3 apartment projects broke ground last week","link":"https://www.multifamilydive.com/news/apartment-projects-broke-ground-georgia-new-york-virgina/874755/","description":"3 apartment projects broke ground last week Construction has just started on new transit-oriented multifamily developments in Georgia, New York and Virginia. Published Nov. 16, 2026 Julie Strupp Senior Editor Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Rendering of Caldwell in Sandy Springs, Ga. Courtesy of Kennedy Wilson Listen to the article 6 min This audio is auto-generated. Please let us know if you have feedback . Several multifamily firms launched new apartment projects last week on the East Coast and in the Atlanta area. Although the rising interest rate environment is making development more difficult, market conditions vary widely, Jay Lybik, senior director of market research at Continental Properties, told Multifamily Dive. “We're seeing distinct differences depending upon the region you're in,” Lybik said, but “the Midwest and the Northeast are holding very stable.” Despite ongoing macroeconomic challenges, Beverly Hills, California-based Kennedy Wilson is among those continuing to build. Atlanta is a priority market for the firm’s multifamily development platform, John McCullough, president of Kennedy Wilson’s Multifamily Development Group, told Multifamily Dive. “The region continues to add residents and jobs, supported by a diverse economy and a large concentration of corporate headquarters,” he said in emailed comments. Read on for details about Kennedy Wilson’s new project and other multifamily developments that recently broke ground. Caldwell in Sandy Springs, Georgia The Caldwell project team broke ground last week. Courtesy of Kennedy Wilson A Kennedy Wilson and Shimizu Corp. joint venture has started building Caldwell, a 382-unit luxury apartment development in the Atlanta area, per a Tuesday press release shared with Multifamily Dive. Caldwell marks Kennedy Wilson’s first multifamily development in the state. Sandy Springs stood out because it has seen far less new apartment supply than the rest of the Atlanta metro, so demand remains strong, McCullough said in emailed comments. The development is located on a 6.9-acre site close to major highways and Metropolitan Atlanta Rapid Transit Authority transit stops. “The submarket has high household incomes, above-average occupancy, and a high cost of homeownership that supports long-term rental demand,” McCullough said. “Caldwell sits just off GA-400 and is minutes from Perimeter Center, Buckhead, and Roswell, which fits our focus on established submarkets near major employment centers.” Caldwell was designed “with a focus on wellness and functionality,” according to McCullough. The apartments, which average 937 square feet, will feature “upscale finishes” such as quartz countertops and stainless steel appliances, as well as oversized closets and smart-home technology, per the release. Amenities will include a fitness center, a wellness suite with infrared sauna and cold plunge, a pool, three courtyards with hammocks and grilling stations, an outdoor beer and wine garden as well as a terrace. Santander Bank provided a $90 million construction loan for the project, which is expected to open in mid-2028. 4600 Fairfax in Arlington, Virginia Rendering of 4600 Fairfax in Arlington, Virginia. Courtesy of 4600 Fairfax Hoffman & Associates, Snell Properties and Mitsui Fudosan America started construction Thursday on 420 new apartments in the Ballston neighborhood of Arlington, Virginia, according to a press release shared with Multifamily Dive. It’s the first part of a multiphase development. The seven-story apartment building spans more than four acres and will include 380 parking spaces. 4600 Fairfax offers residents “seamless connectivity to Metro, retail and major employment centers in one of Northern Virginia's most vibrant neighborhoods,” per the release. The project announced $195 million in financing in May, with a senior construction loan from Mitsubishi UFJ Financial Group, according to the release. Residents are expected to start moving in during the first quarter of 2029. The launch of 4600 Fairfax represents Hoffman & Associates’ ongoing expansion of its residential portfolio across the Mid-Atlantic region, per the release. The site will also be prepared for construction of a separate for-sale component, with plans for a four-story penthouse south building with 29 townhome-style multifamily units plus additional apartments, according to the project website. North White Plains Workforce Transit Hub in White Plains, New York Rendering of the North White Plains Workforce Transit Hub. Courtesy of BRP BRP Companies, The Community Preservation Corp. and Basis Investment Group broke ground Tuesday on a $178 million, 296-unit transit-oriented development in White Plains, New York, according to a press release shared with Multifamily Dive. Located directly across from the North White Plains Metro-North Station, the mixed-use project will include retail, publicly accessible open space and “thoughtfully designed amenities in one of Westchester County's fastest-growing transit corridors,” per the release. It will offer studio, one- and two-bedroom floor plans, with five homes reserved for households earning between 50% and 60% of Area Median Income and 25 homes for households earning up to 110% of AMI. Amenities will include a fitness center, a resident lounge and a co-working lounge, an event space and a landscaped courtyard, as well as a publicly accessible park with a dog run and a parking garage with 383 spaces. Its building systems will be all-electric, “supporting long-term environmental performance and operational efficiency,” according to the release. Construction financing closed in July, per the release, with about $120.6 million in financing from Merchants Capital, a $10 million loan from The Community Preservation Corp., $18 million in financing from New York State Homes and Community Renewal and $29.7 million in equity from Basis Investment Group and BRP Companies. Skycore Buil","published_at":1794862860000,"mutable":false,"date_precision":"day","published_date":"2026-11-16","modified_at":0,"extraction":"semantic","canonical":"https://multifamilydive.com/news/apartment-projects-broke-ground-georgia-new-york-virgina/874755","content_hash":"29b8f311c68619240755a20ff36a94d53ac1eee904bd38b78d53b4f88f3eaa55","access":"preview","evidence_status":"preview","id":"d75fa234e68f163a","source_family":"multifamily-dive","is_research":false,"required_source":false,"first_seen_at":1794865086470,"acquisition_window":{"lower":1794862800000,"upper":1794949200000},"score":16,"tags":["multifamily","national","construction","rates","developer"],"heat_signals":["occupancy"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"3 apartment projects broke ground last week"},{"id":"body-1","text":"3 apartment projects broke ground last week Construction has just started on new transit-oriented multifamily developments in Georgia, New York and Virginia."},{"id":"body-2","text":"Published Nov. 16, 2026 Julie Strupp Senior Editor Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Rendering of Caldwell in Sandy Springs, Ga."},{"id":"body-3","text":"Courtesy of Kennedy Wilson Listen to the article 6 min This audio is auto-generated."},{"id":"body-4","text":"Please let us know if you have feedback ."},{"id":"body-5"
