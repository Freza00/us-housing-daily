26 CPI at a Glance Headline CPI: -0.4% MoM Seasonally Adjusted (SA)—the largest monthly decline since April 2020; annual rate fell to 3.5% , down from 4.2% in May Core CPI (less food energy): 0.0% MoM (SA); annual rate fell to 2.6% , down from 2.9% in May, beating forecasts Gasoline: -9.7% MoM (SA), +26.7% YoY—the primary driver of the monthly decline Shelter: +0.1% MoM (SA)—the smallest monthly increase since January 2021 Market reaction: 10-year Treasury yield fell about 6 bps on release; CME FedWatch odds of a July 29 rate hike fell from 47% to 17% within minutes June CPI: A broad-based, better-than-expected cooldown June Consumer Price Index (CPI) Inflation came in soft across the board, beating the expectations of economists and the market alike. Headline inflation fell 0.4% month-over-month, the largest monthly decline since April 2020, bringing the annual rate down to 3.5% from May&#8217;s 4.2% . That was driven mainly by a 9.7% monthly drop in gas prices. Core CPI, the more important number that excludes volatile food and energy, was flat month-over-month, while the annual rate came in at 2.6%. This was down from 2.9% in May, again beating forecasts. At least for this one month, price softness was broad based. Shelter posted its smallest monthly gain since January 2021, and other goods and services categories declined as well. Two data points from May to June don&#8217;t constitute a trend for the FOMC. What it means for the Fed: one good reading isn&#8217;t a trend For now, it looks like the Fed will pause again this month, at least based on the markets&#8217; immediate reaction to the June report. The 10-year Treasury yield fell about 6 basis points on release, and the CME FedWatch Tool , which had priced the odds of a July 29 rate hike at 47% just yesterday afternoon, saw those odds fall to 17% minutes after the CPI release. Still, one soft reading does not settle the inflation question, especially with the Fed&#8217;s preferred inflation gauge (PCE) still running hot. Two data points from May to June don&#8217;t constitute a trend for the FOMC; Fed Governor Christopher Waller said yesterday policymakers would need to see a sustained series of cooler readings, especially in core, before concluding elevated inflation is truly behind us. For consumers and homebuyers: relief, with a caveat For consumers and homebuyers, this is good news on two fronts: inflation is falling, and the report removes one source of upward pressure on mortgage rates in the near term. Mortgage rates, up 6 bps to 6.49% last week , have hovered around 6.5% for nearly two months, and today&#8217;s data, combined with the drop in Treasury yields, may point toward some relief rather than the renewed instability the market had been bracing for. That matters heading into the traditionally slower but still-active late-summer buying season . Still, this is just one report and things change quickly. With the Middle East ceasefire fragile and energy prices historically volatile, the durability of today&#8217;s relief will depend on whether core inflation keeps cooling in the months ahead, not just this one.","published_at":1784042024000,"score":43,"tags":["housing","national","macro","rates","regulator"],"heat_signals":["fed","fomc","rate hike","inflation","mortgage rate","outlook","forecast","trend","annual"," yoy","year over year","housing market"],"importance":5,"selector_reason":"6月CPI低于预期，直接影响美联储路径、按揭利率和住房负担能力判断。CPI属于关键宏观数据，按标准评为imp=5。","section":"national","title_zh":"6月 CPI 超预期降温，Fed 7月或暂停","summary_zh":"Headline CPI 降至3.5%，core 2.6%；加息概率由47%降至17%，利好住房需求","impact":"long-pos","id":"1315d9da","fetched_at":1784080409765},{"source_id":"fed-press","source_name":"Federal Reserve Press","source_tier":"C","source_weight":7,"source_tags":["rates","policy","macro","regulator"],"region":"national","title":"Minutes of the Board's discount rate meetings on June 8 and June 17, 2026","link":"https://www.federalreserve.gov/newsevents/pressreleases/monetary20260714a.htm","description":"Minutes of the Board's discount rate meetings on June 8 and June 17, 2026","published_at":1784052000000,"score":11,"tags":["national","macro","rates","regulator"],"heat_signals":[],"importance":5,"selector_reason":"美联储公布6月贴现率会议纪要，属于直接影响利率预期和金融条件的官方材料。Fed决策相关信息按标准属于系统性新闻，评为imp=5。","section":"national","title_zh":"Fed 披露6月 discount rate 会议纪要","summary_zh":"6月8日与17日会议纪要发布，政策信号有限；利率路径仍待FOMC确认","impact":"neutral","id":"3152dcbf","fetched_at":1784080409765},{"source_id":"realtor-research","source_name":"Realtor.com Research","source_tier":"B","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"June 2026 Rental Report: Median Asking Rents Continue to Decline","link":"https://www.realtor.com/research/june-2026-rent/","description":"Affordability , Data , Monthly Rental Report , Rentals June 2026 Rental Report: Median Asking Rents Continue to Decline By Jiayi Xu , Danielle Hale Jul 14, 2026 Highlights June 2026 marks the 35th consecutive month of year-over-year decline for 0-2 bedroom properties across the 50 largest metros. The national median asking rent fell $25, or 1.5%, compared to a year ago. The median asking rent in the 50 largest metros registered at $1,692, $72 (-4.1%) lower than its summer 2022 peak but $238 (16.4%) higher than the pre-pandemic level. Median rent declined in all size categories: studio: $1,422, down $32 (-2.2%) year over year; 1-bed: $1,579, down $22 (-1.4%) year over year; 2-bed: $1,893, down $27 (-1.4%) year over year. Permit activity nationally is still 13.1% below 2019 despite a small 2025 rebound, but the recovery is concentrated in specific markets — Florida metros and Columbus, OH are seeing the sharpest gains, the latter tied to the city&#8217;s &#8220;Zone In&#8221; zoning reform enabling up to 88,000 new residential units over the next decade. New York and Boston — two markets at the center of 2026&#8217;s rent-control debate — posted their lowest permit rates since 2019, underscoring the limits of tenant protections alone: rent freezes and rent-control fights can shield existing renters, but neither market shows the supply pipeline needed to bring broader rents down. In June 2026, U.S. median rent recorded its 35th consecutive year-over-year decline. Rent for 0-2 bedroom properties across the 50 largest metropolitan areas dropped by 1.5% compared to the previous year, with the median asking rent at $1,692—$25 lower than the prior year. While the median asking rent remains $238 (16.4%) above pre-pandemic levels recorded in June 2019, it has fallen $72 (-4.1%) from its August 2022 peak. This persistent softness is increasingly translating into real savings for renters navigating a market that once felt out of reach. As we enter the summer, we expect the median asking rent to tick up on a monthly basis—a typical seasonal pattern. However, given the surge in multifamily construction over the past few years, we anticipate continued year-over-year declines. In other words, modest rent relief is likely to continue in 2026. All unit sizes saw rent declines In June 2026, the median asking rent for two-bedroom units dropped 1.4% year over year, marking the 37th consecutive month of annual declines. At $1,893, the national median for two-bedroom units now sits $75 (-3.8%) below its July 2022 peak. Despite this extended period of softness, two-bedroom rents remain $296 (18.5%) above their level seven years ago. The rent for one-bedroom units slipped 1.4% in June 2026 on a year over year basis, and now stands at $1,579. This was the 37th consecutive month of annual declines. Rent was $82 (-4.9%) lower than the peak observed during August 2022, but still $217 (15.9%) higher than in June 2019. In June 2026, the median asking rent for studios fell by 2.2%, marking the 34th consecutive month of annual declines. The median rent of studios was $1,422 in June, down by $64 (-4.3%) from its peak, seen in October 2022. Nevertheless, the median asking rent for studios was still $185 (15.0%) higher than seven years ago. Table 1: National Rents by Unit Size, June 2026 Unit Size Median Rent Rent YoY Consecutive Months of Decline Total Decline from Peak Rent Change &#8211; 7 Years Overall $1,692 -1.5% 35 -4.1% 16.4% Studio $1,422 -2.2% 34 -4.3% 15.0% 1-Bedroom $1,579 -1.4% 37 -4.9% 15.9% 2-Bedroom $1,893 -1.4% 37 -3.8% 18.5% Rent regulations vs. rent construction W hile the median asking rent has retreated for nearly three years, rental affordability remains one of the defining topics in today&#8217;s housing market. In June 2026, Mayor Mamdani&#8217;s rent freeze was approved by the Rent Guidelines Board in New York CIty , while the Massachusetts supreme judicial court struck down a ballot measure for statewide rent control , keeping it off th","published_at":1784023221000,"score":27,"tags":["multifamily","national","data","trend"],"heat_signals":["annual"," yoy","year over year","year-over-year","housing market"],"importance":4,"selector_reason":"全国50大都会区租金连续35个月同比下降，是住宅租赁市场供需再平衡的重要信号。属于全国性月度租金趋势数据，影响面广，评为imp=4。","section":"national","title_zh":"6月 asking rent 连续35个月同比下滑","summary_zh":"50大都会区 median rent 降1.5%至$1,692，供给压力仍压制 multifamily rent growth","impact":"short-neg","id":"25221360","fetched_at":1784080409765},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Compass files ethics complaints against Zillow in 26 states","link":"https://www.housingwire.com/articles/compass-ethics-complaints-zillow/","description":"Compass International Holdings has filed Code of Ethics complaints against Zillow , the brokerage firm confirmed to HousingWire on Tuesday. According to a Compass spokesperson the complaints, which allege that Zillow has made false advertising claims, spans 26 states, 55 MLSs and 30 Realtor associations. &#8220;When sellers choose to publicly market their homes and make them available to the broadest possible audience, Zillow is keeping those listings from buyers because they were not initially prioritized on Zillow. In some cases, Zillow is displaying active, publicly available listings as not for sale,&#8221; a Compass spokesperson told HousingWire. &#8220;We believe this is false advertising that misleads consumers and keeps buyers from finding homes that sellers have intentionally made available to the market. Sellers should decide how their homes are marketed, and buyers deserve accurate information about what is actually for sale.&#8221; Zillow replied with the following comment: &#8220;It&#8217;s not surprising that Compass, a defendant in our federal antitrust lawsuit, is looking for additional venues to fight the same battle it&#8217;s losing in court. &#8220;Compass&#8217; business model depends on keeping listings off the public market first, so they are the one limiting reach and later wanting Zillow to cover for their scheme. Agents who list publicly from the start reach every buyer on Zillow. When a home is shopped around privately to some buyers and listed to all buyers later, we don&#8217;t show that on Zillow because it&#8217;s not fair to millions of home buyers without insider connections. That&#8217;s not false advertising, it&#8217;s standing up for a fair and transparent housing market,&#8221; the comment read. &#8220;Zillow&#8217;s Listing Access Standards are simple: if you&#8217;re marketing a home publicly, market it to everyone. Buyers deserve to see every home for sale, and that&#8217;s not something we&#8217;re going to compromise on.&#8221; This is not the first time Compass has sought to dismantle Zillow&#8217;s listing access standards policy, which the listing portal debuted in April 2025 . Under the policy any listing that is publicly marketed for more than one business day prior to being available for display on IDX or VOW feed powered websites is banned from the listing portal. Compass sued Zillow regarding this policy in late June 2025, but dismissed the lawsuit in March 2026. In addition, Compass is currently a defendant in an antitrust suit filed by Zillow against it and Chicagoland MLS Midwest Real Estate Data (MRED), in which the listing portal claims that MRED conspired with Compass to not only expand nationwide , but to cut off its listing feed to Zillow, by updating its IDX display “objective criteria” policy so that Zillow would be in violation of the policy if it enforced its listing access standards policy in the Chicagoland area. These Code of Ethics complaints come just days after the National Association of Realtors (NAR) published guidance stating that on virtual office websites (VOWs), that in order to support cooperation, fair housing and transparency — and based on prior discussions with the U.S. Department of Justice (DOJ) — all active listings in an MLS must be available through a VOW data feed. Zillow, which launched a VOW feed to supplement its IDX feeds last September, would then be in violation of this guidance if it did not display active listings in the VOW feed that violated its listing access standards policy. Related More: Clear Cooperation Compass Zillow","published_at":1784064274000,"score":20,"tags":["housing","national","regulation","brokerage"],"heat_signals":["fed","housing market"],"importance":3,"selector_reason":"Compass在26个州针对Zillow提起伦理投诉，反映全国住宅经纪和平台分发规则冲突升级。虽非宏观政策，但涉及头部平台和多州MLS生态，评为imp=3。","section":"national","title_zh":"Compass 在26州投诉 Zillow 误导房源","summary_zh":"Compass 指 Zillow 将公开房源标成未售；双方诉讼升级，brokerage 规则不确定性上升","impact":"neutral","id":"cd4a4892","fetched_at":1784080409765},{"source_id":"national-mortgage-news","source_name":"National Mortgage News","source_tier":"A","source_weight":7,"source_tags":["rates","macro"],"region":"national","title":"What FHFA's counterparty suspension change may mean","link":"https://www.nationalmortgagenews.com/news/what-fhfas-counterparty-suspension-change-may-mean","description":"Politics and policy What FHFA&#x27;s counterparty suspension change may mean By Bonnie Sinnock CloseText About Bonnie twitter bcynic mailto bonnie.sinnock@arizent.com linkedin bonnie-sinnock-115a829 Published July 14, 2026, 3:55 p.m. EDT | Updated July 14, 2026, 4:16 p.m. EDT 3 Min Read Facebook Twitter LinkedIn Email The Federal Housing Finance Agency is proposing a change that would remove certain criteria for counterparty suspension while maintaining a focus on triggers related to credit, market and operational concerns. Processing Content The proposal seeks to remove \"reputational harm\" as a trigger because it \"potentially diverts agency resources from more salient risks without adding material value from a safety and soundness perspective,\" according to the FHFA. The change, which is in line with a similar one by other regulators , is significant for mortgage businesses that work with Fannie Mae, Freddie Mac or the Federal Home Loan Banks because suspensions threaten livelihoods. \"An SCP suspension is functionally a death sentence for any firm whose business runs through the enterprises,\" Tim Rood, founder and CEO of compliance automation firm Impact Capitol, wrote in a recent newsletter. Political origins President Trump has been interested in weeding out language around \"reputational\" risk because of his interest in preventing debanking for political or religious reasons , and the FHFA proposal mirrors a recent bank action to that end. The FHFA says its proposal specifically is a follow-on to actions taken by the Office of the Comptroller of the Currency, Federal Deposit Insurance Corp. and National Credit Union Administration in response to an executive order against debanking last year. \"FHFA is not a federal banking regulator as contemplated by the executive order, however, FHFA is aligning with other financial regulatory agencies to promote consistency,\" General Counsel Clinton Jones wrote in the proposal. FHFA Director Bill Pulte has broadly advocated for many of President Trump's policies. Industry implications The proposed narrowing of the suspended counterparty criteria contrasts past efforts to expand the parameters that the Mortgage Bankers Association and other groups opposed. Plans for this were withdrawn after a reproposal in 2024. \"MBA has long viewed suspension as a remedy that should be reserved for the most serious transgressions,\" said Pete Mills, senior vice president of residential policy and strategic industry engagement, in an email. Mills added that the association is \"pleased that FHFA is continuing to improve the regulation,\" and will decide whether to file a formal comment letter after staff and members review the proposal more closely. The proposal, while simple on its face, does have some ramifications for businesses worth thinking through, according to some early reports weighing in on it. \"The shift is procedural on the surface, substantive beneath it,\" according to executive intelligence platform Palanor. Palanor generally concluded in its initial review of the proposal that the plan would require FHFA to focus primarily on quantifiable concerns when considering withdrawing counterparties' approvals. \"By eliminating 'reputational harm' as a basis for suspension, FHFA is narrowing its supervisory discretion to material and measurable risks,\" Palanor wrote. That means counterparties facing potential suspensions could have more recourse, according to Rood. \"Anchoring suspensions to material, measurable financial risk gives a targeted counterparty a more concrete standard to contest on appeal — and removes the catch-all category that was hardest to rebut,\" he said. However, some legal experts have shown concern that moves aimed at preventing debanking could have complicated interactions with anti-money laundering rules, which FHFA works with the Financial Crimes and Enforcement Network to address. The agency's watchdog has found some room for improvement in its work with FinCen last year and F","published_at":1784058 al team\" complements Lincoln's existing platform well. \"As we looked at the next phase of growth in the region, it became clear that bringing our organizations together would create a stronger business, expand our capabilities and position us to better serve clients and pursue new opportunities across the Carolinas,\" he said. A spokesperson for Spectrum didn’t comment in time for publication. Spectrum’s 43 employees will move from a 5K SF office into Lincoln’s two-floor, 200K SF headquarters at Piedmont Town Center in SouthPark, which already employs 260 people, CBJ reported. No job cuts are expected. Executives told CBJ that Spectrum’s name will soon change to Lincoln. Lincoln’s global portfolio spans 720M SF, according to the company’s website. It manages 27M SF in the Carolinas. The developer’s Charlotte-based work includes the 3M SF Legacy Union office tower complex . Spectrum’s 4.4M SF portfolio will now become “a significant expansion of Lincoln's regional footprint,” according to the press release. The company’s local assets previously included Vantage South End , a 635K SF mixed-use development that it sold to Cousins Properties in 2024. Charlotte ranks among \"the most attractive markets for investors\" in the country, according to CBRE’s 2026 North America Investor Intentions Survey . Charlotte’s multifamily market is \"maintaining stronger demand fundamentals than most peer markets,\" a first-quarter Matthews report said, with a 6.2 percent vacancy rate a signal that demand has absorbed new supply. Contact Jessica Beebe at jessica.beebe@bisnow.com Related Topics: Acquisition , Charlotte , Lincoln Property Company , multifamily , Spectrum Cos , The Spectrum Companies , Charlotte North Carolina","published_at":1784061584000,"score":18,"tags":["multifamily","carolinas","deals","developer"],"heat_signals":["dallas","vacancy"],"importance":3,"selector_reason":"Lincoln Property收购Charlotte开发商以扩大Carolinas业务，体现大型CRE平台区域扩张。未披露超大金额，但属于有影响力公司的并购动作，评为imp=3。","secti
