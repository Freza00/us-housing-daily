weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Higher mortgage rates are expected to lead to fewer originations through 2027","link":"https://www.housingwire.com/articles/mba-cuts-2027-originations/","description":"Mortgage rates have moved north of 7% and are poised to remain there for the foreseeable future. And a more expensive climate for borrowers has pushed lenders to reduce their originations forecasts for the next year. At HousingWire &#8216;s Mortgage Rates Center on Tuesday, published rates for 30-year conforming loans averaged 7.32%, up 4 basis points from one week ago . Rates for 30-year jumbo loans dropped 7 bps during the week to average 7.40%, while rates for 30-year loans through the Federal Housing Administration (FHA) increased 14 bps to average 7.00%. Bob Broeksmit , president and CEO of the Mortgage Bankers Association (MBA), said in a statement last week that mortgage demand declined for a second straight week, a direct result a higher interest rate environment. “ Mortgage applications declined for the second consecutive week, with both purchase and refinance activity also below year-ago levels. Mortgage rates hovering around 7% continue to weigh on affordability and dampen borrower demand, particularly among prospective homebuyers. A more favorable rate environment would help support a broader recovery in housing activity,” Broeksmit said. Is another hike on deck? Mike Fratantoni, MBA&#8217;s senior vice president and chief economist, said after last week&#8217;s Federal Reserve rate hike that lenders had already &#8220;baked in the expectation of hikes at this and future meetings.&#8221; He noted that annual inflation — which held firm at 3.4% in August , according to the Consumer Price Index — remains above the Fed&#8217;s 2% target and that further increases are expected. “Housing and mortgage activity slowed abruptly as mortgage rates moved higher over the past several weeks. MBA forecasts two additional hikes from the Fed over the next year and expects mortgage rates to stay near current levels over the forecast horizon,” Fratantoni said in a statement. In his weekly video series , Dan Ribler, vice president of capital markets and strategy for Longbridge Financial , reminded reverse mortgage originators that the Fed does not directly set mortgage rates. Instead, long-term rates for home loans closely track the 10-year Treasury yield , which has been on the rise of late. &#8220;Sometimes, what the Fed does on the front end has a dramatic effect on the market&#8217;s expectation for inflation. In September of 2026, it does not, and I can prove it,&#8221; Ribler said last week. &#8220;On Wednesday, the Fed spoke, and markets didn&#8217;t really move. Bond yields bounced around a little bit, but they ended up closing basically where they were before the Fed spoke. &#8220;On Thursday, however, oil opened lower and rates came down. This is the market saying the price of oil — as a for instance — has a much bigger impact on long-term rates because it has a much bigger impact on inflation than where the Fed sets the overnight rates. The market is telling us oil prices , in this instance, are driving long-term rates, and the Fed is the passenger princess.&#8221; Interest rate traders are currently divided on the Fed&#8217;s next move at the end of October. According to the CME Group &#8216;s FedWatch tool , about 47% believe the federal funds rate will stay at its current range of 3.75% to 4% in October, while 53% say there will be another 25-bps hike. Higher rates expected to curtail volumes The two additional hikes expected by the MBA in the next year are tied to a decline in the trade group&#8217;s originations forecast . In its latest projections released last week, it called for 2027 origination volume of $2.101 trillion, down from the $2.144 trillion forecast in August and below the $2.123 trillion total expected for 2026. Fannie Mae also cut its estimates for this year and next. The government-sponsored enterprise said last week that it anticipates single-family mortgage originations of $2.121 trillion in 2026, down from an estimate of $2.168 trillion in August, while its 2027 forecast shrank from $2.294 trillion","published_at":1790097111000,"score":29,"tags":["housing","national","rates","trend","lender"],"heat_signals":["fed","rate hike","inflation","mortgage rate","fannie mae","forecast","annual"],"importance":4,"selector_reason":"按揭利率升至7%以上并压低未来贷款发放预期，直接影响全国购房需求和贷款行业收入。它不是单次美联储决策，但对全国住宅金融市场影响较大，因此评为imp=4。","section":"national","title_zh":"7%+ mortgage rate 压低2027前放贷","summary_zh":"30Y conforming 达7.32%，MBA称购房与 refi 需求连续两周下滑","impact":"short-neg","id":"a6590169","fetched_at":1790126424468},{"source_id":"redfin-news","source_name":"Redfin News","source_tier":"A","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"Pending Home Sales Dip to Lowest Level in Nearly 3 Years","link":"https://www.redfin.com/news/housing-market-update-pending-sales-lowest-level-since-2023/","description":"The homebuyers who remain in the market have more choices, less competition and more negotiating power. Here’s what you need to know about the U.S. housing market for the four weeks ending September 13: Buyers have more breathing room than they've had in years. Pending home sales fell 3.5% from a week earlier to their [&#8230;] The post Pending Home Sales Dip to Lowest Level in Nearly 3 Years appeared first on Redfin Real Estate News .","published_at":1789646427000,"score":16,"tags":["housing","national","data"],"heat_signals":["pending home sales","housing market","pending home sales"],"importance":4,"selector_reason":"Redfin数据显示待售房成交跌至近三年低点，说明全国住宅需求仍承压。该指标是全国住房市场拐点信号之一，因此评为imp=4。","section":"national","extended_window":true,"title_zh":"Pending home sales 跌至近3年低点","summary_zh":"待售签约周降3.5%，买家议价权上升但需求疲弱拖累成交","impact":"short-neg","id":"ed4dd236","fetched_at":1790126424468},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Housing boom expected to follow SpaceX Louisiana arrival","link":"https://www.housingwire.com/articles/housing-boom-expected-to-follow-spacex-louisiana-arrival/","description":"Lafayette, Louisiana’s real estate market is stirring from a massive economic development proposed for a remote stretch of its coast. SpaceX has announced plans for a $100 billion Starbase Louisiana project — covering roughly 130,000 acres, including a large buffer zone around launch pads, in marsh land known as Pecan Island, part of Lafayette’s Vermilion Parish. The project is expected to create between 5,000 and 30,000 short-term construction jobs at its peak, eventually scaling toward thousands of permanent operations, engineering, technician and support roles. Many of those positions are expected to pay $90,000-plus, a significant draw in a region long dependent on oil and gas. Kimberly Lafleur, a Realtor at Compass -affiliated The Lafleur Group in Lafayette, said she and colleagues are watching with measured enthusiasm rather than a sudden frenzy. &#8220;We are cautiously optimistic right now on what this is scheduled to bring to us over the next 10 years,&#8221; she said. “We had some rumblings on this about six months prior, where we thought it may be happening. So, in the parish where it was, we started to see some movement.” Teresa Rainey, a Realtor for The Real Brokerage -affiliated House Heart Group in Lafayette, said expectations are running high. &#8220;We&#8217;re actually expecting a lot. We&#8217;re expecting it to be incredibly positive,&#8221; she said. &#8220;I think this is actually going to be huge for Louisiana. This has been a severely impoverished area. In Vermillion Parish, the average income is about $30,000 a year. So, adding 3000 jobs at an average around $92,600 is a very big deal.” The Lafayette metro has 1,077 active listings at a median list price of $274,900, with new listings coming in lower at $256,000, according to HousingWire Data . Homes are averaging 139 days on market, inventory sits at 4 months and nearly 48% of listings have taken a price cut — all pointing to buyer-friendly conditions across the region. Early Movement in land and commercial deals Rainey said investors are already buying land around the area in anticipation of workers, with interest concentrated on RV parks and other temporary housing closer to the launch site. Noise from launches would likely limit residential development within roughly 20 miles, she said. &#8220;We have a ton of investors that are coming in and buying land all around that area,&#8221; Rainey said. &#8220;A lot of people are anticipating all the workers that are going to be in the area, so they&#8217;re looking for land [to start] for RV parks closer to the launch site.&#8221; She said land is being listed across Vermilion Parish, particularly around Abbeville, and prices have already climbed well beyond historical norms — land that might typically fetch far less is now being offered at roughly $40,000 an acre, about three to four times the usual rate. Some investors are securing land for neighborhoods; others are positioning for short-term rentals, Rainey added. The spillover has also reached smaller investors. Lafleur recalled one who called about purchasing a commercial building despite the risk the project might stall. &#8220;He said, &#8216;What&#8217;s the worst thing that could happen?&#8217;” she said. “I replied, &#8216;Well, if this doesn&#8217;t go anywhere, and you now own a building in Kaplan, Louisiana, we can just sell later.&#8217; So they’re jumping in on the low — that commercial building was $75,000. Things have not gone up yet, but we expect they will.&#8221; Vermilion Parish market data tells a somewhat different story compared to the broader Lafayette area. With 119 listings at a $230,000 median and just 3.5 months of inventory, it has the tightest supply in the metro. Price reductions are also more moderate at 35% — closer to the normal range. Lafayette set for housing demand spillover Because Pecan Island is a remote marsh with limited infrastructure, Lafleur said permanent employees will likely look to Lafayette and other inla","published_at":1790104496000,"score":13,"tags":["housing","sun-belt","trend","construction"],"heat_signals":[],"importance":4,"selector_reason":"SpaceX拟在路易斯安那推进超大规模项目，可能带动当地住房需求和人口流入。虽然住房影响仍带预测性，但项目规模极大且位于Sun Belt相关市场，因此评为imp=4。","section":"sunbelt","title_zh":"SpaceX 路易斯安那项目带动住房预期","summary_zh":"$100B Starbase 或创造5,000-30,000岗位，Lafayette 住房看涨","impact":"long-pos","id":"7c14cef7","fetched_at":1790126424468},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Blackfin, Enterprise Community Partners team up for Nashville deal","link":"https://www.multifamilydive.com/news/blackfin-enterprise-community-partners-apartment-transaction/831065/","description":"An article from Blackfin, Enterprise Community Partners team up for Nashville deal As supply wears off in Music City, the firms secured Brookridge Apartments, a 177-unit, garden-style multifamily community in Tennessee’s Antioch submarket. Published Sept. 22, 2026 Leslie Shaver Senior Reporter Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Brookridge Apartments in Nashville, Tenn. Permission granted by Blackfin Real Estate Investors Property: Brookridge Apartments Buyer: Blackfin Real Estate Investors and Enterprise Community Partners Seller: Withheld Property type: Garden-style Units: 177 Location: Antioch neighborhood of Nashville, Tennessee Over the past couple of years, Nashville, Tennessee, has been one of the poster children for apartment supply. But Doug Root, co-founder and managing partner of Blackfin Real Estate Investors, says the market is improving. “Strong net absorption is finally outpacing new construction deliveries,” Root told Multifamily Dive. “There's certainly a lot more stability coming into the market. It's poised for much better fundamentals in the short term as that pipeline is really dwindling.” Seeing a light at the end of the tunnel in Music City, Root’s Arlington, Virginia-based Blackfin and Enterprise Community Partners have announced the acquisition of the Brookridge Apartments, a 177-unit, garden-style property in the south Nashville submarket of Antioch, according to a press release shared with Multifamily Dive. With an average unit size of 1,023 square feet, the 1986-vintage property is comprised of approximately 26% one-bedroom and 74% two-bedroom units. Brookridge Apartments is Enterprise’s first investment of its Enterprise Preservation Fund VI from the Columbia, Maryland-based firm’s preservation equity business, per the release. “As costs continue to rise in high-growth markets like Nashville, preserving existing affordable and workforce housing is more important than ever,” Lianna Petroski, senior vice president, head of acquisitions and deputy fund manager at Enterprise, said in the release. Brookridge Apartments offers access to Interstate 24 and is near top regional employers and downtown Nashville, per the release. Sustained in-migration and growth across health care, education, advanced manufacturing and logistics help drive demand in the market, per the release. While it has been difficult to find deals, Root said he is starting to see some properties hit the market. “There's a lot more distress, like in REOs starting to work their way through where previously sellers might have been holding on and trying to get their lender paid back,” he said. “Now, that ship has sailed and lenders are taking the real estate back, we are starting to see more and more of that product become available.” In addition, owners are coming to terms with the fact that values won’t snap back any time soon, and interest rates remain h -owens-list-texas-home-for-sale/","description":"The couple began building their sprawling Texas residence in 2022, with construction wrapping three years later.","published_at":1790083045000,"score":11,"tags":["housing","texas"],"heat_signals":["texas"],"importance":3,"_from_fallback":true,"section":"sunbelt","title_zh":"Simone Biles 挂牌$1.2M Texas 旧宅","summary_zh":"名人住宅上市属个案，价格$1.2M，对 Texas housing 影响有限","impact":"neutral","id":"4f0f99a4","fetched_at":1790126424468},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Data Centers Are Making It Harder To Build Everything Else","link":"https://www.bisnow.com/news/national/construction-development/data-centers-construction-costs-inflation","description":"Data Centers Are Making It Harder To Build Everything Else September 22, 2026 | 6:58 pm ET Maddy McCarty, Houston Savanna Mendoza was nearly finished with a quick-service restaurant project in Central Texas, but she needed her contracted plumber to come back and button some things up. The plumber gave Mendoza, a commercial superintendent for Wyatt Management, vague excuses as to why he couldn’t come out, then sent another contractor in his place. The replacement told Mendoza that the original plumber got hired for a data center project. “He kind of just left our job because it was B.S. money compared to what he was making,” Mendoza said. Unsplash/Becca Tapert With the world&#039;s largest tech companies pouring hundreds of billions of dollars each into the artificial intelligence build-out, developers and contractors of nondata center projects are struggling to keep up. “All the data center development, all of the other infrastructure projects, all of these are competing against each other,” said Darrell Betts , a Houston-based principal with Avison Young’s Capital Markets group. “The cost of construction is going up, the hard materials are going up, but it&#039;s the labor, too.” Tariffs , combined with a huge uptick in data center development , are creating bottlenecks, pushing up prices and throwing a wrench in timelines. J.P. Morgan estimates that hyperscalers like Amazon, Meta and Oracle will spend $700B on data centers in 2026 alone. Hopes for this year to bring pricing relief, stability and predictability have been squashed, as U.S. construction input cost growth is up 9% annually and accelerating monthly . The conflict in Iran has pushed U.S. diesel prices up 74% from last year to an all-time record of $6.53 ⁠per gallon this week, according to the federal Energy Information Administration. Inflation, in part driven by the data center boom, has also pushed the Federal Reserve to raise interest rates for the first time since 2023, impacting construction financing, which often relies on variable-rate debt. “We were seeing relief here the last year or so, where pricing was moderating, and we weren&#039;t seeing the increases like we were before,” said Ariel Guerrero , regional manager of market intelligence for Avison Young’s central region. “But now, we&#039;re starting to see that trend start to reverse a bit, and the percentage increase on a year-over-year basis has started to accelerate.” &#039;You Got Bumped&#039; Contractors and developers say the struggle is largely behind the scenes. Price and lead-time increases have shifted the way they approach projects, requiring them to reexamine contracts and be hands-on from manufacturing to delivery. They also have to be ready to be told they&#039;ve lost out to a data center. Wyatt Management has also been impacted by unexpected delays for routine orders, Mendoza said, like a truckload of light poles from a trusted vendor. “I&#039;ll call, and I&#039;ll say, ‘Hey, what&#039;s going on? You&#039;ve never taken this long before,’” she said. “They’ll say, ‘Oh, Savanna, you got bumped. There&#039;s a data center, and they requested all these, so we sent them all over.’” The challenges are especially evident in Texas, which leads the country in data center development and general construction, with an estimated pipeline exceeding $50B . Though Texas cities like Houston and Dallas are seeing consistent development and some megaprojects break ground , construction costs keep rising on pace with the rest of the country, and there’s no relief in sight. Construction cost increases may be best illustrated by the prices of steel and aluminum, which have faced a 50% import tariff since June 2025. Unsplash/Kasper Gant Steel prices were up 22% and aluminum was up 40% year-over-year in July. Data centers use about 1 million tons of steel each year. “We&#039;re a victim of our own success,” Hanover Co . Industrial Division President David Hudson said at a Bisnow event this month. “What&#03","published_at":1790117907000,"score":30,"tags":["data-center","texas","construction","trend","developer"],"heat_signals":["texas","houston","dallas","fed","inflation","trend","annual","year-over-year"],"importance":3,"selector_reason":"数据中心建设挤压其他项目的劳动力和施工资源，反映CRE开发成本与供给瓶颈。该报道是行业结构性趋势观察，但缺少单一重大交易或政策决定，因此评为imp=3。","section":"cre","title_zh":"Data center 挤压 Texas 建设资源","summary_zh":"AI 投资推高劳工与材料成本，J.P. Morgan 估2026支出$700B","impact":"short-neg","id":"aa34f9a3","fetched_at":1790126424468,"cre_subcategory":"数据中心"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Prince William County Drastically Shrinks By Right Data Center Map","link":"https://www.bisnow.com/news/washington-dc/data-center/prince-william-county-drastically-shrinks-by-right-data-center-map","description":"Prince William County Drastically Shrinks By Right Data Center Map September 22, 2026 | 6:12 pm ET Emily Wishingrad , Alexis Kramer Just months after Prince William County lost out on a $100B data center project, its Board of Supervisors is placing critical restrictions on the county’s future digital infrastructure pipeline. Bisnow/Alexis Kramer The Prince William County Board of Supervisors meeting on Tuesday In a hearing lasting more than three hours, the board on Tuesday unanimously approved a zoning text amendment that largely eliminates by right data center development . Supervisors voted to drastically reduce the size of an overlay district that since 2016 has allowed developers to build data centers without going through extra approvals. The ZTA proposed to reduce the size of the overlay from 9,698 acres to 3,654 acres, cutting the land available for by right development by about 62%, according to a Planning Commission report earlier this month. The change means developers in the approximately 6,000 newly excluded acres would have to secure a special use permit to build a data center project going forward. Data center development in the revised overlay district will be limited to properties that meet certain criteria intended to identify properties with prior approvals or existing development rights. The overlay was previously reduced in 2019, although it isn’t clear by how much. The 8-0 vote came after a lengthy debate over the scope of a grace period for developers to file data center applications before the new overlay district takes effect. The supervisors voted 5-3 against a separate motion to change that period from 90 days to zero. “We&#039;ve got varied perspectives across the community as it relates to what we&#039;re doing. But the one thing that everyone is unified on is we must get this done,” Brentsville District Supervisor Tom Gordy said before the vote. “We need to end by right development of data centers in Prince William County.” Board of Supervisors Chair at large Deshundra Jefferson emphasized that she wanted the board to make a decision immediately. “It doesn’t mean there will never be another data center application ever again,” she said. “I&#039;m not a fan of the 90 days, but it is the compromise, and it feels like this is where we&#039;ve been able to get a majority of people, and I want this to be done.” Residents and elected officials across the U.S. are pushing back against data center development, leading to a flurry of new restrictions. Prince William County sits next to Loudoun County , the data center capital of the world, which eliminated by right data center developme nt in March 2025. Last week, Loudoun moved to pause data center applications for up to 12 months so that it could complete Phase 2 of its data center standard amendments. Loudoun is also considering doing away with a legacy exemption that lets data center applications filed before March 2025 keep their by right status. Prince William County has 36 operational data centers and 40 in the development pipeline, including 11 under construction, according to US Data Center Map . Reported and operational power usage from data centers in the county totals 4.5 gigawatts. In July, Blackstone ’s QTS abandoned its $100B Digital Gateway data center project , which was planned to span 2,100 acres in Prince William County, after dropping its legal effort to reinstate necessary rezoning approvals. Just days later, Prince William&#039;s board stopped another massive data center plan from taking shape, voting against a land use designation for a proposed 1,940-acre data center dubbed Dulles South Innovation Center. Continue reading this story with a free account Log in or register Contact Emily Wishingrad at emily.wishingrad@bisnow.com Contact Alexis Kramer at alexis.kramer@bisnow.com Related Topics: Data center development , Prince William County","published_at":1790115130000,"score":18,"tags":["data-center","policy","regulator"],"heat_signals":["blackstone"],"importance":4,"selector_reason":"Prince William County大幅收紧数据中心可建区域，会影响美国最重要数据中心走廊之一的新增供给。该政策对CRE和数字基础设施开发具有区域性重大影响，因此评为imp=4。","section":"cre","title_zh":"Prince William 收紧 data center 分区","summary_zh":"by right 土地从9,698英亩减至3,654英亩，开发审批难度上升","impact":"short-neg","id":"02826030","fetched_at":17 1.5 billion of incremental capital to deploy. The company said it will use the proceeds for general corporate purposes, including: Acquiring homesites from the combined Dream Finders Homes – Beazer Homes entity tied to their previously announced merger, referred to as the Dream Finders Transaction Repaying amounts outstanding under its revolving credit facility Millrose’s revolving credit facility carried $850 million of principal outstanding as of Sept. 21, 2026, the company said. If the Dream Finders–Beazer merger does not close on or before May 13, 2027, Millrose will be required to use a portion of the net proceeds from the offering, together with cash on hand and/or borrowings on its revolver, to complete a special mandatory redemption of $500 million of the 2031 notes. That structure effectively ties half of the longer-dated notes to the land acquisition pipeline anticipated from the Dream Finders Transaction and gives bond investors a defined path to repayment if the deal is delayed or canceled. Why this matters for builders Millrose positions itself as a “homesite option platform,” acquiring and horizontally developing land to deliver finished lots to homebuilders on a just-in-time basis. The company’s model supports an asset-light approach for builders who want to preserve balance sheet flexibility while maintaining or growing starts. In a market where lot availability and development timelines remain key constraints on new-home volumes, increased capital at Millrose could translate into more finished homesites available for public and private builders, particularly those aligned with Dream Finders and Beazer. For builders that prefer to outsource land banking and development risk, the financing move could expand access to controlled lots without carrying full land inventory on their own books. The offering also underscores how capital markets are being used to underwrite large-scale land strategies around major corporate transactions. If the Dream Finders–Beazer merger proceeds as planned, Millrose will have additional balance sheet capacity to acquire homesites from the combined builder, potentially supporting higher community counts and more consistent production through the cycle. For homebuilding finance and land acquisition teams, the deal is a signal that third-party land platforms continue to attract institutional capital, and that builders may see more opportunities to shift toward fee-based, optioned land structures rather than traditional land ownership. Offering details and legal framework The notes will be guaranteed and sold in a private placement. They will not be registered under the Securities Act or state securities laws and may not be offered or sold in the United States without registration or an applicable exemption, the company said. The press release emphasized that it does not constitute an offer to sell or a solicitation of an offer to buy and is being issued in accordance with Rule 135c under the Securities Act. Millrose, which trades on the New York Stock Exchange under the ticker MRP, uses a proprietary technology platform and real-time data analytics to drive","published_at":1790103202000,"score":13,"tags":["housing","fundraising","deals","developer"],"heat_signals":[],"importance":5,"selector_reason":"Millrose计划发行10亿美元债券用于住宅地块扩张，涉及大型资本市场融资和新房供应链。规模达到系统性资本动作级别，并可能影响住宅开发商供地能力，因此评为imp=5。","section":"institutional","title_zh":"Millrose 拟发$1B 债扩 homesite","summary_zh":"配合$500M term loan，最高$1.5B 资金支持 Dream Finders-Beazer 土地","impact":"long-pos","id":"d43a682b","fetched_at":1790126424468},{"source_id":"national-mortgage-news","source_name":"National Mortgage News","source_tier":"A","source_weight":7,"source_tags":["rates","macro"],"region":"national","title":"Lenders should prep for possible loosening of some FHA rules","link":"https://www.nationalmortgagenews.com/news/lenders-should-prep-for-possible-loosening-of-some-fha-rules","description":"Originations Lenders should prep for possible loosening of some FHA rules By Bonnie Sinnock CloseText About Bonnie twitter bcynic mailto bonnie.sinnock@arizent.com linkedin bonnie-sinnock-115a829 Published September 22, 2026, 5:12 p.m. EDT 2 Min Read Facebook Twitter LinkedIn Email Lenders may be able to get the Federal Housing Administration to approve more of their loans if newly released plans for modernizing longstanding property requirements move forward. Processing Content The proposal generally loosens minimum standards or aligns them with the government-sponsored enterprises' in ways aimed at streamlining a process that has frustrated many housing groups. The property requirements have been \"one of the most significant impediments to the utilization of FHA financing by prospective homebuyers,\" groups representing housing, nondepository lenders, brokers, and banks wrote in a letter responding to an earlier feedback request. However, mortgage firms reviewing the proposal for potential later incorporation into underwriting may also want to consider whether the FHA's new standards are the same as their own or if they should add overlays that account for any of the changes. Some ways the rules could change The proposal would formally require that FHA appraisals meet the enterprises' addition of Uniform Appraisal Dataset 3.6 requirements that are being rolled out and become mandatory Nov. 2 for new valuations. On the enterprises' scale of C1 to C6 for the property's condition, FHA's minimum would be C4. C4 properties can have \"moderate, normal wear and tear\" but cannot require anything other than cosmetic or mechanical component repairs. On a similar six-notch scale the enterprises have for a home's quality of construction, the minimum would be Q5. That \"as is\" assessment allows for use of less costly materials, simpler designs and basic compliance with building codes. Mechanical utilities would no longer have to be turned on and operated during an appraisal. Appraisers also would no longer have to specifically inspect kitchen appliances or visit crawl spaces and attics. Current requirements for manufactured home's perimeter and installation and certification would be removed. Department of Housing and Urban Development model installation standards and a structural modification certification would replace these. Wells would no longer have to meet minimum distances from sources of pollution on existing properties. Requirements calling for lenders to ensure that public water and sewer connections exist \"whenever feasible at a reasonable cost\" also be removed. FHA cited an ability to rely on local authorities to oversee these last two concerns as a reason for removing them from its requirements. Rules for paint also would be eased, with specific repair requirements related to the home's exterior removed so long as the property meets GSE standards. In cases where there is lead-based paint, repairs could be contained to the primary residence rather than the whole property, allowing for the removal of other structures. Some concerns that the industry coalition showed interest in avoiding through FHA standards are still part of the rule set but have been consolidated in broader categories. Requirements around concerns like storage tanks and sinkholes are included under \"onsite hazards or nuisances.\" While there has been a broad federal effort to de-emphasize environmental restrictions, this still exists as an umbrella category for concerns like high-pressure gas lines and slush pits. FHA will accept feedback on its proposed revisions to minimum property standards through Nov. 6. Ginnie Mae President Joseph Gormley is serving as the acting FHA commissioner due to the departure of Frank Cassidy. The White House has nominated Matt Jones , the deputy assistant secretary for single-family housing at HUD, to serve as the next permanent commissioner. Bonnie Sinnock Capital Markets Editor Bonnie Sinnock is National Mortgage News' Capital M","published_at":1790111572000,"score":15
