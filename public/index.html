trended lower in back-to-back quarters. During the past three months, the vacancy rate declined by 30 basis points to 8.1%. Year over year, vacancy is down 10 basis points.Sales activity for build-to-rent properties has been steady in 2026, with one BTR transaction being recorded in each quarter. In transactions where pricing was available, the median price to this point in 2026 is $161,100 per unit. In 2025, the median price was $257,100 per unit.Kansas City build-to-rent market overviewSupply growth in the Kansas City build-to-rent sector continues, but at a slower rate. After more than 1,000 units came online in 2023, annual deliveries totaled 550 units in 2024 and then nearly 800 units in 2025. Construction will be lower this year, with approximately 500 units slated for delivery. Lighter and more consistent delivery levels have caused the vacancy outlook to brighten. While the overall rate remains elevated, vacancy has trended lower by 70 basis points during the past six months. Additionally, the sector posted a year-over-year vacancy improvement for the first time in nearly two years. Supply growth in 2027 is expected to track levels recorded in 2026. There are an additional 1,250 units being planned or proposed, but these projects will likely begin to enter the market in 2028 at the earliest.Following a strong close to the year in 2025, which included Sallee Development’s portfolio sale and several other transactions, the pace of BTR sales in Kansas City has slowed. Transactions in recent years have included a mix of townhomes and properties consisting of detached, traditional homes. Year to date, every BTR property that has changed hands has been a townhome community. That is not the only shift to occur in recent periods, as investors have pivoted from Missouri to Kansas. To this point in the year, nearly every sale has occurred in Kansas. Prior to this year, BTR transactions had been dominated by properties located in Missouri. Cap rates have continued to average roughly 5% since the beginning of 2025.Construction:Roughly 600 units are currently under construction. Image Supply growth is forecast to be lighter in 2026 after a combined 2,400 units were completed from 2023 to 2025. For the full year, projects totaling roughly 500 units are expected to be delivered.Build-to-rent communities totaling approximately 325 units have come online to this point in the year. Recent completions were highlighted by Sallee Development’s Hidden Hills Townhomes in Spring Hill.The development pipeline has thinned, as projects totaling roughly 600 units are currently under construction. Earlier this year, approximately 700 units were under construction. Projects totaling more than 1,250 units were in the planning phases at the end of the third quarter.Vacancy:Vacancy is down 10 basis points year over year. Image The vacancy rate for build-to-rent properties has improved for two consecutive quarters after trending higher at the beginning of the year. Vacancy declined by 30 basis points during the third quarter to 8.1%.Following the recent tightening, vacancy among BTR properties is now down 10 basis points year over year. This marks the first annual vacancy improvement since the end of 2024.Following increases throughout 2025 and into early 2026, vacancies have begun to level off in recent periods. The vacancy rate declined by a combined 70 basis points during the past six months, marking the first time since 2022 that vacancy has declined in consecutive quarters.Rents:Rents are up 3% from one year ago. Image Following steady growth for much of the past year, asking rents in build-to-rent properties declined in the third quarter. Rents trended lower by 0.7% during the past three months to $2,153 per month.Despite the recent decrease, rents for BTR properties in Kansas City are up 3% from one year ago. Year-over-year rent growth has averaged 2.5% since the beginning of 2021.Average rents for build-to-rent properties are more expensive than traditional apartment rents by more than $850 per month. BTR rents are elevated in Outlying Johnson County, closing the third quarter at more than $2,300 per month, up 2.3% from one year ago. In Outlying Cass County, rents are lower, but growth has been steeper. Year over year, rents in the area rose 3.4% to $1,832 per month. Most BTR properties in this submarket are in Belton and Raymore. For-sale housing:During the third quarter, the median existing home sale price was $371,000. Image For-sale housing prices have ticked higher in recent periods. During the third quarter, the median existing home sale price was $371,000, 3.7% higher than levels from one year earlier. Permitting for single-family housing has picked up in recent periods. Homebuilders have pulled permits for roughly 4,500 single-family homes year to date, after permits for approximately 3,900 single-family homes were issued in the same period of 2025. Based on current pricing and mortgage rates, the average mortgage payment on a median-priced single-family home in Kansas City is roughly $3,150 per month, more than $1,000 per month higher than asking rents for build-to-rent properties.Build-to-rent sales:Since the beginning of 2026, cap rates have averaged approximately 5%. Image After surging in the second half of last year, sales activity slowed to this point i","published_at":1795194000000,"date_precision":"day","published_date":"2026-11-20","modified_at":1795194000000,"extraction":"structured","canonical":"https://northmarq.com/insights/insights/kansas-city-btr-construction-has-declined-2023-peak-q3-2026","content_hash":"1d045bf468e49a164acbd3e8e23045ed37f7fbef89939244bc7f1ab559de3b46","access":"public","source_family":"northmarq-research","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1795383442856,"id":"ed6daf94a6c81f04","acquisition_window":{"lower":1795122000000,"upper":1795381200000},"score":48,"tags":["btr-sfr","national","data","construction"],"heat_signals":["b :"body-1","market_role":"market_policy","market_scope":"us","market_evidence":"HighlightsThe vacancy rate in the Kansas City build-to-rent (BTR) market has declined in each of the past two quarters.","duplicate_of":null,"selector_reason":"堪萨斯城BTR空置率连续两季回落，最新降至8.1%；年内迄今交付约325套，低于2025年全年的约800套，挂牌租金同比仍升3%。","title_zh":"堪萨斯城 BTR 空置率降至 8.1%","summary_zh":"Northmarq 称，堪萨斯城 BTR 过去 3 个月空置率下降 30 个基点至 8.1%，要价租金同比上涨 3% 至每月 $ 2,153；今年计划交付约 500 套。","impact":"neutral","evidence_quote":"HighlightsThe vacancy rate in the Kansas City build-to-rent (BTR) market has declined in each of the past two quarters. Deliveries have slowed, with projects totaling roughly 325 units being completed year to date. In 2025, approximately 800 units came online.Despite a dip during the third quarter, asking rents in the BTR sector rose 3% in the past year to $2,153 per month.","evidence_basis":"body","cre_subcategory":null},{"source_id":"northmarq-research","source_name":"Northmarq Research","source_tier":"B","source_weight":9,"source_tags":["multifamily","data","trend"],"region":"national","title":"Dallas-Fort Worth multifamily rents post first annual gain in three years","link":"https://northmarq.com/insights/insights/dallas-fort-worth-multifamily-rents-post-first-annual-gain-three-years-q3-2026","description":"HighlightsDallas-Fort Worth multifamily operating fundamentals improved during the third quarter, with net absorption continuing to outpace new supply by a wide margin. Since 2020, the market has absorbed more than 172,000 units, underscoring the depth of sustained demand.Asking rents rose 1.0% during the third quarter to $1,512 per month. Rents were up 0.5% year over year, marking the first annual increase since the third quarter of 2023.Vacancy ended the quarter at 6.0%, down 10 basis points from the prior three months and 20 basis points year over year.Among year-to-date transactions with disclosed pricing, the median sale price was $162,100 per unit. Per-unit pricing levels have remained within a tight range for the past several years, while current cap rates are averaging around 5.25%.Dallas-Fort Worth multifamily market overviewDallas-Fort Worth’s operating fundamentals continued to improve during the third quarter. Net absorption totaled roughly 6,600 units, slightly exceeding the 6,400 units delivered during the quarter. Demand was concentrated in Dallas, which accounted for 83% of the Metroplex’s net absorption, up from 79% in the second quarter. Absorption was strongest in the northern suburbs and core neighborhoods, led by Allen/McKinney, Frisco, and Intown Dallas. Year to date, the Metroplex has absorbed more than 26,100 units, outpacing new supply by nearly 40%. The construction pipeline continued to shrink and is now 45% below its early 2023 peak. Vacancy fell for a third consecutive quarter, with declines led by Class C and Class A properties. Average rents rose to $1,512 per month, their third straight quarterly increase. Class A rents again led the way and have now posted annual gains for two straight years.Multifamily investment activity in Dallas-Fort Worth was essentially flat year over year during the third quarter. Year to date, 103 properties with at least 100 units changed hands, down slightly from the same period in 2025. Investment shifted west compared with transactions that closed in 2025. Fort Worth’s share of sales rose to about 20% from 15%, with Arlington and Grand Prairie also gaining ground, while the share of total transactions in the northern suburbs was cut nearly in half to just 12%. Dallas held steady at about 30%. The northern decline reflects fewer sales of newer properties, which drove much of that area's 2025 activity, as loan assumptions and value-add purchases also slowed. The mix also shifted toward distress, as lender-driven sales rose to nine from two a year earlier. The year-to-date median sale price reached roughly $162,100 per unit. Cap rates for newer properties held near 2025 pricing at below 5%, while older garden properties often are approaching 6%.Employment:Local payrolls added 36,200 new positions. Image Employers across the Dallas-Fort Worth area continued to add jobs through the third quarter of 2026, though annual growth slowed. During the past 12 months, local payrolls grew by 0.8%, adding 36,200 new positions.Growth in the professional and business services sector continued to strengthen. Year over year through the third quarter, the sector added 29,100 jobs, representing a 3.7% increase.In September, Morgan Stanley announced plans to establish a new U.S. hub in Dallas. The project represents a $684 million capital investment and is expected to create more than 3,800 jobs.Forecast: Following a period of more modest growth in 2025, the local labor market is forecast to sustain its recent momentum through the remainder of 2026. Approximately 55,000 jobs are projected to be added in 2026, representing a 1.3% increase.Development and permitting:The construction pipeline declined 7% year over year. Image The pace of multifamily deliveries has slowed. Year to date, projects totaling roughly 18,900 units have come online, down 19% from the same period last year.The Dallas-Fort Worth construction pipeline fell 7% year over year to roughly 42,200 units, driven mostly by a 20% drop in Fort Worth. Construction is concentrated in Frisco and Allen/McKinney, which hold about 30% of units underway.Multifamily permitting activity slowed through the third quarter of 2026. Developers pulled permits for roughly 16,700 units year to date, down 11% from the same period last year.Forecast: Multifamily permitting is projected to end 2026 at roughly 22,000 units, slightly below 2025 levels. Deliveries are expected to total about 25,000 units, a decline of more than 20% that would bring completions closer to long-term trends.Vacancy:Year-to-date demand outpaced new supply. Image The Dallas-Fort Worth vacancy rate edged down 10 basis points during the third quarter to 6.0%, extending the second quarter’s improvement and bringing the annual decline to 20 basis points. Performance diverged across the Metroplex, as vacancy declined 20 basis points during the quarter to 5.9% in Dallas but edged up 10 basis points to 6.4% in Fort Worth.Net absorption totaled approximately 26,100 units through the third quarter, nearly matching last year’s pace, but with deliveries down almost 20%, demand outpaced new supply by roughly 7,700 units, double the margin of a year ago.Occupancy gains shifted toward the lower end of the quality spectrum during the third quarter. Class C vacancy declined 30 basis points to 6.8%, the largest improvement among the classes, while Class A vacancy edged down 10 basis points to 5.2% and remained the tightest among the classes.Forecast: Vacancy is expected to moderate slightly during the fourth quarter as supply and demand return closer to equilibrium. Even so, the rate is still projected to end 2026 at 6.2%, 70 basis points below the year-end 2025 level.Rents:Annual rent growth in the Metroplex turned positive. Image Rents increased for a third consecutive quarter, rising 1.0% during the third quarter to $1,512 per month. Annual rent growth in the Metroplex turned positive for the first time in three years, with asking rents rising 0.5%","published_at":1795194000000,"date_precision":"day","published_date":"2026-11-20","modified_at":1795194000000,"extraction":"structured","canonical":"https://northmarq.com/insights/insights/dallas-fort-worth-multifamily-rents-post-first-annual-gain-three-years-q3-2026","content_hash":"a25ce93a04bba1f4c4ce821d64f25dd7f13fa8593d81529eb8b391abdaceaeee","access":"public","source_family":"northmarq-research","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1795383442856,"id":"23ab92f860fa7cd6","acquisition_window":{"lower":1795122000000,"upper":1795381200000},"score":41,"tags":["multifamily","dfw","data","trend"],"heat_signals":["dallas","fort worth","permits","forecast","trend","trends","annual","year-end","year over year","rent growth","occupancy","vacancy"],"evidence_status":"article","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Dallas-Fort Worth multifamily rents post first annual gain in three years"},{"id":"body-1","text":"HighlightsDallas-Fort Worth multifamily operating fundamentals improved during the third quarter, with net absorption continuing to outpace new supply by a wide margin."},{"id":"body-2","text":"Since 2020, the market has absorbed more than 172,000 units, underscoring the depth of sustained demand.Asking rents rose 1.0% during the third quarter to $1,512 per month."},{"id":"body-3","text":"Rents were up 0.5% year over year, marking the first annual increase since the third quarter of 2023."},{"id":"body-4","text":"Vacancy ended the quarter at 6.0%, down 10 basis points from the prior three months and 20 basis points year over year.Among year-to-date transactions with disclosed pricing, the median sale price was $162,100 per unit."},{"id":"body-5","text":"Per-unit pricing levels have remained within a tight range for the past several years, while current cap rates are averaging around 5.25%."},{"id":"body-6","text":"Dallas-Fort Worth multifamily market overviewDallas-Fort Worth’s operating fundamentals continued to improve during the third quarter."},{"id":"body-7","text":"Net absorption totaled roughly 6,600 units, slightly exceeding the 6,400 units delivered during the quarter."},{"id":"body-8","text":"Demand was concentrated in Dallas, which accounted for 83% of the Metroplex’s net absorption, up from 79% in the second quarter."},{"id":"body-9","text":"Absorption was strongest i"}],"keep":true,"importance":4,"section":"sunbelt","capital_focus":false,"geo_evidence":"Dallas-Fort Worth","primary_event":"market_research_policy","event_evidence_id":"body-3","event_evidence":"Rents were up 0.5% year over year, marking the first annual increase since the third quarter of 2023.","market_evidence_id":"body-1","market_role":"market_policy","market_scope":"us","market_evidence":"HighlightsDallas-Fort Worth multifamily operating fundamentals improved during the third quarter, with net absorption continuing to outpace new supply by a wide margin.","duplicate_of":null,"selector_reason":"DFW三季度公寓挂牌租金同比升0.5%，为三年来首次同比上涨；约6600套净吸纳超过约6400套交付，空置率降至6.0%。","title_zh":"达拉斯--沃思堡多户租金三年来首次年度上涨","summary_zh":"Northmarq 数据显示，达拉斯--沃思堡第三季度净吸纳约 6,600 套，略超 6,400 套新增供应；空置率降至 6.0%，租金同比上涨 0.5%，为 2023 年第三季度以来首次年度上涨。","impact":"long-pos","evidence_quote":"HighlightsDallas-Fort Worth multifamily operating fundamentals improved during the third quarter, with net absorption continuing to outpace new supply by a wide margin. Since 2020, the market has absorbed more than 172,000 units, underscoring the depth of sustained demand.Asking rents rose 1.0% during the third quarter to $1,512 per month. Rents were up 0.5% year over year, marking the first annual increase since the third quarter of 2023.","evidence_basis":"body","cre_subcategory":null},{"source_id":"realpage-research","source_name":"RealPage Analytics","source_tier":"B","source_weight":9,"source_tags":["multifamily","data","trend"],"region":"national","title":"U.S. concession use falls again, but the depth of discount is the deepest in 15 years","link":"https://www.realpage.com/analytics/us-concessions-october-2026/","description":"U.S. concession use falls again, but the depth of discount is the deepest in 15 years by Meggan Taylor Posted November 19, 2026 in Rent Growth Rate U.S. apartment concession use fell for a fifth consecutive month in October 2026, while the average discount reached its deepest level in more than 15 years. Concessions were offered on 13.1% of stabilized U.S. units, down 1.4 points from September 2026 and the lowest reading since June 2025, according to data from Realpage Market Analytics . The October decline was the deepest of the five monthly decreases and the deepest the market has seen since March 2025. The timing makes the October 2026 decline particularly notable. Concession use increased from September to October in 15 of the previous 16 years, making this month's decline a departure from the typical seasonal pattern. Meanwhile, the average concession increased modestly to 11.2%, the deepest discount in data going back to January 2010. At 11.2%, the typical incentive equals about 5.8 weeks free on a 12-month lease. Usage falls fastest in Class A and B stock Concession usage fell in every product class in October 2026, led by Class B and Class A units. Class B usage dropped 1.8 points to 11.3%, marking a fifth straight monthly decline and the asset’s lowest reading since March 2025. Similarly, Class A fell 1.5 points to 11%, its lowest level since September 2023. However, Class C usage slipped only 0.3 points to 17.7%, so the gap between Class C and Class A concessions widened to 6.7 points. Usage also fell in all four floorplans for a fifth straight month, with declines ranging from 1.3 to 1.7 points. Efficiencies posted the deepest of those declines yet remained the floorplan with the highest concession use, at 15.4% of units. One-bedroom, two-bedroom and three-bedroom units saw usage closer to 12% and 13%. However, widespread narrowing in concession use is only half of the October 2026 story. Concession depth gets deeper despite lower usage While fewer units across the U.S. carried a concession, the size of the discount kept getting deeper. The average U.S. concession was 11.2% in October 2026, showing relief in only two months since March 2024, when the discount was 7.5%. That pattern is consistent with operators trimming the number of units that carry an incentive before trimming the incentive itself. Class C posted the largest increase of the three classes in October 2026, up 0.4 points to 11.5%, its deepest average concession since March 2010. Class B discounts increased modestly to 10.8% and Class A discounts softened to 11.4%. Across floorplans, average discounts ranged from 10.9% for three-bedroom units to 12.2% for efficiencies. Before 2026, the average concession last reached 11% in March 2010, in the aftermath of the Great Financial Crisis. Discount depth then was nearly identical to October 2026’s 11.2%, but reach was not. Operators were discounting 50.0% of stabilized units in March 2010, against 13.1% now, so today’s incentives reach roughly a quarter as many units. Looking ahead Five consecutive months of declining concession use, including an October drop that ran against typical seasonal patterns, point to operators offering concessions on a smaller share of units. At the same time, discount depth reached its highest level in more than 15 years. The coming winter months will be a key test: concession use typically rises from October through February, so continued declines through the off-season would signal that reliance on incentives is easing beyond normal seasonal patterns. SHARE Tags Rent Concessions Previous Article Multifamily permitting’s share rebounds as single-family declines Next Article Are NIMBY concerns about new apartments valid?","published_at":1795248011000,"source_family":"realpage-research","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1795383442856,"id":"c3e7d0c373f89ebf","acquisition_window":{"lower":1795122000000,"upper":1795381200000},"score":11,"tags":["multifamily","national","data","trend"],"heat_signals":[],"date_precision":"timestamp","modified_at":1795334412000,"extraction":"semantic","canonical":"https://realpage.com/analytics/us-concessions-october-2026","content_hash":"a648b4917dc7bc27ab125c11b463274e96c77effdcb869f0bbde66ee966cefec","access":"public","evidence_status":"article","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"U.S. concession use falls again, but the depth of discount is the deepest in 15 years"},{"id":"body-1","text":"U.S. concession use falls again, but the depth of discount from September 2026 and the lowest reading since June 2025, according to data from Realpage Market Analytics .","duplicate_of":null,"selector_reason":"10月全美稳定运营公寓的优惠覆盖率连续第五个月下降，至13.1%；平均折扣反升至11.2%，为2010年1月有记录以来最深。","title_zh":"美国公寓让利使用率降至 13.1%，折扣创逾 15 年深度","summary_zh":"RealPage 称，美国公寓让利使用率 10 月连续第 5 个月下降至 13.1%，但平均折扣升至 11.2%，为 2010 年 1 月以来最深，约相当于 12 个月租约免租 5.8 周。","impact":"neutral","evidence_quote":"U.S. concession use falls again, but the depth of discount is the deepest in 15 years by Meggan Taylor Posted November 19, 2026 in Rent Growth Rate U.S. apartment concession use fell for a fifth consecutive month in October 2026, while the average discount reached its deepest level in more than 15 years. Concessions were offered on 13.1% of stabilized U.S. units, down 1.4 points from September 2026 and the lowest reading since June 2025, according to data from Realpage Market Analytics .","evidence_basis":"body","cre_subcategory":"多户"},{"source_id":"zonda-research","source_name":"Zonda Research","source_tier":"B","source_weight":9,"source_tags":["housing","data","trend"],"region":"national","title":"New Home Market Update","link":"https://zondahome.com/new-home-market-update","description":"New Home Market Update Zonda tracks 85% of the production new home market across the United States. Given the proprietary database, Zonda is uniquely positioned to capture trends and changes in the new home market. This report showcases the latest housing trends in the new home market for October 2026. November 20, 2026 – 5 min read Table of Content: The new home market has slipped into underperformance October marked another step backward for the new home market. Sales declined 3.1% month-over-month and 11.7% year-over-year, a considerably steeper annual decline than September's 4.6% drop. The weakness was widespread, with pending sales declining year-over-year across all of Zonda's select markets. The national Zonda Market Ranking also slipped into slightly underperforming territory for the first time since December 2022. The latest figures reinforce what builders have been telling us for months. Zonda's October builder sentiment survey found that 86% of builders reported slower-than-expected demand, up from 84% in September. In their comments, builders pointed to declining traffic, limited buyer urgency, and growing frustration with the effectiveness of incentives. “One of the biggest challenges for builders right now is generating enough buyer interest in the first place,” said Sarah Bonnarens, director of economic research for Zonda and NewHomeSource. “Builders still have an advantage when it comes to pricing and financing flexibility, but those tools can only do so much when buyer traffic is down. The challenge is keeping sales moving without putting even more pressure on margins.” The annual decline in new home sales deepened Zonda's new home sales metric counts the number of new home contract sales each month and accounts for both cancellations and seasonality. This metric shows there were 638,568 new homes sold in October on a seasonally adjusted annualized rate. This was a decline of 3.1% from last month and a drop of 11.7% from a year ago. On a non-seasonally adjusted basis, 50,770 homes were sold, 11.6% lower than last year and 2.8% below the same month in 2019. Incentives remain a key feature of the new home market, helping to sustain sales activity amid ongoing affordability pressures. In October, 64% of new home communities offered incentives on to-be-built homes and 83% on quick move-in supply. Note, these are only publicly available incentives so they will underrepresent overall usage. All select markets saw PSI fall YOY Zonda's New Home Pending Sales Index (PSI) was created to help account for fluctuations in supply by combining both total sales volume with the average sales rate per month per community. The October PSI came in at 122.8, representing an 11.4% decline from the same month last year. The index is currently 29.5% below cycle highs. On a month-over-month basis, seasonally adjusted new home sales decreased 1.9%. The markets that held up the best relative to last year were Minneapolis (-0.3%), Charlotte (-1.1%), and Tampa (-3.5%). Minneapolis was down compared to the last year but grew 10.2% month-over-month. Inversely, the metros that performed the worst year-over-year were Los Angeles/OC (-31.4%), Riverside/San Bernardino (-28.4%), and Denver (-26.3%). On a monthly basis, Minneapolis, Sacramento, and Denver were the best performing markets. The National ZMR dropped to slightly underperforming In order to add further context to sales, Zonda created the Zonda Market Ranking (ZMR). The ZMR accounts for both sales pace and volume, is seasonally adjusted, and is taken as a percentage relative to a baseline market average. Based on the percentage above or below baseline, markets are bucketed into performance groups ranging from significantly underperforming to significantly overperforming relative to historical activity. The map below shows a snapshot of top production markets by region. Zonda also offers the ZMR for entry-level, move-up/move-down, and high-end markets. Subscribers of the National Outlook report can access all top markets and the tiered breakdown in Zonda’s portal. Non-subscribers can access the tiered maps for the select 10 markets by clicking below. Get ZMR Maps The National ZMR index came in at 87.4 in October, which indicated a slightly underperforming market. This marked the first downgrade to the national overall rating since January 2025. Zonda’s snapshot markets were split between 0% overperforming, 10% average, and 90% underperforming. Among Zonda’s top 55 major markets, 5% were overperforming , 25% were average , and 70% were underperforming . Importantly, the ZMR does not account for what it takes to sell a home. For example, securing a sale might still feel difficult in a significantly overperforming market, but if the incentives offered result in a sale, we count the sale. Price cuts persist in the two lower tiers National home prices increased 2.7% year-over-year for high-end homes to $951,036. Prices fell 2.6% for entry-level to $316,019 and 0.5% for move-up to $515,075. The increase in high-end prices reflects, in part, new communities opening at higher price points, often featuring larger homesites, bigger floor plans, and more desirable locations. Meanwhile, modest declines in the entry-level and move-up segments come as builders continue to adjust pricing and product offerings in response to affordability challenges and softer demand. Supplementing our data with a survey Zonda conducts monthly, 43% of builders lowered prices in October month-over-month, 54% held prices flat, and 3% raised prices. In September, for comparison, 38% of builders lowered prices, 52% held prices flat, and 10% increased prices. Community count remained above 18,000 There are currently 18,159 actively selling communities tracked by Zonda, up 6.7% from last year. On a month-over-month basis, the national figure grew 0.6%. Total community count is 5.9% below the same month in 2019. Zonda defines a community as anywhere five or more units are for sale. San","published_at":1795179600000,"date_precision":"timestamp","modified_at":1795179611000,"extraction":"body_fallback","canonical":"https://zondahome.com/new-home-market-update","content_hash":"8188d90870787cba8e37f136b9983b0f63028a6d441c77ec4581c5c096df8588","access":"public","source_family":"zonda","is_research":true,"required_source":false,"mutable":true,"first_seen_at":1795383442856,"id":"49e46684d4956c54","acquisition_window":{"lower":1795122000000,"upper":1795381200000},"score":33,"tags":["housing","national","data","trend"],"heat_signals":["new home sales","outlook","trend","trends","annual"," yoy","year-over-year","new home sales"],"evidence_status":"article","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"New Home Market Update"},{"id":"body-1","text":"New Home Market Update Zonda tracks 85% of the production new home market across the United States."},{"id":"body-2","text":"Given the proprietary database, Zonda is uniquely positioned to capture trends and changes in the new home market."},{"id":"body-3","text":"This report showcases the latest housing trends in the new home market for October 2026."},{"id":"body-4","text":"November 20, 2026 – 5 min read Table of Content: The new home market has slipped into underperformance October marked another step backward for the new home market."},{"id":"body-5","text":"Sales declined 3.1% month-over-month and 11.7% year-over-year, a considerably steeper annual decline than September's 4.6% drop."},{"id":"body-6","text":"The weakness was widespread, with pending sales declining year-over-year across all of Zonda's select markets."},{"id":"body-7","text":"The national Zonda Market Ranking also slipped into slightly underperforming territory for the first time since December 2022."},{"id":"body-8","text":"The latest figures reinforce what builders have been telling us for months."},{"id":"body-9","text":"Zonda's October builder sentiment survey found that 86% of builders reported slower-than-expected demand, up from 84% in September."},{"id":"body-10","text":"In their comments, builders pointed to declining traffic, limited buyer urgency, and growing frustration with the effectiveness of incentives."},{"id":"body-11","text":"“One of the b"}],"keep":true,"importance":4,"section":"national","capital_focus":false,"geo_evidence":null,"primary_event":"market_research_policy","event_evidence_id":"body-5","event_evidence":"Sales declined 3.1% month-over-month and 11.7% year-over-year, a considerably steeper annual decline than September's 4.6% drop.","market_evidence_id":"body-1","market_role":"market_policy","market_scope":"us","market_evidence":"New Home Market Update Zonda tracks 85% of the production new home market across the United States.","duplicate_of":null,"selector_reason":"Zonda独立数据表明，10月全美新屋销量环比降3.1%、同比降11.7%；全国市场评级自2022年12月以来首次落入略低于正常水平的区间。","title_zh":"Zonda：10 月新房销售同比下降 11.7%","summary_zh":"Zonda 研究显示，10 月新房销售环比下降 3.1%、同比下降 11.7%；86% 建商称需求低于预期，购房者流量和紧迫感走弱，激励措施对利润率的压力仍在。","impact":"short-neg","evidence_quote":"New Home Market Update Zonda tracks 85% of the production new home market across the United States. Given the proprietary database, Zonda is uniquely positioned to capture trends and changes in the new home market. This report showcases the latest housing trends in the new home market for October 2026.","evidence_basis":"body","cre_subcategory":null},{"source_id":"trerc","source_name":"Texas Real Estate Research Center (TRERC)","source_tier":"D","source_weight":9,"source_tags":["texas","data","trend"],"region":"texas","title":"Texas Housing Insight | November 2026 | Texas Real Estate Research Center","link":"https://trerc.tamu.edu/reports/texas-housing-insight-november-2026","description":"Texas Housing Insight | November 2026 Texas’ housing market continued to soften in September as rising mortgage rates, inflation, and affordability challenges restrained buyer demand, slowed sales, and kept home-price growth muted. By Yanling Mayer quick links September continued to see a pullback in market momentum, as seasonal cooling combined with rising mortgage rates, rising inflationary pressures, and affordability constraints dampened buyer activity. Existing-home sales declined from a year earlier, and market activity remained subdued. Fewer than two out of every ten homes listed for sale during the month were sold (1.5 homes), highlighting slower inventory turnover and longer marketing times amid challenging demand conditions. Year to date, sales remain modestly ahead of last year’s pace, suggesting housing demand has not deteriorated from last year. Home-price growth remained muted. Statewide home prices were essentially unchanged from a year ago, as gains in a handful of markets were offset by continued weakness elsewhere. Major metropolitan areas, including Austin, Dallas, and San Antonio, continued to experience measurable downward price pressure, while Houston and the Fort Worth metro division showed signs of modest stabilization. On the supply side, inventory levels eased seasonally following their summer peak, consistent with typical market patterns heading into the fall and winter. Nevertheless, overall inventory remains only slightly below peak summer levels, indicating that the inventory condition remains favorable to buyers. Looking ahead, the housing market is expected to remain soft through the remainder of the year. Mortgage rates are near current multi-decade highs, limiting purchasing power and sidelining prospective buyers. Unless financing conditions improve meaningfully, housing demand is likely to remain restrained, resulting in slower sales and weak prices. Disclaimer: The September 2026 figures are based on more complete data and have been revised from their initial release. Year-Over-Year Sales Down Table 1: September 2026 State & National Sales Notes: The sales numbers reflect actual sales, not the seasonally adjusted rate. Source: Texas REALTORS® and National Association of REALTORS® and U.S. Census Bureau data In September, Texas recorded 20,200 existing-home sales statewide, down 1.6 percent year over year (YoY). September marked a second consecutive month of YoY sales declines. As of 3Q2026, year-to-date (YTD) sales volume rose 3.3 percent from last year. As of September, median existing-home price was $325,000, softening slightly from August’s $330,000 and unchanged from a year ago. Nationally, seasonally unadjusted existing home sales were down 3.9 percent YoY, a second consecutive month of sales declines, while YTD sales volumes remained slightly ahead of last year’s pace. National median price reached $422,700, maintaining a steady growth pace at about 1.4 percent YoY. September’s new-home sales in U.S. declined 3.4 percent YoY. As of the third quarter, YTD new-home sales were 2.9 percent below last year’s pace. Monthly Market Snapshot: September Sales and Inventory Trends Table 2: Texas Housing Market Indicators Notes: The turnover rate is calculated as pending sales divided by inventory, where inventory is the average of month-beginning and month-ending inventory Source: Texas Real Estate Research Center analysis of Data Relevance Project and Texas REALTORS® data Homes sold in September spent an average of 65 days on the market (DoM), compared to a similar 63 days a year ago. Inventory turnover was slow at 15 percent, down from 16.2 percent a year ago. At this pace, fewer than two in ten existing homes (1.5 homes) on the market went under contract during the month. The median seller price cut remained similar to a year ago at $15,000, equivalent to roughly 4.5 percent of the initial listing price. As of September, active inventory is at a 5.7-month supply, similar to a year ago. The unsold inventory has an average DoM of 98 days, compared to a DoM of 65 days among the sold. New Listing Activity Eases Seasonally, Remaining Near Year-Ago Levels Figure 1: Monthly New-Listing Activity, 2026 Source : Texas Real Estate Research Center analysis of Data Relevance Project, Texas REALTORS® data Statewide, 47,580 new listings were recorded, down 2.1 percent from August, reflecting the typical seasonal slowdown as the market moves into the fall and winter months. September’s new listings remained 2.1 percent above September 2025 levels. Through September, year-to-date listing activity was largely unchanged from last year, edging down just 0.3 percent. Among the major metros, YoY new-listing activity increased 7.7 percent in Austin, 3 percent in Houston, and 3.8 percent in San Antonio, while DFW posted a 2.0 decline, continuing a stretch of relatively weak new-listing activity that began in April (see Table 4). The YTD activity in Austin, Houston, and San Antonio all remained slightly ahead of last year’s pace; in DFW it trailed by 3.2 percent. Inventory Levels Slightly Below the Summer Peak Figure 2: Monthly Active Inventory, 2026 Source : Texas Real Estate Research Center analysis of Data Relevance Project, Texas REALTORS® data At the end of September, the for-sale inventory stood at nearly 154,200 listings, up 5.6 percent from a year earlier. Although inventory continued its seasonal easing, September levels remained only slightly below the peak reached in July. Inventory trends varied across the major metropolitan areas (see Table 4). YoY inventory increased 3.9 percent in Austin, 7.3 percent in Houston, and 1.6 percent in San Antonio, while DFW recorded a 6 percent decline. Houston remained the only major metro where inventory levels have largely held near their summer peak since July. Other markets experienced more noticeable seasonal declines. Home Prices Remain Under Pressure in Major Texas Markets Figure 3: Texas HPI: Texas and Regional Home Price T","published_at":1795194946000,"date_precision":"timestamp","modified_at":1795196830000,"extraction":"semantic","canonical":"https://trerc.tamu.edu/reports/texas-housing-insight-november-2026","content_hash":"7167361c3ee0d509cfeda415295ad0ac644cd96a820dd486dc52946c7f42c1f9","access":"public","source_family":"trerc","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1795383442856,"id":"4b46e5eacc1c73fe","acquisition_window":{"lower":1795122000000,"upper":1795381200000},"score":44,"tags":["housing","texas","data","trend"],"heat_signals":["texas","houston","dallas","fort worth","dfw","austin","san antonio","inflation","mortgage rate","existing home sales","trend","trends"," yoy","year over year","year-over-year","housing market","existing-home sales"],"evidence_status":"article","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Texas Housing Insight | November 2026 | Texas Real Estate Research Center"},{"id":"body-1","text":"Texas Housing Insight | November 2026 Texas’ housing market continued to soften in September as rising mortgage rates, inflation, and affordability challenges restrained buyer demand, slowed sales, and kept home-price growth muted."},{"id":"body-2","text":"By Yanling Mayer quick links September continued to see a pullback in market momentum, as seasonal cooling combined with rising mortgage rates, rising inflationary pressures, and affordability constraints dampened buyer activity."},{"id":"body-3","text":"Existing-home sales declined from a year earlier, and market activity remained subdued."},{"id":"body-4","text":"Fewer than two out of every ten homes listed for sale during the month were sold (1.5 homes), highlighting slower inventory turnover and longer marketing times amid challenging demand conditions."},{"id":"body-5","text":"Year to date, sales remain modestly ahead of last year’s pace, suggesting housing demand has not deteriorated from last year."},{"id":"body-6","text":"Home-price growth remained muted."},{"id":"body-7","text":"Statewide home prices were essentially unchanged from a year ago, as gains in a handful of markets were offset by continued weakness elsewhere."},{"id":"body-8","text":"Major metropolitan areas, including Austin, Dallas, and San Antonio, continued to experience measurable downward price pressure, while Houston and the"}],"keep":true,"importance":4,"section":"sunbelt","capital_focus":false,"geo_evidence":"Texas’ housing market","primary_event":"market_research_policy","event_evidence_id":"body-1","event_evidence":"Texas Housing Insight | November 2026 Texas’ housing market continued to soften in September as rising mortgage rates, inflation, and affordability challenges restrained buyer demand, slowed sales, and kept home-price growth muted.","market_evidence_id":"body-1","market_role":"market_policy","market_scope":"us","market_evidence":"Texas Housing Insight | November 2026 Texas’ housing market continued to soften in September as rising mortgage rates, inflation, and affordability challenges restrained buyer demand, slowed sales, and kept home-price growth muted.","duplicate_of":null,"selector_reason":"得州9月成屋销量同比下滑，全州房价基本持平；当月每挂牌10套约售出1.5套，但年内累计销量仍略高于上年。","title_zh":"德州住房市场走软，按揭与可负担性压制需求","summary_zh":"TRERC 称，德州 9 月成屋销售同比下降，房价基本持平；按揭利率、通胀与可负担性约束需求，库存仍接近夏季峰值，市场预计年末仍偏弱。","impact":"short-neg","evidence_quote":"Texas Housing Insight | November 2026 Texas’ housing market continued to soften in September as rising mortgage rates, inflation, and affordability challenges restrained buyer demand, slowed sales, and kept home-price growth muted. By Yanling Mayer quick links September continued to see a pullback in market momentum, as seasonal cooling combined with rising mortgage rates, rising inflationary pressures, and affordability constraints dampened buyer activity.","evidence_basis":"body","cre_subcategory":null},{"source_id":"realtor-research","source_name":"Realtor.com Research","source_tier":"B","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"AI Wealth Is Raising Down Payments in the Bay Area, and Beyond","link":"https://www.realtor.com/research/ai-housing-market-update-2026/","description":"AI Wealth Is Raising Down Payments in the Bay Area, and Beyond By Jiayi Xu Nov 19, 2026 Highlights AI-hub counties pulled away. The median down payment in San Francisco, San Mateo and Santa Clara rose from 20.4% in 2020–2022 to 25% in 2024–2026. In Alameda, Contra Costa and Marin, it stayed at 20%. The AI-hub premium is worth about $61,180 in extra down payment on a median $1.33M home. AI and tech wealth may be reaching other hubs. The share of buyers putting 40%+ down has climbed since 2020 in New York and Chicago as well as the Bay Area, and it held at or edged above its peak in 2026 even as mortgage rates eased. AI premium is also showing up in rents. Asking rents in the Bay Area, New York and Chicago have all grown quickly, consistent with AI-driven job growth lifting demand from high-income renters. Earlier this year, we studied the impact of AI wealth on luxury home buying in the Bay Area . With Anthropic having filed for an IPO and ongoing debate about AI’s impact on the economy , we revisit the topic six months later, this time looking at all mortgage purchases with 2026 data, not just the luxury segment. We expect the AI wealth effect to be strongest at the high end, but understanding whether it reaches the broader market shows how far AI wealth is spreading through housing. Similar as before , we divide the study period into three phases. The 2020–22 baseline captures the period before the generative-AI boom, when mortgage rates were low or only beginning to rise and AI wealth was not yet concentrated in the Bay Area. It serves as the reference point against which later shifts are measured. The 2023 transition year is when two forces collided: the average mortgage rate jumped to about 6.6%, from 4.9% in 2022, just as the AI boom began, making it hard to isolate either effect. The 2024–26 period is the diagnostic window. Average rates stayed near 6.7% through 2025 and then eased to 6.4% over January–September 2026, so purely high-rate-driven behavior should have faded during our study period, while AI equity liquidity rose through employee tender offers and secondary-market transactions. A premium in AI-hub counties The AI boom can lift down payments through two channels: direct AI equity held by a small group at the top of the distribution, and broader tech stock wealth, which raises the value of stock compensation for many more workers and could show up in the median. To examine how AI and tech wealth impacts housing markets, we group Bay Area counties into AI-hub and non-hub counties. The AI-hub counties are San Francisco, Santa Clara and San Mateo, home to the headquarters of many leading AI and tech companies. The non-hub counties are Alameda, Contra Costa and Marin. The median down payment shows the gap opening up in the years of the AI boom. In 2020 and 2021, the median was 20% in both groups. The AI-hub counties began to pull away in 2022, and in 2023, the transition year, their median rose to 23.1% while the non-hub median stayed at 20%. By 2024 the AI-hub median reached 25% and has stayed there through 2026, while the non-hub median has not moved from 20%. It is therefore reasonable to assume that, absent the AI boom, the AI-hub counties would have followed a path similar to the non-hub counties, with a median down payment around 20%. Instead, the AI-hub median has remained at 25%, a premium of roughly 5 percentage points that coincides with the acceleration of AI investment. Applied to the AI-hub group’s median purchase price of about $1.33 million, this premium translates to roughly $61,180 in additional down payment for the typical buyer. At the top 10% of the distribution, where direct AI equity held by a small group would most likely show up, the AI-hub 90th-percentile down payment has risen since 2024, from 53.4% to 56.2% in 2026, while the non-hub counties held flat at about 50%. The share of AI-hub buyers putting 50% or more down rose from 13.2% to 16.9% over the same period, against a flat 11% in the non-hub counties. AI and tech wealth may be reaching other hubs What makes the pattern more interesting is what happened in 2026. Average 30-year fixed mortgage rates fell to 6.41% in January–September, from 6.73% in 2025, which would normally reduce the incentive to put more cash down. Austin, Seattle and Boston responded as expected: the share of buyers putting down 40% or more eased from recent peaks. The Bay Area, New York and Chicago did not, as their shares held up or edged higher even as rates fell. One possible explanation is that AI and tech wealth is enabling larger down payments in these markets. In New York, AI startups are rapidly expanding their office footprint . In Chicago, AI-related job postings growth ranked the third-fastest among US markets after New York and San Francisco. In the Bay Area, the share of purchases with at least 40% down is the highest among the major metros, reaching 22.0% in 2026, up from 13.6% in 2020. The step up in 2023 appears in almost every metro, so it looks more like a high-rate effect than an AI effect. What sets the Bay Area apart is that the increase continued afterward: between 2023 and 2026 the share rose another 3.2 percentage points, the largest gain of any metro. New York followed a similar path, rising 2.6 percentage points over the same period, and Chicago rose 1.3 points. AI premium is also showing up in rents The impact of the AI boom is not limited to the for-sale market. It also extends to the rental market, as AI growth creates high-income job opportunities and attracts young professions. Our recent rental data shows rents rising quickly in all three of these markets. In October , the median asking rent was up 6.2% year over year in San Jose, 6.3% in San Francisco and 3.2% in Chicago. In New York city, the median asking rent was up 4.5% year-over-year. For comparison, the median asking rent across the nation rose 0.1% year-over-year in October 2026. Methodology Down payment data is sourced from Optimal B","published_at":1795082407000,"source_family":"realtor-com","is_research":true,"required_source":true,"mutable":false,"first_seen_at":1795383442856,"id":"7362db045c4221dd","acquisition_window":{"lower":1795035600000,"upper":1795381200000},"late_discovery":true,"score":8,"tags":["housing","california","data","trend","brokerage"],"heat_signals":[],"date_precision":"timestamp","modified_at":1795049598000,"extraction":"semantic","canonical":"https://realtor.com/research/ai-housing-market-update-2026","content_hash":"1bf2f880b6cce5de2a2e4ee32350f96ad1a6cac956044a58ef90bc49010a7713","access":"public","evidence_status":"article","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"AI Wealth Is Raising Down Payments in the Bay Area, and Beyond"},{"id":"body-1","text":"AI Wealth Is Raising Down Payments in the Bay Area, and Beyond By Jiayi Xu Nov 19, 2026 Highlights AI-hub counties pulled away."},{"id":"body-2","text":"The median down payment in San Francisco, San Mateo and Santa Clara rose from 20.4% in 2020–2022 to 25% in 2024–2026."},{"id":"body-3","text":"In Alameda, Contra Costa and Marin, it stayed at 20%."},{"id":"body-4","text":"The AI-hub premium is worth about $61,180 in extra down payment on a median $1.33M home."},{"id":"body-5","text":"AI and tech wealth may be reaching other hubs."},{"id":"body-6","text":"The share of buyers putting 40%+ down has climbed since 2020 in New York and Chicago as well as the Bay Area, and it held at or edged above its peak in 2026 even as mortgage rates eased."},{"id":"body-7","text":"AI premium is also showing up in rents."},{"id":"body-8","text":"Asking rents in the Bay Area, New York and Chicago have all grown quickly, consistent with AI-driven job growth lifting demand from high-income renters."},{"id":"body-9","text":"Earlier this year, we studied the impact of AI wealth on luxury home buying in the Bay Area ."},{"id":"body-10","text":"With Anthropic having filed for an IPO and ongoing debate about AI’s impact on the economy , we revisit the topic six months later, this time looking at all mortgage purchases with 2026 data, not just the luxury segment."},{"id":"body-11","text":"We expect the AI wealth effect to be strongest at the high end, but u"}],"keep":true,"importance":4,"section":"national","capital_focus":false,"geo_evidence":"San Francisco, San Mateo and Santa Clara","primary_event":"market_research_policy","event_evidence_id":"body-2","event_evidence":"The median down payment in San Francisco, San Mateo and Santa Clara rose from 20.4% in 2020–2022 to 25% in 2024–2026.","market_evidence_id":"body-2","market_role":"market_policy","market_scope":"us","market_evidence":"The median down payment in San Francisco, San Mateo and Santa Clara rose from 20.4% in 2020–2022 to 25% in 2024–2026.","duplicate_of":null,"selector_reason":"独立研究将样本扩至全部按揭购房：湾区三个AI核心县的首付中位比例从20.4%升至25%，三个对照县保持20%；数据表明分化，但不能单独证明因果。","title_zh":"AI 财富推动湾区首付中位数升至 25%","summary_zh":"Realtor.com Research 称，旧金山、圣马特奥和圣克拉拉首付中位数由 2020--2022 年的 20.4% 升至 2024--2026 年的 25%；AI 相关高收入需求也与湾区租金快速上涨一致。","impact":"neutral","evidence_quote":"AI Wealth Is Raising Down Payments in the Bay Area, and Beyond By Jiayi Xu Nov 19, 2026 Highlights AI-hub counties pulled away. The median down payment in San Francisco, San Mateo and Santa Clara rose from 20.4% in 2020–2022 to 25% in 2024–2026. In Alameda, Contra Costa and Marin, it stayed at 20%.","evidence_basis":"body","cre_subcategory":null},{"source_id":"nrhc","source_name":"National Rental Home Council (NRHC)","source_tier":"E","source_weight":9,"source_tags":["btr-sfr","institutional"],"region":"national","title":"Everyday Economics: The federal government delayed the housing recovery – The Center Square","link":"https://www.thecentersquare.com/national/article_8e7eed19-23cc-4297-94ab-08bbb45c3094.html","description":"Facebook Twitter WhatsApp SMS Email Houses line a suburban neighborhood. Photo: Alan Wooten / The Center Square Facebook Twitter WhatsApp SMS Email Print Copy article link Save (The Center Square) – Existing-home sales fell in October to their slowest pace since August 2010, according to the National Association of Realtors . Federal policy is pulling in two directions: HUD has cut lenders’ costs on taxpayer-backed FHA loans, while tariffs, the conflict with Iran and federal borrowing add to the inflation and interest-rate pressures that keep mortgages expensive. According to Freddie Mac , the 30-year fixed rate has been climbing since the war began and now exceeds year ago levels. According to the National Association of Realtors , October existing-home sales fell to a seasonally adjusted annual rate of 3.75 million, the weakest pace since August 2010, and 8.8% below a year earlier. According to my calculations using NAR’s unadjusted data , actual October closings fell 11.7%, partly because October had one fewer business day than last year. The unadjusted annual decline deepened sharply from September’s 4.2%. The year started better than those figures suggest. According to the same calculations, 3.4 million homes sold through October, just 0.6% fewer than during the same period in 2025. My October housing report , based on Redfin data, found that seasonally adjusted pending sales fell 3.6% from September to their lowest level since April 2020. The same report found that active listings increased even though fewer sellers listed, because homes are selling more slowly. The problem is still affordability. My report calculated that monthly principal and interest on the median-priced home reached $2,137 with 20% down, up 11.2% from a year earlier. By my calculation, higher rates added approximately $223 to the monthly payment, while a slightly lower Redfin median sale price saved about $7. HUD has targeted a different cost: making the loan. According to HUD , June changes streamlined FHA appraisal-review requirements and eliminated a duplicative homebuyer disclosure form. HUD estimates the appraisal change alone saves lenders about $425 per review, or roughly $3.3 million a year industrywide. HUD’s announcement does not say how much of those savings will reach borrowers. The Appraisal Institute has said eliminating long-standing review requirements raises questions about oversight of collateral on FHA loans, which the federal government insures, American Banker reported . Any savings from lower origination costs are expected to be small next to the roughly $223 a month that higher rates added to the typical payment. Other federal policies affect what borrowers pay each month. According to Federal Reserve Bank of New York researchers , tariffs raise prices for imported and domestically produced goods. According to the Energy Information Administration , attacks on tankers, constrained shipping and falling inventories pushed oil prices higher again in October. Federal borrowing matters, too. According to the Congressional Budget Office , growing government debt crowds out private investment and contributes to higher interest rates. My analysis found that sticky inflation and worries about U.S. fiscal sustainability have pushed long-term Treasury yields higher, and mortgage rates track those long-term yields far more closely than the Federal Reserve’s policy rate. Producer prices are still rising. According to the Bureau of Labor Statistics (BLS), producer prices rose 6.5% over the year through October, their largest increase since November 2022. BLS reported that truck freight prices rose 3.9% in October, accounting for more than 80% of the increase in services prices, even as diesel prices fell 7.9% from September. Truck freight prices were up 24.6% from a year earlier, according to BLS. According to my analysis of BLS producer price data, retail margins narrowed for computers, appliances and sporting goods, consistent with shoppers resisting higher prices. This week’s retail sales report could help clarify how spending is holding up. Retail sales and builder confidence arrive Tuesday, followed by housing starts and permits Wednesday. Orphe Divounguy, PhD, is chief economist for The Center Square and founder and chief economist of Quantitative Research Group, the co-host of the Everyday Economics podcast and a former economist at Zillow. He has briefed the White House Council of Economic Advisers, testified before state legislatures, and delivers more than 30 speaking engagements annually. Orphe also has a large media footprint, typically 300-400 media mentions per quarter. He specializes in housing, labor markets, and the broader economy. More at orphedivounguy.com Facebook Twitter WhatsApp SMS Email Print Copy article link Save Recommended for You Trump warns Iran will ‘pay a price’ if It targets D.C. as Asia trip begins Trump to meet Xi, Putin in China for nuclear arms talks; Ukraine off agenda Feds consider plan converting old oil rigs into artificial reefs Nonprofit analyst puts $4.9T price tag on Democrats' first 100 days Midterms could prove fatal to electoral college See More > Podcast A daily feature of the top stories from The Center Square. Apple Podcasts Spotify","published_at":1795205342000,"mutable":false,"date_precision":"timestamp","modified_at":0,"extraction":"semantic","canonical":"https://thecentersquare.com/national/article_8e7eed19-23cc-4297-94ab-08bbb45c3094.html","content_hash":"942840250e17a17088f84cac4059b5508f1558510a56a581869518331614c535","access":"public","evidence_status":"article","id":"f2a139852e2646f5","source_family":"nrhc","is_research":false,"required_source":false,"first_seen_at":1795383442856,"acquisition_window":{"lower":1795122000000,"upper":1795381200000},"score":33,"tags":["housing","national","data","trend","brokerage"],"heat_signals":["fed","inflation","mortgage rate","30-year fixed","housing starts","permits","freddie mac","annual","existing-home sales","housing starts"],"editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Everyday Economics: The federal government delayed the housing recovery – The Center Square"},{"id":"body-1","text":"Facebook Twitter WhatsApp SMS Email Houses line a suburban neighborhood."},{"id":"body-2","text":"Photo: Alan Wooten / The Center Square Facebook Twitter WhatsApp SMS Email Print Copy article link Save (The Center Square) – Existing-home sales fell in October to their slowest pace since August 2010, according to the National Association of Realtors ."},{"id":"body-3","text":"Federal policy is pulling in two directions: HUD has cut lenders’ costs on taxpayer-backed FHA loans, while tariffs, the conflict with Iran and federal borrowing add to the inflation and interest-rate pressures that keep mortgages expensive."},{"id":"body-4","text":"According to Freddie Mac , the 30-year fixed rate has been climbing since the war began and now exceeds year ago levels."},{"id":"body-5","text":"According to the National Association of Realtors , October existing-home sales fell to a seasonally adjusted annual rate of 3.75 million, the weakest pace since August 2010, and 8.8% below a year earlier."},{"id":"body-6","text":"According to my calculations using NAR’s unadjusted data , actual October closings fell 11.7%, partly b"}],"keep":true,"importance":4,"section":"national","capital_focus":false,"geo_evidence":null,"primary_event":"market_research_policy","event_evidence_id":"body-5","event_evidence":"According to the National Association of Realtors , October existing-home sales fell to a seasonally adjusted annual rate of 3.75 million, the weakest pace since August 2010, and 8.8% below a year earlier.","market_evidence_id":"body-5","market_role":"market_policy","market_scope":"us","market_evidence":"According to the National Association of Realtors , October existing-home sales fell to a seasonally adjusted annual rate of 3.75 million, the weakest pace since August 2010, and 8.8% below a year earlier.","duplicate_of":null,"selector_reason":"NAR的10月成屋实际成交季调年化为375万套，同比下降8.8%，为2010年8月以来最低；与已刊的成屋签约指标不同。","title_zh":"10 月成屋销售降至 2010 年 8 月以来最低","summary_zh":"文章援引 NAR 称，10 月成屋销售季调年率降至 375 万套，同比下降 8.8%，为 2010 年 8 月以来最低；按揭成本上升继续压制可负担性。","impact":"short-neg","evidence_quote":"Facebook Twitter WhatsApp SMS Email Houses line a suburban neighborhood. Photo: Alan Wooten / The Center Square Facebook Twitter WhatsApp SMS Email Print Copy article link Save (The Center Square) – Existing-home sales fell in October to their slowest pace since August 2010, according to the National Association of Realtors .","evidence_basis":"body","cre_subcategory":null},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Housing groups cheer Senate passage of milestone permitting bill","link":"https://www.housingwire.com/articles/senate-passes-baaja-permitting-bill/","description":"The U.S. Senate passed the Bipartisan American Affordability and Jobs Act (BAAJA) on Thursday night in a 62-33 vote, advancing legislation designed to streamline federal permitting for a broad range of projects, including housing. The permitting reform bill aims to cut regulatory delays and lower costs for major development projects in housing, energy infrastructure and transportation. It is likely one of the last bipartisan measures this Congress will vote on before the 120th Congress is sworn in shortly after the new year. Pro-housing groups strongly support the bill, but many environmental organizations oppose it, arguing that it would roll back necessary environmental protections and promote more fossil fuel consumption. BAAJA now heads to the U.S. House of Representatives , which is widely expected to vote on the measure before the new Congress is sworn in on January 3. However, the clock is ticking, as the House is already on Thanksgiving recess. That leaves about a month for the House to either pass the Senate’s version or reconcile any differences between the two chambers. If the bill doesn’t reach President Trump’s desk by January 3, the process would have to start over with the new Congress, which would likely change some of its provisions. How BAAJA could streamline housing development Many affordable and multifamily projects that rely on federal funding or assistance face regulatory hurdles that most privately financed housing developments avoid. These projects include those backed by the U.S. Department of Housing and Urban Development (HUD), the Federal Housing Administration (FHA), and the U.S. Department of Agriculture (USDA). Examples include housing built using public housing assistance, Community Development Block Grant (CDBG) funding, USDA housing loans, disaster relief funds and more. Most notably, these federally backed housing projects must go through National Environmental Policy Act (NEPA) and National Historic Preservation Act (NHPA) reviews that don’t apply to most private- sector development projects. These reviews, critics argue, add an extra regulatory burden that can increase project timelines by a year or more. Critics further contend that NEPA and NHPA, while well-intentioned laws, are often used by NIMBY groups to delay or kill affordable housing development. In response to these concerns, BAAJA would streamline NEPA reviews for housing development by: narrowing the list of housing projects that must undergo federal environmental reviews. allowing federal agencies to use other qualifying state, tribal or federal environmental reviews. limiting duplicative federal reviews. speeding up review timelines by establishing stricter review and public comment period deadlines for projects that go through NEPA reviews. These changes would strengthen and expand provisions in the HOME Reform Act of 2025 , a bill included in the 21st Century ROAD to Housing Act that exempted small federal housing projects of 15 units or less from NEPA review. BAAJA would similarly streamline NHPA reviews and narrow which projects trigger a review, allowing redevelopment projects involving older buildings to move forward more quickly. Additionally, the bill would streamline Clean Water Act reviews, in effect speeding up federal wetlands permitting by shortening review timelines and limiting certain EPA interventions and legal challenges. It would also shorten Endangered Species Act consultation timelines and give states a larger role in federal reviews to reduce permitting delays for residential developments on land with protected species or habitats. Pro-housing groups signal their support Support for BAAJA spans much of the housing industry. Earlier this month, the National Association of Home Builders , YIMBY Action , Up for Growth Action and dozens of other housing organizations and homebuilder groups signed a letter urging the Senate to move the permitting reform package forward. On Friday, National Association of REALTORS Executive Vice President and Chief Advocacy Officer Shannon McGahn said in a statement she supports the legislation’s goal of streamlining “permitting processes and reducing unnecessary regulatory burdens that drive up development costs, delay construction and limit housing supply.” “These barriers affect everything from starter homes to multifamily rental housing, making it harder to meet the needs of buyers and renters alike,” McGahn said. NAHB further argued that BAAJA would reduce land development costs and permitting delays, while also improving multifamily builders’ access to federal housing finance programs. In a statement following the Senate’s vote, NAHB Chairman Bill Owens said that the bill “will help builders deliver the affordable homes families need.” “By cutting the regulatory costs and delays that drive up the price of construction, BAAJA will expand housing supply, lower costs for buyers and renters and increase access to affordable rental housing. With so many families priced out of the market, the House must pass this bill without delay,” Owens said. Why BAAJA is controversial Housing is only a fraction of what BAAJA targets. It mainly aims to streamline the development of a wide range of federally backed projects, including: Energy infrastructure, such as power plants, electric transmission lines, grid upgrades, natural gas pipelines and renewable energy projects. Broadband and telecommunications infrastructure. Mining operations and development of domestic mineral resources. Transportation infrastructure, such as roads, bridges, ports and public transit. As it does for housing, BAAJA would scale back NEPA and other environmental reviews for these federal projects, while also including other measures to shorten permitting and approval timelines. In the Senate, 47 Republicans and 15 members of the Senate Democratic caucus voted in favor of the bill. Senators Mike Rounds (R-S.D.) and Josh Hawley (R-MO) were the only Republican Senators to vote","published_at":1795207674000,"source_family":"housingwire","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1795383442856,"id":"7a21efbadbfc8ead","acquisition_window":{"lower":1795122000000,"upper":1795381200000},"score":12,"tags":["housing","national","policy","construction"],"heat_signals":["fed"],"date_precision":"timestamp","modified_at":1795207677000,"extraction":"semantic","canonical":"https://housingwire.com/articles/senate-passes-baaja-permitting-bill","content_hash":"801496c0d5577f0502024666070c48efe78773803674bcb072c085d8f4f37c9a","access":"public","evidence_status":"article","editorial_protocol":"evidence-refs-v2","editor_evidence":[{"id":"title","text":"Housing groups cheer Senate passage of milestone permitting bill"},{"id":"body-1","text":"The U.S. Senate passed the Bipartisan American Affordability and Jobs Act (BAAJA) on Thursday night in a 62-33 vote, advancing legislation designed to streamline federal permitting for a broad range of projects, including housing."},{"id":"body-2","text":"The permitting reform bill aims to cut regulatory delays and lower costs for major development projects in housing, energy infrastructure and transportation."},{"id":"body-3","text":"It is likely one of the last bipartisan measures this Congress will vote on before the 120th Congress is sworn in shortly after the new year."},{"id":"body-4","text":"Pro-housing groups strongly support the bill, but many environmental organizations oppose it, arguing that it would roll back necessary environmental protections and promote more fossil fuel consumption."},{"id":"body-5","text":"BAAJA now heads to the U.S. House of Representatives , which is widely expected to vote on the measure before the new Congress is sworn in on January 3."},{"id":"body-6","text":"However, the clock is ticking, as the House is already on Thanksgiving recess."},{"id":"body-7","text":"That leaves about a month for the"}],"keep":true,"impor e 45, is being developed in partnership with Ares Management Corp. It will have six buildings ranging from 34K SF to 169K SF and will include an amenity area. Sites of this scale in the path of North Houston’s growth are increasingly hard to find, said Kyle Heath, who oversees new development in Texas for Formation. The Grand at Formation Park is designed by Goree Architects and Kimley-Horn. Rino Construction serves as the general contractor, and Stream Realty Partners is overseeing leasing. Construction is expected to be completed by the end of 2027. PEOPLE Kirksey Architecture announced that David Dalton will be the firm’s next president and CEO, beginning Jan. 1. Dalton will take over from Wes Good, who will remain chairman of the board. Kirksey David Dalton and Wes Good Dalton will be the third president of the company since Kirksey’s inception in 1971. Good took over the role from founder John Kirksey in 2018 after 11 years as managing principal. As managing director of the Central Texas office, Dalton oversaw growth, taking the team from three to 24 people. He has been with Kirksey for 18 years and moved with his family to lead the opening of the firm’s Austin office in 2018. SALES The Shoppes at Westpark, a 22,500 SF, fully occupied neighborhood retail center, traded to an undisclosed buyer. The center at 26440 FM 1093 in Richmond was built in 2013 and has eight suites. All tenants operate under triple-net leases. Marcus & Millichap’s Philip Levy marketed the property on behalf of the seller. *** Newman Kelly announced the following sales: Dhanani Private Equity Group acquired a 64K SF El Rancho Supermercado at the southwest corner of Fry and Morton roads. Newman Kelly’s Logan Kelly represented the buyer. John Zikos, Lawrence Wilson and Dean Straka with Venture Commercial Real Estate represented Albertsons. Kelly represented a private investor in the acquisition of a 21K SF medical office building in Humble. The seller was represented by Adam McAlpine at McAlpine Interests. Kelly represented a local private investor in the off-market acquisition of a 29K SF, single-tenant, net lease industrial property in Tomball. The seller was represented by Alex Wisnoski at Texas CRES. *** Speed Bay Group acquired Greens Road Industrial Park, a 10-building, 249K SF multitenant industrial property in North Houston. This is the firm’s first acquisition in Houston. The 95% leased property will be rebranded as Airway Logistics Park. Speed Bay Warehouse Solutions, the operating platform of Speed Bay Group, will oversee leasing, property management and tenant services. CONSTRUCTION AND DEVELOPMENT Houston-based homebuilders Davis Group and Vanitas Devco are developing Wentworth, a collection of 19 residences at 1117 Post Oak Park Drive. Prices will start at $1.8M, and the homes will range from 3,350 SF to 4,700 SF. There will be eight distinct floor plans ranging from three to four bedrooms. Nan & Company Properties, a Forbes Global Properties affiliate, is the exclusive sales and marketing partner. Nan & Company Properties will lead sales and marketing efforts for the gated residential community through its Builder Services division. Since sales began in winter 2024, eight of Wentworth's 19 residences have sold, and four completed homes are move-in ready. The remaining homes are under construction, with staggered delivery expected through fall 2027. *** HTG, a developer of affordable housing, opened The Rushmore, a $34.2M, mixed-income-housing community in Houston’s Energy Corridor. The development has 101 units ranging from one to three bedrooms, and 85 are reserved for income-qualifying residents. The community will have resident-focused programming, including annual income tax preparation, a food pantry and an annual health fair. The Rushmore is a public-private partnership supported by funding sources including $20M in construction financing from Citi Community Capital, $15.2M in low-income housing tax credits syndicated through Raymond James, $3M in HOME financing from the city of Houston, $6M in American Rescue Plan Act and land acquisition funding from Harris County, and an $8.2M permanent loan from Citi Community Capital. Harris County Housing Finance Corp., through an affiliate, serves as the project's managing member and is providing a 99-year ground lease. The development team included EOS Builders as general contractor, HEDK Architects, engineer WGI Inc., interior designer Builders Design and landscape architect GreenScape Associates. *** Courtesy of DLR Group Anchor Construction topped out on the AC Hotel by Marriott CityCentre Houston. The six-story, 153-room hotel owned by PA Hospitality is at 10752 Town and Country Way. It is expected to open in November 2027. The project team includes Anchor as general contractor and DLR Group as architect. The 86K SF hotel will have a pool, bar, fitness center and meeting space. *** Define, a Houston-based developer that builds apartment communities around resident well-being, broke ground on Define: Park Row. The 388-apartment community sits on 10 acres in West Houston's Energy Corridor and is scheduled to open in fall 2027. At the groundbreaking, guests took part in yoga and guided meditation and watched trampoline performances. Define: Park Row is in Wolff Cos.' Central Park master-planned community, off Interstate 10 and adjacent to Addicks Reservoir and Terry Hershey Park. Seven four-story buildings will offer 388 one- and two-bedroom apartments ranging from 650 SF to 1,100 SF. An amenities center will include a fitness studio for indoor cycling, yoga, trampolines and fitness classes, along with an infrared sauna, a cold plunge and a cooking demonstration area. Outdoors, residents will have a pool, two pickleball courts, a","published_at":1795212232000,"source_family":"bisnow","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1795383442856,"id":"da7d7a4c3996b1ee","acquisition_window":{"lower":1795122000000,"upper":179
