le-family homes, indicators show a pullback beginning as it was being debated, Cotality said. But local real estate investors are filling the void, fueling a fresh wave of demand for debt service coverage ratio loans and rental loan products. Processing Content Mega-investors, the ones who own 1,000 or more properties actually had a bigger portion of this group's share at 1.7% in June from 1.3% in February and March. But in December 2025, they were 2.6% of the market and this started declining as the ROAD Act was being debated. In June, the small investors, those with three-to-nine properties owned, had a 14.3% portion of the 27% total share. The medium category, between 10 and 99 properties, had a 9% share. Large investors, owners with between 100 and 999 properties, had a 2.2% share. Business-purpose lenders should be looking at activity levels from the second quarter as well as today to gauge the impact when the rules go into effect in the first quarter of 2027. While the investor share ended the second quarter at 27%, one percentage point lower than three months earlier, the \"more compelling story\" comes up when one looks at the unit numbers and the year-to-year change , said Thom Malone, Cotality's principal economist. \"Investors executed roughly 40,000 fewer purchases compared to the second quarter of 2025, with mega investors accounting for about 10,000 of that decline,\" Malone said in a press release. \"That represents a significant drop given their small market presence, suggesting that proposed restrictions on institutional investors had an immediate chilling effect.\" The ROAD Act became law without President Trump's signature on July 11, although its provisions regarding institutional investors do not take effect until Jan. 7, 2027. Morningstar DBRS recently issued a report looking at the effects on investor products in the securitization market. Second quarter market share changes followed historical seasonality, Cotality said. For the current perio monly referred to as Y&#039;all Street , has turned Uptown Dallas into a premier office market in the region, commanding North Texas’ highest rents and accounting for nearly 94% of its development pipeline. Rents for the newest trophy office space in Uptown have grown nearly 31% over the last two years as companies seek the highest-quality product available in the submarket that has become the heart of Dallas-Fort Worth’s growing financial sector. That increase is almost double the just over 16% rent growth recorded across the metro in that same time frame, according to JLL data. Unsplash/Mark Patterson The 1.3M SF of top-tier office space delivered in Uptown over the last two years also accounts for nearly 31% of the metro’s new inventory during that time. Continued demand for trophy office space near Y’all Street companies and the premium rents they fetch have developers scrambling to build new projects in Uptown, according to JLL Dallas Director of Research Micah Rabalais. &#34;Is it going to be what it was 10 years ago from a construction volume standpoint, where we might have had, in Uptown alone, 3M SF or 4M SF underway at certain points in time? Probably not, but I do think we maintain this pace,&#34; Rabalais said of his forecast of another 1.3M SF that could be delivered by the middle of 2028. The heightened demand in Uptown has been driven by a flight to quality as companies aim to establish a presence in DFW now that the region has the newly launched Texas Stock Exchange as well as offices for the New York Stock Exchange and other major financial heavyweights. The metro has become the second-largest financial hub in the U.S. thanks to the growth of Y’all Street and its knack for attracting corporate relocations, as well as continued population growth , a thriving economy and a highly skilled workforce. Surging Demand Major financial services firms like Goldman Sachs , Scotiabank , NYSE and Morgan Stanley have planted their flags in and around Uptown, and the TXSE plans to move into the submarket’s under-construction Bank of America Tower at Parkside next year. Those major Y’all Street players and the related professional services firms that have flocked to the area have brought the demand for the highest-quality office space to a fever pitch. During the first half of 2026, Uptown/Oak Lawn absorbed almost 537K SF, nearly three times the next-closest submarket total in the metro. The average Class-A asking rents of $73.60 per SF in the submarket easily outpace the $42.86 average fetched across the metro and the $45.87 national average, according to JLL’s second-quarter market report . Courtesy of Granite Properties 23Springs office building in Uptown Dallas Despite an elevated vacancy rate due to all the new deliveries, the highest-quality trophy office properties built since 2015 in Uptown are now commanding nearly $100 per SF triple-net leases , according to data from JLL. And with the TXSE newly launched, demand for that top-tier Uptown office space is only expected to grow. &#34;It&#039;s going to continue simply because Dallas has become a new epicenter, if you will, of financial activity in the United States,” Rabalais said. Y’all Street is home to more than 380,000 financial services professionals, a total only eclipsed by New York. That growth has helped attract companies to bring regional hubs and major offices to the metro for fear of missing out on everything Y’all Street has to offer. &#34;There&#039;s momentum that&#039;s built off of their peers having a presence here,” said JJ Leonard , managing director of Partners Real Estate &#039;s Dallas office. Y’all Street has also raised DFW’s profile around the world. Wildcat Management CEO Tanya Ragan said she recently hosted a group from Tokyo looking for space in the metro. The Dal","published_at":1788469340000,"score":27,"tags":[],"heat_signals":["texas","dallas","fort worth","dfw","forecast","rent growth","vacancy"],"importance":3,"selector_reason":"达拉斯Upt ms. The most notable pause was the $5B National Electric Vehicle Infrastructure program, or NEVI, whose freeze in early 2025 stalled hundreds of planned charging projects and forced some operators to shut down. A judge’s decision earlier this year reversed the freeze, releasing some funding. New sales of electric vehicles flattened in 2025 at about 1.2 million, according to the Bureau of Transportation. But the used EV market is growing rapidly, up 10.1% year-over-year in July, boosting the overall number of EVs on the road and the need for charging stations. Operators added 4,382 new charging ports across 806 stations during the second quarter of 2026, bringing the total nationwide to just under 78,000, according to Paren’s State of the U.S. Fast EV Charging Industry report. Charging sessions were up 29% to 3.5 million in June. Nationwide, convenience stores host roughly 1,365 chargers, while big-box retailers have 600, according to Electric Era. The nation has more than 250,000 total EV chargers across 81,000 locations, up from 228,000 ports at the end of 2025. Retailers, especially big-boxes with ample parking and easy highway access, are taking advantage of the growing market and access to private financing options to draw customers and keep them on site. The country’s biggest brick-and-mortar retailer is leading the charge. Walmart has quickly grown its own fast-charger network at its company-owned parking lots, recently announcing its 100th charging location at a store in Monument, Colorado. The company plans to have thousands of locations by 2030 . Shoppers can use the chain’s app, pull up to banks with as many as 16 chargers, and power up their vehicles while they shop. The store offers charging discounts as a perk to its Walmart&#43; customers. “ Tesla &#039;s the 800-pound gorilla, so Walmart would be the 400-pound gorilla in the room,” Ferro said. He’s tracking more than 200 additional Walmart charging locations in the pipeline. The Walmart rollout unders
