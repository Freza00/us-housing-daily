:"sunbelt","title_zh":"Colorado River 限水逼近，Phoenix 供给受压","summary_zh":"科罗拉多河用水限制可能影响 Phoenix 扩张，水资源风险上升","impact":"short-neg","id":"47f67639","fetched_at":1787371835171},{"source_id":"national-mortgage-news","source_name":"National Mortgage News","source_tier":"A","source_weight":7,"source_tags":["rates","macro"],"region":"national","title":"Bumps in the ROAD Act led to slowdown in build-to-rent space","link":"https://www.nationalmortgagenews.com/news/bumps-in-the-road-act-led-to-slowdown-in-build-to-rent-space","description":"REALTORS HOMEBUILDERS Bumps in the ROAD Act led to slowdown in build-to-rent space By Spencer Lee CloseText About Spencer twitter Spencer_NYC linkedin spencer-lee-journo Published August 21, 2026, 1:23 p.m. EDT 2 Min Read Facebook Twitter LinkedIn Email The tortuous, but ultimately successful, path to passage of the recent housing bill brought with it a noticeable slowdown in build-to-rent construction this year. Processing Content Builders broke ground on approximately 15,000 single-family BTR constructions in the second quarter. Volume came in \"measurably\" down from 18,000 units in the same three months in 2025, according to an analysis of U.S. Census Bureau data by the National Association of Home Builders. The latest number improved from first-quarter's 14,000 starts but represented a continuation of the pullback in year-over-year volume seen at the beginning of 2026, as various iterations of a federal housing proposal left builders questioning the future business prospects of BTR construction. \"Fortunately, changes by the House of Representatives addressed a harmful Senate proposal,\" wrote NAHB Chief Economist Robert Dietz. An earlier Senate revision of the 21st Century ROAD to Housing Act included a mandate directed at institutional investors, which would have required them to sell build-to-rent homes within seven years after purchase. The proposal led NAHB to briefly withdraw support for the legislation after backing a previous House version of the bill. Restrictions on institutional purchases received the backing of President Trump, who has issued statements critical of corporate investors' role in driving up home prices in 2026. While he appeared far from enthusiastic about the ROAD Act's passage, abruptly canceling a planned signing ceremony hours before it was scheduled to begin, Trump ultimately allowed the bill to take effect. With the new housing legislation now official policy, the construction market should see BTR starts recover in the near future, Dietz noted. \"The housing legislation, as enacted into law, does not include a prohibition against institutional capital financing BTR housing. Stabilization for BTR housing should be reached in the coming months,\" he said. BTR now takes a 7% share of the market Along with the uncertainty coming from Congressional circles, BTR development also slowed in the second quarter due to higher financing costs and increased competition from the multifamily sector, NAHB said. The effects of dampened enthusiasm among builders was apparent in the reported start volumes over the past 12 months. Construction began on approximately 63,000 build-to-rent homes from mid-2025 to mid-2026 on a rolling four-quarter basis. Compared to the same corresponding period a year ago, volume decreased from an estimated 75,000 starts. BTR homes account for just under 7% of the housing market, although numbers include only properties specifically developed and held for rental purposes by builders. New homes sold to third parties with the intent to turn their purchases into rental properties may represent as much as an additional 5% of starts, according to NAHB estimates. Despite their relatively small portion of the market, the 7% number today represents a larger slice of housing inventory compared to the pre-Great Recession era between 1992 and 2012, when BTR units accounted for 2.7%. With affordability still an obstacle for potential home buyers, BTR is likely to maintain its current market share, Dietz wrote. Construction growth, though, is likely to be sluggish given lingering housing market and policy pressure. Spencer Lee Technology Reporter Spencer Lee is a New York-based technology reporter at National Mortgage News, whose coverage area spans artificial intelligence, fintech platforms... Read full bio twitter linkedin","published_at":1787333012000,"score":29,"tags":["btr-sfr","national","construction","policy","homebuilder"],"heat_signals":["build-to-rent","btr","fed","year-over-year","housing market"],"importance":4,"selector_reason":"ROAD Act 通过后，build-to-rent 施工出现明显放缓，直接影响该细分赛道供给。它牵涉政策对住房投资的传导，重要性较高。","section":"btr","title_zh":"ROAD Act 争议拖慢 BTR 开发节奏","summary_zh":"政策分歧引发 build-to-rent 开工放缓，Q2 约1.5万套低于去年同期","impact":"short-neg","id":"25d52d4f","fetched_at":1787371835171},{"source_id":"nahb-eyeonhousing","source_name":"NAHB Eye on Housing","source_tier":"B","source_weight":8,"source_tags":["data","trend","policy"],"region":"national","title":"Second Quarter Declines for Single-Family Built-to-Rent","link":"https://eyeonhousing.org/2026/08/second-quarter-declines-for-single-family-built-to-rent/","description":"Second Quarter Declines for Single-Family Built-to-Rent &#8211; Eye On Housing Skip to content Search Research/Data Housing Economics Plus Books Dashboards Local Data Research Studies Services Indices Team Videos Research/Data Housing Economics Plus Books Dashboards Local Data Research Studies Services Indices Team Videos Eye On Housing National Association of Home Builders Economic Research Blog Second Quarter Declines for Single-Family Built-to-Rent August 21, 2026 Robert Dietz No Comments Single-family built-for-rent (SFBFR, or built-to-rent (BTR)) construction fell back in the second quarter of 2026, as a higher cost of financing, increased multifamily supply and policy concerns over Congressional legislation related to institutional capital froze parts of the development market. Fortunately, changes by the House of Representatives addressed a harmful Senate proposal. The housing legislation, as enacted into law, does not include a prohibition against institutional capital financing BTR housing. Stabilization for BTR housing should be reached in the coming months. According to NAHB’s analysis of data from the Census Bureau’s Quarterly Starts and Completions by Purpose and Design , there were approximately 15,000 single-family built-for-rent ( SFBFR ) starts during the second quarter of 2026. This is down measurably from the second quarter of 2025 (18,000). Over the last four quarters, 63,000 such homes began construction, which is a 16% decrease compared to the 75,000 estimated BTR starts for the prior four quarter period. The BTR market is a source of inventory amid challenges regarding housing affordability and down payment requirements in the for-sale market, particularly during a period when a growing number of people want more space and a single-family structure. Single-family built-for-rent construction differs in structural characteristics compared to other newly-built single-family homes, particularly with respect to home size. Given the relatively small size of this market segment, the quarter-to-quarter movements typically are not statistically significant. The current four-quarter moving average of market share (just under 7%) is nonetheless higher than the historical average of 2.7% (1992-2012). Importantly, as measured for this analysis, the estimates noted above include only homes built and held by the builder for rental purposes. The estimates exclude homes that are sold to another party for rental purposes, which NAHB estimates may represent another three to five percent of single-family starts based on industry surveys. The Census data note an elevated share of single-family homes built as condos (non-fee simple), with this share averaging about 3% over recent quarters. Some, but certainly not all, of these homes will be used for rental purposes. Additionally, it is theoretically possible that some single-family built-for-rent units are being counted in multifamily starts, as a form of “horizontal multifamily,” given that these units are often built on a single plat of land. However, spot checks by NAHB with permitting offices indicate no evidence of this data issue occurring.a With the onset of the Great Recession and declines in the homeownership rate , the share of built-for-rent homes increased in the years after the recession. While the market share of SFBFR homes is small, it has clearly expanded. Given affordability challenges in the for-sale market, the SFBFR market will likely retain an elevated market share. BTR , single-family built for rent Prev Previous Housing Affordability Worsens on Higher Mortgage Rates Next State-Level Employment Situation: July 2026 Next Leave a Reply Cancel reply Your email address will not be published. Required fields are marked * Comment * Name * Email * Website Yes, add me to your mailing list Share this Page Subscribe to Blog Subscribe Search by Category Construction Statistics Finance Home Sales and Prices Labor Force Macroeconomics Market Trends Policy Research C","published_at":1787316300000,"score":25,"tags":["btr-sfr","national","construction","policy","developer"],"heat_signals":["btr","mortgage rate","trend","trends"],"importance":4,"selector_reason":"这条是全美单户出租市场的季度回落，说明 BTR 进入降温阶段。虽然是行业数据，但对开发和机构持有决策有明显影响。","section":"btr","title_zh":"单户 BTR Q2 下滑，政策与融资拖累","summary_zh":"NAHB 称 single-family built-to-rent 开工回落，融资成本和政策担忧压制开发","impact":"short-neg","id":"0f1acbb3","fetched_at":1787371835171},{"source_id":"nrhc","source_name":"National Rental Home Council (NRHC)","source_tier":"E","source_weight":9,"source_tags":["btr-sfr","institutional"],"region":"national","title":"Single-Family Rentals Could Expand Access to Higher-Performing Schools, Study Finds &#8211; The Seattle Medium","link":"https://seattlemedium.com/single-family-rentals-could-expand-access-to-higher-performi
