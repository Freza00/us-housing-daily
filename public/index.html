,"source_name":"Zillow Research","source_tier":"B","source_weight":9,"source_tags":["housing","data","trend"],"region":"national","title":"Renters comfortably affording a house would need a $14,408 raise to buy one (October Rent Report)","link":"https://www.zillow.com/research/october-2026-rent-report/","description":"Renters comfortably affording a house would need a $14,408 raise to buy one (October Rent Report) Rental demand is up 22% as buying a single-family home stretches the budget far further than renting one. Written by Kara Ng on November 12, 2026 A household that can comfortably afford to rent a single-family home would need a $14,408 annual raise to afford the monthly costs of owning a home. Rental demand is up 22.1% year over year nationwide, as measured by the Zillow Observed Renter Demand Index, with demand for single-family rentals up 24.3%. The typical U.S. single-family rent was $2,243 a month in October, up 3.2% from a year ago, while the typical multifamily rent was $1,744, up 2.5%, according to the Zillow Observed Rent Index. Wanting a more suburban lifestyle — the extra space, yard and private garage that often come with a single-family home — doesn’t always mean stretching the budget to buy. In fact, it’s a stretch most families aren’t prepared to make, especially when a household comfortably affording the rent for a single-family home would need a $14,408 pay raise to cover the monthly costs of owning one, even before saving for a down payment. Nationally, the typical single-family rent is $2,243 a month, compared with $2,603 a month to own a single-family home with 20% down, or $360 more each month. To comfortably afford those costs — the rule of thumb being to spend no more than 30% of its income on housing — a household needs an income of $89,724 to rent and $104,132 to buy. For many households, renting a house is a choice and not a fallback. It takes less income than owning, and it leaves more room in the monthly budget. The size of the raise depends on the market The pay raise needed to buy is now the highest since early 2025, more than double the $6,463 it took in February 2026, when mortgage rates briefly fell below 6%. The gap looks very different from market to market. It’s largest in San Jose, where the income needed to buy ($404,925) is more than double the income needed to rent ($190,561), a gap of $214,364. The next largest gap is in San Francisco ($139,353), followed by San Diego ($84,101), New York ($78,208) and Los Angeles ($78,003). The smallest annual gaps are in Pittsburgh ($2,554), Houston ($4,500) and Cincinnati ($4,774). Buffalo is the only market where buying would not require a raise. Even with such a raise, would-be buyers still face another hurdle: saving a 20% down payment. About 30% of mortgage buyers use a gift or loan from family or friends, and 46% draw on two or more sources, including the use of down payment assistance programs , according to Zillow’s 2026 Consumer Housing Trends Report . In addition to the monthly cost, households deciding between renting and buying should weigh the upfront costs of buying, the chance to build equity and the opportunity for renters to invest their down payment instead. Zillow’s rent vs. buy research puts the national break-even timeline — the number of years a household would need to own before buying comes out ahead — at 7.8 years with 20% down. Rental demand keeps climbing As renting a house becomes an increasingly better value, more shoppers are turning to rentals. Rental demand is up 22.1% year over year nationwide, according to the Zillow Observed Renter Demand Index (ZORDI). Demand for single-family rentals is up 24.3%, roughly double the 12.1% rise for multifamily rentals. Rental demand surges in the Bay Area and the Sun Belt Demand rose the most in San Jose, where ZORDI is up 78.9% from a year ago, followed by San Francisco (60.5%), Austin (59.6%), Miami (51.5%) and Jacksonville (47.9%). San Jose and San Francisco are also among the markets where buying is furthest out of reach, and where rents are rising quickly, up 8.9% and 12.2% respectively. In Austin, Miami and Jacksonville, rent growth is more moderate, at 1.1%, 2.1% and 2.6%. Not every market is following the national trend. ZORDI is down year over year in Providence (-4.3%), Richmond (-1.9%), Baltimore (-1.7%), Hartford (-1.3%) and Washington, D.C. (-0.9%). Metro area* Zillow ObservedRenter Demand Index (ZORDI), Year over Year Typical single-family rent, Zillow Observed Rent Index (ZORI) Income needed to rent a single-family house Income needed to buy (20% down) a single-family house Pay raise needed to buy a single-family house United States 22.1% $2,243 $89,724 $104,132 $14,408 New York, NY 26.0% $3,490 $139,614 $217,822 $78,208 Los Angeles, CA 28.8% $4,417 $176,699 $254,702 $78,003 Chicago, IL 31.8% $2,509 $100,357 $111,663 $11,306 Dallas, TX 43.8% $2,325 $93,009 $110,818 $17,809 Houston, TX 36.5% $2,188 $87,509 $92,009 $4,500 Washington, DC -0.9% $3,159 $126,352 $160,058 $33,707 Philadelphia, PA 20.6% $2,260 $90,386 $115,196 $24,810 Miami, FL 51.5% $3,407 $136,284 $148,873 $12,589 Atlanta, GA 32.2% $2,247 $89,896 $107,994 $18,097 Boston, MA 17.2% $3,498 $139,920 $203,182 $63,261 Phoenix, AZ 40.4% $2,290 $91,592 $115,070 $23,479 San Francisco, CA 60.5% $4,190 $167,586 $306,939 $139,353 Riverside, CA 32.7% $3,121 $124,854 $160,573 $35,719 Detroit, MI 9.6% $1,645 $65,806 $77,695 $11,889 Seattle, WA 8.6% $3,349 $133,977 $197,243 $63,266 Minneapolis, MN 19.0% $2,465 $98,591 $114,478 $15,886 San Diego, CA 23.5% $4,135 $165,389 $249,491 $84,101 Tampa, FL 30.2% $2,359 $94,361 $108,456 $14,095 Denver, CO 22.6% $2,875 $114,984 $151,621 $36,637 Baltimore, MD -1.7% $2,463 $98,533 $114,762 $16,228 St. Louis, MO 1.0% $1,666 $66,649 $82,464 $15,815 Orlando, FL 21.1% $2,423 $96,915 $113,826 $16,911 Charlotte, NC 17.4% $2,164 $86,555 $103,899 $17,344 San Antonio, TX 34.2% $1,813 $72,526 $84,140 $11,615 Portland, OR 25.1% $2,663 $106,509 $149,64 ,{"source_id":"northmarq-research","source_name":"Northmarq Research","source_tier":"B","source_weight":9,"source_tags":["multifamily","data","trend"],"region":"national","title":"Denver multifamily rent gains broaden as construction slows","link":"https://northmarq.com/insights/insights/denver-multifamily-rent-gains-broaden-construction-slows-q3-2026","description":"HighlightsOperating conditions in the Denver multifamily market remained stable during the third quarter, with vacancy holding steady and rents increasing for a third consecutive quarter. Supply-side pressures continued to ease as deliveries slowed and the construction pipeline contracted.Despite some quarter-to-quarter volatility during prior periods, vacancy ended the third quarter at 6.3%, unchanged from the previous quarter and flat from one year ago.Average rents increased 0.7% during the third quarter to $1,813 per month. Rents remain 1.5% below the year-ago level, although the annual decline narrowed from 3.0% in the second quarter.Investment activity picked up during the third quarter, with 11 properties trading for approximately $478 million. The third-quarter median sale price reached $232,300 per unit as newer properties accounted for a greater share of transaction activity, although the year-to-date median remained lower at approximately $170,700 per unit.Denver multifamily market overviewRent performance improved across much of the Denver multifamily market during the third quarter, although vacancy trends remained uneven. Rents increased in 24 of the metro's 33 submarkets, after just a handful of areas posted gains during the same period last year. While rents were on the rise across much of the market, fewer than half of the submarkets recorded quarterly vacancy declines. Some of the stronger operating conditions were found in northern and northwestern areas. Brighton, Erie/Firestone/Frederick and Denver Northwest all recorded positive annual rent growth alongside declines in vacancy from one year ago. Conditions remained more challenging in parts of eastern Denver, where vacancy in the Denver International Airport and Aurora East submarkets was more than 100 basis points above year-ago levels and asking rents continued to decline.Multifamily investment activity broadened across the Denver suburbs during the third quarter following a first half concentrated in Denver proper. Properties outside the city accounted for 37% of quarterly dollar volume, up from 17% during the first six months. Much of the increase occurred in Aurora and Lakewood, where newer communities accounted for the largest suburban transactions. Despite the pickup in suburban activity, Denver proper continued to generate the majority of sales volume. Within the city, transactions included recently developed properties in central Denver, contrasting with the first half’s heavier concentration of older assets. The greater share of newer properties trading across both urban and suburban locations contributed to higher median pricing during the quarter.Employment:Education and health services added 10,100 jobs. Image Employment growth slowed in Denver during the third quarter. Payrolls were up 1,700 positions from one year ago in September, a 0.1% increase, compared with 0.6% annual growth at the end of the second quarter.Education and health services posted the largest annual employment gain among major sectors. Payrolls increased by 10,100 positions, or 4.6%, with healthcare and social assistance accounting for nearly all of the increase. Employment in the manufacturing and trade and transportation and utilities sectors remained below year-ago levels.Philip Morris International opened its new manufacturing campus in Aurora in July. The $1.2 billion facility is expected to directly employ approximately 500 workers across production, engineering, technical, quality-control and support positions.Forecast: Employment growth is expected to remain limited through the end of 2026. Employers are projected to add approximately 5,000 positions for the full year, expanding payrolls by 0.3% after a slight decline in 2025.Development and permitting:The development pipeline continues to contract. Image Multifamily deliveries slowed during the third quarter, with roughly 2,200 units completed. Year-to-date completions totaled approximately 7,400 units, down more than 35% from the same period in 2025.Approximately 24,100 units were under construction at the end of the third quarter, down 6% from one year ago. Future development remains concentrated in the CBD and along the metro’s eastern and northern growth corridors, including the Denver International Airport area.Multifamily permitting slowed sharply in the third quarter, with permits issued for approximately 800 units, the lowest quarterly total since 2017. Year to date, permits for roughly 5,300 units have been issued, down 13% from the same period last year. Forecast: Multifamily deliveries are expected to total approximately 10,000 units in 2026, down roughly 30% from 2025 and the lowest annual total since 2020.Vacancy:Class B remains the tightest segment. Image Vacancy held at 6.3% during the third quarter and is unchanged from one year ago. Quarterly absorption slowed to 3,800 units, but net move-ins totaled approximately 13,100 units over the past 12 months, up 4% from the preceding 12-month period.Submarket performance varied during the quarter. Vacancy in Denver Northwest declined 60 basis points to 5.6% and is now 190 basis points below the year-ago level. In Lowry, negative absorption pushed vacancy up 120 basis points to 9.6%, the highest stabilized vacancy rate in the metro.Class B had the lowest vacancy at 5.7%. Class A vacancy increased to 6.0%, up 120 basis points from one year ago, reversing its position below Class B in the third quarter of 2025. Class C vacancy remained elevated at 9.5%.Forecast: Stabilized vacancy is forecast to finish 2026 at approximately 7.0%, down 60 basis points from the end of 2025.Rents:Rents increased for a third consecutive quarter. Image Rents increased for a third consecutive quarter, rising 0.7% to $1,813 per month. The annual decline narrowed to 1.5%, compared with 3.0% in the second quarter and 3.3% at the start of the year.Annual rent growth was positive in six submarkets, although gains remained limited in several area","published_at":1794502800000,"date_precision":"day","published_date":"2026-11-12","modified_at":1794502800000,"extraction":"structured","canonical":"https://northmarq.com/insights/insights/denver-multifamily-rent-gains-broaden-construction-slows-q3-2026","content_hash":"134e1fff416c8fe2266e3ccdc1b414aec96b57b210aca69da74bfaa38c0cb0b2","access":"public","source_family":"northmarq-research","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794519452247,"id":"63c1d143287119fd","acquisition_window":{"lower":1794430800000,"upper":1794517200000},"score":35,"tags":["multifamily","national","data","trend","institutional"],"heat_signals":["permits","forecast","trend","trends","annual","rent growth","vacancy"],"evidence_status":"article","editor_evidence":[{"id":"title","text":"Denver multifamily rent gains broaden as construction slows"},{"id":"body-1","text":"HighlightsOperating conditions in the Denver multifamily market remained stable during the third quarter, with vacancy holding steady and rents increasing for a third consecutive quarter."},{"id":"body-2","text":"Supply-side pressures continued to ease as deliveries slowed and the construction pipeline contracted.Despite some quarter-to-quarter volatility during prior periods, vacancy ended the third quarter at 6.3%, unchanged from the previous quarter and flat from one year ago.Average rents increased 0.7% during the third quarter to $1,813 per month."},{"id":"body-3","text":"Rents remain 1.5% below the year-ago level, although the annual decline narrowed from 3.0% in the second quarter.Investment activity picked up during the kets has arranged the $212.5 million sale and financing of The Carrington at Lincolnwood, a 383-unit senior living community in Lincolnwood. JLL’s national seniors housing capital markets team represented the seller, a partnership of LAMB Properties, Harbert South Bay Partners and its capital partners.","evidence_basis":"body","cre_subcategory":"老年住房"},{"source_id":"freddie-pmms","source_name":"Freddie Mac PMMS","source_tier":"B","source_weight":9,"source_tags":["housing","data","trend"],"region":"national","title":"Mortgage Rates","link":"https://freddiemac.com/pmms","description":"Mortgage Rates Primary Mortgage Market Survey ® (PMMS ® ) results are based on the mortgage rate collected from thousands of loan applications submitted to Freddie Mac through Loan Product Advisor ® (LPA ® ) from lenders across the country when a borrower applies for a mortgage. Learn more in our FAQs . Primary Mortgage Market Survey ® U.S. weekly mortgage rate averages as of 11/12/2026 30-year Fixed-Rate Mortgage 7.11% 15-year Fixed-Rate Mortgage 6.45% Download Rates Since 1971 Mortgage Rates Decline for Fourth Consecutive Week to 7.11% Mortgage rates dropped to their lowest level in seven weeks, a welcome development that gives borrowers greater flexibility as they navigate the current housing market. The 30-year fixed-rate mortgage averaged 7.11% as of November 12, 2026, down from last week when it averaged 7.18%. A year ago at this time, the 30-year FRM averaged 6.24%. The 15-year fixed-rate mortgage averaged 6.45%, down from last week when it averaged 6.57%. A year ago at this time, the 15-year FRM averaged 5.49%. PMMS results are released weekly on Thursdays at 12 p.m. ET. and are an average of loan rates offered the prior Thursday through Wednesday. See our publication calendar . Compare Historical PMMS Results Frequently Asked Questions Toggle all accordion sections Expand All What data is used for PMMS? The PMMS results are based on data from our Loan Product Advisor (LPA): mortgage rates collected from thousands of loan applications submitted to Freddie Mac from lenders across the country when a borrower applies for a mortgage. For more detailed information, see Enhanced Mortgage Rate Survey Explained . How is the national average determined? We collect the mortgage rate of all purchase applications based on PMMS criteria and a national average mortgage rate is calculated out of all the selected loan applications. The criteria include weekly conventional, single-family originations with conforming loan limits as set by FHFA. Is the PMMS rate based on current lender quotes or recent settlements? PMMS rates are based on applications submitted to Freddie Mac for the given week from lenders across the country. What type of lenders are included in the PMMS? Currently, our lenders are a mix of credit unions, commercial banks and mortgage lending companies. Do the PMMS results represent the rates charged on a specific day of the week? If so, which day? Or are they the average rate charged that week? PMMS is published each Thursday at noon ET. When a U.S. holiday falls on a Thursday, the PMMS will publish on the Wednesday of that week. The week of application activity starts at 12:00 a.m. ET the prior Thursday and lasts through 11:59 p.m. ET Wednesday. Therefore, the PMMS results are an average of loan rates offered Thursday through Wednesday. See our publication calendar . Why are adjustable rates no longer published? ARMs indexed to alternatives to U.S. Treasury securities have become more prevalent in the market. As we worked on enhancing the PMMS , we carefully considered which loan products were most popular for the PMMS borrower profile (good/excellent credit, 20% loans, home purchase loans on owner occupied 1-unit single-family properties). Additionally, in recent years the mortgage market has been dominated by fixed mortgage products. While there has been an uptick recently in the share of adjustable-rate mortgages (ARMs) for the broader mortgage market, ARMs remain most popular for higher loan size (nonconforming) loans. Why are fees/points no longer published? Under the current LPA requirements, fees and points are not always required to be provided by lenders. Therefore, we are not able to report on the average fees and points. How has PMMS changed over time? Since April 1971, Freddie Mac shared the average 30-year fixed-rate mortgage rate with the PMMS. We have updated the information we collect and the process for gathering data over time. Changes in Data Processes When it was launched, PMMS surveyed lenders on the rates and points for their most popular 30-year fixed-rate, 15-year fixed-rate and 5/1 hybrid amortizing adjustable-rate mortgage products. The survey was based on first-lien prime conventional conforming home purchase mortgages with a loan-to-value of 80 percent. In addition, the adjustable-rate mortgage (ARM) products were indexed to U.S. Treasury yields, and lenders were asked for both the initial coupon rate and points as well as the margin on the ARM products. Lenders surveyed each week were a mix of lender types — credit unions, commercial banks and mortgage lending companies — roughly proportional to the level of mortgage business that each type commands nationwide. On November 17, 2022, the mortgage rate gathering process was updated. Instead of surveying lenders, we now use data from our Loan Product Advisor (LPA). Changes in Information Shared In 1984 , the 1-year ARM was added to the survey. In 1991 , the 15-year fixed-rate mortgage rate was added. In January 2005 , a 5/1 hybrid ARM series was added. In January 2016 , the 1-year ARM was discontinued. In November 2022 , adjustable rates and fees/points were discontinued. For more detailed information, see Enhanced Mortgage Rate Survey Explained . PMMS Archives See weekly rates by year in our historical data archive. See Archives Questions? Send your questions and comments to our economists. Contact Us Opinions, estimates, f ource_tier":"B","source_weight":8,"source_tags":["data","trend","policy"],"region":"national","title":"Significantly Weaker Demand for Residential Mortgages and CRE Loans in Third Quarter","link":"https://eyeonhousing.org/2026/11/significantly-weaker-demand-for-residential-mortgages-and-cre-loans-in-third-quarter/","description":"Significantly Weaker Demand for Residential Mortgages and CRE Loans in Third Quarter November 12, 2026 Eric Lynch No Comments Demand for all types of residential mortgages was significantly weaker, while lending standards for most were essentially unchanged &#8211; “ Remained basically unchanged ” means that the change or actual reading is greater than or equal to 0 and less than or equal to 5 percent. &#8211; “ Modest ” means that the change or actual reading is greater than 5 and less than or equal to 10 percent. &#8211; “ Moderate ” means that the change or actual reading is greater than 10 and less than or equal to 20 percent. &#8211; “ Significant ” means that the change or actual reading is greater than 20 and less than or equal to 50 percent. &#8211; “ Major ” means that the change or actual reading is greater than or equal to 50 percent.'> 1 in the third quarter of 2026, according to the recent release of the Senior Loan Officer Opinion Survey (SLOOS) . For commercial real estate (CRE) loans, lending standards for construction & development were moderately tighter, while multifamily loans were modestly tighter. Compared to the previous quarter, demand for construction & development and multifamily loans was also significantly weaker. The Federal Reserve held their key short-term interest rate (i.e., Fed Funds) steady at a target range of 3.75% to 4.00% during their October meeting, after a 25 basis point rate hike in September. Since Chairman Warsh has begun presiding over the Fed, the phrase “ The Committee will deliver price stability ” has appeared in all four press release statements after each Federal Open Market Committee (FOMC) meeting. This is signaling a more hawkish direction for monetary policy, especially given current inflation levels. As a result, NAHB is forecasting a rate hike during the December meeting which will precipitate a lengthy pause. Residential Mortgages In the third quarter of 2026, four of seven residential mortgage loan categories saw a positive 2 net easing index for lending conditions: Non- Qualified Mortgage (QM) jumbo , QM jumbo, non-QM non-jumbo, and QM non jumbo non- GSE -eligible. An additional two ( Government and GSE-eligible) recorded a neutral reading (i.e., near 0). Subprime was the only residential mortgage loan category to record a negative value (-20.0), the lowest reading since the first quarter of 2023. All seven residential mortgage loan categories reported significantly weaker demand in the third quarter of 2026, with six having a net percentage of -30% or lower. The average net easing index value (-32.2) across all seven residential mortgage categories is the lowest since Q4 2023 (-49.0). Commercial Real Estate (CRE) Loans For the CRE loan categories, multifamily and construction & development loans registered net easing indices of -8.8 and -15.5 , respectively, in the third quarter of 2026. x In both cases, this represented the lowest reading in two years. The net percentage of banks reporting stronger demand was -25.9% and -22.8% for construction & development and multifamily loans, respectively, with a negative number indicating weaker demand. Both CRE categories experienced their lowest net demand percentages in over two years. The Federal Reserve uses the following descriptors when analyzing results from the survey which will be used, in principle, within this blog post as well: – “ Remained basically unchanged ” means that the change or actual reading is greater than or equal to 0 and less than or equal to 5 percent. – “ Modest ” means that the change or actual reading is greater than 5 and less than or equal to 10 percent. – “ Moderate ” means that the change or actual reading is greater than 10 and less than or equal to 20 percent. – “ Significant ” means that the change or actual reading is greater than 20 and less than or equal to 50 percent. – “ Major ” means that the change or actual reading is greater than or equal to 50 percent. A value above zero (i.e., positive) indicates that lending conditions are easing while a value below zero (i.e., negative) indicates that lending conditions are tightening. Federal Reserve , Senior Loan Officer Opinion Survey (SLOOS) Prev Previous Household Debt Delinquencies Rise as Mortgage Performance Weakens Next Existing Home Sales Fell to 16-Year Low Next Leave a Reply Cancel reply Your email address will not be published. Required fields are marked * Comment * Name * Email * Website Yes, add me to your mailing list Share this Page Subscribe to Blog Subscribe Search by Category Video Updates View Please leave this field empty Subscribe to Blog via Email Email Frequency * Instant Daily Weekly Check your inbox or spam folder to confirm your subscription. Construction Statistics Single-Family Multifamily Remodeling Labor Force Construction Wages Employment Data Job Openings Finance Builder Loans Consumer Finance Mortgages Home Sales and Prices Housing Affordability Housing Prices Housing Sales Macroeconomics Federal Reserve GDP Inflation Market Trends Housing Characteristics Housing Demand Industry Demographics Policy Research Building Materials Homeownership Tax Policy Local Data NAHB Indices Research Studies","published_at":1794495900000,"source_family":"nahb-eyeonhousing","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794519452247,"id":"87b123dca601e4ec","acquisition_window":{"lower":1794430800000,"upper":1794517200000},"score":14,"tags":["mixed-asset","national","data","rates","lender"],"heat_signals":[],"date_precision":"day","published_date":"2026-11-12","modified_at":0,"extraction":"body_fallback","canonical":"https://eyeonhousing.org/2026/11/significantly-weaker-demand-for-residential-mortgages-and-cre-loans-in-third-quarter","content_hash":"8799e5387510c1cf04f6579a921226dfc75625141b7aa83e22ff5c670fde6305","access":"public","evidence_status":"article","editor_evidence":[{"id":"title","text":"Significantly Weaker Demand for Residential Mortgages and CRE Loans in Third Quarter"},{"id":"body-1","text":"Significantly Weaker Demand for Residential Mortgages and CRE Loans in Third Quarter November 12, 2026 Eric Lynch No Comments Demand for all types of residential mortgages was significantly weaker, while lending standards for most were essentially unchanged &#8211; “ Remained basically unchanged ” means that the change or actual reading is greater than or equal to 0 and less than or equal to 5 percent."},{"id":"body-2","text":"&#8211; “ Modest ” means that the change or actual reading is greater than 5 and less than or equal to 10 percent."},{"id":"body-3","text":"&#8211; “ Moderate ” means that the change or actual reading is greater than 10 and less than or equal to 20 percent."},{"id":"body-4","text":"&#8211; “ Significant ” means that the change or actual reading is greater than 20 and less than or equal to 50 percent."},{"id":"body-5","text":"&#8211; “ Major ” means that the change or actual reading is greater than or equal to 50 percent.'> 1 in the third quarter of 2026, according to the recent release of the Senior Loan Officer Opinion Survey (SLOOS) ."},{"id":"body-6","text":"For commercial real estate (CRE) loans, lending standards for construction & development were moderately tighter, while multifamily loans were modestly tighter."},{"id":"body-7","text":"Compared to the previous quarter, demand for construction & dev"}],"keep":true,"importance":4,"section":"cre","capital_focus":false,"geo_evidence":null,"editorial_protocol":"evidence-refs-v1","primary_event":"market_research_policy","event_evidence_id":"body-5","event_evidence":"&#8211; “ Major ” means that the change or actual reading is greater than or equal to 50 percent.'> 1 in the third quarter of 2026, according to the recent release of the Senior Loan Officer Opinion Survey (SLOOS) .","market_evidence_id":"body-5","market_role":"market_policy","market_scope":"us","market_evidence":"&#8211; “ Major ” means that the change or actual reading is greater than or equal to 50 percent.'> 1 in the third quarter of 2026, according to the recent release of the Senior Loan Officer Opinion Survey (SLOOS) .","duplicate_of":null,"selector_reason":"NAHB对第三季度SLOOS的分析报告住宅按揭需求显著走弱；CRE开发贷款标准适度收紧，多户贷款标准小幅收紧，补充了已刊CRE贷款定价数据之外的信贷调查证据。","title_zh":"第三季度住宅及 CRE 贷款需求显著走弱","summary_zh":"NAHB 援引美联储调查称，第三季度各类住宅按揭需求显著减弱；CRE 建设开发贷款标准中度收紧，多户贷款标准温和收紧，相关需求亦显著走弱。","impact":"short-neg","evidence_quote":"Significantly Weaker Demand for Residential Mortgages and CRE Loans in Third Quarter November 12, 2026 Eric Lynch No Comments Demand for all types of residential mortgages was significantly weaker, while lending standards for most were essentially unchanged &#8211; “ Remained basically unchanged ” means that the change or actual reading is greater than or equal to 0 and less than or equal to 5 percent. &#8211; “ Modest ” means that the change or actual reading is greater than 5 and less than or equal to 10 percent.","evidence_basis":"body","cre_subcategory":"跨资产"},{"source_id":"redfin-news","source_name":"Redfin News","source_tier":"A","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"Just 3 Major U.S. Metros Are Seller’s Markets–the Fewest Since the Pandemic Freeze","link":"https://www.redfin.com/news/buyers-vs-sellers-october-2026/","description":"Just 3 Major U.S. Metros Are Seller’s Markets–the Fewest Since the Pandemic Freeze Published on November 12th, 2026 by Dana Anderson There are just 3 seller’s markets among the 50 most populous U.S. metros, and they’re all in the Northeast: Nassau County, NY, Newark, NJ and Montgomery County, PA. Nationwide, house hunters had more negotiating power in October than at any point since at least 2013, with 71% more home sellers than buyers. The number of buyers in the market fell to a new record low, while the number of sellers rose to its highest level since March 2020. 41 of the 50 most populous U.S. metro areas are buyer’s markets, led by Miami, Nashville and Las Vegas. Just three of the 50 most populous U.S. metro areas were seller’s markets in October. That’s tied for the fewest in records dating back to 2016, matching April 2020, when the pandemic froze the housing market. Nassau County, NY was the number-one seller’s market, with 24.7% fewer sellers than buyers. The other seller’s markets were Newark, NJ (-14.3%) and Montgomery County, PA (-12.1%). All three seller’s markets became less strong seller’s markets in October. In Nassau County, there were 28.3% fewer sellers than buyers in September, a bigger gap than October’s 24.7%. Newark’s gap shrunk from 17.6% to 14.3%, and Montgomery County’s shrunk from 20.1% to 12.1%. Milwaukee, which was a seller’s market in September, is now balanced, meaning it doesn’t favor sellers or buyers. The seller’s markets are places where limited homebuilding has kept housing supply tight. In the greater New York City area, combine that with strong demand for homes near a major job center, and buyers are competing for homes. Home-sale prices rose an average of 3.3% year over year across the three seller’s markets in October. That’s compared with a 0.3% uptick across all of the buyer’s markets, a sign that in seller’s markets, competition among buyers is pushing up home prices. “Buyers looking in these pockets of the Northeast should be prepared for a very different experience than buyers elsewhere in the country,” said Redfin Senior Economist Asad Khan . “They may have less room to negotiate, especially on desirable, move-in-ready homes, and could face multiple-offer situations. If you're shopping in one of these markets, it's especially important to know your budget, be ready to act when the right home comes along and avoid getting swept up in a bidding war.” Home Sellers Outnumber Buyers Nationwide By Widest Margin Since Post-Recession Financial Crisis For 6th Straight Month Seller’s markets are the exception to a national picture that heavily favors buyers. Nationwide, homebuyers have more negotiating power than at any point in Redfin’s records. There were an estimated 70.5% more home sellers than buyers in the U.S. housing market in October, the biggest gap in records dating back to 2013. That marks the sixth record-breaking month in a row, and the margin is up from 65.6% in September. The Sun Belt is driving the extreme buyer’s market nationwide, led by huge seller surpluses in Miami, Nashville, TN and Las Vegas. When sellers outnumber buyers, buyers typically have more negotiating power because they have options. That’s why a market with a lot more sellers than buyers is considered a buyer’s market. We define a market where there are over 10% more sellers than buyers as a buyer’s market and a market where there are over 10% fewer sellers than buyers as a seller’s market. A market where the gap is plus or minus 10% is considered a balanced market. We estimated the number of buyers using proprietary Redfin data on the typical time from a buyer’s first tour to close of purchase, and MLS data on active listings and pending sales. The estimated number of sellers in the market is simply the number of active listings in the MLS. These estimates are seasonally adjusted and subject to revision. See a more detailed methodology here and view an interactive dashboard here. It’s only a buyer’s market for people who can afford to buy. High housing costs and economic jitters have pushed many would-be homebuyers to back off in recent years, creating the imbalance between buyers and sellers we see today. “A buyer-friendly market can help make homeownership a little more attainable, even if it doesn't solve the affordability challenges that have kept many people on the sidelines,” Khan said. “Sellers are increasingly competing for buyers' attention, which can translate into price reductions, concessions and other savings. First-time buyers don’t have equity from a previous home to put toward a purchase, which makes saving for a down payment a big hurdle–but they also don’t have to sell a home before they can buy or give up a low mortgage rate. With a historic buyer’s market and home prices that are finally ticking down after three years of increases, first-time buyers who have been waiting–and can afford today’s costs–may have an opportunity to make a move.” Homebuyer Count Drops to New Record Low, Widening the Buyer-Seller Gap The gap between buyers and sellers widened in October because would-be buyers retreated, while sellers continued listing their homes, albeit at a sluggish pace. There were an estimated 895,752 homebuyers in the market nationwide in October, the lowest level in records dating back to 2013. That’s down 2% from a month earlier, the sixth straight monthly decline. Mortgage rates averaged 7.33% in October, up from 6.86% in September, which priced out more would-be buyers. On the flip side, there were an estimated 1,526,984 home sellers in the market, the most since March 2020. That’s up 0.9% month over month. The number of homes on the market is piling up because many homes are lingering on the market for months without going under contract. Each month, more new listings are adding to the big pool of supply. Some homeowners keep listing their houses despite falling demand because many have given up on waiting for lower rates. They may want to sel","published_at":1794486601000,"source_family":"redfin-news","is_research":true,"required_source":false,"mutable":false,"first_seen_at":1794519452247,"id":"143aab9b9c958bd3","acquisition_window":{"lower":1794430800000,"upper":1794517200000},"score":12,"tags":["housing","national","data","trend","brokerage"],"heat_signals":[],"date_precision":"timestamp","modified_at":0,"extraction":"semantic","canonical":"https://redfin.com/news/buyers-vs-sellers-october-2026","content_hash":"d95639be9b7e9bd7ff27463dea40f6b90f9dae4f89e690af50b32999a24a2c8e","access":"preview","evidence_status":"preview","editor_evidence":[{"id":"title","text":"Just 3 Major U.S. Metros Are Seller’s Markets–the Fewest Since the Pandemic Freeze"},{"id":"body-1","text":"Just 3 Major U.S."},{"id":"body-2","text":"Metros Are Seller’s Markets–the Fewest Since the Pandemic Freeze Published on November 12th, 2026 by Dana Anderson There are just 3 seller’s markets among the 50 most populous U.S."},{"id":"body-3","text":"metros, and they’re all in the Northeast: Nassau County, NY, Newark, NJ and Montgomery County, PA."},{"id":"body-4","text":"Nationwide, house hunters had more negotiating power in October than at any point since at least 2013, with 71% more home sellers than buyers."},{"id":"body-5","text":"The number of buyers in the market fell to a new record low, while the number of sellers rose to its highest level since March 2020."},{"id":"body-6","text":"41 of the 50 most populous U.S."},{"id":"body-7","text":"metro areas are buyer’s markets, led by Miami, Nashville and Las Vegas."},{"id":"body-8","text":"Just three of the 50 most populous U.S."},{"id":"body-9","text":"metro areas were seller’s markets in October."},{"id":"body-10","text":"That’s tied for the fewest in records dating back to 2016, matching April 2020, when the pandemic froze the housing market."},{"id":"body-11","text":"Nassau County, NY was the number-one seller’s market, with 24.7% fewer sellers than buyers."},{"id":"body-12","text":"The other seller’s markets were Newark, NJ (-14.3%) and Montgomery County, PA (-12.1%)."},{"id":"body-13","text":"All three seller’s markets became less strong seller’s markets in October."},{"id":"body-14","text":"In Nassau County, there were 28.3% fewer sellers than buy"}],"keep":true,"importance":4,"section":"national","capital_focus":false,"geo_evidence":null,"editorial_protocol":"evidence-refs-v1","primary_event":"market_research_policy","event_evidence_id":"body-4","event_evidence":"Nationwide, house hunters had more negotiating power in October than at any point since at least 2013, with 71% more home sellers than buyers.","market_evidence_id":"body-4","market_role":"market_policy","market_scope":"us","market_evidence":"Nationwide, house hunters had more negotiating power in October than at any point since at least 2013, with 71% more home sellers than buyers.","duplicate_of":null,"selector_reason":"Redfin全国供需分析显示10月卖家比买家多71%，50个最大都会区中仅3个为卖方市场，为2016年有记录以来并列最低。","title_zh":"仅 3 个主要都会区仍为卖方市场","summary_zh":"Redfin 称，10 月美国人口最多的 50 个都会区中仅 3 个为卖方市场，41 个为买方市场；全国卖家数量比买家多 71%，买方议价能力处于至少 2013 年以来高位。","impact":"short-neg","evidence_quote":"Just 3 Major U.S. Metros Are Seller’s Markets–the Fewest Since the Pandemic Freeze Published on November 12th, 2026 by Dana Anderson There are just 3 seller’s markets among the 50 most populous U.S. metros, and they’re all in the Northeast: Nassau County, NY, Newark, NJ and Montgomery County, PA. Nationwide, house hunters had more negotiating power in October than at any point since at least 2013, with 71% more home sellers than buyers.","evidence_basis":"body","cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Apartment Loans Fuel A Booming CRE CLO Market Not Seen Since 2021","link":"https://www.bisnow.com/news/national/capital-markets/apartment-loans-fuel-a-booming-cre-clo-market-not-seen-since-2021","description":"Demand for apartment bridge loans is pushing CRE collateralized loan obligation issuance to heights not seen since 2021. Investors bought up $40.2B worth of the debt in the first 10 months of the year, up 66% from last year by dollar volume, according to data from Trepp provided to Bisnow . But volatile debt markets have left some issuers waiting on the sidelines for now, which is likely to weigh on fourth-quarter issuance. “I think there's a number of issuers who could have come to market in Q4 but instead are acting a little slower and looking to bring their deals to market in January,” said David Henschke, managing director and head of capital markets at Benefit Street Partners , an alternative credit asset manager and CRE CLO issuer. Bisnow/created with Google Gemini Henschke forecasts a modest level of new CRE CLO issuance through the end of the year, and he suspects the total will fall short of the $45.4B record from 2021. Investors are struggling to divine the direction of interest rates and are waiting to deploy capital until after the Federal Reserve votes at its meeting in December, he said. “We'll see what the Fed does there, and then you'll have some of that uncertainty kind of behind you,” he said. It’s that same uncertainty that is driving up CRE CLO issuance in the first place. Underlying loans bundled into CRE CLOs are typically bridge or transitional debt with two- or three-year terms. The majority of CRE CLOs today are made up of loans being used to refinance existing mortgages, but the capital is also used by developers as a transitional loan for a newly completed project on its way to full occupancy and by buyers looking for short-term acquisition financing before securing a longer-dated mortgage. “What the CRE CLO market is designed to do is be a bridge facility, and that’s what it’s doing,” said Andy Boettcher, who leads research at Trepp. “It’s bridging new product that hit during a supply wave that didn’t hit its lease-up target, and it just needs time.” The CRE CLO market was built for these transitional market phases, where there’s a sudden glut of new development as the U.S. saw during the pandemic era, he said. The loans are typically floating-rate debt, which leads to higher borrowing costs when interest rates climb, and the debt has been the fastest-growing segment of the nonagency CMBS market this year, according to Morgan Stanley . https://public.flourish.studio/visualisation/30869666/visualisation.json?ref=embed-script Multifamily loans make up nearly three-quarters of all CRE CLO debt issued this year through October, and 57% of assets underwritten for CRE CLOs were built within the last five years, according to Trepp. The makeup is a shift away from the retail and office assets that were being pledged as collateral in the recent past, Morgan Stanley analysts wrote in a September research note. Office exposure made up as much as a quarter of CRE CLO collateral prior to 2020 but shrank to just 2% of issuance through this August, according to the investment bank. Some owners with maturing debt are looking at a landscape where the 10-year U.S. Treasury yield climbed above 5% before retreating and are opting to take the shorter-term CRE CLO debt as a way to effectively bet on lower debt costs within a few years. “The cost of equity, getting new equity in from somewhere else on one of these deals that has to be refinanced, is more expensive than three years of building the lease roll, stabilizing the occupancy, stabilizing the rent roll, and saying, ‘I now have a bigger value than I had going in,’” Boettcher said. But there are signs that the marketplace is itself being strained by the elevated rate environment. The CRE CLO distress rate jumped from 19% in July to 28% in August, the sharpest one-month move of any deal type this year, according to Cred iQ . Single-asset, single-borrower CMBS loans, by contrast, held flat near 22%. While climbing, the CRE CLO distress rate is concentrated in a handful of large deals, not widely dispersed. Five deals account for 38% of all of the CRE CLO special servicing balance. The distress traces to loans originated in 2021 and 2022 that now account for $3B worth of CRE CLO loans in special servicing, according to Cred iQ. Investors have shaken off the rising delinquency rates because they're concentrated in a handful of loans and because investment-grade bondholders in the segment have rarely seen real losses, Henschke said. The structure typically leaves sponsors holding the first-loss position, aligning issuers with investors, making it the most conservative structure in the CMBS market, he said. Owners opting for the shorter-term debt that comes with a CRE CLO are hoping that the interest rate environment will look better when the debt comes due in a few years. Many of the assets could refinance today with a traditional mortgage, but owners are instead taking a higher interest bill today for the prospect of greater savings in the years ahead. “You have assets that probably could go fixed-rate in today's market; they're not really bridging anything to change at the property. It's really a bridge for potentially market conditions to change,” Henschke said. Continue reading this story with a free account Log in or register Related Topics: 10-year US Treasury yield , Andy Boettcher , Benefit Street Partners , Bridge loans , CMBS , CMBS distress , CMBS Loans , Collateralized loan obligation , Collateralized loan obligations , CRE CLO , David Henschke , Trepp","published_at":1794513209000,"mutable":false,"date_precision":"timestamp","modified_at":1794513245000,"extraction":"semantic","canonical":"https://bisnow.com/news/national/capital-markets/apartment-loans-fuel-a-booming-cre-clo-market-not-seen-since-2021","content_hash":"637143372e938331bd9ad670388b40eaa8225addd35fa3c554b7117d8eced4dd","access":"public","evidence_status":"article","id":"dd0738b765d2c893","source_family":"bisnow","is_research":false,"required_source":false,"first_seen_at":1794519452247,"acquisition_window":{"lower":1794430800000,"upper":1794517200000},"score":22,"tags":["multifamily","national","deals","fundraising","institutional"],"heat_signals":["fed","forecast","occupancy"],"editor_evidence":[{"id":"title","text":"Apartment Loans Fuel A Booming CRE CLO Market Not Seen Since 2021"},{"id":"bod s developed the building , which opened in 2024. Maple Terrace Residences is part of a larger mixed-use development that is an adaptive reuse project of historic buildings along Maple Avenue.","evidence_basis":"body","cre_subcategory":null},{"source_id":"nrhc","source_name":"National Rental Home Council (NRHC)","source_tier":"E","source_weight":9,"source_tags":["btr-sfr","institutional"],"region":"national","title":"More Than Half of Raleigh-Area Residents Have Considered Moving Because of Housing Costs, New Survey Finds","link":"https://rentalhomecouncil.org/wp-content/uploads/2026/11/Final-Raleigh-Survey-Release-v2-2026.11.11-1.pdf","description":"       More Than Half of Raleigh-Area Residents Have Considered\n         Moving Because of Housing Costs, New Survey Finds\n       New survey finds widespread concern about affordability and support for\n         expanding single-family rental housing for Raleigh-area residents\nRALEIGH, N.C. – November 12, 2026 – More than half of Raleigh-area residents have considered\nmoving because of housing costs, including one in three who have considered leaving the state,\naccording to a new survey. Yet only one in five knew that Congress recently passed federal legislation,\nthe 21st Century ROAD to Housing Act, to address affordability concerns.\n\nThe survey also found support for expanding access to single-family housing, including newly built\nsingle-family rental homes. Among the key findings:\n\n   ●   Affordability pressures are widespread: 85% of Raleigh-area residents say housing\n       affordability is a serious problem, and 55% have considered moving because of housing costs,\n       including 33% who have considered moving to another state.\n   ●   Essential workers are feeling it: 67% of respondents say it is hard for teachers, nurses, police\n       officers and firefighters to afford to live in the communities where they work.\n   ●   Residents want housing choices, including access to single-family homes: 63% believe\n       people should have access to single-family homes whether they rent or own, compared to those\n       who believe they should only be available to people to own.\n   ●   More residents support new rental housing than oppose it: 49% support building more new\n       single-family rental homes, compared with 33% opposed.\n   ●   Renters are feeling affordability pressures: 67% have considered moving because of housing\n       costs, and 65% support building more new single-family rental homes.\n\n“Housing affordability challenges are affecting communities across the country, and these results\nunderscore the need for more housing options. No single housing type will solve today’s housing\nshortage. We need more opportunities for homeownership, more rental choices, and a continued focus\non expanding supply so families can find housing that meets their needs,” said Adrianne Todman,\nPresident and CEO of the National Rental Home Council.\n\nThe findings come as North Carolina policymakers continue to weigh housing affordability, following\nfederal action addressing large institutional purchases of existing single-family homes. The 21st Century\nROAD to Housing Act limits large institutional investors from purchasing existing single-family homes\nwhile protecting investments in preserving and building new housing, including build-to-rent homes.\n\nDespite widespread concern about housing affordability, relatively few Raleigh-area residents are aware\nof the recent federal action. For instance, only 20% of Raleigh-area residents surveyed knew Congress\nhad already acted to restrict large investment companies from purchasing existing single-family homes.\n\nAsked what state lawmakers should prioritize now that federal action is in place, residents pointed first to\nexpanding affordable housing programs (53%), assistance for first-time homebuyers (46%) and lower\n\fproperty taxes (46%). Fewer than one in three (30%) chose additional limits on how many homes large\ninvestment companies can own.\n\n“In Raleigh, rising housing costs are making it harder for families to afford a home in the communities\nwhere they live and work,” said Todman. “As North Carolina lawmakers look toward the 2027 session,\nthere’s an opportunity to keep working families from being priced out as the region grows.”\n\nAbout the survey\n\nThe survey of 600 Raleigh-area residents was conducted via Pollfish in October 2026.\n\f","published_at":1794505680000,"mutable":false,"date_precision":"day","published_date":"2026-11-12","canonical":"https://rentalhomecouncil.org/wp-content/uploads/2026/11/Final-Raleigh-Survey-Release-v2-2026.11.11-1.pdf","content_hash":"ca13b5ead2c64f8326d4a966419ed0c1ae2f1f14b00947280d82b7bb8450dda0","access":"public","evidence_status":"article","id":"a5bffc6978f96d58","source_family":"nrhc","is_research":false,"required_source":false,"first_seen_at":1794519452247,"acquisition_window":{"lower":1794430800000,"upper":1794517200000},"score":27,"tags":["btr-sfr","carolinas","data","policy","btr-operator"],"heat_signals":["build-to-rent","single-family rental","fed"],"editor_evidence":[{"id":"title","text":"More Than Half of Raleigh-Area Residents Have Considered Moving Because of Housing Costs, New Survey Finds"},{"id":"body-1","text":"       More Than Half of Raleigh-Area Residents Have Considered\n         Moving Because of Housing Costs, New Survey Finds\n       New survey finds widespread concern about affordability and support for\n         expanding single-family rental housing for Raleigh-area residents\nRALEIGH, N.C."},{"id":"body-2","text":"– November 12, 2026 – More than half of Raleigh-area residents have considered\nmoving because of housing costs, including one in three who have considered leaving the state,\naccording to a new survey."},{"id":"body-3","text":"Yet only one in five knew that Congress recently passed federal legislation,\nthe 21st Century ROAD to Housing Act, to address affordability concerns."},{"id":"b odel (AVM). While still above market value, homebuyers are only paying a 3.2 percent premium, compared to the 14.5 percent premium buyers are seeing on May 27, the highest of any day that occurs every year. (Full methodology is enclosed below.) Other days of the year offering lower premiums for homebuyers include: July 10 (3.5 percent premium above market value); July 9 (4.1 percent premium); July 3 (4.3 percent premium); July 2 (4.3 percent premium); and July 17 (4.6 percent premium). In total, nine of the ten lowest-premium days of the year fall in July. ATTOM’s latest analysis also looked at the best months to buy at the national level and best months to buy at the state level. Best Months to Buy Nationally, the best months to buy are July (6.3 percent premium above market value); November (7.4 percent premium); October (7.8 percent premium); September (8.2 percent premium); and December (8.2 percent premium). Best Months to Buy by State According to the study, Hawaii (-1.8 percent in January) and Michigan (-1.7 percent in November) are the only states where buyers saw a discount below full market value in their best month. Buyers in three other states paid close to market value at their best time of year: Connecticut (0.0 percent in January); Minnesota (0.0 percent in December); and Illinois (0.1 percent premium in November). Powering Real Estate Businesses with Property Data and Analytics Solutions For Every Industry Methodology For this analysis ATTOM looked at any calendar day in the last 10 years (2016 to 2025) with at least 10,000 single family home and condo sales. There were 362 days (including leap year data) that matched these criteria, with the four exceptions being Jan. 1, July 4, Nov. 11, and Dec. 25. To calculate the premium or discount paid on a given day, ATTOM compared the median sales price for homes with a purchase closing on that day with the median automated valuation model (AVM) for those same homes at the time of sale. The premium is the percentage by which the median sales price exceeds the median AVM. A negative figure is a discount. About ATTOM ATTOM delivers AI-driven property intelligence built on the nation's most trusted property data repository, covering 160+ million U.S. properties—99% of the population. Our engineered, multi-sourced, semantically rich real estate data spans property tax, deeds, mortgages, foreclosure, environmental risk, property conditions, natural hazards, neighborhood insights, and geospatial boundaries, rigorously validated for advanced analytics . ATTOM supports analytics, AI applications, and AI agents through flexible delivery options including APIs , bulk licensing , cloud delivery , and the MCP Server for AI-powered, agentic access to engineered property data, enabling organizations to automate analysis, power intelligent workflows, and scale property intelligence across industries. Media Contact: Megan Hunt megan.hunt@attomdata.com Data and Report Licensing: datareports@attomdata.com Access the Data Behind This Analysis Discover how businesses leverage ATTOM property data to uncover market trends, evaluate opportunities, and make more informed decisions. Complete the form below to connect with an ATTOM data expert. Tags related to this post AVM best day to buy best time to buy a home home sale prices median home prices median sales prices property AVM About The Author ATTOM Team ATTOM is your one-stop shop for premium property data with flexible delivery solutions. Our mission is to power real estate transparency and to fuel innovation across various industries with the most comprehensive property data. We’ve built a multi-sourced national data warehouse that blends property tax, deed, mortgage, foreclosure, environmental risk, natural hazard, and neighborhood data for more than 160 million U.S. residential and commercial properties, which covers 99 percent of the U.S. population. All posts by ATTOM Team","published_at":1794495638000,"date_precision":"timestamp","m 2/gamls-october-26/?utm_source=rss&utm_medium=rss&utm_campaign=gamls-october-26","description":"GAMLS: Home prices increase despite overall market slowdown by John Yellig November 12, 2026 Via Georgia MLS. The median sales price for an Atlanta-area home rose 1.3% year over year to $395,000 in October despite other market metrics showing signs of a cooling market, Georgia MLS said in its Housing Market Snapshot . Closed and pending sales, as well as new listings, all declined as active listings increased. “October's housing data tells us that buyers haven't necessarily left the market; they're simply taking longer to make a decision,\" GAMLS Chief Marketing Officer John Ryan said. \"We are seeing buyer caution translate into fewer closed transactions, all while home prices remain relatively stable. This is a market where value has replaced urgency, and consumer confidence will play an increasingly important role in determining when buyers are ready to move forward.\" The number of homes sold fell 19.5% year over year and 4.3% month over month to 3,735 residences, while pending sales, which indicate future closings, dropped 26.8% from 2025 and 6.4% from September to 3,332 for the 10th consecutive month of annual declines. New listings fell 8.8% annually and 4.3% monthly to 7,788 homes; active listings rose 1.4% from October 2025 and 1.2% from September to 21,919. \"Buyers have more choices and are taking the time to evaluate their options, which means sellers cannot rely on the urgency we saw in more competitive markets,\" Ryan said. \"Pricing a home appropriately from the outset, demonstrating its value and making sure it stands out are critical. Properties that are positioned realistically for current market conditions will be better positioned to attract buyer interest.\" Georgia MLS’ 12-county report includes Cherokee, Clayton, Cobb, Dekalb, Douglas, Fayette, Forsyth, Fulton, Gwinnett, Henry, Paulding and Rockdale counties. Read More Related to This Post Maryland ournalism. In this capacity, he oversees daily operations while also reporting on both local/regional markets and national trends, covering individual transactions across all property types, as well as delving into broader subject matter. He produces 11-15 daily news stories per day and works with the Connect team and clients to develop longer-form content, ranging from Q&As to thought-leadership pieces. Prior to joining Connect, Paul was Managing Editor for both Real Estate Forum and GlobeSt.com at American Lawyer Media, where he oversaw operations at both publications while also producing daily news and feature-length articles. His tenure in B2B publishing stretches back into the print era, and he has served as Editor in Chief on four national trade publications. Since 1999, Paul has volunteered as the newsletter editor of passenger rail advocacy groups (one national, one local). Order Reprints ◦ Sale/Acquisition |Sale/Acquisition California | Central Valley Industrial Dermody Adds Tracy Warehouse to West Region Industrial Portfolio Paul Bubny November 12, 2026 Load More","published_at":1794516558000,"source_family":"connect-cre","is_research":false,"required_source":false,"mutable":false,"first_seen_at":1794519452247,"id":"6340afefc6c5ce90","acquisition_window":{"lower":1794430800000,"upper":1794517200000},"score":13,"tags":["industrial","california","deals","institutional"],"heat_signals":[],"date_precision":"day","published_date":"2026-11-12","modified_at":1794516563000,"extraction":"semantic","canonical":"https://connectcre.com/stories/dermody-adds-tracy-warehouse-to-west-region-industrial-portfolio","content_hash":"28a234cc94dd9ba88af06c6448938a244af3e55997c41679843b703f04c21cd0","access":"preview","evidence_status":"preview","editor_evidence":[{"id":"title","text":"Dermody Adds Tracy Warehouse to West Region Industrial Portfolio"},{"id":"body-1","text":"California CRE News In Your Inbox."},{"id":"body-2","text":"Sign up for Connect emails to stay informed wi ve especially strong negotiating power; condo sellers outnumber buyers more than 2 to 1. For Redfin economists’ takes on the housing market, please visit Redfin’s “ From Our Economists ” page. Below is a summary of our most recent housing-market data. For more national and metro-level stats, please visit Redfin’s data center. U.S. highlights: Four weeks ending Nov. 8, 2026 Redfin’s national metrics include data from 900+ U.S. metro areas and are based on homes listed and/or sold during the period. Weekly housing-market data goes back through 2021. Subject to revision. Four weeks ending Nov. 8, 2026 Year-over-year change Week-over-week change (where applicable) Notes Median sale price $388,613 -0.9% Fourth week in a row of declines Median asking price (seasonally adjusted) $400,636 0.9% Median monthly mortgage payment (seasonally adjusted) $2,755 at a 7.18% mortgage rate 9% Lowest level in 6 weeks Pending sales (seasonally adjusted) 275,980 -15.54% -0.1% Lowest level in our records New listings (seasonally adjusted) 342,369 -4.7% -1.3% Active listings (seasonally adjusted) 1,501,320 3.3% Essentially unchanged Months of supply 4.7 Up from 4 4 to 5 months of supply is considered balanced Share of homes off market in two weeks 25.8% Down from 27.4% Median days on market 51 2 Share of home listings with price drops 21% Up from 20.5% Share of homes sold above list price 22.7% Down from 23% Average sale-to-list price ratio 98.2% Essentially unchanged Metro-level highlights: Four weeks ending Nov. 8, 2026 Redfin’s metro-level rankings data includes the 50 most populous U.S. metros. Select metros may be excluded from time to time to ensure data accuracy. Metros with biggest year-over-year increases Metros with biggest year-over-year decreases Notes Median sale price San Francisco (18%) New Brunswick, NJ (6.8%) Jacksonville, FL (6.4%) Pittsburgh (6.2%) Philadelphia (4.6%) Austin, TX (-9.3%) Fort Lauderdale, FL (-6.9%) Nashville, TN (-4.4%) Seattle (-4%) Charlotte, NC (-3.9%)
