ured Housing Action Plan to update development standards for the affordable housing. In compliance with the 21st Century ROAD to Housing Act, the agency’s action plan outlines HUD Code regulatory updates concerning efficiency standards, construction, installation and more. The new law’s removal of a permanent chassis requirement for manufactured homes is “particularly significant” for the future of factory-built housing and offers more flexibility, according to HUD. Dive Insight: Starter homes are becoming increasingly out of reach for aspiring homeowners as cities and counties seek affordable housing options amid dire shortages . Production of manufactured housing — a lower-cost housing option — has dwindled from its heyday in the 1970s and 1980s. The drop in production has been tied in part to HUD’s permanent chassis mandate for manufactured housing that dates to the 1970s and added as much as $10,000 to the cost of developing a new unit. ROAD, which became law in July, nixed that requirement. “Removing the permanent chassis requirement is more than a technical change. It creates an opportunity to reconsider how manufactured homes are designed , transported, assembled, and regulated, so we can increase supply for first-time homebuyers,” Joe Gormley, acting assistant secretary for the Federal Housing Administration, said in a news release. In compliance with ROAD, HUD’s seven-step action plan updates manufactured housing efficiency standards; revises standards and technical regulations for manufactured homes built without a permanent chassis; addresses installation requirements for chassis-free manufactured housing; and calls for studying manufactured housing without a permanent chassis to better understand “how off-chassis manufactured housing works in practice.” Removing the permanent chassis requirement also opens the door to innovation, the agency said. HUD will explore a range of housing types and designs under the new manufactured home regulations. HUD also plans to develop a federal performance-based construction and safety code for residential structures with five or more units to address issues existing manufactured housing standards don’t fully address, including fire separation, accessibility and stairs. “Extending the HUD Code to buildings with five or more units could create a national pathway for repeatable multifamily construction under a consistent federal regulatory framework,” HUD said. It is also developing an “on-ramp” to manufacturers with guidance and resources for the HUD regulatory system concerning factory certification, design approval, quality assurance and more. “The goal is to reduce barriers to entry and make it easier for factory-built product manufacturers to produce HUD-regulated homes,” the agency said. Recommended Reading Manufactured housing must be allowed in cities under new Texas law Smart Cities Dive For local governments, full benefits of ROAD to Housing Act could take years, analysis shows Smart Cities Dive Effort to streamline housing environmental review standards, regulations kicks off at HUD, USDA Smart Cities Dive Add us on Google Share Copy link Email LinkedIn X/Twitter Facebook Print License Filed Under: Development","published_at":1791558736000,"score":16,"tags":["housing","national","policy","regulator"],"heat_signals":["texas","fed"],"importance":4,"selector_reason":"HUD制造住房计划及相关住房法案调整可能扩大工厂化住房供给，并为多户住宅建设建立可复制路径。联邦层面的规则变化可能影响可负担住房开发，具重要政策意义。","section":"national","title_zh":"HUD 推动工厂住宅标准更新，扩大建造弹性","summary_zh":"HUD 计划更新能效、施工与安装规范；取消永久底盘要求，有望降低建造限制，细节待披露","impact":"long-pos","id":"84a4a2b0","fetched_at":1791595167582},{"source_id":"realtor-research","source_name":"Realtor.com Research","source_tier":"B","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"Mortgage Rates Jump For Seventh Straight Week to 7.40%; Highest Rate in 35 Months","link":"https://www.realtor.com/research/freddie-mac-mortgage-rates-october-8-2026/","description":"The Freddie Ma gs/","description":"New York City Mayor Zohran Mamdani is about to show what a voter-approved shift in zoning authority could mean for affordable housing development in 12 of the city&#8217;s neighborhoods. Voters who elected him also approved an alternative approval route that removes the City Council from a slate of affordable housing decisions. Starting Jan. 1, qualifying rezonings will follow a 90-day review ending with the City Planning Commission, without a Council vote, for the next five years. Across the country, state lawmakers have used zoning preemption to loosen local officials’ grip on housing development. New York City’s voter-approved change offers another approach to overcoming local barriers to housing production. Rarely, however, has preemption gone to a statewide vote of the people. In a statewide first, Massachusetts voters will decide whether to reduce minimum lot sizes to improve housing affordability. The 12 New York City neighborhoods rank among the lowest producers of affordable housing units across the city. Of those, four are at the bottom of the city’s 59 community districts, producing less than 10 affordable homes in five years. Other districts have created eight times as many as all 12, averaging 12 new affordable units per year over five years. “New York’s housing crisis is not going to be solved by asking the same neighborhoods to do all the building,” Mamdani said in a statement. Five Fast Track Districts are in Queens, three in Brooklyn, two in Manhattan and two on Staten Island. Mamdani ran and won on making the city’s housing more affordable. He has scored several wins since entering office with announcements of new developments. But his rent freeze, which took effect Oct. 1 drew a lawsuit from landlords that is ongoing. Changing dynamic Mamdani’s latest-in-a-series approach to affordable housing iterates on a housing reform pattern emerging under state housing laws: Developers gain an alternative approval route. Elected officials must choose to negotiate a project or lose their role in deciding it. Community boards and borough presidents will retain their advisory reviews. But the prospect of bypassing the Council changes negotiations with its members, even when developers pursue the conventional approval process. A “shadow effect” could play out in the Fast Track districts as it has in Florida and California after major housing reforms that cut into local zoning control. The threat of circumventing local planning authority to build what state law allows by right has accelerated approvals when developers first choose the traditional process. What&#8217;s more, the initial 12 districts may just be the start of a widening effort. It could launch an affordable housing arms race to avoid being at the bottom in five years when another round is announced. &#8220;There will be an incentive for districts at the edge of the 12 to propose more housing,&#8221; Nate Bliss, founder of Latent Urban Ventures , told HousingWire TBD . Bliss added that a couple of districts just missed the cutoff for being included in the round of 12. Working so far The new policy&#8217;s impact is already visible in at least one proposed development in New York City’s Bay Ridge district in Brooklyn. It&#8217;s one of the 12 in the Fast Track program. On Oct. 6, the Council’s zoning and land use committees approved New York developer BWH Group ’s Fort Hamilton Mews proposal. The negotiated plan calls for an 11-story building with 292 apartments, including 88 permanently affordable units. BWH originally applied to make the building 14 stories. City Council member Kayla Santosuosso approved the rezoning request because the developer could have skipped the process and reapplied in January under Mamdani’s new program. “They could have come back and built a larger building and made no concessions to the community and had it expedited,” Santosuosso told The Real Deal . “Or we could secure some community wins here, and so that’s what we worked hard to","published_at":1791566558000,"score":13,"tags":["housing","nyc","policy","regulator"],"heat_signals":[],"importance":4,"selector_reason":"纽约市将把12个地区部分可负担住房项目的审批权从市议会转向替代审查路径，可能改变开发审批速度和权力结构。该政策影响具体且覆盖多个街区，属于重要地方监管变化。","section":"national","title_zh":"纽约市12区分区审批改走快速通道","summary_zh":"符合条件的改划自2027年起由市规划委员会90天审议、无需市议会表决，试行五年，或加快可负担住房建设","impact":"long-pos","id":"0d0f10e9","fetched_at":1791595167582},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Ashton Woods leans into discipline as orders and margins slide","link":"https://www.housingwire.com/articles/ashton-woods-q1-2027-earnings/","description":"Most homebuilders today face a tough tradeoff between keeping sales moving and accepting tighter margins, or protecting profitability and giving up market share. Ashton Woods , one of the largest private homebuilders and the 14th-largest builder in the HousingWire Homebuilder Rankings , is among them. During a Q1 2027 earnings call with analysts on Thursday, Ashton Woods executives indicated that they would rather sell more slowly than buy volume at any cost. However, they also acknowledged that margins will likely tighten further in the near term as the market seeks its bottom. Management described market conditions that had, if anything, worsened over the summer, pointing to many of the same headwinds cited by executives at KB Home and Lennar in recent earnings calls . Affordability remains a key concern, buyers are increasingly hesitant and competition from the resale market continues to heighten. Many land sellers have also remained unwilling to negotiate prices to reflect current market conditions, so getting land deals done is getting tougher. Last quarter’s earnings results show the strain. Net new orders fell, average sales prices slipped, cancellations rose and gross profit margins continued to slip. Prospects still want to buy, and underlying demand hasn’t gone away. The hard part is getting them to convert, which takes expensive incentives. Builders are essentially paying for sales, leaving the likes of Ashton Woods weighing how to balance volume, price and margins. Selling to an increasingly hesitant buyer Balogh described a buyer pool that still wants to purchase, but increasingly struggles to qualify. “What we are seeing in our communities is a buyer who still wants to own a home and is still out shopping, but is finding it harder to qualify for a mortgage,” he said on the call. Buyers are still coming into model homes and sales offices, but higher mortgage rates and inflated living costs mean buyers need more help reaching an affordable monthly payment. Like other builders, Ashton Woods has had to lean on incentives to close that affordability gap. Balogh conceded that traffic has pulled back and buyers are noticeably more hesitant than they once were. And while there may be pent-up demand in the market, elevated mortgage rates remain a key barrier preventing that demand from translating into sales. “I think the buyers and the prospects we are seeing have the same intent to buy. It&#8217;s just I think the urgency is harder to get when rates are going up,” he added. Given this trend, Ashton Woods’ overall cancellation rate increased from 22.4% a year ago to 24.9% last quarter. Management attributed that increase to the affordability environment, particularly among entry-level buyers. However, the entry-level and affordable segment continues to anchor a significant portion of the builder’s business. Starlight Homes , Ashton Woods’ affordable brand, accounted for 57% of total orders last quarter, with an average sales price of $291,000, compared with 58% a year earlier. Resale competition has reared up as another headwind, particularly in Sun Belt markets like Texas and Florida, Balogh said. “Resale sellers are cutting prices, and that puts them in direct competition for our buyers, in a itutional"],"region":"national","title":"PE Ownership of Single-Family Rentals: The Legislative Landscape (Part 1) &#8211; National Law Review","link":"https://natlawreview.com/article/pe-ownership-single-family-rentals-legislative-landscape-part-1","description":"HB Ad Slot HB Mobile Ad Slot Brian Boland Email (401) 453-1200 Bio and Articles Find Your Next Job ! Paralegal - Washington, Dist. Columbia Commercial Litigation Attorney Senior Attorney - Arizona or New Mexico Explore More Job Openings HB Ad Slot PE Ownership of Single-Family Rentals: The Legislative Landscape (Part 1) by: Brian Boland , Darrow Everett LLP Monday, October 5, 2026 Related Practices Jurisdictions Real Estate Mergers Acquisitions Communications Media Internet Administrative Regulatory All Federal Print Mail Download />i Editor’s note: This is Part 1 of a two-part series on PE ownership of single-family rentals. Part 2 covers enforcement under existing law and the tax and structuring risks the return model may miss. Legislators in statehouses across the country have spent the last several sessions introducing bills to cap how many single-family homes an investment entity may own. Few have become law. Regulators and private plaintiffs have also secured substantial settlements from the sector’s largest operators over pricing, fee disclosures, and security-deposit practices. The key point for sponsors is the gap between political attention and where money is actually leaving the business. The sector’s origins still shape its regulation. After 2008, investors bought distressed homes in bulk. The business has since become an institutional asset class, with dedicated funds, purpose-built management platforms, securitized debt, and build-to-rent pipelines. State legislatures and campaigns now use it as shorthand for the broader U.S. housing-affordability crisis. This DE Insight is for sponsors and their counsel. It explains where the law is moving, which exposures already create liability, and how to respond. The short version: monitor ownership-cap bills, but existing consumer-protection, antitrust, and fair-housing laws pose the more immediate risk to platform-scale operations. The Investment Case for Institutional Single-Family Rentals The investment thesis is straightforward. For more than a decade, the number of new households looking for a place to live has grown faster than new single-family construction. Entitlement delays, scarce lots, labor constraints, and material costs have kept new supply below trend. More households want detached homes with more space and better schools but cannot or do not want to buy. Higher mortgage rates and down-payment requirements have pushed monthly ownership costs above monthly rent in many markets. Institutional capital brought scale to a fragmented ownership base. It centralized maintenance, standardized leasing, funded deferred repairs, and, through build-to-rent, financed construction that a fragmented buyer pool might not support. Those investments add housing and can improve housing quality. Sponsors should be ready to document that value. Scale, Concentration, and the Data Problem The national numbers are smaller than the rhetoric suggests. Institutional investors own only a small share of the country’s single-family rentals. Individuals and small landlords still own most rental homes. But measuring institutional ownership is hard: homes sit behind layers of entities, and public records rarely show the ultimate owner. The national figure misses what legislators see on the ground. Institutional buying has focused on a limited number of high-growth Sun Belt metros and, within those markets, on particular neighborhoods and price ranges. Reported purchase shares in those areas were well above the national average and higher still in some neighborhoods. Local buyers, brokers, and officials see that concentration; they do not see the national percentage. Sponsors should expect opponents to cite the numbers against them and should source the data themselves rather than rely on figures from a hearing. Researchers still disagree about causation. Some studies find only modest local price effects from institutional buying and identify limited supply, demographic demand, and mortgage ","published_at":1791565135000,"score":31,"tags":["btr-sfr","institutional","texas","sun-belt","macro","rates","policy","deals","trend","landlord"],"heat_signals":["build-to-rent","single-family rental","sun belt","fed","mortgage rate","trend"],"importance":3,"_from_fallback":true,"section":"btr","title_zh":"SFR 私募持有面临立法与执法双重审视","summary_zh":"多州提案限制投资机构持有独栋出租屋，相关法律尚少落地；定价、费用与押金执法已带来和解成本","impact":"short-neg","id":"38f87a23","fetched_at":1791595167582},{"source_id":"nrhc","source_name":"National Rental Home Council (NRHC)","source_tier":"E","source_weight":9,"source_tags":["btr-sfr","institutional"],"region":"national","title":"The ROAD to Housing Act: The latest milestone in the history of American public housing &#8211; HousingWire","link":"https://www.housingwire.com/articles/rad-program-road-act/","description":"","published_at":1791565162000,"score":13,"tags":["btr-sfr","institutional"],"heat_signals":[],"importance":3,"_from_fallback":true,"section":"btr","title_zh":"ROAD to Housing Act 成为公共住房政策新节点","summary_zh":"报道聚焦美国公共住房立法沿革；正文未提供法案条款或市场数据，影响待观察","impact":"neutral","id":"9f302614","fetched_at":1791595167582},{"source_id":"nrhc","source_name":"National Rental Home Council (NRHC)","source_tier":"E","source_weight":9,"source_tags":["btr-sfr","institutional"],"region":"national","title":"Young voters struggle to afford housing. But they don’t expect help from political candidates. &#8211; CNBC","link":"https://www.cnbc.com/2026/10/06/housing-affordability-election.html","description":"","published_at":1791565081000,"score":13,"tags":["btr-sfr","institutional"],"heat_signals":[],"importance":3,"_from_fallback":true,"section":"btr","title_zh":"年轻选民住房难负担，对候选人援助不抱期待","summary_zh":"年轻群体买房与租房负担沉重，但普遍不期待政治候选人 aw-firms-drive-boston-office-rents-to-record-highs","description":"Law Firms Drive Boston Office Rents To Record Highs October 9, 2026 | 5:27 pm ET Taylor Driscoll, Boston Office rents at the highest-quality assets in the city are beginning to spike while the rest of the market lags behind. And there is one group to thank. Google Maps MP Boston&#039;s Winthrop Center at 115 Federal St. Rents for trophy office space hit a two-year high across Greater Boston, according to JLL third-quarter data. The rates are being bolstered by law firms, which remain among the most active tenants in the market. These groups are willing to pay a premium for trophy space and often fill the nicest, newest buildings. With no construction expected in the near term, existing luxury space has a long runway of rent growth. Top-tier average rents for high-rise buildings stood at $105.02 per SF in the third quarter, according to JLL, while average asking rents across the market decreased to $66.49 per SF. &#34;People are paying more for commercial real estate now than they ever have before at the top of the market,&#34; JLL Research Manager Bryan Montgomery said. &#34;That&#039;s only going to continue and intensify.&#34; The highest asking rents are coming out of the Back Bay submarket at close to $130 per SF, 15% higher than they were pre-pandemic, Montgomery said. Back Bay achieved its previous highest lease rate in Q3 2025 at $121 per SF for space on the 31st floor or higher. Downtown Boston has the second-highest rents and hit its high-water mark of $110 per SF in the second quarter of 2026, according to JLL. Among the top deals last quarter, 10 law firms inked leases, with many relocating within the central business district. Greenberg Traurig took the top spot, signing an 82K SF lease at Hines&#039; South Station Tower , relocating from Chiofaro Co .&#039;s One International Place. Paul Hastings signed a 52K SF lease at BXP &#039;s Prudential Center , moving from the office REIT&#039;s
