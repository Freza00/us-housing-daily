source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"North Carolina kicks parking rules to the curb in statewide reform","link":"https://www.housingwire.com/articles/north-carolina-parking-reform-law/","description":"North Carolina housing advocates have tried for years to pass state-level zoning reform. They kept falling short. Broad reforms met the same fate in the recently ended session – except one: parking reform. What started as a stormwater management bill became one of the most aggressive parking reforms in the country. It passed with rare bipartisan force. A diverse coalition backed it, ranging from the Sierra Club to Americans for Prosperity to small farmers. How it passed could serve as a model for coalition building. Gov. Josh Stein signed the bill Monday. It eliminates most off-street parking requirements statewide for commercial and residential development, effective Jan. 1. The law follows a path other states and cities have increasingly taken to make new housing more affordable. California led the way , and other states and cities have followed . The Parking Lot Reform and Modernization Act builds on what several North Carolina cities have already implemented. It bars local governments from requiring developers to build a minimum number of parking spaces, whether for commercial or residential projects. It also lets local governments offer incentives, including tax breaks, to developers who add stormwater controls. Coastal counties are exempt, a late addition addressing concerns about vacation-rental parking. &#8220;This is a huge economic driver in addition to driving down the cost for surface park spaces for a home, which averages $5,000 to $10,000 per space, and a parking deck space that would be anywhere from $25,000 to $65,000,&#8221; State Rep. Donnie Loftis, a lead bill sponsor, said during a June 30 floor speech. In a surge of bipartisan spirit, lawmakers also passed a full budget for the first time in more than 1,000 days. Years in the making House Bill 162 was built on a predecessor, House Bill 369, which passed the House unanimously in June 2025. That version stalled in the Senate. Lawmakers revived it this year, adding the coastal exemption to secure broader support. North Carolina cities set the precedent for this reform. Raleigh eliminated its own parking minimums in March 2022, and Durham and Gastonia followed. Charlotte still enforces mandates, making it an outlier under the new law. The House voted 111-2 on June 30 to concur with Senate changes, sending the bill to Stein&#8217;s desk. The Senate had approved it 44-1 a week earlier. An unusual coalition The bill drew support from a &#8220;strange bedfellows&#8221; mix of environmentalists, developers and housing advocates. Loftis said during his floor speech that the coalition included more than 130 groups, rattling off a list that spanned Realtors, developers, the apartment association, small business groups, &#8220;tree huggers&#8221; and &#8220;dirt pushers.&#8221; Local governments have historically fought state preemption, but Loftis said they backed this bill, too. &#8220;We had the spectrum from the far left to the far right and anything in between to get this bill across the finish line,&#8221; Ryan Carter, policy director for conservation group Catawba Riverkeeper and lead on the bill, told HousingWire TBD . &#8220;The broader coalition sealed the deal.&#8221; His group spearheaded the effort because reducing pavement can also cut stormwater runoff and flooding. &#8220;The worst thing you can do for the environment is build a parking lot,&#8221; Carter said. Part of a larger push A broader Democratic housing package introduced this spring sought to cap corporate ownership of single-family homes at 25 properties and allow residential construction in all commercially zoned areas. House Bill 1056 stalled in the House Appropriations Committee after its April 28 referral. It carried 29 Democratic sponsors and no Republican support. Lawmakers split off the parking provision, a strategy that ultimately succeeded. Supporters say the parking law could ease affordability pressure by lowering construction costs. Critics note it doesn&#8217;t mandate new housing","published_at":1783455223000,"score":13,"tags":["housing","carolinas","policy","regulator"],"heat_signals":[],"importance":4,"selector_reason":"North Carolina 通过激进停车改革，是州级住房供给和土地使用监管的重要变化。该政策可能影响 Sun Belt 住宅开发成本和密度，因此评为 imp=4。","section":"sunbelt","title_zh":"North Carolina 全州取消多数停车最低要求","summary_zh":"新法明年1月生效，每车位可省$5K-$10K，降低住宅与商业开发成本","impact":"long-pos","id":"c890fe01","fetched_at":1783478707255},{"source_id":"realtor-news","source_name":"Realtor.com News","source_tier":"A","source_weight":6,"source_tags":["housing"],"region":"national","title":"This Sun Belt State Has Some of the Top Markets for Renters—Here’s Why","link":"https://www.realtor.com/news/trends/best-markets-renters-apartments-arizona-wallethub-2026/","description":"Trends Make us preferred on Google This Sun Belt State Has Some of the Top Markets for Renters—Here’s Why By Kiri Blakeley July 7, 2026 Kevin Ruck / Adobe Stock One Sun Belt state is an unexpected renter's paradise , according to a new study that compared 180 rental markets in the U.S. The top three rental markets in the nation in 2026 are all in Arizona , according to a new analysis from personal finance site WalletHub . The report's 10 best places for renters, in order, are Scottsdale, AZ ; Gilbert, AZ ; Chandler, AZ ; Overland Park, KS ; Columbia, MD ; Peoria, AZ ; Bismarck, ND ; Huntsville, AL ; Sioux Falls, SD ; and Amarillo, TX . \"In the best cities for renters, rent can cost you as little as around 15% of your income,\" writer and analyst Chip Lupo notes in the report. \"You'll also have access to robust laws that protect renters, such as limiting deposits to only a month or two of rent.\" To calculate a total score, WalletHub considered 21 key measures of rental attractiveness and quality of life, then graded them on a 100-point scale, with a score of 100 representing the most favorable conditions for renters. The study took into consideration legal protections for rental tenants, as well as quality of life factors such as a city's traffic congestion, job market, and recreation options. Arizona: Renter's paradise Arizona earned high marks not only in the rental market and affordability category with metrics such as a low rent-to-price ratio, but in the quality of life category as well. This category took into consideration high marks on Sharecare Community Well-Being Index Score, which measures residents' happiness levels; a robust job market; good weather; and quality public schools. But one metric is unique to renters: how much legal protection they have. For instance, when it comes to a renter's worst nightmare, bedbugs are right up there with loud neighbors. WalletHub's ranking takes into account states with bedbug laws that protect a tenant. \"The landlord shall not enter into any lease agreement with a tenant for a dwelling unit that the landlord knows to have a current bedbug infestation,\" states the Arizona state Legislature's bedbug law . Believe it or not, only 21 states have any kind of regulations regarding the creepy crawlies, according to the Environmental Protection Agency . Scottsdale: Best city for renters In No. 1-ranked Scottsdale, affordability is key. Most people spend under 22% of their annual income on rent, and yet, the city has one of the largest average home square footages in the country at 2,179 square feet. The next two spots on the list are taken by the adjacent suburbs of Gilbert and Chandler. \"With enormous population growth in the Gilbert area over the last few years, a lack of sales inventory, and increased building costs, many are choosing to rent at this time,\" Scottsdale-based Retsy real estate brokerage agent Heather Steck tells Realtor.com® . She notes that many multifamily buildings have recently been built in the metro, creating a lot of options for renters. \"We understand the draw to the area,\" she says, pointing to the proximity to mountains for snow activities and Southern California for the beach. \"The summer is definitely warm, but we have eight months of wonderful weather and 2.5 months of pretty hot. It's very temperate most of the year.\" A metric that was double-weighted in the study's quality of life category was violent- and property-crime rates. Gilbert has the third-lowest crime rate of all the 180 rental markets. Steck, who lives in the city, agrees that it's a safe community. \"It feels kind of like how it was 20 or 30 years ago, when I was growing up,\" she says. \"Neighbors look out for each other. If you leave your garage door open, you'll get a call.\" Loading... Scottsdale, AZ, and desert terrain viewed from Pinnacle Peak Trail. Pinnacle Peak Park is a 150-acre desert park near Phoenix known for its prominent granite summit and scenic hiking trails. Getty Images Addit","published_at":1783448337000,"score":23,"tags":["multifamily","phoenix","trend"],"heat_signals":["sun belt","trend","trends","annual","rental market"],"importance":3,"selector_reason":"报道聚焦 Arizona 等 Sun Belt 租赁市场的相对优势，有助于覆盖区域住宅和租赁趋势。其依据为租赁市场排名研究，影响偏区域和常规，因此评为 imp=3。","section":"sunbelt","title_zh":"Arizona 多城跻身全美租客最佳市场","summary_zh":"Scottsdale、Gilbert、Chandler 排前三，租金负担低利好租客但压制rent growth","impact":"short-neg","id":"acb914b1","fetched_at":1783478707255},{"source_id":"rebusiness-online","source_name":"REBusiness Online","source_tier":"A","source_weight":6,"source_tags":["mixed-asset","deals"],"region":"national","title":"IPA Arranges Sale of 250-Unit Alta Firewheel Apartments in Garland, Texas","link":"https://rebusinessonline.com/ipa-arranges-sale-of-250-unit-alta-firewheel-apartments-in-garland-texas/","description":"GARLAND, TEXAS — Institutional Property Advisors (IPA), a division of Marcus &#38; Millichap, has arranged the sale of Alta Firewheel, _id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Prince William County Board Rejects Plan For 1,940-Acre Data Center Hub","link":"https://www.bisnow.com/washington-dc/news/data-center/prince-william-county-board-rejects-plan-for-1940-acre-data-center-hub-135319","description":"News Prince William County Board Rejects Plan For 1,940-Acre Data Center Hub Data Center General View count: Washington, D.C. Data Center July 07, 2026 | 8:52 p.m. ET Alexis Kramer, East Coast Editor Prince William County has stopped a new massive data center plan from taking shape, just days after Blackstone’s QTS abandoned its Digital Gateway project in the same area. Bisnow/created with ChatGPT In a unanimous vote, the county’s board of supervisors on Tuesday declined to initiate a comprehensive plan amendment for a proposed project dubbed Dulles South Innovation Center. That amendment would have changed the land use designation of a 1,940-acre site in Gainesville to make way for up to 42M SF of data center space, according to the Prince William Times . The CPA initiation would have been an early step of the process and not a final approval. “People talk about one way or another how this open space of land, just like the plains, is going to be developed one way or another. It's either going to be data centers or high-density housing,” Gainesville District Supervisor George Stewart said before the vote. “How it is right now, according to this comprehensive plan, is how it needs to be and how it needs to remain,” he said. The vote came after an hourslong public debate with more than 90 residents arguing on both sides of the issue. Those opposed to the project cited concerns about water and air pollution, higher electric bills and noise disruptions. Homeowners in support of the project argued that traffic growth has transformed their rural area and that data centers are needed for the county’s technological and financial needs. They also urged opponents to let the CPA process unfold so the county can study potential impacts of a new development. Earlier in the meeting, the board voted against a request to defer consideration of the proposal. The decision marks another win for advocacy groups and others who have opposed data center construction in Virginia’s second-most populous county. But it dealt a blow to the more than 200 homeowners who had teamed up and agreed to sell their properties to data center firms for the Dulles South project, according to PWT. Sanders Lane Assemblage I LLC, representing those homeowners, submitted the proposed amendment to change the site’s land use designation from agriculture, forestry and mixed-use to industrial. But county staff last week urged the board of supervisors to reject the project, citing concerns about the environment, a lack of adequate infrastructure and how it would impact the area’s rural character. The proposed project would have been in the Gainesville Magisterial district, adjacent to Loudoun County’s boundary line to the north and Fairfax County’s boundary to the east, according to a meeting document. Last week, Blackstone ’s QTS dropped its legal fight to pursue a separate project in Prince William County that could have become one of the world’s largest data center clusters. That project, PW Digital Gateway , would have spanned 2,100 acres and comprised 22M SF of data center space . The county had approved the rezoning effort for Digital Gateway, but it was knocked down in the courts. QTS on July 2 withdrew its appeal to the Virginia Supreme Court. The Dulles South proposal “leaned on the fact that Digital Gateway still exists,” Occoquan District Supervisor Kenny Boddye said before the vote. “It does not. As of a couple days ago, it is dead,” he said. “We owe this community time to pause, exhale, and work together with their supervisor to shape this area's future holistically.” Contact Alexis Kramer at alexis.
