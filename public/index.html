cy's workforce. The appeals court sent the case back to U.S. District Judge Amy Berman Jackson, who will decide whether to modify the injunction and allow the CFPB to issue reductions in force, or RIF notices, to employees represented by the NTEU. The court rejected a request from the Department of Justice, representing Vought, to continue RIFs. The court also did not impose a deadline on the district court that was requested by the DOJ. In a statement issued Saturday, Sen. Elizabeth Warren, D-Mass., the ranking member of the Senate Banking Committee, praised the appellate court order. \"Last night the D.C. Circuit rejected the Trump Administration's latest request to shut down the Consumer Financial Protection Bureau, refusing to lift the injunction that has prevented Russ Vought from carrying out his plan to eliminate the agency,\" said Warren, who created the agency. \"Courts will also have a full chance to review Vought's most recent unlawful plan to sideline the CFPB by firing most of its remaining staff.\" The fight between Vought and the NTEU is being closely watched as a test by the executive branch that claims the president can shut down an agency created by Congress. In December, the D.C. Circuit granted a rare en banc review — a sign of the case's importance — after the union appealed to the district court claiming the president is limited by both law and Supreme Court precedent from conducting mass firings to reshape the federal government. One aspect of the case that Judge Jackson will take into account is the agency's budget, which Congress slashed in half last year. Vought has claimed that the CFPB must cut staff because the budget supports fewer employees. Under his watch the CFPB no longer conducts any supervision or examinations of nonbanks , and has radically cut enforcement of the largest banks. Litigation CFPB shutdown battle reaches crucial D.C. Circuit hearing February 23, 2026 12:49 PM By Kate Berry Vought, who is also the Trump administratio 26. Weekly pending sales Our pending home sales data provides a week-to-week perspective, though results can be affected by holidays and short-term fluctuations. Our weekly pending sales data typically takes 30-60 days to be reflected in the sales data. For the second half of the year, I will be looking to see if we can get positive year-over-year growth in pending sales regardless of where mortgage rates go. In the past, rates above 6.64% — which typically took us over 7% — have led to sales slowing down. Housing has held up well, mostly because we haven&#8217;t broken above 7% rates this year. My forecast for 2026 was 237,000 more existing home sales than 2025 if rates can just stay under 6.25%. This is what I will be tracking the rest of this year given that mortgage rates started to fall toward the end of 2025, and we had a nine-month high in existing home sales in December. So, the year-over-year comps for the existing home sales report will be harder to grow starting in July. Here are the pending sales for last week over the last two years: 2026: 75,489 2025: 70,352 Mortgage purchase application data Purchase application data is a forward-looking indicator: growth here leads home sales by roughly 30-90 days. Last week we saw a decline of 3% week to week, but the data was still positive year over year by 5%. We should still have positive growth this year as mortgage rates aren’t above 7%. But, with rates near yearly highs, I want to see if we can hit my growth forecast, even with elevated rates from where we were earlier in the year. In 2025, we saw better monthly existing home sales reports in the fall and winter due to lower rates. Here are the stats on purchase apps so far in 2026: 10 positive week-to-week prints 11 negative week-to-week prints 2 flat week-to-week prints 10 weeks of double-digit year-over-year growth 21 weeks of positive year-over-year growth 2 negative year-over-year prints Housing inventory In 2025, housing inventory growth was really good, with inventory growing 33% year over year at one point. Then we hit mid-June 2025 and I noted that the housing market was about to shift, which it did. Not only has inventory growth been slower in 2026 year over year, three out of the last four weeks were negative year over year, and this week inventory only grew 0.247%. For the rest of 2026, it won&#8217;t be hard for the year-over-year comps to show growth, so my focus will be on how the inventory data looks with rates at these levels. Right now it looks like a flattish trend — between down 2%, flat or up 2%. So, the key will be what inventory does now when rates are below 6.75%. Weekly inventory change: (June 12-June 19): Inventory rose from 816,924 to 830,939 Same week last year: (June 13-June 20): Inventory rose from 825,718 to 828,890 New listings Seasonality in the new listings data is here; we are starting the traditional decline and it&#8217;s been another year of not getting back to normal. Traditionally, we would see 80,000-100,000 new listings during the seasonal peak weeks, but we&#8217;ve only cracked above 80,000 four times this year and never in back-to-back weeks, as I was hoping. Some context for those who believe that the new listings data resembles the housing bubble years: new listings during that time ranged from 250,000 to 400,000 per week for several years. Several years! For the rest of the year, keep an eye out for any kind of d","published_at":1782007228000,"score":37,"tags":["housing","national","trend","data"],"heat_signals":["mortgage rate","existing home sales","pending home sales","forecast","trend","year over year","year-over-year","housing market","pending home sales"],"importance":3,"selector_reason":"文章梳理2026年下半年住房市场关键观察点，覆盖利率、需求和市场韧性。偏展望分析而非硬数据或政策事件，评为 imp=3。","section":"national","title_zh":"2026 下半年住房看 pending sales 与 rates","summary_zh":"若 mortgage rate 低于 6.25%，全年 existing sales 或多 237K","impact":"neutral","id":"392091bf","fetched_at":1782091484893},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Home flipping slowed in early 2026 but investors saw returns tick up","link":"https://www.housingwire.com/articles/attom-q1-2026-home-flipping/","description":"ATTOM data shows that home flipping activity declined in early 2026 even as investor profits edged higher, signaling a modest rebound in returns after a prolonged downturn. A total of 64,348 single-family homes and condominiums were flipped in the first quarter of 2026, representing 8% of all home sales from January through March, according to ATTOM ’s Q1 2026 U.S. Home Flipping Report, released Thursday. That share rose from 7.2% in the prior quarter but was down from 8.2% during the same period last year. The number of flips also fell from 69,711 in Q4 2025 and 70,579 in Q1 2025. Profitability improved slightly, with typical gross returns rising to 25.4%, up from 24.7% in the fourth quarter, which marked the first quarterly gain in nearly two years. Even so, margins remained below year-ago levels, when flipped homes generated a typical return of 29.6%. Gross profits increased to $66,000, up from $64,300 in the prior quarter, but they also trailed the $74,172 figure recorded in the first quarter of 2025. “The first increase in flipping returns in nearly two years is a welcome sign for investors,” ATTOM CEO Rob Barber said in a statement. “The market remains far more competitive than it was during the peak profit years, but this quarter’s gains suggest that conditions may be stabilizing.” Flipping activity rose on a quarterly basis in 77% of the 174 metro areas analyzed, although it declined year over year in 56.3% of markets. The highest flipping rates were in Columbus, Georgia; Atlanta ; Canton, Ohio; York, Pennsylvania; and Spartanburg, South Carolina. Among large metros, Dallas ; Kansas City; and Memphis, Tennessee, posted some of the highest flipping rates, while Seattle ; Tulsa, Oklahoma; and Honolulu had some of the lowest. Cash purchases accounted for 61.1% of flipped homes, down slightly from the prior quarter but higher than a year earlier. Flips took a median of 165 days to complete, up modestly from both prior periods. Buyers who utilized Federal Housing Administration ( FHA ) financing made up 10.2% of flipped-home purchases, down from a year earlier. Margins varied widely by price tier, with homes purchased between $100,000 and $200,000 producing the strongest typical returns at 32%, while properties bought for less than $50,000 posted a 14% loss. Industry participants cautioned that rising gross margins do not necessarily translate into stronger net returns. Sean Faries, CEO of Land Gorilla , said the headline figures mask meaningful cost pressures. &#8220;I&#8217;d be cautious reading this as flippers suddenly making more money,&#8221; he said in a statement. &#8220;What the data really shows is a more selective market, where the deals that don&#8217;t pencil are getting screened out and the operators still active are buying better. That&#8217;s discipline, not a rebound. “The headline here is a gross margin, not a profit. It&#8217;s the spread between what an investor paid and what they sold for, before rehab, financing, carrying costs, and the cost to sell,&#8221; he added. Megan Castleton, chief credit officer at Constructive Capital , said the current environment is forcing a more disciplined approach. “The lesson for brokers is simple: stop selling ‘flip activity’ and start selling ‘flip viability.’ In this market, the difference between a fundable opportunity and a bad trade can be just a few points of margin,” Castleton said. “ Agents are in a strong position to add value because today’s flip market is less about buying cheap and more about buying right. &#8230; The market is rewarding discipline again.” This article was written by Sarah Wolak and generated with the assistance of HousingWire Automation, then re
