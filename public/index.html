ucture amid the mass deployment of artificial intelligence , said Craig Van Pelt, who leads research at Cresa . “The CHIPS Act is a huge deal, one of the biggest financial packages we&#039;ve ever done in the United States, but there&#039;s a long way to go from permitting and site preparation to active construction and production,” he said. Republicans’ One Big Beautiful Bill Act added a raft of new incentives to build new factories, not just for chip fabricators but for the broader manufacturing sector. Tech dominates the largest projects leveraging the tax incentives today, but pharmaceutical and automotive production round out the top projects that have broken ground. Aerospace is also quickly growing, although at a smaller scale, as drone technology is rapidly developed and as the business of going to space is increasingly privatized by the government and given to companies like SpaceX and Blue Origin . Most of the projects being built today aren’t the types of operations that involve hundreds of blue-collar workers on production floors. Instead, they rely on advanced robotics to maintain precise production lines, Van Pelt said. “A lot of the stuff that&#039;s coming back is not traditional manufacturing, but it is more technically advanced manufacturing , which takes a different kind of worker,” he said. “We&#039;re not going to get a bunch of steel workers back here.” Here is a look at the biggest projects now underway, according to Avison Young. TSMC A chip wafer like what will be produced by TSMC in Arizona TSMC In Arizona Location: Phoenix Project Investment: $100B TSMC, the world’s largest chipmaker, began construction in April 2025 on a third chip fabrication site to complement two existing facilities in Phoenix. The groundbreaking followed a March 2025 announcement expanding the planned facility from a $65B plant to a $165B megasite . This July, TSMC announced plans to invest another $100B in the state, raising its total commitment in Arizona to $265B. ng term. Many buyers, up to 83%, would accept a mortgage interest rate buydown from a seller or builder. Buyers also expect sellers to make repairs before closing and assist with closing costs to reduce the amount of cash the buyer needs upfront. Mortgage rates remain a major obstacle, with 70% of respondents saying that current rates make every option feel out of reach. However, Neighbors Bank maintains that there are many more factors to take into consideration beyond the mortgage rates in the headlines. Credit history, loan type, down payment, and available seller concessions all have an impact on what a buyer’s actual mortgage rate will be. Plus, waiting specifically for mortgage rates to drop comes with some risk. Home prices can rise in the meantime, or the market can be flooded with eager buyers when the rates come down. More than a quarter of first-time buyers are aware of this risk and say that their biggest concern is waiting to buy only to see prices rise again, according to Neighbors Bank. Loading... Forty percent of first-time buyers said a price reduction is the seller concession that would most boost their confidence to move forward. (Stock image) Getty Images Because home prices, mortgage rates, available housing inventory, and other factors are constantly changing, timing the market perfectly is very difficult, according to Bob Curtis , founder and CEO of GetWyz . “The bottom line: Don’t buy a home because you think rates are about to go up, and don’t postpone buying solely because you think rates are about to come down,” Curtis tells Realtor.com. “Buy when you find the right home and can comfortably afford the total cost of owning it.” To find the right home at a price they can afford, buyers are expanding their search. Nearly 90% of buyers are open to buying outside a major metro to find an affordable home. Buyers are also looking at different neighborhoods and smaller homes as ways to increase affordability. Ben Mizes , a real estate agent and in
