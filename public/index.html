m® data show a market coasting but not outright decelerating. Asking prices fell for a ninth straight month, homes are selling a bit quicker than a year ago, and pending sales grew for an eighth straight month. This comes even as that growth cooled and price cuts crept back toward last year&#8217;s levels. Nothing in July looks like last summer&#8217;s seller retreat, but whether we are in a normal seasonal slowdown or something softer will become clearer next month. In This Report Top storylines and key questions Core metrics: July 2026 Summary tables Data appendix July&#8217;s top storylines, according to the data Asking prices fell for a ninth straight month at a near-record pace. Median list prices dropped 2.4% year over year, following June&#8217;s record (since 2018) 2.5% drop. Price per square foot fell 2.0% and is now declining in 34 of the top 50 metros, up by one from last month. Price cuts are converging with last year&#8217;s pace—led by a surprising pair of regions. The share of listings with a cut hit 20.0% in July, just 0.6 percentage points less than in 2025 after running nearly two points below it all spring. Notably, the Northeast (+1.0 percentage points) and Midwest (+0.3) are now cutting above their year-ago rates. Summer is slowing on schedule. Pending sales rose for an eighth straight month (+1.3% YoY), though the pace has cooled from May&#8217;s +4.1%; new listings were unchanged year on year, after tracking above 2025 all spring. When the weather gets hot, market activity cools off. Key questions Q: Mortgage rates are drifting back up and oil prices recently hit their highest levels since May. How will the housing market handle renewed pressure in the second half of 2026? A: The first half of 2026 was a story of initial promise followed by resilience, as the housing market fought through inflation, economic uncertainty, and a mortgage rate roller coaster. But that resilience had seasonal help, because spring is when housing demand ramps up. L ncentration of capital and innovation,” Kleiman said. “As a result, we are experiencing growing momentum of demand for housing throughout the broader region.” BY THE NUMBERS Category Q2 YOY Change Revenue $446 million 2.7% Net operating income $316.8 million 2.6% Operating expenses $129.2 million 2.8% Core FFO $4.08 1.2% Average rent $2,743 2.2% Occupancy rate 96.3% 10 bps SOURCE: Essex In another tech hotbed, Seattle, Kleiman noted improving operating conditions in Q2 with a 340 bps sequential increase in blended rent growth to 2.6%. The area’s revenues rose 1.7% YOY in Q2. “Consistent with normal seasonality, market rents reached their peak around early July and are expected to moderate through the balance of the year,” Kleiman said. Essex’s CEO noted stronger performance on the Eastside, which achieved 3.2% blended rent growth compared to 1% in Seattle’s urban core. “We are also encouraged by recent office expansion announcements from several notable companies,” Kleiman said. “These trends are consistent with prior innovation cycles and reinforces Seattle's long-term position as a leading technology market. While it will take time for these commitments to translate into meaningful hiring, they represent a","published_at":1785786385000,"score":34,"tags":["multifamily","california","earnings","institutional"],"heat_signals":["sun belt","trend","trends"," yoy","year over year","rent growth","occupancy"],"importance":3,"selector_reason":"Essex季度业绩反映湾区多户住宅的供需和科技就业表现。属于区域性REIT经营动态，影响有限，评为常规动态。","section":"cre","title_zh":"Essex Q2 超预期，West Coast 组合跑赢","summary_zh":"Core FFO $4.08 高于预期，NOI YoY 增2.6%，上调全年指引但估值较贵","impact":"long-pos","id":"4f5c5bb7","fetched_at":1785807993754,"cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Blackstone Data Center Arm Takes HQ Lease At Reston Station","link":"https://www.bisnow.com/news/washington-dc/office/blackstone-
