narrow CRA, drawing fire from advocates","link":"https://www.housingwire.com/articles/cra-proposal-asset-thresholds/","description":"Federal banking regulators released a Community Reinvestment Act ( CRA ) proposal Friday that narrows how banks earn credit for community development while raising asset thresholds for small and midsized institutions. The plan drew immediate criticism from consumer and housing advocates. The Federal Deposit Insurance Corp. (FDIC) and the Office of the Comptroller of the Currency (OCC) issued a notice of proposed rulemaking (NPR) that they say is designed to refocus on the statutory objectives, ensure grants reach communities, cut compliance burdens and provide greater clarity around CRA evaluations. Comments are due 60 days after publication in the Federal Register. Under the proposal, banks would still be evaluated under performance tests tied to their size, business model or an approved strategic plan. But the framework would more explicitly center on lending activity — which the agencies said is how a community’s credit needs are best met — while moving away from deposit products. Lindsey Johnson, president and CEO of the Consumer Bankers Association (CBA), said in a statement that banks should receive CRA consideration for “responsibly providing loans, investing in their communities, supporting affordable housing, financing small businesses, and helping consumers achieve financial security.” Johnson added that CBA “firmly believes that any new CRA rule should be finalized with the intention of establishing a durable regime with objective approaches grounded in statute that will last through administration shifts.” Stricter grants A central point of contention is how the proposal treats community development (CD) grants and operating support. The FDIC and OCC want to tighten CRA credit so that dollars are more clearly tied to projects where community development is the primary purpose. For large banks with more than $10 billion in assets, the proposal would cap at 15% the share of a grant or donation that can be used for indirect or administrative costs by the recipient. David M. Dworkin , president and CEO of the National Housing Conference ( NHC), called the proposal’s approach to grants and operating support “particularly concerning.” He said it would restrict CRA consideration for private-sector operating support and likely reduce funding for Community Development Financial Institutions ( CDFIs ), affordable housing organizations, homeownership counselors, fair housing groups and other nonprofits. “These organizations play an essential role in helping families achieve homeownership, expanding access to affordable housing, combating housing discrimination , and ensuring that community development investments deliver lasting results,” Dworkin said in a statement. Higher asset thresholds The proposal would significantly increase the size thresholds that determine how banks are evaluated under CRA. Small banks: Less than $1 billion in assets, up from $250 million Intermediate banks: $1 billion to $10 billion in assets Large banks: More than $10 billion in assets, up from $1 billion Banks with less than $10 billion in assets would face fewer data collection, maintenance and reporting requirements. In addition, regulators propose to evaluate only a bank’s “major product lines” — e.g., home mortgages, small-business loans and consumer loans — rather than every category, to better tailor the lending test. The proposal also would codify a preapproval process that allows institutions to seek confirmation from regulators that a specific community development program or initiative will receive CRA consideration before committing funds. Jesse Van Tol , president and CEO of the National Community Reinvestment Coalition (NCRC), said the proposal “weakens banks’ obligations to invest in working-class communities and threatens to undermine the affordable housing gains in the 21st Century Road to Housing Act entirely.” “Banks will face weaker exams, get credit for projects with little connection to low- and moderate-income communities an","published_at":1785524084000,"score":13,"tags":["housing","national","policy","regulator"],"heat_signals":["fed"],"importance":4,"selector_reason":"联邦银行监管机构提出收窄社区再投资法适用范围并提高小中型银行资产门槛，可能改变住房和社区开发融资。政策覆盖全国银行体系及低收入社区，因此属于重要监管变化。","section":"national","extended_window":true,"title_zh":"监管拟收窄 CRA，住房倡导者反弹","summary_zh":"FDIC/OCC 提案提高门槛并偏向贷款评估，affordable housing 支持或降","impact":"short-neg","id":"557cd139","fetched_at":1785644736868},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Seattle pares back environmental review appeals in effort to ramp up housing development","link":"https://www.multifamilydive.com/news/seattle-environmental-review-appeals-housing-reform/826744/","description":"An article from Dive Brief Seattle pares back environmental review appeals in effort to ramp up housing development The reform eliminates an administrative step that has held up new zoning and housing planning efforts, advocates say. Published July 31, 2026 Ryan Kushner Editor Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google An environmental review appeals process has stalled some of Seattle’s zoning reform efforts. The City Council voted to remove them July 28, 2026. Getty Images First published on Listen to the article 2 min This audio is auto-generated. Please let us know if you have feedback . Dive Brief: The Seattle City Council on Tuesday approved a reform to eliminate an environmental review appeals process that proponents say caused unnecessary delays to zoning changes and housing development in the city. Residents will still be able to appeal State Environmental Policy Act-related projects, but they will have to go through the King County Superior Court or a growth management hearings board, according to Councilmember Eddie Lin, the legislation’s sponsor. Seattle Mayor Katie Wilson said the changes will complement the “taller, denser, faster” plan to accelerate zoning reforms she announced in April. Dive Insight: More cities are retooling longstanding ordinances to fast-track housing amid an affordability crisis, but environmental review appeals have stalled some of Seattle’s larger efforts. Major zoning reforms proposed by former Mayor Bruce Harrell have been waiting in the wings since 2024 as they work their way through appeals courts , the Urbanist reported. The State Environmental Policy Act requires environmental reviews, and appeals can add up to 12 months to a project’s timeline , a Seattle Department of Construction and Inspections report found. Between 2016 and 2026, only three of 28 administrative appeals cases resulted in remands to the city to address deficiencies, according to the SDCI report. In 19 of 28 cases, the appeal was either dismissed or withdrawn before it completed the whole process. “Building housing in Seattle is one of the most effective ways to combat climate change,” Councilmember Dionne Foster said in a July 28 news release. “When we block housing in our city, we contribute to harmful sprawl and the negative environmental impacts that we all want to protect against.” Recommended Reading These 2 cities enacted upzoning policies to boost housing development. It’s working, study says. Smart Cities Dive Amid push for 222K new homes, Massachusetts eases variance request requirements Smart Cities Dive Parking minimums axed in most of North Carolina Smart Cities Dive Add us on Google Share Copy link Email LinkedIn X/Twitter Facebook Print License Filed Under: Development, Regulation","published_at":1785518760000,"score":11,"tags":["housing","national","policy"],"heat_signals":[],"importance":4,"selector_reason":"西雅图削减环境审查申诉环节，以加快分区和住房开发审批。该政策直接影响住房供给制度，虽为地方改革，但对高需求城市的供给改善具有较强示范性。","section":"national","extended_window":true,"title_zh":"Seattle 削减环评上诉以提速住房","summary_zh":"市议会取消一项行政上诉环节，zoning 与 housing development 阻力下降","impact":"long-pos","id":"af34a500","fetched_at":1785644736868},{"source_id":"cnbc-realestate","source_name":"CNBC Realty Check","source_tier":"A","source_weight":6,"source_tags":["macro"],"region":"national","title":"Buying a condo with a mortgage may soon get more complicated. Here's why","link":"https://www.cnbc.com/2026/08/01/condo-buyers-mortgage-rules-fannie-mae-freddie-mac.html","description":"New policies that apply to mortgages for condos take effect Aug. 3, and some experts are sounding the alarm that buyers may see delays or denials.","published_at":1785591001000,"score":10,"tags":["housing","national","policy","lender"],"heat_signals":[],"importance":4,"selector_reason":"针对公寓按揭的新政策即将生效，可能导致部分买家贷款延迟或被拒。该变化直接影响全国公寓交易和贷款可得性，属于重要住房监管动态。","section":"national","title_zh":"Condo mortgage 新规或拖慢成交","summary_zh":"8月3日新政策生效，condo 买家可能遭延误或拒贷","impact":"short-neg","id":"9a41fda7","fetched_at":1785644736868},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"The housing market defies expectations even with higher rates","link":"https://www.housingwire.com/articles/the-housing-market-defies-expectations-even-with-higher-rates/","description":"Housing demand still showed positive year-over-year growth last week, despite the hawkish Fed , escalation of the Iran conflict, rising mortgage rates and the 10-year yield hitting yearly highs. We had year-over-year growth in our weekly pending sales, total pending sales and purchase apps. Growth has slowed down over the past few weeks as mortgage rates have gotten above my key level of 6.64%. The longer we stay above 6.64%, the softer housing demand gets. This has typically been the case over the past few years. However, for now, considering everything that has happened since the Iran conflict 2.0 has surged and the Fed has gotten very hawkish, housing is doing ok. Of course, mortgage spreads being better in 2026 is the housing hero story of the year, but there is another variable as well. Mortgage spreads To make this as simple as possible, if mortgage spreads hadn&#8217;t improved as they typically do at this stage of the cycle, the housing data would look very different this year. The only reason mortgage rates got near 6% in 2023, 2024, 2025 and 2026 was that an economic/labor growth scare pushed the 10-year yield below 4%. This was never due to Fed policy, but the bond market attempting to get ahead of the Federal Reserve being too restrictive with policy. In the past few years, mortgage spreads were not close to normal, so rates pushed above 7% fairly easily when the economic data improved, but 2026 was the first year I didn’t forecast rates above 7% — solely because of the improvement in spreads . Even today, with the 10-year yield at 4.74%, a hawkish Federal Reserve and a crisis in the Middle East that has sent Brent Crude oil prices above $100 twice and inflation above target all year long, mortgage rates haven’t broken above 7% yet. This is because of better mortgage spreads. Housing demand doesn’t do well when mortgage rates are above 7%, so hug a mortgage spread. Historically, mortgage spreads have ranged from 1.60% to 1.80%. Last week, spreads were at 2%, up from 1.94% the week before. Let’s compare last week’s mortgage rates to where they would have been over the last three years, given the 10-year yield’s current level: If we had the worst mortgage spread levels of 2023, mortgage rates would be 7.98% today, not 6.83%. If we had the worst levels of 2024, mortgage rates would be 7.60% today. If we had the worst levels of 2025, mortgage rates would be 7.41% today. The second variable The other variable that has helped housing this year is that in the past two years, wages have outpaced home-price growth. Even though national nominal home prices haven’t fallen, they’re not growing much: 1%-2% last year and the same this year. Parts of the country are up more than that, and parts are down. However, this has helped with housing affordability. Just imagine if home prices had grown 3% in 2020 and 2021 instead of 10% and 19%; we would have had better affordability. If home prices were growing faster than wage growth, I wouldn’t be able to say that the market is healthier. 10-year yield and mortgage rates In the 2026 HousingWire forecast , I anticipated the following ranges: Mortgage rates between 5.75% and 6.75% The 10-year yield fluctuating between 3.80% and 4.60% With the Iran conflict 2.0 escalating and a more hawkish Fed, the 10-year yield is above 4.60% and mortgage rates are above 6.75%. The bond market really doesn’t like this conflict with Iran. I wrote here about why it’s hard to get mortgage rates over 7%, and I have said on many podcasts that even if the conflict gets worse, I can only add 0.375%-0.43% to my forecast of 6.75%. We are now testing this theory, as we are now up 0.08% with mortgage rates at 6.83%. If you’re looking for stability and lower rates, this conflict with Iran has to come to an end first, as the hawkish Fed members are not happy with this situation. Weekly pending sales Our pending home sales data provides a week-to-week perspective, though results can be affected by holidays and short-","published_at":1785628290000,"score":35,"tags":["housing","national","rates","data"],"heat_signals":["fed","inflation","mortgage rate","pending home sales","forecast","year-over-year","housing market","pending home sales"],"importance":3,"selector_reason":"数据显示高利率环境下美国待售和购房申请仍保持同比增长，反映全国住宅需求韧性。影响范围虽广，但属于周度指标，重要性为常规市场动态。","section":"national","title_zh":"高利率下住房需求仍超预期","summary_zh":"pending sales 与 purchase apps 仍 YoY 增长，但6.64%以上需求转弱","impact":"neutral","id":"438d39fb","fetched_at":1785644736868},{"source_id":"rebusiness-online","source_name":"REBusiness Online","source_tier":"A","source_weight":6,"source_tags":["mixed-asset","deals"],"region":"nati d on Hub Athens Dougherty, a 536-unit, 1,656-bed student housing community near the University of Georgia, according to a July 27 press release shared with Multifamily Dive. Chicago-based real estate developer Core Spaces, which specializes in student housing and build-to-rent single-family homes, is converting a hotel site into new student housing via a public-private partnership with Athens-Clarke County, per the release. Project plans also include community benefits. Hub Athens Dougherty will be a mid-rise development offering a mix of floor plans ranging from studio to five-bedroom units, with premium layouts as well as more affordable options, according to the release. It will include more than 27,000 square feet of interior amenities plus exterior facilities like study lounges, group study rooms, fitness and wellness areas, a resort-style rooftop pool and common spaces “designed to foster connection and community.” The development agreement contains several initiatives aimed at supporting downtown mobility and preserving key historic buildings, including: A 400-stall public parking deck to serve downtown Athens. Roughly 16,000 square feet of new retail, including 5,000 square feet of “below-market” community-targeted retail. Water and sewer infrastructure to facilitate new affordable housing. Streetscape enhancements to support the Jackson Street Art Walk. Preservation and revitalization of the historic Foundry building. Relocation and reconstruction of the historic Hoyt House. A new public plaza. Core Space’s strategy is centered on selectivity and identifying markets with strong fundamentals and favorable supply-demand dynamics, according to Joe Gatto, senior managing director of acquisitions at the firm. “We continue to focus on Tier 1 university markets with strong enrollment growth, Power 4 athletic programs, and meaningful barriers to entry. Those characteristics have consistently supported long-term performance,” Gatto told Multifamily Dive in emailed comments. The firm has done multiple hotel-to-housing conversions in other markets, he said. Core Spaces’ development and design partners include Mallory Evans, JNS Realty, Northworks Architects, Studio BNA and Harken Interiors. A joint venture between Core Spaces and Atlanta-based Juneau Construction Co. is leading construction, while financing was provided by Affinius Capital and arranged by TSB Capital Partners, per the release. The project is slated for delivery in 2028. Core Spaces has been active in the student housing space this year. In March, it bought The Collective at Columbia , a 318-unit, 972-bed student housing community near the University of Missouri, from Preiss and a real estate fund advised by Crow Holdings Capital. In May, Core Spaces closed its latest flagship fund with approximately $1.64 billion in total capital commitments from global investors, according to a press release. The firm said it represents one of the largest dedicated capital raises in the student housing sector. Editor’s Note: This article has been updated with comments from Joe Gatto. Click here to sign up to receive multifamily and apartment news like this article in your inbox every weekday. Recommended Reading Morgan, CAPREIT, Core Spaces make apartment buys By Leslie Shaver &#8226; March 4, 2026 Add us on Google Share Copy link Email LinkedIn X/Twitter Facebook Print License Filed Under: Development","published_at":1785527940000,"score":16,"tags":["multifamily","atlanta","construction","developer"],"heat_signals":["build-to-rent"],"importance":3,"selector_reason":"Core Spaces在佐治亚州启动1656床学生公寓项目，体现大学城租赁住房和酒店改造开发仍有活跃度。项目规模中等，属于区域性开发动态。","section":"sunbelt","extended_window":true,"title_zh":"Core Spaces 启动 Georgia 学生公寓","summary_zh":"Athens 项目含536套、1656床，UGA 周边 student housing 供给增加","impact":"long-pos","id":"5a1044f5","fetched_at":1785644736868},{"source_id":"nrhc","source_name":"National Rental Home Council (NRHC)","source_tier":"E","source_weight":9,"source_tags":["btr-sfr","i ” ideas that embody what the new company is built to deliver, according to the release. Viv, from the Latin “vivere,” means “to live fully,” and is the root of “vivid” and “vitality,” while “mark” is a “symbol that reflects quality, distinction, and lasting impact.” Benjamin Schall, AvalonBay CEO and incoming CEO of Vivmark Residential, said in the release that the name reflects “a company determined to set a new standard for the experience of home.” “Vivmark Residential is built from the exceptional foundations that AvalonBay and Equity Residential have each spent more than 30 years establishing as trusted leaders,” Schall said. “With the combined scale, capabilities, and talent of both organizations, we have a rare opportunity to redefine what rental housing can be.” Indeed, with more than 180,000 rental apartments, Vivmark Residential would have ranked No. 1 on the most recent National Multifamily Housing Council list of Top 50 owners and knocked Greystar to No. 2. Vivmark has not yet announced its complete leadership team, but it is expected to include leaders from both REITs. Equity Residential CEO Mark Parrell will step down after 30 years at the company. The merger remains subject to satisfaction of typical closing conditions. Additional brand elements such as Vivmark’s logo, typography and visual identity will be revealed in the coming weeks, per the release. The combination and new name will not result in community name changes. Click here to sign up to receive multifamily and apartment news like this article in your inbox every weekday. Recommended Reading AvalonBay and Equity Residential announce ‘merger of equals’ By Leslie Shaver &#8226; May 21, 2026 Add us on Google Share Copy link Email LinkedIn X/Twitter Facebook Print License Filed Under: Operations, Transactions","published_at":1785519900000,"score":11,"tags":["multifamily","deals","earnings","institutional"],"heat_signals":[],"importance":5,"selector_reason":"Equity Residential与AvalonBay宣布合并后新公司名称 Freddie Mac in particular has other considerations that mute the extent it engages in retained portfolio expansion, including whether the assets retained constitute attractive investments. \"We continue to expect Freddie Mac to be opportunistic with its retained portfolio growth,\" Douglas Harter and Will Nasta, equity researchers at BTIG, wrote in a recent report. While both Freddie and Fannie grew their portfolios in June relative to the previous month and a year earlier, the amount of their respective holdings remains below highs for the year. Both Fannie and Freddie's portfolios were on a growth trajectory in 2026 through April when they respectively peaked at $175 billion and $142 billion. Other considerations The government-sponsored enterprises make selective choices around what and how much they hold in portfolios for financial and risk management reasons they need to consider in addition to the Trump administration's MBS buying initiative. Historically-wide duration gaps at the GSEs that measure interest-rate sensitivity widened further in June. Freddie reported its duration gap grew from 14 to 15 months. Fannie recorded an increase from 1.29 to 1.31 years, putting it in a similar 15-16 month range. Both GSEs have been held in conservatorship since the government bailed them out of a financial crisis in 2008 so public officials have responsibility for managing their risks to taxpayers as well as maximizing their value as a form of support for the housing market. A recent forecast report from the Congressional Budget Office suggests federal loan and guarantee programs broadly tend to pose some risks related to market value fluctuations even if they offer savings from more of a budget perspective. The GSEs lie outside the standard federal budget process but CBO measures also are considered more broadly in policy. Both Fannie and Freddie's earnings proved surprisingly strong in the second quarter despite higher rates and some concerns that they would dampen the spring homebuying season. The two have been competing fiercely to buy new home mortgages from lenders, with Freddie giving Fannie more of a run for its money in this area recently even though the latter historically has been the influential player. However, Fannie did manage to beat Freddie in single-family loan acquisition volume in the second quarter with $111 billion in mortgage purchases as opposed to $110 billion. Freddie's single-family acquisitions had run ahead of Fannie's the previous quarter , when the former bought $103 billion in loans, and the latter purchased $98.7 billion. Trump administration officials showed interest in selling some more of Fannie and Freddie's shares to the public last year, but officials later shifted more focus to the portfolio initiative. Bonnie Sinnock Capital Markets Editor Bonnie Sinnock is National Mortgage News' Capital Markets Editor at Arizent and has wo","published_at":1785516020000,"score":26,"tags":["housing","national","policy","regulator"],"heat_signals":["fed","inflation","freddie mac","fannie mae","forecast","trend","housing market"],"importance":3,"selector_reason":"房利美和房地美留存资产组合的变化关系到二级按揭市场和政府支持的住房融资风险。报道提供了方向性变化，但缺乏足以评为更高等级的规模数据。","section":"national","extended_window":true,"title_zh":"GSE retained portfolio 持续扩张","summary_zh":"Freddie 达$139B、Fannie 达$174B，MBS 买入意在压低 mortgage rates","impact":"long-pos","id":"472abf07","fetched_at":1785644736868},{"source_id":"national-mortgage-news","source_name":"National Mortgage News","source_tier":"A","source_weight":7,"source_tags":["rates","macro"],"region":"national","title":"Loan modifications rose ahead of policy transition: FHFA","link":"https://www.nationalmortgagenews.com/news/loan-modifications-rose-ahead-of-policy-transition-fhfa","description":"Servicing Loan modifications rose ahead of policy transition: FHFA By Nazeefa Ahmed Published July 31, 2026, 4:52 p.m. EDT | Updated July 31, 2026, 5:39 p.m. EDT 2 Min Read Facebook Twitter LinkedIn Email Overall foreclosure prevention activity slowed at Fannie Mae and Freddie Mac this spring, just ahead of a transition to shorter allowable forbearance periods and more reliance on loan modification. Processing Content The government-sponsored enterprises (GSEs) completed 17,201 foreclosure prevention actions during the month, representing an 8.7% drop from March's 18,835. \"Foreclosure prevention actions decreased in April, driven primarily by a decrease in forbearance plans, repayment plans, and payment deferrals,\" the Federal Housing Finance Agency said in a report. Although foreclosure prevention activity fell in those categories, permanent loan modifications rose 4.7% to 7,484. The report also showed refinancing activity increased. Loan modifications and new forbearance activity were the only major home-retention actions to post monthly increases. Payment deferrals fell to 5,729 from 6,537 in March, while completed forbearance plans declined to 2,344 from 3,160 and repayment plans dropped to 1,476 from 1,832. The GSEs initiated 9,395 forbearance plans in April, up from 8,913 the previous month. The total number of loans in forbearance in outstanding inventory, a separate category, rose to 37,517 from 37,196. Even with the increase, loans in forbearance represented just 0.12% of the GSEs' single-family servicing portfolio, remaining well below pandemic levels. Home forfeiture activity remained limited, although completed short sales increased to 94 from 66 in March. Foreclosure starts fell 2.7% to 8,169 in April, while third-party and foreclosure sales increased 3.2% to 1,325. However, that pullback in GSE foreclosure is different from the broader market, as foreclosure starts climbed 17.6% nationally in the first half of 2026, according to ATTOM . Fannie and Freddie's loans currently have stronger credit profiles and performance track records than some loans in other parts of the market, such as the ones the Federal Housing Administration insures. Mortgage performance was generally stable. The 60-plus-day delinquency rate declined to 0.79% from 0.81%, while the serious delinquency rate edged down to 0.58% from 0.59%. Early-stage delinquencies ticked up slightly, with the 30-to-59-day delinquency rate rising to 0.94% from 0.92%, an indicator that servicers should monitor. The total refinance volume climbed to 96,028 loans in April from 91,593 in March even as the average 30-year fixed mortgage rate increased to 6.33% from 6.18%. Cash-out refinances accounted for 33% of refinance activity. However, Optimal Blue's rate-lock data showed cash-out refinance activity slipped the following month, falling 12.8%. Rate-and-term refinance activity was down 33.6% from the previous month in May . Since the start of conservatorship in 2008, the GSEs have completed more than 7.39 million foreclosure prevention actions, with permanent loan modifications accounting for about 38.6%. Nazeefa Ahmed Nazeefa Ahmed is a reporting associate for National Mortgage News through the Dow Jones News Fund. Awards — Nazeefa was formerly a South Asian... Read full bio","published_at":1785531147000,"score":19,"tags":["housing","national","distress","policy","regulator"],"heat_signals":["fed","mortgage rate","30-year fixed","freddie mac","fannie mae"],"importance":3,"selector_reason":"FHFA数据显示政策过渡前房贷修改数量上升，涉及房利美和房地美借款人的止赎防范。该政策变化具有行业影响，但目前属于常规监管动态。","section":"national","extended_window":true,"title_zh":"FHFA：政策切换前 loan mods 上升","summary_zh":"4月止赎预防降8.7%，但永久 loan modifications 增4.7%至7484笔","impact":"neutral","id":"16294303","fetched_at":1785644736868}],"errors":[{"source":"The Real Deal (National)","error":"HTTP 403","attempted_urls":["https://therealdeal.com/national/feed/"]},{"source":"Houston Agent Magazine","error":"HTTP 403","attempted_urls":["https://houstonagentmagazine.com/feed/"]},{"source":"Phoenix Agent Magazine","error":"HTTP 403","attempted_urls":["https://phoenixagentmagazine.com/feed/"]},{"source":"Atlanta Agent Magazine","error":"HTTP 403","attempted_urls":[
