ry , then climbed back above 6.3% by the end of March and continued higher through April. Despite the brief window of relief, the spring selling season started slowly before gaining traction: Existing-home sales rose 3.2% in May to a five-month high of 4.17 million , and pending home sales climbed 3.8% with a 4.8% year-over-year gain , signs that buyers and sellers are finding more common ground even as affordability headwinds persist. How did trends vary by region? Regional price trends remained fragmented, though the list of declining metros narrowed slightly from March. More than half of the 20 tracked metros continued to post year-over-year declines, marking the 11th consecutive month of that pattern. Seattle (-2.3%) remained the weakest performer, with Denver (-1.8%), Tampa (-1.8%), Phoenix (-1.7%), and Dallas (-1.6%) also in negative territory. Washington, DC (+0.2%), edged back into positive territory after slipping below zero in March, and Los Angeles (-0.5%) narrowed its decline. On the other side of that divide, Chicago (+6.5%) continued to lead, followed by New York City (+3.8%) and Cleveland (+3.2%), with support from constrained resale supply. The nearly 9 percentage-point gap separating Chicago from Seattle underscores how localized this housing cycle has become . In markets where inventory has rebuilt more quickly, new construction continues to offer an increasingly competitive alternative , showing buyers of newly built homes can save an average of $25,000 in ownership costs over the first decade compared to older existing stock. What is ahead for housing? Looking ahead, mortgage rates have hovered near 6.5% for six consecutive weeks , pushed higher by renewed inflation concerns and elevated energy prices . The rate environment has shifted meaningfully from the brief sub-6% window earlier this year, introducing fresh headwinds as the summer market takes shape. At the same time, listing prices have fallen year over year for seven straight months , inventory is running above year-ago levels in many markets, and affordability has continued to improve subtly as incomes outpace home price gains. In supply-constrained markets, price growth is likely to hold even as the national picture continues to cool.","published_at":1782826968000,"score":47,"tags":["housing","national","data","rates"],"heat_signals":["dallas","inflation","mortgage rate","30-year fixed","case-shiller","pending home sales","trend","trends","annual","year over year","year-over-year","case-shiller","existing-home sales","pending home sales"],"importance":5,"selector_reason":"Case-Shiller 是全国房价核心指数，直接反映住宅价格周期是否进入停滞。作为关键宏观房价数据，符合 imp=5。","section":"national","title_zh":"Case-Shiller 显示全美房价涨幅持平","summary_zh":"4月全美房价同比仅涨0.8%，10城涨1.8%、20城涨1.1%，房价动能偏弱","impact":"neutral","id":"c34cfe66","fetched_at":1782873186977},{"source_id":"trd-national","source_name":"The Real Deal (National)","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Supreme Court rebuffs Trump bid to oust Fed governor","link":"https://therealdeal.com/national/2026/06/29/supreme-court-rebuffs-trump-bid-to-oust-fed-governor/","description":"In a major ruling on Monday morning, the Supreme Court of the United States rejected Donald Trump’s move to fire Lisa Cook from a position as a Federal Reserve governor, slowing down his quest to influence more power over the central bank. The court ruled five to four in Cook’s favor, maintaining a block issued by lower courts that ruled Trump could not fire her, the Wall Street Journal reported. Cook had filed a lawsuit alleging that Trump’s firing was not “for cause,” as required by federal law. Cook said the move to fire her “was an attempt to remove [&#8230;] This article originally appear","published_at":1782757800000,"score":12,"tags":["national","macro","policy","regulator"],"heat_signals":["fed"],"importance":5,"selector_reason":"最高法院阻止总统罢免 Fed 理事，影响央行独立性和利率政策预期。事件直接关系 Fed 治理与货币政策框架，给 imp=5。","sec ough.&#8221; &#8220;Inflation is still too high, Fed may need to consider rate hikes.&#8221; &#8220;Job market is right around full employment, growth looks good.&#8221; Hammack doesn’t place much weight on falling oil prices; in fact, she says they might lead to better spending and more inflation. And in her view, the AI story is inflationary, not disinflationary, due to the growth in data centers. She used the example of higher electricity costs, which has been a common negative theme due to the massive energy used by these data centers. Also, the AI boom is causing chip shortages and raising prices, as seen when Apple recently increased prices on their products. Data centers are becoming a core factor in the Fed&#8217;s more hawkish stance, and probably a big reason AI popularity has been declining lately. Hammack believes in her full-employment model, which means the current labor data is fine in her view. In fact, she was the least concerned Fed member last year when job growth hit 21st-century lows, so it’s not shocking to hear her say we are at full employment. Today’s job openings report gave her more ammo for rate hikes, because the job openings data is no longer declining, as it did toward the end of 2025. In fact, it’s been rising in the BLS jobs report as well. A lot of people hate the job openings data, but the Fed loves it, and they make the rules, folks. The Federal Reserve is big on jobless claims data, and it&#8217;s still near historical lows, so Hammack has a lot of ammunition for rate hikes, given her belief that the labor market is strong. Since late 2022, I have warned people not to talk about a recession until this data line breaks above 323,000. We are still under 250,000 here, with no noticeable uptrend for years now, so it&#8217;s not shocking we haven’t had a recession yet. Hammack is just one person, like Kevin Warsh, but to me, she is the ringleader of the rate-hike movement at the Fed. Neil Kashkari of the Minneapolis Fed has said he wants just one rate hike in 2026, but I believe Hammack wants all the rate cuts from last year reversed, since she wasn’t really into them. All this makes for an interesting Jobs Thursday and the next Fed meeting in July. Related More: Federal Reserve Inflation","published_at":1782848417000,"score":26,"tags":["housing","national","rates","macro","regulator"],"heat_signals":["fed","rate cut","rate hike","inflation","mortgage rate","trend"],"importance":3,"selector_reason":"文章聚焦 Cleveland Fed 官员对继续加息的表态，影响抵押贷款利率预期。不是正式 Fed 决策，因此给 imp=3。","section":"national","title_zh":"Fed 官员 Hammack 再提加息可能","summary_zh":"她称通胀仍偏高、政策或不够紧，若数据强劲不排除再加息","impact":"short-neg","id":"66f9791d","fetched_at":1782873186977},{"source_id":"nahb-eyeonhousing","source_name":"NAHB Eye on Housing","source_tier":"B","source_weight":8,"source_tags":["data","trend","policy"],"region":"national","title":"Consumer Confidence Inched Up in June","link":"https://eyeonhousing.org/2026/06/consumer-confidence-inched-up-in-june/","description":"Consumer Confidence Inched Up in June &#8211; Eye On Housing Skip to content Search Research/Data Housing Economics Plus Books Dashboards Local Data Research Studies Services Indices Team Videos Research/Data Housing Economics Plus Books Dashboards Local Data Research Studies Services Indices Team Videos Eye On Housing National Association of Home Builders Economic Research Blog Consumer Confidence Inched Up in June June 30, 2026 Fan-Yu Kuo No Comments Consumer confidence inched up in June due to improved views of business conditions and recent declines in oil prices easing inflation fears. However, the consumers’ view of the labor market continued to weaken, despite recent strong job reports ; The share of respondents saying jobs are &#8216;hard to get&#8217; reached a five-and-a-half-year high. The labor market differential, which measures the gap between consumers viewing jobs as plentiful and hard-to-get, remained narrow and reached its lowest level since February 2021. Overall, consumer confidence remains well below pre-pandemic levels. The Consumer Confidence Index, reported by the Conference Board , is a survey measuring how optimistic or pessimistic consumers feel about their financial situation. This index rose from 90.6 to 91.2 in June. The Consumer Confidence Index consists of two components: how consumers feel about their present situation and their expected situation. In June, the Present Situation Index decreased 3.0 points to 116.4, the lowest level since February 2021; the Expectation Situation Index increased 3.0 points to 74.4, the highest level this year. This is the seventeenth consecutive month for which the Expectation Index has been below 80, a threshold that often signals a recession within a year. Consumers’ assessment of current business conditions improved in June. The share of respondents rating business conditions as “good” increased by 0.8 percentage points to 20.0%, while those claiming business conditions as “bad” fell by 0.2 percentage points to 16.5%. Meanwhile, consumers’ assessments of the labor market were mixed in June. The share of respondents reporting that jobs were “plentiful” rose by 0.1 percentage points to 24.9%; meanwhile, those who saw jobs as “hard to get” increased by 2.7 percentage points to 22.5%, the highest level since January 2021. Consumers were more optimistic about the short-term outlook. The share of respondents expecting business conditions to improve rose from 18.8% to 19.0%, while those expecting business conditions to deteriorate decreased from 23.2% to 20.3%. However, expectations of employment over the next six months were unchanged. The share of respondents expecting “more jobs” fell from 16.6% to 15.2%, and those anticipating “fewer jobs” declined by 1.4 percentage points to 25.6%. The Conference Board also reported the share of respondents planning to buy a home within six months. The share of respondents planning to buy a home rose slightly to 6.6% in June. Of those, sure on the November ballot carving out an exemption for its divisive transfer tax less than a week after horse-trading at the California capital killed a state-level initiative to limit levies of the same type. The body will take up the matter at its July 1 hearing. The ballot measure would allow voters to decide whether to allow an exemption for multifamily properties built in the last 10 years from the city’s Measure ULA tax. Unsplash/Qi Li Measure ULA, which adds a 4% tax to property purchases from $5.3M to $10.6M and 5.5% to trades larger than $10.6M, has been the target of ire from the commercial real estate community in Los Angeles. Many in CRE argue that the tax has stifled both institutional investment in the city and housing production , despite the fact that the tax’s proceeds go in part to housing programs. Housing advocates and a report from the city’s legislative analyst have pushed back on concerns about the dampening effect of ULA. The coalition that worked to get Measure ULA is against the city’s proposed ballot measure, calling it “a financial and strategic mistake” in a statement If approved, the exemption for newer multifamily properties is seen as a key step in reforming the measure. The exemption for housing “will allow us to start building housing again while saving a critical funding source that we desperately need,” California Community Foundation CEO and President Miguel Santana said in a statement last week. Meanwhile, ULA continues to generate funds for affordable housing and homelessness prevention. The plan for spending $544M in Measure ULA funds for the coming fiscal year was approved Friday by the city council. Bayspring Real Estate Partners partner Andrew Parker sits in an interesting intersection as an experienced developer who is also on the board of the affordable housing developer Abode Communities . Parker hears from investors — from institutional to family offices — that they don't want to invest in Los Angeles, and ULA is among the reasons for that. But he also has a front-row seat to the affordable developer's plight and has seen how badly needed additional, reliable revenue streams such as ULA are for this sector. Courtesy of Sterling Davis Parker was noncommittal about whether any of the fixes proposed for ULA would be the best path forward, but he did say that while exempting new housing was a good start, it wasn't enough. \"It doesn't necessarily solve the problem,\" Parker said. \"There's so much collaboration that needs to be done in order to really address all of this.\" The vote places focus back on local-level responses to Measure ULA after statehouse efforts to stymie the tax fell apart last week. In an eleventh-hour deal in Sacramento that even involved the office of Gov. Gavin Newsom , the Howard Jarvis Taxpayers Association agreed to pull a ballot proposal that would cap transfer taxes at less than 1% and invalidate Measure ULA, CalMatters reported . In its place, voters will now weigh a constitutional amendment that preserves existing taxes but could require a two‑thirds vote for any new ones, reshaping how cities across California fund housing and homelessness programs. The move also throws into uncertainty other efforts to rein in transfer taxes, including Assembly Member Buffy Wicks ’ proposal to cap commercial transfer taxes statewide. Wicks’ plan, AB 736, would have capped the percentage that transfer taxes can take from commercial transactions at 3%, while effectively limiting most, including ULA, to 1.5%. The status of the bill is unclear, a representative from Wicks’ office told Bisnow on Monday, but some supporters didn’t see a legislative path forward for it. Housing development advocacy group","published_at":1782853122000,"score":14,"tags":["multifamily","california","policy","regulator"],"heat_signals":[],"importance":4,"selector_reason":"洛杉矶考虑对 ULA 转让税给予新多户开发豁免，可能改变当地多户开发可行性。属于重要地方监管政策调整，给 imp=4。","section":"cre","title_zh":"LA 或为新 multifamily 让出 ULA 税口子","sum
