k up the company&#039;s strategy to focus on the disposition of older properties and use the proceeds to acquire higher-quality properties in the future. Ropes Gray &#039;s Christopher Roman represented Varia US in the agreement . Varia would receive $48.9M in cash when the deal closes, which is expected to occur in the fourth quarter. Varia owned a total of 19 properties spanning 5,769 units as of its Q1 2026 report . At the end of March, the company&#039;s portfolio was valued at $947M. Its properties are located in Arizona, Indiana, Kentucky, Missouri, Nebraska, New Mexico, North Carolina, South Carolina, Tennessee and Texas. Varia US was established in 2015, with the company&#039;s assets managed by Geneva-based Stoneweg SA. In March 2025, Stoneweg and Icona Capital combined their assets to form SWI Group. The company manages €10B in assets across European and U.S. residential, light industrial, logistics, data centers, office and hospitality. &#34;Partnering with an institution of Brookfield&#039;s calibre is a strong reflection of the quality of Varia US&#039;s portfolio and of our platform,&#34; SWI Group CEO Max-Herve George said in a statement. &#34;This joint venture gives us the firepower and the flexibility to concentrate on high-quality residential communities, while positioning Varia US to grow decisively as the U.S. living sector continues to reward scale and discipline.&#34; On Thursday, the firm announced it was accelerating its shift into digital infrastructure , buying a 70% stake in Genesis Digital Assets. Genesis would be renamed SWI Digital. SWI Group allocates more than 80% of its capital to its more than 4-gigawatt digital infrastructure portfolio. It intends to increase that share to 90% while also building out an artificial intelligence cloud business to sell compute directly to companies. Brookfield has been aggressively buying large portfolios of U.S. commercial real estate this year. It is partnering with Canada Pension Plan Investment B y as the backlog for new projects dropped sharply. Photo credit: Bisnow/Ethan Rothstein Construction is increasingly concentrated in cities like Miami. Material prices for construction inputs are up 7.4% from this point last year after rising another 10th of a percentage point in July, according to an Associated Builders and Contractors analysis of Bureau of Labor Statistics data. The nominal month-over-month increase was largely attributable to the decline in crude oil prices, which fell 12% from June. But that relief will likely be short-lived — the Brent crude oil index is up more than 5% since the beginning of August. Natural gas shot up 10% in July. Other critical inputs to building continue to steeply increase. Iron and steel prices rose 2.4% in July and are up 17.6% year-over-year, while copper wire is up 17.9% from last year after a 20-basis-point monthly increase, and softwood lumber prices jumped 6.4% last month, according to the ABC. As inflation and a renewed tariff effort continue to hit the construction industry, the future business outlook is looking cloudier. ABC&#039;s measure of firms&#039; construction backlog plummeted nearly a full month in July to eight months from 8.8 months in June, the steepest drop since early 2022. “The data center boom masks the depth of this weakness, as there is a lack of momentum in any other segment,” ABC Chief Economist Anirban Basu said in a statement. “This dynamic has been particularly difficult for small and mid-size contractors. Backlog in the $30-$50 million annual revenue category, for instance, fell to the lowest level since March 2020.” Backlogs for firms engaged in data center work were more than 11 months long, while those that don&#039;t build server farms — 88% of contractors in ABC&#039;s membership — had a 7.5-month backlog. More hurdles are being thrown up to data center construction, threatening the only segment of commercial real estate seeing a noticeable uptick in construction. Other sectors are b ar over year, something that would be impossible if we had a surge of foreclosures coming to the market. I know we get headlines every month or quarter with huge percentage increases in foreclosure data, but today I wanted I share a simple way for people to understand when foreclosures will become an issue. I also discussed this topic on today&#8217;s episode of the HousingWire Daily podcast. Foreclosure data One of the things I&#8217;ve stressed when I talk at events this year is that we have had many recessions post-WWII but only one foreclosure crisis. That foreclosure crisis started with a massive credit boom from 2002-2005, and then a credit bust. That credit bust pushed foreclosures up, according to New York Fed data , in 2005, 2006, 2007 and 2008. Then, the Great Recession happened. As you can see, none of that is happening now — we aren’t even back to 2019 levels yet, and it’s August 2026. Here is how the Fed tracks the data: New foreclosures. Number of individuals with foreclosures first appearing on their credit report during the past 3 months. Based on foreclosure information provided by lenders (account level foreclosure information) as well as through public records. This is key to what I will present next, because I can explain why housing inventory was down year over year, even though for 3.5 years now headlines were showing big percentage increases in foreclosure data. Inventory When you don’t have a lot of distressed sellers in the mix, we just deal with the normal supply and demand equilibrium for housing; a surge of actual foreclosures in 2026 would have easily put the inventory data much higher in 2026. Keep it simple: housing demand is up 2.4% year to date and new listings didn’t explode, so inventory growth slowed and declined only slightly year over year in the last existing home sales report this week. We track inventory differently than the NAR; we have no contract data in our inventory, so these are the homes available for sale. Inventory is up 0.78% fron the previous week. Weekly inventory change (July 31-Aug. 7): Inventory fell from 872,932 to 865,709 Same week last year (Aug. 1-Aug. 8): Inventory fell from 865,600 to 859,050 New listings data is key When you have a massive buildup in foreclosure data, as we saw from 2005-2008, you will get a surge of new listings data. These aren’t sellers that will be buyers; these are distressed sellers in the mix. Not to mention, after a significant high-LTV credit boom and bust, a ton of people were underwater: In 2010, over 23% of homes were underwater. The run-up in foreclosure data from 2005-2008 was going to be a problem, because the higher the percentage of underwater homes, the more likely a foreclosure will happen. In contrast, people with a lot of equity can sell and prevent that foreclosure. In addition, our new listing data isn’t surging. From 2013-2019, the normal for our new listings has been 80,000-100,000 per week during the seasonal peak months — and we haven’t had any normal years since 2020. New listings have picked up over the last two years, but it&#8217;s mostly been the traditional seller-as-buyer. This explains why inventory growth has been low this year. Here is last week’s new listings data for the past two years: 2026: 67,301 2025: 66,341 Some context for those who believe the new listings data resembles the housing bubble years: during that time, new listings ranged from 250,000 to 400,000 per week for several years . Let me repeat that: 250,000-400,000 per week for years. New listings data today isn’t even back to normal levels, with foreclosure data not back to 2019 levels. Conclusion Once the foreclosure data star","published_at":1786735243000,"score":22,"tags":["housing","national","distress","data"],"heat_signals":["fed","existing home sales","year over year"],"importance":3,"selector_reason":"文章用纽约联储止赎数据和库存销售情况解释止赎上升并非住房崩盘信号，回应市场风险叙事。属于全国住宅市场风险判断的常规分析，评为 imp=3。","section":"national","title_zh":"2026 foreclosure小升，不是房市崩盘信号","summa
