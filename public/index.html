annie-mae-raises-mortgage-rate-forecast-through-2027","description":"Mortgage rates Fannie Mae raises mortgage rate forecast through 2027 By Spencer Lee CloseText About Spencer twitter Spencer_NYC linkedin spencer-lee-journo Published May 15, 2026, 3:42 p.m. EDT 2 Min Read Facebook Twitter LinkedIn Email Current interest rate levels are unlikely to budge until 2028 at the earliest, remaining within the same 10 basis point range for the next 18 months, according to a newly revised outlook from Fannie Mae. Processing Content The government-sponsored enterprise projects the 30-year fixed rate to average 6.3% in each of this year's remaining quarters and finish at the same mean level for all of 2026, it said in its May housing forecast. The numbers represent a rise from the first-quarter average of 6.1%, with the start of 2026 characterized by a steady downward drift before Iran War shocks led rates to surge in March. The story should be much of the same in 2027 with the 30-year average not expected to dip to the 6.2% mark until the second quarter and then stay put throughout the remainder of the year, Fannie Mae said. The latest predictions represent a noticeable shift in housing sentiment compared to the end of 2025 when Fannie Mae economists predicted interest rates to land at an average of 6% at this year's close and below that threshold for 2027. In regular monthly revisions to its outlooks, researchers saw changes pointing to the likelihood of stickier rates beginning with March's jump. The new rate outlook increased from April, when Fannie Mae researchers predicted 30-year averages in 2027 and 2028 to finish at 6.2% and 6.1%, respectively. While the year started on an optimistic note for much of the lending industry, with hopes for increased volumes spurred by the steady drop of interest rates, uncertainty surrounding the duration of the Iran War brought in a cloudier forecast. The 30-year average leaped by 48 basis points from late February to the last week of March, coinciding with the war declaration, according to fellow GSE Freddie Mac's primary mortgage market surveys. Iran War developments will continue to determine fortunes for the mortgage industry in the foreseeable future, as oil price movements ripple across the economy into consumer costs, Redfin economists said this week. \"Headline inflation remained elevated in April because of the continued spike in energy prices from the ongoing closure of the Strait of Hormuz,\" wrote Chen Zhao, Redfin's head of economic research, following the release of last month's Consumer Price Index. Higher inflation also makes it less likely that the Federal Reserve will cut its benchmark rate in 2026, she added. \"In the near term, mortgage rates will continue to move less with any one economic data release and more with oil prices and developments in Middle East peace negotiations, which are the underlying driver of changes in the economic data,\" Zhao continued. Fannie Mae's originations outlook With rates likely to be higher than what was expected a few months ago, the likelihood of reduced refinance activity led Fannie Mae to lower prior originations predictions. The GSE currently sees production volume this year totaling $2.36 trillion compared to $2.38 trillion in its pre-war February outlook. The May number, though, is higher compared to April's $2.34 trillion forecast, with Fannie Mae seeing current purchase demand still providing some momentum this year. For 2027, the GSE lowered its projections to $2.49 trillion, compared to $2.52 trillion in February and $2.5 trillion one month ago. Spencer Lee Technology Reporter Spencer Lee is a New York-based technology reporter at National Mortgage News, whose coverage area spans artificial intelligence, fintech platforms... Read full bio twitter linkedin","published_at":1778874144000,"score":34,"tags":["housing","national","rates","trend"],"heat_signals":["fed","inflation","mortgage rate","30-year fixed","freddie mac","fannie mae"," e, marking a 7.1 percent increase from the same period last year. Regionally, year-to-date single-family permitting declined in all four regions through March. The Midwest was essentially flat, the South declined by 7.4 percent, the West dropped 9.3 percent, and the Northeast fell 17.1 percent. Multifamily permits increased in three of the four regions, led by gains in the Northeast (up 47.0 percent), followed by the West (up 38.0 percent), and the Midwest (up 2.2 percent). The South saw a decline of 13.3 percent, driven largely by a 42.0 percent decrease in the Houston-Pasadena-The Woodlands, TX metropolitan area and a 29.0 percent drop in the Miami-Fort Lauderdale-West Palm Beach, FL metropolitan area. At the state level, 12 states recorded year-over-year increases in single-family permits in March, with gains ranging from 18.6 percent in Alabama to 0.2 percent in Minnesota. The District of Columbia reported no change. The remaining 38 states reported declines, led by Maryland, which posted the steepest drop at 25.4 percent. The ten states issuing the highest number of single-family permits accounted for 63.7 percent of all single-family permits issued nationwide. Texas led the country with 35,231 permits issued at the end of the first quarter of 2026, although this represented an 8.3 percent decline compared with March 2025. Florida, the second-highest state, saw permits fall by 6.7 percent, while North Carolina, ranked third, experienced a decline of 15.4 percent. Between March 2026 and March 2025, 29 states recorded increases in multifamily building permits, while 21 states and the District of Columbia experienced declines. Rhode Island posted the largest percentage increase, with multifamily permits surging 397.2 percent, rising from 109 to 542 units. In contrast, Nevada recorded the steepest decline, with permits falling 81.6 percent, from 2,299 to 422 units. The ten states issuing the highest number of multifamily permits accounted for 62.8 percent of all mu y difficult to achieve as interest rates and sale prices continue to rise across the nation. These hardships are pushing many residents in Houston toward renting single-family homes, creating a rise in demand. The overview Home prices in Houston have increased since 2020, with the median home price shooting up from $252,500 in 2020 to $337,000 in 2025, a 33% increase, according to data from the Houston Association of Realtors. HAR Chair-Elect Kat Robinson said the cost factor has made it difficult for many to afford a home and is resulting in more residents renting single-family properties instead. “It gives you the experience of cutting the lawn, and how you’re incorporating taking care of that extra square footage in your day-to-day,” she said. “It’s good practice.”","published_at":1778859281000,"score":19,"tags":["btr-sfr","houston","trend"],"heat_signals":["single-family rental","houston"],"importance":2,"selector_reason":"报道指出休斯敦购房难度上升推动单户出租需求增长，符合SFR主题覆盖需要。信息来自行业转载且区域性较强，因此评为imp=2。","section":"btr","title_zh":"Houston SFR 需求升温，homeownership 放缓","summary_zh":"Houston 中位房价 2020-2025 从 $252.5K 升至 $337K，租 single-family 增多","impact":"long-pos","id":"36e37080","fetched_at":1778895448090},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Build-to-rent sale mandate cut from House’s ROAD to Housing bill","link":"https://www.multifamilydive.com/news/build-to-rent-house-road-to-housing-bill/820391/","description":"An article from Build-to-rent sale mandate cut from House’s ROAD to Housing bill The bipartisan legislation is moving ahead for a House vote with strong support from the housing industry, but the White House says “there may be serious policy concerns” with the bill. Published May 15, 2026 Julie Strupp Senior Editor Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Getty Images Listen to the article 5 min This audio is auto-generated. Please let us know if you have feedback . In a win for housing pros and advocates, the House released an amended version of the Senate’s 21st Century ROAD to Housing Act late May 13 that removes a provision the industry said would effectively eliminate the production of build-to-rent single-family housing and ultimately increase rent and home prices. Multifamily groups have been sounding the alarm about the forced sale requirement in the Senate version of the major bipartisan housing bill passed on March 12. Since then, major investors and lenders have essentially stopped buying and financing build-to-rent housing due to the measure, Bisnow reported. The new version of the bill still restricts major investors from buying single-family homes: Section 1001 says that “no covered large institutional investor may purchase, or enter into a contract to directly or indirectly purchase, any covered single-family home.” However, it contains a series of carveouts for new rental housing, homes in need of major renovations and more. Following the House’s release of its changes, 11 prominent industry organizations sent an open letter of support on May 14, urging the House and Senate to pass the bill “as soon as possible” so it can move to the president’s desk for his signature. “As now written, the Act will be the most significant legislation to increase housing supply in years and has the potential to meet our shared housing goals of providing more housing options and more housing affordability in communities across the country,” the letter reads. “This legislation, now that it preserves and protects as many as 72,000 critical Build-to-Rent (BTR) homes every year, is an important step towards addressing the housing affordability challenges faced by many American households.” Research from the Bipartisan Policy Center indicates that a bipartisan majority of voters want to see something happen on this issue, according to Francis Torres, director of BPC’s housing and infrastructure projects. He said Congress is closer than it's been in years to passing a significant federal housing package. “There are definitely lighter restrictions in this version than what the Senate passed,” Torres told Multifamily Dive. Even though there are still differences between the House’s new version and the bill from the Senate, “there's clearly a lot of energy and momentum around this issue of housing, especially in the context of cost of living.” What’s next The House is now moving ahead with a vote on its amended version of the bill the week of the 18th, ahead of the Memorial Day recess, Politico reported. House leaders want to pass it under suspension of rules, an expedited process requiring a two-thirds majority that limits debate and prohibits further amendments on the floor. If it passes, the measure will head back to the Senate for approval, although it is not clear whether the upper chamber will accept the modifications. It’s also not clear whether the president will support it. “The bill is under review. New provisions were added before the administration had a chance to review or provide technical assistance,” a White House official told Multifamily Dive in an email. “There may be serious policy concerns or implementation challenges.” On May 11, President Donald Trump posted on Truth Social calling on Congress to pass the Senate version of the legislation, breaking his silence as the House and Senate debated the differences in their respective packages. The Senate added the BTR forced sale mea","published_at":1778869020000,"score":25,"tags":["btr-sfr","national","policy"],"heat_signals":["build-to-rent","btr","fed"],"importance":4,"selector_reason":"House住房法案删除build-to-rent出售强制条款，直接影响BTR开发商和机构住宅投资者。属于联邦住房政策中的重要监管变化，因此评为imp=4。","section":"btr","title_zh":"House 删去 BTR 七年强制出售条款","summary_zh":"ROAD to Housing 修订移除 sale mandate，BTR 融资冻结风险缓解","impact":"long-pos","id":"12cd58ab","fetched_at":1778895448090},{"source_id":"trd-national","source_name" r the House to pass the Senate’s bill the way it was written. The House is seeking to pass its amended bill under fast-track rules that would curtail debate, prevent further amendments on the floor and necessitate a two-thirds majority. — Holden Walter-Warner Read more Politics National Senate housing bill chills $3.4B from build-to-rent development","published_at":1778864791000,"score":20,"tags":["deals","btr-sfr","housing","policy","trend"],"heat_signals":["build-to-rent","housing market"],"importance":3,"_from_fallback":true,"section":"btr","title_zh":"House 版住房法案松绑 build-to-rent","summary_zh":"七年出售要求被删除，但 Senate 是否接受待定；BTR 投资信心修复","impact":"long-pos","id":"5849411d","fetched_at":1778895448090},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Vanderbilt Office, Hillwood And TriPost Capital JV Buys 1.4M SF Office Campus In DFW","link":"https://www.bisnow.com/dallas-ft-worth/news/office/vanderbilt-office-hillwood-and-tripost-capital-jv-buys-14m-sf-office-campus-in-dfw-134602","description":"News Vanderbilt Office, Hillwood And TriPost Capital JV Buys 1.4M SF Office Campus In DFW Dallas-Fort Worth Office View count: Dallas-Fort Worth Office May 15, 2026 | 3:19 p.m. ET Billy Wadsack, Dallas-Fort Worth One of the most recognizable office campuses in North Texas has just been sold to a joint venture comprising three major commercial real estate players. Courtesy of Visit Irving Vanderbilt Office Properties , Hillwood Urban and TriPost Capital Partners partnered to purchase the 1.4M SF The Towers at Williams Square office campus in Irving, according to a press release from the joint venture. Developed in the 1980s, the Class-A office campus features a 26-story center high-rise between two 14-story towers, an adjacent five-story building and the well-known Mustangs of Las Colinas bronze sculpture. Financial terms of the transaction were not disclosed. “The Towers at Williams Square is truly an iconic property, and we believe it is among the finest office addresses in the Dallas-Fort Worth market,” Vanderbilt Office Properties Managing Partner Casey Wold said in a statement. “The combination of walkable, amenity-rich surroundings, exceptional freeway and airport access, and outstanding on-campus amenities make it exactly the kind of high-quality asset tenants are gravitating toward.” More than $30M of renovations have been done to the office campus in Irving’s Las Colinas Urban Center over the years. It serves as the global headquarters of construction equipment manufacturer Caterpillar Inc. , as well as the home for the Big 12 Conference, Flowserve and the Irving-Las Colinas Chamber of Commerce. Williams Square’s tenant roster and market position make the property well equipped to benefit from the ongoing flight-to-quality trend happening in the office sector, according to Brad Carroll, co-founder and partner at New York-based private equity firm TriPost Capital Partners. DFW's flight-to-quality trend pushed asking rents for trophy office buildings to record highs last year. And Ariel Guerrero , Avison Young regional manager of market intelligence for the central region, said earlier this year he expects the trend will boost the region's office sector throughout 2026 . Class-A office asking rents rose by nearly 4% year-over-year in the first quarter across all competitive tiers, according to the latest office report from Cushman Wakefield . Chicago-based Vanderbilt Office Properties isn't new to the property, as the firm partnered with Apollo Global Real Estate to purchase the campus in 2016 for $330M, according to D Magazine . Ross Perot Jr. 's Dallas-based Hillwood was also involved in that deal. Hillwood Urban Executive Vice President Bill Brokaw said the company has seen “significant and growing tenant activity” at the campus thanks to its central location in the metro and the highly amenitized neighborhood at its doorstep. Beal B
