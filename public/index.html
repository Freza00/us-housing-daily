boards Local Data Research Studies Services Indices Team Videos Eye On Housing National Association of Home Builders Economic Research Blog Private Residential Construction Spending Increases in March May 7, 2026 Na Zhao No Comments Private residential construction spending was up 1.7% in March 2026, following two straight months of declines. The increase was broad-based, with gains in single-family, multifamily construction, and home improvement spending. Moreover, total private residential construction spending was 3.6% higher than a year ago. According to the latest construction spending data from the U.S. Census, single-family construction spending increased 2.7% in March, consistent with the steady builder confidence reflected in the NAHB/Wells Fargo Housing Market Index (HMI). Despite the monthly gain, single-family construction spending was down 4.2% over a year ago. Meanwhile, multifamily construction spending edged up 0.3% in March. This marks the second monthly increase after two consecutive months of modest declines. Compared to a year earlier, multifamily spending was 0.5% higher. Improvement spending (remodeling) also increased in March, rising 0.9% for the month. Remodeling remained a bright spot on a year-over-year basis, with spending up 14.3% from March 2025. The NAHB construction spending index is shown in the graph below. The index illustrates how spending on single-family construction has slowed since early 2024, reflecting the impacts of elevated interest rates and ongoing uncertainty over building material tariffs. Multifamily construction spending growth has also slowed down after the peak in July 2023, with the index largely plateauing since late 2024. In contrast, improvement spending has been on an upward trend since the beginning of 2025, supported in part by the aging housing stock and sustained demand for renovation. Spending on private nonresidential construction was down 2.1% over a year ago. The annual private nonresidential spending e operators to sell their BTR SFRs after seven years is already impacting Houston, one of the country’s biggest BTR markets, per Yardi. Headwinds The elevated volume of new apartment supply working through lease-up remains the primary constraint on rent growth, according to Yardi. Demand has also softened and absorption has stagnated in the past few quarters. Consumer confidence is low and job growth remains soft, per Yardi. Many households face growing difficulties in the so-called K-shaped economy , which describes how higher-income households are increasingly better off, while lower-income ones are falling further behind, according to CNBC. The ongoing war in Iran has also contributed to elevated energy prices, which are constraining household budgets, per the report. Since negotiations with Iran appear stalled, there is limited visibility on when these pressures may ease . “Many in the industry are expecting/hoping that rent growth will return to the long-term average in the 2.5% to 3% range, but that may not be on the near-term horizon,” according to the report. However, “to get to the long-term average, rent growth must turn positive in markets in the Sun Belt and Mountain West that have recorded negative growth over the last two years.” With moderating population growth, cooling migration and an uncertain economic outlook, a near-term acceleration in demand appears unlikely, per the report. Nonetheless, rent growth is expected to increase gradually as inventory is absorbed over time. Strategies and opportunities The highest rent gains continue to be concentrated in primary markets such as New York, Chicago and San Francisco, as well as Midwest markets like Minneapolis and Saint Paul, Minnesota; Kansas City in Missouri and Kansas; and Indianapolis. Charlotte, North Carolina; Houston and Austin in Texas; Orlando and Tampa in Florida; and other markets saw MOM and YOY rent declines in April. However, several other high-supply markets are showing early signs of stabilization: Miami; Phoenix; Raleigh, North Carolina; Denver; Nashville, Tennessee; and Dallas all posted growth in April but declined year over year. “While this improvement is not yet broad-based or sustained, it suggests conditions may be beginning to turn a corner, though a gradual recovery is still expected,” according to Yardi. Regardless of overall performance, each metro area has pockets that outperform the larger market depending on the local economic picture and supply characteristics, per the report. Investors can also find opportunities in distressed and value-add","published_at":1778176620000,"score":45,"tags":["multifamily","trend","data"],"heat_signals":["build-to-rent","btr"," sfr","texas","houston","dallas","austin","sun belt","outlook"," yoy","year over year","rent growth"],"importance":3,"selector_reason":"全国多户住宅租金数据，Yardi报告显示4月租金仅增$4且同比下跌，反映春季租赁市场疲软，属于常规市场动态监测。","section":"sunbelt","title_zh":"4 月 apartment rent 仅微涨 $4，季节性反弹乏力","summary_zh":"Yardi 数据显示全美 advertised rent MoM +$4 至 $1,758，YoY -0.2%，增幅仅为 2012-2019 均值三分之一，BTR SFR rent 亦 YoY -0.5%","impact":"short-neg","id":"f2d4fa14","fetched_at":1778230768556},{"source_id":"trerc","source_name":"Texas Real Estate Research Center (TRERC)","source_tier":"D","source_weight":9,"source_tags":["texas","data","trend"],"region":"texas","title":"Supply Is Back, Confidence Is Not: Inside Texas’ Shifting Spring Housing Market","link":"https://trerc.tamu.edu/blog/supply-is-back-confidence-is-not-inside-texas-shifting-spring-housing-market/","description":"May 7, 2026 Supply Is Back, Confidence Is Not: Inside Texas’ Shifting Spring Housing Market A confluence of factors is reshaping the state’s housing market this spring. What does that mean for buyers and sellers? By Yanling Mayer quick links Tierra Grande NewsTalk Texas Blog Content Library Data Gallery As the housing market heads into its busiest stretch of the year, a mix of global and domestic pressures—disruptions to the supply of oil and petro-products, a sharp rise in energy prices, renewed inflation, rising mortgage rates, and shifting consumer sentiment—are all converging to impact the 2026 spring season and likely beyond. The question now is whether this spring will feel noticeably different from the momentum that had been building at the start of 2026. Mortgage Rates Reverse Course At the beginning of the year, expectations for a more active and balanced spring market were building. Mortgage rates had been on a steady decline since last June, continuing to fall through January and February 2026 and even briefly dropping below 6 percent. That trend reversed in March following the outbreak of the Iran conflict. The average rate on 30-year conforming mortgages jumped by 50 basis points in April (see figure) as inflation re-accelerated amid rising energy costs and disruptions in global energy market. As of the first week of May, rates remained more than 25 basis points above their February/March low. Rising mortgage rates, weakening consumer sentiment, renewed inflation, and economic uncertainty are now weighing on buyer demand just as the market typically gains momentum heading into spring. Weekly Rates on 30-Year Conforming Mortgages Source: Freddie Mac PMMS, accessed at FRED More Sellers, More Inventory, More Price Weakness Fresh listings have been on the rise as sellers position themselves for the seasonal upswing. As of March, new-listing activity is running modestly ahead of last year. With more sellers returning to the market after sitting out the quiet winter months, inventory has been replenishing quickly and is already exceeding last year’s levels. Although inventory isn’t growing as sharply as it did last year, it remains on track to reach new highs this spring. Supply conditions are again shifting in the buyer’s favor, and rising inventory is expected to put additional pricing pressure on sellers, especially at a time when rising mortgage rates, renewed inflation, and heightened economic uncertainty are weighing on consumers. A More Negotiable Spring Market The Iran conflict is ongoing with no clear resolution on the table. As of May 4, crude oil prices (West Texas Intermediate) are trading at $105-$106 per barrel, roughly 80 percent higher than the $60-$65 range seen in January and February. The 10-year treasury yield has hit new highs daily since mid-April and has now climbed to 4.45 percent. With a typical mortgage spread of about 2 percentage points, investors’ demand on higher treasury yield has already pushed 30‑year mortgage rates into the mid‑6 percent range. In periods of heightened market volatility and uncertainty, spreads typically widen further, which could send mortgage rates back to the levels seen last spring after the eruption of global tariff wars. Buyer demand is expected to soften as mortgage rates and inflation shift. Even buyers not already sidelined by rising rates may choose to exercise more caution, taking more time to navigate the market and the economy. Signs point to another spring season of slower demand, steady seller participation, more price adjustments, and a generally more negotiable market. Views expressed on The 338 are those of the authors and do not imply endorsement by the Texas Real Estate Research Center, Division of Research, or Texas A M University. Did you like this Post? 6 In This Post Contents Mortgage Rates Reverse Course More Sellers, More Inventory, More Price Weakness A More Negotiable Spring Market Topics Housing Subscribe Subscribe to The 338 You might also ","published_at":1778158800000,"score":26,"tags":["housing","texas","trend"],"heat_signals":["texas","inflation","mortgage rate","freddie mac","trend","housing market"],"importance":3,"selector_reason":"Texas春季住宅市场综合分析，供应回升但信心不足，能源价格与利率多重压力，Sun Belt关键市场动态。","section":"sunbelt","title_zh":"Texas 春季房市供给回升但信心不足，mortgage rate 反弹 50 bps","summary_zh":"Iran 冲突致 30Y mortgage 4 月跳升 50 bps，能源涨价与通胀重燃叠加 consumer sentiment 走弱，Texas 春季 momentum 受挫","impact":"short-neg","i ls averages around 63%. The portfolio was generating less than 65% of the revenue it needed to cover the cost of the loan's interest as of mid-2025. At the time of origination, it was underwritten as generating more than double the cost to cover loan interest, according to TRD. Starwood has had issues with other large portfolio loans coming due. Last spring, a $577.3M Starwood CMBS loan secured by 65 hotels across 21 states was transferred to special servicing , also due to cash flow problems. Starwood found a way forward for that portfolio. It secured a loan modification, and as of the end of March, it had sold off 21 of the portfolio's lower-performing hotels and was able to contribute $122.6M to paying down the debt, TRD reported. The hotel market is grappling with revenue that's flat or declining as international tourism numbers remain down. Events like the FIFA World Cup , which were anticipated windfalls for hotel owners, have failed to make good on the promise of bringing in waves of bookings. Nevertheless, with record levels of debt available, there are still lots of investors eager to buy hotels, and transactions are expected to rise this year, Bisnow has reported. Contact Bianca Barragán at bianca.barragan@bisnow.com Related Topics: Starwood Capital Group , hotel market , hotel distress , K-Star Asset Management","published_at":1778170626000,"score":19,"tags":["hotel","distress","institutional"],"heat_signals":["starwood","occupancy"],"importance":4,"selector_reason":"Starwood 2.65亿美元酒店组合面临违约，2,943间客房跨12州，CMBS转特殊服务商，属于大型CRE违约风险事件。","section":"cre","title_zh":"Starwood $265M hotel portfolio 濒临违约，已转入 special servicing","summary_zh":"22 家酒店 2,943 keys 的 2018 CMBS loan 因基本面恶化转入 K-Star special servicing，occupancy 63%、DSCR 不足 0.65x，maturity 2027 但违约风险迫近","impact":"short-neg","id":"6a6ec62e","fetched_at":1778230768556,"cre_subcategory":"酒店"},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Soloviev To Pocket $526M In 9 W. 57th St. Refi","link":"https://www.bisnow.com/new-york/news/capital-markets/soloviev-18b-loan-cash-in-on-9-west-57th-134486","description":"News Soloviev To Pocket $526M In 9 W. 57th St. Refi New York Capital Markets View count: New York Capital Markets May 07, 2026 | 4:29 p.m. ET Ethan Rothstein, Deputy Managing Editor Sheldon Solow famously kept occupancy low for decades at 9 W. 57th St., preferring exclusivity over cash flow at the office tower overlooking Central Park. His son, Stefan Soloviev, took a different approach after inheriting the family business in 2020. He spent $53M renovating the building, pushed occupancy above 91% and is now poised to cash out in a major way. Soloviev is set to pocket more than $500M through a refinancing of the Billionaires’ Row tower. Google Maps 9 W. 57th St. The Soloviev Group has lined up a $1.8B CMBS loan from Bank of America , Wells Fargo and Citi Real Estate Funding to refinance 9 W. 57th St., according to S P Global . The five-year loan will pay off the building’s existing $1.2B mortgage, which matures later this year. About $857M of that debt is securitized in the JPMCC 2016-NINE CMBS trust, with the remainder spread across several conduit CMBS loans. The refinancing will also fund $40M in closing costs and $34M in landlord obligations. The remaining $526M would be returned to Soloviev in cash, according to S P Global’s presale report. The mortgage is expected to close on May 27. The building’s existing debt, originated in 2016, carries a 2.85% rate, according to the Morningstar Credit database. A Bank of America spokesperson declined to comment. Shortly after this story's publication, Soloviev Group announced that it closed the refinancing at an interest rate of 4.97%. When the tower is stabilized, it will be valued at $3.9B, according to the release. “This refinancing is a clear validation of the strength of 9 West 57th Street and the collaborative success of lead lender Bank of America, and secondary leads Wells Fargo and Citibank,” Soloviev said in a statement. The 50-story, 1.7M SF tower opened in 1974 after Solow spent decades assembling the site. The building is often simply called Nine West because the shoe company was founded there and took its name from the address. Solow was known as a notoriously difficult landlord, sometimes rejecting tenants for seemingly arbitrary reasons, including misidentifying an artist whose work hung in the building, The Wall Street Journal reported . Soloviev, 50, took his family’s original surname when he was 23. Since taking over the business, he has brought in new works by Picasso, Matisse and Miró, added a 20K SF fitness center and upgraded the building’s amenities to better compete with newer towers like One Vanderbilt and those in Hudson Yards , the WSJ reported last month. Those efforts appear to have paid off. The building averaged 71% occupancy over the past 24 years but was 91.7% leased at the end of April, according to S P Global. Its net operating income also jumped 45% between 2021 and 2025, rising from $106.1M to $153.4M. Its largest tenant is Apollo Global Management , which leases 430K SF and subleases an additional 32K SF from Sculptor Capital Management. Apollo also has the option to expand into multiple floors as they become available. Chanel , Sculptor and Davidson Kempner Capital Management are also major tenants. Even as occupancy has climbed, Soloviev has continued to command some of the market’s highest rents. In March, Soloviev announced a record New York City office lease at $327.50 per SF for the building’s top floor. The tenant was later revealed to be HBeyond , a company owned by the family of a Mexican billionaire. Soloviev signed seven leases totaling 58K SF that begin this year and next at an average rent of $205 per SF, according to S P — well above Midtown’s average asking rent of $84.77 per SF in April, according to CBRE . The refinancing underscores rtificial intelligence data centers enable the build-out of advanced manufacturing and other AI-reliant industrials. “There's demand coming that's not just AI factories, it is industrial infrastructure, where technology and infrastructure come together at scales that have never been needed or required before for this next generation,” Williams said. “We won't be able to do that on every campus because there has to be land available, and sometimes you have enough for one or the other. But where you can gather those resources together, I think this will be unique.” QII has yet to unveil any specific projects or sites where these powered campuses will be built. Still, Williams anticipates multiple announcements by year-end once those projects are “certain and moving forward.” While QII has provided few specifics about its future development plans, Williams told Bisnow the firm is focused on nontraditional data center locations outside of primary markets. He said he has executed this approach successfully in the past, with QTS developing major facilities in places like Atlanta and Richmond before they became major digital infrastructure hubs. “I've gone sometimes where people have not thought to go or not been able to go, for whatever reason, and I think you should see that to be a consistent path going forward,” Williams said. “There may be a couple announcements where people go, 'Oh, geez, why didn’t I think of that?'” Although a growing share of developers building gigawatt-scale data center campuses are turning to on-site generation and behind-the-meter power deals to skirt yearslong wait times for electricity from the grid, QII is “committed to a grid-only strategy,” at least for now, according to Williams. Rich Voorberg, the former president of Siemens Energy North America, will lead QII’s energy strategy. Courtesy of QII QII's leadership team: Mark Westhoff, Rich Voorberg, Alex Rose, Chad Williams and Jeremy Bardin Williams said his and Voorberg’s deep relationsh al expenses. Hoffman said the company expects $20 million in incremental year-over-year legal costs in Q2, and expects legal costs to ease in the second half of the year. Zillow has been fighting several lawsuits over the last year, from competitors like Compass and CoStar, as well as government regulators. Compass dropped its lawsuit in March after a protracted fight over Zillow’s listing access standards. The Federal Trade Commission sued Zillow and Redfin in September , alleging the companies colluded in a $100 million agreement to syndicate rental listings. SIGN UP Hoffman said Zillow expects $750 million to $765 million revenue in the second quarter, a 16 percent growth year-over-year. AI integration Pointing to the recent launch of Zillow AI mode, Wacksman said the company was focused on integrating AI across its products and operations. He said the company has an advantage over generic AI tools and other real estate platforms, saying Zillow can use proprietary data like home browsing patterns, messages, closed deals and other metrics to power AI tools. Zillow debuted a consumer-facing AI mode in March that is currently available to about 5 percent of Zillow’s audience, and Wacksman said the company plans to expand it throughout the year. “Zillow users in AI mode are having deeper, more substantive conversations than they do in traditional search, and we are seeing more actionable engagement as a result,” Wacksman said. Wacksman also noted the company’s recently announced partnership with Realtor.com, which will see Zillow Preview listings syndicated to Realtor.com for its similarly titled Realtor.com Preview program. Wacksman said the deal will put pre-marketed listings in front of more consumers outside private channels. “It’s really just a win-win for both Zillow and our agent partners, as well, obviously, as Realtor,” Wacksman said. Read more Residential National Zillow turned fourth-quarter profit despite lawsuits, flat housing market","published_at":1778
