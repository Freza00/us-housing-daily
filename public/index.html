nger.” The need for senior housing is anticipated to climb over the next several years. The population of adults 75 or older is expected to increase by more than 4 million by 2030, according to Census Bureau projections. An increase in the older population comes alongside an increase in older adults renting, with people aged 65 to 74 making up the fastest-growing cohort of renters, according to PwC . Citrine Investment Group CEO Lynn Jerath said as growth has stabilized in multifamily and other real estate sectors, senior housing has become more attractive on the equity side. But she cautioned that although there is a lot of capital in the space, solid fundamentals for each project are still important when making investment decisions. The sector can suffer if there is a rash of overbuilding or if capital floods in without guardrails, Jerath said. “If you&#039;ve been in senior housing long enough, you know what happens when there&#039;s too much capital that&#039;s uninitiated into this sector,” Jerath said. Jerath said that while multifamily projects are easier to replicate across different markets in the country, the viability of senior housing developments varies more on an individual basis, adding to the sector&#039;s complexity. Chuck Murphy, executive vice president at LCS, said capital is still quite discerning when evaluating opportunities and that the development world remains challenging. The acquisition side of the business is becoming frothier, he said. New development continues to pace at record lows, but in some markets, the cost to replace is an advantage compared to buying properties, Murphy said. Senior housing construction starts most recently peaked in late 2021 in primary markets and early 2022 in secondary markets. Those figures are now down 77% and 62%, respectively, from recent peak levels, according to a spring JLL senior housing report . Murphy said he has also seen an evolution in the wants and needs of the newer generation of seniors who see senior housing as a choice instead of a necessity. “Ten to 15 years ago, we polled all of our residents, which we do regularly, and they all talked about safety and security,” Murphy said. “Fast-forward to the last five years, they talk about dining, they talk about experience, they talk about hospitality.” Mather Chief Financial Officer Yousuf Hussain said his company has both developed and acquired senior living communities, each with a different investment thesis. Development is a longer-term process with more risk, where the company is looking for higher rates of return and protection against obsolescence from older a","published_at":1786736710000,"score":10,"tags":["senior-housing","deals","developer"],"heat_signals":[],"importance":3,"selector_reason":"伊利诺伊州老年人口增长预期推动养老住房需求，但开发融资仍面临困难。人口结构与融资条件共同影响养老地产供给，属于区域性的常规重要动态。","section":"cre","extended_window":true,"title_zh":"Illinois senior housing 需求升融资难","summary_zh":"65岁以上人口2035增40%至近300万，收购资本改善但开发贷款仍难","impact":"long-pos","id":"8df819e8","fetched_at":1786843136927,"cre_subcategory":null},{"source_id":"rebusiness-online","source_name":"REBusiness Online","source_tier":"A","source_weight":6,"source_tags":["mixed-asset","deals"],"region":"national","title":"Walker &#038; Dunlop Provides $33.2M Agency Acquisition Loan for Los Angeles Multifamily Community","link":"https://rebusinessonline.com/walker-dunlop-secures-33-2m-agency-acquisition-loan-for-los-angeles-multifamily-community/","description":"LOS ANGELES — Walker &#38; Dunlop has provided a $33.2 million Freddie Mac acquisition loan for Palm Court Apartments in Los Angeles' Miracle Mile neighborhood. Bryan Frazier, Blake Hockenbury, Steven Paskover, Sheri Blackburn and Dillon Hoffman of Walker &#38; Dunlop Capital Markets Real Estate Financing secured the fixed-rate, full-term interest-only loan. Located at 740 S. Burnside Ave., Palm Court Apartments features 132 apartments within a four-story building. The property offers convenient access to downtown Los A and severe storms.” Moody’s took a sample of 159,000 water-intensive facilities across the U.S. and found that nearly 49,000 will face high or very high water stress by 2100. The facilities span three sectors: heavy manufacturing and processing, which made up 61% of the sample, mining and quarrying facilities, and food and beverage manufacturers. “For investors, both perils translate into operational risk, earnings volatility and stranded-asset exposure,” the report says. Texas and California had the largest concentration of facilities projected to move into high-stressed status in the coming decades, while Louisiana and Oklahoma also have notable concentrations of at-risk properties. “These projected transitions are concentrated in regions facing a range of existing and emerging water resource challenges, including recurring drought, pressure on major river systems such as the Colorado River and the Rio Grande , and declining groundwater availability,” the report says. The latest analysis comes on top of a recent study from climate risk data firm First Street that found that commercial real estate values in markets with higher risks of natural disasters were 16.9% lower than in markets with lower climate risk. The Moody’s report highlights the rising risk of drought and high heat further exacerbating wildfire risk, another growing climate challenge in the U.S. The 10 states with the highest exposure to wildfire risk carry $1.4T in reconstruction cost value , a Cotality report this month found. Banks and insurance firms could help proactively manage the risk by adjusting pricing to reflect the growing risks, the analysts wrote. Banks are well positioned to help their clients quantify the risks, while insurers can embed heat and water stress projections into their modeling. Continue reading this story with a free account Log in or register Contact Matt Wasielewski at matthew.wasielewski@bisnow.com Related Topics: Climate Change , Colorado River , Cotality , First Str nswestern Mid-Atlantic Capital Markets Group, announced this week. 1420 Beverly Road, which was renovated in 2022, is fully leased, with MedStar Health occupying 85% of the property. Transwestern’s Gerry Trainor, Jim Cardellicchio and Rowan Miller represented the seller. FINANCING Photo credit: Google Maps Potomac Place Shopping Center at 10100 River Road in Potomac, Maryland. Zuckerman Gravely secured a $59.8M loan to refinance the debt on an 80K SF Potomac, Maryland, shopping center, Northmarq, which arranged the financing, announced this week. The permanent fixed-rate financing for Potomac Place Shopping Center at 10100 River Road is structured on a seven-year term. The property is anchored by Safeway, and other tenants include Walgreens, Starbucks, Chipotle, Vie de France Bakery Café, Strosnider&#039;s Hardware, M T Bank, PNC Bank, Maurizio’s, Duke’s Grocery and The Market at River Falls. The refinancing deal was led by Northmarq’s Jason Smith and Kenneth Gentzel. MILESTONES The Washington Commanders selected the contracting team to build the new 65,000-seat RFK football stadium. A joint venture between Clark Construction Group, Mortenson and Smoot Construction Co. is set to build the 1.8M SF stadium anchoring the 180-acre RFK campus, the team announced this week. Preliminary site work began in June, and construction is expected to begin in the spring of 2027, with delivery set for spring 2030. *** The new owners of the Hotel Harrington in downtown D.C. are priming the historic property for a renovation, the Washington Business Journal reported . KHP Capital Partners received a permit from D.C.’s Department of Buildings last month to begin interior demolition on the 242-room hotel, setting it up for a larger renovation. KHP Capital Partners last month paid $14.4M for the hotel at 436 11th St. NW. Continue reading this story with a free account Log","published_at":1786732736000,"score":16,"tags":["multifamily","deals","institutional"],"heat_signals":["occupancy",
