om increasing transit-oriented development to expanding mixed-density zoning , legalizing single-room occupancy and reducing minimum lot size requirements , among many othes. Removing Regulatory Barriers to Affordable Home Construction HUD Secretary Scott Turner, in a statement, framed the report as a clear starting point for states and municipalities to “take inventory of their regulations and policies and make changes that will lower the cost to build and enable more efficient housing supply growth.” For builders, the document functions as a potential list of changes that trade groups and executives can carry into conversations with governors, legislators, mayors and planning departments. HUD cited data that regulatory costs now contribute more than $100,000 to the final price of a new single-family home, and that certain state and local green energy mandates can add up to $30,000 to construction costs. It projects that deregulation measures taken in 2025 will ultimately save Americans a combined $212 billion. Since Trump took office last year, HUD said it has: Rescinded the 2021 International Energy Conservation Code Ended the Obama-Biden-era Affirmatively Furthering Fair Housing rule Rolled back rules within the Federal Housing Administration’s single-family mortgage insurance program it characterized as onerous Supported homeownership and affordability for more than 1 million Americans, including over 500,000 first-time buyers Three levers for builders: cost, land and time The HUD guidance grouped recommended actions into three categories that map directly to developers and homebuilders: reduce fees, mandates and code-driven construction expenses open more sites to residential development compress permitting and inspection timelines Across all three categories, HUD encourages jurisdictions to use technology — including e-signatures, online portals and artificial intelligence — to replace manual, paper-based processes that slow projects. In that vein, many municipalities, such as Seattle, Honolulu and Denver, are already experimenting with AI platforms that streamline permitting and plan reviews. Cost: fee caps, code limits and more flexibility on construction methods On the cost side, HUD’s recommendations line up with long-standing builder concerns. The report recommends that states and municipalities simplify and reduce fees that make new home construction more costly. The report recommends that local and state governments do the following: Cap permitting fees and eliminate impact fees that cannot be directly tied to the specific project Cut miscellaneous charges by curtailing other fees, mandates and taxes on new development and construction End unrelated offsite requirements /strong> by prohibiting mandates to build offsite infrastructure not directly connected to the project Increase fee transparency by requiring jurisdictions to publish a list of all development fees. Stop retroactive codes by barring the application of new or amended building codes to projects already in the pipeline. Limit local code add-ons by restricting state and local additions to building, environmental and labor codes, as well as ICC and federal standards, except for resilience or where they reduce costs. The report also urges local governments","published_at":1779308251000,"score":22,"tags":["housing","national","policy","construction","regulator"],"heat_signals":["fed","permits","occupancy"],"importance":4,"selector_reason":"HUD发布面向州和地方政府的住房建设去监管路线图，涉及许可、费用和建筑规范等供给端关键环节。它是重要联邦政策指引但尚非强制立法，评为imp=4。","section":"national","title_zh":"HUD催州地降费简化审批","summary_zh":"HUD roadmap指向降费、简化code和加速permit，或压低每套成本超$100,000","impact":"long-pos","id":"8087b8f1","fetched_at":1779328081719},{"source_id":"realtor-news","source_name":"Realtor.com News","source_tier":"A","source_weight":6,"source_tags":["housing"],"region":"national","title":"Despite More Listings, 77% of Homes Are Still Out of Reach for Middle-Income Earners","link":"https://www.realtor.com/news/ 50 or more single-family homes from purchasing additional single-family properties. Still, the House’s bill – which now volleys back to the Senate for reconciliation and another vote – includes significant carve-outs for build-to-rent and renovate-to-rent projects and other exemptions that were not included in the Senate’s version. How the House legislation differs from the Senate’s The House overwhelmingly approved its original version of the legislation, which included no institutional investor ban, on February 9 in a 390-9 vote. The Senate followed on March 12, passing its version 89-10. However, the Senate’s bill included a last-minute provision, Section 901, which has significantly reduced the amount of build-to-rent supply under construction. The controversial provision banned institutional investors from purchasing single-family homes. While it included narrow carve-outs for renovate-to-rent projects, it didn’t provide exemptions for build-to-rent communities. It also mandated that new BTR communities be sold to individual homeowners within seven years of completion. The House unveiled an updated version of the 21st Century ROAD to Housing Act that overhauled that section last week and released the final draft of the bill on Tuesday. Section 1001 of the updated House legislation similarly defines single-family homes as duplexes, as well as traditional detached and attached single-family properties. Manufactured housing isn’t included in the definition. The section further states that “no large institutional investor may purchase, or enter into a contract to directly or indirectly purchase, any single-family home.” To discourage those firms from buying more properties, the legislation would institute a” civil penalty in an amount that is not more than $1,000,000 per violation, or 3 times the purchase price of the property involved, whichever is greater.” However, there are exemptions to this penalty for any single-family property that is: “newly constructed, r Strupp Senior Editor Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Getty Images Listen to the article 3 min This audio is auto-generated. Please let us know if you have feedback . Dive Brief: A group of apartment owners and managers has agreed to pay a total of $218 million to resolve a 2023 class-action lawsuit , which alleges that they conspired with rivals to inflate rent prices using RealPage’s algorithmic pricing software, according to documents recently filed in federal court. Eleven defendant landlords have reached 14 class settlements, but they do not admit fault or liability, according to preliminary class-action settlements filed May 14 in the U.S. District Court for the Middle District of Tennessee, Nashville Division. The deal still requires a judge’s approval. This is the second batch of settlement agreements in RealPage Inc. Rental Software Antitrust Litigation , following the first group of 26 settlements worth more than $141.8 million in October 2025, which included a $50 million payout from Greystar. That brings the total settlement amount to date to nearly $360 million. Dive Insight: In late 2022 and early 2023, a slew of class-action lawsuits were filed against RealPage and approximately 50 of the largest apartment owners and operators, alleging that the Richardson, Texas-based software provider enabled landlords to collude to raise rent prices beyond free market levels in violation of antitrust law. In April 2023, those cases were centralized into In Re: RealPage, Inc., Rental Software Antitrust Litigation. Now Equity Residential will pay the largest amount at $56 million, while Camden and Mid-America Apartment Communities will each pay $53 million. The 14 settling defendants, and their 11 settlement terms, are: Settling defendant Amount Camden Property Trust $53 million Cortland Management, LLC $18 million Equity Residential $56 million Highmark Residential, LLC $7.5 million Lincoln Property Co. $12 million Mid
