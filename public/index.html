  <script id="initial-data" type="application/json">{"date":"2026-08-26","generated_at":1787706496872,"sources_attempted":40,"sources_ok":36,"sections":[{"id":"national","label":"全国住宅市场","emoji":"🏠","desc":"全国住宅市场、宏观利率、政策、NAR / Realtor / Zillow / Calculated Risk","quota":5,"maxPerSource":2,"extendedWindow":false},{"id":"sunbelt","label":"Sunbelt 住宅","emoji":"🌵","desc":"Sun Belt 各州住宅与租赁市场","quota":4,"maxPerSource":2,"texasCityRequired":true,"extendedWindow":true},{"id":"btr","label":"全国 BTR / SFR","emoji":"🏘","desc":"Build-to-Rent / Single-Family Rental","quota":3,"maxPerSource":2,"texasCityRequired":true,"extendedWindow":true},{"id":"cre","label":"全国 CRE","emoji":"🏢","desc":"办公 / 工业 / 数据中心 / 仓储 / 多户 / 酒店等 CRE","quota":5,"maxPerSource":2,"texasCityRequired":true,"extendedWindow":false},{"id":"institutional","label":"全国机构资本","emoji":"💰","desc":"PE / REIT 募资、并购、IPO、机构持仓","quota":3,"maxPerSource":2,"texasCityRequired":true,"extendedWindow":true}],"items":[{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"New home demand swoons even as sales prices hit a 5-year low","link":"https://www.housingwire.com/articles/new-home-demand-swoons-even-as-sales-prices-hit-a-5-year-low/","description":"Homebuilding&#8217;s Summer of 2026 race to the bottom is on. Even as new home prices fell to a five-year low, sales slowed sharply in July as builders contended with cautious buyers and growing new-home inventories in some of the nation&#8217;s critical residential construction markets. According to newly released U.S. Census Bureau data , sales of new single-family homes fell to a seasonally adjusted annual rate of 607,000 in July 2026. That reflects a drop of 10.5% from June’s 678,000 pace and 6.3% below the 648,000 level a year earlier. Just past the midpoint of the year, it&#8217;s now clear that 2026 will likely fall below last year&#8217;s underwhelming new-home benchmarks, with affordability intolerance and homebuyer risk aversion as the culprits. “The single-family home building market is on track for a second consecutive annual decline in 2026,” Robert Dietz, chief economist at the National Association of Home Builders , said in a statement. In an analysis , Zillow Senior Economist Orphe Divounguy noted that sales “are running roughly where they were before the pandemic” and that demand is “holding up better across the affordable interior and pulling back on the expensive coasts.” On a regional basis, the South continues to account for the bulk of new home sales — 62.3% in July — with the West and Midwest contributing smaller but meaningful shares and the Northeast remaining a minor part of the national total. Nationally, the median price of newly constructed homes continues to trend lower, yielding to market gravity. The median sales price of a new home in July was $393,800, down 2.3% from June and 0.9% below the July 2025 median of $397,300. This was the lowest level recorded since July 2021. Homebuyers have been grappling with both affordability constraints and hovering economic uncertainty. Elevated mortgage rates , which have ticked up since the second week of July, have compounded this pressure. As a result, builders, who overall maintain a subdued outlook , continue to leverage incentives and price discounts to offer monthly payments within buyers’ reach. This has, in turn, put pressure on closing prices. “Builders can still move homes. They’re increasingly doing it with rate buydowns, incentives and price cuts, and that reliance on support tells you where the housing market stands: demand has cooled from a [pandemic] frenzy to ordinary, and affordability remains the central constraint,” Divounguy noted. Mix shift on Sam Williamson, senior economist at First American , pointed to another factor impacting the median sales price. “Builders are not just cutting prices. They are changing what they sell. In July, 53% of new-home sales were priced below $400,000, up from 50% a year earlier. Some of that shift reflects builder discounts, but product mix is also playing an important role as builders construct and sell smaller, lower-priced homes that better fit today’s budgets,” Williamson said. Homes priced between $400,000 and $1 million fell to 42% from 46%, while homes priced at $1M or more rose to 5% from 3%, reflecting relative resilience among luxury buyers. The seasonally adjusted number of new homes for sale at the end of July rose to 488,000, up 1.9% from 479,000 in June. Compared with July 2025, inventory was down a modest 1.6% from 496,000. However, at July’s slower sales pace, that inventory represented 9.6 months of supply, up from 8.5 months in June and slightly higher than the 9.2 months recorded a year earlier. A months’ supply figure near 10 is high by historical standards and underscores that builders still face a challenging balance between available product and current demand. When spec homes sit on the market for extended periods, they tend to lose value, which ultimately impacts builders&#8217; already declining margins. “For buyers, that added supply means more options and more negotiating room, as builders remain motivated to get deals across the finish line using every tool at their disposal.","published_at":1787690560000,"score":34,"tags":["housing","national","data","homebuilder"],"heat_signals":["mortgage rate","new home sales","outlook","trend","annual","housing market","new home sales"],"importance":5,"selector_reason":"新房需求明显走弱、价格却跌到五年低点，说明供需和价格预期都在快速变化。它直接对应全国新房市场拐点，属于高重要性住宅新闻，所以给 imp=5。","section":"national","title_zh":"新房需求走弱，售价创5年低点","summary_zh":"7月新房销售年化60.7万套，环比-10.5%，价格降至5年低位，需求转弱","impact":"short-neg","id":"b417f8cf","fetched_at":1787707319596},{"source_id":"housingwire","source_name":"HousingWire","source_tier":"A","source_weight":9,"source_tags":["housing","rates","policy"],"region":"national","title":"Federal agencies scrap Biden-era SPCP guidance","link":"https://www.housingwire.com/articles/regulators-rescind-biden-era-special-purpose-credit-program-guidance/","description":"Federal housing and financial regulators on Monday formally rescinded a Biden-era interagency statement that had encouraged lenders to develop Special Purpose Credit Programs (SPCPs) aimed at expanding access to credit for historically disadvantaged groups. In a notice published in the Federal Register, the agencies said the move is intended to “make clear that (1) creditors may not discriminate against borrowers based on prohibited characteristics and (2) creditors should not rely upon the Interagency Statement or other related issuances going forward.” The rescission aims to ensure that creditors do not rely on the statement to engage in discriminatory activities that are inconsistent with the Equal Credit Opportunity Act ( ECOA ) and Regulation B and, to the extent applicable, the Fair Housing Act, the agencies said. The action is effective Tuesday. The move was made jointly by the U.S. Department of Housing and Urban Development , the Consumer Financial Protection Bureau , the Department of Justice , the Federal Deposit Insurance Corp. , the National Credit Union Administration , the Office of the Comptroller of the Currency and the Federal Housing Finance Agency . According to the notice, an earlier version of Regulation B permitted creditors to implement lending programs based on the race, color, national origin or sex of the applicant under certain circumstances, and the 2022 interagency statement and related guidance referenced that earlier version. Similarly, assurances given with respect to conformity with the Fair Housing Act were based on HUD guidance that is no longer in effect. The agencies said these prior interpretations “cannot be reconciled with the statutory text of ECOA and the FHA, which expressly prohibit discrimination against individuals based on prohibited characteristics.” They also pointed to Supreme Court precedent holding that race-based policies are subject to heightened scrutiny and that a general desire to remedy societal discrimination does not meet that standard. The agencies said enhanced standards and eligibility criteria in the revised Regulation B reflect these nondiscrimination principles and are consistent with ECOA’s text. In a separate announcement, HUD framed the rollback as a shift away from policies it said “favored one class of Americans over another,” while emphasizing that creditors “were never permitted to discriminate against borrowers based on protected characteristics.” The department linked the action to President Donald Trump’s executive orders directing federal agencies to unwind diversity, equity and inclusion initiatives and review subregulatory guidance. “No regulation or interagency statement fixated on the Biden administration’s DEI commitments can defeat the Fair Housing Act’s categorical prohibition against discriminating on the basis of race and color in any residential real estate-related transaction,” Craig Trainor, HUD&#8217;s assistant secretary for fair housing and equal opportunity, said in a statement. Harmeet Dhillon, the DOJ&#8217;s assistant attorney general for civil rights, said it is “illegal to favor individuals for housing benefits, mortgage loans, or any credit programs based on protected characteristics like race.” She added that the department will “enforce the law to ensure widespread discrimination caused by ‘equity’ efforts is relegated to the history books alongside Jim Crow and other historical systems of discrimination.” Related More: CFPB Discrimination HUD Regulatory Compliance","published_at":1787684939000,"score":17,"tags":["policy","regulator"],"heat_signals":["fed"],"importance":5,"selector_reason":"联邦机构撤回拜登时期的 SPCP 指导，属于住房金融监管的重要政策变化。它会影响贷款合规、信贷可得性和机构放贷策略，因此给 imp=5。","section":"national","title_zh":"联邦机构撤销Biden时代SPCP指引","summary_zh":"HUD、CFPB等撤回SPCP联合指引，限制按种族等设定信贷项目","impact":"neutral","id":"69c6b864","fetched_at":1787707319596},{"source_id":"multifamily-dive","source_name":"Multifamily Dive","source_tier":"A","source_weight":9,"source_tags":["multifamily"],"region":"national","title":"Multifamily new supply set to bottom out in 2027","link":"https://www.multifamilydive.com/news/multifamily-new-supply-deliveries-bottom-2027/828744/","description":"An article from Dive Brief Multifamily new supply set to bottom out in 2027 Yardi Matrix’s third-quarter Multifamily Supply Forecast anticipates a modest rebound in apartment deliveries after 2027, but a return to the high levels of 2024 and 2025 is unlikely. Published Aug. 25, 2026 Julie Strupp Senior Editor Share Copy link Email LinkedIn X/Twitter Facebook Print License Add us on Google Tim Boyle via Getty Images Listen to the article 3 min This audio is auto-generated. Please let us know if you have feedback . Dive Brief: New multifamily supply is set to bottom out in 2027 at around 444,343 units as the number of units under construction and in pre-lease continues to decline, according to Yardi Matrix’s third-quarter Multifamily Supply Forecast. After that, Yardi anticipates that new apartment supply will “expand only marginally” by 2031. Through mid-2026, multifamily starts ran slightly ahead of the 2024 and 2025 pace, suggesting deliveries in 2028 will be modestly higher than in 2027, per Yardi. Multifamily starts saw an unusually steep decline in May , according to HUD and U.S. Census Bureau data, but starts in buildings with five or more units have since risen. Yardi upped its forecasted completions for 2026 by 2.5% from Q1, but its predictions for subsequent years remain essentially the same. A return to the high levels of new apartment supply seen in 2024 and 2025 is “highly unlikely,” and a sharp decline is just as improbable, per Yardi. Dive Insight: Yardi’s near-term forecast assumes that the economic backdrop remains largely unchanged, with solid growth supporting rental demand. Higher long-term interest rates will limit new apartment development and also “continue to constrain activity in the single-family housing market,” per Yardi. That means some would-be homebuyers will continue to rent, serving as an additional source of multifamily demand. “The Iran War and tariff policy combined keep inflation modestly elevated; as a result, a reduction in either short- or longer-term interest rates seems unlikely,” according to Yardi. Despite the overall slowdown from recent years, 21 of Yardi Matrix’s markets still have more than 8% of their housing inventory under construction, with the southwest Florida coast seeing the highest percentage at over 15%. Supply will remain “problematic” in those areas over the next year and a half, per Yardi. Looking ahead, the recently passed 21st Century ROAD to Housing law “provides ample supply-side incentives for multifamily investment and new development,” according to Yardi. Optional Caption Courtesy of Yardi Matrix The composition of new multifamily supply has been changing, and affordable and partially affordable multifamily projects will continue to make up a larger percentage of the new development mix in coming years. In 2027, Yardi expects a 22% increase over 2020 levels in partially affordable units and a 44% increase in fully affordable apartments. At the same time, new market-rate apartment supply will fall 11% in 2027 compared to 2020. After increasing significantly starting in 2023, single-family rental starts noticeably fell in the second half of 2025 and remained depressed to start 2026. That slowdown suggests there will be significantly fewer SFR completions in 2027 and 2028, according to Yardi. Click here to sign up to receive multifamily and apartment news like this article in your inbox every weekday. Recommended Reading Multifamily starts tumbled in July By Julie Strupp &#8226; Aug. 18, 2026 Add us on Google Share Copy link Email LinkedIn X/Twitter Facebook Print License Filed Under: Development","published_at":1787683440000,"score":31,"tags":["multifamily","trend","data"],"heat_signals":[" sfr","single-family rental","inflation","forecast","housing market"],"importance":4,"selector_reason":"这条给出多户供应在 2027 年见底的中期预测，影响公寓租金、空置率和开发节奏。它是全国 multifamily 的结构性判断，但还不是当下政策或数据冲击，所以给 imp=4。","section":"national","title_zh":"multifamily新供给或于2027见底","summary_zh":"Yardi预计2027年公寓交付约44.4万套见底，之后仅小幅回升","impact":"long-pos","id":"e56b5f94","fetched_at":1787707319596},{"source_id":"logan-mohtashami","source_name":"Logan Mohtashami (HousingWire)","source_tier":"B","source_weight":9,"source_tags":["rates","trend"],"region":"national","title":"New home sales slipped again. Why builders are still holding back","link":"https://www.housingwire.com/articles/new-home-sales-slipped-again-why-builders-are-still-holding-back/","description":"Today, new home sales came in as a miss to estimates, down 10.5% month to month. This isn’t shocking considering where mortgage rates are, but today’s data shows why the builders&#8217; caution in issuing new housing permits is warranted. New home sales have been in a steady sales range for 10 years now, if I exclude the COVID-19 burst in sales. So, new home sales aren’t collapsing in a big way, but sales can’t seem to break above or below this range. As mortgage rates stay elevated, the outlook for more housing construction looks grim. From Census : New Home Sales: Sales of new single-family houses in July 2026 were at a seasonally adjusted annual rate of 607,000, according to estimates released jointly today by the U.S. Census Bureau and the Department of Housing and Urban Development. This is 10.5 percent (±14.0 percent)* below the June 2026 rate of 678,000, and is 6.3 percent (±19.6 percent)* below the July 2025 rate of 648,000. It&#8217;s remarkable how steady this channel of new home sales has been for so many years, especially considering that the new home sales market has been boosted for years by builders paying down rates to below 6% — a luxury the existing home sales market doesn&#8217;t have. This helps explain why new home sales are still around 2019 levels. If existing home sales were at that level, it would amount to 1 million more existing home sales than today&#8217;s levels. As builders’ profit margins fall, it’s going to be harder and harder for builders to buy down rates, and as mortgage rates rise, it will cost them more to do this. As we can see in the data below, the builders are not confident enough to grow housing permits currently. I recently wrote this article where I used multiple data lines to show that we don’t have a housing shortage anymore. One positive sign The one positive data line in this report is that, for now, completed units for sale have peaked, and builders are starting to work this number down. With less housing construction happening, this gives them more time to work down their supply and then feel better in the future when demand does pick up and they are issuing more housing permits. Typically, builders pull back on construction when the completed units for sale go over 120,000. Below is the historical data going back decades, which shows the completed units for sale in January of every year, ending in 2025. Today we are at 117,000 completed units for sale. Conclusion This report shows more of the same for the new home sales marketplace, housing construction and where construction is going. My concern is that builders&#8217; profit margins will continue to dwindle as rates stay elevated and they will be forced to cut construction and residential construction workers even more than what we see today. In this episode of the HousingWire Daily podcast , I talk with Editor in Chief Sarah Wheeler about what can and can’t be done by the government to lower mortgage rates and stimulate more housing construction. Until then, don’t expect a housing construction boom anytime soon, folks. Related More: Homebuilders New Home Sales","published_at":1787683439000,"score":30,"tags":["housing","national","data","rates"],"heat_signals":["mortgage rate","existing home sales","new home sales","permits","outlook","annual","new home sales"],"importance":4,"selector_reason":"新房销售再度下滑，说明高利率环境继续压制成交和开工决策。它是全国住宅市场的持续性信号，但单条数据不如政策或重大指数那样系统性，所以给 imp=4。","section":"national","title_zh":"新房销售再滑，builders仍谨慎","summary_zh":"7月新房销售跌至60.7万套，mortgage rate高位压制开工与利润","impact":"short-neg","id":"ddf165b6","fetched_at":1787707319596},{"source_id":"realtor-research","source_name":"Realtor.com Research","source_tier":"B","source_weight":8,"source_tags":["housing","data"],"region":"national","title":"New Home Sales Rebound in June but Fall Short Year over Year","link":"https://www.realtor.com/research/new-home-sales-july-2026/","description":"Economic Coverage , Housing Supply , New Home Sales New Home Sales Rebound in June but Fall Short Year over Year By Joel Berner Aug 25, 2026 July 2026 New-Home Sales What happened this month New home sales fell on both a month-over-month (-10.5%) and year-over-year (-6.3%) basis in July, to a seasonally adjusted annual rate of 607,000, the lowest since January. Builders have struggled to sell new homes in 2026 and the July median sales price reflects this, falling to $393,800, which represents a 2.3% decrease from June and a 0.9% decrease from last July. Once again, the new home median price is well below the median price of existing homes sold in July, due to mix effects of where new and existing homes are located as well as to relative softness in the new home segment. Builders are struggling to find buyers as affordability concerns keep many families in place for the time being. The bright spot for new home sales is in the Northeast, where the seasonally adjusted annual rate of new homes sold was at its highest level of 2026, up 30.3% month over month and up 95.5% year over year, though wide confidence intervals force us to take these results with a grain of salt. The West rebounded slightly, up 6.2% month over month and up 2.2% year over year. The South, home to the largest share of new home sales, struggled, with sales falling 13.0% month over month and 5.2% year over year. The Midwest had an extremely weak July, down 42.7% month over month and down 50.6% year over year. In fact, the seasonally adjusted annual rate of new home sales for the Midwest matched the Northeast this month, which is quite unusual as the Midwest normally far exceeds the Northeast in terms of new home sales. More new homes are on the market The number of new homes for sale rose to its highest level since October 2025 as the pace of sales slowed, though most of the growth came from homes for sale that have not yet been started. The number of completed homes rose slightly from June’s levels but remains below last July. The softening of new home sales activity is dissuading builders from completing as many homes that do not have buyers lined up, and they prefer instead to sell more homes in the planning stage. What does this mean for buyers and builders? The new home market is firmly in buyers’ territory, with the months of supply growing to 9.6 in July. New home shoppers are likely to find low prices and incentives if they decide to buy new, and can take advantage of a lower total cost of ownership over time. It’s a great time to be buying a newly-built home, it’s a tougher time to be building and selling them. Builders are facing increased costs from tariffs, labor shortages, and overall price increases at the same time that buyers are proving to be quite wary and quite demanding of concessions. This is why we see new home starts falling, as builder margins are being compressed from both sides.","published_at":1787671465000,"score":26,"tags":["housing","national","data","homebuilder"],"heat_signals":["new home sales","annual","year over year","year-over-year","new home sales"],"importance":4,"selector_reason":"这条同样是全国新房销售数据，能直接验证楼市需求是否回暖失败。它属于重要的月度住宅行情，但和更重磅的指数或政策相比略低一级，所以给 imp=4。","section":"national","title_zh":"7月新房销售回落，价格降至39.38万","summ cago Office at 333 W. Wacker Drive Nuveen Green Capital , an affiliate of global asset manager Nuveen, has locked in its largest sum yet for its green financing fund. Nuveen CPACE Lending Fund IV closed its fourth round with more than $1B in capital commitments, it announced Tuesday. With the new infusion, the fund, which was launched in 2023 and does yearly raises, has brought in more than $3B. Contributors include Nuveen’s parent company, the Teachers Insurance and Annuity Association of America, and insurance companies. Commercial property assessed clean energy loans, or C-PACE loans, provide financing to environmentally friendly projects. The loans are deployed at a state level and offer fixed-rate, long-term loans that can be used for sustainability and energy-efficiency upgrades, refinancing, climate resilience and ground-up construction projects. About 60% of Nuveen&#039;s C-PACE loans go toward new construction projects. The other 40% is deployed into recapitalization deals. One of the goals for Nuveen&#039;s fund is to fill a financing gap that traditional bank lenders like Bank OZK have left as they reduce commercial real estate exposure. The bank is known for being one of the biggest construction lenders but has reversed course in recent quarters to reduce losses on CRE projects . C-PACE momentum has accelerated over the past couple of years. What was once a niche program has become a preferred source of funding with favorable terms for large-scale developments. A record $3.7B in C-PACE financing was deployed in 2025, a 53% year-over-year surge, according to nonprofit PACENation . Last year’s volume is roughly a quarter of all C-PACE originations since the program’s founding in 2009. Nuveen’s track record illustrates the increased interest. In addition to the $1B fundraise being its biggest close yet, NGC closed on $1.4B in capital commitments last year. In contrast, it closed on $75M in 2017. “So that shows the increased institutional investor demand, which also enables us to go to market with attractive financing for these institutional borrowers,” NGC CEO Ali Cooley told Bisnow in February . Last year, Nuveen Green Capital closed $2.1B in loan originations, nearly double its $1.2B volume the year before. One newer recipient of NGC’s fund is a 691-foot mixed-use tower in Boston. Last week, the tower’s owner, Millennium Partners, received a shiny new $281M loan from Nuveen Green Capital through Massachusetts’ version of the C-PACE program, the largest-ever loan of its kind in New England. Continue reading this story with a free account Log in or register Contact Kayla Carmicheal at kayla.carmicheal@bisnow.com Related Topics: C-PACE , Nuveen , Nuveen Green Capital , TIAA","published_at":1787687855000,"score":21,"tags":["fundraising","institutional"],"heat_signals":["nuveen","year-over-year"],"importance":5,"selector_reason":"Nuveen 的 C-PACE 基金募资超过 10 亿美元，属于明显的大型机构资本动作。金额级别和平台意义都很强，对绿色融资和 CRE 资本市场都有系统性影响，所以给 imp=5。","section":"institutional","title_zh":"Nuveen C-PACE Fund再募超10亿美元","summary_zh":"Nuveen C-PACE Fund IV第四轮募资超10亿，累计已超30亿，支持绿色融资","impact":"long-pos","id":"a3545b48","fetched_at":1787707319596},{"source_id":"cnbc-realestate","source_name":"CNBC Realty Check","source_tier":"A","source_weight":6,"source_tags":["macro"],"region":"national","title":"Investor competition for commercial real estate sees strongest growth in a year","link":"https://www.cnbc.com/2026/08/25/cre-investor-competition-sees-strongest-growth-in-a-year.html","description":"Even though macro uncertainty and volatility continue to show up in the broader economy, bidding keeps rising, according to JLL.","published_at":1787690691000,"score":12,"tags":["deals","trend","institutional"],"heat_signals":[],"importance":4,"selector_reason":"CRE 投资人竞争升温，说明资本重新回到商业地产竞价场。它反映全国机构资金和交易景气回升，属于重要资本市场信号，所以给 imp=4。","section":"institutional","title_zh":"CRE投资竞争创近一年最强","summary_zh":"JLL称宏观波动下竞标热度上升，商业地产投资者竞争达一年高点","impact":"long-pos","id":"ee2c8114","fetched_a
