r for Affordable Housing Lending found. Housing advocates cheered when the legislation became law last month , albeit without a presidential signature. The bipartisan legislation promises sweeping regulatory reforms and funding incentives designed to increase housing development that experts say the nation sorely needs . Of the 124 implementation actions detailed in the bill , HUD is responsible for 88, or 71%, according to the study. Congress will need to appropriate funding for the programs the law establishes. That means reports are required — lots of them. Within the first year of the law’s enactment, Congress directed agencies to achieve 58 of the 124 actions, or 47%, according to the analysis. Of those actions, 60% are reports. “While reports may seem like a lighter administrative undertaking relative to rulemakings, many of the reports in the bill involve more intensive data collection and analysis and disproportionately land in HUD’s Office of Policy Development and Research, which has 27% fewer staff than it did in FY25,” the analysis states. HUD has shed a significant number of staff compared with last year, according to the analysis, and its ability to take on the heavier workload will be “strained,” the analysis states. ROAD adds nine rules for HUD to implement. During the previous administration, HUD completed four major rules per year, per the analysis. It currently has a backlog of 54. “At HUD's recent pace, finalizing all nine of these rules would be several years’ worth of work, assuming HUD paused all other rulemaking and prioritized the rules in 21st Century ROAD – and that still understates the lift,” states the analysis. A HUD spokesperson told Smart Cities Dive in an email that the agency “has the organizational capability to satisfy and meet all of its obligations under the law.” In the meantime, local governments can begin assessing what regulatory changes — such as updating zoning, building codes and permitting policies — they will need to enact to take advantage of federal funding once it becomes attainable, according to The Pew Charitable Trusts. “Since many of the legislation's intended reforms ultimately depend on actions taken outside of Washington, early planning and engagement will be critical to translating those reforms into additional housing supply and improved affordability,” the NAAHL and CAHL state in their report. Recommended Reading Local government staffing shortages threaten housing development, experts say Smart Cities Dive Add us on Google Share Copy link Email LinkedIn X/Twitter Facebook Print License Filed Under: Regulation","published_at":1786396320000,"score":17,"tags":["national","policy","regulator"],"heat_signals":["fed"],"importance":4,"selector_reason":"ROAD to Housing Act实施效果和HUD执行能力关系到地方住房供给政策落地节奏。联邦住房政策具有全国影响，但报道聚焦执行滞后分析，因此评为imp=4。","section":"national","title_zh":"ROAD to Housing 落地或需数年","summary_zh":"HUD 负责 124项行动中 88项，减员下执行偏慢，供给改善滞后","impact":"long-pos","id":"0105777a","fetched_at":1786415855918},{"source_id":"rebusiness-online","source_name":"REBusiness Online","source_tier":"A","source_weight":6,"source_tags":["mixed-asset","deals"],"region":"national","title":"Newmark Arranges $52M Loan for Refinancing of Metro Houston Multifamily Property","link":"https://rebusinessonline.com/newmark-arranges-52m-loan-for-refinancing-of-metro-houston-multifamily-property/","description":"CYPRESS, TEXAS — Newmark has arranged a $52 million loan for the refinancing of Cantera at Towne Lake, a 366-unit multifamily property in the northwestern Houston metro of Cypress. Built in 2008 within the Towne Lake master-planned community, the property offers one-, two- and three-bedroom units and amenities such as two pools, a fitness center, conference center and outdoor grilling and dining stations. Vince Punzi and Lowell Takahashi of Newmark arranged the loan on behalf of the borrower, California-based owner-operator The Bascom Group, which will use a portion ($4.4 million) of the proce","p oject in July 2024. Carlo Santarelli, senior vice president at Gaming and Leisure Properties, said on the company&#039;s 2026 second-quarter earnings call on July 31 — before Bally&#039;s partial work stoppage — that the potential impact from VGTs was baked into the deal. &#34;Clearly, Bally&#039;s is going through some things right now with the city as it relates to how this impacts some of the agreements that they&#039;ve previously come to,&#34; Santarelli said. &#34;But in our view, the VGT concept was included in our underwriting.&#34; Bally&#039;s stated that it did not take the decision lightly, given the potential impact on many of the 1,500 union tradespeople working on the project. &#34;We will continue to assess our options, which we hope will include more productive discussions with the Mayor’s Office and City Council,&#34; Bally&#039;s stated. Continue reading this story with a free account Log in or register Contact Ryan Wangman at ryan.wangman@bisnow.com Related Topics: Bally&#039;s , Bally&#039;s Chicago , Carlo Santarelli , Gaming and Leisure Properties","published_at":1786398350000,"score":14,"tags":["hotel","construction","developer"],"heat_signals":[],"importance":4,"selector_reason":"Bally's因与芝加哥市政府围绕博彩终端立法争议，暂停赌场和酒店综合体大部分施工。大型城市娱乐地产项目停工且与监管冲突相关，因此评为imp=4。","section":"cre","title_zh":"Bally's 暂停 Chicago casino 部分施工","summary_zh":"酒店与餐饮部分停工，VGT 争议增加项目不确定性，2027 开业仍称不变","impact":"short-neg","id":"1ce0a3e3","fetched_at":1786415855918,"cre_subcategory":null},{"source_id":"bisnow","source_name":"Bisnow","source_tier":"A","source_weight":8,"source_tags":["mixed-asset","deals"],"region":"national","title":"Ryman Hospitality To Pay $1.4B For Orlando Resort Complex","link":"https://www.bisnow.com/news/national/hotel/ryman-hospitality-grande-lakes-orlando-elliot-trinity-investments","description":"Trinity Investments and Elliott Investment Management pocketed a nine-figure gain in their eight-year ownership of the property.","published_at":1786385477000,"s elopments in Chicago set it apart from other developers that may not be as willing or able to take risks in the market. The company announced in early August that it was starting leasing at 400 Lake Shore Drive , its 72-story multifamily property on the site of the scuttled Spire project along the lakefront. The development is one of the largest new multifamily properties slated to open in recent years. When it is complete, which is expected to be in March 2027, it will add 635 apartments to a multifamily pipeline at historical lows. “400 Lake Shore Drive stands where Chicago itself began, at the very point where the river meets the lake and Jean-Baptiste Point DuSable first put down roots,” Related Midwest President Curt Bailey said in a release. “This is more than a residential tower; it is a revitalization of a significant piece of land in Chicago’s history.” The developer’s sweep also includes the 128-acre Illinois Quantum and Microelectronics Park at the former U.S. Steel Works Site, a major bet on emerging technology backed by the city and Gov. JB Pritzker in hopes of establishing the area as a hub for the sector. Related and CRG broke ground on the project in October. State lawmakers allocated $500M to boost the park’s development when it launched in 2024 alongside anchor tenant PsiQuantum . Some of the top companies in the industry have inked deals at the site since then, including Pasqal, IBM and Diraq . “You need very talented people that understand each asset class, or just unbelievable people that can understand this works for office and this works for multifamily and this works for stadium and this works for science, that 95% of the population can&#039;t understand,” Stone Real Estate principal John Vance said. Related also landed Sidley Austin as an anchor tenant for the city’s first major trophy office tower since Salesforce Tower broke ground in April 2020. The law firm committed to “more than half” of the 1M SF high-rise and is expected to move int"
